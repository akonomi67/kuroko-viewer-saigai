<script>
const D={"name": "ep011", "file": "ep011", "dur": 1905.2833125, "segs": [], "subs": [{"t": 0.0, "x": "月の石と、地球の石。二つを並べて、中に含まれる"}, {"t": 4.45, "x": "酸素を、ごく細かく量ってみます。"}, {"t": 7.0, "x": "酸素には、重さのわずかに違う三つの種類があります。"}, {"t": 10.95, "x": "その混ざり具合は、星ごとに"}, {"t": 13.083333333333334, "x": "少しずつ違うと考えられています。"}, {"t": 15.316666666666666, "x": "ところが、月の石と地球の石では、"}, {"t": 17.966666666666665, "x": "その違いがほとんど出てきません。"}, {"t": 20.233333333333334, "x": "百万あたり数個という細かさで比べても、"}, {"t": 23.016666666666666, "x": "見分けるのが難しいほどです。"}, {"t": 25.233333333333334, "x": "月と地球は、ほとんど同じ材料でできている。"}, {"t": 28.483333333333334, "x": "少なくとも、そう見えるほど似ています。"}, {"t": 31.233333333333334, "x": "この似かたが、はるか昔の、ひとつの"}, {"t": 34.03333333333333, "x": "出来事を指していると考えられています。"}, {"t": 36.43333333333333, "x": "いまからおよそ45億年前。"}, {"t": 37.916666666666664, "x": "45億年前█"}, {"t": 39.2, "x": "生まれたばかりの地球に、火星ほどの"}, {"t": 41.75, "x": "大きさの星がぶつかった。その衝撃で、"}, {"t": 44.71666666666667, "x": "地球の核を包む岩の層は、ほとんどが溶けた。"}, {"t": 48.18333333333333, "x": "飛び散ったものが地球のまわりを"}, {"t": 50.083333333333336, "x": "回りはじめ、やがて集まって、月になった。"}, {"t": 53.53333333333333, "x": "ジャイアント・インパクト説█"}, {"t": 53.53333333333333, "x": "ジャイアント・インパクト説と呼ばれる考え方です。"}, {"t": 57.233333333333334, "x": "いまでは、月のでき方を説明する"}, {"t": 59.71666666666667, "x": "中心の考えとされています。"}, {"t": 61.68333333333333, "x": "ただし、ぶつかった星の大きさ、ぶつかり方、"}, {"t": 65.35, "x": "そして時期については、答えが割れています。"}, {"t": 68.58333333333333, "x": "しかも、月と地球が似すぎていることは、"}, {"t": 71.35, "x": "この説を支える証拠であると同時に、"}, {"t": 74.03333333333333, "x": "この説を悩ませる謎にもなっています。"}, {"t": 76.71666666666667, "x": "地球の歴史の中で、これより"}, {"t": 78.95, "x": "大きな衝突は知られていません。"}, {"t": 81.0, "x": "恐竜の時代の終わりに落ちた天体とは、ぶつかった相手の"}, {"t": 84.81666666666666, "x": "大きさも、起きたことの規模も、まるで違います。"}, {"t": 88.28333333333333, "x": "こちらは、地面に穴があいた話ではなく、"}, {"t": 91.3, "x": "星の体そのものが溶け、形を変えた話です。"}, {"t": 95.2, "x": "この回は、月の石に残った手がかりを、"}, {"t": 98.08333333333333, "x": "見つかった順にたどります。"}, {"t": 100.01666666666667, "x": "ぶつかった瞬間を見た人は、もちろんいません。"}, {"t": 103.28333333333333, "x": "残っているのは、石の中の原子の比率と、"}, {"t": 106.35, "x": "コンピューターの中で繰り返された衝突の計算です。"}, {"t": 109.96666666666667, "x": "その二つが、どこで合い、どこで食い違っているのか。"}, {"t": 113.86666666666666, "x": "月はどこから来たのか。この問いは、"}, {"t": 116.41666666666667, "x": "ずっと昔から天文学者を悩ませてきました。"}, {"t": 119.43333333333334, "x": "二十世紀の半ばまでに、答えの"}, {"t": 121.86666666666666, "x": "候補は大きく三つにしぼられていました。一つ目は、"}, {"t": 125.53333333333333, "x": "分裂説です。生まれたばかりの地球が、ものすごい速さで"}, {"t": 129.5, "x": "回っていて、その勢いで体の一部がちぎれ、"}, {"t": 132.78333333333333, "x": "月になったという考えです。二つ目は、捕獲説です。"}, {"t": 136.95, "x": "月は太陽系のどこか別の場所で生まれ、"}, {"t": 139.55, "x": "たまたま地球のそばを通ったときに、"}, {"t": 142.11666666666667, "x": "地球の引力につかまったという考えです。"}, {"t": 145.1, "x": "三つ目は、同時にできたという説です。"}, {"t": 147.85, "x": "地球と月は、同じ場所で、同じ材料から、並んで"}, {"t": 152.23333333333332, "x": "生まれた兄弟のような星だという考えです。"}, {"t": 154.86666666666667, "x": "どの説にも、それらしい理屈がありました。"}, {"t": 157.86666666666667, "x": "そして、どの説にも、うまく説明できない点がありました。"}, {"t": 162.23333333333332, "x": "この問いに、実物を手にして"}, {"t": 164.53333333333333, "x": "答えられるようになったのは、1969年からです。"}, {"t": 167.2, "x": "1969年█"}, {"t": 169.03333333333333, "x": "アメリカのアポロ計画です。"}, {"t": 170.86666666666667, "x": "1969年から1972年までの三年あまりのあいだに、"}, {"t": 175.98333333333332, "x": "六回の着陸で、月の岩や砂が地球に運ばれました。"}, {"t": 180.33333333333334, "x": "NASAの資料では、その量は三百八十二キログラム。"}, {"t": 184.23333333333332, "x": "数えると、およそ二千二百の試料になります。"}, {"t": 187.51666666666668, "x": "六か所の、違う場所から集められたものです。"}, {"t": 190.73333333333332, "x": "もし月が地球からちぎれたのなら、月の"}, {"t": 193.55, "x": "石は地球の石とそっくりになるはずです。"}, {"t": 196.08333333333334, "x": "もし月がよそから来たのなら、"}, {"t": 197.86666666666667, "x": "どこかに違いが出るはずです。"}, {"t": 199.91666666666666, "x": "もし並んで生まれたのなら、"}, {"t": 201.5, "x": "鉄の量も地球と似ているはずです。"}, {"t": 204.08333333333334, "x": "石を調べれば、三つのうちどれが正しいか、決着がつく。"}, {"t": 208.55, "x": "そう期待することもできました。"}, {"t": 210.4, "x": "この石が、三つの説を次々に追いつめていきました。"}, {"t": 214.23333333333332, "x": "分裂説は、地球をそこまで速く回すことも、"}, {"t": 217.71666666666667, "x": "ちぎれたあとの動きを説明することも難しい。"}, {"t": 220.93333333333334, "x": "捕獲説は、よそで生まれたはずの月の石が、"}, {"t": 224.13333333333333, "x": "地球の石と似すぎていることを説明できない。"}, {"t": 227.15, "x": "同時にできた説は、月にだけ"}, {"t": 229.26666666666668, "x": "鉄が少ないことを説明できない。"}, {"t": 231.31666666666666, "x": "のちに、この分野の研究者は、"}, {"t": 233.76666666666668, "x": "三つの説について、こうまとめています。"}, {"t": 236.88333333333333, "x": "どれも、ぶつかるという出来事に、"}, {"t": 239.2, "x": "大きな役割を与えていなかった、と。"}, {"t": 242.38333333333333, "x": "実は、ぶつかることで星が溶けるという"}, {"t": 245.06666666666666, "x": "話そのものは、ずっと前からありました。"}, {"t": 247.88333333333333, "x": "1871年、イギリスの物理学者ケルビン卿、当時の"}, {"t": 252.98333333333332, "x": "ウィリアム・トムソンは、演説の中でこう述べています。"}, {"t": 256.43333333333334, "x": "二つの大きな塊が宇宙でぶつかれば、"}, {"t": 259.0, "x": "それぞれの大部分が溶けることは確かだ。"}, {"t": 261.81666666666666, "x": "ただ、彼はそれを、月のでき方と結びつけて"}, {"t": 265.3, "x": "論じたわけではありませんでした。"}, {"t": 267.15, "x": "月の石と、ぶつかるという考え。"}, {"t": 269.75, "x": "この二つが結びつくまでには、まだ時間がかかります。"}, {"t": 273.35, "x": "その前に、月の石は、もう一つ"}, {"t": 276.21666666666664, "x": "大事なことを語りはじめていました。"}, {"t": 278.25, "x": "月は、生まれたときに、一度"}, {"t": 280.81666666666666, "x": "溶けていたらしい、ということです。"}, {"t": 283.1166666666667, "x": "アポロ11号が持ち帰った砂の中に、"}, {"t": 285.7, "x": "少し変わったかけらが混じっていました。"}, {"t": 288.25, "x": "着陸したのは、「静かの海」と"}, {"t": 291.03333333333336, "x": "呼ばれる、黒っぽい平原です。"}, {"t": 293.31666666666666, "x": "そこに転がっている岩の多くは、黒い玄武岩でした。"}, {"t": 297.1, "x": "溶岩が冷えて固まった岩です。"}, {"t": 299.3, "x": "ところが、ふるいにかけた細かいかけらを一つずつ"}, {"t": 302.4, "x": "調べていくと、白っぽい粒が見つかりました。"}, {"t": 305.45, "x": "1970年█"}, {"t": 305.45, "x": "1970年に発表された研究では、調べた千六百七十六個の"}, {"t": 311.25, "x": "かけらのうち、六十一個がこの白い"}, {"t": 314.18333333333334, "x": "岩でした。斜長岩と呼ばれる岩です。"}, {"t": 314.8333333333333, "x": "斜長岩█"}, {"t": 317.3, "x": "斜長岩は、色も、成分も、重さも、"}, {"t": 321.03333333333336, "x": "まわりの玄武岩とはっきり違っていました。"}, {"t": 323.93333333333334, "x": "軽くて、白い。研究者たちは、この岩は着陸した"}, {"t": 328.15, "x": "平原のものではないと考えました。"}, {"t": 330.31666666666666, "x": "月の表面の、白く明るく見える高地から、"}, {"t": 333.56666666666666, "x": "隕石の衝突で飛ばされてきたかけらではないか。"}, {"t": 336.75, "x": "そして、一つのしくみを提案しました。"}, {"t": 339.6166666666667, "x": "月の表面は、かつて全体がどろどろに溶けていた。"}, {"t": 343.21666666666664, "x": "その溶けた岩が冷えていくとき、軽い"}, {"t": 345.8333333333333, "x": "鉱物がうえに浮かび、重い鉱物が下に沈んだ。"}, {"t": 349.3833333333333, "x": "浮かんだ軽い鉱物が集まって"}, {"t": 351.18333333333334, "x": "固まったのが、白い高地の岩、斜長岩だ。"}, {"t": 354.68333333333334, "x": "この論文は、斜長岩の皮の厚さを、"}, {"t": 357.6166666666667, "x": "二十五キロメートルほどと見積もっています。"}, {"t": 360.5, "x": "のちに、この考えはマグマの"}, {"t": 362.0833333333333, "x": "マグマの海█"}, {"t": 363.26666666666665, "x": "海と呼ばれるようになりました。"}, {"t": 365.4166666666667, "x": "月の表面を、溶けた岩が海のように"}, {"t": 368.23333333333335, "x": "覆っていたという意味です。"}, {"t": 369.68333333333334, "x": "NASAは、この海の深さについて、"}, {"t": 372.05, "x": "数百キロメートルから数千キロメートルまで、"}, {"t": 375.18333333333334, "x": "さまざまな見積もりがあると説明しています。"}, {"t": 378.1666666666667, "x": "2016年にまとめられた総説では、月のでき方を"}, {"t": 381.8333333333333, "x": "説明する説が満たすべき条件の一つとして、"}, {"t": 384.75, "x": "最初の厚さ二百から三百キロメートルほどの"}, {"t": 387.8666666666667, "x": "マグマの海、が挙げられています。"}, {"t": 390.18333333333334, "x": "月の重力を精密に測った探査機の結果からは、"}, {"t": 393.48333333333335, "x": "月の皮の厚さはおよそ三十四から"}, {"t": 396.18333333333334, "x": "四十三キロメートルと見積もられています。"}, {"t": 398.68333333333334, "x": "ここで大事なのは、この溶けた海が何を意味するかです。"}, {"t": 402.35, "x": "月ほどの大きさの星を、表面から数百キロメートルの"}, {"t": 406.28333333333336, "x": "深さまで溶かすには、大量の熱がいります。"}, {"t": 409.31666666666666, "x": "ゆっくり、少しずつ材料が集まって生まれた"}, {"t": 412.4166666666667, "x": "星では、熱が逃げてしまい、そこまで溶けにくい。"}, {"t": 415.93333333333334, "x": "逆に、短いあいだに一気に集まれば、"}, {"t": 418.9, "x": "熱が逃げる暇がありません。"}, {"t": 420.9, "x": "月は、ごく短い時間で、激しく生まれたのではないか。"}, {"t": 425.0833333333333, "x": "白い石のかけらは、そう語っているように見えました。"}, {"t": 428.68333333333334, "x": "ただし、この見方にも、のちに疑いが出てきます。"}, {"t": 432.55, "x": "白い石の年代が、思っていたよりも"}, {"t": 435.26666666666665, "x": "若く出た例があるからです。"}, {"t": 436.95, "x": "その話は、あとで改めて見ます。"}, {"t": 439.6666666666667, "x": "次に見るのは、月の石がもう一つ突きつけた問題です。"}, {"t": 443.5, "x": "月には、鉄が足りないのです。"}, {"t": 445.78333333333336, "x": "星の重さを大きさで割ると、平均の密度が出ます。"}, {"t": 449.53333333333336, "x": "NASAの資料によると、地球の平均密度は、"}, {"t": 452.7, "x": "一立方メートルあたり五千五百十四キログラム。"}, {"t": 456.25, "x": "月は、三千三百四十四キログラムです。"}, {"t": 459.7, "x": "月は、地球のおよそ六割の密度しかありません。"}, {"t": 463.23333333333335, "x": "地球が重いのは、真ん中に大きな鉄の"}, {"t": 466.0833333333333, "x": "核を持っているからです。地球全体の重さのうち、鉄が"}, {"t": 470.1333333333333, "x": "占める割合は三割あまりとされます。"}, {"t": 472.5, "x": "月の場合、その割合は八から"}, {"t": 475.0, "x": "十パーセントほどと見積もられています。"}, {"t": 477.21666666666664, "x": "アポロの宇宙飛行士たちは、"}, {"t": 478.9166666666667, "x": "月面に地震計を置いてきました。"}, {"t": 481.31666666666666, "x": "その記録を読み直した研究では、月の鉄の核の半径は、"}, {"t": 485.56666666666666, "x": "三百二十五キロメートルほどとされています。"}, {"t": 488.56666666666666, "x": "月の半径は、千七百三十七キロメートル。"}, {"t": 492.18333333333334, "x": "核は、月の体のほんの芯にすぎません。"}, {"t": 495.31666666666666, "x": "月の半径は、地球の三割にわずかに届かない大きさです。"}, {"t": 499.68333333333334, "x": "重さは、地球の一・二パーセントほどしかありません。"}, {"t": 503.35, "x": "同じ太陽系で、同じころに生まれた岩の星なのに、"}, {"t": 507.06666666666666, "x": "なぜ月だけ、こんなに鉄が少ないのか。"}, {"t": 510.35, "x": "もし、地球と月が同じ場所で並んで生まれたのなら、"}, {"t": 514.0, "x": "同じくらいの鉄を持っていてよさそうです。"}, {"t": 516.8333333333334, "x": "同時にできたという説が行き詰まった"}, {"t": 518.8833333333333, "x": "理由の一つが、ここにあります。"}, {"t": 521.15, "x": "もう一つ、月には奇妙な点があります。"}, {"t": 524.1833333333333, "x": "それは、回る勢いの配分です。"}, {"t": 526.9666666666667, "x": "地球は自分で回り、月は地球のまわりを回っています。"}, {"t": 531.0666666666667, "x": "この二つの回る勢いを合わせたものを、"}, {"t": 533.5333333333333, "x": "物理学では角運動量と呼びます。"}, {"t": 536.2666666666667, "x": "地球と月の組では、その合計のうち、およそ八割を、"}, {"t": 540.65, "x": "月が地球のまわりを回る動きが持っています。"}, {"t": 543.8333333333334, "x": "木星や土星の衛星では、この割合は"}, {"t": 546.7666666666667, "x": "およそ一パーセントです。ほかの"}, {"t": 549.2166666666667, "x": "惑星の衛星とくらべて、月は、惑星に対して"}, {"t": 552.5, "x": "大きすぎ、回る勢いを持ちすぎているのです。"}, {"t": 555.7166666666667, "x": "しかもこの勢いの合計は、月ができてからの"}, {"t": 558.8666666666667, "x": "四十五億年のあいだ、ほぼ保たれてきたとされます。"}, {"t": 562.3666666666667, "x": "地球の自転は、潮の満ち引きに"}, {"t": 564.8166666666667, "x": "よって少しずつ遅くなってきました。"}, {"t": 566.9166666666666, "x": "地球が失った回る勢いは、月の"}, {"t": 569.7, "x": "動きへと受け渡されてきました。"}, {"t": 571.6166666666667, "x": "合計そのものは、ほとんど減っていないのです。"}, {"t": 574.7166666666667, "x": "つまり、いまの地球と月の組が持っている"}, {"t": 577.6333333333333, "x": "回る勢いは、月ができたときの出来事を、"}, {"t": 580.5833333333334, "x": "そのまま映していることになります。"}, {"t": 582.8333333333334, "x": "鉄が少ない。回る勢いが大きい。"}, {"t": 585.4833333333333, "x": "そして、石の成分は地球によく似ている。"}, {"t": 588.75, "x": "この三つを一度に説明できる答えが、必要でした。"}, {"t": 592.5833333333334, "x": "その答えが論文として出たのは、1975年のことでした。"}, {"t": 595.5166666666667, "x": "1975年█"}, {"t": 597.85, "x": "アメリカの研究者ウィリアム・ハートマンと"}, {"t": 600.15, "x": "ドナルド・デイヴィスが、惑星科学の専門誌"}, {"t": 603.1333333333333, "x": "イカロスに、一本の論文を発表します。"}, {"t": 606.15, "x": "題は、「衛星ほどの大きさの微惑星と、月の起源」。"}, {"t": 610.3666666666667, "x": "惑星ができる最後の段階では、太陽のまわりに、"}, {"t": 613.9333333333333, "x": "月ほど、あるいはそれ以上の大きさの星が、"}, {"t": 617.35, "x": "まだいくつも残っていたはずだ。"}, {"t": 619.4166666666666, "x": "そのうちの一つが、生まれたばかりの"}, {"t": 621.9333333333333, "x": "地球にぶつかったとしたらどうか。そういう考え方です。"}, {"t": 625.6166666666667, "x": "ほぼ同じころ、別のアメリカの研究者、"}, {"t": 628.5, "x": "アラステア・キャメロンとウィリアム・ウォードも、"}, {"t": 631.0666666666667, "x": "1976年の学会で、似た考えを発表しました。"}, {"t": 635.85, "x": "地球に大きな星が斜めにぶつかり、"}, {"t": 638.15, "x": "その破片が地球のまわりを回りはじめる。"}, {"t": 641.1666666666666, "x": "破片が集まって、月になる。"}, {"t": 643.4333333333333, "x": "斜めにぶつかれば、大きな回る勢いが生まれます。"}, {"t": 647.0166666666667, "x": "ぶつかったときに飛び出すのは、"}, {"t": 648.6666666666666, "x": "主に、星の外側の岩の部分です。"}, {"t": 651.8, "x": "鉄は、星の中心に沈んでいるので、飛び出しにくい。"}, {"t": 655.8333333333334, "x": "そうすれば、鉄の少ない月ができるかもしれません。"}, {"t": 659.3666666666667, "x": "それでも、この考えが、すぐに"}, {"t": 662.05, "x": "主流になったわけではありませんでした。"}, {"t": 664.2666666666667, "x": "流れが変わったのは、1984年の10月。"}, {"t": 666.5666666666667, "x": "1984年█"}, {"t": 668.85, "x": "ハワイのコナで、月の起源を"}, {"t": 670.9833333333333, "x": "テーマにした学会が開かれました。"}, {"t": 673.1333333333333, "x": "アメリカの惑星科学者デイヴィッド・スティーブンソンは、"}, {"t": 676.2333333333333, "x": "のちにこの学会をこう振り返っています。"}, {"t": 679.05, "x": "衝突説は、この学会で有力な候補として浮かび上がった。"}, {"t": 683.3833333333333, "x": "それは、何か劇的な新発見があったからではない。"}, {"t": 687.1666666666666, "x": "この説が、初めて本格的に、"}, {"t": 689.6333333333333, "x": "腰を据えて検討されたからだ }, {"t": 1747.3, "x": "海に覆われていたとされる地球は、"}, {"t": 1749.4333333333334, "x": "四十四億年前ごろには、もう水の海を持っていたらしい。"}, {"t": 1753.8666666666666, "x": "溶けた岩の海から、水の海へ。"}, {"t": 1756.4333333333334, "x": "その移り変わりは、地球の歴史の長さからすれば、"}, {"t": 1760.0, "x": "ほんの短いあいだに起きたことになります。"}, {"t": 1762.6666666666667, "x": "では、生まれた月は、地球に何を残したのでしょうか。"}, {"t": 1766.9, "x": "よく挙げられるのが、地球の傾きです。"}, {"t": 1769.75, "x": "地球の自転の軸は、いまおよそ二十三度傾いています。"}, {"t": 1773.85, "x": "この傾きが、季節を生んでいます。"}, {"t": 1776.55, "x": "1993年、フランスの研究者たちは、"}, {"t": 1780.4666666666667, "x": "地球の軸の傾きがどう動くかを計算しました。"}, {"t": 1783.9166666666667, "x": "いまの地球の傾きは、平均二十三・三度のまわりで、"}, {"t": 1788.0, "x": "プラスマイナス一・三度ほどしか揺れない。"}, {"t": 1790.7666666666667, "x": "ところが、月が無かったとすると、"}, {"t": 1793.0333333333333, "x": "傾きはほぼゼロ度から八十五度ほどまで、"}, {"t": 1796.0166666666667, "x": "でたらめに揺れうる範囲に入ってしまう。"}, {"t": 1798.7166666666667, "x": "研究者たちは、月は地球の気候を安定させる役を"}, {"t": 1802.5, "x": "果たしているのかもしれない、と書いています。"}, {"t": 1805.25, "x": "ただ、この見方にも、のちに反論が出ています。"}, {"t": 1808.85, "x": "NASAのエイムズ研究センターなどの研究者たちは、"}, {"t": 1811.9666666666667, "x": "月の無い地球の傾きを、より長く計算しました。"}, {"t": 1815.9, "x": "その結果、数億年という長さで見ても、傾きが"}, {"t": 1819.9, "x": "行き来する幅は、多くの場合、全体で二十度から"}, {"t": 1823.6833333333334, "x": "二十五度ほどにとどまる、としています。"}, {"t": 1826.25, "x": "月が無ければ地球の気候はめちゃくちゃになる、とまでは"}, {"t": 1829.8166666666666, "x": "言えないかもしれない、ということです。"}, {"t": 1832.2333333333333, "x": "月が地球の傾きをどこまで守っているのかも、"}, {"t": 1835.1833333333334, "x": "また、議論の途中にあります。"}, {"t": 1837.9, "x": "それでも、変わらない事実があります。"}, {"t": 1840.6666666666667, "x": "いま私たちが見上げている月は、太陽系の惑星の"}, {"t": 1844.4, "x": "衛星の中で、親の星にくらべて、とても大きな衛星です。"}, {"t": 1848.9833333333333, "x": "その大きさと、鉄の少なさと、地球とよく似た石の成分は、"}, {"t": 1853.6166666666666, "x": "一度の激しい出来事を、いまも体に刻んでいます。"}, {"t": 1857.5833333333333, "x": "地球もまた、一度はマントルのほとんどが溶けた星です。"}, {"t": 1861.4166666666667, "x": "そのあとで水の海が生まれ、陸ができ、長い"}, {"t": 1865.0666666666666, "x": "時間をかけて、いまの大地になりました。"}, {"t": 1867.75, "x": "私たちが立っている地面の下には、溶けて、"}, {"t": 1870.75, "x": "冷えて、固まり直した岩が続いています。"}, {"t": 1874.0166666666667, "x": "テイアという星を見た者は誰もいません。"}, {"t": 1876.5666666666666, "x": "その星のかけらと言えるものも、"}, {"t": 1878.4666666666667, "x": "まだ一つも手にしていません。"}, {"t": 1880.5, "x": "手がかりは、アポロが運んだ石や、"}, {"t": 1882.9833333333333, "x": "地球に落ちてきた月の隕石の中の、"}, {"t": 1885.6666666666667, "x": "百万あたり数個という原子の違いだけです。"}, {"t": 1888.75, "x": "その違いを読み取る測り方が細かくなるたびに、"}, {"t": 1891.6833333333334, "x": "答えは少しずつ書き換えられてきました。"}, {"t": 1894.3166666666666, "x": "地球と月が、なぜこれほど似ているのか。"}, {"t": 1897.2333333333333, "x": "次にその答えを書き換えるのも、おそらく、"}, {"t": 1900.0333333333333, "x": "小さな石のかけらの中の、ほんのわずかな原子の違いです。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
