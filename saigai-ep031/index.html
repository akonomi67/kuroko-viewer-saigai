<script>
const D={"name": "ep031", "file": "ep031", "dur": 1824.11665625, "segs": [], "subs": [{"t": 0.0, "x": "アメリカ西部のユタ州に高く平らな台地があります。"}, {"t": 3.283333333333333, "x": "名前をマーカガント高原といいます。"}, {"t": 5.733333333333333, "x": "いちばん高い所は、海面から3300メートルあまりです。"}, {"t": 10.233333333333333, "x": "夏は針葉樹の森が茂ります。"}, {"t": 12.5, "x": "道を走れば、林と湖が次々に現れます。"}, {"t": 16.4, "x": "けれども、その足もとの岩はよそ者です。"}, {"t": 19.433333333333334, "x": "もとからそこにあったものではありません。"}, {"t": 21.783333333333335, "x": "北の方から、すべってきたのです。"}, {"t": 24.333333333333332, "x": "すべってきたのは、山ひとつではありません。"}, {"t": 27.316666666666666, "x": "大地の一部がまるごと動きました。"}, {"t": 29.55, "x": "のちの見積もりでは、広さは5000平方キロを超えます。"}, {"t": 33.333333333333336, "x": "長さは95キロ以上です。岩の体積は、"}, {"t": 36.266666666666666, "x": "およそ3000立方キロとされています。"}, {"t": 39.35, "x": "時はおよそ2200万年前から2100万年前のころです。"}, {"t": 43.7, "x": "その大地が、ゆるい傾きの上を進みました。"}, {"t": 47.06666666666667, "x": "進んだ距離は35キロ以上です。"}, {"t": 49.55, "x": "しかも、それは数分で終わったと考えられています。"}, {"t": 53.25, "x": "名前をマーカガント重力すべりといいます。"}, {"t": 56.0, "x": "重力すべりとは、岩のかたまりが"}, {"t": 58.483333333333334, "x": "重さですべり落ちる動きです。"}, {"t": 60.36666666666667, "x": "ふつうの言葉でいえば、とてつもなく大きな地すべりです。"}, {"t": 64.08333333333333, "x": "陸の上では、知られている中で最大級です。"}, {"t": 67.5, "x": "ところが、全体の姿が論文になったのは2014年でした。"}, {"t": 71.86666666666666, "x": "それまで何十年も、調査が続いてきた土地です。"}, {"t": 75.33333333333333, "x": "なぜ、これほど大きなものが見落とされてきたのか。"}, {"t": 78.81666666666666, "x": "そして、平らに近い面の上をなぜ止まらずに進めたのか。"}, {"t": 82.88333333333334, "x": "この回の主語は大地です。手がかりは、"}, {"t": 85.73333333333333, "x": "岩の重なり方と溶けた岩の筋です。"}, {"t": 88.26666666666667, "x": "その二つから、すべりの仕組みをたどります。"}, {"t": 91.28333333333333, "x": "最後にすべってきた大地の上の、今の景色を見に行きます。"}, {"t": 95.35, "x": "地質を学ぶ人が、最初に覚える決まりがあります。"}, {"t": 99.0, "x": "地層は、下から上へ順に積もるという決まりです。"}, {"t": 102.45, "x": "下にあるものほど古く、上にあるものほど新しい。"}, {"t": 106.11666666666666, "x": "砂も泥も火山灰も、上から降って重なります。"}, {"t": 109.68333333333334, "x": "ですから、ふつうは古い層の上に新しい層が乗ります。"}, {"t": 113.61666666666666, "x": "崖を見上げれば、時間の順に読めるわけです。"}, {"t": 116.91666666666667, "x": "この決まりを本に書いたのは、"}, {"t": 118.66666666666667, "x": "17世紀の学者ステノだとされています。"}, {"t": 121.66666666666667, "x": "それから350年ほど、地質学は"}, {"t": 124.68333333333334, "x": "この決まりの上に立ってきました。"}, {"t": 126.51666666666667, "x": "ところが、マーカガント高原では順番が乱れていました。"}, {"t": 130.35, "x": "きっかけは1970年代です。"}, {"t": 133.01666666666668, "x": "高原で調べものをしていた学生たちが、"}, {"t": 135.61666666666667, "x": "妙な重なりに出くわしました。"}, {"t": 137.86666666666667, "x": "古い火山の岩が、若い地層の上に乗っていたのです。"}, {"t": 141.61666666666667, "x": "年上の岩が年下の岩の上にいる形です。"}, {"t": 144.65, "x": "この現場を長く調べた人がいます。"}, {"t": 147.0, "x": "ユタ州地質調査所のロバート・ビークさんです。"}, {"t": 149.88333333333333, "x": "ビークさんは、新聞の取材にこう話しています。"}, {"t": 153.33333333333334, "x": "これは、地質の基本の決まりを破っている。"}, {"t": 156.4, "x": "古い岩の上に若い岩が乗る、という決まりをです。"}, {"t": 160.15, "x": "では、どうすればこんな重なりができるのでしょうか。"}, {"t": 163.56666666666666, "x": "答えの候補は大きく二つあります。"}, {"t": 165.98333333333332, "x": "一つは、地面が横から強く押された場合です。"}, {"t": 169.5, "x": "押された古い岩が、若い岩の上にのし上がります。"}, {"t": 173.21666666666667, "x": "山脈ができるときには、こうしたことが起きます。"}, {"t": 176.58333333333334, "x": "地層が大きく折れ曲がって、"}, {"t": 178.3, "x": "上下がひっくり返ることもあります。"}, {"t": 180.83333333333334, "x": "どれも、地面に強い力がかかった時の形です。"}, {"t": 184.45, "x": "もう一つは、岩のかたまりが運ばれてきた場合です。"}, {"t": 188.11666666666667, "x": "高い所の岩がすべり落ちて、低い所の地層をおおう。"}, {"t": 192.08333333333334, "x": "それでも、同じ形の重なりができます。"}, {"t": 195.03333333333333, "x": "どちらなのかを決めるには、跡を広く追う必要があります。"}, {"t": 198.98333333333332, "x": "押された跡なら、力は地下深くまでつながるはずです。"}, {"t": 202.78333333333333, "x": "すべってきた跡なら、根っこがありません。"}, {"t": 205.66666666666666, "x": "上の岩だけが、浮いたように乗っているはずです。"}, {"t": 208.96666666666667, "x": "けれども、この高原はとても広い土地です。"}, {"t": 212.03333333333333, "x": "山も谷も森も入りまじっています。"}, {"t": 214.26666666666668, "x": "しかも、あとから別の断層が地面を切り刻みました。"}, {"t": 217.96666666666667, "x": "岩の重なりはあちこちで切れています。"}, {"t": 220.35, "x": "ずれたり、持ち上がったりもしています。"}, {"t": 222.95, "x": "ひとつの崖を見ても答えは、出ませんでした。"}, {"t": 226.15, "x": "さかさまの重なりは、長いあいだ小さな謎のままでした。"}, {"t": 230.08333333333334, "x": "その正体が見えるまでには、さらに時間がかかります。"}, {"t": 233.8, "x": "全体を地図にしたのは、三人の研究者でした。"}, {"t": 237.31666666666666, "x": "一人目は、デイビッド・ハッカーさんです。"}, {"t": 240.1, "x": "オハイオ州のケント州立大学の地質学者です。"}, {"t": 243.41666666666666, "x": "二人目は、さきほどのロバート・ビークさん。"}, {"t": 246.25, "x": "三人目はピーター・ローリーさんです。"}, {"t": 248.66666666666666, "x": "地質の地図づくりを長く続けてきた人です。"}, {"t": 251.51666666666668, "x": "三人は、ふた夏をかけて土地を歩きました。"}, {"t": 254.76666666666668, "x": "ハッカーさんが歩いたのは、ディキシー国有林です。"}, {"t": 258.23333333333335, "x": "国が持つ広い原野も歩きました。"}, {"t": 260.53333333333336, "x": "道のない斜面をのぼり、岩を一つずつ確かめました。"}, {"t": 264.2, "x": "地質の地図づくりは、地道な仕事です。"}, {"t": 267.15, "x": "岩の種類を見分けて、地図に色をぬっていきます。"}, {"t": 270.48333333333335, "x": "地層の傾きを、方位磁石のついた道具ではかります。"}, {"t": 274.23333333333335, "x": "岩に残った傷の向きも、一つずつ書きとめます。"}, {"t": 277.53333333333336, "x": "そうした点を何千も集めて、"}, {"t": 279.5833333333333, "x": "ようやく一枚の地図になるのです。"}, {"t": 282.0, "x": "それまでにも、一部分は知られていました。"}, {"t": 284.96666666666664, "x": "小さな跡が、あちこちにあると思われていたのです。"}, {"t": 288.53333333333336, "x": "調べるうちに、ばらばらの跡が一つにつながりました。"}, {"t": 292.2, "x": "2014年11月、三人は論文を出します。"}, {"t": 296.1166666666667, "x": "載ったのは、地質学の専門誌『ジオロジー』です。"}, {"t": 300.8333333333333, "x": "題には、巨大なマーカガント重力すべりという"}, {"t": 303.98333333333335, "x": "言葉が入っていました。大学の発表に"}, {"t": 306.81666666666666, "x": "よれば、広さはおよそ3400平方キロ。"}, {"t": 309.96666666666664, "x": "長さは88キロ以上とされました。"}, {"t": 312.65, "x": "オハイオ州の郡を三つ合わせたほどの広さです。"}, {"t": 315.78333333333336, "x": "ハッカーさんはこう話しています。"}, {"t": 317.93333333333334, "x": "見ても地すべりだとは、わからないでしょう。"}, {"t": 320.6666666666667, "x": "ローリーさんの言葉はもっと率直です。"}, {"t": 323.18333333333334, "x": "何度もその上を歩いたのに、一度も気づかなかった。"}, {"t": 326.73333333333335, "x": "大きすぎたのだ。地すべりの跡といえば、ふつうは"}, {"t": 330.1166666666667, "x": "山の斜面を思い浮かべます。"}, {"t": 331.96666666666664, "x": "えぐれた跡があり、ふもとに土砂が広がる姿です。"}, {"t": 335.53333333333336, "x": "ところが、マーカガントは高原ほどの大きさです。"}, {"t": 338.93333333333334, "x": "足もとにいる人には、端がどこなのか見当がつきません。"}, {"t": 342.8666666666667, "x": "しかも、すべりのあとで土地は何度も割られました。"}, {"t": 346.2, "x": "断層で持ち上げられ、切り分けられたのです。"}, {"t": 349.26666666666665, "x": "2016年の報告は、見落とされた理由をこう書いています。"}, {"t": 353.6, "x": "まずあまりに大きすぎた。次に"}, {"t": 355.51666666666665, "x": "いろいろな形が入りまじっていた。"}, {"t": 357.71666666666664, "x": "引きのばされた所、押された所、横にずれた所です。"}, {"t": 361.8666666666667, "x": "最初は、わけがわからなかったといいます。"}, {"t": 364.8666666666667, "x": "そこへ、あとの断層の動きが上から重なっていました。"}, {"t": 368.8, "x": "一つ一つの崖は、ありふれた断層にしか見えません。"}, {"t": 372.6, "x": "報告はこうも書いています。"}, {"t": 374.46666666666664, "x": "これほどのものが、何十年もの調査で見つからなかった。"}, {"t": 378.23333333333335, "x": "それなら、世界のほかの火山地帯にもあるかもしれない。"}, {"t": 381.9166666666667, "x": "まだ誰も気づいていない、巨大な重力すべりがです。"}, {"t": 385.43333333333334, "x": "大学の発表でハッカーさんたちは、こうも述べています。"}, {"t": 389.25, "x": "これは、火山地帯で起きる新しい種類の災害だ。"}, {"t": 392.93333333333334, "x": "昔の火山地帯の大きな部分が"}, {"t": 395.06666666666666, "x": "崩れたことを、初めて記録したものだ。"}, {"t": 397.6666666666667, "x": "一つの地すべりが、火山の見方まで広げたのです。"}, {"t": 401.18333333333334, "x": "では、すべってきた岩はどこから来たのでしょうか。"}, {"t": 404.56666666666666, "x": "答えは北にあった大きな火山地帯です。"}, {"t": 407.18333333333334, "x": "名前をマリスベール火山地帯といいます。"}, {"t": 409.8333333333333, "x": "マーカガント高原の北に広がっていました。"}, {"t": 412.5, "x": "ここでは、長い時間をかけて火山が育ちました。"}, {"t": 415.9, "x": "大学の発表は、成層火山が並ぶ地帯だったとしています。"}, {"t": 420.21666666666664, "x": "成層火山とは、円すい形の火山のことです。"}, {"t": 423.6333333333333, "x": "溶岩と火山灰が、何枚も重なってできています。"}, {"t": 427.26666666666665, "x": "富士山もこの形の火山です。"}, {"t": 429.3833333333333, "x": "アメリカでは、セントヘレンズ山がこの仲間です。"}, {"t": 432.75, "x": "1980年に噴火した山です。"}, {"t": 435.6166666666667, "x": "この山は、噴火の時に北の斜面が大きく崩れました。"}, {"t": 439.55, "x": "火山の斜面が崩れることは、"}, {"t": 441.4, "x": "世界の何百もの火山で知られています。"}, {"t": 444.25, "x": "その崩れが、一つの山ではなく火山地帯の大きさで起きた。"}, {"t": 448.5, "x": "それがマーカガントだと、研究者たちは考えています。"}, {"t": 452.3666666666667, "x": "火山のまわりには、溶岩が何度も流れました。"}, {"t": 455.7, "x": "火山の泥流も何度も積もりました。"}, {"t": 458.0, "x": "泥流とは、火山の岩くずが水と混ざったものです。"}, {"t": 461.6, "x": "それが谷を流れ下り、やがて固まります。"}, {"t": 464.6666666666667, "x": "固まると、泥の中に大小の岩が散らばった岩になります。"}, {"t": 468.8, "x": "すべった岩の多くは、この泥流の岩と溶岩でした。"}, {"t": 472.6333333333333, "x": "その間には、火砕流の岩もはさまっています。"}, {"t": 476.03333333333336, "x": "火砕流とは、熱い火山灰と軽石とガスの流れです。"}, {"t": 480.05, "x": "地面をはうように遠くまで広がります。"}, {"t": 482.6166666666667, "x": "2016年の報告はすべった岩の中身をこうまとめています。"}, {"t": 486.8, "x": "火山の泥流の岩と溶岩。火山の土砂でできた岩。"}, {"t": 490.43333333333334, "x": "地下でマグマが冷えて固まった岩。"}, {"t": 492.6666666666667, "x": "そして、広い地域に広がった火砕流の岩です。"}, {"t": 496.1666666666667, "x": "これらが互いに入り組んでいます。"}, {"t": 498.1333333333333, "x": "つまり、火山地帯の南西の一角が動いたのです。"}, {"t": 501.8666666666667, "x": "火山の山並みも、すそ野に積もった岩も、まとめてです。"}, {"t": 505.96666666666664, "x": "火山地帯の地下には、巨大な"}, {"t": 508.1666666666667, "x": "マグマのかたまりがありました。"}, {"t": 509.8, "x": "その上にさらにマグマが入りこみます。"}, {"t": 512.25, "x": "こうして火山地帯は育ち続けました。"}, {"t": 514.6833333333333, "x": "報告によれば、2300万年前には"}, {"t": 517.75, "x": "大きなカルデラもできています。"}, {"t": 519.4666666666667, "x": "モンロー・ピーク・カルデラです。"}, {"t": 521.2333333333333, "x": "カルデラとは大噴火のあとにできる大きなくぼ地です。"}, {"t": 524.3833333333333, "x": "地面が落ちこんで丸い窪みになります。"}, {"t": 526.8666666666667, "x": "火山が育ち、噴火し、また育つ。"}, {"t": 530.1666666666666, "x": "そのくり返しで火山地帯はどんどん重くなりました。"}, {"t": 533.4666666666667, "x": "では、その重さを支えていたのは何だったのか。"}, {"t": 536.8, "x": "火山地帯の下にはもっと古い地層がありました。"}, {"t": 539.85, "x": "その中に火山灰を多くふくむ層があります。"}, {"t": 542.7666666666667, "x": "火山灰が水に運ばれて積もった地層です。"}, {"t": 545.6166666666667, "x": "2016年の報告はこの層を弱い土台と呼んでいます。"}, {"t": 549.45, "x": "つくりがもろく、力に耐えにくい層です。"}, {"t": 552.4833333333333, "x": "硬い溶岩にくらべて、ずっと弱いのです。"}, {"t": 555.5333333333333, "x": "ここで、一つたとえを考えてみます。"}, {"t": 558.2666666666667, "x": "しめった粘土の上に硬い板を積むとします。"}, {"t": 561.1333333333333, "x": "板が軽いうちはじっとしています。"}, {"t": 563.3166666666667, "x": "けれども、板を重ね続けるとどうなるか。"}, {"t": 566.2, "x": "いつか粘土が押しつぶされます。"}, {"t": 568.1333333333333, "x": "そして、板は横へずれ始めます。"}, {"t": 570.7666666666667, "x": "マリスベールでも同じことが起きていました。"}, {"t": 573.2333333333333, "x": "火山が育つたびに弱い土台に重い岩が乗りました。"}, {"t": 576.4833333333333, "x": "報告によれば、大きなすべりの前に変化が始まっています。"}, {"t": 580.6, "x": "まずはゆっくりとした動きでした。"}, {"t": 582.6833333333333, "x": "火山地帯が自分の重さで外へ広がり始めたのです。"}, {"t": 586.2, "x": "皿に落としたホットケーキの生地を思い浮かべてください。"}, {"t": 589.55, "x": "生地は自分の重さでゆっくり外へ広がっていきます。"}, {"t": 592.85, "x": "火山地帯も、何十万年という時間で"}, {"t": 595.8333333333334, "x": "同じように広がったのです。"}, {"t": 597.4833333333333, "x": "その跡は、今のブライスキャニオン国立公園の"}, {"t": 600.9166666666666, "x": "あたりにあります。ルビーズイン衝上断層と"}, {"t": 603.5833333333334, "x": "呼ばれる断層の群れです。衝上断層とは"}, {"t": 606.3, "x": "地層がのし上がった断層です。"}, {"t": 608.4, "x": "押された地層が別の地層の上に乗り上げています。"}, {"t": 611.4833333333333, "x": "報告はこれを広がりの跡だとしています。"}, {"t": 614.1666666666666, "x": "火山地帯が重さで広がったときにできたものです。"}, {"t": 617.2333333333333, "x": "もう一つ、すべりを助けたかもしれない動きがあります。"}, {"t": 621.1, "x": "地下のマグマです。火山地帯の中心の地下では、"}, {"t": 624.3666666666667, "x": "マグマが次々に入りこみました。"}, {"t": 626.8, "x": "そして、上の岩を押し上げていました。"}, {"t": 629.6666666666666, "x": "報告はこの押し上げの影響をこう考えています。"}, {"t": 632.9666666666667, "x": "南の側の地層を南へわずかに傾けたかもしれない。"}, {"t": 636.6166666666667, "x": "わずかに傾いた、弱い灰の地層。"}, {"t": 639.35, "x": "その上に乗った、何千立方キロもの火山の岩。"}, {"t": 643.0, "x": "すべり台の準備が少しずつ整っていきました。"}, {"t": 645.9833333333333, "x": "大学の発表も同じ考えを紹介しています。"}, {"t": 649.1666666666666, "x": "地下深くのマグマだまりが、"}, {"t": 650.8333333333334, "x": "上へふくらんだのかもしれない。"}, {"t": 653.0, "x": "それが崩れのきっかけになったのかもしれない。"}, {"t": 655.6833333333333, "x": "ハッカーさんは近くでも似た跡を見つけています。"}, {"t": 658.65, "x": "南のパインバレー山地です。"}, {"t": 660.6, "x": "そこではもっと小さなすべりが起きていました。"}, {"t": 663.3666666666667, "x": "地下に入りこんだマグマが、"}, {"t": 665.1, "x": "上の岩を持ち上げていたのです。"}, {"t": 667.4166666666666, "x": "マグマが地層の間に入りこむと、上の地層は"}, {"t": 670.7166666666667, "x": "おまんじゅうのようにふくらみます。"}, {"t": 672.5, "x": "平らだった地層はふくらみのまわりで傾きます。"}, {"t": 675.4333333333333, "x": "傾いた地層の上の岩はすべりやすくなります。"}, {"t": 678.4, "x": "小さな山で起きたことが、マリスベールでは"}, {"t": 681.3166666666667, "x": "火山地帯の大きさで起きたのかもしれません。"}, {"t": 684.0, "x": "ただし、ここでの言葉はどれも「かもしれない」です。"}, {"t": 688.6666666666666, "x": "傾きがどれほどだったのかはわかっていません。"}, {"t": 691.4166666666666, "x": "いつ動き出したのかもまだ決まっていません。"}, {"t": 693.9166666666666, "x": "研究者たちはすべった大地を区間に分けて見ています。"}, {"t": 697.3166666666667, "x": "北から南へ、順にたどってみます。"}, {"t": 700.1166666666667, "x": "手がかりは2016年の報告と、現地見学会の予定表です。"}, {"t": 704.9666666666667, "x": "いちばん北はすべりが始まった場所です。"}, {"t": 707.5333333333333, "x": "ここには地面が引きちぎられた跡があります。"}, {"t": 710.2166666666667, "x": "すべり出した岩と残った岩の間です。"}, {"t": 712.85, "x": "そこに大きな断層ができました。"}, {"t": 715.0166666666667, "x": "テーブルクロスを引っぱった時を思い浮かべてください。"}, {"t": 718.1833333333333, "x": "端にはしわではなく裂け目ができます。"}, {"t": 720.5833333333334, "x": "この区間の岩は引きのばされるように割れています。"}, {"t": 723.55, "x": "その南はすべり台の区間です。"}, {"t": 725.75, "x": "岩は傾いた地層の面に沿ってすべりました。"}, {"t": 728.6, "x": "地層の境目がそのまますべる面になったのです。"}, {"t": 731.6333333333333, "x": "さらに南へ行くと、すべり台は終わります。"}, {"t": 734.8166666666667, "x": "その先には当時の地面が広がっていました。"}, {"t": 737.5833333333334, "x": "けれども、岩はそこで止まりませんでした。"}, {"t": 740.5333333333333, "x": "報告の地図には斜めの断層が描かれています。"}, {"t": 743.65, "x": "すべる面が上へ持ち上がる所です。"}, {"t": 746.1, "x": "岩のかたまりはそこを乗り越えました。"}, {"t": 748.4333333333333, "x": "そして、当時の地面の上に乗り上げたのです。"}, {"t": 751.6333333333333, "x": "昔の地面の上を少なくとも35キロ進みました。"}, {"t": 755.15, "x": "35キロは山手線をひと回りするのに近い長さです。"}, {"t": 759.1333333333333, "x": "その道のりを高原ほどの岩がすべっていきました。"}, {"t": 762.2833333333333, "x": "いちばん先では岩はばらばらに砕けています。"}, {"t": 765.0833333333334, "x": "岩なだれのような積もり方です。"}, {"t": 767.1333333333333, "x": "報告はすべりの中に三つの形があるとしています。"}, {"t": 770.4666666666667, "x": "引きのばされた形。押し縮められた形。"}, {"t": 773.4, "x": "そして、横にすべった形です。"}, {"t": 775.9166666666666, "x": "一つの地すべりの中にこれらが並んでいます。"}, {"t": 778.7166666666667, "x": "これが研究者たちを悩ませた"}, {"t": 780.7, "x": "形の正体でした。報告はこう書いています。"}, {"t": 783.7666666666667, "x": "マーカガントには、今の地すべりの形が"}, {"t": 786.6, "x": "すべてそろっている。ただし、"}, {"t": 788.6666666666666, "x": "とてつもなく大きな物差しでだ。"}, {"t": 790.8666666666667, "x": "山の斜面で起きる地すべりと仕組みは同じです。"}, {"t": 793.9166666666666, "x": "違うのは大きさだけでした。"}, {"t": 795.7666666666667, "x": "けれども、その大きさが別の謎を生みます。"}, {"t": 798.9333333333333, "x": "これほど重いものがなぜ35キロも進めたのか。"}, {"t": 802.0333333333333, "x": "しかも、平らに近い昔の地面の上をです。"}, {"t": 805.45, "x": "すべりの底を調べるとふしぎな岩が見つかりました。"}, {"t": 808.7, "x": "黒っぽい、ガラスのような筋です。"}, {"t": 811.4166666666666, "x": "名前をシュードタキライトといいます。"}, {"t": 813.6, "x": "にせもののタキライト、という意味です。"}, {"t": 816.25, "x": "タキライトは火山でできる黒いガラスの岩です。"}, {"t": 819.15, "x": "見た目はよく似ています。でも"}, {"t": 820.9166666666666, "x": "火山からできたものではありません。"}, {"t": 823.0666666666667, "x": "それでこの名前が付きました。"}, {"t": 824.9333333333333, "x": "この岩はこすれ合う熱でできます。"}, {"t": 827.15, "x": "岩と岩がこすれて、岩そのものが溶けるのです。"}, {"t": 830.55, "x": "両手をこすり合わせると手のひらが温かくなります。"}, {"t": 833.7333333333333, "x": "それと同じことが巨大な岩の底で起きました。"}, {"t": 836.6833333333333, "x": "こする速さがゆっくりなら、熱は逃げていきます。"}, {"t": 840.05, "x": "岩が溶けるには熱がたまる必要があります。"}, {"t": 842.85, "x": "そのためにはとても速くこすれなければなりません。"}, {"t": 845.85, "x": "ビークさんは新聞にこう話しています。"}, {"t": 848.3833333333333, "x": "これだけの熱を生むには、ものすごく速く動かすしかない。"}, {"t": 852.2, "x": "2016年の報告にはこの岩の写真が載っています。"}, {"t": 855.9666666666667, "x": "顕微鏡で見た写真です。岩の"}, {"t": 858.0, "x": "大部分は結晶のないガラスでした。"}, {"t": 860.5, "x": "ところどころに溶けかけた結晶が残っています。"}, {"t": 863.35, "x": "ガラスの中には流れた模様も見えました。"}, {"t": 865.9666666666667, "x": "一度とろとろに溶けて流れ、急に冷えたしるしです。"}, {"t": 869.5, "x": "溶けたものがゆっくり冷えると結晶が育ちます。"}, {"t": 872.4666666666667, "x": "急に冷えると結晶が育つひまがありません。"}, {"t": 875.3, "x": "そのまま固まったものがガラスです。"}, {"t": 877.5333333333333, "x": "この岩は溶けてからすぐに冷えたことになります。"}, {"t": 880.3333333333334, "x": "この溶けた岩は割れ目にも流れこんでいました。"}, {"t": 883.1, "x": "すべり面から、まわりの岩のすき間へです。"}, {"t": 886.1666666666666, "x": "細い枝のような筋になって、固まっていました。"}, {"t": 889.5, "x": "報告によれば、北米では初めての報告でした。"}, {"t": 893.1, "x": "地すべりでできたシュードタキライトとしてです。"}, {"t": 895.6666666666666, "x": "世界でもほんのいくつかしか知られていません。"}, {"t": 898.3833333333333, "x": "地震の断層でできるものはほかにも知られています。"}, {"t": 901.5166666666667, "x": "けれども、地すべりで岩が溶けるのは、"}, {"t": 904.0833333333334, "x": "めったにありません。大学の発表は"}, {"t": 906.4333333333333, "x": "これを速さのしるしに挙げています。"}, {"t": 908.9333333333333, "x": "すべりが速く、一気に起きたしるしです。"}, {"t": 911.9166666666666, "x": "研究者たちは次の仕事も挙げていました。"}, {"t": 914.65, "x": "この溶けた岩の年代をはかることです。"}, {"t": 917.1333333333333, "x": "溶けた時がわかれば、すべった時も絞りこめます。"}, {"t": 920.55, "x": "今の年代は別の方法で絞りこまれています。"}, {"t": 923.6833333333333, "x": "火山の岩には時計の代わりになる元素がふくまれます。"}, {"t": 927.0833333333334, "x": "決まった速さで別の元素に変わっていく元素です。"}, {"t": 930.2666666666667, "x": "その割合をはかれば、岩ができた時がわかります。"}, {"t": 933.9, "x": "すべった岩の中で、いちばん新しい"}, {"t": 936.7333333333333, "x": "岩より後にすべりは起きました。"}, {"t": 938.65, "x": "すべった岩の上に積もった岩よりは前に起きています。"}, {"t": 942.1, "x": "前と後ろから、はさみうちにするわけです。"}, {"t": 945.0833333333334, "x": "2016年の報告は、約2200万年前から"}, {"t": 949.15, "x": "2100万年前としています。"}, {"t": 951.2, "x": "溶けた岩そのものの年代がわかれば、"}, {"t": 953.5, "x": "はさみの幅はもっと狭くなります。"}, {"t": 955.95, "x": "マーカガントのすべりは数分で終わった。"}, {"t": 958.4833333333333, "x": "大学の発表はそう書いています。"}, {"t": 960.7833333333333, "x": "けれども、2000万年以上も前の出来事です。"}, {"t": 964.1666666666666, "x": "時計で測った人はもちろんいません。"}, {"t": 966.5666666666667, "x": "では、何をもとに速かったと言えるのか。"}, {"t": 969.4333333333333, "x": "2016年の報告は手がかりを四つ挙げています。"}, {"t": 972.95, "x": "一つめはすべりの底の砕けた岩の層です。"}, {"t": 975.8833333333333, "x": "大きな岩がこすれ合って砕けています。"}, {"t": 978.2833333333333, "x": "砂や粉のように細かくなっています。"}, {"t": 980.7333333333333, "x": "二つめは砕けた岩が入りこんだ筋です。"}, {"t": 983.4833333333333, "x": "底の岩くずが上や下の割れ目へ入っています。"}, {"t": 986.5166666666667, "x": "強い力で一気に押しこまれたしるしです。"}, {"t": 989.2333333333333, "x": "歯みがき粉のチューブを強く握ると、"}, {"t": 991.45, "x": "中身が口から飛び出します。"}, {"t": 993.55, "x": "底の岩くずも強い圧力で割れ目へ飛びこんだのです。"}, {"t": 996.95, "x": "ゆっくりとした動きでは、こうした"}, {"t": 999.2333333333333, "x": "筋はできにくいと考えられています。"}, {"t": 1001.4833333333333, "x": "三つめはさきほどの溶けた岩です。"}, {"t": 1003.6166666666667, "x": "四つめは動いた向きのしるしです。"}, {"t": 1005.7, "x": "すべりの底には引っかき傷や溝が残ります。"}, {"t": 1008.7, "x": "その向きが広い範囲でそろっていました。"}, {"t": 1011.1833333333333, "x": "小さなすべりが何度も起きたら、どうなるか。"}, {"t": 1014.2833333333333, "x": "向きは場所ごとにばらばらになるはずです。"}, {"t": 1016.7333333333333, "x": "向きがそろうのは全体が一つで動いたからです。"}, {"t": 1019.7333333333333, "x": "報告はこれらと全体の形を合わせて結論しました。"}, {"t": 1023.25, "x": "マーカガントは一度きりの一気のすべりだった。"}, {"t": 1025.9833333333333, "x": "大学の発表はほかの手がかりも紹介しています。"}, {"t": 1029.2333333333333, "x": "ジグソーパズルのように割れた石です。"}, {"t": 1031.5333333333333, "x": "石が粉々に割れているのに散らばっていない。"}, {"t": 1034.25, "x": "もとの形のまま、ひびだけが入っています。"}, {"t": 1037.3833333333334, "x": "強い衝撃で一瞬で割れたときの形です。"}, {"t": 1040.2666666666667, "x": "ハッカーさんはこうも話しています。"}, {"t": 1042.5666666666666, "x": "これだけの距離を動いたのだから、速さもあったはずだ。"}, {"t": 1046.1333333333334, "x": "通り道の動物はあっという間にのみこまれただろう。"}, {"t": 1049.25, "x": "ビークさんはもう一歩踏みこんでいます。"}, {"t": 1051.6333333333334, "x": "それぞれのすべりは、数分で終わる"}, {"t": 1054.2166666666667, "x": "一度きりの出来事だった。岩くずは、"}, {"t": 1056.7666666666667, "x": "高速道路の車ほどの速さで走ったのではないか。"}, {"t": 1060.0833333333333, "x": "ただし、これはビークさんの見立てです。"}, {"t": 1062.9166666666667, "x": "速さを数字ではかった記録はありません。"}, {"t": 1065.5166666666667, "x": "確かに言えることは一つです。"}, {"t": 1067.4166666666667, "x": "岩を溶かすほど速く、こすれた面があった。"}, {"t": 1070.6, "x": "そこまでは岩そのものが示しています。"}, {"t": 1073.0833333333333, "x": "2014年の論文のあとも地図づくりは続きました。"}, {"t": 1076.5, "x": "すると、跡はさらに広がっていました。"}, {"t": 1079.1833333333334, "x": "2016年研究者たちは数字を見直します。"}, {"t": 1082.55, "x": "広さは5000平方キロを超える。"}, {"t": 1084.7666666666667, "x": "長さは95キロを超える。進んだ距離は35キロを超える。"}, {"t": 1089.15, "x": "岩の体積はおよそ3000立方キロ。"}, {"t": 1091.7666666666667, "x": "広さは2014年のおよそ1.5倍になりました。"}, {"t": 1095.1833333333334, "x": "報告の地図には説明が付いています。"}, {"t": 1097.75, "x": "アメリカのロードアイランド州より広い、という説明です。"}, {"t": 1101.7666666666667, "x": "ロードアイランド州は、アメリカでいちばん小さい州です。"}, {"t": 1105.7166666666667, "x": "とはいえ、一つの州をまるごと"}, {"t": 1108.1333333333334, "x": "覆うほどの岩が動いたことになります。"}, {"t": 1110.35, "x": "3000立方キロをほかの地すべりと比べてみます。"}, {"t": 1113.5333333333333, "x": "1980年5月18日、朝の8時32分のことです。"}, {"t": 1118.8333333333333, "x": "セントヘレンズ山で山の北側が崩れ落ちました。"}, {"t": 1122.05, "x": "アメリカ地質調査所によれば、"}, {"t": 1123.9166666666667, "x": "岩なだれの体積は約2.5立方キロ。"}, {"t": 1127.0166666666667, "x": "記録に残る中で地球最大の岩なだれとされています。"}, {"t": 1130.5833333333333, "x": "岩なだれは谷に沿って23キロ先まで流れました。"}, {"t": 1134.05, "x": "マーカガントはその1200倍にあたります。"}, {"t": 1136.8, "x": "1立方キロは一辺が1キロのさいころの"}, {"t": 1139.5333333333333, "x": "大きさです。東京ドームの容積は、"}, {"t": 1141.9666666666667, "x": "およそ124万立方メートルとされています。"}, {"t": 1145.4333333333334, "x": "1立方キロはその800杯分ほどになります。"}, {"t": 1148.5666666666666, "x": "3000立方キロなら、240万杯分を超えます。"}, {"t": 1152.6666666666667, "x": "記録に残る最大の岩なだれを、"}, {"t": 1154.7666666666667, "x": "1200個集めてやっと一つ分です。"}, {"t": 1157.6333333333334, "x": "大学の発表は、陸の上のすべりとしてこう位置づけました。"}, {"t": 1161.65, "x": "知られている中で二つしかない最大級の一つだ。"}, {"t": 1164.8333333333333, "x": "ただし、海の底には、これより"}, {"t": 1167.6833333333334, "x": "大きな地すべりもあるとしています。"}, {"t": 1169.65, "x": "陸の上でこれほどのものが起きたことが特別なのです。"}, {"t": 1172.9333333333334, "x": "2016年の報告には別の発見も書かれています。"}, {"t": 1176.6333333333334, "x": "北の方でもう一つ大きなすべりが見つかったのです。"}, {"t": 1179.8166666666666, "x": "今のセビア高原の多くをつくる、セビア重力すべりです。"}, {"t": 1183.95, "x": "報告の地図の説明によれば、このすべりには"}, {"t": 1187.0666666666666, "x": "別のきっかけがあったかもしれません。"}, {"t": 1189.2166666666667, "x": "さきほどのモンロー・ピーク・"}, {"t": 1190.7, "x": "カルデラが、ふくらんだことです。"}, {"t": 1192.8833333333334, "x": "2020年の新聞記事では、すべりは三つになっていました。"}, {"t": 1197.15, "x": "マーカガント、セビア、ブラック・マウンテンズです。"}, {"t": 1200.9, "x": "三つは、同じ日に起きたわけではありません。"}, {"t": 1203.95, "x": "記事によれば、ビークさんはこう考えています。"}, {"t": 1207.1666666666667, "x": "まずセビアのすべりが起き、"}, {"t": 1208.7333333333333, "x": "その後にマーカガントが続いた。"}, {"t": 1211.0833333333333, "x": "ブラック・マウンテンズのすべりは"}, {"t": 1212.75, "x": "最後で、こちらは西へ動いた。"}, {"t": 1215.1833333333334, "x": "それぞれが一度きりのすべりで、"}, {"t": 1217.0666666666666, "x": "それが時をおいて三回あったのです。"}, {"t": 1219.7, "x": "しかも、マーカガントの前には、火山地帯が"}, {"t": 1223.1833333333334, "x": "ゆっくり広がる時期がありました。"}, {"t": 1225.0833333333333, "x": "ゆっくりした広がりと、一瞬のすべり。"}, {"t": 1227.9333333333334, "x": "二つのまったく違う速さが、"}, {"t": 1229.8166666666666, "x": "同じ土地に重なっているわけです。"}, {"t": 1232.1333333333334, "x": "三つの岩くずは、合わせて7800平方キロほどを覆います。"}, {"t": 1236.7166666666667, "x": "いちばん厚い所は厚さ1.6キロほどです。"}, {"t": 1239.8166666666666, "x": "タシャー山地の南の端です。"}, {"t": 1241.8333333333333, "x": "ただし、数字は資料によって違います。"}, {"t": 1244.8333333333333, "x": "同じ記事は、マーカガントを幅32キロ、"}, {"t": 1247.9166666666667, "x": "長さ97キロほどとしています。"}, {"t": 1250.5666666666666, "x": "これは2016年の報告の広さとは合いません。"}, {"t": 1253.9, "x": "どの数字を使うかで印象はかなり変わります。"}, {"t": 1256.9333333333334, "x": "この回では、研究者が出した"}, {"t": 1259.1666666666667, "x": "2016年の数字をおもに使っています。"}, {"t": 1261.95, "x": "なぜ 667, "x": "ここまでは動き出すまでの説明です。"}, {"t": 1484.1166666666666, "x": "では、動き出したあとはどうか。"}, {"t": 1486.5333333333333, "x": "なぜ、すぐに止まらなかったのか。"}, {"t": 1489.0666666666666, "x": "平らな地面の上をなぜ長く進めたのか。"}, {"t": 1491.8, "x": "この点について、確かめた資料は"}, {"t": 1494.3666666666666, "x": "答えを一つに決めていません。"}, {"t": 1496.2, "x": "2016年の報告は研究の課題を挙げています。"}, {"t": 1499.8333333333333, "x": "火山の地すべりが動き出す理由。"}, {"t": 1501.9666666666667, "x": "そして、運ばれていく仕組み。"}, {"t": 1504.15, "x": "底の砕けた岩や溶けた岩が記録する、激しい変形の仕組み。"}, {"t": 1508.5166666666667, "x": "模型の実験や計算機で火山の成長と崩れをまねること。"}, {"t": 1512.4833333333333, "x": "いくつもの分野の研究者で、"}, {"t": 1514.4, "x": "議論する必要があるとしています。"}, {"t": 1516.8333333333333, "x": "引き金についても決まった答えはありません。"}, {"t": 1519.5333333333333, "x": "ビークさんは新聞にこう話しています。"}, {"t": 1522.0666666666666, "x": "三つのすべりの引き金はおそらく地震か噴火だろう。"}, {"t": 1525.3333333333333, "x": "火山地帯ではどちらも起こりうることです。"}, {"t": 1527.95, "x": "けれども、確かめる方法はありません。"}, {"t": 1530.8166666666666, "x": "2000万年以上前の、ある一日の揺れだからです。"}, {"t": 1534.55, "x": "弱い床と、重い荷物と、わずかな傾き。"}, {"t": 1538.15, "x": "動き出すまでの筋書きは見えてきました。"}, {"t": 1540.65, "x": "けれども、動き出してからの走りぶりは別です。"}, {"t": 1543.8833333333334, "x": "そこはまだ説明の途中なのです。"}, {"t": 1546.1833333333334, "x": "わかっていることとわかっていないこと。"}, {"t": 1548.3, "x": "その境目をはっきりさせておくことも、"}, {"t": 1550.8, "x": "研究の大事な一歩です。ここで、"}, {"t": 1553.3166666666666, "x": "話を確かさの違いで分けておきます。"}, {"t": 1556.1666666666667, "x": "まず資料どうしで争われていないことです。"}, {"t": 1558.7833333333333, "x": "ユタ州の南西部には巨大なすべりの跡があります。"}, {"t": 1562.05, "x": "北の火山地帯の一角が南へすべり落ちた跡です。"}, {"t": 1565.4666666666667, "x": "そこにはさかさまの重なりがあります。"}, {"t": 1567.8833333333334, "x": "年上の火山の岩が年下の地層の上に乗っています。"}, {"t": 1571.4333333333334, "x": "すべりの底には摩擦の熱で溶けた岩があります。"}, {"t": 1574.5666666666666, "x": "地すべりでできたものとしては、"}, {"t": 1576.3166666666666, "x": "北米で初めての報告でした。"}, {"t": 1578.6833333333334, "x": "ここまでは確かなこととして話せる部分です。"}, {"t": 1581.5, "x": "次に有力とされている解釈です。"}, {"t": 1583.8666666666666, "x": "このすべりは、一度きりで、数分で起きた。"}, {"t": 1587.4333333333334, "x": "これは四つの手がかりから読み取られたものです。"}, {"t": 1590.2666666666667, "x": "砕けた岩の層と押しこまれた岩くず。"}, {"t": 1592.7, "x": "溶けた岩とそろった向きのしるしです。"}, {"t": 1595.0, "x": "大きさは2016年の研究者自身の見積もりです。"}, {"t": 1598.6666666666667, "x": "広さ5000平方キロ超、長さ95キロ超。"}, {"t": 1602.55, "x": "進んだ距離35キロ超、体積およそ3000立方キロです。"}, {"t": 1607.1833333333334, "x": "すべる前に火山地帯がゆっくり広がっていたこと。"}, {"t": 1610.3833333333334, "x": "マグマが地層をわずかに傾けたかもしれないこと。"}, {"t": 1613.45, "x": "報告はここを「かもしれない」と書いています。"}, {"t": 1617.0833333333333, "x": "最後にまだ割れていることです。"}, {"t": 1619.05, "x": "一つめは年代です。2016年の報告は2200万年前から"}, {"t": 1623.9166666666667, "x": "2100万年前としています。"}, {"t": 1625.9833333333333, "x": "一方、2020年の新聞記事は、"}, {"t": 1629.0666666666666, "x": "ビークさんの考えを伝えています。"}, {"t": 1631.5166666666667, "x": "セビアのすべりが2500万年前に始まった。"}, {"t": 1634.7333333333333, "x": "その200万年後にマーカガントが続いた。"}, {"t": 1637.55, "x": "記事は、三つのすべりを1800万年前から"}, {"t": 1640.9333333333334, "x": "2500万年前としています。"}, {"t": 1643.1166666666666, "x": "二つめは大きさです。2014年、2016年、2020年と、"}, {"t": 1648.85, "x": "資料ごとに数字が違います。"}, {"t": 1651.0166666666667, "x": "三つめは、引き金と、すべり続けた仕組みです。"}, {"t": 1654.55, "x": "地震だったのか、噴火だったのか。"}, {"t": 1657.0166666666667, "x": "ゆるい坂をなぜ走り続けられたのか。"}, {"t": 1659.4333333333334, "x": "ここは研究の課題として残っています。四つめは速さです。"}, {"t": 1663.5166666666667, "x": "高速道路の車ほど、というのは見立てです。"}, {"t": 1666.7833333333333, "x": "はかった数字ではありません。"}, {"t": 1668.5833333333333, "x": "この回では速さの数字は使っていません。"}, {"t": 1671.35, "x": "確かなのは大地がすべったことです。"}, {"t": 1673.5833333333333, "x": "そして、岩が溶けたことです。"}, {"t": 1675.9166666666667, "x": "その二つをどんな筋書きでつなぐのか。"}, {"t": 1678.3833333333334, "x": "そこは研究者たちが線を引いている最中です。"}, {"t": 1681.6333333333334, "x": "もう一度、マーカガント高原に戻ります。"}, {"t": 1684.6666666666667, "x": "高原の西の端に大きな円形の崖があります。"}, {"t": 1687.9166666666667, "x": "シーダー・ブレイクスと呼ばれる場所です。"}, {"t": 1690.2666666666667, "x": "国立公園局によれば、崖のふちは"}, {"t": 1693.05, "x": "3000メートルを超える高さです。"}, {"t": 1695.1166666666666, "x": "崖は、深い谷へ向かってすり鉢のように落ちこんでいます。"}, {"t": 1699.0666666666666, "x": "南パイユートの人々は、ここを"}, {"t": 1701.45, "x": "ウマプウィッチと呼んできました。"}, {"t": 1703.0666666666666, "x": "岩がいつもすべり落ちている場所、という意味です。"}, {"t": 1706.4333333333334, "x": "崖をつくるおもな地層は、クラロン層と呼ばれます。"}, {"t": 1710.0, "x": "石灰をふくむ地層で、雨が少しずつ"}, {"t": 1712.9333333333334, "x": "溶かして削っていきます。水をふくんだ"}, {"t": 1715.3333333333333, "x": "斜面が、まとめてずり落ちることもあります。"}, {"t": 1718.1333333333334, "x": "大きな地すべりの上で、今も"}, {"t": 1720.3666666666666, "x": "小さな崩れが続いているのです。"}, {"t": 1722.45, "x": "この高原が今の高さになったのは、すべりのずっと後です。"}, {"t": 1726.4333333333334, "x": "国立公園局によれば、この1000万年ほどの間のことです。"}, {"t": 1730.8333333333333, "x": "西のハリケーン断層の東側が持ち上がりました。"}, {"t": 1734.1666666666667, "x": "すべってきた大地も、高原ごと空へ押し上げられたのです。"}, {"t": 1738.1, "x": "崖のふちには針葉樹の林があります。"}, {"t": 1740.8333333333333, "x": "エンゲルマントウヒや、亜高山のモミです。"}, {"t": 1743.8666666666666, "x": "ダグラスモミも立っています。"}, {"t": 1745.6, "x": "長生きで知られるブリッスルコーンパインも"}, {"t": 1747.95, "x": "根を張っています。このあたりは"}, {"t": 1750.2, "x": "1909年に国有林に入りました。"}, {"t": 1752.6166666666666, "x": "のちにディキシー国有林に組みこまれます。"}, {"t": 1755.1833333333334, "x": "1933年には崖のまわりが国の記念物になりました。"}, {"t": 1759.55, "x": "高原の上には湖もあります。"}, {"t": 1761.8, "x": "パンギッチ湖です。2020年の新聞記事は、湖の"}, {"t": 1765.9333333333334, "x": "近くの切り通しに触れています。"}, {"t": 1767.85, "x": "この地すべりの説明の看板を立てる、候補の場所です。"}, {"t": 1771.75, "x": "夏には車が湖の近くの道を走り抜けていきます。"}, {"t": 1775.4333333333334, "x": "高原の森を歩いても何も感じないでしょう。"}, {"t": 1778.25, "x": "足もとの大地が遠くから来たものだとは。"}, {"t": 1780.9, "x": "ハッカーさんの言葉どおり、"}, {"t": 1782.4833333333333, "x": "見ても地すべりとはわからないのです。"}, {"t": 1784.9666666666667, "x": "けれども、その岩は2100万年以上前に北から来ました。"}, {"t": 1789.25, "x": "火山地帯から、数分のうちにすべってきたのです。"}, {"t": 1792.7333333333333, "x": "昔の地面に乗り上げ、35キロ以上を走りました。"}, {"t": 1796.6, "x": "そして、そこで止まりました。"}, {"t": 1798.7666666666667, "x": "止まった岩の上にやがて雨が降りました。"}, {"t": 1801.4166666666667, "x": "岩が崩れて、土ができました。"}, {"t": 1803.8, "x": "草が生え、木が育ち、森になりました。"}, {"t": 1807.2166666666667, "x": "その森の中を今は道が通っています。"}, {"t": 1809.9, "x": "湖には水が満ちています。冬には"}, {"t": 1812.35, "x": "その森が深い雪に覆われます。"}, {"t": 1814.6333333333334, "x": "春になると雪どけの水が湖に流れこみます。"}, {"t": 1817.8, "x": "すべってきた大地はもう動きません。"}, {"t": 1820.1333333333334, "x": "その上で森と湖を静かに支えています。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
