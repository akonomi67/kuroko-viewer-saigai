<script>
const D={"name": "ep035", "file": "ep035", "dur": 1899.36665625, "segs": [], "subs": [{"t": 0.0, "x": "満月の夜に、月を見上げてください。"}, {"t": 2.816666666666667, "x": "白く明るい面に、黒っぽい模様があります。"}, {"t": 6.066666666666666, "x": "うさぎの形に見えると言われる模様です。"}, {"t": 8.633333333333333, "x": "この黒い部分は、月の海と呼ばれます。"}, {"t": 11.516666666666667, "x": "けれども水があるわけではありません。"}, {"t": 13.766666666666667, "x": "大きな穴に、溶岩がたまって固まった土地です。"}, {"t": 17.183333333333334, "x": "その穴をつくったのは、空から落ちてきた天体です。"}, {"t": 20.816666666666666, "x": "月の表には、大小の穴がびっしりと残っています。"}, {"t": 24.533333333333335, "x": "ではすぐ隣の地球はどうだったのでしょうか。"}, {"t": 27.366666666666667, "x": "地球は月よりずっと大きな的です。"}, {"t": 29.75, "x": "月に天体が降ったなら地球にも降ったはずです。"}, {"t": 32.9, "x": "けれども地球には、大昔の穴がほとんど残っていません。"}, {"t": 37.05, "x": "手がかりは、空の上の月にあります。"}, {"t": 39.8, "x": "1969年から1972年にかけて、人は月に降りました。"}, {"t": 45.4, "x": "持ち帰った石の年代が測られました。"}, {"t": 47.86666666666667, "x": "すると、ふしぎなことが分かりました。"}, {"t": 50.516666666666666, "x": "多くの石の年代が、およそ39億年前に集まっていたのです。"}, {"t": 55.333333333333336, "x": "そこから一つの説が生まれました。"}, {"t": 57.53333333333333, "x": "39億年前ごろ、月と地球に天体が集中して降った。"}, {"t": 62.233333333333334, "x": "これを後期の重爆撃と呼びます。"}, {"t": 64.5, "x": "遅い時期の激しい衝突の時代、という意味です。"}, {"t": 68.06666666666666, "x": "地球が生まれて5億年以上たったころの話です。"}, {"t": 71.3, "x": "この説が正しければ、地球の海は煮えたかもしれません。"}, {"t": 75.18333333333334, "x": "地表の岩も、何度も溶けたかもしれません。"}, {"t": 78.13333333333334, "x": "ただしこの説は今ゆらいでいます。"}, {"t": 80.25, "x": "年代が集まって見えたのは、なぜなのか。"}, {"t": 83.21666666666667, "x": "石の拾い方のせいではないか。"}, {"t": 85.28333333333333, "x": "測り方のくせが、山をつくったのではないか。"}, {"t": 88.46666666666667, "x": "そうした反論がいくつも出ているのです。"}, {"t": 90.91666666666667, "x": "一度に吹き荒れた嵐だったのか。"}, {"t": 93.05, "x": "それとも長い時間をかけて弱まった雨だったのか。"}, {"t": 96.26666666666667, "x": "この回の主語は空から来た岩と月の石です。"}, {"t": 99.3, "x": "手がかりは3つあります。月から持ち帰った石。"}, {"t": 102.6, "x": "月から落ちてきた隕石。そして南アフリカの古い地層です。"}, {"t": 106.8, "x": "この3つを順にたどります。"}, {"t": 108.63333333333334, "x": "どこまでが確かで、どこからが解釈なのか。"}, {"t": 111.68333333333334, "x": "その線を引きながら進みます。"}, {"t": 113.8, "x": "数字が資料によって違う所は、両方を並べます。"}, {"t": 117.63333333333334, "x": "最後は、今夜の月をもう一度見上げます。"}, {"t": 120.78333333333333, "x": "まず月の表の様子から見ていきます。"}, {"t": 123.15, "x": "月の表面は大きく二つに分けられます。"}, {"t": 125.9, "x": "白っぽく明るい所と、黒っぽく暗い所です。"}, {"t": 129.43333333333334, "x": "白っぽい所は高地と呼ばれます。"}, {"t": 131.78333333333333, "x": "高く盛り上がった、でこぼこの土地です。"}, {"t": 134.55, "x": "小さな穴が重なり合うように並んでいます。"}, {"t": 137.36666666666667, "x": "黒っぽい所は、低くて平らな土地です。"}, {"t": 140.25, "x": "こちらは穴の数が少なめです。"}, {"t": 142.36666666666667, "x": "この平らな土地の多くは、巨大な穴の底にあります。"}, {"t": 146.03333333333333, "x": "天体がぶつかってできたくぼみです。"}, {"t": 148.26666666666668, "x": "くぼみの底に、あとから溶岩が流れこみました。"}, {"t": 151.56666666666666, "x": "溶岩は冷えて黒い玄武岩になりました。"}, {"t": 154.2, "x": "だから黒く平らに見えるのです。"}, {"t": 156.16666666666666, "x": "大きな穴の一つに、雨の海があります。"}, {"t": 159.26666666666668, "x": "満月の左上に見える、丸く黒い所です。"}, {"t": 162.93333333333334, "x": "そのそばには、晴れの海もあります。"}, {"t": 165.5, "x": "どちらも天体の衝突でできた大きな穴です。"}, {"t": 168.56666666666666, "x": "2023年の論文では、知られている"}, {"t": 171.7, "x": "大きな穴はおよそ50とされています。"}, {"t": 174.1, "x": "大きな穴は表側にも裏側にもあります。"}, {"t": 177.03333333333333, "x": "月には空気がありません。水が流れることもありません。"}, {"t": 180.68333333333334, "x": "風が吹くこともありません。"}, {"t": 182.41666666666666, "x": "地面が大きく動くこともほとんどありません。"}, {"t": 185.21666666666667, "x": "一度できた穴は消えません。ずっと残ります。"}, {"t": 188.4, "x": "月の表面は、昔の衝突をそのまま残しているのです。"}, {"t": 192.53333333333333, "x": "穴の重なり方を見ると、どちらが先かが分かります。"}, {"t": 196.31666666666666, "x": "あとの穴は、前の穴を壊しているからです。"}, {"t": 199.5, "x": "こうして大きな穴の順番が組み立てられてきました。"}, {"t": 202.58333333333334, "x": "ただし順番が分かっても、年代までは分かりません。"}, {"t": 206.18333333333334, "x": "何百万年前なのか、何億年前なのか。"}, {"t": 209.63333333333333, "x": "それは穴を見ているだけでは決まりません。"}, {"t": 212.06666666666666, "x": "何年前かを知るには、石そのものを測るしかありません。"}, {"t": 215.98333333333332, "x": "月の石を手に取らなければ、年代は決められないのです。"}, {"t": 219.76666666666668, "x": "では、その石はどうやって地球に届いたのでしょうか。"}, {"t": 223.43333333333334, "x": "次の章では、月に降りた6回の旅をたどります。"}, {"t": 226.96666666666667, "x": "1969年7月アポロ11号が月に降りました。"}, {"t": 231.28333333333333, "x": "人が初めて月の地面に立ったのです。"}, {"t": 233.78333333333333, "x": "アポロ計画では、そのあとも着陸が続きました。"}, {"t": 237.26666666666668, "x": "全部で6回です。12号、14号、"}, {"t": 240.98333333333332, "x": "15号、16号、17号です。"}, {"t": 244.23333333333332, "x": "13号は、途中で酸素のタンクが壊れました。"}, {"t": 247.73333333333332, "x": "そのため月には降りずに地球へ戻りました。"}, {"t": 250.53333333333333, "x": "月に降りたのは合わせて6回です。"}, {"t": 252.8, "x": "最後の17号は、1972年12月に月を離れました。"}, {"t": 257.95, "x": "6回で持ち帰ったのは2196個の石や砂です。"}, {"t": 261.95, "x": "重さは合わせて382キログラムになります。"}, {"t": 265.31666666666666, "x": "大人5人分あまりの重さです。"}, {"t": 267.51666666666665, "x": "大きな岩もあります。小石もあります。"}, {"t": 270.25, "x": "筒を地面に打ちこんで抜いた、細長い土の柱もあります。"}, {"t": 274.4166666666667, "x": "細かい砂やちりもあります。"}, {"t": 276.31666666666666, "x": "旧ソビエトの無人の探査機ルナも、"}, {"t": 278.5833333333333, "x": "月の砂を持ち帰りました。アポロの"}, {"t": 280.95, "x": "石は、アメリカのヒューストンの施設で保管されています。"}, {"t": 284.8333333333333, "x": "世界中の研究者がその一部を借りて調べてきました。"}, {"t": 288.4, "x": "50年以上にわたって、調べ続けられてきたのです。"}, {"t": 292.2, "x": "石の多くはひとかたまりの岩ではありません。"}, {"t": 294.95, "x": "砕けた岩のかけらが押し固められた石です。"}, {"t": 297.71666666666664, "x": "大きな衝突で砕かれ、熱でくっついた石もあります。"}, {"t": 301.5, "x": "衝突の熱で、一度どろどろに溶けた石もあります。"}, {"t": 305.18333333333334, "x": "溶けた石は、固まると時計を刻みはじめます。"}, {"t": 308.46666666666664, "x": "石の中には、少しずつ別の元素に変わる元素があります。"}, {"t": 312.56666666666666, "x": "ウランは長い時間をかけて鉛に変わります。"}, {"t": 315.4, "x": "カリウムの一部は、アルゴンという気体に変わります。"}, {"t": 318.9166666666667, "x": "変わる速さは決まっています。"}, {"t": 320.81666666666666, "x": "急に速くなることも、遅くなることもありません。"}, {"t": 324.03333333333336, "x": "砂時計の砂が落ちるのに似ています。"}, {"t": 326.53333333333336, "x": "元の元素と変わった元素の割合を測ります。"}, {"t": 329.53333333333336, "x": "そうすれば年代が出せます。"}, {"t": 331.4166666666667, "x": "溶けた石を測れば溶けたときが分かります。"}, {"t": 334.01666666666665, "x": "つまり衝突のときが分かるのです。"}, {"t": 336.25, "x": "月の石は、衝突の時刻を知る手がかりになりました。"}, {"t": 339.95, "x": "ただしここに一つ気をつけることがあります。"}, {"t": 342.51666666666665, "x": "6回の着陸の場所は、どれも月の表側にありました。"}, {"t": 346.5833333333333, "x": "しかも赤道に近い場所に集まっていました。"}, {"t": 349.3833333333333, "x": "この場所のかたよりがあとで大きな問題になります。"}, {"t": 352.45, "x": "それは第8章で見ていきます。アポロの石が届きました。"}, {"t": 356.3, "x": "すると、各地で年代の測定が始まりました。"}, {"t": 359.6666666666667, "x": "アメリカのカリフォルニア工科大学にも石が届きました。"}, {"t": 363.0833333333333, "x": "そこで調べたのは、テラ、パパナスタシュー、"}, {"t": 366.4, "x": "ワッサーバーグの3人です。"}, {"t": 368.8333333333333, "x": "3人は月の高地の石を調べました。"}, {"t": 371.55, "x": "数は18個です。どれも白っぽい高地の石です。"}, {"t": 375.1166666666667, "x": "離れた場所で拾われた石です。"}, {"t": 377.2, "x": "3人はウランと鉛の割合を細かく測りました。"}, {"t": 380.48333333333335, "x": "すると多くの石が一本の線の上に並びました。"}, {"t": 383.65, "x": "その線が示す年代は、およそ39億年前でした。"}, {"t": 387.9, "x": "月が生まれて6億年ほどあとのころです。"}, {"t": 390.51666666666665, "x": "3人は別の物差しも使いました。"}, {"t": 392.98333333333335, "x": "ルビジウムとストロンチウムです。"}, {"t": 394.96666666666664, "x": "こちらでは、38億5000万年前から"}, {"t": 398.18333333333334, "x": "40億年前の年代が出ました。"}, {"t": 400.4166666666667, "x": "離れた場所の石が同じころを指していたのです。"}, {"t": 403.35, "x": "3人はこれを一つの出来事と考えました。"}, {"t": 406.26666666666665, "x": "39億年前ごろ、月は激しい衝突にさらされた。"}, {"t": 410.55, "x": "その熱で石の中の鉛が動いた。"}, {"t": 412.93333333333334, "x": "石の時計が一斉にやり直された。"}, {"t": 415.31666666666666, "x": "3人はこれを、月の終わりの大異変と呼びました。"}, {"t": 418.9, "x": "論文が出たのは1974年4月です。"}, {"t": 422.26666666666665, "x": "地球と惑星の研究の専門誌でした。"}, {"t": 425.0833333333333, "x": "ただし3人は、別の見方もはっきり書いていました。"}, {"t": 428.6, "x": "月の中でできたマグマの働きでも、同じことは起こりうる。"}, {"t": 432.5, "x": "その見方は捨てきれない、というのです。"}, {"t": 435.26666666666665, "x": "それでも衝突の集中という考えは、"}, {"t": 437.9166666666667, "x": "広く受け入れられました。そのあとも"}, {"t": 440.45, "x": "月の石の年代は次々と測られました。"}, {"t": 443.0, "x": "測る人も、測る方法も増えていきました。"}, {"t": 446.18333333333334, "x": "アルゴンを使った年代も、39億年前ごろに"}, {"t": 449.95, "x": "多く集まりました。大きな穴の"}, {"t": 451.98333333333335, "x": "年代にも近い値が出されました。たとえば雨の海の穴です。"}, {"t": 456.03333333333336, "x": "アポロ14号などの石からは、39億2000万年前から"}, {"t": 460.46666666666664, "x": "39億4000万年前とされています。"}, {"t": 463.4166666666667, "x": "2017年の総まとめの論文は、これを"}, {"t": 466.65, "x": "今のいちばんよい見積もりとしています。"}, {"t": 468.8666666666667, "x": "短い時間に、大きな穴がまとめてできた。"}, {"t": 471.98333333333335, "x": "そう考えると、多くの年代がうまく説明できました。"}, {"t": 475.76666666666665, "x": "こうして後期の重爆撃という言葉が広まっていきました。"}, {"t": 479.28333333333336, "x": "月が生まれてもう5億年以上がたっていました。"}, {"t": 482.1666666666667, "x": "惑星の材料のかけらは少なくなっていたはずです。"}, {"t": 485.3, "x": "なのになぜその時期にたくさん降ってきたのか。"}, {"t": 487.9166666666667, "x": "この謎は第7章で取り上げます。"}, {"t": 490.18333333333334, "x": "その前に、地球のほうを見てみます。"}, {"t": 492.98333333333335, "x": "月と地球は宇宙の中ではすぐ隣どうしです。"}, {"t": 496.06666666666666, "x": "月に天体が降った時代には地球にも降っていたはずです。"}, {"t": 499.68333333333334, "x": "しかも地球は月よりずっと大きく、重さもあります。"}, {"t": 503.46666666666664, "x": "重いものはまわりの天体を強く引き寄せます。"}, {"t": 506.45, "x": "だから地球にぶつかる天体は、月より多くなります。"}, {"t": 510.15, "x": "2017年の総まとめの論文は、"}, {"t": 512.6833333333333, "x": "その割合をおよそ20倍としています。"}, {"t": 515.4833333333333, "x": "月に大きな穴が一つできるあいだに、地球には20個ほど。"}, {"t": 519.6833333333333, "x": "そういう見積もりです。ぶつかる天体も"}, {"t": 522.15, "x": "地球のほうが大きくなりがちです。"}, {"t": 524.3333333333334, "x": "2014年、ある計算が発表されました。"}, {"t": 527.75, "x": "アメリカのサウスウエスト研究所などのチームです。"}, {"t": 530.85, "x": "月と地球の記録から大昔の衝突をたどる計算です。"}, {"t": 534.6833333333333, "x": "月の穴の数をもとに、地球の衝突の数を見積もったのです。"}, {"t": 539.05, "x": "その計算では、40億年前より前の地球はこうなります。"}, {"t": 543.5166666666667, "x": "幅1000キロ近い天体が、平均で1個から4個ぶつかった。"}, {"t": 547.8833333333333, "x": "地球の表面をすべて焼くほどの大きさです。"}, {"t": 550.85, "x": "幅500キロ近い天体は、平均で3個から7個。"}, {"t": 554.8333333333334, "x": "地球の海をすべて蒸発させるほどの大きさです。"}, {"t": 558.0666666666667, "x": "比べるために、6600万年前の天体を思い出してください。"}, {"t": 562.5833333333334, "x": "恐竜の時代を終わらせた、メキシコの天体です。"}, {"t": 566.0333333333333, "x": "その幅は、およそ10キロと見積もられています。"}, {"t": 569.3, "x": "桁が二つ違う天体が地球にぶつかっていたことになります。"}, {"t": 573.0833333333334, "x": "チームを率いたマーキさんは、こう述べました。"}, {"t": 576.2166666666667, "x": "40億年前より前のことです。"}, {"t": 578.55, "x": "地球の表面の広い場所で、衝突を"}, {"t": 581.4666666666667, "x": "受けずに残った所はなかった。"}, {"t": 583.4, "x": "衝突の熱で溶けた岩が地表を何度もおおった。"}, {"t": 586.5833333333334, "x": "その岩がもとの地面を埋めていった。"}, {"t": 588.9166666666666, "x": "チームは、そう考えています。"}, {"t": 591.3333333333334, "x": "この計算では、衝突で地球に加わった重さは"}, {"t": 594.8666666666667, "x": "今の地球の1％より少 : 714.8333333333334, "x": "えた、とも書いています。では、住める"}, {"t": 717.4666666666667, "x": "場所は本当に残っていたのでしょうか。"}, {"t": 720.1166666666667, "x": "2009年、アメリカのコロラド大学の"}, {"t": 723.0333333333333, "x": "2人がこの問いに取り組みました。"}, {"t": 724.8666666666667, "x": "2人は、衝突で地面がどれだけ熱くなるかを計算しました。"}, {"t": 729.0833333333334, "x": "衝突を10倍に強めた計算も試しました。"}, {"t": 732.2, "x": "その結果は、こうです。溶けた岩は"}, {"t": 735.1166666666667, "x": "地球の表面の岩の25％より少ない。"}, {"t": 738.2, "x": "どんなに厳しい条件でも、地球が"}, {"t": 740.8666666666667, "x": "すべて焼かれることはなかった。2人はそう結論しました。"}, {"t": 744.4333333333333, "x": "地下の熱い水がわく場所は、むしろ広がったかもしれない。"}, {"t": 748.2333333333333, "x": "そこが、熱に強い小さな生き物のすみかになった。"}, {"t": 751.8333333333334, "x": "2人はそう考えました。海はすべて煮えたのか。"}, {"t": 755.0833333333334, "x": "それとも一部が熱くなっただけなのか。"}, {"t": 757.4833333333333, "x": "答えは、ぶつかった天体の大きさと数で変わります。"}, {"t": 761.1666666666666, "x": "そしてその数を決める手がかりは、"}, {"t": 763.2333333333333, "x": "今の地球にはほとんどありません。"}, {"t": 765.65, "x": "月には大昔の穴がたくさん残っています。"}, {"t": 768.5666666666667, "x": "ところが、地球では40億年前の穴は見つかっていません。"}, {"t": 772.9, "x": "なぜでしょうか。理由の一つは"}, {"t": 774.9833333333333, "x": "地球の表面が動き続けていることです。"}, {"t": 777.6666666666666, "x": "地球の表面は、何枚もの大きな岩の板でできています。"}, {"t": 781.7666666666667, "x": "板はゆっくりと動いています。"}, {"t": 783.75, "x": "海の底の板は地球の中に沈んでいきます。"}, {"t": 786.7333333333333, "x": "そのため海の底にはとても古い岩は残りません。"}, {"t": 789.9666666666667, "x": "陸の岩も山になります。そして削られ、また積もります。"}, {"t": 794.0833333333334, "x": "もう一つの理由は雨と風と川です。"}, {"t": 796.6833333333333, "x": "地球では水が岩を少しずつ削っていきます。"}, {"t": 799.6833333333333, "x": "大きな穴も長い時間がたてば平らになります。"}, {"t": 802.6, "x": "2014年のチームは、もう一つの理由も挙げています。"}, {"t": 806.5833333333334, "x": "衝突で溶けた岩が、古い地面を何度も埋めたことです。"}, {"t": 810.5333333333333, "x": "40億年より古い岩がほとんど"}, {"t": 812.7833333333333, "x": "見つからないのは、そのためかもしれません。"}, {"t": 815.5, "x": "月には空気も水もないので、穴が残ります。"}, {"t": 818.8666666666667, "x": "地球には空気と水があるので、穴が消えていきます。"}, {"t": 822.6166666666667, "x": "では、40億年より前の手がかりは何もないのでしょうか。"}, {"t": 826.7833333333333, "x": "一つだけとても小さな手がかりがあります。"}, {"t": 829.4333333333333, "x": "ジルコンと 3, "x": "フランスの研究者4人の論文です。"}, {"t": 950.1666666666666, "x": "ネイチャーの同じ号に、関連する"}, {"t": 952.5833333333334, "x": "論文が3本そろって載りました。"}, {"t": 954.65, "x": "その一本が、遅れて降った天体のわけを説明したものです。"}, {"t": 958.9833333333333, "x": "考えの中心は外側の大きな惑星です。"}, {"t": 962.1666666666666, "x": "木星や土星など、外側の4つの大きな惑星です。"}, {"t": 966.15, "x": "4つの惑星は生まれたあと、"}, {"t": 968.0666666666667, "x": "長いあいだ静かに回っていました。"}, {"t": 970.4666666666667, "x": "その外側には、小さな天体がたくさん回っていました。"}, {"t": 974.4333333333333, "x": "あるとき、木星と土星の回る周期の関係が変わりました。"}, {"t": 978.5833333333334, "x": "すると惑星どうしの引き合いが乱れました。"}, {"t": 981.2, "x": "大きな惑星の通り道がずれたのです。"}, {"t": 983.8, "x": "そのずれが、外側の小さな天体の群れをかき乱しました。"}, {"t": 987.9666666666667, "x": "天体の一部は太陽系の内側へ飛びこみました。"}, {"t": 991.35, "x": "そして月や地球にぶつかった。"}, {"t": 993.4666666666667, "x": "この考えでは、それが起きたのは"}, {"t": 995.7833333333333, "x": "惑星が生まれて7億年ほどあとです。"}, {"t": 998.2166666666667, "x": "これなら遅れて降った天体の説明がつきます。"}, {"t": 1001.2833333333333, "x": "この考えは、外側の太陽系の今の姿もよく説明できました。"}, {"t": 1006.1, "x": "惑星の通り道や、小さな天体の散らばり方です。"}, {"t": 1010.0, "x": "そのため、研究の世界で大きな影響を"}, {"t": 1013.1333333333333, "x": "持つ考えになりました。ただ通り道が"}, {"t": 1015.5, "x": "ずれた時期には、別の見方も出てきました。"}, {"t": 1018.3, "x": "2019年、アメリカのコロラド大学などの"}, {"t": 1021.6166666666667, "x": "研究者が論文を出しました。"}, {"t": 1023.5333333333333, "x": "地球、月、火星、隕石のもとの"}, {"t": 1027.5166666666667, "x": "天体の年代を調べた論文です。"}, {"t": 1029.8166666666666, "x": "44億5000万年前より後の年代を見ます。"}, {"t": 1033.45, "x": "すると、表面の岩がまるごとやり直された跡がない。"}, {"t": 1037.2, "x": "そこで、惑星の動きは44億8000万年前ごろに"}, {"t": 1041.6166666666666, "x": "始まったと考えました。その計算では、氷の天体が"}, {"t": 1045.55, "x": "およそ3000万年のあいだ集中して降ったとされます。"}, {"t": 1048.9166666666667, "x": "39億年前よりずっと前です。"}, {"t": 1051.65, "x": "動いた時期が早ければ、39億年前の"}, {"t": 1054.9666666666667, "x": "集中は説明しにくくなります。"}, {"t": 1057.0666666666666, "x": "惑星の動きの計算は、今も続いています。"}, {"t": 1060.5166666666667, "x": "ここまでの話には一つの前提があります。"}, {"t": 1063.4, "x": "月の石の年代が本当に集まっているという前提です。"}, {"t": 1067.0833333333333, "x": "次の章ではその前提を見直します。"}, {"t": 1069.7333333333333, "x": "第2章で着陸の場所がかたよっていたと話   while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
