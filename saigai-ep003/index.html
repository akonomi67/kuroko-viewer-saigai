<script>
const D={"name": "ep003", "file": "ep003", "dur": 1991.4833125, "segs": [], "subs": [{"t": 0.0, "x": "ワシントン州の東部に、水の流れていない滝があります。"}, {"t": 3.966666666666667, "x": "崖の高さは、およそ百二十メートル。"}, {"t": 6.916666666666667, "x": "崖の縁は、横に五キロメートル以上続いています。"}, {"t": 10.566666666666666, "x": "州の地質を調べる機関は、その幅を"}, {"t": 13.516666666666667, "x": "ナイアガラの滝のおよそ四倍と説明しています。"}, {"t": 16.483333333333334, "x": "けれども、この崖の上から水が"}, {"t": 18.8, "x": "落ちてくることはありません。"}, {"t": 20.316666666666666, "x": "崖の上に、川が無いからです。"}, {"t": 22.916666666666668, "x": "崖の下には、落ちる水に掘られた"}, {"t": 25.516666666666666, "x": "深い穴が、いくつも残っています。"}, {"t": 28.016666666666666, "x": "水が落ちていた跡だけが、乾いた土地の上に残っています。"}, {"t": 32.1, "x": "名前はドライ・フォールズ。"}, {"t": 32.55, "x": "ドライ・フォールズ█"}, {"t": 34.05, "x": "乾いた滝、という意味です。"}, {"t": 36.35, "x": "この滝に水を送っていたのは、"}, {"t": 38.25, "x": "近くを流れる川ではありませんでした。"}, {"t": 40.96666666666667, "x": "東の山あい、いまのモンタナ州に広がっていた湖です。"}, {"t": 45.166666666666664, "x": "その湖は、氷の壁でせき止められていました。"}, {"t": 48.71666666666667, "x": "氷の壁が壊れると、湖の水が"}, {"t": 51.56666666666667, "x": "いっせいに西へあふれ出します。"}, {"t": 53.38333333333333, "x": "あふれた水は、ワシントン州の東部を横切り、"}, {"t": 56.733333333333334, "x": "大地を削り、太平洋まで走りました。"}, {"t": 60.233333333333334, "x": "しばらくすると、氷の壁はまたでき上がり、"}, {"t": 63.333333333333336, "x": "湖はまた満ちていきます。そして、また壊れます。"}, {"t": 67.51666666666667, "x": "これが、何十回も繰り返されました。"}, {"t": 70.4, "x": "いまからおよそ二万年前から、"}, {"t": 72.3, "x": "一万四千年前にかけての出来事です。"}, {"t": 75.36666666666666, "x": "削られた土地は、いまチャネルド・スキャブランドと"}, {"t": 76.91666666666667, "x": "チャネルド・スキャブランド█"}, {"t": 79.13333333333334, "x": "呼ばれています。広さは、およそ三万平方キロメートル。"}, {"t": 83.41666666666667, "x": "ワシントン州の陸地の、およそ六分の一に当たります。"}, {"t": 87.15, "x": "この土地が洪水で削られたと"}, {"t": 88.93333333333334, "x": "認められるまでには、四十年ほどかかりました。"}, {"t": 92.06666666666666, "x": "湖がひとつ決壊するたびに、"}, {"t": 94.1, "x": "州の地面が削られていった記録です。"}, {"t": 96.75, "x": "主語は、氷と、湖の水と、削られた大地です。"}, {"t": 101.33333333333333, "x": "ワシントン州の東部は、黒い岩の"}, {"t": 104.0, "x": "台地です。この岩は、玄武岩です。"}, {"t": 106.85, "x": "およそ千七百万年前から六百万年前にかけて、"}, {"t": 110.45, "x": "地面の割れ目からあふれた溶岩が固まったものです。"}, {"t": 113.81666666666666, "x": "溶岩は一度に出たのではなく、"}, {"t": 115.75, "x": "何度にも分かれて流れ出しました。"}, {"t": 118.13333333333334, "x": "重なった溶岩の層は、三百五十枚を"}, {"t": 121.25, "x": "超えると報告されています。"}, {"t": 122.95, "x": "コロンビア川玄武岩と呼ばれる、"}, {"t": 125.01666666666667, "x": "世界でも有数の溶岩の台地です。"}, {"t": 127.81666666666666, "x": "その黒い岩の上を、細かい土が覆っています。"}, {"t": 131.38333333333333, "x": "風に運ばれ、長い時間をかけて積もった土です。"}, {"t": 135.05, "x": "この土は、地質学の言葉でレスと呼ばれます。"}, {"t": 138.33333333333334, "x": "粒がそろっていて柔らかく、なだらかな丘をつくります。"}, {"t": 142.21666666666667, "x": "州の東の端には、この土でできた丘が"}, {"t": 145.36666666666667, "x": "波のように続く地域があります。"}, {"t": 147.45, "x": "ところが、その丘の連なりが、"}, {"t": 149.66666666666666, "x": "ところどころで途切れています。"}, {"t": 151.65, "x": "途切れた場所では、土がはぎ取られ、"}, {"t": 154.08333333333334, "x": "下の黒い岩がむき出しになっています。"}, {"t": 156.9, "x": "むき出しの岩は、でこぼこに削られ、"}, {"t": 159.38333333333333, "x": "深い溝や穴が縦横に走っています。"}, {"t": 162.28333333333333, "x": "溝は、ときに網の目のように分かれ、また合流します。"}, {"t": 166.46666666666667, "x": "土が残った部分は、細長い島のように取り残されています。"}, {"t": 170.7, "x": "その島は、上流側が丸く、下流側が細くなっています。"}, {"t": 175.48333333333332, "x": "水の流れの中に置かれた砂の山と、同じ形です。"}, {"t": 179.23333333333332, "x": "この荒れた土地は、スキャブランドと呼ばれています。"}, {"t": 182.45, "x": "スキャブとは、かさぶたのことです。"}, {"t": 184.81666666666666, "x": "緑の丘の中に、かさぶたのように"}, {"t": 187.28333333333333, "x": "黒い岩が露出しているからです。"}, {"t": 189.28333333333333, "x": "この呼び名で土地を記し、名前として"}, {"t": 192.05, "x": "広めたのは、1923年の論文でした。"}, {"t": 195.66666666666666, "x": "削り跡の深さを見てみます。"}, {"t": 197.61666666666667, "x": "土の層は、およそ六十メートルの"}, {"t": 200.2, "x": "厚さで削り取られていました。"}, {"t": 201.95, "x": "その下の玄武岩も、場所によって"}, {"t": 204.46666666666667, "x": "六十メートルほどの深さまで掘られていました。"}, {"t": 207.21666666666667, "x": "乾いた谷もあります。この地方では、急な崖に囲まれた、"}, {"t": 211.51666666666668, "x": "水の無い谷をクーリーと呼びます。"}, {"t": 213.75, "x": "最も大きいのが、グランド・クーリーです。"}, {"t": 215.31666666666666, "x": "グランド・クーリー█"}, {"t": 217.65, "x": "その上流側は、垂直な崖に挟まれた溝で、"}, {"t": 221.18333333333334, "x": "幅はおよそ二キロメートル。"}, {"t": 223.11666666666667, "x": "深さは、およそ二百五十メートルあります。"}, {"t": 226.21666666666667, "x": "いまの川は、この谷を流れていません。"}, {"t": 229.01666666666668, "x": "冒頭のドライ・フォールズは、"}, {"t": 230.56666666666666, "x": "このグランド・クーリーの途中にあります。"}, {"t": 233.13333333333333, "x": "研究によれば、この滝は、もとは南の方にありました。"}, {"t": 237.41666666666666, "x": "流れ落ちる水が崖の根元を削り、崖が少しずつ"}, {"t": 241.21666666666667, "x": "崩れて、滝の位置が上流へ移っていきました。"}, {"t": 244.4, "x": "移った距離は、およそ三十キロメートルとされています。"}, {"t": 248.2, "x": "そして滝の上流でも、別の滝が、"}, {"t": 250.88333333333333, "x": "四十キロメートル近く北へさかのぼっていました。"}, {"t": 254.16666666666666, "x": "その滝は、最後にはコロンビア川の谷まで削り"}, {"t": 257.4, "x": "抜けています。削られた跡は、ほかにもあります。"}, {"t": 260.93333333333334, "x": "パルース川という川は、かつては西の谷を流れていました。"}, {"t": 264.95, "x": "ところが洪水の水があふれ、"}, {"t": 266.8333333333333, "x": "南へ抜ける新しい道が削られました。"}, {"t": 269.76666666666665, "x": "川はその道に移り、いまは南の"}, {"t": 272.45, "x": "スネーク川へ流れこんでいます。"}, {"t": 274.3666666666667, "x": "川の行き先そのものが、書き換えられたということです。"}, {"t": 277.8833333333333, "x": "台地の上には、まわりに無い種類の岩が、"}, {"t": 280.78333333333336, "x": "ぽつんと置かれている場所もあります。"}, {"t": 283.1166666666667, "x": "近くの岩とは、種類が違います。"}, {"t": 285.81666666666666, "x": "どこか遠くから運ばれてきた岩です。"}, {"t": 288.2, "x": "削られた溝、取り残された丘、"}, {"t": 290.65, "x": "乾いた滝、川の付け替え、遠くの岩。"}, {"t": 294.48333333333335, "x": "どれも、大量の水が一度に流れたと"}, {"t": 297.25, "x": "考えると説明がつきます。問題は、"}, {"t": 299.81666666666666, "x": "それだけの水がどこから来たのか、でした。"}, {"t": 303.01666666666665, "x": "この土地の成り立ちを、洪水で"}, {"t": 305.1666666666667, "x": "説明しようとした地質学者がいます。"}, {"t": 307.6, "x": "J・ハーレン・ブレッツ█"}, {"t": 307.6, "x": "J・ハーレン・ブレッツです。"}, {"t": 310.93333333333334, "x": "1922年、ブレッツはシカゴ大学の助教授でした。"}, {"t": 315.3833333333333, "x": "年齢は三十九歳です。この年から、"}, {"t": 318.3333333333333, "x": "ワシントン州の東部で、合わせて"}, {"t": 321.0833333333333, "x": "八回の野外調査の季節を過ごしています。"}, {"t": 323.8666666666667, "x": "ブレッツが翌1923年に出した最初の論文は、"}, {"t": 327.71666666666664, "x": "削られた土地の様子を細かく記したものでした。"}, {"t": 330.9166666666667, "x": "削られた岩の溝、流線形に残った土の"}, {"t": 334.03333333333336, "x": "丘、層になって積もった砂利。"}, {"t": 336.15, "x": "ブレッツは、これらを一つの"}, {"t": 338.1333333333333, "x": "大きな洪水の跡だと書きました。"}, {"t": 340.2, "x": "同じ年の二本目の論文では、"}, {"t": 342.21666666666664, "x": "その洪水を「大災厄」という強い言葉で呼んでいます。"}, {"t": 347.01666666666665, "x": "当初、ブレッツはこれをスポーケン洪水と呼んでいました。"}, {"t": 350.81666666666666, "x": "この考えは、強い反発を受けました。"}, {"t": 353.76666666666665, "x": "当時の地質学には、ひとつの大きな前提がありました。"}, {"t": 357.5833333333333, "x": "いま目の前で起きている作用と、同じ速さの"}, {"t": 360.55, "x": "作用で、過去も説明できる、という考え方です。"}, {"t": 364.46666666666664, "x": "川はゆっくり谷を削り、谷はゆっくり広がる。"}, {"t": 368.06666666666666, "x": "何百万年をかければ、どんな地形でもできる。"}, {"t": 371.4166666666667, "x": "この前提から見ると、ひとつの洪水が州の地面を"}, {"t": 374.9166666666667, "x": "削ったという説明は、受け入れにくいものでした。"}, {"t": 378.21666666666664, "x": "反発の中心にいたのは、アメリカ地質調査所の"}, {"t": 381.76666666666665, "x": "研究者たちです。1927年の1月、"}, {"t": 385.03333333333336, "x": "首都ワシントンの地質学会の"}, {"t": 387.53333333333336, "x": "会合で、ブレッツは自分の説を発表しました。"}, {"t": 390.98333333333335, "x": "その場で、地質調査所の上級研究者たちが"}, {"t": 394.4, "x": "次々に異論を出しました。異論の中には、小さく、すぐに"}, {"t": 398.8666666666667, "x": "答えられるものもありました。"}, {"t": 400.46666666666664, "x": "ただ、答えにくいものが二つありました。一つ目は、"}, {"t": 404.1666666666667, "x": "それほどの水がどこから来たのか、という点です。"}, {"t": 407.7, "x": "二つ目は、たった一度の洪水で、これほど"}, {"t": 411.05, "x": "広く速く削れるのか、という点です。"}, {"t": 413.78333333333336, "x": "一つ目の問いには、実はすでに答えの候補がありました。"}, {"t": 417.71666666666664, "x": "それは、次の章で扱います。"}, {"t": 420.25, "x": "けれども、この会合では決着しませんでした。"}, {"t": 423.51666666666665, "x": "論争は、1930年代に入っても続きます。"}, {"t": 427.56666666666666, "x": "なかでも強く反対したのが、イェール大学の"}, {"t": 430.9, "x": "リチャード・フォスター・フリントでした。"}, {"t": 432.7, "x": "フリントは、1938年に別の説明を出しています。"}, {"t": 437.3, "x": "スキャブランドの溝は、ふつうの量の水が"}, {"t": 440.1333333333333, "x": "流れる川が、長い時間をかけて削ったものだ。"}, {"t": 443.35, "x": "ブレッツが洪水の跡と呼んだ砂利の"}, {"t": 445.4166666666667, "x": "高まりは、川の段丘にすぎない。そういう内容でした。"}, {"t": 449.55, "x": "ほかにも、下流が氷でふさがれ、水が行き場を"}, {"t": 453.2, "x": "失ってあふれ続けた、という説明も出されています。"}, {"t": 456.75, "x": "どの説明にも共通していたのは、一度に"}, {"t": 459.78333333333336, "x": "起きる大災害を避けようとしたことです。"}, {"t": 462.21666666666664, "x": "2020年に出た総説論文は、"}, {"t": 464.6166666666667, "x": "この論争を振り返って、こう書いています。"}, {"t": 467.96666666666664, "x": "論争が四十年も続いたのは、"}, {"t": 470.1333333333333, "x": "証拠が足りなかったからではない。"}, {"t": 472.31666666666666, "x": "大事な観察は、1930年までにほとんど出そろっていた。"}, {"t": 476.96666666666664, "x": "ブレッツは頑固で、フリントは力を持っていた。"}, {"t": 480.31666666666666, "x": "そして当時の学界の主流にとって、"}, {"t": 482.7, "x": "大洪水は「ありえないこと」だった。"}, {"t": 486.5833333333333, "x": "証拠は、地面の上にずっと並んでいました。"}, {"t": 489.8333333333333, "x": "それでも、その証拠を洪水として読む人は、少数でした。"}, {"t": 494.3, "x": "足りなかったのは、水の出どころを"}, {"t": 496.46666666666664, "x": "示す、もう一つの証拠でした。"}, {"t": 498.96666666666664, "x": "水の出どころを指していたのは、"}, {"t": 500.73333333333335, "x": "地質調査所の側にいた研究者でした。"}, {"t": 503.7, "x": "ジョセフ・パーディー█"}, {"t": 503.7, "x": "ジョセフ・パーディーです。"}, {"t": 506.05, "x": "パーディーは1910年の時点で、モンタナ州の西部に、"}, {"t": 510.25, "x": "かつて巨大な湖があったことを論文にしていました。"}, {"t": 513.8333333333334, "x": "いまのミズーラという町のまわりの山の"}, {"t": 516.05, "x": "斜面に、横向きの線が何本も刻まれています。"}, {"t": 519.55, "x": "湖の水面が、長いあいだ同じ高さに"}, {"t": 522.6166666666667, "x": "とどまったときに、波が削った岸の跡です。"}, {"t": 525.7333333333333, "x": "その線は、町の東にあるジャンボ山の斜面で、"}, {"t": 529.2833333333333, "x": "標高千二百九十五メートルの高さまで続いています。"}, {"t": 533.3, "x": "いまの谷底よりはるかに上です。"}, {"t": 535.45, "x": "谷全体が、その高さまで水で"}, {"t": 537.9, "x": "満たされていたことを示しています。"}, {"t": 539.8666666666667, "x": "この湖が、ミズーラ氷河湖です。"}, {"t": 541.05, "x": "ミズーラ氷河湖█"}, {"t": 543.4, "x": "では、何が水をせき止めていたのか。"}, {"t": 546.1333333333333, "x": "答えは、北から来た氷です。"}, {"t": 548.55, "x": "最終氷期、北アメリカの北西部は、コルディレラ氷床と"}, {"t": 552.9166666666666, "x": "呼ばれる厚い氷に覆われていました。"}, {"t": 555.1666666666666, "x": "その氷の一部が、細長い舌のように南へ伸びていました。"}, {"t": 559.4333333333333, "x": "パーセル・トレンチと呼ばれる谷に"}, {"t": 561.1166666666667, "x": "沿って、南へ流れ下った氷です。"}, {"t": 563.85, "x": "この氷の舌が、いまのアイダホ州北部にある"}, {"t": 567.0333333333333, "x": "ペンド・オレイル湖の窪地を埋めました。"}, {"t": 569.1333333333333, "x": "そこは、クラークフォーク川という"}, {"t": 571.4833333333333, "x": "川の出口に当たる場所でした。"}, {"t": 573.3833333333333, "x": "出口を氷でふさがれた川の水は、行き場を"}, {"t": 576.6, "x": "失い、上流の谷にたまっていきます。"}, {"t": 579.3333333333334, "x": "氷の厚さは、およそ一キロメートルに"}, {"t": 582.1, "x": "達したと見積もられています。"}, {"t": 583.7666666666667, "x": "この氷の壁の裏で、湖はどこまで大きくなったのか。"}, {"t": 587.8166666666667, "x": "最も水位が高かったとき、湖の"}, {"t": 590.6333333333333, "x": "面積はおよそ一万七百平方キロメートル。"}, {"t": 593.75, "x": "水の量は、およそ二千五百立方キロメートルでした。"}, {"t": 597.55, "x": "氷のダムの手前での深さは、"}, {"t": 599.4333333333333, "x": "六百五十メートル以上あったとされています。"}, {"t": 602.4833333333333, "x": "日本の琵琶湖と比べてみます。"}, {"t": 604.5, "x": "琵琶湖の水の量は、およそ二百七十五億立方メートル、"}, {"t": 608.5333333333333, "x": "つまり二十七・五立方キロメートルです。"}, {"t": 611.55, "x": "ミズーラ氷河湖は、その九十杯分ほどの水を、"}, {"t": 615.0333333333333, "x": "氷一枚でせき止めていたことになります。"}, {"t": 617.8, "x": "広さでいえば、琵琶湖の十六倍ほどです。"}, {"t": 620.8666666666667, "x": "アメリカ国立公園局は、この水の量を、エリー湖と"}, {"t": 624.9666666666667, "x": "オンタリオ湖を合わせたほどと説明しています。"}, {"t": 627.5833333333334, "x": "1940年、シアトルで開かれた学会で、"}, {"t": 631.35, "x": "パーディーはある発表をしました。"}, {"t": 633.55, "x": "題名は「ミズーラ氷河湖の、波の跡？」。"}, {"t": 637.0333333333333, "x": "題名の中に、疑問符が付いていました。"}, {"t": 639.9833333333333, "x": "パーディーが示したのは、湖の底だった場所に"}, {"t": 643.1166666666667, "x": "並ぶ、巨大な波の形をした砂利の高まりでした。"}, {"t": 646.55, "x": "水の中を強い流れが走ったときに、"}, {"t": 648.9666666666667, "x": "川底の砂にできる模様と同じ形です。"}, {"t": 652.1166666666667, "x": "ただし、大きさがまるで違います。"}, {"t": 654.8, "x": "この模様ができるには、湖の"}, {"t": 657.0333333333333, "x": "水が非常に速く流れ出す必要があります。"}, {"t": 659.8833333333333, "x": "パーディーはこれを、氷のダムが"}, {"t": 662.05, "x": "壊れて湖が急に抜けた跡だと説明しました。"}, {"t": 665.2, "x": "ただ、抜けた水がどこへ行ったのかについては、"}, {"t": 668.1333333333333, "x": "発表でも、1942年の論文でも、触れていません。"}, {"t": 673.25, "x": "その先は、聞いていた人たちが考えることになりました。"}, {"t": 677.05, "x": "学会のあと、参加者たちはスキャブランドを見て"}, {"t": 680.3166666666667, "x": "回りました。フリントが、ゆっくり流れる川の"}, {"t": 683.55, "x": "跡だと説明していた地形です。"}, {"t": 685.5666666666667, "x": "それを見た参加者の多くは、むしろ大洪水の"}, {"t": 688.8, "x": "跡として読んだと伝えられています。"}, {"t": 690.8333333333334, "x": "湖が抜けた跡と、大地が削られた"}, {"t": 693.6833333333333, "x": "跡が、ここでつながりました。"}, {"t": 695.7, "x": "決め手になったのは、1950年代の仕事です。"}, {"t": 699.4833333333333, "x": "ブレッツは1952年、ふたたびスキャブランドで"}, {"t": 703.25, "x": "調査を行いました。そして空から"}, {"t": 705.5333333333333, "x": "撮った写真に、砂利の高まりの"}, {"t": 707.65, "x": "上に並ぶ、巨大な波の模様が写っていました。"}, {"t": 710.8333333333334, "x": "パーディーがミズーラの湖の"}, {"t": 712.55, "x": "底で見つけたものと、同じ種類の模様です。"}, {"t": 715.5166666666667, "x": "段丘に、このような波の模様はできません。"}, {"t": 718.7333333333333, "x": "1956年の論文で、この証拠が示されると、"}, {"t": 722.8666666666667, "x": "学界の多くが洪水の説明を受け入れていきました。"}, {"t": 726.7166666666667, "x": "この洪水は、水の出どころにちなんで、"}, {"t": 729.6, "x": "ミズーラ洪水█"}, {"t": 729.7666666666667, "x": "ミズーラ洪水と呼ばれるようになります。"}, {"t": 732.6333333333333, "x": "1979年、ブレッツはアメリカ地質学会から、"}, {"t": 737.0666666666667, "x": "ペンローズ・メダルを受けました。"}, {"t": 738.9833333333333, "x": "学会で最も権威のある賞の一つです。"}, {"t": 741.9166666666666, "x": "最初の論文から、五十六年後のことでした。"}, {"t": 745.3333333333334, "x": "ここで、氷のダムの性質を見ておきます。"}, {"t": 748.4666666666667, "x": "コンクリートのダムと、氷の"}, {"t": 750.4833333333333, "x": "ダムには、大きな違いがあります。"}, {"t": 752.9, "x": "氷は、水より軽いということです。"}, {"t": 755.5, "x": "氷の重さは、同じ体積の水のおよそ九割です。"}, {"t": 759.4, "x": "ですから、氷の壁の裏で水位が上がっていくと、"}, {"t": 762.75, "x": "あるところで氷の底が浮き上がろうとします。"}, {"t": 765.85, "x": "底が浮けば、そこに隙間ができます。"}, {"t": 768.5833333333334, "x": "隙間ができれば、水が流れこみます。"}, {"t": 771.4666666666667, "x": "流れる水は、まわりの氷をとかしながら、"}, {"t": 774.4833333333333, "x": "通り道を広げていきます。通り道が"}, {"t": 777.2, "x": "広がるほど、流れる水が増えます。"}, {"t": 779.9166666666666, "x": "水が増えるほど、氷がとけて、通り道はさらに広がります。"}, {"t": 784.5166666666667, "x": "こうして、氷の下にトンネルが掘られ、"}, {"t": 787.2, "x": "湖の水が一気に抜けていきます。"}, {"t": 789.9, "x": "氷河がせき止めた湖が、このように急に抜ける"}, {"t": 793.2833333333333, "x": "洪水は、アイスランドで昔から知られてきました。"}, {"t": 796.6, "x": "アイスランド語でヨークルフロイプと呼ばれ、"}, {"t": 798.9166666666666, "x": "日本語では氷河湖決壊洪水とも呼ばれます。"}, {"t": 802.2, "x": "いまの氷河でも、規模はずっと小さいものの、"}, {"t": 805.3, "x": "同じ種類の洪水は起きています。"}, {"t": 807.7, "x": "ミズーラ氷河湖は、それとは桁違いの規模で、"}, {"t": 810.8166666666667, "x": "同じことを繰り返していたと考えられています。"}, {"t": 813.9333333333333, "x": "計算の上では、トンネルが広がりすぎて"}, {"t": 816.75, "x": "天井が崩れ、ダムそのものが流されてしまう"}, {"t": 820.0833333333334, "x": "場合もあ const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
