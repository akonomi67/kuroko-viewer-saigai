<script>
const D={"name": "ep019", "file": "ep019", "dur": 2053.19996875, "segs": [], "subs": [{"t": 0.0, "x": "地震は、起きていませんでした。"}, {"t": 2.4166666666666665, "x": "1700年の1月、いまの岩手県、宮古湾の奥の村で、"}, {"t": 7.35, "x": "ある商人の家の帳面に、そう書かれています。"}, {"t": 11.0, "x": "その夜、海の水が浜を越え、"}, {"t": 13.55, "x": "岸の家々を押し流していました。"}, {"t": 16.066666666666666, "x": "それなのに、地面は揺れていなかったのです。"}, {"t": 19.05, "x": "同じ夜から翌日にかけて、同じような海の異変が、"}, {"t": 22.683333333333334, "x": "太平洋の岸のあちこちで書き残されました。"}, {"t": 25.766666666666666, "x": "北は岩手から、南は和歌山まで。"}, {"t": 28.533333333333335, "x": "海岸にそって、およそ千キロメートルにわたります。"}, {"t": 32.2, "x": "書いたのは、藩の役人、町の商人、村の庄屋たちでした。"}, {"t": 37.36666666666667, "x": "どの記録にも、この波の前に"}, {"t": 39.516666666666666, "x": "大地が揺れたという話はありません。"}, {"t": 41.766666666666666, "x": "波だけが来て、波を起こしたはずの"}, {"t": 44.333333333333336, "x": "地震が、どこにも見当たらない。"}, {"t": 46.5, "x": "研究者たちは、のちにこの波を、"}, {"t": 49.016666666666666, "x": "みなしご津波█"}, {"t": 49.266666666666666, "x": "みなしご津波と呼ぶようになりました。"}, {"t": 52.05, "x": "親の見つからない津波、という意味です。"}, {"t": 54.96666666666667, "x": "その親が見つかるまでに、およそ三百年かかりました。"}, {"t": 58.8, "x": "親がいたのは、太平洋の向こう側でした。"}, {"t": 61.93333333333333, "x": "いまのカナダの南西部から、アメリカの"}, {"t": 64.5, "x": "西海岸の北部へと続く海岸の沖です。"}, {"t": 67.26666666666667, "x": "その海岸では、ある一夜を境に、森が沈み、"}, {"t": 71.18333333333334, "x": "海の水に浸かって枯れていました。"}, {"t": 73.56666666666666, "x": "けれども、その土地には、日付を"}, {"t": 76.15, "x": "書き残す文字の記録がありませんでした。"}, {"t": 78.53333333333333, "x": "日付と時刻を教えたのは、海の反対側に"}, {"t": 81.76666666666667, "x": "残った、日本の古い帳面のほうだったのです。"}, {"t": 85.13333333333334, "x": "今回、話の中心に置くのは、"}, {"t": 87.7, "x": "太平洋の海の底と、その海を渡った波です。"}, {"t": 91.53333333333333, "x": "そして、その波を書き残した古文書と、沈んだ"}, {"t": 95.16666666666667, "x": "森と、海岸の地層と、語り継がれた話です。"}, {"t": 98.95, "x": "遠く離れた四種類の証拠が、"}, {"t": 101.03333333333333, "x": "どうやって一つの夜に結びついたのか。"}, {"t": 103.76666666666667, "x": "古い帳面の一行から、見ていきます。"}, {"t": 106.76666666666667, "x": "最初の記録は、いまの岩手県宮古市にあった"}, {"t": 110.35, "x": "港町、鍬ヶ崎のものです。江戸時代、"}, {"t": 111.3, "x": "鍬ヶ崎█"}, {"t": 113.83333333333333, "x": "このあたりは盛岡藩、南部家の領地でした。"}, {"t": 115.2, "x": "盛岡藩█"}, {"t": 117.91666666666667, "x": "鍬ヶ崎は、宮古の中心から東へ"}, {"t": 120.81666666666666, "x": "一キロメートルほどの、藩の大事な港でした。"}, {"t": 123.95, "x": "1700年ごろの家の数は、およそ三百軒。"}, {"t": 127.73333333333333, "x": "その港町に、夜、海の水が押し寄せました。"}, {"t": 131.9, "x": "記録を残したのは、内陸の盛岡の"}, {"t": 134.61666666666667, "x": "城で働いていた武士たちです。"}, {"t": 136.5, "x": "盛岡藩は、毎日の出来事を、"}, {"t": 138.93333333333334, "x": "雑書█"}, {"t": 139.46666666666667, "x": "雑書と呼ばれる日誌に書き留めていました。"}, {"t": 142.66666666666666, "x": "年ごとに一冊ずつ、1644年から1840年まで。"}, {"t": 147.78333333333333, "x": "ページの数は、あわせて十万を超えます。"}, {"t": 150.8, "x": "その元禄十二年の冊に、こういう内容が記されています。"}, {"t": 155.11666666666667, "x": "宮古の代官所が受け持つ鍬ヶ崎村で、十二月の、"}, {"t": 158.91666666666666, "x": "ようかの夜、ここのつどきに、津波が打ち寄せた。"}, {"t": 162.68333333333334, "x": "村の者たちは、あちこちの山へ逃げた。"}, {"t": 165.55, "x": "そのあと火が出て、家が二十軒焼けた。"}, {"t": 168.65, "x": "波に打ち壊された家は、十三軒。"}, {"t": 171.6, "x": "水と火が、同じときに起きた。"}, {"t": 173.86666666666667, "x": "家財は、何ひとつ運び出せなかった。"}, {"t": 176.66666666666666, "x": "食べるものにも困ったため、百五十九人に、"}, {"t": 179.96666666666667, "x": "藩の蔵の米を少しずつ配った。"}, {"t": 182.41666666666666, "x": "家を失った人のため、仮の小屋を建てる材木を"}, {"t": 185.86666666666667, "x": "出してほしいと、山の役人に願い出た。"}, {"t": 188.8, "x": "そして、記事の終わりに、こう添えられています。"}, {"t": 192.18333333333334, "x": "けが人は、出なかった。村人たちは、"}, {"t": 194.78333333333333, "x": "すぐに高いところへ逃げていたのです。"}, {"t": 197.55, "x": "この知らせが盛岡の城に届いたのは、波の六日のち。"}, {"t": 201.35, "x": "その日の盛岡は雪だったことも、"}, {"t": 203.46666666666667, "x": "同じ日誌に書かれています。"}, {"t": 205.45, "x": "ここで、一つ注目したい言葉があります。"}, {"t": 208.5, "x": "雑書は、この夜の水を、はっきりと「津波」と"}, {"t": 212.85, "x": "書いています。港を意味する「津」の"}, {"t": 216.08333333333334, "x": "字と、「波」の字。いまと同じ二文字です。"}, {"t": 219.88333333333333, "x": "この夜のことを書いた各地の記録の中で、"}, {"t": 222.4, "x": "迷わず「津波」と書いたのは、この記事だけです。"}, {"t": 226.91666666666666, "x": "ほかの土地の書き手たちは、"}, {"t": 228.4, "x": "それぞれ別の言葉を選びました。"}, {"t": 230.73333333333332, "x": "理由は、はっきりしています。"}, {"t": 232.96666666666667, "x": "津波の前には、地震がある。"}, {"t": 235.31666666666666, "x": "それが、当時の人々の常識だったからです。"}, {"t": 238.58333333333334, "x": "津波という言葉そのものは、"}, {"t": 240.31666666666666, "x": "この時代にはもう使われていました。"}, {"t": 242.75, "x": "残っている中で最も古い使用例は、1612年、"}, {"t": 247.1, "x": "徳川家康に仕えた者の記録、駿府記にあるとされます。"}, {"t": 249.56666666666666, "x": "駿府記█"}, {"t": 251.9, "x": "本州の北東の沖で起きた地震のあと、大きな波が"}, {"t": 255.53333333333333, "x": "海岸をさらった、という知らせを伝える記事です。"}, {"t": 258.96666666666664, "x": "地震が起き、そのあとに波が来る。"}, {"t": 261.65, "x": "その順番とともに、津波という言葉は覚えられていました。"}, {"t": 265.6, "x": "だからこそ、揺れのない夜の波は、"}, {"t": 268.03333333333336, "x": "書き手たちを戸惑わせたのです。"}, {"t": 270.18333333333334, "x": "宮古湾の南の奥には、津軽石という村がありました。"}, {"t": 272.0833333333333, "x": "津軽石█"}, {"t": 274.73333333333335, "x": "鮭がのぼる川のほとりにある、百八十軒あまりの村です。"}, {"t": 279.18333333333334, "x": "この村の商人の家には、1696年から1703年までの"}, {"t": 284.4, "x": "出来事を書き留めた帳面が伝わっています。"}, {"t": 287.01666666666665, "x": "帳面は、この夜の水を、「おおしお」、"}, {"t": 290.03333333333336, "x": "つまり大きな潮と呼びました。"}, {"t": 292.18333333333334, "x": "湾の岸では、家などが流された。"}, {"t": 294.96666666666664, "x": "水は川をさかのぼり、村の奥の渡し場まで来た。"}, {"t": 298.55, "x": "村の者たちは、大騒ぎになった。"}, {"t": 301.18333333333334, "x": "鍬ヶ崎では、この水のせいで火が出て、"}, {"t": 304.03333333333336, "x": "二十一軒ほどが焼けたと聞く。"}, {"t": 306.21666666666664, "x": "そして、こう続けます。ただし、地震はなかった。"}, {"t": 310.3666666666667, "x": "この短い一行は、のちにこの出来事を調べた"}, {"t": 313.65, "x": "研究書の、最初のページに引かれることになります。"}, {"t": 316.95, "x": "宮古から三十キロメートルほど南の、大槌。"}, {"t": 319.8833333333333, "x": "大槌█"}, {"t": 320.4, "x": "ここでも、同じ夜、同じ時刻に、海の水が入りました。"}, {"t": 325.15, "x": "こちらも、盛岡藩の雑書に記録があります。"}, {"t": 328.48333333333335, "x": "町の表通りより海側の、田んぼと畑が、水をかぶった。"}, {"t": 333.1333333333333, "x": "家が二軒と、海の水を煮つめて"}, {"t": 335.78333333333336, "x": "塩をつくるかまどが二つ、傷んだ。"}, {"t": 338.3666666666667, "x": "小さな被害でしたが、その中身は、"}, {"t": 341.03333333333336, "x": "江戸にまで報告されています。"}, {"t": 343.2, "x": "二つの港の役人は、それぞれ別々に、"}, {"t": 346.31666666666666, "x": "同じ夜の、同じ時刻を書き送っていたのです。"}, {"t": 349.81666666666666, "x": "この一致が、のちに地震の時刻を"}, {"t": 352.31666666666666, "x": "決める手がかりの一つになります。"}, {"t": 354.2, "x": "ずっと南の、いまの茨城県。"}, {"t": 356.71666666666664, "x": "那珂湊█"}, {"t": 356.71666666666664, "x": "那珂湊は、太平洋を来た船の荷物を、"}, {"t": 360.21666666666664, "x": "川の舟に積みかえて江戸へ送る港でした。"}, {"t": 363.7, "x": "1700年1月28日の朝、午前八時ごろ。"}, {"t": 367.98333333333335, "x": "中村藩の米、四百七十俵を積んだ船が、"}, {"t": 371.8, "x": "この港に入ろうとしていました。"}, {"t": 374.06666666666666, "x": "ところが、波が高く、港の入口を抜けられません。"}, {"t": 378.1333333333333, "x": "船は沖で待つうちに、夕方の荒れた天気で錨の"}, {"t": 381.96666666666664, "x": "綱が切れ、南の磯浜村の岩場へ流されました。"}, {"t": 383.45, "x": "磯浜█"}, {"t": 386.1, "x": "米はすべて失われ、乗っていた二人が亡くなりました。"}, {"t": 389.75, "x": "朝の高い波は、ふだんのうねりが、長く続く津波の"}, {"t": 393.71666666666664, "x": "引き潮と河口でぶつかったものだろうと考えられています。"}, {"t": 397.05, "x": "船を岩場へ運んだのは、主に夕方の天気でした。"}, {"t": 400.8, "x": "さらに西へ進んで、いまの静岡県の三保。"}, {"t": 404.1166666666667, "x": "三保█"}, {"t": 404.73333333333335, "x": "富士山を望む松原で知られる、三百人ほどの村です。"}, {"t": 408.93333333333334, "x": "ここの庄屋が書き残した記録は、この夜の波を"}, {"t": 412.21666666666664, "x": "書いたものの中で、いちばん生き生きとしています。"}, {"t": 415.3833333333333, "x": "夜明けから昼前にかけて、海の水が、"}, {"t": 418.3, "x": "とても高い満ち潮のように寄せてきた。"}, {"t": 420.9166666666667, "x": "それが、七回。寄せるときはゆっくりと、引くときは、"}, {"t": 425.03333333333336, "x": "大きな川の流れのような速さで引いていった。"}, {"t": 428.21666666666664, "x": "庄屋は念のため、年寄りと子どもを、"}, {"t": 431.1, "x": "いちばん高い場所にある神社へ逃がしました。"}, {"t": 434.06666666666666, "x": "そのうえで、首をかしげています。"}, {"t": 436.6, "x": "津波と呼ばれるものは、こういうもののことなのだろうか。"}, {"t": 440.1666666666667, "x": "それにしては、この村でも、"}, {"t": 442.21666666666664, "x": "近くの村でも、地震はまったくなかった。"}, {"t": 445.51666666666665, "x": "この記録が研究者たちに見つかったのは、"}, {"t": 448.05, "x": "1998年のことです。いちばん西は、"}, {"t": 452.35, "x": "いまの和歌山県の田辺です。"}, {"t": 454.28333333333336, "x": "田辺█"}, {"t": 455.46666666666664, "x": "町の役人がまとめた記録は、"}, {"t": 457.4, "x": "この水を、「あびき」と書きました。"}, {"t": 460.45, "x": "潮や嵐、風などで起きる、ふつうでない海の"}, {"t": 464.3833333333333, "x": "動きを指す言葉です。十二月の、ようかの"}, {"t": 467.3333333333333, "x": "夜明けごろから、潮が強く満ちてきた。"}, {"t": 470.1333333333333, "x": "新庄█"}, {"t": 470.1333333333333, "x": "新庄村では、幕府の蔵に水が入った。"}, {"t": 474.05, "x": "町の中では、お城の堀を、水がさかのぼった。"}, {"t": 478.1, "x": "近くの村々では、麦の作物がだめになった。"}, {"t": 481.46666666666664, "x": "岩手から和歌山まで。武士、商人、村の役人。"}, {"t": 485.8833333333333, "x": "立場も土地もばらばらの書き手が、"}, {"t": 487.81666666666666, "x": "ほぼ同じ一日半の出来事を、別々に書いていました。"}, {"t": 491.9, "x": "そして、どの記録にも、この波の"}, {"t": 494.65, "x": "前の揺れは書かれていません。"}, {"t": 496.3666666666667, "x": "記録に書かれた日付は、元禄十二年、"}, {"t": 499.28333333333336, "x": "十二月の、ようかです。これを、"}, {"t": 501.85, "x": "いまの暦に直さなければなりません。"}, {"t": 504.75, "x": "当時の日本の暦は、月の満ち欠けで、"}, {"t": 507.73333333333335, "x": "ひと月を数えていました。新月の日が、月の始まりです。"}, {"t": 512.2166666666667, "x": "ひと月は、二十九日か三十日。"}, {"t": 514.9, "x": "十二か月を足しても三百五十四日にしかならず、"}, {"t": 518.3, "x": "太陽をめぐる一年より、十一日ほど短くなります。"}, {"t": 522.7, "x": "そのずれを埋めるために、数年に一度、"}, {"t": 525.4666666666667, "x": "閏月という十三番目の月が挟みこまれました。"}, {"t": 528.8833333333333, "x": "元禄十二年は、ちょうどその年でした。"}, {"t": 531.8666666666667, "x": "九月のあとに、もう一度九月があり、"}, {"t": 534.55, "x": "一年は三百八十四日ありました。"}, {"t": 537.6833333333333, "x": "その最後の月の、ようかと、ここのか。"}, {"t": 540.8333333333334, "x": "いまの暦でいうと、1700年の"}, {"t": 543.4666666666667, "x": "1月27日と28日にあたります。"}, {"t": 546.4166666666666, "x": "次は、時刻です。雑書は、鍬ヶ崎と大槌に水が来た時刻を、"}, {"t": 551.6333333333333, "x": "ここのつどき、と書いています。"}, {"t": 553.95, "x": "江戸時代の時の数えかたでは、"}, {"t": 555.8333333333334, "x": "真夜中と真昼を、それぞれ九つとしました。"}, {"t": 559.2666666666667, "x": "そこから八つ、七つと、数を"}, {"t": 562.1666666666666, "x": "減らしながら刻を進めていきます。"}, {"t": 564.2666666666667, "x": "一つの刻は、平均して二時間ほどです。"}, {"t": 567.4, "x": "夜のここのつどきは、真夜中を指します。"}, {"t": 570.3833333333333, "x": "しかも、当時の一日は夜明けから始まるものでした。"}, {"t": 574.0166666666667, "x": "ですから、ようかの夜の真夜中は、1月27日から"}, {"t": 578.35, "x": "28日へ変わるころ、とはっきり読めます。"}, {"t": 581.4333333333333, "x": "ほかの土地の記録も、この読みとつながります。"}, {"t": 584.5, "x": "津軽石の帳面では、八日から九日にかけて。"}, {"t": 588.1, "x": "那珂湊と三保では、九日の夜明けのあと、"}, {"t": 591.1333333333333, "x": "はじめて異変に気づいています。"}, {"t": 593.25, "x": "田辺の記録は、八日の夜明けごろから、と書いています。"}, {"t": 597.3666666666667, "x": "これを九日の夜明けと読むと、"}, {"t": 599.2166666666667, "x": "ほかの記録とよく合う、とされています。"}, {"t": 602.2666666666667, "x": "記録を並べると、北の岩手が真夜中、南の"}, {"t": 605.9333333333333, "x": "各地は夜明けから、という順になります。"}, {"t": 608.65, "x": "ただし、記録がいつもきれいに"}, {"t": 610.85, "x": "そろっていたわけではありません。"}, {"t": 612.6, "x": "津軽石の帳面は、この水を、十一月のようかから、"}, {"t": 616.8333333333334, "x": "ここのかの出来事として書いていました。"}, {"t": 619.25, "x": "ひと月、早いのです。この食い違いが"}, {"t": 621.85, "x": "解けたのは、2004年のことでした。"}, {"t": 624.6166666666667, "x": "同じ帳面の、すぐ次の記事に、"}, {"t": 627.1166666666667, "x": "十一月十八日の大雪が書かれています。"}, {"t": 630.4, "x": "ところが、盛岡藩の雑書を見ると、その日は晴れです。"}, {"t": 634.6166666666667, "x": "大雪が降ったのは、ひと月あとの、十二月十八日でした。"}, {"t": 639.2166666666667, "x": "隣の八戸藩の日誌でも、大雪は十二月十八日です。"}, {"t": 643.7833333333333, "x": "帳面を書き写した誰かが、このあたりの"}, {"t": 646.6166666666667, "x": "月を、続けて一つずつ書き誤っていたのです。"}, {"t": 649.7833333333333, "x": "書き写しの誤りまで、別の記録と突き合わせて確かめる。"}, {"t": 653.7666666666667, "x": "この題材は、そうした地道な作業の"}, {"t": 656.4, "x": "積み重ねで、成り立っています。"}, {"t": 658.6666666666666, "x": "1943年、日本の昔の地震を研究する人が、古い記録を"}, {"t": 664.55, "x": "集めた資料集に、この夜の水の記録を収めました。"}, {"t": 668.2166666666667, "x": "それから半世紀ほどかけて、各地の"}, {"t": 670.8, "x": "記録が少しずつ掘り起こされていきます。"}, {"t": 673.2166666666667, "x": "1990年代のはじめには、原因の"}, {"t": 676.5, "x": "分からない津波として、日本でいちばん詳しく"}, {"t": 679.5666666666667, "x": "記録された例になっていました。"}, {"t": 681.25, "x": "では、この波は、どこから来たのか。"}, {"t": 684.1666666666666, "x": "候補を、一つずつ消していきます。"}, {"t": 686.7166666666667, "x": "まず、日本のすぐ近くの海の底で起きた地震。"}, {"t": 690.4, "x": "それなら、岸で揺れを感じたはずです。"}, {"t": 693.2666666666667, "x": "ところが、東北の津軽石でも、"}, {"t": 695.6333333333333, "x": "東海の三保でも、揺れは書かれていません。"}, {"t": 698.8666666666667, "x": "次に、嵐や高潮。研究者たちは、1月26日から"}, {"t": 703.9166666666666, "x": "29日の各地の天気の記録も調べました。"}, {"t": 706.7666666666667, "x": "そこに、この水を説明できるような"}, {"t": 709.3833333333333, "x": "異常は、見つかっていません。"}, {"t": 711.3833333333333, "x": "残るのは、太平洋のどこか遠くで起きた地震です。"}, {"t": 715.1333333333333, "x": "遠くの地震から来る津波は、揺れを伴いません。"}, {"t": 718.55, "x": "揺れは海を渡れませんが、波は渡ることができるからです。"}, {"t": 722.5333333333333, "x": "南米の太平洋岸は、当時、スペインが治めていました。"}, {"t": 727.1333333333333, "x": "1650年から1750年までに、ペルーと"}, {"t": 731.25, "x": "チリで津波を起こした地震が、十九回記録されています。"}, {"t": 735.2, "x": "日本に届いた1687年、1730年、1751年の"}, {"t": 741.8166666666667, "x": "津波は、南米の地震から来たものでした。"}, {"t": 744.7333333333333, "x": "ところが、1700年のころに、"}, {"t": 747.15, "x": "それらしい南米の地震は見当たりません。"}, {"t": 750.1333333333333, "x": "いちばん近いのは、1705年、"}, {"t": 752.8333333333334, "x": "チリ北部を襲った地震でした。"}, {"t": 755.1833333333333, "x": "北のカムチャツカや、アラスカの沖はどうか。"}, {"t": 758.1833333333333, "x": "のちの観測から、こうした沖の津波は、日本の"}, {"t": 761.8, "x": "南では低くなりやすいことが知られています。"}, {"t": 764.45, "x": "日本の側には、そもそも向かいにくい場合もあります。"}, {"t": 768.1666666666666, "x": "1700年の水は、南の田辺でも、"}, {"t": 771.2166666666667, "x": "数メートルの高さに達していました。"}, {"t": 773.7166666666667, "x": "その分布とは、合いません。"}, {"t": 775.95, "x": "こうして候補は絞られていきました。"}, {"t": 778.1666666666666, "x": "それでも、三百年近く、この波の親は決まりませんでした。"}, {"t": 782.75, "x": "残った候補の一つ、北米の北西の海岸には、"}, {"t": 786.35, "x": "揺れを書き残した記録が、そもそも無かったからです。"}, {"t": 790.0833333333334, "x": "それどころか、その沖が巨大な地震を起こし"}, {"t": 793.2, "x": "うること自体、長く考えられていなかったのです。"}, {"t": 796.4666666666667, "x": "1700年、北米の北西の海岸は、ヨーロッパの"}, {"t": 800.7166666666667, "x": "人々にとって、ほとんど空白の土地でした。"}, {"t": 803.7166666666667, "x": "当時の指折りの地図の作り手たちも、"}, {"t": 805.9833333333333, "x": "このあたりを白いまま残しています。"}, {"t": 808.4333333333333, "x": "ロシアの人々がアラスカに上陸するのは、1741年。"}, {"t": 813.0833333333334, "x": "このあたりの海岸が測られるのは、1770年代の"}, {"t": 817.1333333333333, "x": "スペインとイギリスの探検からです。"}, {"t": 819.2, "x": "そこに暮らしていた人々は、文字ではなく、"}, {"t": 822.0833333333334, "x": "語りで出来事を伝えていました。"}, {"t": 824.45, "x": "その話は、のちの章でたどります。"}, {"t": 827.1, "x": "先に、海の底の仕組みを見ておきます。"}, {"t": 830.1666666666666, "x": "この沖では、太平洋の側の岩の板、"}, {"t": 832.8333333333334, "x": "ファンデフカ・プレート█"}, {"t": 833.4666666666667, "x": "ファンデフカ・プレートが沈み込んでいます。"}, {"t": 836.35, "x": "北米大陸を乗せた板の奥へ、"}, {"t": 838.45, "x": "斜めに、ゆっくりと潜っていくのです。"}, {"t": 841.5, "x": "速さは、平均して百年に四メートルほど。"}, {"t": 844.8666666666667, "x": "この沈み込みの境目が続く一帯を、"}, {"t": 847.5666666666667, "x": "カスケード沈み込み帯█"}, {"t": 847.7, "x": "カスケード沈み込み帯と呼びます。"}, {"t": 850.2666666666667, "x": "カナダのバンクーバー島の中ほどから、"}, {"t": 852.5666666666667, "x": "カリフォルニア州の北部まで。"}, {"t": 854.6333333333333, "x": "岸からおよそ八十キロメートルの沖を、"}, {"t": 857.2, "x": "海岸とほぼ平行に走っています。"}, {"t": 859.8833333333333, "x": "沈み込み帯の浅いところでは、"}, {"t": 861.8666666666667, "x": "二枚の板が、くっつき合っています。"}, {"t": 864.7, "x": "沈んでいく板に引きずられて、陸の側の板の端は、"}, {"t": 868.4, "x": "少しずつ引き込まれ、押し縮められていきます。"}, {"t": 871.8833333333333, "x": "そして、ある日、こらえきれなくなった"}, {"t": 874.9166666666666, "x": "境目が、一気にずれます。陸の側の"}, {"t": 877.65, "x": "板の先は、海のほうへ跳ね返りながら"}, {"t": 880.5666666666667, "x": "持ち上がり、真上の海の水を押し上げます。"}, {"t": 883.8166666666667, "x": "これが、津波の始まりです。"}, {"t": 886.05, "x": "同じとき、そこから少し陸寄りでは、"}, {"t": 888.7166666666667, "x": "引き伸ばされた地面が沈みます。"}, {"t": 890.95, "x": "海岸そのものが、一瞬で一メートル、"}, {"t": 893.8333333333334, "x": "二メートルと低くなるのです。"}, {"t": 895.8166666666667, "x": "ところが、20世紀の大半を通じて、この一帯は、"}, {"t": 899.9, "x": "大きな地震を起こさない場所だと考えられていました。"}, {"t": 903.3833333333333, "x": "想定されていた最大の規模は、"}, {"t": 905.4166666666666, "x": "マグニチュード7.5ほどでした。"}, {"t": 907.7166666666667, "x": "文字の記録が残るようになってから、ここで"}, {"t": 910.4666666666667, "x": "大きな地震が起きたことがなかったからです。"}, {"t": 913.0333333333333, "x": "1984年、二人の地震学者、トーマス・ヒートンと"}, {"t": 917.95, "x": "金森博雄が、この考えに疑いを投げかけます。"}, {"t": 921.3833333333333, "x": "この沈み込み帯は、巨大な地震を起こしてきた世界の"}, {"t": 924.9666666666667, "x": "ほかの沈み込み帯と、多くの特徴を共有している、と。"}, {"t": 929.3666666666667, "x": "巨大な地震は、若く、熱く、"}, {"t": 932.3166666666667, "x": "軽い海の板が沈み込むところで起きやすい。"}, {"t": 935.5166666666667, "x": "カスケードで沈んでいく板は、"}, {"t": 937.4, "x": "世界でも指折りの若さと熱さを持つ板です。"}, {"t": 940.75, "x": "静かなのは、動いていないからではなく、"}, {"t": 943.5666666666667, "x": "つかえているからではないか。"}, {"t": 945.4833333333333, "x": "もしそうなら、過去には、巨大な地震が"}, {"t": 948.5333333333333, "x": "何度も起きていたはずです。"}, {"t": 950.0833333333334, "x": "その跡は、文字ではなく、海岸の泥の中に残っていました。"}, {"t": 954.6833333333333, "x": "ワシントン州の太平洋の岸には、"}, {"t": 957.05, "x": "潮が満ちると海水に浸かる湿地があります。"}, {"t": 960.1833333333333, "x": "その中に、枯れた木の幹が、"}, {"t": 962.4, "x": "何本も立ち並んでいる場所があります。"}, {"t": 965.05, "x": "ゴーストフォレスト█"}, {"t": 965.05, "x": "ゴーストフォレスト、幽霊の森と呼ばれる景色です。"}, {"t": 968.4666666666667, "x": "立ち枯れているのは、ベイスギという、"}, {"t": 970.85, "x": "長生きで腐りにくい針葉樹です。"}, {"t": 973.4, "x": "湿地を流れる水路の土手には、さらに何千本もの"}, {"t": 976.9166666666666, "x": "切り株が、泥に埋もれたまま顔を出しています。"}, {"t": 980.1833333333333, "x": "こちらは、主にシトカトウヒという木です。"}, {"t": 983.0166666666667, "x": "どちらの木も、根を塩水に浸けたままでは生きられません。"}, {"t": 986.6833333333333, "x": "つまり、この木々が育っていたころ、ここは"}, {"t": 989.75, "x": "潮の届かない陸だったことになります。"}, {"t": 991.9666666666667, "x": "この枯れた森は、1850年代のはじめには、"}, {"t": 995.6, "x": "すでに書き留められていました。"}, {"t": 997.5333333333333, "x": "当時この湾で冬を越した博物学者は、木々が"}, {"t": 1000.8333333333334, "x": "少しずつ流砂に沈んでいったのだろう、と考えています。"}, {"t": 1004.7, "x": "その考えが覆るのは、およそ百三十年のちのことです。"}, {"t": 1008.9666666666667, "x": "1987年、アメリカ地質調査所の地質学者、"}, {"t": 1013.4666666666667, "x": "ブライアン・アトウォーターが、科学誌に報告を出します。"}, {"t": 1017.4833333333333, "x": "ワシントン州の最も西の海岸で、草に覆われていた"}, {"t": 1021.3166666666667, "x": "低い土地が、潮の運ぶ泥に埋もれた跡。"}, {"t": 1024.3166666666666, "x": "それが、過去七千年のあいだに、"}, {"t": 1026.8333333333333, "x": "少なくとも六回、繰り返されていたのです。"}, {"t": 1030.25, "x": "一回ごとに、土地は〇・五メートルから"}, {"t": 1033.1, "x": "二メートルほど、急に沈んだと考えられました。"}, {"t": 1036.3666666666666, "x": "埋もれた土地のうち少なくとも三つでは、"}, {"t": 1038.75, "x": "その表面に、場違いな砂の層が重なっていました。"}, {"t": 1042.7166666666667, "x": "陸の奥へ進むほど薄くなる砂で、海にすむ珪藻という、"}, {"t": 1047.0166666666667, "x": "ごく小さな生き物の殻が混じっています。"}, {"t": 1049.9, "x": "土地が沈んだ直後に、砂を含んだ海の水が押し寄せた跡。"}, {"t": 1054.15, "x": "つまり、津波の跡です。それでも最初のうちは、海面が"}, {"t": 1058.7, "x": "ゆっくり高くなっただけではないか、という"}, {"t": 1061.35, "x": "疑いも残っていました。それを退けたのは、"}, {"t": 1064.4333333333334, "x": "細かな証拠の積み重ねです。"}, {"t": 1066.45, "x": "一つ目は、木の年輪でした。"}, {"t": 1068.7666666666667, "x": "湿地で枯れたシトカトウヒには、死ぬ直前まで、"}, {"t": 1072.0333333333333, "x": "幅の広い、元気な年輪が続いていました。"}, {"t": 1075.6166666666666, "x": "何十年もかけて塩水に弱らされたのなら、"}, {"t": 1078.45, "x": "年輪は少しずつ細くなっていたはずです。"}, {"t": 1081.4166666666667, "x": "二つ目は、埋もれた草でした。"}, {"t": 1083.8666666666666, "x": "湿地の土の表面には、生えていた姿のままの"}, {"t": 1087.25, "x": "草の茎や葉が、泥の中に閉じこめられていました。"}, {"t": 1090.55, "x": "こうした葉や茎は、ふつうなら数年で腐ってしまいます。"}, {"t": 1094.35, "x": "湿地が干潟に変わるまでに、長くても"}, {"t": 1097.1333333333334, "x": "数年しかかからなかった、ということです。"}, {"t": 1100.0666666666666, "x": "三つ目は、地面の割れ目でした。"}, {"t": 1102.4333333333334, "x": "1990年代のはじめ、コロンビア川のほとりなどで、"}, {"t": 1106.7666666666667, "x": "砂が吹き上がった跡が見つかりました。"}, {"t": 1109.3833333333334, "x": "泥の層を突き破って、地中から噴き出した砂です。"}, {"t": 1113.0666666666666, "x": "強い揺れで、水を含んだ砂が液体のようになり、"}, {"t": 1116.5666666666666, "x": "割れ目から噴き出したのです。"}, {"t": 1118.6166666666666, "x": "土地が沈んだそのとき、地面は"}, {"t": 1120.8666666666666, "x": "激しく揺れていたことになります。"}, {"t": 1122.7833333333333, "x": "沈んだ土地の中には、人々が火をたいた炉の跡が、"}, {"t": 1126.3166666666666, "x": "津波の砂と潮の泥に覆われて見つかった場所もあります。"}, {"t": 1130.1333333333334, "x": "海岸が沈み、津波が来て、地面が揺れた。"}, {"t": 1133.7833333333333, "x": "沈み込み帯の巨大な地震に特有の"}, {"t": 1136.2166666666667, "x": "三つの跡が、そろっていました。"}, {"t": 1138.4833333333333, "x": "ただし、それがいつのことだったのかは、"}, {"t": 1141.2166666666667, "x": "まだ分かりませんでした。時期を"}, {"t": 1143.4333333333334, "x": "決めるために、まず使われたのは、"}, {"t": 1145.7833333333333, "x": "炭素14による年代測定です。"}, {"t": 1148.3666666666666, "x": "枯れた木や草に残る、放射性の炭素の"}, {"t": 1151.1833333333334, "x": "わずかな量から、年代を割り出す方法です。"}, {"t": 1154.3666666666666, "x": "研究者たちは、沈んだ土地で死んだ木の根や、草の"}, {"t": 1158.2666666666667, "x": "茎や葉を集め、測定の精度を限界まで高めていきました。"}, {"t": 1162.3833333333334, "x": "1995年に発表された結果は、こうです。"}, {"t": 1166.55, "x": "七百キロメートル近く離れた場所の木々が、"}, {"t": 1169.4, "x": "同じ数十年のうちに枯れていた。"}, {"t": 1171.8333333333333, "x": "その時期は、1695年から1720年のあいだ。"}, {"t": 1176.5333333333333, "x": "これで、一つの問題がはっきりしました。"}, {"t": 1179.45, "x": "長い海岸は、一度の巨大な地震で沈んだのか。"}, {"t": 1183.2166666666667, "x": "それとも、数十年のうちに、"}, {"t": 1185.45, "x": "それより小さな大地震が何度か続いたのか。"}, {"t": 1188.7166666666667, "x": "炭素14の年代では、この二つを"}, {"t": 1191.4166666666667, "x": "見分けることができませんでした。"}, {"t": 1193.2333333333333, "x": "一度なら、マグニチュード9。"}, {"t": 1195.5333333333333, "x": "続けざまなら、一つ一つは8級です。"}, {"t": 1198.6, "x": "学校や病院を、どれだけの揺れに備えて建てるべきか。"}, {"t": 1202.5666666666666, "x": "その答えが、この違いで変わります。"}, {"t": 1205.3, "x": "研究は、ここで行き詰まりました。"}, {"t": 1207.8333333333333, "x": "その行き詰まりを破ったのは、日本からの論文でした。"}, {"t": 1211.55, "x": "1996年1月、イギリスの科学誌、ネイチャーに、"}, {"t": 1216.5333333333333, "x": "佐竹健治ら四人の研究者による論文が載ります。"}, {"t": 1220.1166666666666, "x": "日本の記録に残る1700年1月の津波は、"}, {"t": 1223.5166666666667, "x": "カスケード沈み込み帯の巨大な地震によるものだ。"}, {"t": 1226.8166666666666, "x": "その地震は、現地の時刻で1700年1月26日の"}, {"t": 1231.3, "x": "午後九時ごろに起きた。規模は、マグニチュード9ほど。"}, {"t": 1234.85, "x": "炭素14が示した1695年から1720年の"}, {"t": 1239.2166666666667, "x": "幅の中に、ちょうど収まる日付でした。"}, {"t": 1241.9, "x": "三百年近く親の見つからなかった波が、太平洋の"}, {"t": 1245.8166666666666, "x": "向こうの地震と、学術誌の誌面で結びつけられたのです。"}, {"t": 1249.9, "x": "北米の研究者たちは、すぐに"}, {"t": 1252.2833333333333, "x": "この日付を確かめにかかりました。使ったのは、年輪です。"}, {"t": 1256.4666666666667, "x": "木の年輪の幅は、その年の天気によって、"}, {"t": 1259.6166666666666, "x": "太くなったり、細くなったりします。"}, {"t": 1262.3833333333334, "x": "同じ地域で育った木は、同じ並びの"}, {"t": 1265.05, "x": "太い輪と細い輪を持つことになります。"}, {"t": 1267.3, "x": "いわば、年輪のバーコードです。"}, {"t": 1269.7166666666667, "x": "研究者たちは、高台で地震を生き延びた"}, {"t": 1272.6833333333334, "x": "ベイスギ十九本から、このバーコードを作っていました。"}, {"t": 1276.35, "x": "西暦993年から1986年まで、一年ごとの並びです。"}, {"t": 1282.3833333333334, "x": "枯れた森の木の年輪を、これに重ね合わせれば、"}, {"t": 1285.6333333333334, "x": "それぞれの輪が何年のものか分かります。"}, {"t": 1288.3833333333334, "x": "ただし、問題がありました。"}, {"t": 1290.7333333333333, "x": "湿地に立つ幹は、三百年の風雨で外側が"}, {"t": 1294.2333333333333, "x": "削られ、最後の年輪が失われていたのです。"}, {"t": 1297.5166666666667, "x": "そこで1996年の夏、研究者たちは、"}, {"t": 1301.5166666666667, "x": "泥の中に埋もれていた根を掘り出しました。"}, {"t": 1304.2833333333333, "x": "樹皮がついたまま残っていた根です。"}, {"t": 1306.5, "x": "樹皮のすぐ内側には、その木が"}, {"t": 1308.8333333333333, "x": "最後に刻んだ年輪があります。調べた木は八本。"}, {"t": 1312.4166666666667, "x": "そのうち七本は、1699年に木が太る季節を"}, {"t": 1316.7833333333333, "x": "終えたあと、次の季節が始まる前に枯れていました。"}, {"t": 1320.1666666666667, "x": "つまり、枯れたのは、1699年の8月ごろから、"}, {"t": 1324.8333333333333, "x": "1700年の5月ごろまでの、どこかです。"}, {"t": 1328.3, "x": "残る一本は、1708年まで生きていました。"}, {"t": 1331.9666666666667, "x": "1997年、この結果は、同じネイチャー誌に発表されます。"}, {"t": 1337.3833333333334, "x": "日本の帳面から割り出された1月26日は、"}, {"t": 1340.7166666666667, "x": "このひと冬の中に、ぴたりと入りました。"}, {"t": 1343.8166666666666, "x": "森は、ひと冬のうちに沈んだ。"}, {"t": 1346.2333333333333, "x": "年輪は、そう答えたのです。日付の次は、大きさです。"}, {"t": 1350.9333333333334, "x": "ここでも、手がかりは日本の記録でした。"}, {"t": 1353.9666666666667, "x": "家が何軒壊れたか。水がどこまで入ったか。"}, {"t": 1357.2833333333333, "x": "こうした記述から、それぞれの"}, {"t": 1359.35, "x": "場所の波の高さを見積もります。たとえば、鍬ヶ崎です。"}, {"t": 1363.4833333333333, "x": "江戸時代の木造の家は、水の深さが一メートルから"}, {"t": 1367.0833333333333, "x": "一・五メートルほどになると、波に壊されるとされます。"}, {"t": 1370.7833333333333, "x": "十三軒が壊されたという記録に、当時の土地の"}, {"t": 1374.1333333333334, "x": "高さと、その夜の潮の高さを合わせていきます。"}, {"t": 1377.55, "x": "すると、波の高さは、二メートル半から"}, {"t": 1380.7666666666667, "x": "四メートルほどになります。"}, {"t": 1382.3, "x": "1998年に都司嘉宣たちが"}, {"t": 1385.15, "x": "まとめた見積もりは、次のとおりです。"}, {"t": 1387.65, "x": "鍬ヶ崎で四メートル。津軽石で三・二メートル。"}, {"t": 1391.25, "x": "大槌で三・三メートル。那珂湊で一メートル。"}, {"t": 1394.8, "x": "三保で一メートルから一・七メートル。"}, {"t": 1397.3, "x": "田辺の二か所で、三・三メートルと五・四メートル。"}, {"t": 1401.2, "x": "ただし、この見積もりには、大きな幅がつきます。"}, {"t": 1405.0833333333333, "x": "三百年のあいだに、日本の海岸の土地そのものが、"}, {"t": 1408.9166666666667, "x": "上がったり沈んだりしているからです。"}, {"t": 1411.4333333333334, "x": "2003年、佐竹健治たちは、日本の七か所の"}, {"t": 1415.3833333333334, "x": "波の高さを、三通りの見積もりに分けて整理しました。"}, {"t": 1419.1, "x": "高さは、およそ一メートルから五メートルです。"}, {"t": 1422.3166666666666, "x": "一方、カスケードの側には、"}, {"t": 1424.5666666666666, "x": "断層のずれ具合を、六通り想定しました。"}, {"t": 1428.0166666666667, "x": "その十八通りの組み合わせについて、太平洋を"}, {"t": 1431.5833333333333, "x": "渡る津波をコンピューターで計算します。"}, {"t": 1434.1666666666667, "x": "そして、日本の岸に届く高さを、"}, {"t": 1436.8166666666666, "x": "記録からの見積もりと比べたのです。"}, {"t": 1439.2833333333333, "x": "計算の答えは、明快でした。"}, {"t": 1441.8166666666666, "x": "マグニチュード8から8.5ほどの地震では、日本に届く波は、"}, {"t": 1446.2, "x": "一メートルを超えることはまずありません。"}, {"t": 1448.85, "x": "記録に合うのは、マグニチュード8.7から9.2。"}, {"t": 1452.5, "x": "いちばんよく合うのは、9.0でした。"}, {"t": 1455.4, "x": "このとき、割れた断層は、長さおよそ千百キロメートル。"}, {"t": 1459.8333333333333, "x": "陸から遠い海側の部分では、二枚の板が"}, {"t": 1463.0, "x": "およそ十九メートルずれ動いた、と計算されています。"}, {"t": 1466.75, "x": "本州の長さに近い断層が、一度にずれたことになります。"}, {"t": 1470.9333333333334, "x": "時刻も、同じ考えかたで決められています。"}, {"t": 1474.0333333333333, "x": "カスケードの沖から日本の東北まで、"}, {"t": 1476.5, "x": "津波は、およそ十時間で太平洋を渡ります。"}, {"t": 1480.2666666666667, "x": "速さは、ジェット旅客機ほどです。"}, {"t": 1482.8333333333333, "x": "鍬ヶ崎と大槌に水が来たのは、日本の時刻で、"}, {"t": 1486.4166666666667, "x": "1月27日から28日へ変わる真夜中でした。"}, {"t": 1490.4833333333333, "x": "そこから、波が海を渡った十時間をさかのぼります。"}, {"t": 1494.2833333333333, "x": "さらに、経度にしておよそ百五度の隔たり、"}, {"t": 1497.4166666666667, "x": "時差にして十七時間を差し引きます。"}, {"t": 1500.2, "x": "すると、地震が起きたのは、現地の時刻で"}, {"t": 1503.4, "x": "1700年1月26日、火曜日の午後九時ごろ、となります。"}, {"t": 1508.5666666666666, "x": "ただし、この時刻には幅があります。"}, {"t": 1511.4, "x": "真夜中に記録された水は、津波の先頭ではなく、"}, {"t": 1514.9333333333334, "x": "少し遅れて来た大きな波だったかもしれません。"}, {"t": 1518.2333333333333, "x": "その場合、地震はそれより一時間から"}, {"t": 1521.1333333333334, "x": "二時間ほど早かったことになります。"}, {"t": 1523.2333333333333, "x": "午後九時ごろという時刻は、"}, {"t": 1524.8666666666666, "x": "そうした幅を持った、計算の中心の値です。"}, {"t": 1528.75, "x": "カスケードの海岸には、何千年も"}, {"t": 1531.3166666666666, "x": "前から、人々が暮らしてきました。"}, {"t": 1533.6833333333334, "x": "ヨーロッパの人々と出会ったころ、この海岸では、"}, {"t": 1536.8333333333333, "x": "十を超える別々の言葉が話されていました。"}, {"t": 1539.9, "x": "人々は、出来事を、語りによって"}, {"t": 1542.7666666666667, "x": "世代から世代へ伝えてきました。"}, {"t": 1544.75, "x": "その話が文字に書き取られはじめるのは、"}, {"t": 1547.1666666666667, "x": "1860年代からです。それまでに、口で伝えられてきた話の"}, {"t": 1552.4, "x": "多くが失われたとも指摘されています。"}, {"t": 1554.75, "x": "それでも、大地の揺れや、海の水があふれたことを"}, {"t": 1558.6666666666667, "x": "語る話は、数多く残されていました。"}, {"t": 1561.5833333333333, "x": "2005年、ワシントン大学のルース・ルドウィンらが、"}, {"t": 1565.2833333333333, "x": "こうした話を集めて検討した論文を発表しています。"}, {"t": 1569.3, "x": "著者には、先住民の共同体の人々も加わっていました。"}, {"t": 1573.45, "x": "その一人は、カナダのバンクーバー島に暮らす、"}, {"t": 1576.7333333333333, "x": "フーアイアートの人々を代表する、ロバート・デニスです。"}, {"t": 1576.85, "x": "フーアイアート█"}, {"t": 1581.0166666666667, "x": "論文が取り上げた let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
