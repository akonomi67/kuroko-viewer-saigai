<script>
const D={"name": "ep009", "file": "ep009", "dur": 1981.4333125, "segs": [], "subs": [{"t": 0.0, "x": "アメリカ合衆国の北の内陸、ノースダコタ州。"}, {"t": 3.566666666666667, "x": "その南西部の牧場に、少し変わった地層が"}, {"t": 6.816666666666666, "x": "顔を出している場所があります。"}, {"t": 8.583333333333334, "x": "厚さは、1メートル余り。砂と泥が、まだ固まりきらずに、"}, {"t": 13.233333333333333, "x": "柔らかいまま重なっています。"}, {"t": 15.45, "x": "その中には、魚の骨格が、同じ向きに"}, {"t": 18.85, "x": "そろって横たわっています。"}, {"t": 20.416666666666668, "x": "魚のえらの間には、直径1ミリ前後の、"}, {"t": 23.75, "x": "ガラスの粒がはさまっています。"}, {"t": 25.966666666666665, "x": "地層のいちばん上には、厚さ1センチから"}, {"t": 28.95, "x": "2センチの、薄い粘土の帯がかぶさっています。"}, {"t": 32.083333333333336, "x": "その粘土からは、地表ではめったに見つからない"}, {"t": 35.583333333333336, "x": "金属、イリジウムが見つかりました。"}, {"t": 36.15, "x": "イリジウム█"}, {"t": 38.43333333333333, "x": "ガラスの粒も金属も、およそ三千キロ離れた"}, {"t": 41.8, "x": "場所から、空を通って運ばれてきたものです。"}, {"t": 44.88333333333333, "x": "現在のメキシコ、ユカタン半島。"}, {"t": 46.25, "x": "ユカタン半島█"}, {"t": 47.43333333333333, "x": "いまからおよそ6600万年前、そこに、"}, {"t": 48.6, "x": "6600万年前█"}, {"t": 50.96666666666667, "x": "直径10キロ前後と見積もられる天体がぶつかりました。"}, {"t": 54.96666666666667, "x": "この地層を調べた研究チームは、これが衝突から"}, {"t": 58.61666666666667, "x": "1時間ほどのうちに積もったと考えました。"}, {"t": 61.18333333333333, "x": "もしそうなら、ある一日の、それも最初の数十分が、"}, {"t": 65.31666666666666, "x": "そのまま地層になっていることになります。"}, {"t": 67.91666666666667, "x": "ただし、この読み方には、いまも異論があります。"}, {"t": 71.68333333333334, "x": "本当に衝突の当日のものなのか。"}, {"t": 74.2, "x": "研究者のあいだで、決着はついていません。"}, {"t": 77.5, "x": "この回で追うのは、衝突という出来事そのものです。"}, {"t": 81.11666666666666, "x": "空から何が来て、地面に何が起き、"}, {"t": 83.88333333333334, "x": "揺れと波がどこまで届いたのか。"}, {"t": 86.11666666666666, "x": "そしてその記録が、どこに、"}, {"t": 88.2, "x": "どのくらいの細かさで残っているのか。"}, {"t": 90.76666666666667, "x": "発掘した人々は、この場所をタニスと名付けました。"}, {"t": 93.33333333333333, "x": "タニス█"}, {"t": 95.5, "x": "古い文字を読み解く手がかりになった碑文が"}, {"t": 97.95, "x": "見つかった、古代エジプトの都市の名前です。"}, {"t": 101.03333333333333, "x": "この地層が、衝突の最初の一日を読み解く"}, {"t": 104.26666666666667, "x": "手がかりになるように、という名前です。"}, {"t": 106.85, "x": "話は、イタリアの石灰岩から始まります。"}, {"t": 110.15, "x": "地質の年代では、恐竜がいた"}, {"t": 113.11666666666666, "x": "時代の最後を白亜紀と呼びます。"}, {"t": 113.83333333333333, "x": "白亜紀█"}, {"t": 115.56666666666666, "x": "その次の時代は、古第三紀です。"}, {"t": 118.21666666666667, "x": "二つの時代の境目は、世界のあちこちの"}, {"t": 121.15, "x": "地層に、一本の線として残っています。"}, {"t": 124.06666666666666, "x": "地質学では、この境目をK-Pg境界と呼んでいます。"}, {"t": 126.36666666666666, "x": "K-Pg境界█"}, {"t": 129.28333333333333, "x": "境目の上と下では、地層に含まれる化石の"}, {"t": 132.63333333333333, "x": "顔ぶれが、はっきり入れ替わります。"}, {"t": 135.06666666666666, "x": "長いあいだ、その原因は、火山や気候の変化が"}, {"t": 138.93333333333334, "x": "ゆっくり効いたものと考えられてきました。"}, {"t": 141.28333333333333, "x": "この境目に、別の角度から光を当てた人たちがいます。"}, {"t": 145.23333333333332, "x": "地質学者のウォルター・アルバレスと、"}, {"t": 147.31666666666666, "x": "物理学者だったその父、ルイス・アルバレス。"}, {"t": 150.6, "x": "そして、化学者のフランク・"}, {"t": 152.55, "x": "アサロと、ヘレン・ミシェルです。"}, {"t": 154.43333333333334, "x": "四人が測ったのは、イリジウムを"}, {"t": 156.7, "x": "はじめとする、白金のなかまの金属でした。"}, {"t": 159.9, "x": "これらの金属は、地球の表面の岩には、"}, {"t": 163.13333333333333, "x": "ほとんど含まれていません。"}, {"t": 164.95, "x": "一方、宇宙から来る物質には、"}, {"t": 167.53333333333333, "x": "地表の岩よりずっと多く含まれています。"}, {"t": 170.45, "x": "地層の中で急にこの金属が増えていれば、"}, {"t": 173.28333333333333, "x": "宇宙から何かが大量に届いた目印になります。"}, {"t": 176.78333333333333, "x": "1980年、四人は、その測定結果を"}, {"t": 181.08333333333334, "x": "サイエンス誌に発表しました。"}, {"t": 182.91666666666666, "x": "イタリアの深い海でできた石灰岩では、"}, {"t": 185.45, "x": "境目でイリジウムがふだんのおよそ30倍。"}, {"t": 188.55, "x": "デンマークでは、およそ160倍。"}, {"t": 191.26666666666668, "x": "ニュージーランドでは、およそ20倍。"}, {"t": 193.85, "x": "遠く離れた三つの場所で、同じ境目にだけ、"}, {"t": 197.18333333333334, "x": "はっきりした増え方が見つかったのです。"}, {"t": 199.85, "x": "四人は、地球の軌道と交わる大きな小惑星が"}, {"t": 203.45, "x": "ぶつかった、という仮説を示しました。"}, {"t": 206.15, "x": "衝突すると、天体の重さのおよそ60倍の"}, {"t": 209.61666666666667, "x": "岩が、粉になって大気へ吹き上げられる。"}, {"t": 212.33333333333334, "x": "その細かな塵が、数年のあいだ成層圏に"}, {"t": 215.56666666666666, "x": "残り、世界中に広がる。論文は、"}, {"t": 218.26666666666668, "x": "そういう筋道を描いています。"}, {"t": 220.8, "x": "天体の大きさは、四つの別々の方法で見積もられました。"}, {"t": 225.05, "x": "答えは、直径10キロ、前後4キロの"}, {"t": 228.3, "x": "幅つき、というものでした。"}, {"t": 230.35, "x": "同じ1980年、オランダのヤン・スミットらも、"}, {"t": 234.11666666666667, "x": "同じ趣旨の論文をネイチャー誌に出しています。"}, {"t": 237.08333333333334, "x": "スミットの名前は、のちにタニスの"}, {"t": 239.45, "x": "論文にも、共著者として登場します。"}, {"t": 242.21666666666667, "x": "ただ、この時点では、決定的なものが欠けていました。"}, {"t": 246.23333333333332, "x": "ぶつかった跡、つまりクレーターが、"}, {"t": 248.65, "x": "どこにも見つかっていなかったのです。"}, {"t": 250.93333333333334, "x": "次の手がかりは、1984年に、アメリカの"}, {"t": 255.1, "x": "モンタナ州東部から出てきました。"}, {"t": 257.06666666666666, "x": "陸でできた地層の、同じ境目の粘土から、"}, {"t": 260.1333333333333, "x": "石英の粒が取り出されました。"}, {"t": 262.45, "x": "その粒には、結晶の決まった向きに沿って、"}, {"t": 265.51666666666665, "x": "細い平行な筋が刻まれていました。"}, {"t": 268.15, "x": "衝撃石英█"}, {"t": 268.15, "x": "衝撃石英と呼ばれるものです。"}, {"t": 270.9166666666667, "x": "この筋は、非常に速い物体がぶつかったときの、"}, {"t": 274.28333333333336, "x": "一瞬の強い衝撃でできる特徴です。"}, {"t": 277.1166666666667, "x": "論文は、これを地球の外から来た大きな天体との、"}, {"t": 280.9166666666667, "x": "高速の衝突の産物だと結論づけています。"}, {"t": 284.1666666666667, "x": "境目の粘土には、宇宙の金属と、衝撃を受けた"}, {"t": 288.35, "x": "鉱物の、二つが混じっていたことになります。"}, {"t": 291.26666666666665, "x": "残る問いは、ひとつでした。"}, {"t": 293.3333333333333, "x": "その衝突は、どこで起きたのか。"}, {"t": 295.85, "x": "手がかりになったのは、境目の"}, {"t": 297.95, "x": "地層に含まれる、小さなガラスの粒でした。"}, {"t": 301.0833333333333, "x": "岩が一瞬で溶けて空へ飛び、冷えて"}, {"t": 303.71666666666664, "x": "固まると、丸いガラスの粒になります。"}, {"t": 306.6333333333333, "x": "1991年、カリブ海のハイチ、ベロックという"}, {"t": 311.18333333333334, "x": "場所の境目から、ガラスの粒が報告されました。"}, {"t": 314.6166666666667, "x": "粒の成分には、二つの種類がありました。"}, {"t": 317.76666666666665, "x": "大陸の地殻の岩が溶けてできた、ケイ素の多いガラス。"}, {"t": 321.51666666666665, "x": "そして、石灰分を含む泥の地層が"}, {"t": 324.3333333333333, "x": "溶けてできた、カルシウムの多いガラスです。"}, {"t": 327.28333333333336, "x": "つまり、ぶつかった場所は、大陸のふちの、"}, {"t": 330.5833333333333, "x": "浅い海の底だった可能性が高い。"}, {"t": 333.2, "x": "論文は、そう読み取っています。"}, {"t": 335.65, "x": "ハイチの粒は、平均で直径3ミリから"}, {"t": 338.68333333333334, "x": "4ミリ、大きいものでは8ミリを超えます。"}, {"t": 341.71666666666664, "x": "粒は、遠くへ行くほど小さくなる傾向があります。"}, {"t": 345.3666666666667, "x": "大きな粒が出るということは、衝突した"}, {"t": 348.2, "x": "場所がそれほど遠くない、ということです。"}, {"t": 350.9166666666667, "x": "同じ1991年、アラン・ヒルデブランドらの"}, {"t": 354.6666666666667, "x": "論文が、地質学の専門誌に載りました。"}, {"t": 357.78333333333336, "x": "ユカタン半島の地下にある構造を、白亜紀の"}, {"t": 360.8833333333333, "x": "終わりの衝突クレーターの候補とするものです。"}, {"t": 363.7, "x": "共著者には、グレン・ペンフィールドと、"}, {"t": 366.21666666666664, "x": "アントニオ・カマルゴの名前があります。"}, {"t": 368.6166666666667, "x": "二人は、それ以前から、メキシコの石油探査の"}, {"t": 372.1666666666667, "x": "中で、この地下の円い構造に気づいていました。"}, {"t": 375.31666666666666, "x": "同じ年、ネイチャー誌にも、この場所を題名に"}, {"t": 378.75, "x": "疑問符付きで紹介する論文が出ています。"}, {"t": 381.43333333333334, "x": "チクシュルーブ█"}, {"t": 381.43333333333334, "x": "チクシュルーブは、半島の北の海岸にある地名です。"}, {"t": 386.1, "x": "このクレーターは、地表からは見えません。"}, {"t": 389.05, "x": "衝突のあとに積もった石灰岩の下に、"}, {"t": 391.71666666666664, "x": "すっぽりと埋まっているからです。"}, {"t": 393.8, "x": "そのため、大きさの見積もりは、直径170キロから"}, {"t": 398.06666666666666, "x": "300キロまで、大きくばらついていました。"}, {"t": 400.98333333333335, "x": "直径が変われば、衝突のエネルギーの"}, {"t": 403.76666666666665, "x": "見積もりは、十倍ほども変わってしまいます。"}, {"t": 406.75, "x": "1995年、重力の測定データを細かく読み直した"}, {"t": 411.3333333333333, "x": "研究が、直径をおよそ180キロと示しました。"}, {"t": 415.18333333333334, "x": "この研究は、ユカタン半島の地表に開いている、"}, {"t": 418.73333333333335, "x": "水をたたえた穴の並び方も証拠に添えています。"}, {"t": 422.2, "x": "これについては、終章でもう一度触れます。"}, {"t": 425.3, "x": "年代の確認も進みました。2013年、"}, {"t": 428.4166666666667, "x": "岩に含まれるアルゴンの割合を"}, {"t": 430.85, "x": "使って、衝突と境目の年代が測り直されました。"}, {"t": 434.6666666666667, "x": "その結果、二つは、3万2千年の"}, {"t": 437.95, "x": "範囲の中で同時だと示されました。"}, {"t": 440.1166666666667, "x": "6600万年のうちの、3万2千年です。"}, {"t": 443.75, "x": "地質の時計としては、ほぼ同じ瞬間と言ってよい精度です。"}, {"t": 447.85, "x": "2010年には、世界の40人を超える研究者が、"}, {"t": 451.8, "x": "境目の地層の記録をまとめ直しています。"}, {"t": 454.76666666666665, "x": "チクシュルーブと結びつく噴出物の層が、"}, {"t": 457.46666666666664, "x": "世界中の境目に、一枚だけ広がっている。"}, {"t": 461.0, "x": "それが、まとめの結論でした。"}, {"t": 463.45, "x": "ただし、ここまでで分かったのは、衝突の"}, {"t": 466.68333333333334, "x": "場所と、年代と、おおよその規模です。"}, {"t": 469.68333333333334, "x": "その瞬間に、何が、どの順番で起きたのか。"}, {"t": 473.48333333333335, "x": "それを読み取るには、もっと細かい記録が必要でした。"}, {"t": 477.1666666666667, "x": "ここで、空から来たものを、あらためて見てみます。"}, {"t": 480.8666666666667, "x": "直径10キロなら、世界でいちばん高い山、"}, {"t": 484.1333333333333, "x": "エベレストの高さを上回る大きさです。"}, {"t": 487.1666666666667, "x": "2020年の研究は、埋まったクレーターの"}, {"t": 490.4, "x": "地下の形を、コンピューターの計算と比べました。"}, {"t": 493.8, "x": "クレーターの地下の構造には、わずかな偏りがあります。"}, {"t": 497.6166666666667, "x": "その偏りは、天体が入ってきた"}, {"t": 500.1666666666667, "x": "向きと角度を反映しています。"}, {"t": 502.01666666666665, "x": "結論は、北東の方角から、地面に対して45度から"}, {"t": 506.4, "x": "60度という、急な角度での衝突でした。"}, {"t": 509.53333333333336, "x": "30度より浅い、かすめるような角度は、"}, {"t": 512.5666666666667, "x": "複数の証拠から否定されています。"}, {"t": 515.1333333333333, "x": "急な角度でぶつかると、飛び散る岩が、"}, {"t": 517.9833333333333, "x": "まわりへほぼ均等に広がります。"}, {"t": 520.4, "x": "さらに、同じ重さの天体でも、気候を変える"}, {"t": 523.95, "x": "ガスを、より多く吐き出すことになります。"}, {"t": 526.7333333333333, "x": "この研究は、速さを秒速12キロと、"}, {"t": 529.8666666666667, "x": "秒速20キロの二通りで計算しています。"}, {"t": 533.1333333333333, "x": "秒速20キロなら、直径10キロの岩は、自分の"}, {"t": 537.2333333333333, "x": "大きさぶんの距離を、0.5秒で進みます。"}, {"t": 540.4833333333333, "x": "先端が地面に触れてから、全体が"}, {"t": 543.2, "x": "めり込むまで、1秒もかかりません。"}, {"t": 545.75, "x": "では、この天体は、何でできていたのか。"}, {"t": 549.0833333333334, "x": "2024年に、ルテニウムという金属を"}, {"t": 552.3166666666667, "x": "使った研究が発表されました。"}, {"t": 554.5, "x": "ルテニウムには、重さのわずかに"}, {"t": 556.75, "x": "違う何種類かの形があります。"}, {"t": 558.8666666666667, "x": "その割合は、太陽系のどこで生まれた"}, {"t": 561.75, "x": "天体かによって、少しずつ異なります。"}, {"t": 564.6333333333333, "x": "境目の地層三か所で測ると、割合は、炭素を"}, {"t": 568.6833333333333, "x": "多く含むタイプの小惑星と一致しました。"}, {"t": 571.4666666666667, "x": "このタイプは、木星の軌道より"}, {"t": 573.7, "x": "外側で生まれたと考えられています。"}, {"t": 576.05, "x": "同じ研究で調べた、ほかの五つの衝突の跡は、"}, {"t": 579.7, "x": "太陽に近い側で生まれた岩石質の小惑星と合いました。"}, {"t": 583.9833333333333, "x": "6600万年前に来たものは、ふだんより"}, {"t": 587.1666666666666, "x 667, "x": "地層の途中には、落ちてきた粒が、柔らかい地面を"}, {"t": 1185.7166666666667, "x": "3センチから8センチへこませた跡もありました。"}, {"t": 1188.65, "x": "一度目の水が引き、二度目の水が来るまでのあいだ。"}, {"t": 1192.2833333333333, "x": "むき出しになった地面へ、粒が"}, {"t": 1194.5333333333333, "x": "空から落ちてきた、と読める跡です。"}, {"t": 1197.0833333333333, "x": "ここからが、タニスの読み方の核心です。"}, {"t": 1200.1333333333334, "x": "まず、この地層を作った水は、何だったのか。"}, {"t": 1203.9166666666667, "x": "論文自身が認めるとおり、この地層は、津波の"}, {"t": 1207.6833333333334, "x": "堆積物と、見た目の特徴がすべてそろっています。"}, {"t": 1211.2166666666667, "x": "しかし、メキシコ湾からの津波がタニスに"}, {"t": 1214.1666666666667, "x": "届くには、少なくとも18時間かかります。"}, {"t": 1217.3333333333333, "x": "そこで論文が持ち出したのが、セイシュという現象です。"}, {"t": 1219.7333333333333, "x": "セイシュ█"}, {"t": 1221.7833333333333, "x": "セイシュとは、湖や入り江など、閉じた水域の"}, {"t": 1225.2833333333333, "x": "水が、全体として大きく揺れ動く現象です。"}, {"t": 1228.7, "x": "浴槽の水を片側から押すと、水は"}, {"t": 1231.5666666666666, "x": "向こう側で盛り上がり、また戻ってきます。"}, {"t": 1234.4166666666667, "x": "それと同じことが、湖や入り江の大きさで起きるのです。"}, {"t": 1238.35, "x": "大きな地震の揺れは、遠く離れた場所の"}, {"t": 1241.2166666666667, "x": "水にも、この揺れを起こすことがあります。"}, {"t": 1243.9166666666667, "x": "津波と違って、水そのものが"}, {"t": 1246.2333333333333, "x": "長い距離を旅してくる必要はありません。"}, {"t": 1248.7666666666667, "x": "揺れが届けば、その場の水が、その場で揺れはじめます。"}, {"t": 1252.8666666666666, "x": "論文の計算では、この揺れは、世界中の閉じた"}, {"t": 1256.6333333333334, "x": "水域で、大きなセイシュを起こしえました。"}, {"t": 1259.5166666666667, "x": "その規模は、10メートルから100メートルとされます。"}, {"t": 1263.0333333333333, "x": "タニスの、少なくとも10メートルという"}, {"t": 1265.6, "x": "水の高さは、その範囲に入ります。"}, {"t": 1268.2833333333333, "x": "次に、時刻です。論文は、ガラスの粒が飛んできた道筋を、"}, {"t": 1273.2166666666667, "x": "弾道として計算し直しています。"}, {"t": 1275.7833333333333, "x": "粒が斜め30度から60度で打ち上げられたとすると、"}, {"t": 1279.1833333333334, "x": "タニスの上空に届くのは13分後から25分後。"}, {"t": 1283.1833333333334, "x": "粒が降りはじめるのは、およそ15分後。"}, {"t": 1286.2333333333333, "x": "大半は、1時間から2時間のうちに降り終えます。"}, {"t": 1289.9333333333334, "x": "衝撃石英は、より高く打ち上げられ、"}, {"t": 1292.8833333333334, "x": "およそ38分後から2時間後ごろに届くとされます。"}, {"t": 1296.8, "x": "ここで、地層の中身と照らし合わせます。"}, "}, {"t": 1421.15, "x": "掘削の岩、年代測定、世界中の地層の"}, {"t": 1424.35, "x": "突き合わせで、繰り返し確かめられてきました。"}, {"t": 1427.2833333333333, "x": "二つ目、有力だが、確かめられている途中の部分です。"}, {"t": 1431.5666666666666, "x": "タニスの地層が、衝突の直後に、揺れによるセイシュで"}, {"t": 1435.4166666666667, "x": "積もったという読み方は、ここに入ります。"}, {"t": 1438.1833333333334, "x": "この見方には、裏づけもあります。"}, {"t": 1440.7166666666667, "x": "2022年、別の研究チームが、タニスの魚の"}, {"t": 1445.0333333333333, "x": "骨を調べた論文をネイチャー誌に発表しました。"}, {"t": 1448.0166666666667, "x": "魚の骨には、木の年輪のように、"}, {"t": 1450.7333333333333, "x": "一年ごとの成長の跡が刻まれています。"}, {"t": 1453.7333333333333, "x": "その跡と、骨の成分の変化から、魚が埋もれたのは"}, {"t": 1457.95, "x": "北半球の春だった、と結論づけています。"}, {"t": 1461.15, "x": "魚がある決まった季節にそろって埋もれたという点は、"}, {"t": 1464.5333333333333, "x": "この独立した研究とも合っています。"}, {"t": 1467.2, "x": "一方で、疑問の声も、最初からありました。"}, {"t": 1470.9166666666667, "x": "論文が出る前、発見が学会で短く紹介された"}, {"t": 1474.75, "x": "段階で、強い疑いを口にした研究者がいます。"}, {"t": 1478.4166666666667, "x": "この地域を長年調べてきた研究者です。"}, {"t": 1481.3666666666666, "x": "自分の調査では、タニスは境目より"}, {"t": 1484.1666666666667, "x": "十数メートル下にあり、10万年ほど古いかもしれない。"}, {"t": 1487.9666666666667, "x": "雑誌の取材に、そう述べていました。"}, {"t": 1490.5666666666666, "x": "一方、2019年の論文は、地層のすぐ上に"}, {"t": 1494.7666666666667, "x": "境目の粘土の帯がのっていることを根拠にしています。"}, {"t": 1498.0833333333333, "x": "さらに、論文自身も、読み方に条件を付けています。"}, {"t": 1502.5, "x": "地層の中のガラスの粒が、空から"}, {"t": 1505.0666666666666, "x": "直接降ってきたものであれば、という条件です。"}, {"t": 1508.4333333333334, "x": "粒が一度どこかに積もってから、水に"}, {"t": 1510.9666666666667, "x": "運ばれてきたものなら、時刻の計算は成り立ちません。"}, {"t": 1514.55, "x": "水の正体も同じです。セイシュだと判断した決め手は、"}, {"t": 1518.1166666666666, "x": "地層の形ではなく、時刻の計算でした。"}, {"t": 1521.5, "x": "時刻の読みが揺らげば、水の正体の読みも揺らぎます。"}, {"t": 1525.3166666666666, "x": "三つ目、決着のついていない部分と、少数の見方です。"}, {"t": 1529.8, "x": "2021年、同じ研究者を筆頭にした別の"}, {"t": 1533.6, "x": "論文が、衝突の季節を春から夏と推定しました。"}, {"t": 1537.4666666666667, "x": "この論文に対して、2024年、2022年の"}, {"t": 1541.8, "x": "論文の研究者らが、問題点を指摘する論文を出しています。"}, {"t": 1546.25, "x": "元になった測定値が公開されていないこと。"}, {"t": 1549.0666666666666, "x": "測定をした施設が 676.0166666666667, "x": "2023年には、塵の役割を"}, {"t": 1678.9166666666667, "x": "大きく見る研究が発表されました。"}, {"t": 1681.2833333333333, "x": "ノースダコタ州の陸の地層で、"}, {"t": 1683.1833333333334, "x": "境目の塵の粒の大きさが測られました。"}, {"t": 1686.2833333333333, "x": "すると、直径0.8から8マイクロメートルほどの"}, {"t": 1689.8333333333333, "x": "細かい塵が、予想より多く含まれていました。"}, {"t": 1693.0833333333333, "x": "この大きさの塵は、なかなか落ちてきません。"}, {"t": 1696.1833333333334, "x": "計算では、塵は15年ほど大気中にとどまり、"}, {"t": 1699.7166666666667, "x": "地球の平均気温を、最大で15度ほど下げました。"}, {"t": 1703.9333333333334, "x": "植物が光合成に使える光は、2年近く、"}, {"t": 1707.4166666666667, "x": "ほぼ止まるほどまで弱まったとされています。"}, {"t": 1710.2, "x": "一方で、すすの役割を大きく見る研究もあります。"}, {"t": 1714.1, "x": "2016年の研究は、衝突した場所の石油の"}, {"t": 1717.7833333333333, "x": "もとになる成分が燃えて、すすが広がったと考えました。"}, {"t": 1721.55, "x": "2009年の研究も、燃えたのは森の木より、"}, {"t": 1724.95, "x": "地下の炭化水素だったとしています。塵と、硫黄と、すす。"}, {"t": 1729.8166666666666, "x": "どれがどれだけ効いたのかは、研究によって"}, {"t": 1732.6833333333334, "x": "重みの置き方が違い、決着していません。"}, {"t": 1735.75, "x": "ただ、衝突のあとに日光が大きく弱まり、"}, {"t": 1738.9333333333334, "x": "地表が冷えたという点では一致しています。"}, {"t": 1742.0166666666667, "x": "その結果として、白亜紀の終わりには、"}, {"t": 1744.6666666666667, "x": "陸と海の多くの種が姿を消しました。"}, {"t": 1747.4, "x": "生き物の側で何が起きたのかは、別の"}, {"t": 1750.15, "x": "物語になるため、この回では立ち入りません。"}, {"t": 1753.3333333333333, "x": "ここで見ておきたいのは、空を暗くしたものの"}, {"t": 1756.2666666666667, "x": "多くが、地面の側から出ていたということです。"}, {"t": 1759.4166666666667, "x": "浅い海の底に積もっていた石膏と"}, {"t": 1762.0, "x": "石灰岩。そして、地下の炭化水素。"}, {"t": 1764.7666666666667, "x": "同じ大きさの天体でも、ぶつかる場所が"}, {"t": 1767.6, "x": "違えば、空に上がるものは変わります。"}, {"t": 1770.3333333333333, "x": "6600万年前の天体は、硫黄と炭素を"}, {"t": 1773.9833333333333, "x": "多く抱えた地面に、急な角度で落ちました。"}, {"t": 1777.1, "x": "その組み合わせが、空の暗さに"}, {"t": 1779.45, "x": "大きく関わったと考えられています。"}, {"t": 1781.7, "x": "最後に、この衝突が、いまの"}, {"t": 1784.4333333333334, "x": "地面にどう関わっているかを見ます。"}, {"t": 1786.55, "x": "ユカタン半島の地表を歩いても、"}, {"t": 1788.7, "x": "山の輪も、大きな窪地も見えません。"}, {"t": 1791.7166666666667, "x": "ただ、ひとつだけ、地表から見える手がかりがあります。"}, {"t": 1795.6833333333334, "x": "セノーテ█"}, {"t": 1795.6833333333334, "x": "セノーテです。セノーテとは、"}, {"t": 1798.25, "x": "石灰岩が水に溶かされてできた、"}, {"t": 1801.0, "x": "地下水をたたえた縦穴のことです。"}, {"t": 1803.5, "x": "ユカタン半島の北西部では、このセノーテが、"}, {"t": 1806.8, "x": "弧を描くように並んでいます。"}, {"t": 1808.9666666666667, "x": "1995年の研究は、この並びが、重力で見つかった"}, {"t": 1814.0166666666667, "x": "クレーターの縁と重なることを示しました。"}, {"t": 1816.5166666666667, "x": "縁の近くでは、衝突のあと、岩が内側へ"}, {"t": 1820.1833333333334, "x": "滑り落ちて、たくさんの割れ目ができました。"}, {"t": 1823.1333333333334, "x": "その割れ目に沿って地下水が流れやすくなり、"}, {"t": 1825.7833333333333, "x": "石灰岩が溶けて、穴が開いたと考えられています。"}, {"t": 1829.95, "x": "この弧は、セノーテの輪と呼ばれています。"}, {"t": 1830.7666666666667, "x": "セノーテの輪█"}, {"t": 1833.2333333333333, "x": "6600万年前の穴の縁が、地下水の"}, {"t": 1836.6333333333334, "x": "通り道として、地表に点線を描いているのです。"}, {"t": 1840.1, "x": "ユカタン半島の地面は、雨を"}, {"t": 1842.5, "x": "すぐに地下へしみこませてしまいます。"}, {"t": 1844.65, "x": "そのため、地表には川や湖がほとんどできません。"}, {"t": 1848.55, "x": "半島で使える淡水は、地下水だけだと報告されています。"}, {"t": 1852.8333333333333, "x": "セノーテの輪の地下水は、いまも"}, {"t": 1855.2, "x": "暮らしの水として使われています。"}, {"t": 1857.2166666666667, "x": "その水質を守ることが、いまの研究の課題になっています。"}, {"t": 1861.3833333333334, "x": "衝突の縁にできた割れ目が、川のない土地で、"}, {"t": 1864.7166666666667, "x": "水を集める仕組みになっているのです。"}, {"t": 1867.1833333333334, "x": "もうひとつは、海の底です。"}, {"t": 1869.4833333333333, "x": "ユカタン半島の西、カンペチェの沖の"}, {"t": 1872.4666666666667, "x": "メキシコ湾に、カンタレルという油田があります。"}, {"t": 1873.3333333333333, "x": "カンタレル█"}, {"t": 1875.9, "x": "この油田で、いちばん多くの石油を産み出してきた"}, {"t": 1879.1833333333334, "x": "地層は、白亜紀と古第三紀の境目にあります。"}, {"t": 1882.4333333333334, "x": "炭酸塩の岩の、角ばったかけらが積み重なった層です。"}, {"t": 1886.3833333333334, "x": "2000年と2002年の研究は、この層がチクシュルーブの"}, {"t": 1890.3666666666666, "x": "衝突と結びついてできたと報告しています。"}, {"t": 1893.2166666666667, "x": "衝突の揺れで浅い海の台地のふちが崩れ、"}, {"t": 1896.1166666666666, "x": "斜面の下に岩のかけらが厚く積もった。"}, {"t": 1899.1, "x": "その、すき間の多い岩の層が、のちに石油を"}, {"t": 1902.6166666666666, "x": "ためる入れ物になったという考え方です。"}, {"t": 1905.1166666666666, "x": "クレーターの存在に最初に気づいたのは、"}, {"t": 1907.5833333333333, "x": "石油を探していた技術者たちでした。"}, {"t": 1910.2, "x": "その穴の揺れで崩れた岩が、"}, {"t": 1912.1, "x": "いまの石油の入れ物になっていました。"}, {"t": 1914.5666666666666, "x": "同じ一つの出来事を、人は、水と石油という"}, {"t": 1918.1, "x": "二つの方向から掘り当てていたことになります。"}, {"t": 1920.8, "x": "話を、ノースダコタの川に戻します。"}, {"t": 1923.7166666666667, "x": "タニスの1.3メートルが、"}, {"t": 1925.5166666666667, "x": "衝突から1時間ほどの記録なのかどうか。"}, {"t": 1928.6166666666666, "x": "その答えは、まだ出ていません。"}, {"t": 1930.9666666666667, "x": "ただ、その問いの立て方そのものが、"}, {"t": 1933.4166666666667, "x": "この研究の進み方をよく表しています。"}, {"t": 1936.5, "x": "1980年に問われたのは、衝突があったかどうかでした。"}, {"t": 1941.0666666666666, "x": "1990年代に問われたのは、"}, {"t": 1943.6166666666666, "x": "その穴がどこにあるのかでした。"}, {"t": 1945.7666666666667, "x": "2010年代には、クレーターの真上で、最初の"}, {"t": 1949.5, "x": "一日の130メートルが時間の順に読まれました。"}, {"t": 1952.7666666666667, "x": "そしていま問われているのは、遠く離れた"}, {"t": 1955.4, "x": "川で、それが衝突の何分後だったのか、です。"}, {"t": 1959.35, "x": "問いの単位は、何百万年から、一日へ、"}, {"t": 1963.0, "x": "そして分へと、細かくなってきました。"}, {"t": 1966.0666666666666, "x": "6600万年前の、春だったとされる、ある一日。"}, {"t": 1970.55, "x": "その最初の数時間を、どこまで"}, {"t": 1972.9166666666667, "x": "確かな記録として読めるのか。"}, {"t": 1974.7, "x": "その判定は、これから掘り出される地層と、"}, {"t": 1977.7333333333333, "x": "測り直される数字に委ねられています。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
