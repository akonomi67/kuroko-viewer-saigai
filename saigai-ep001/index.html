<script>
const D={"name": "46億年の災害史 ep001", "file": "ep001", "dur": 1902.6833125, "segs": [], "subs": [{"t": 0.0, "x": "地中海の底には、砂漠が埋まっています。"}, {"t": 3.0833333333333335, "x": "砂でできた砂漠ではありません。"}, {"t": 5.166666666666667, "x": "塩でできた地層です。"}, {"t": 6.816666666666666, "x": "厚いところでは、二千メートルを"}, {"t": 9.1, "x": "超えると報告されています。"}, {"t": 10.816666666666666, "x": "広がっている範囲は、地中海のほぼ全域です。"}, {"t": 14.3, "x": "体積にすると、およそ百万立方キロメートル。"}, {"t": 17.7, "x": "世界中の海に溶けている塩の、"}, {"t": 19.833333333333332, "x": "およそ二十分の一に当たる量です。"}, {"t": 22.4, "x": "この塩は、海が"}, {"t": 23.966666666666665, "x": "ゆっくり濃くなってできたものではありません。"}, {"t": 26.35, "x": "海の水そのものが減ったあとに、残ったものです。"}, {"t": 29.766666666666666, "x": "いまからおよそ597万年前。"}, {"t": 32.6, "x": "地中海は、大西洋とのつながりを失いました。"}, {"t": 36.18333333333333, "x": "つながりを失った海に起きるのは、蒸発だけです。"}, {"t": 39.81666666666667, "x": "水面が下がり、岸が遠ざかり、"}, {"t": 42.416666666666664, "x": "川は自分の河口を追って地面を掘りました。"}, {"t": 45.63333333333333, "x": "最後に残ったのは、水ではなく塩でした。"}, {"t": 48.75, "x": "その状態が、およそ60万年ほど続きます。"}, {"t": 52.28333333333333, "x": "60万年という長さは、いまの人類が"}, {"t": 55.36666666666667, "x": "現れてからの時間の、およそ二倍に当たります。"}, {"t": 58.5, "x": "そして533万年前、水が戻ってきます。"}, {"t": 62.516666666666666, "x": "戻り方については、いまも議論が続いています。"}, {"t": 65.95, "x": "ただ、戻ったこと自体を疑う研究者はいません。"}, {"t": 69.51666666666667, "x": "なぜそこまで言えるのか。"}, {"t": 71.08333333333333, "x": "この出来事の証拠は、推測ではなく"}, {"t": 73.78333333333333, "x": "実物として引き上げられているからです。"}, {"t": 76.05, "x": "海の底を掘って、乾いた場所にしかできない"}, {"t": 79.16666666666667, "x": "石を取り出した人たちがいます。"}, {"t": 81.01666666666667, "x": "この出来事には、名前が付いています。"}, {"t": 83.78333333333333, "x": "メッシニアン塩分危機。"}, {"t": 85.38333333333334, "x": "イタリア、シチリア島の街メッシーナにちなんだ名前です。"}, {"t": 89.33333333333333, "x": "海がひとつ、消えかけた記録です。"}, {"t": 91.88333333333334, "x": "この塩の層が見つかったのは、1970年のことです。"}, {"t": 96.2, "x": "グローマー・チャレンジャー号という"}, {"t": 97.83333333333333, "x": "掘削船が、地中海に入りました。"}, {"t": 100.63333333333334, "x": "深海掘削計画、ディープ・シー・ドリリング・"}, {"t": 103.61666666666666, "x": "プロジェクトの第13次航海です。"}, {"t": 105.83333333333333, "x": "船はポルトガルのリスボンを8月に出て、"}, {"t": 108.48333333333333, "x": "10月に同じ港へ戻っています。"}, {"t": 111.06666666666666, "x": "目的は、地中海という海がどうやってできたのかを"}, {"t": 114.56666666666666, "x": "調べることでした。"}, {"t": 115.68333333333334, "x": "それ以前から、奇妙なことは分かっていました。"}, {"t": 118.8, "x": "音波で海底の下を探ると、地中海のほぼ全域で、"}, {"t": 122.65, "x": "同じ深さに強い反射面が現れます。"}, {"t": 125.58333333333333, "x": "海底から百メートルから二百メートルほど下です。"}, {"t": 128.85, "x": "そこだけ、音の返り方が周囲とはっきり違いました。"}, {"t": 132.63333333333333, "x": "何かの層が、地中海の底にふたをするように広がっている。"}, {"t": 136.75, "x": "そこまでは分かっても、中身は音では分かりません。"}, {"t": 140.18333333333334, "x": "確かめる方法は、掘って持ち帰ることだけでした。"}, {"t": 143.58333333333334, "x": "この航海で、船は地中海のあちこちで"}, {"t": 146.48333333333332, "x": "海底に穴を開けています。"}, {"t": 148.16666666666666, "x": "西のバレアレス海盆から、東のレバント海盆まで。"}, {"t": 151.9, "x": "狙ったのは、その強い反射面の正体でした。"}, {"t": 155.26666666666668, "x": "引き上げられたのは、石膏と岩塩でした。"}, {"t": 158.26666666666668, "x": "石膏は、海水が濃くなっていく途中で沈む鉱物です。"}, {"t": 162.38333333333333, "x": "岩塩は、さらに濃くならないと出てきません。"}, {"t": 165.48333333333332, "x": "どちらも、水が減った場所にできる石です。"}, {"t": 168.58333333333334, "x": "それが、水深三千メートル級の海の底から出てきました。"}, {"t": 172.85, "x": "この結果をどう読むかで、船の"}, {"t": 175.06666666666666, "x": "上では長い議論がありました。"}, {"t": 176.91666666666666, "x": "中心にいたのは、ケネス・ヒュー、ウィリアム・"}, {"t": 180.03333333333333, "x": "ライアン、マリア・ビアンカ・チタの三人です。"}, {"t": 183.08333333333334, "x": "三人が出した答えは、当時としては極端なものでした。"}, {"t": 187.01666666666668, "x": "地中海は、かつて干上がっていた。"}, {"t": 189.56666666666666, "x": "しかも、少し浅くなった、という程度ではない。"}, {"t": 193.21666666666667, "x": "世界の海面より、はるかに低いところまで下がっていた。"}, {"t": 197.01666666666668, "x": "根拠は、塩そのものだけではありませんでした。"}, {"t": 200.16666666666666, "x": "深い海の底から取れたはずの試料に、浅い"}, {"t": 203.31666666666666, "x": "場所にしかいない生き物の殻が混じっていました。"}, {"t": 206.06666666666666, "x": "乾いた泥がひび割れた跡も見つかりました。"}, {"t": 208.75, "x": "どちらも、三千メートルの海の底では起こらないことです。"}, {"t": 212.65, "x": "さらに、この塩の量そのものが桁外れでした。"}, {"t": 216.06666666666666, "x": "当時の見積もりで、世界の海に溶けている"}, {"t": 218.86666666666667, "x": "塩の、およそ五パーセントに当たります。"}, {"t": 221.5, "x": "海の塩の二十分の一が、地中海の"}, {"t": 224.41666666666666, "x": "底に固体で置かれている計算になります。"}, {"t": 226.93333333333334, "x": "この量を、水の中でゆっくり溜めることはできません。"}, {"t": 230.53333333333333, "x": "水そのものが、繰り返し失われる必要があります。"}, {"t": 234.2, "x": "発表された当時、この説は強い反発を受けました。"}, {"t": 238.15, "x": "海が干上がるという話が、単純に信じにくかったからです。"}, {"t": 242.25, "x": "別の読み方も出されました。"}, {"t": 244.08333333333334, "x": "塩は深い海の底でも溜まりうる、という考え方です。"}, {"t": 248.18333333333334, "x": "地下の塩が押し上げられて出てきただけではないか、という"}, {"t": 251.76666666666668, "x": "指摘もありました。"}, {"t": 252.81666666666666, "x": "どの反論も、一点では退けられませんでした。"}, {"t": 256.35, "x": "決め手になったのは、同じ層が、地中海の"}, {"t": 259.6, "x": "どこを掘っても同じ順番で出てきたことです。"}, {"t": 262.2, "x": "しかしその後の掘削でも、同じ層は"}, {"t": 264.9, "x": "同じように出てきました。"}, {"t": 266.28333333333336, "x": "シチリア島では、同じ時代の"}, {"t": 268.48333333333335, "x": "石膏の地層が地上に露出しています。"}, {"t": 271.0, "x": "イタリアでもスペインでも、"}, {"t": 272.5, "x": "陸の上で実物に触れることができます。"}, {"t": 275.3333333333333, "x": "海の底と陸の上で、同じ記録が残っていました。"}, {"t": 278.93333333333334, "x": "現在では、この時代に地中海が大西洋から"}, {"t": 282.25, "x": "切り離されたこと自体は、定説として扱われています。"}, {"t": 286.03333333333336, "x": "なお、メッシニアンという時代の名前は、"}, {"t": 289.2, "x": "地中海とは関係のないところで先に付いていました。"}, {"t": 292.76666666666665, "x": "1867年、カール・マイヤー＝"}, {"t": 295.93333333333334, "x": "アイマーという研究者が名付けました。"}, {"t": 298.56666666666666, "x": "由来は、シチリア島のメッシーナです。"}, {"t": 301.3666666666667, "x": "中新世の最後の時代区分を指す名前でした。"}, {"t": 304.55, "x": "その名前が、百年後に、海が"}, {"t": 307.3833333333333, "x": "消えた時代の名前になりました。"}, {"t": 309.21666666666664, "x": "なぜ、つながりが切れただけで海が消えるのか。"}, {"t": 312.45, "x": "理由は、地中海という海の性質にあります。"}, {"t": 315.93333333333334, "x": "地中海は、水の収支が赤字の海です。"}, {"t": 319.06666666666666, "x": "雨で入ってくる水と、川から流れこむ水を"}, {"t": 322.31666666666666, "x": "足しても、蒸発する水に届きません。"}, {"t": 325.01666666666665, "x": "周りが乾いた土地に囲まれ、日射が強く、"}, {"t": 328.2, "x": "面積の割に大きな川が少ないためです。"}, {"t": 331.25, "x": "数字で見ておきます。"}, {"t": 332.71666666666664, "x": "地中海の面積は、およそ二百五十万平方キロメートル。"}, {"t": 337.01666666666665, "x": "水の量は、およそ三百七十万立方キロメートル。"}, {"t": 340.9, "x": "平均の深さはおよそ千五百メートルで、"}, {"t": 343.6, "x": "いちばん深いところはギリシャ沖のカリプソ海淵です。"}, {"t": 347.2, "x": "深さは五千百メートルを超えます。"}, {"t": 349.6, "x": "決して小さな海でも、浅い海でもありません。"}, {"t": 352.98333333333335, "x": "足りないぶんを埋めているのが、"}, {"t": 354.6333333333333, "x": "ジブラルタル海峡から入ってくる大西洋の水です。"}, {"t": 358.21666666666664, "x": "いちばん狭いところで、幅はおよそ十四キロメートル。"}, {"t": 361.95, "x": "この一本の通り道だけが、地中海の水位を支えています。"}, {"t": 366.3, "x": "東側からも、水は入っています。"}, {"t": 369.2, "x": "ボスポラス海峡を通って、黒海から流れこむ水です。"}, {"t": 373.18333333333334, "x": "ただし量は限られていて、赤字を埋めるには足りません。"}, {"t": 376.8666666666667, "x": "通り道の中では、水が上下二層に"}, {"t": 379.6666666666667, "x": "分かれて出入りしています。"}, {"t": 381.1166666666667, "x": "表層では、塩分の低い大西洋の水が地中海へ入ります。"}, {"t": 385.75, "x": "その下では、蒸発で濃くなった"}, {"t": 388.1, "x": "重い水が、大西洋へ出ていきます。"}, {"t": 390.85, "x": "地中海の水がそっくり入れ替わるのに、"}, {"t": 393.25, "x": "八十年から百年かかると見積もられています。"}, {"t": 396.5, "x": "この交換が止まると、どうなるか。"}, {"t": 399.1, "x": "蒸発で失われる量は、一年あたり"}, {"t": 401.8666666666667, "x": "およそ三千三百立方キロメートルと見積もられています。"}, {"t": 405.4, "x": "持っている水の総量をこの数字で割ります。"}, {"t": 408.15, "x": "割り算をすると、およそ千百年という数字が出ます。"}, {"t": 411.9, "x": "つまり、大西洋からの流入が完全に止まった場合。"}, {"t": 415.78333333333336, "x": "地中海は、千年余りで干上がる計算になります。"}, {"t": 419.56666666666666, "x": "地質学の時間の尺度でいえば、これは一瞬です。"}, {"t": 423.21666666666664, "x": "数億年を扱う地層の中では、"}, {"t": 425.56666666666666, "x": "千年は線一本の幅もありません。"}, {"t": 428.35, "x": "ここが、この出来事の本質です。"}, {"t": 430.95, "x": "地中海が特別に脆かったわけではありません。"}, {"t": 433.9166666666667, "x": "蒸発が流入を上回る海は、ふたをされた"}, {"t": 437.1, "x": "瞬間から減りはじめます。"}, {"t": 438.71666666666664, "x": "実際、いまの地中海はすでに大西洋より"}, {"t": 441.98333333333335, "x": "塩辛くなっています。"}, {"t": 443.3333333333333, "x": "入ってきた水から、水だけが先に抜けていくためです。"}, {"t": 447.03333333333336, "x": "東へ行くほど塩分が高くなるのも、同じ理由です。"}, {"t": 450.81666666666666, "x": "入り口が西の一箇所しかないので、"}, {"t": 452.96666666666664, "x": "東の端がいちばん長く蒸発にさらされます。"}, {"t": 456.28333333333336, "x": "この傾き方は、いまも毎年観測されています。"}, {"t": 459.8666666666667, "x": "つまり地中海は、規模を小さくした"}, {"t": 462.46666666666664, "x": "同じ仕組みを、現在も動かし続けています。"}, {"t": 465.6, "x": "そして、水が減っても、溶けている塩は出ていきません。"}, {"t": 469.73333333333335, "x": "出ていくのは水だけです。"}, {"t": 471.4, "x": "残った水は、その分だけ濃くなります。"}, {"t": 474.25, "x": "濃くなった水は、溶けきれなくなったものを"}, {"t": 476.95, "x": "底に落とします。"}, {"t": 478.03333333333336, "x": "これが、蒸発岩と呼ばれる岩石のできかたです。"}, {"t": 481.6, "x": "塩の地層とは、失われた水の"}, {"t": 484.25, "x": "量を記録した目盛りでもあります。"}, {"t": 486.21666666666664, "x": "地中海の底にある百万立方キロメートルの"}, {"t": 489.1, "x": "塩は、消えた水の領収書にあたります。"}, {"t": 492.01666666666665, "x": "では、なぜ出口がふさがったのか。"}, {"t": 494.55, "x": "そもそも地中海は、かつてもっと大きな海の残りです。"}, {"t": 498.5, "x": "テチス海と呼ばれる、アフリカと"}, {"t": 500.8333333333333, "x": "ユーラシアのあいだに横たわっていた海域があります。"}, {"t": 503.8833333333333, "x": "この海が、両側の大陸に挟まれて縮んでいった、"}, {"t": 507.5833333333333, "x": "その最後の水たまりが地中海です。"}, {"t": 510.26666666666665, "x": "つまり地中海は、生まれた瞬間から"}, {"t": 513.05, "x": "閉じていく途中にあります。"}, {"t": 514.6166666666667, "x": "原因は、プレートの動きです。"}, {"t": 517.1166666666667, "x": "アフリカプレートが、ユーラシアプレートに"}, {"t": 519.85, "x": "向かって北へ動き続けています。"}, {"t": 521.8333333333334, "x": "速さは一年あたり数ミリメートルから"}, {"t": 524.2833333333333, "x": "数センチメートルの範囲です。"}, {"t": 526.15, "x": "人間の感覚では、止まっているのと変わりません。"}, {"t": 529.6, "x": "それでも、百万年で数十キロメートルになります。"}, {"t": 533.25, "x": "この動きで、地中海と大西洋のあいだの"}, {"t": 536.3, "x": "陸地が持ち上がりました。"}, {"t": 537.7666666666667, "x": "当時、両者をつないでいたのは、いまの"}, {"t": 540.7166666666667, "x": "ジブラルタル海峡ではありませんでした。"}, {"t": 543.0166666666667, "x": "スペイン南部を横切る通り道と、"}, {"t": 545.2, "x": "モロッコ北部を横切る通り道。"}, {"t": 547.6333333333333, "x": "研究者はこれらをベティック回廊、"}, {"t": 549.8333333333334, "x": "リーフ回廊と呼んでいます。"}, {"t": 551.8833333333333, "x": "この二本が、じわじわと浅くなっていきました。"}, {"t": 555.1333333333333, "x": "変化は、ある日いきなり起きたわけではありません。"}, {"t": 558.4666666666667, "x": "2024年に出た化石記録の研究が、"}, {"t": 561.4166666666666, "x": "この過程を裏づけています。"}, {"t": 563.4333333333333, "x": "地中海の生き物の顔ぶれは、塩が"}, {"t": 566.0833333333334, "x": "溜まりはじめるより前から乱れていました。"}, {"t": 568.4333333333333, "x": "乱れが見えはじめるのは、725万年前ごろからです。"}, {"t": 572.75, "x": "つまり、百万年以上かけて、"}, {"t": 575.2166666666667, "x": "ゆっくり首が絞まっていきました。"}, {"t": 577.4333333333333, "x": "浅くなると、入ってくる水の量が減ります。"}, {"t": 580.6, "x": "水の量が減ると、地中海の塩分が上がります。"}, {"t": 584.0833333333334, "x": "塩分が上がると、まず石膏が沈みはじめます。"}, {"t": 587.7333333333333, "x": "その最初の石膏が、地層の中に現れる"}, {"t": 590.85, "x": "年代が、この出来事の開始時刻になります。"}, {"t": 593.9833333333333, "x": "年代の決め方は、少し変わっています。"}, {"t": 596.8666666666667, "x": "地層には、明るい層と暗い層が"}, {"t": 599.4, "x": "規則正しく交互に重なっています。"}, {"t": 601.6166666666667, "x": "この縞は、地球の自転軸の向きや公転軌道の"}, {"t": 604.9833333333333, "x": "形が、周期的に変わることで生じます。"}, {"t": 607.95, "x": "周期そのものは、天文学の計算で分かっています。"}, {"t": 611.7166666666667, "x": "そこで、地層の縞を、計算された周期に"}, {"t": 615.1833333333333, "x": "ぴったり合わせていきます。"}, {"t": 616.7, "x": "天文年代学、アストロクロノロジーと呼ばれる方法です。"}, {"t": 620.8333333333334, "x": "この手法で、開始は597万年前ごろとされました。"}, {"t": 625.3, "x": "2013年に発表された研究では、"}, {"t": 628.0666666666667, "x": "597万1千年前という値が示されています。"}, {"t": 632.15, "x": "1999年の研究では、この開始が地中海の"}, {"t": 636.5, "x": "あちこちでほぼ同時であることも確認されています。"}, {"t": 639.3833333333333, "x": "スペインの地層でも、イタリアの地層でも、"}, {"t": 642.2333333333333, "x": "同じ時刻に石膏が現れます。"}, {"t": 644.6666666666666, "x": "ひとつの海全体が、同じタイミングで"}, {"t": 647.4, "x": "変わったということです。"}, {"t": 648.7166666666667, "x": "地層の縞を、天体の運動で校正する。"}, {"t": 651.8833333333333, "x": "やっていることは、岩に刻まれた時計を読むのと同じです。"}, {"t": 655.8333333333334, "x": "そして、その時計が指していたのが597万年前でした。"}, {"t": 660.45, "x": "ここで一つ、断っておきます。"}, {"t": 662.9833333333333, "x": "この年代は、いまも小数点以下が動いています。"}, {"t": 666.55, "x": "596万年前と書かれた資料も、"}, {"t": 669.4333333333333, "x": "597万1千年前と書かれた資料もあります。"}, {"t": 673.5, "x": "新しい地層が見つかれば、縞の"}, {"t": 676.0166666666667, "x": "数え方が一本ぶん変わります。"}, {"t": 678.05, "x": "一本ぶんが、そのまま数千年から二万年の差になります。"}, {"t": 682.15, "x": "この番組では、こうした数字を"}, {"t": 684.4166666666666, "x": "一点に丸めずに、幅のまま扱います。"}, {"t": 687.3166666666667, "x": "海水から水が抜けていくとき、"}, {"t": 689.2666666666667, "x": "溶けていたものは同時には沈みません。"}, {"t": 691.9166666666666, "x": "溶けにくいものから、順番に落ちていきます。"}, {"t": 694.9833333333333, "x": "最初に沈むのは、炭酸塩です。"}, {"t": 697.6166666666667, "x": "次が、石膏。"}, {"t": 699.3, "x": "硫酸カルシウムです。"}, {"t": 700.85, "x": "その次が、岩塩 .0166666666667, "x": "水位が大きく下がったとされています。"}, {"t": 823.6, "x": "この二段階目で、地中海は体積のおよそ七割の"}, {"t": 827.3333333333334, "x": "水を失ったと見積もられています。"}, {"t": 829.45, "x": "ただし、塩の総量そのものにも幅があります。"}, {"t": 832.8166666666667, "x": "百万立方キロメートルという値はよく引かれます。"}, {"t": 836.0, "x": "ただし重さで見積もった場合には、半分から"}, {"t": 839.1, "x": "四分の一程度まで下がる可能性を指摘する報告もあります。"}, {"t": 843.05, "x": "数字を一点に丸めないほうがいい領域です。"}, {"t": 845.9833333333333, "x": "確かなのは、地中海の底に、他の海には存在しない"}, {"t": 850.1, "x": "規模の塩が置かれているということです。"}, {"t": 852.35, "x": "そしてそれは、地中海が海であることを"}, {"t": 855.15, "x": "やめた期間の長さを示しています。"}, {"t": 857.3166666666667, "x": "この塩には、もうひとつ性質があります。"}, {"t": 860.3166666666667, "x": "岩塩は、長い時間をかけると、固体のまま流れます。"}, {"t": 864.5666666666667, "x": "上に重い堆積物が乗ると、逃げ場を探して横へ"}, {"t": 868.0833333333334, "x": "動き、弱いところから上へ盛り上がります。"}, {"t": 871.0333333333333, "x": "地中海の海底地形には、この動きでできた"}, {"t": 874.2, "x": "膨らみがいくつも残っています。"}, {"t": 876.1166666666667, "x": "六百万年前に置かれた塩は、置かれたまま"}, {"t": 879.2833333333333, "x": "止まっているわけではありません。"}, {"t": 881.0166666666667, "x": "いまも、非常にゆっくり形を変えています。"}, {"t": 884.1, "x": "海の水位が下がると、陸の側でも変化が起きます。"}, {"t": 887.8166666666667, "x": "川は、海面に向かって流れています。"}, {"t": 890.7333333333333, "x": "海面が下がれば、川はその新しい"}, {"t": 893.5666666666667, "x": "高さまで落ちなければなりません。"}, {"t": 895.4666666666667, "x": "落ちるためには、途中の地面を削ります。"}, {"t": 898.5, "x": "これが侵食です。"}, {"t": 899.9, "x": "地中海に注いでいた川は、いっせいに"}, {"t": 902.6333333333333, "x": "自分の谷を深くしました。"}, {"t": 904.3, "x": "最も分かりやすい例が、ナイル川です。"}, {"t": 907.3833333333333, "x": "エジプトの地下には、この時代に"}, {"t": 909.5666666666667, "x": "掘られた巨大な谷が埋まっています。"}, {"t": 911.6666666666666, "x": "2022年に発表された研究によると、"}, {"t": 914.6666666666666, "x": "いまの海岸のあたりが最も深くなっています。"}, {"t": 917.9, "x": "そこでは、谷の底はデルタの"}, {"t": 920.0666666666667, "x": "地表からおよそ三千メートル下にあります。"}, {"t": 922.65, "x": "そこから南へおよそ百キロメートル、カイロの付近では、"}, {"t": 926.65, "x": "谷の底は地表からおよそ千五百メートル下です。"}, {"t": 930.1333333333333, "x": "そして谷の肩、つまり縁の部分は、"}, {"t": 932.8833333333333, "x": "ほとんど地表まで届いています。"}, {"t": 935.0666666666667, "x": "つまりカイロの足元には、深さ"}, {"t": 937.35, "x": "千五百メートル級の峡谷があります。"}, {"t": 939.9, "x": "それが、そっくり埋まっているということになります。"}, {"t": 943.1666666666666, "x": "現在のナイル川は、その埋まった谷の上を流れています。"}, {"t": 947.1666666666666, "x": "同じことが、フランスのローヌ川でも起きています。"}, {"t": 950.5166666666667, "x": "こちらも、河口の下に深い谷が埋没しています。"}, {"t": 954.05, "x": "スペインのエブロ川でも、同じ時代の"}, {"t": 956.6833333333333, "x": "深い谷が見つかっています。"}, {"t": 958.3833333333333, "x": "北のアルプス側でも、南のアフリカ側でも、"}, {"t": 961.75, "x": "同じことが起きました。"}, {"t": 963.4166666666666, "x": "海面が下がるという一つの原因に対して、"}, {"t": 966.2166666666667, "x": "周りの川が同じ反応をしたということです。"}, {"t": 969.3, "x": "地中海の周りには、この時代に"}, {"t": 971.6333333333333, "x": "削られた面が広く残っています。"}, {"t": 973.7666666666667, "x": "研究者はこれをメッシニアン侵食面と呼んでいます。"}, {"t": 977.2166666666667, "x": "この面は、地下を音波で探るとはっきり見えます。"}, {"t": 980.7333333333333, "x": "そのため石油やガスを探す現場では、地層の"}, {"t": 984.0166666666667, "x": "年代を測る目印として使われてきました。"}, {"t": 986.6833333333333, "x": "六百万年前の乾いた地面が、"}, {"t": 989.0, "x": "いまは地下の基準線になっています。"}, {"t": 991.5333333333333, "x": "削るという行為には、必ず行き先があります。"}, {"t": 994.9166666666666, "x": "削られた土砂は、下流へ運ばれます。"}, {"t": 997.65, "x": "地中海の縁には、その土砂が"}, {"t": 999.9, "x": "扇状に積もった地形が残っています。"}, {"t": 1002.25, "x": "そして水位が戻ったあと、掘られた谷は、"}, {"t": 1005.15, "x": "上流から来る土砂で少しずつ埋まっていきました。"}, {"t": 1008.3666666666667, "x": "ナイルデルタの地下三千メートルまでの"}, {"t": 1010.5333333333333, "x": "堆積物は、その埋め戻しの記録です。"}, {"t": 1013.3833333333333, "x": "いまエジプトの農地になっている土は、600万年前に"}, {"t": 1017.0166666666667, "x": "掘られた穴の、いちばん上の層にあたります。"}, {"t": 1020.05, "x": "ここが、この出来事が現在に"}, {"t": 1022.2666666666667, "x": "つながっている最初の場所です。"}, {"t": 1024.1166666666666, "x": "エジプトの人口の大半は、ナイル川沿いの"}, {"t": 1027.2666666666667, "x": "細長い土地に住んでいます。"}, {"t": 1028.9666666666667, "x": "その土地の下には、水位が下がった時代に掘られた谷が、"}, {"t": 1032.7666666666667, "x": "堆積物で満たされた状態で横たわっています。"}, {"t": 1036.0166666666667, "x": "谷は、地下水をためる器にもなっています。"}, {"t": 1039.2, "x": "六百万年前の侵食が、いまの"}, {"t": 1041.9333333333334, "x": "住み方の土台の一部を作った形です。"}, {"t": 1044.4833333333333, "x": "地層の話は、地層のところで終わりません。"}, {"t": 1047.6166666666666, "x": "そしてもうひとつ、削られた谷には別の役割があります。"}, {"t": 1051.6666666666667, "x": "川は、海面より下へは掘り進めません。"}, {"t": 1054.8166666666666, "x": "ですから、埋もれた谷の底の高さは、"}, {"t": 1057.6166666666666, "x": "そのまま当時の海面の記録になります。"}, {"t": 1060.4, "x": "ただし、その記録の読み方をめぐって、"}, {"t": 1063.2833333333333, "x": "いま大きな議論が起きています。"}, {"t": 1065.4833333333333, "x": "次の章は、その話です。"}, {"t": 1067.8166666666666, "x": "ここからは、割れている話をします。"}, {"t": 1070.4833333333333, "x": "地中海が大西洋から切り離されたこと。"}, {"t": 1073.2666666666667, "x": "百万立方キロメートル規模の塩が溜まったこと。"}, {"t": 1076.3833333333334, "x": "533万年前につながり直したこと。"}, {"t": 1079.5333333333333, "x": "ここまでは、争われていません。"}, {"t": 1081.9166666666667, "x": "定説として扱われています。"}, {"t": 1083.9166666666667, "x": "割れているのは、水位がどこまで"}, {"t": 1086.0833333333333, "x": "下がったのかという一点です。"}, {"t": 1087.8666666666666, "x": "数字には、一キロメートル以上の開きがあります。"}, {"t": 1091.35, "x": "第一の見方は、下がり方は比較的"}, {"t": 1094.15, "x": "小さかったとするものです。"}, {"t": 1095.7166666666667, "x": "2022年に発表された、さきほどの"}, {"t": 1098.7, "x": "ナイルの埋没峡谷の研究です。"}, {"t": 1100.9166666666667, "x": "川がどこまで削れるかは、行き先である"}, {"t": 1103.6166666666666, "x": "海面の高さで決まります。"}, {"t": 1105.3, "x": "そこから逆算すると、当時の"}, {"t": 1107.5833333333333, "x": "ナイルの侵食基準面が求まります。"}, {"t": 1109.9833333333333, "x": "その高さは、現在の海面よりおよそ六百メートル"}, {"t": 1113.65, "x": "低いところだったと見積もられました。"}, {"t": 1115.6333333333334, "x": "これは、従来の見積もりの二分の"}, {"t": 1118.1333333333334, "x": "一から四分の一に当たります。"}, {"t": 1120.1333333333334, "x": "第二の見方は、大きく下がったとするものです。"}, {"t": 1123.3833333333334, "x": "2024年に発表された、塩素同位体を"}, {"t": 1126.7833333333333, "x": "使った研究がこちらです。"}, {"t": 1128.55, "x": "この研究では、第二段階で、"}, {"t": 1131.0333333333333, "x": "東地中海が一・七キロメートルから二・"}, {"t": 1133.9666666666667, "x": "一キロメートル下がったとされています。"}, {"t": 1136.3833333333334, "x": "西地中海は、およそ〇・八五キロメートルです。"}, {"t": 1140.0666666666666, "x": "第三の見方は、さらに複雑です。"}, {"t": 1142.8, "x": "2025年に発表された研究は、川による侵食と"}, {"t": 1147.0833333333333, "x": "気候の影響を組み込んだモデルを使いました。"}, {"t": 1149.75, "x": "その結果、水位は西でおよそ千七百九十五メートルまで"}, {"t": 1154.1833333333334, "x": "下がったとされます。"}, {"t": 1155.3333333333333, "x": "東では、およそ千六百六十四メートルです。"}, {"t": 1159.0166666666667, "x": "そしてその後、第三段階では千三百メートル以上も"}, {"t": 1162.95, "x": "水位が戻ったとされています。"}, {"t": 1164.75, "x": "下がりっぱなしではなく、途中で"}, {"t": 1167.2, "x": "一度かなり戻った、という筋書きです。"}, {"t": 1169.95, "x": "三つの研究は、いずれも査読を通った学術誌に出ています。"}, {"t": 1174.25, "x": "使っている手がかりが違うだけです。"}, {"t": 1176.4666666666667, "x": "一つは川の削り跡、一つは塩の"}, {"t": 1179.2166666666667, "x": "中の元素の比率、一つは数値モデルです。"}, {"t": 1182.3833333333334, "x": "どれが正しいかは、現時点では決まっていません。"}, {"t": 1185.7833333333333, "x": "なぜここまで食い違うのか。"}, {"t": 1187.6, "x": "理由のひとつは、証拠がある場所が偏っていることです。"}, {"t": 1191.4, "x": "陸の上で見られるのは、地中海の"}, {"t": 1193.9, "x": "縁の浅いところにできた地層だけです。"}, {"t": 1196.1333333333334, "x": "中央の深いところの地層は、海底の下、"}, {"t": 1199.3166666666666, "x": "さらに厚い堆積物の下にあります。"}, {"t": 1201.9833333333333, "x": "そこを直接見るには、掘るしかありません。"}, {"t": 1204.9333333333334, "x": "そして掘れる本数には限りがあります。"}, {"t": 1207.5333333333333, "x": "縁で起きたことと、中央で起きたことが、"}, {"t": 1210.3333333333333, "x": "同じだったのか違ったのかも論点になっています。"}, {"t": 1213.45, "x": "縁は浅い水たまりのままで、"}, {"t": 1215.2666666666667, "x": "中央だけが深く干上がったとする考え方。"}, {"t": 1218.3833333333334, "x": "全体が同じように下がったとする考え方。"}, {"t": 1221.3, "x": "どちらも、いまも生きています。"}, {"t": 1223.5166666666667, "x": "さらに、その手前の問題も未解決です。"}, {"t": 1226.6666666666667, "x": "地中海は、完全に干上がって陸になったのか。"}, {"t": 1230.05, "x": "それとも、濃い塩水をたたえた湖として残ったのか。"}, {"t": 1233.9166666666667, "x": "これについても、研究者のあいだで合意はありません。"}, {"t": 1237.5666666666666, "x": "かつては、干上がっては満ちるのを"}, {"t": 1239.75, "x": "何度も繰り返したという説もありました。"}, {"t": 1242.0833333333333, "x": "現在では、地球の内部構造の動きから見て、"}, {"t": 1245.4833333333333, "x": "そこまでの繰り返しは難しいという指摘が出ています。"}, {"t": 1249.0833333333333, "x": "この番組では、どれか一つを正解として扱いません。"}, {"t": 1252.9666666666667, "x": "決着していないことを、"}, {"t": 1254.4166666666667, "x": "決着していないまま置いておきます。"}, {"t": 1256.9, "x": "地層はまだ全部は掘られていません。"}, {"t": 1259.2, "x": "数字が動くのは、そのためです。"}, {"t": 1261.6833333333334, "x": "533万年前。"}, {"t": 1263.7333333333333, "x": "大西洋の水が、ふたたび地中海へ入ります。"}, {"t": 1267.1833333333334, "x": "入り口になったのが、いまのジブラルタル海峡です。"}, {"t": 1270.6166666666666, "x": "この再充填は、ザンクリアン洪水と呼ばれています。"}, {"t": 1274.3333333333333, "x": "ザンクリアンは、この直後から始まる時代の名前です。"}, {"t": 1278.0833333333333, "x": "2009年に発表された研究が、"}, {"t": 1280.5666666666666, "x": "この出来事の描像を大きく変えました。"}, {"t": 1283.3333333333333, "x": "研究チームは、ジブラルタル海峡の海底を"}, {"t": 1286.5666666666666, "x": "ボーリングと反射法地震探査で調べました。"}, {"t": 1289.4, "x": "そこに、深さ二百五十メートルを"}, {"t": 1291.95, "x": "超える侵食谷が見つかりました。"}, {"t": 1294.0, "x": "海峡の両側に、削られた跡が残っていたということです。"}, {"t": 1298.05, "x": "川が山を削る速さのモデルを使って、"}, {"t": 1300.65, "x": "この谷がどう掘られたかを計算しました。"}, {"t": 1303.45, "x": "結論は、最初は細い流れだった、というものです。"}, {"t": 1307.5666666666666, "x": "その状態が数千年続いた可能性がある。"}, {"t": 1310.5333333333333, "x": "しかし、水が谷を削り、谷が"}, {"t": 1313.5833333333333, "x": "深くなると、流れる量が増えます。"}, {"t": 1316.1333333333334, "x": "量が増えれば、さらに削れます。"}, {"t": 1318.6333333333334, "x": "この繰り返しが、ある時点から急激になります。"}, {"t": 1322.05, "x": "海峡には、カマリナル海嶺と呼ばれる高まりがあります。"}, {"t": 1325.9166666666667, "x": "この高まりが、一日あたり〇・四メートルから〇・"}, {"t": 1329.4833333333333, "x": "七メートルのペースで削られたという計算も出ています。"}, {"t": 1332.95, "x": "削れるほど水が増え、水が増えるほど削れる。"}, {"t": 1336.4333333333334, "x": "歯止めが外れる形です。"}, {"t": 1338.2, "x": "計算では、入ってきた水のおよそ九割が、"}, {"t": 1341.5166666666667, "x": "二年に満たない期間で移動したとされています。"}, {"t": 1344.45, "x": "そのとき、地中海の水位は一日あたり"}, {"t": 1347.4333333333334, "x": "十メートルを超えて上がった可能性があります。"}, {"t": 1350.1833333333334, "x": "流量のピークは、毎秒一億立方メートルという"}, {"t": 1353.85, "x": "規模で見積もられています。"}, {"t": 1355.3166666666666, "x": "アマゾン川のおよそ四百五十倍に当たる数字です。"}, {"t": 1358.7666666666667, "x": "流れの速さは、毎秒四十メートルを"}, {"t": 1361.75, "x": "超えたという計算もあります。"}, {"t": 1363.55, "x": "海峡を削り取った岩の量は、"}, {"t": 1365.6166666666666, "x": "およそ千立方キロメートルと見積もられています。"}, {"t": 1368.8, "x": "ただし、これらはすべて計算による推定です。"}, {"t": 1372.2833333333333, "x": "実際にこの流れを見た者はいません。"}, {"t": 1374.7, "x": "残っているのは、削られた谷と、"}, {"t": 1377.05, "x": "その中に詰まった堆積物だけです。"}, {"t": 1379.6166666666666, "x": "別の見方もあります。"}, {"t": 1381.15, "x": "もっと緩やかに戻ったとする見方。"}, {"t": 1383.4166666666667, "x": "ジブラルタルは完全には閉じておらず、"}, {"t": 1385.7166666666667, "x": "細い流れが続いていたとする見方。"}, {"t": 1388.4, "x": "他の経路から水が入ったとする見方もあります。"}, {"t": 1391.3833333333334, "x": "なお、古い本には、海峡に巨大な"}, {"t": 1394.7, "x": "滝があったという描写が出てきます。"}, {"t": 1396.8166666666666, "x": "ベネズエラのアンヘルの滝を"}, {"t": 1398.4, "x": "超える高さ、という書き方もされました。"}, {"t": 1401.2333333333333, "x": "しかし近年の研究では、流れは滝というより、"}, {"t": 1404.6666666666667, "x": "かなり緩い勾配を下っていったとされています。"}, {"t": 1407.7666666666667, "x": "滝のイメージは、現在の研究では支持されていません。"}, {"t": 1411.6166666666666, "x": "もうひとつ、規模を測る手がかりがあります。"}, {"t": 1414.6, "x": "地中海が干上がっていたあいだ、そこにあったはずの"}, {"t": 1417.8, "x": "水は、世界の海に移っていました。"}, {"t": 1420.4, "x": "その量は、世界の海面をおよそ十二メートル"}, {"t": 1423.6833333333334, "x": "押し上げる計算になります。"}, {"t": 1425.3833333333334, "x": "水が戻ったとき、逆のことが起きたことになります。"}, {"t": 1428.9666666666667, "x": "ひとつの海が満ちるだけで、地球全体の海面が動く。"}, {"t": 1432.9166666666667, "x": "それが、この出来事の大きさです。"}, {"t": 1435.6, "x": "この水が戻った瞬間は、地質年代の"}, {"t": 1438.65, "x": "区切りとして正式に採用されています。"}, {"t": 1441.1166666666666, "x": "シチリア島南岸のエラクレア・ミノアという"}, {"t": 1443.5666666666666, "x": "場所に、その境目の露頭があります。"}, {"t": 1446.2833333333333, "x": "白い石灰質の地層が、乾いた時代の"}, {"t": 1449.2833333333333, "x": "層の上に、いきなり乗っている場所です。"}, {"t": 1451.95, "x": "国際地質科学連合は、ここをザンクリアン期、"}, {"t": 1455.2166666666667, "x": "つまり鮮新世の始まりの基準点に定めました。"}, {"t": 1458.6333333333334, "x": "年代は、天文年代学で533万3千年前とされています。"}, {"t": 1463.9333333333334, "x": "海が戻った日が、そのまま時代の"}, {"t": 1466.2666666666667, "x": "境目になった、ということです。"}, {"t": 1468.6333333333334, "x": "ここまでは、水と塩と地面の話でした。"}, {"t": 1471.7, "x": "海の中にいたものの側から見ると、"}, {"t": 1473.8333333333333, "x": "この期間は別の意味を持ちます。"}, {"t": 1476.1333333333334, "x": "まず、この期間の終わりごろに、奇妙な段階があります。"}, {"t": 1480.3666666666666, "x": "研究者はこれをラゴ・マーレ、"}, {"t": 1482.15, "x": "イタリア語で「湖の海」と呼んでいます。"}, {"t": 1486.0166666666667, "x": "およそ555万年前から533万年前にかけての時期です。"}, {"t": 1490.95, "x": "このとき地中海の地層に現れるのは、"}, {"t": 1493.45, "x": "海の生き物ではありません。"}, {"t": 1495.4666666666667, "x": "汽水、つまり塩分の薄い水に住む貝や、小さな甲殻類です。"}, {"t": 1500.6166666666666, "x": "コンゲリア、メラノプシス、"}, {"t": 1502.6833333333334, "x": "キプリデイスといった名前が並びます。"}, {"t": 1505.3666666666666, "x": "これらは、地中海の生き物ではありませんでした。"}, {"t": 1508.6833333333334, "x": "黒海やカスピ海につながる、"}, {"t": 1510.45, "x": "パラテチスと呼ばれる内海の生き物です。"}, {"t": 1513.35, "x": "つまり、大西洋とは切れたまま、東側からは"}, {"t": 1517.1666666666667, "x": "水と生き物が入ってきていた、ということになります。"}, {"t": 1520.5666666666666, "x": "海だった場所が、塩分の薄い"}, {"t": 1522.85, "x": "巨大な湖になっていた時期がある。"}, {"t": 1524.9833333333333, "x": "ラゴ・マーレという呼び名は、そういう意味です。"}, {"t": 1527.9833333333333, "x": "ただし、この段階をどう説明するかも、"}, {"t": 1531.0166666666667, "x": "研究者のあいだで割れています。"}, {"t": 1533.25, "x": "水位が低いまま湖になったとする見方と、逆に"}, {"t": 1537.0, "x": "水位はかなり高かったとする見方があります。"}, {"t": 1539.6666666666667, "x": "ここも、決着していません。"}, {"t": 1541.9166666666667, "x": "そして533万年前に大西洋が戻ってくると、"}, {"t": 1545.7666666666667, "x": "この汽水の生き物は消えます。"}, {"t": 1547.95, "x": "入れ替わりに入ってきたのが、大西洋の海の生き物でした。"}, {"t": 1551.9, "x": "2024年に発表された研究が、"}, {"t": 1554.6166666666666, "x": "この入れ替わりを数字で示しています。"}, {"t": 1557.2166666666667, "x": "研究チームは、地中海の化石の"}, {"t": 1559.7833333333333, "x": "記録を統一した形に作り直しました。"}, {"t": 1562.4333333333334, "x": "石灰質ナノプランクトンから、有孔虫、"}, {"t": 1565.4666666666667, "x": "貝、サンゴ、ウニ、魚、海の哺乳類まで。"}, {"t": 1570.8333333333333, "x": "二万三千件を超える産出記録を集めています。"}, {"t": 1574.2166666666667, "x": "その結果、危機の前に地中海だけで"}, {"t": 1576.9666666666667, "x": "確認されていた固有種は、七百七十九種でした。"}, {"t": 1580.75, "x": "このうち、危機を越えたのは八十六種です。"}, {"t": 1583.9166666666667, "x": "割合にして、およそ十一パーセントとされています。"}, {"t": 1587.5, "x": "さらに、危機の前と後で種の顔ぶれを比べると、"}, {"t": 1590.8666666666666, "x": "およそ六十七パーセントが入れ替わっていました。"}, {"t": 1594.0166666666667, "x": "種数として回復するまでには、"}, {"t": 1596.0833333333333, "x": "百七十万年以上かかったとされています。"}, {"t": 1599.2166666666667, "x": "大西洋とつながり直したあと、地中海に"}, {"t": 1602.2333333333333, "x": "入ってきたのは、大西洋にいた系統でした。"}, {"t": 1605.3666666666666, "x": "いまの地中海で見られる生き物の多くは、"}, {"t": 1607.8666666666666, "x": "この再入植の子孫にあたります。"}, {"t": 1610.3833333333334, "x": "地中海に固有種が少ないことの"}, {"t": 1612.45, "x": "理由の一部が、ここにあります。"}, {"t": 1614.75, "x": "別の研究は、危機の前後で入れ替わった種の"}, {"t": 1617.9666666666667, "x": "割合を、グループごとに出しています。"}, {"t": 1620.55, "x": "石灰質ナノプランクトンで三割ほど。"}, {"t": 1623.1666666666667, "x": "底生有孔虫で六割近く。"}, {"t": 1625.3833333333334, "x": "貝形虫で六割台。"}, {"t": 1627.0166666666667, "x": "ウニで八割台。"}, {"t": 1628.2666666666667, "x": "サンゴに至っては九割を超えています。"}, {"t": 1630.8666666666666, "x": "グループによって、受けた影響の大きさがまるで違います。"}, {"t": 1634.9166666666667, "x": "また、いまの地中海には、東へ行くほど"}, {"t": 1638.2833333333333, "x": "種類が減るという傾向があります。"}, {"t": 1640.35, "x": "入り口が西のジブラルタルの一箇所しかないことと、"}, {"t": 1643.3666666666666, "x": "無関係ではないと考えられています。"}, {"t": 1645.95, "x": "海がひとつ閉じて、開き直る。"}, {"t": 1648.2666666666667, "x": "それだけで、そこに住む生き物の"}, {"t": 1650.55, "x": "名簿は、ほとんど書き換わります。"}, {"t": 1652.8, "x": "最後に、この出来事が現在にどう残っているかを見ます。"}, {"t": 1656.8, "x": "シチリア島の内陸には、あの時代の"}, {"t": 1659.35, "x": "石膏の地層が地上に出ています。"}, {"t": 1661.5333333333333, "x": "そしてその石膏の一部は、自然の"}, {"t": 1664.2333333333333, "x": "硫黄に置き換わっています。"}, {"t": 1665.7666666666667, "x": "2025年に発表された研究は、シチリアの"}, {"t": 1669.4, "x": "モンテ・パルコでこの置き換わりを調べています。"}, {"t": 1671.9666666666667, "x": "そして、それが微生物のはたらきに"}, {"t": 1674.55, "x": "よって起きたことを示しました。"}, {"t": 1676.3333333333333, "x": "酸素のない環境で、メタンを使う古細菌と、"}, {"t": 1679.85, "x": "硫酸を使う細菌がはたらきます。"}, {"t": 1682.4333333333334, "x": "それが石膏を、炭酸塩と硫黄に"}, {"t": 1685.0833333333333, "x": "変えていったという内容です。"}, {"t": 1686.8166666666666, "x": "その硫黄が、十九世紀のシチリアを動かしました。"}, {"t": 1690.45, "x": "当時、シチリアは西側世界の硫黄供給を、"}, {"t": 1693.95, "x": "ほぼ一手に握っていました。"}, {"t": 1695.8333333333333, "x": "硫黄は、硫酸の原料です。"}, {"t": 1698.25, "x": "硫酸は、染料、漂白、肥料、火薬など、"}, {"t": 1702.8833333333334, "x": "産業革命期の化学工業のほぼ全体で使われました。"}, {"t": 1706.8, "x": "つまりシチリアは、産業革命の材料の供給地でした。"}, {"t": 1710.8666666666666, "x": "1830年代には、硫黄が島の"}, {"t": 1714.0, "x": "輸出品の第一位になっています。"}, {"t": 1716.15, "x": "最盛期は1901年で、鉱山の従事者はおよそ三万九千人。"}, {"t": 1721.5, "x": "硫黄の鉱石は、五十四万トンが掘り出されました。"}, {"t": 1725.25, "x": "十九世紀の終わりには、七百を超える鉱山で、"}, {"t": 1728.8, "x": "三万人以上が働いていたと記録されています。"}, {"t": 1732.1166666666666, "x": "この現場には、カルージと呼ばれる子どもたちがいました。"}, {"t": 1735.5833333  1858.9833333333333, "x": "境目がはっきりした面として、水中に横たわっています。"}, {"t": 1863.1166666666666, "x": "ディスカバリー海盆の塩水は、自然界で"}, {"t": 1866.0333333333333, "x": "記録された中で最も濃い部類に入ります。"}, {"t": 1868.7333333333333, "x": "そして、その境目の層には、そこでしか"}, {"t": 1872.0666666666666, "x": "生きていない微生物が集まっています。"}, {"t": 1874.3, "x": "六百万年前に置かれた塩が、いまも溶け続け、"}, {"t": 1877.85, "x": "いまも生き物を養っているということです。"}, {"t": 1880.6833333333334, "x": "海がひとつ消えたという出来事は、"}, {"t": 1882.7166666666667, "x": "遠い昔話として終わっていません。"}, {"t": 1885.3833333333334, "x": "シチリアの産業史として。"}, {"t": 1887.2, "x": "エジプトの農地の地下として。"}, {"t": 1889.05, "x": "海底の塩水湖として。"}, {"t": 1890.75, "x": "いずれも、現在の地面の一部になっています。"}, {"t": 1893.9833333333333, "x": "地中海は、いま水で満たされています。"}, {"t": 1896.8833333333334, "x": "その下には、水が無かった期間の"}, {"t": 1899.3, "x": "記録が、そのまま残っています。"}], "w": 960, "h": 540, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
