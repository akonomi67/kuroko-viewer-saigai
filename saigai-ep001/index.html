<script>
const D={"name": "ep001", "file": "ep001", "dur": 1905.01665625, "segs": [], "subs": [{"t": 0.0, "x": "地中海の底には、砂漠が埋まっています。"}, {"t": 3.0833333333333335, "x": "砂でできた砂漠ではありません。"}, {"t": 5.166666666666667, "x": "塩でできた地層です。厚いところでは、二千メートルを"}, {"t": 9.1, "x": "超えると報告されています。"}, {"t": 10.816666666666666, "x": "広がっている範囲は、地中海のほぼ全域です。"}, {"t": 14.3, "x": "体積にすると、およそ百万立方キロメートル。"}, {"t": 17.7, "x": "世界中の海に溶けている塩の、"}, {"t": 19.833333333333332, "x": "およそ二十分の一に当たる量です。この塩は、海が"}, {"t": 23.966666666666665, "x": "ゆっくり濃くなってできたものではありません。"}, {"t": 26.35, "x": "海の水そのものが減ったあとに、残ったものです。"}, {"t": 29.766666666666666, "x": "いまからおよそ597万年前、地中海は、"}, {"t": 33.733333333333334, "x": "大西洋とのつながりを失いました。"}, {"t": 36.35, "x": "つながりを失った海に起きるのは、蒸発だけです。"}, {"t": 39.983333333333334, "x": "水面が下がり、岸が遠ざかり、"}, {"t": 42.6, "x": "川は自分の河口を追って地面を掘りました。"}, {"t": 45.833333333333336, "x": "最後に残ったのは、水ではなく塩でした。"}, {"t": 48.95, "x": "その状態が、およそ60万年ほど続きます。"}, {"t": 52.483333333333334, "x": "60万年という長さは、いまの人類が"}, {"t": 55.56666666666667, "x": "現れてからの時間の、およそ二倍に当たります。"}, {"t": 58.7, "x": "そして533万年前、水が戻ってきます。"}, {"t": 62.71666666666667, "x": "戻り方については、いまも議論が続いています。"}, {"t": 66.15, "x": "ただ、戻ったこと自体を疑う"}, {"t": 68.11666666666666, "x": "研究者はいません。なぜそこまで言えるのか。"}, {"t": 71.28333333333333, "x": "この出来事の証拠は、推測ではなく"}, {"t": 73.98333333333333, "x": "実物として引き上げられているからです。"}, {"t": 76.25, "x": "海の底を掘って、乾いた場所にしかできない"}, {"t": 79.38333333333334, "x": "石を取り出した人たちがいます。"}, {"t": 81.25, "x": "この出来事には、名前が付いています。"}, {"t": 84.01666666666667, "x": "メッシニアン塩分危機。イタリア、"}, {"t": 86.35, "x": "シチリア島の街メッシーナにちなんだ名前です。"}, {"t": 89.56666666666666, "x": "海がひとつ、消えかけた記録です。"}, {"t": 92.11666666666666, "x": "この塩の層が見つかったのは、1970年のことです。"}, {"t": 96.43333333333334, "x": "グローマー・チャレンジャー号という"}, {"t": 98.06666666666666, "x": "掘削船が、地中海に入りました。"}, {"t": 100.86666666666666, "x": "深海掘削計画、ディープ・シー・ドリリング・"}, {"t": 103.85, "x": "プロジェクトの第13次航海です。"}, {"t": 106.06666666666666, "x": "船はポルトガルのリスボンを8月に出て、"}, {"t": 108.71666666666667, "x": "10月に同じ港へ戻っています。"}, {"t": 111.3, "x": "目的は、地中海という海がどうやってできたのかを"}, {"t": 114.81666666666666, "x": "調べることでした。それ以前から、"}, {"t": 117.0, "x": "奇妙なことは分かっていました。"}, {"t": 119.05, "x": "音波で海底の下を探ると、地中海のほぼ全域で、"}, {"t": 122.9, "x": "同じ深さに強い反射面が現れます。"}, {"t": 125.83333333333333, "x": "海底から百メートルから二百メートルほど下です。"}, {"t": 129.11666666666667, "x": "そこだけ、音の返り方が周囲とはっきり違いました。"}, {"t": 132.9, "x": "何かの層が、地中海の底にふたをするように広がっている。"}, {"t": 137.01666666666668, "x": "そこまでは分かっても、中身は音では分かりません。"}, {"t": 140.45, "x": "確かめる方法は、掘って持ち帰ることだけでした。"}, {"t": 143.85, "x": "この航海で、船は地中海のあちこちで"}, {"t": 146.75, "x": "海底に穴を開けています。西の"}, {"t": 148.91666666666666, "x": "バレアレス海盆から、東のレバント海盆まで。"}, {"t": 152.16666666666666, "x": "狙ったのは、その強い反射面の正体でした。"}, {"t": 155.53333333333333, "x": "引き上げられたのは、石膏と岩塩でした。"}, {"t": 158.53333333333333, "x": "石膏は、海水が濃くなっていく途中で沈む鉱物です。"}, {"t": 162.65, "x": "岩塩は、さらに濃くならないと出てきません。"}, {"t": 165.75, "x": "どちらも、水が減った場所にできる石です。"}, {"t": 168.85, "x": "それが、水深三千メートル級の海の底から出てきました。"}, {"t": 173.11666666666667, "x": "この結果をどう読むかで、船の"}, {"t": 175.35, "x": "上では長い議論がありました。"}, {"t": 177.21666666666667, "x": "中心にいたのは、ケネス・ヒュー、ウィリアム・"}, {"t": 180.33333333333334, "x": "ライアン、マリア・ビアンカ・チタの三人です。"}, {"t": 183.38333333333333, "x": "三人が出した答えは、当時としては極端なものでした。"}, {"t": 187.31666666666666, "x": "地中海は、かつて干上がっていた。"}, {"t": 189.86666666666667, "x": "しかも、少し浅くなった、という程度ではない。"}, {"t": 193.51666666666668, "x": "世界の海面より、はるかに低いところまで下がっていた。"}, {"t": 197.31666666666666, "x": "根拠は、塩そのものだけではありませんでした。"}, {"t": 200.46666666666667, "x": "深い海の底から取れたはずの試料に、浅い"}, {"t": 203.61666666666667, "x": "場所にしかいない生き物の殻が混じっていました。"}, {"t": 206.36666666666667, "x": "乾いた泥がひび割れた跡も見つかりました。"}, {"t": 209.05, "x": "どちらも、三千メートルの海の底では起こらないことです。"}, {"t": 212.95, "x": "さらに、この塩の量そのものが桁外れでした。"}, {"t": 216.36666666666667, "x": "当時の見積もりで、世界の海に溶けている"}, {"t": 219.16666666666666, "x": "塩の、およそ五パーセントに当たります。"}, {"t": 221.8, "x": "海の塩の二十分の一が、地中海の"}, {"t": 224.71666666666667, "x": "底に固体で置かれている計算になります。"}, {"t": 227.23333333333332, "x": "この量を、水の中でゆっくり溜めることはできません。"}, {"t": 230.9, "x": "水そのものが、繰り返し失われる必要があります。"}, {"t": 234.56666666666666, "x": "発表された当時、この説は強い反発を受けました。"}, {"t": 238.53333333333333, "x": "海が干上がるという話が、単純に信じにくかったからです。"}, {"t": 242.63333333333333, "x": "別の読み方も出されました。"}, {"t": 244.46666666666667, "x": "塩は深い海の底でも溜まりうる、という考え方です。"}, {"t": 248.56666666666666, "x": "地下の塩が押し上げられて出てきただけではないか、という"}, {"t": 252.15, "x": "指摘もありました。どの反論も、"}, {"t": 254.45, "x": "一点では退けられませんでした。"}, {"t": 256.73333333333335, "x": "決め手になったのは、同じ層が、地中海の"}, {"t": 260.0, "x": "どこを掘っても同じ順番で出てきたことです。"}, {"t": 262.6166666666667, "x": "しかしその後の掘削でも、同じ層は"}, {"t": 265.31666666666666, "x": "同じように出てきました。シチリア島では、同じ時代の"}, {"t": 268.9, "x": "石膏の地層が地上に露出しています。"}, {"t": 271.4166666666667, "x": "イタリアでもスペインでも、"}, {"t": 272.9166666666667, "x": "陸の上で実物に触れることができます。"}, {"t": 275.75, "x": "海の底と陸の上で、同じ記録が残っていました。"}, {"t": 279.35, "x": "現在では、この時代に地中海が大西洋から"}, {"t": 282.6666666666667, "x": "切り離されたこと自体は、定説として扱われています。"}, {"t": 286.45, "x": "なお、メッシニアンという時代の名前は、"}, {"t": 289.6166666666667, "x": "地中海とは関係のないところで先に付いていました。"}, {"t": 293.18333333333334, "x": "1867年、カール・マイヤー＝"}, {"t": 296.35, "x": "アイマーという研究者が名付けました。"}, {"t": 298.98333333333335, "x": "由来は、シチリア島のメッシーナです。"}, {"t": 301.78333333333336, "x": "中新世の最後の時代区分を指す名前でした。"}, {"t": 304.96666666666664, "x": "その名前が、百年後に、海が"}, {"t": 307.8, "x": "消えた時代の名前になりました。"}, {"t": 309.6333333333333, "x": "なぜ、つながりが切れただけで海が消えるのか。"}, {"t": 312.8666666666667, "x": "理由は、地中海という海の性質にあります。"}, {"t": 316.35, "x": "地中海は、水の収支が赤字の海です。"}, {"t": 319.48333333333335, "x": "雨で入ってくる水と、川から流れこむ水を"}, {"t": 322.73333333333335, "x": "足しても、蒸発する水に届きません。"}, {"t": 325.43333333333334, "x": "周りが乾いた土地に囲まれ、日射が強く、"}, {"t": 328.6166666666667, "x": "面積の割に大きな川が少ないためです。"}, {"t": 331.6666666666667, "x": "数字で見ておきます。地中海の面積は、"}, {"t": 334.6333333333333, "x": "およそ二百五十万平方キロメートル。"}, {"t": 337.43333333333334, "x": "水の量は、およそ三百七十万立方キロメートル。"}, {"t": 341.31666666666666, "x": "平均の深さはおよそ千五百メートルで、"}, {"t": 344.01666666666665, "x": "いちばん深いところはギリシャ沖のカリプソ海淵です。"}, {"t": 347.6166666666667, "x": "深さは五千百メートルを超えます。"}, {"t": 350.01666666666665, "x": "決して小さな海でも、浅い海でもありません。"}, {"t": 353.4, "x": "足りないぶんを埋めているのが、"}, {"t": 355.05, "x": "ジブラルタル海峡から入ってくる大西洋の水です。"}, {"t": 358.6333333333333, "x": "いちばん狭いところで、幅はおよそ十四キロメートル。"}, {"t": 362.3666666666667, "x": "この一本の通り道だけが、地中海の水位を支えています。"}, {"t": 366.71666666666664, "x": "東側からも、水は入っています。"}, {"t": 369.6166666666667, "x": "ボスポラス海峡を通って、黒海から流れこむ水です。"}, {"t": 373.6166666666667, "x": "ただし量は限られていて、赤字を埋めるには足りません。"}, {"t": 377.3, "x": "通り道の中では、水が上下二層に"}, {"t": 380.1, "x": "分かれて出入りしています。"}, {"t": 381.55, "x": "表層では、塩分の低い大西洋の水が地中海へ入ります。"}, {"t": 386.18333333333334, "x": "その下では、蒸発で濃くなった"}, {"t": 388.55, "x": "重い水が、大西洋へ出ていきます。"}, {"t": 391.3, "x": "地中海の水がそっくり入れ替わるのに、"}, {"t": 393.7, "x": "八十年から百年かかると見積もられています。"}, {"t": 396.95, "x": "この交換が止まると、どうなるか。"}, {"t": 399.55, "x": "蒸発で失われる量は、一年あたり"}, {"t": 402.31666666666666, "x": "およそ三千三百立方キロメートルと見積もられています。"}, {"t": 405.85, "x": "持っている水の総量をこの数字で割ります。"}, {"t": 408.6166666666667, "x": "割り算をすると、およそ千百年という数字が出ます。"}, {"t": 412.3666666666667, "x": "つまり、大西洋からの流入が完全に止まった場合、"}, {"t": 416.1166666666667, "x": "地中海は、千年余りで干上がる計算になります。"}, {"t": 420.23333333333335, "x": "地質学の時間の尺度でいえば、これは一瞬です。"}, {"t": 423.8833333333333, "x": "数億年を扱う地層の中では、"}, {"t": 426.23333333333335, "x": "千年は線一本の幅もありません。"}, {"t": 429.01666666666665, "x": "ここが、この出来事の本質です。"}, {"t": 431.6166666666667, "x": "地中海が特別に脆かったわけではありません。"}, {"t": 434.5833333333333, "x": "蒸発が流入を上回る海は、ふたをされた"}, {"t": 437.76666666666665, "x": "瞬間から減りはじめます。実際、"}, {"t": 440.2, "x": "いまの地中海はすでに大西洋より塩辛くなっています。"}, {"t": 444.0, "x": "入ってきた水から、水だけが先に抜けていくためです。"}, {"t": 447.7, "x": "東へ行くほど塩分が高くなるのも、同じ理由です。"}, {"t": 451.48333333333335, "x": "入り口が西の一箇所しかないので、"}, {"t": 453.6333333333333, "x": "東の端がいちばん長く蒸発にさらされます。"}, {"t": 456.95, "x": "この傾き方は、いまも毎年観測されています。"}, {"t": 460.53333333333336, "x": "つまり地中海は、規模を小さくした"}, {"t": 463.15, "x": "同じ仕組みを、現在も動かし続けています。"}, {"t": 466.3, "x": "そして、水が減っても、溶けている塩は出ていきません。"}, {"t": 470.43333333333334, "x": "出ていくのは水だけです。残った"}, {"t": 472.7, "x": "水は、その分だけ濃くなります。"}, {"t": 474.95, "x": "濃くなった水は、溶けきれなくなったものを"}, {"t": 477.65, "x": "底に落とします。これが、蒸発岩と"}, {"t": 480.1333333333333, "x": "呼ばれる岩石のできかたです。"}, {"t": 482.31666666666666, "x": "塩の地層とは、失われた水の"}, {"t": 484.98333333333335, "x": "量を記録した目盛りでもあります。"}, {"t": 486.95, "x": "地中海の底にある百万立方キロメートルの"}, {"t": 489.8333333333333, "x": "塩は、消えた水の領収書にあたります。"}, {"t": 492.75, "x": "では、なぜ出口がふさがったのか。"}, {"t": 495.28333333333336, "x": "そもそも地中海は、かつてもっと大きな海の残りです。"}, {"t": 499.23333333333335, "x": "テチス海と呼ばれる、アフリカと"}, {"t": 501.55, "x": "ユーラシアのあいだに横たわっていた海域があります。"}, {"t": 504.5833333333333, "x": "この海が、両側の大陸に挟まれて縮んでいった、"}, {"t": 508.28333333333336, "x": "その最後の水たまりが地中海です。"}, {"t": 510.96666666666664, "x": "つまり地中海は、生まれた瞬間から"}, {"t": 513.75, "x": "閉じていく途中にあります。"}, {"t": 515.3166666666667, "x": "原因は、プレートの動きです。"}, {"t": 517.8166666666667, "x": "アフリカプレートが、ユーラシアプレートに"}, {"t": 520.55, "x": "向かって北へ動き続けています。"}, {"t": 522.5333333333333, "x": "速さは一年あたり数ミリメートルから"}, {"t": 524.9833333333333, "x": "数センチメートルの範囲です。"}, {"t": 526.85, "x": "人間の感覚では、止まっているのと変わりません。"}, {"t": 530.3, "x": "それでも、百万年で数十キロメートルになります。"}, {"t": 533.95, "x": "この動きで、地中海と大西洋のあいだの"}, {"t": 537.0, "x": "陸地が持ち上がりました。当時、"}, {"t": 539.2, "x": "両者をつないでいたのは、いまの"}, {"t": 541.4166666666666, "x": "ジブラルタル海峡ではありませんでした。"}, {"t": 543.7166666666667, "x": "スペイン南部を横切る通り道と、"}, {"t": 545.9, "x": "モロッコ北部を横切る通り道。"}, {"t": 548.3333333333334, "x": "研究者はこれらをベティック回廊、"}, {"t": 550.5666666666667, "x": "リーフ回廊と呼んでいます。"}, {"t": 552.6333333333333, "x": "この二本が、じわじわと浅くなっていきました。"}, {"t": 555.8833333333333, "x": "変化は、ある日いきなり起きたわけではありません。"}, {"t": 559.2166666666667, "x": "2024年に出た化石記録の研究が、"}, {"t": 562.1666666666666, "x": "この過程を裏づけています。"}, {"t": 564.1833333333333, "x": "地中海の生き物の顔ぶれは、塩が"}, {"t": 566.8333333333334, "x": "溜まりはじめるより前から乱れていました。"}, {"t": 569.1833333333333, "x": "乱れが見えはじめるのは、725万年前ごろからです。"}, {"t": 573.5, "x": "つまり、百万年以上かけて、"}, {"t": 575.9666666666667, "x": "ゆっくり首が絞まっていきました。"}, {"t": 578.1833333333333, "x": "浅くなると、入ってくる水の量が減ります。"}, {"t": 581.35, "x": "水の量が減ると、地中海の塩分が上がります。"}, {"t": 584.8333333333334, "x": "塩分が上がると、まず石膏が沈みはじめます。"}, {"t": 588.4833333333333, "x": "その最初の石膏が、地層の中に現れる"}, {"t": 591.6, "x": "年代が、この出来事の開始時刻になります。"}, {"t": 594.7333333333333, "x": "年代の決め方は、少し変わっています。"}, {"t": 597.6166666666667, "x": "地層には、明るい層と暗い層が"}, {"t": 600.15, "x": "規則正しく交互に重なっています。"}, {"t": 602.3666666666667, "x": "この縞は、地球の自転軸の向きや公転軌道の"}, {"t": 605.75, "x": "形が、周期的に変わることで生じます。"}, {"t": 608.7, "x": "周期そのものは、天文学の計算で分かっています。"}, {"t": 612.4666666666667, "x": "そこで、地層の縞を、計算された周期に"}, {"t": 615.9333333333333, "x": "ぴったり合わせていきます。"}, {"t": 617.45, "x": "天文年代学、アストロクロノロジーと呼ばれる方法です。"}, {"t": 621.5833333333334, "x": "この手法で、開始は597万年前ごろとされました。"}, {"t": 626.05, "x": "2013年に発表された研究では、"}, {"t": 628.8166666666667, "x": "597万1千年前という値が示されています。"}, {"t": 633.05, "x": "1999年の研究では、この開始が地中海の"}, {"t": 637.4, "x": "あちこちでほぼ同時であることも確認されています。"}, {"t": 640.2833333333333, "x": "スペインの地層でも、イタリアの地層でも、"}, {"t": 643.1333333333333, "x": "同じ時刻に石膏が現れます。"}, {"t": 645.5666666666667, "x": "ひとつの海全体が、同じタイミングで"}, {"t": 648.3, "x": "変わったということです。地層の"}, {"t": 650.6166666666667, "x": "縞を、天体の運動で校正する。"}, {"t": 652.7833333333333, "x": "やっていることは、岩に刻まれた時計を読むのと同じです。"}, {"t": 656.7333333333333, "x": "そして、その時計が指していたのが597万年前でした。"}, {"t": 661.35, "x": "ここで一つ、断っておきます。"}, {"t": 663.8833333333333, "x": "この年代は、いまも小数点以下が動いています。"}, {"t": 667.45, "x": "596万年前と書かれた資料も、"}, {"t": 670.3333333333334, "x": "597万1千年前と書かれた資料もあります。"}, {"t": 674.4, "x": "新しい地層が見つかれば、縞の"}, {"t": 676.9166666666666, "x": "数え方が一本ぶん変わります。"}, {"t": 678.95, "x": "一本ぶんが、そのまま数千年から二万年の差になります。"}, {"t": 683.05, "x": "この番組では、こうした数字を"}, {"t": 685.3166666666667, "x": "一点に丸めずに、幅のまま扱います。"}, {"t": 688.2166666666667, "x": "海水から水が抜けていくとき、"}, {"t": 690.1666666666666, "x": "溶けていたものは同時には沈みません。"}, {"t": 692.8166666666667, "x": "溶けにくいものから、順番に落ちていきます。"}, {"t": 695.8833333333333, "x": "最初に沈むのは、炭酸塩です。"}, {"t": 698.5166666666667, "x": "次が、石膏。硫酸カルシウムです。"}, {"t": 701.75, "x": "その次が、岩塩。いわゆる食塩と同じ塩化ナトリウムです。"}, {"t": 706.6333333333333, "x": "最後に、カリウムやマグネシウムの塩が残ります。"}, {"t": 710.2666666666667, "x": "これは実験室でも再現できる順番です。"}, {"t": 713.2666666666667, "x": "地中海の底の地層は、この順番のとおりに重なっています。"}, {"t": 717.5, "x": "最初の段階は、およそ597万年前から560万年前ごろまで。"}, {"t": 723.4166666666666, "x": "このときは、主に縁の浅いところで石膏ができていました。"}, {"t": 727.4, "x": "シチリア島やスペイン南部で、"}, {"t": 729.2833333333333, "x": "いま地上から見られるのがこの層です。"}, {"t": 731.9666666666667, "x": "シチリア中部には、この時代の石膏を"}, {"t": 734.7, "x": "主体とする地層が広く分布しています。"}, {"t": 737.1, "x": "イタリア語で、ジェッソーゾ・ソルフィフェラと"}, {"t": 739.6166666666667, "x": "呼ばれています。石膏と硫黄を"}, {"t": 741.8333333333334, "x": "含む層、という意味の名前です。"}, {"t": 744.2, "x": "カルタニッセッタ盆地と呼ばれる範囲です。"}, {"t": 746.7833333333333, "x": "長さはおよそ百四十キロメートル、幅は"}, {"t": 749.9, "x": "およそ八十キロメートルに広がっています。"}, {"t": 752.5166666666667, "x": "次の段階で、岩塩が積もりはじめます。"}, {"t": 755.75, "x": "ここからは、量が一段変わります。"}, {"t": 758.35, "x": "地中海の底に残された塩の層は、場所によって"}, {"t": 761.85, "x": "厚さ三キロメートルに達すると報告されています。"}, {"t": 764.9666666666667, "x": "ビルの高さではありません。山の高さです。"}, {"t": 767.9666666666667, "x": "さらにその上には、カリウムとマグネシウムの"}, {"t": 770.9833333333333, "x": "塩が乗っている場所があります。"}, {"t": 772.8166666666667, "x": "この種類の塩は、海水がほとんど"}, {"t": 775.4, "x": "干上がる寸前にしか出てきません。"}, {"t": 777.4166666666666, "x": "蒸発の最後の一滴に近いところで残る成分です。"}, {"t": 780.9833333333333, "x": "シチリア島レアルモンテの鉱山では、"}, {"t": 783.2833333333333, "x": "この段階の塩も実際に確認されています。"}, {"t": 786.55, "x": "つまり地層は、順番だけでなく、"}, {"t": 789.0, "x": "どこまで濃くなったかまで記録しています。"}, {"t": 791.7166666666667, "x": "2024年に発表された研究は、この過程を"}, {"t": 795.4833333333333, "x": "二つの段階に分けて説明しています。"}, {"t": 797.9166666666666, "x": "塩素という元素には、重さのわずかに違う種類があります。"}, {"t": 801.9666666666667, "x": "どちらが多く残るかは、塩が沈む速さによって変わります。"}, {"t": 806.1, "x": "その比率を測ることで、塩が"}, {"t": 808.4333333333333, "x": "積もった速度を推定する方法です。"}, {"t": 810.8833333333333, "x": "この研究によれば、第一段階では塩は東地中海だけに"}, {"t": 815.3833333333333, "x": "積もり、およそ三万五千年続きました。"}, {"t": 818.3666666666667, "x": "第二段階は、一万年に満たない短い期間で、"}, {"t": 822.0166666666667, "x": "水位が大きく下がったとされています。"}, {"t": 824.6, "x": "この二段階目で、地中海は体積のおよそ七割の"}, {"t": 828.3333333333334, "x": "水を失ったと見積もられています。"}, {"t": 830.45, "x": "ただし、塩の総量そのものにも幅があります。"}, {"t": 833.8166666666667, "x": "百万立方キロメートルという値はよく引かれます。"}, {"t": 837.1666666666666, "x": "ただし重さで見積もった場合には、半分から"}, {"t": 840.2666666666667, "x": "四分の一程度まで下がる可能性を指摘する報告もあります。"}, {"t": 844.2166666666667, "x": "数字を一点に丸めないほうがいい領域です。"}, {"t": 847.15, "x": "確かなのは、地中海の底に、他の海には存在しない"}, {"t": 851.3, "x": "規模の塩が置かれているということです。"}, {"t": 853.55, "x": "そしてそれは、地中海が海であることを"}, {"t": 856.3666666666667, "x": "やめた期間の長さを示しています。"}, {"t": 858.55, "x": "この塩には、もうひとつ性質があります。"}, {"t": 861.55, "x": "岩塩は、長い時間をかけると、固体のまま流れます。"}, {"t": 865.8, "x": "上に重い堆積物が乗ると、逃げ場を探して横へ"}, {"t": 869.3166666666667, "x": "動き、弱いところから上へ盛り上がります。"}, {"t": 872.2666666666667, "x": "地中海の海底地形には、この動きでできた"}, {"t": 875.4333333333333, "x": "膨らみがいくつも残っています。"}, {"t": 877.35, "x": "六百万年前に置かれた塩は、置かれたまま"}, {"t": 880.5166666666667, "x": "止まっているわけではありません。"}, {"t": 882.25, "x": "いまも、非常にゆっくり形を変えています。"}, {"t": 885.3333333333334, "x": "海の水位が下がると、陸の側でも変化が起きます。"}, {"t": 889.05, "x": "川は、海面に向かって流れています。"}, {"t": 891.9666666666667, "x": "海面が下がれば、川はその新しい"}, {"t": 894.8, "x": "高さまで落ちなければなりません。"}, {"t": 896.7, "x": "落ちるためには、途中の地面を削ります。"}, {"t": 899.7333333333333, "x": "これが侵食です。地中海に注いでいた川は、"}, {"t": 902.8666666666667, "x": "いっせいに自分の谷を深くしました。"}, {"t": 905.5333333333333, "x": "最も分かりやすい例が、ナイル川です。"}, {"t": 908.6166666666667, "x": "エジプトの地下には、この時代に"}, {"t": 910.8, "x": "掘られた巨大な谷が埋まっています。"}, {"t": 912.9, "x": "2022年に発表された研究によると、"}, {"t": 915.9, "x": "いまの海岸のあたりが最も深くなっています。"}, {"t": 919.1333333333333, "x": "そこでは、谷の底はデルタの"}, {"t": 921.2833333333333, "x": "地表からおよそ三千メートル下にあります。"}, {"t": 924.0, "x": "そこから南へおよそ百キロメートル、カイロの付近では、"}, {"t": 928.0, "x": "谷の底は地表からおよそ千五百メートル下です。"}, {"t": 931.6, "x": "そして谷の肩、つまり縁の部分は、"}, {"t": 934.35, "x": "ほとんど地表まで届いています。"}, {"t": 936.55, "x": "つまりカイロの足元には、深さ"}, {"t": 938.8333333333334, "x": "千五百メートル級の峡谷があります。"}, {"t": 941.3833333333333, "x": "それが、そっくり埋まっているということになります。"}, {"t": 944.65, "x": "現在のナイル川は、その埋まった谷の上を流れています。"}, {"t": 948.65, "x": "同じことが、フランスのローヌ川でも起きています。"}, {"t": 952.0, "x": "こちらも、河口の下に深い谷が埋没しています。"}, {"t": 955.5333333333333, "x": "スペインのエブロ川でも、同じ時代の"}, {"t": 958.1666666666666, "x": "深い谷が見つかっています。"}, {"t": 959.8666666666667, "x": "北のアルプス側でも、南のアフリカ側でも、"}, {"t": 963.2333333333333, "x": "同じことが起きました。海面が"}, {"t": 965.3333333333334, "x": "下がるという一つの原因に対して、"}, {"t": 967.7166666666667, "x": "周りの川が同じ反応をしたということです。"}, {"t": 970.8166666666667, "x": "地中海の周りには、この時代に"}, {"t": 973.15, "x": "削られた面が広く残っています。"}, {"t": 975.2833333333333, "x": "研究者はこれをメッシニアン侵食面と呼んでいます。"}, {"t": 978.7333333333333, "x": "この面は、地下を音波で探るとはっきり見えます。"}, {"t": 982.25, "x": "そのため石油やガスを探す現場では、地層の"}, {"t": 985.5333333333333, "x": "年代を測る目印として使われてきました。"}, {"t": 988.2, "x": "六百万年前の乾いた地面が、"}, {"t": 990.5166666666667, "x": "いまは地下の基準線になっています。"}, {"t": 993.05, "x": "削るという行為には、必ず行き先があります。"}, {"t": 996.4333333333333, "x": "削られた土砂は、下流へ運ばれます。"}, {"t": 999.1666666666666, "x": "地中海の縁には、その土砂が"}, {"t": 1001.4333333333333, "x": "扇状に積もった地形が残っています。"}, {"t": 1003.7833333333333, "x": "そして水位が戻ったあと、掘られた谷は、"}, {"t": 1006.6833333333333, "x": "上流から来る土砂で少しずつ埋まっていきました。"}, {"t": 1009.9, "x": "ナイルデルタの地下三千メートルまでの"}, {"t": 1012.0666666666667, "x": "堆積物は、その埋め戻しの記録です。"}, {"t": 1014.9166666666666, "x": "いまエジプトの農地になっている土は、600万年前に"}, {"t": 1018.55, "x": "掘られた穴の、いちばん上の層にあたります。"}, {"t": 1021.6, "x": "ここが、この出来事が現在に"}, {"t": 1023.8166666666667, "x": "つながっている最初の場所です。"}, {"t": 1025.6666666666667, "x": "エジプトの人口の大半は、ナイル川沿いの"}, {"t": 1028.8166666666666, "x": "細長い土地に住んでいます。"}, {"t": 1030.5166666666667, "x": "その土地の下には、水位が下がった時代に掘られた谷が、"}, {"t": 1034.3166666666666, "x": "堆積物で満たされた状態で横たわっています。"}, {"t": 1037.5666666666666, "x": "谷は、地下水をためる器にもなっています。"}, {"t": 1040.75, "x": "六百万年前の侵食が、いまの"}, {"t": 1043.4833333333333, "x": "住み方の土台の一部を作った形です。"}, {"t": 1046.0333333333333, "x": "地層の話は、地層のところで終わりません。"}, {"t": 1049.1666666666667, "x": "そしてもうひとつ、削られた谷には別の役割があります。"}, {"t": 1053.2166666666667, "x": "川は、海面より下へは掘り進めません。"}, {"t": 1056.3666666666666, "x": "ですから、埋もれた谷の底の高さは、"}, {"t": 1059.1666666666667, "x": "そのまま当時の海面の記録になります。"}, {"t": 1061.95, "x": "ただし、その記録の読み方をめぐって、"}, {"t": 1064.8333333333333, "x": "いま大きな議論が起きています。次の章は、その話です。"}, {"t": 1069.3666666666666, "x": "ここからは、割れている話をします。"}, {"t": 1072.0333333333333, "x": "地中海が大西洋から切り離されたこと。"}, {"t": 1074.8166666666666, "x": "百万立方キロメートル規模の塩が溜まったこと。"}, {"t": 1077.9333333333334, "x": "533万年前につながり直したこと。"}, {"t": 1081.0833333333333, "x": "ここまでは、争われていません。"}, {"t": 1083.4666666666667, "x": "定説として扱われています。"}, {"t": 1085.4666666666667, "x": "割れているのは、水位がどこまで"}, {"t": 1087.6333333333334, "x": "下がったのかという一点です。"}, {"t": 1089.4166666666667, "x": "数字には、一キロメートル以上の開きがあります。"}, {"t": 1092.9, "x": "第一の見方は、下がり方は比較的"}, {"t": 1095.7, "x": "小さかったとするものです。"}, {"t": 1097.2666666666667, "x": "2022年に発表された、さきほどの"}, {"t": 1100.25, "x": "ナイルの埋没峡谷の研究です。"}, {"t": 1102.4666666666667, "x": "川がどこまで削れるかは、行き先である"}, {"t": 1105.1666666666667, "x": "海面の高さで決まります。そこから逆算すると、当時の"}, {"t": 1109.1333333333334, "x": "ナイルの侵食基準面が求まります。"}, {"t": 1111.5333333333333, "x": "その高さは、現在の海面よりおよそ六百メートル"}, {"t": 1115.2, "x": "低いところだったと見積もられました。"}, {"t": 1117.1833333333334, "x": "これは、従来の見積もりの二分の"}, {"t": 1119.6833333333334, "x": "一から四分の一に当たります。"}, {"t": 1121.6833333333334, "x": "第二の見方は、大きく下がったとするものです。"}, {"t": 1124.9333333333334, "x": "2024年に発表された、塩素同位体を"}, {"t": 1128.3333333333333, "x": "使った研究がこちらです。この研究では、第二段階で、"}, {"t": 1132.6, "x": "東地中海が一・七キロメートルから二・"}, {"t": 1135.5333333333333, "x": "一キロメートル下がったとされています。"}, {"t": 1137.95, "x": "西地中海は、およそ〇・八五キロメートルです。"}, {"t": 1141.6333333333334, "x": "第三の見方は、さらに複雑です。"}, {"t": 1144.3666666666666, "x": "2025年に発表された研究は、川による侵食と"}, {"t": 1148.6833333333334, "x": "気候の影響を組み込んだモデルを使いました。"}, {"t": 1151.3666666666666, "x": "その結果、水位は西でおよそ千七百九十五メートルまで"}, {"t": 1155.8, "x": "下がったとされます。東では、"}, {"t": 1158.05, "x": "およそ千六百六十四メートルです。"}, {"t": 1160.6333333333334, "x": "そしてその後、第三段階では千三百メートル以上も"}, {"t": 1164.5666666666666, "x": "水位が戻ったとされています。"}, {"t": 1166.3666666666666, "x": "下がりっぱなしではなく、途中で"}, {"t": 1168.8166666666666, "x": "一度かなり戻った、という筋書きです。"}, {"t": 1171.5666666666666, "x": "三つの研究は、いずれも査読を通った学術誌に出ています。"}, {"t": 1175.8666666666666, "x": "使っている手がかりが違うだけです。"}, {"t": 1178.0833333333333, "x": "一つは川の削り跡、一つは塩の"}, {"t": 1180.8333333333333, "x": "中の元素の比率、一つは数値モデルです。"}, {"t": 1184.0, "x": "どれが正しいかは、現時点では決まっていません。"}, {"t": 1187.4, "x": "なぜここまで食い違うのか。"}, {"t": 1189.2166666666667, "x": "理由のひとつは、証拠がある場所が偏っていることです。"}, {"t": 1193.0166666666667, "x": "陸の上で見られるのは、地中海の"}, {"t": 1195.4666666666667, "x": "縁の浅いところにできた地層だけです。"}, {"t": 1197.7833333333333, "x": "中央の深いところの地層は、海底の下、"}, {"t": 1200.9666666666667, "x": "さらに厚い堆積物の下にあります。"}, {"t": 1203.6333333333334, "x": "そこを直接見るには、掘るしかありません。"}, {"t": 1206.6, "x": "そして掘れる本数には限りがあります。"}, {"t": 1209.2, "x": "縁で起きたことと、中央で起きたことが、"}, {"t": 1212.0, "x": "同じだったのか違ったのかも論点になっています。"}, {"t": 1215.1166666666666, "x": "縁は浅い水たまりのままで、"}, {"t": 1216.9333333333334, "x": "中央だけが深く干上がったとする考え方。"}, {"t": 1220.05, "x": "全体が同じように下がったとする考え方。"}, {"t": 1222.9666666666667, "x": "どちらも、いまも生きています。"}, {"t": 1225.1833333333334, "x": "さらに、その手前の問題も未解決です。"}, {"t": 1228.3333333333333, "x": "地中海は、完全に干上がって陸になったのか。"}, {"t": 1231.7166666666667, "x": "それとも、濃い塩水をたたえた湖として残ったのか。"}, {"t": 1235.5833333333333, "x": "これについても、研究者のあいだで合意はありません。"}, {"t": 1239.2333333333333, "x": "かつては、干上がっては満ちるのを"}, {"t": 1241.4166666666667, "x": "何度も繰り返したという説もありました。"}, {"t": 1243.7666666666667, "x": "現在では、地球の内部構造の動きから見て、"}, {"t": 1247.1666666666667, "x": "そこまでの繰り返しは難しいという指摘が出ています。"}, {"t": 1250.7666666666667, "x": "この番組では、どれか一つを正解として"}, {"t": 1253.5333333333333, "x": "扱いません。決着していないことを、"}, {"t": 1256.1333333333334, "x": "決着していないまま置いておきます。"}, {"t": 1258.65, "x": "地層はまだ全部は掘られていません。"}, {"t": 1260.95, "x": "数字が動くのは、そのためです。"}, {"t": 1263.4333333333334, "x": "533万年前、大西洋の水が、ふたたび地中海へ入ります。"}, {"t": 1269.1166666666666, "x": "入り口になったのが、いまのジブラルタル海峡です。"}, {"t": 1272.55, "x": "この再充填は、ザンクリアン洪水と呼ばれています。"}, {"t": 1276.2666666666667, "x": "ザンクリアンは、この直後から始まる時代の名前です。"}, {"t": 1280.0166666666667, "x": "2009年に発表された研究が、"}, {"t": 1282.5166666666667, "x": "この出来事の描像を大きく変えました。"}, {"t": 1285.3, "x": "研究チームは、ジブラルタル海峡の海底を"}, {"t": 1288.5333333333333, "x": "ボーリングと反射法地震探査で調べました。"}, {"t": 1291.3833333333334, "x": "そこに、深さ二百五十メートルを"}, {"t": 1293.9166666666667, "x": "超える侵食谷が見つかりました。"}, {"t": 1295.9833333333333, "x": "海峡の両側に、削られた跡が残っていたということです。"}, {"t": 1300.0333333333333, "x": "川が山を削る速さのモデルを使って、"}, {"t": 1302.65, "x": "この谷がどう掘られたかを計算しました。"}, {"t": 1305.45, "x": "結論は、最初は細い流れだった、というものです。"}, {"t": 1309.5666666666666, "x": "その状態が数千年続いた可能性がある。"}, {"t": 1312.5333333333333, "x": "しかし、水が谷を削り、谷が"}, {"t": 1315.5833333333333, "x": "深くなると、流れる量が増えます。"}, {"t": 1318.1333333333334, "x": "量が増えれば、さらに削れます。"}, {"t": 1320.6333333333334, "x": "この繰り返しが、ある時点から急激になります。"}, {"t": 1324.05, "x": "海峡には、カマリナル海嶺と呼ばれる高まりがあります。"}, {"t": 1327.9166666666667, "x": "この高まりが、一日あたり〇・四メートルから〇・"}, {"t": 1331.4833333333333, "x": "七メートルのペースで削られたという計算も出ています。"}, {"t": 1334.95, "x": "削れるほど水が増え、水が増えるほど削れる。"}, {"t": 1338.4333333333334, "x": "歯止めが外れる形です。計算では、"}, {"t": 1341.15, "x": "入ってきた水のおよそ九割が、"}, {"t": 1343.5166666666667, "x": "二年に満たない期間で移動したとされています。"}, {"t": 1346.45, "x": "そのとき、地中海の水位は一日あたり"}, {"t": 1349.4333333333334, "x": "十メートルを超えて上がった可能性があります。"}, {"t": 1352.1833333333334, "x": "流量のピークは、毎秒一億立方メートルという"}, {"t": 1355.85, "x": "規模で見積もられています。"}, {"t": 1357.3166666666666, "x": "アマゾン川のおよそ四百五十倍に当たる数字です。"}, {"t": 1360.7666666666667, "x": "流れの速さは、毎秒四十メートルを"}, {"t": 1363.75, "x": "超えたという計算もあります。"}, {"t": 1365.5666666666666, "x": "海峡を削り取った岩の量は、"}, {"t": 1367.6333333333334, "x": "およそ千立方キロメートルと見積もられています。"}, {"t": 1370.8333333333333, "x": "ただし、これらはすべて計算による推定です。"}, {"t": 1374.3166666666666, "x": "実際にこの流れを見た者はいません。"}, {"t": 1376.7333333333333, "x": "残っているのは、削られた谷と、"}, {"t": 1379.0833333333333, "x": "その中に詰まった堆積物だけです。"}, {"t": 1381.65, "x": "別の見方もあります。もっと緩やかに戻ったとする見方。"}, {"t": 1385.45, "x": "ジブラルタルは完全には閉じておらず、"}, {"t": 1387.75, "x": "細い流れが続いていたとする見方。"}, {"t": 1390.4333333333334, "x": "他の経路から水が入ったとする見方もあります。"}, {"t": 1393.5666666666666, "x": "なお、古い本には、海峡に巨大な"}, {"t": 1396.8833333333334, "x": "滝があったという描写が出てきます。"}, {"t": 1399.0, "x": "ベネズエラのアンヘルの滝を"}, {"t": 1400.5833333333333, "x": "超える高さ、という書き方もされました。"}, {"t": 1403.4166666666667, "x": "しかし近年の研究では、流れは滝というより、"}, {"t": 1406.85, "x": "かなり緩い勾配を下っていったとされています。"}, {"t": 1409.95, "x": "滝のイメージは、現在の研究では支持されていません。"}, {"t": 1413.8, "x": "もうひとつ、規模を測る手がかりがあります。"}, {"t": 1416.8333333333333, "x": "地中海が干上がっていたあいだ、そこにあったはずの"}, {"t": 1420.0333333333333, "x": "水は、世界の海に移っていました。"}, {"t": 1422.6333333333334, "x": "その量は、世界の海面をおよそ十二メートル"}, {"t": 1425.9166666666667, "x": "押し上げる計算になります。"}, {"t": 1427.6166666666666, "x": "水が戻ったとき、逆のことが起きたことになります。"}, {"t": 1431.2, "x": "ひとつの海が満ちるだけで、地球全体の海面が動く。"}, {"t": 1435.15, "x": "それが、この出来事の大きさです。"}, {"t": 1437.8333333333333, "x": "この水が戻った瞬間は、地質年代の"}, {"t": 1440.8833333333334, "x": "区切りとして正式に採用されています。"}, {"t": 1443.35, "x": "シチリア島南岸のエラクレア・ミノアという"}, {"t": 1445.8, "x": "場所に、その境目の露頭があります。"}, {"t": 1448.5166666666667, "x": "白い石灰質の地層が、乾いた時代の"}, {"t": 1451.5166666666667, "x": "層の上に、いきなり乗っている場所です。"}, {"t": 1454.1833333333334, "x": "国際地質科学連合は、ここをザンクリアン期、"}, {"t": 1457.4666666666667, "x": "つまり鮮新世の始まりの基準点に定めました。"}, {"t": 1460.9666666666667, "x": "年代は、天文年代学で533万3千年前とされています。"}, {"t": 1466.2666666666667, "x": "海が戻った日が、そのまま時代の"}, {"t": 1468.6, "x": "境目になった、ということです。"}, {"t": 1470.9666666666667, "x": "ここまでは、水と塩と地面の話でした。"}, {"t": 1474.0333333333333, "x": "海の中にいたものの側から見ると、"}, {"t": 1476.1666666666667, "x": "この期間は別の意味を持ちます。"}, {"t": 1478.4666666666667, "x": "まず、この期間の終わりごろに、奇妙な段階があります。"}, {"t": 1482.7, "x": "研究者はこれをラゴ・マーレ、"}, {"t": 1484.4833333333333, "x": "イタリア語で「湖の海」と呼んでいます。"}, {"t": 1488.35, "x": "およそ555万年前から533万年前にかけての時期です。"}, {"t": 1493.2833333333333, "x": "このとき地中海の地層に現れるのは、"}, {"t": 1495.7833333333333, "x": "海の生き物ではありません。"}, {"t": 1497.8, "x": "汽水、つまり塩分の薄い水に住む貝や、小さな甲殻類です。"}, {"t": 1502.95, "x": "コンゲリア、メラノプシス、"}, {"t": 1505.0166666666667, "x": "キプリデイスといった名前が並びます。"}, {"t": 1507.7, "x": "これらは、地中海の生き物ではありませんでした。"}, {"t": 1511.0166666666667, "x": "黒海やカスピ海につながる、"}, {"t": 1512.7833333333333, "x": "パラテチスと呼ばれる内海の生き物です。"}, {"t": 1515.6, "x": "つまり、大西洋とは切れたまま、東側からは"}, {"t": 1519.4166666666667, "x": "水と生き物が入ってきていた、ということになります。"}, {"t": 1522.8166666666666, "x": "海だった場所が、塩分の薄い"}, {"t": 1525.1, "x": "巨大な湖になっていた時期がある。"}, {"t": 1527.2333333333333, "x": "ラゴ・マーレという呼び名は、そういう意味です。"}, {"t": 1530.2333333333333, "x": "ただし、この段階をどう説明するかも、"}, {"t": 1533.2666666666667, "x": "研究者のあいだで割れています。"}, {"t": 1535.5166666666667, "x": "水位が低いまま湖になったとする見方と、逆に"}, {"t": 1539.2666666666667, "x": "水位はかなり高かったとする見方があります。"}, {"t": 1541.9333333333334, "x": "ここも、決着していません。"}, {"t": 1544.1833333333334, "x": "そして533万年前に大西洋が戻ってくると、"}, {"t": 1548.0333333333333, "x": "この汽水の生き物は消えます。"}, {"t": 1550.2166666666667, "x": "入れ替わりに入ってきたのが、大西洋の海の生き物でした。"}, {"t": 1554.1666666666667, "x": "2024年に発表された研究が、"}, {"t": 1556.9, "x": "この入れ替わりを数字で示しています。"}, {"t": 1559.5166666666667, "x": "研究チームは、地中海の化石の"}, {"t": 1562.0833333333333, "x": "記録を統一した形に作り直しました。"}, {"t": 1564.7333333333333, "x": "石灰質ナノプランクトンから、有孔虫、"}, {"t": 1567.7666666666667, "x": "貝、サンゴ、ウニ、魚、海の哺乳類まで。"}, {"t": 1573.1333333333334, "x": "二万三千件を超える産出記録を集めています。"}, {"t": 1576.5166666666667, "x": "その結果、危機の前に地中海だけで"}, {"t": 1579.2666666666667, "x": "確認されていた固有種は、七百七十九種でした。"}, {"t": 1583.05, "x": "このうち、危機を越えたのは八十六種です。"}, {"t": 1586.2166666666667, "x": "割合にして、およそ十一パーセントとされています。"}, {"t": 1589.8, "x": "さらに、危機の前と後で種の顔ぶれを比べると、"}, {"t": 1593.1666666666667, "x": "およそ六十七パーセントが入れ替わっていました。"}, {"t": 1596.3, "x": "種数として回復するまでには、"}, {"t": 1598.3166666666666, "x": "百七十万年以上かかったとされています。"}, {"t": 1601.4333333333334, "x": "大西洋とつながり直したあと、地中海に"}, {"t": 1604.45, "x": "入ってきたのは、大西洋にいた系統でした。"}, {"t": 1607.5833333333333, "x": "いまの地中海で見られる生き物の多くは、"}, {"t": 1610.0833333333333, "x": "この再入植の子孫にあたります。"}, {"t": 1612.6, "x": "地中海に固有種が少ないことの"}, {"t": 1614.6666666666667, "x": "理由の一部が、ここにあります。"}, {"t": 1616.9666666666667, "x": "別の研究は、危機の前後で入れ替わった種の"}, {"t": 1620.1, "x": "割合を、グループごとに出しています。"}, {"t": 1622.6666666666667, "x": "石灰質ナノプランクトンで三割ほど。"}, {"t": 1625.2833333333333, "x": "底生有孔虫で六割近く。貝形虫で六割台。"}, {"t": 1629.1333333333334, "x": "ウニで八割台。サンゴに至っては九割を超えています。"}, {"t": 1632.9833333333333, "x": "グループによって、受けた影響の大きさがまるで違います。"}, {"t": 1637.0333333333333, "x": "また、いまの地中海には、東へ行くほど"}, {"t": 1640.4, "x": "種類が減るという傾向があります。"}, {"t": 1642.4666666666667, "x": "入り口が西のジブラルタルの一箇所しかないことと、"}, {"t": 1645.4833333333333, "x": "無関係ではないと考えられています。"}, {"t": 1648.0666666666666, "x": "海がひとつ閉じて、開き直る。"}, {"t": 1650.3833333333334, "x": "それだけで、そこに住む生き物の"}, {"t": 1652.6666666666667, "x": "名簿は、ほとんど書き換わります。"}, {"t": 1654.9, "x": "最後に、この出来事が現在にどう残っているかを見ます。"}, {"t": 1658.9166666666667, "x": "シチリア島の内陸には、あの時代の"}, {"t": 1661.4666666666667, "x": "石膏の地層が地上に出ています。"}, {"t": 1663.65, "x": "そしてその石膏の一部は、自然の"}, {"t": 1666.35, "x": "硫黄に置き換わっています。"}, {"t": 1667.8833333333334, "x": "2025年に発表された研究は、シチリアの"}, {"t": 1671.5333333333333, "x": "モンテ・パルコでこの置き換わりを調べています。"}, {"t": 1674.1166666666666, "x": "そして、それが微生物のはたらきに"}, {"t": 1676.7166666666667, "x": "よって起きたことを示しました。"}, {"t": 1678.5, "x": "酸素のない環境で、メタンを使う古細菌と、"}, {"t": 1682.0166666666667, "x": "硫酸を使う細菌がはたらきます。"}, {"t": 1684.6, "x": "それが石膏を、炭酸塩と硫黄に"}, {"t": 1687.2833333333333, "x": "変えていったという内容です。"}, {"t": 1689.05, "x": "その硫黄が、十九世紀のシチリアを動かしました。"}, {"t": 1692.6833333333334, "x": "当時、シチリアは西側世界の硫黄供給を、"}, {"t": 1696.1833333333334, "x": "ほぼ一手に握っていました。硫黄は、硫酸の原料です。"}, {"t": 1700.5, "x": "硫酸は、染料、漂白、肥料、火薬など、"}, {"t": 1705.1333333333334, "x": "産業革命期の化学工業のほぼ全体で使われました。"}, {"t": 1709.05, "x": "つまりシチリアは、産業革命の材料の供給地でした。"}, {"t": 1713.1166666666666, "x": "1830年代には、硫黄が島の"}, {"t": 1716.25, "x": "輸出品の第一位になっています。"}, {"t": 1718.4, "x": "最盛期は1901年で、鉱山の従事者はおよそ三万九千人。"}, {"t": 1723.75, "x": "硫黄の鉱石は、五十四万トンが掘り出されました。"}, {"t": 1727.5, "x": "十九世紀の終わりには、七百を超える鉱山で、"}, {"t": 1731.05, "x": "三万人以上が働いていたと記録されています。"}, {"t": 1734.3666666666666, "x": "この現場には、カルージと呼ばれる子どもたちがいました。"}, {"t": 1737.8333333333333, "x": "七歳や八歳の子が、鉱石を背負って坑道を上がる仕事です。"}, {"t": 1742.3833333333334, "x": "記録によれば、いちばん幼い子で"}, {"t": 1744.8833333333334, "x": "二十五キログラムから三十キログラム。"}, {"t": 1747.2666666666667, "x": "十六歳から十八歳では、七十キログラムから"}, {"t": 1750.8166666666666, "x": "八十キログラムを運びました。"}, {"t": 1752.7666666666667, "x": "坑内で八時間から十時間、地上では十一時間から"}, {"t": 1756.75, "x": "十二時間という記録が残っています。"}, {"t": 1759.1166666666666, "x": "1840年には、この硫黄を"}, {"t": 1761.8333333333333, "x": "めぐって国際問題も起きています。"}, {"t": 1763.9833333333333, "x": "両シチリア王国が硫黄の販売独占権をフランスの"}, {"t": 1767.4, "x": "会社に与え、イギリスが反発しました。"}, {"t": 1770.5166666666667, "x": "硫黄危機と呼ばれる外交上の対立です。"}, {"t": 1773.1666666666667, "x": "最終的にはフランスの仲介で決着しています。"}, {"t": 1776.5166666666667, "x": "シチリアの硫黄産業は、アメリカで別の"}, {"t": 1779.4333333333334, "x": "採掘法が普及したことで競争力を失いました。"}, {"t": 1782.8166666666666, "x": "そして1975年以降、生産は止まっていきました。"}, {"t": 1787.3166666666666, "x": "いま稼働しているのは、塩のほうです。"}, {"t": 1789.95, "x": "シチリア南部のレアルモンテには、岩塩の鉱山があります。"}, {"t": 1793.95, "x": "掘っているのは、メッシニアン塩分危機のときに"}, {"t": 1796.9, "x": "沈んだ岩塩です。坑道の総延長は、"}, {"t": 1799.5833333333333, "x": "およそ百三十キロメートルに達します。"}, {"t": 1802.6, "x": "その坑内には、岩塩を削って作られた礼拝堂があります。"}, {"t": 1806.8833333333334, "x": "壁も、柱も、装飾も、六百万年前の塩です。"}, {"t": 1811.6166666666666, "x": "それから、海の底にも残っているものがあります。"}, {"t": 1815.0, "x": "クレタ島の南の海底には、深さ"}, {"t": 1817.5666666666666, "x": "三千メートル級の窪地がいくつもあります。"}, {"t": 1820.3, "x": "その底には、ふつうの海水より"}, {"t": 1822.6666666666667, "x": "はるかに濃い塩水が溜まっています。"}, {"t": 1824.7833333333333, "x": "海の底にできた、塩水の湖です。"}, {"t": 1827.8333333333333, "x": "バノック、ティロ、ウラニア、"}, {"t": 1830.3666666666666, "x": "ラタランテ、ディスカバリー。"}, {"t": 1832.5666666666666, "x": "いずれも、見つけた調査船の名前が付けられています。"}, {"t": 1836.2333333333333, "x": "多くは1980年代から1990年代にかけての"}, {"t": 1840.7166666666667, "x": "調査で確認されました。これらは、"}, {"t": 1843.2166666666667, "x": "地中海の底の岩塩が海水に溶け出し、"}, {"t": 1845.8833333333334, "x": "重い水が窪地に集まったものと考えられています。"}, {"t": 1849.5166666666667, "x": "濃さが違うため、ふつうの海水とは混ざりません。"}, {"t": 1853.0333333333333, "x": "密度の差は、およそ二割にもなります。"}, {"t": 1855.8166666666666, "x": "境目は、水深三千二百メートルから"}, {"t": 1858.9166666666667, "x": "三千五百メートルのあたりにあります。"}, {"t": 1861.3, "x": "境目がはっきりした面として、水中に横たわっています。"}, {"t": 1865.4333333333334, "x": "ディスカバリー海盆の塩水は、自然界で"}, {"t": 1868.35, "x": "記録された中で最も濃い部類に入ります。"}, {"t": 1871.05, "x": "そして、その境目の層には、そこでしか"}, {"t": 1874.3833333333334, "x": "生きていない微生物が集まっています。"}, {"t": 1876.6166666666666, "x": "六百万年前に置かれた塩が、いまも溶け続け、"}, {"t": 1880.1833333333334, "x": "いまも生き物を養っているということです。"}, {"t": 1883.0166666666667, "x": "海がひとつ消えたという出来事は、"}, {"t": 1885.05, "x": "遠い昔話として終わっていません。"}, {"t": 1887.7166666666667, "x": "シチリアの産業史として。エジプトの農地の地下として。"}, {"t": 1891.3833333333334, "x": "海底の塩水湖として。いずれも、"}, {"t": 1893.7666666666667, "x": "現在の地面の一部になっています。"}, {"t": 1896.3166666666666, "x": "地中海は、いま水で満たされています。"}, {"t": 1899.2166666666667, "x": "その下には、水が無かった期間の"}, {"t": 1901.6333333333334, "x": "記録が、そのまま残っています。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
