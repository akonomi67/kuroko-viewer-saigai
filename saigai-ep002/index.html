<script>
const D={"name": "ep002", "file": "ep002", "dur": 1930.61665625, "segs": [], "subs": [{"t": 0.0, "x": "1931年の9月、北海で一隻の漁船が網を上げました。"}, {"t": 5.166666666666667, "x": "イングランド東部、ノーフォークの沖合です。"}, {"t": 8.233333333333333, "x": "網の中に、魚に混じって、黒っぽい土の"}, {"t": 11.666666666666666, "x": "塊が入っていました。泥炭です。"}, {"t": 14.2, "x": "湿った土地に植物が積もり、"}, {"t": 16.1, "x": "腐りきらずに残った土のことです。"}, {"t": 18.683333333333334, "x": "船の上では、それをシャベルで"}, {"t": 20.8, "x": "割って、海に捨てようとしました。"}, {"t": 23.233333333333334, "x": "シャベルが、何か硬いものに当たりました。"}, {"t": 26.1, "x": "中から出てきたのは、鹿の角を"}, {"t": 28.383333333333333, "x": "削って作った、銛の先でした。"}, {"t": 30.916666666666668, "x": "かえしの付いた、人の手による道具です。"}, {"t": 33.766666666666666, "x": "網が上がってきた場所の水深は、"}, {"t": 35.916666666666664, "x": "三十メートルを超えていました。"}, {"t": 38.13333333333333, "x": "人は、水深三十メートルの海の"}, {"t": 40.78333333333333, "x": "底で、狩りの道具を作りません。"}, {"t": 43.2, "x": "つまり、この道具が作られたとき、"}, {"t": 45.666666666666664, "x": "そこは海ではなかったことになります。"}, {"t": 48.11666666666667, "x": "のちに、この銛の先は年代が測られています。"}, {"t": 51.483333333333334, "x": "結果は、いまから一万三千年以上前でした。"}, {"t": 55.11666666666667, "x": "銛の先は、泥炭に包まれていました。"}, {"t": 58.03333333333333, "x": "泥炭は、湿った陸の上でしかできない土です。"}, {"t": 61.583333333333336, "x": "この道具は、水の底ではなく、湿った陸地の"}, {"t": 65.3, "x": "上に残されていたことになります。"}, {"t": 67.2, "x": "北海█"}, {"t": 67.2, "x": "北海の南部には、かつて広い陸地がありました。"}, {"t": 71.18333333333334, "x": "イギリスとヨーロッパ大陸は、"}, {"t": 72.91666666666667, "x": "歩いて行き来できる一つの大地でした。"}, {"t": 75.61666666666666, "x": "その大地は、ある日突然消えたのではありません。"}, {"t": 79.06666666666666, "x": "氷がとけ、海が少しずつ上がり、数千年をかけて、"}, {"t": 83.36666666666666, "x": "岸が、内側へ内側へと寄ってきました。"}, {"t": 86.8, "x": "丘は島になり、島は砂の浅瀬になり、"}, {"t": 89.76666666666667, "x": "最後は海の底になりました。"}, {"t": 92.03333333333333, "x": "いまこの場所は、ドッガーランドと呼ばれています。"}, {"t": 93.26666666666667, "x": "ドッガーランド█"}, {"t": 95.73333333333333, "x": "国ひとつぶんの大地が、ゆっくりと"}, {"t": 98.26666666666667, "x": "海に沈んでいった記録です。"}, {"t": 100.03333333333333, "x": "主語は、氷と海と、平らな大地です。"}, {"t": 103.51666666666667, "x": "海の底に陸があった、という考え自体は、"}, {"t": 106.81666666666666, "x": "1931年より前からありました。"}, {"t": 109.98333333333333, "x": "イギリスの海岸には、潮が大きく引いたときにだけ、"}, {"t": 113.53333333333333, "x": "木の切り株が現れる場所があります。"}, {"t": 116.05, "x": "根を張ったまま、海の中に立っている切り株です。"}, {"t": 119.5, "x": "木は、海の中では育ちません。"}, {"t": 122.1, "x": "そこがかつて森だった、ということになります。"}, {"t": 125.23333333333333, "x": "こうした場所は、沈んだ森と呼ばれてきました。"}, {"t": 128.33333333333334, "x": "1913年、クレメント・リードという"}, {"t": 129.46666666666667, "x": "クレメント・リード█"}, {"t": 131.71666666666667, "x": "研究者が、一冊の本を出しました。"}, {"t": 134.75, "x": "リードは、イギリスの地質調査所に、"}, {"t": 137.38333333333333, "x": "四十年近く勤めた人物です。"}, {"t": 139.96666666666667, "x": "植物の種や実の化石から、昔の"}, {"t": 142.68333333333334, "x": "気候を読み解く専門家でした。"}, {"t": 144.58333333333334, "x": "本の題名は、そのまま『沈んだ森』です。"}, {"t": 148.95, "x": "リードは、ドッガーバンクから"}, {"t": 151.0, "x": "引き揚げられた植物の化石も調べています。"}, {"t": 153.7, "x": "そして本の中で、一枚の地図を描きました。"}, {"t": 157.11666666666667, "x": "イングランドの東と、ヨーロッパ大陸とが、"}, {"t": 160.15, "x": "陸でつながっている地図です。"}, {"t": 162.06666666666666, "x": "いまの北海の南半分が、そっくり陸として"}, {"t": 165.31666666666666, "x": "描かれていました。この地図は、"}, {"t": 167.5, "x": "のちの研究で分かった姿に、"}, {"t": 169.38333333333333, "x": "驚くほど近かったと評価されています。"}, {"t": 172.18333333333334, "x": "リードが亡くなったのは、1916年です。"}, {"t": 175.66666666666666, "x": "コリンダ号の網に銛の先が掛かる、十五年前のことでした。"}, {"t": 179.86666666666667, "x": "ただ、当時はまだ、人がそこにいたという"}, {"t": 182.96666666666667, "x": "物証がありませんでした。そこへ、"}, {"t": 185.43333333333334, "x": "1931年█"}, {"t": 186.05, "x": "1931年の銛の先が上がってきます。"}, {"t": 189.53333333333333, "x": "網を引いていたのは、コリンダ号という漁船でした。"}, {"t": 192.98333333333332, "x": "場所は、リーマン・アンド・オー"}, {"t": 194.83333333333334, "x": "ワー・バンクと呼ばれる浅瀬のあたりです。"}, {"t": 197.08333333333334, "x": "ノーフォークの東、およそ四十キロメートルの"}, {"t": 200.3, "x": "沖とされています。水深は、"}, {"t": 202.35, "x": "三十数メートルと記録されています。"}, {"t": 205.01666666666668, "x": "同じ船は、その後も同じ海域から、"}, {"t": 207.81666666666666, "x": "泥炭の塊を引き揚げました。"}, {"t": 210.1, "x": "その泥炭の花粉を調べると、何種類もの"}, {"t": 213.23333333333332, "x": "木が混じった森の花粉が出てきました。"}, {"t": 215.45, "x": "銛が沈んでいた場所は、森のそばだったことになります。"}, {"t": 219.08333333333334, "x": "海の底から上がった泥炭が、そこに木の生える"}, {"t": 222.26666666666668, "x": "陸があったことを、花粉で語ったわけです。"}, {"t": 225.2, "x": "銛の先そのものは、1988年に、"}, {"t": 228.65, "x": "放射性炭素で年代が測られました。"}, {"t": 231.36666666666667, "x": "結果は、およそ一万三千九百年前から、"}, {"t": 234.91666666666666, "x": "一万三千二百年前のあいだです。"}, {"t": 237.78333333333333, "x": "いまは、イングランドのノリッジ城"}, {"t": 240.13333333333333, "x": "博物館に収められています。"}, {"t": 242.05, "x": "証拠は、その後も別の形で上がり続けました。"}, {"t": 245.53333333333333, "x": "オランダでは、海岸を守るために、沖合の海底から"}, {"t": 249.53333333333333, "x": "砂を大量に吸い上げて、浜に盛っています。"}, {"t": 252.6, "x": "港を広げる埋め立て工事にも、"}, {"t": 254.65, "x": "同じように海の砂が使われてきました。"}, {"t": 257.35, "x": "その砂の中から、骨や角で作られた道具が"}, {"t": 260.6, "x": "見つかるようになりました。"}, {"t": 262.0, "x": "南ホラント州の浜辺などで集められた、骨や"}, {"t": 265.3, "x": "角の尖った道具は、千点を超えています。"}, {"t": 268.3666666666667, "x": "多くは、浜を歩く人たちが拾い集め、"}, {"t": 271.3333333333333, "x": "個人で持っているものです。"}, {"t": 273.26666666666665, "x": "中には、海岸から二十キロメートルほど"}, {"t": 276.21666666666664, "x": "内陸で見つかったものもあります。"}, {"t": 278.1166666666667, "x": "海の砂が、工事で内陸まで運ばれていたためです。"}, {"t": 281.8, "x": "年代を測ったものの中には、一万三千年前ごろのものや、"}, {"t": 286.2, "x": "一万五百年前ごろのものがあります。"}, {"t": 289.05, "x": "北海の底の砂には、陸だった時代の暮らしの"}, {"t": 292.2, "x": "跡が、まとめて混じっているということです。"}, {"t": 294.93333333333334, "x": "こうした証拠が積み上がり、1990年代に、"}, {"t": 298.76666666666665, "x": "この陸地に名前が付きました。"}, {"t": 300.8666666666667, "x": "イギリスの考古学者ブライオニー・コールズが、"}, {"t": 303.7, "x": "この失われた大地を、ドッガーランドと呼んだのです。"}, {"t": 305.68333333333334, "x": "ドッガーランド█"}, {"t": 307.95, "x": "由来は、北海の真ん中にある、"}, {"t": 310.26666666666665, "x": "ドッガーバンクという浅瀬です。"}, {"t": 312.5833333333333, "x": "ドッガーバンクという名前は、この海で"}, {"t": 315.21666666666664, "x": "魚を獲っていた、ドッガーと呼ばれる二本"}, {"t": 318.1333333333333, "x": "マストの漁船から来たと考えられています。"}, {"t": 320.68333333333334, "x": "漁船の名前が浅瀬の名前になり、浅瀬の"}, {"t": 323.8333333333333, "x": "名前が、沈んだ大地の名前になりました。"}, {"t": 326.76666666666665, "x": "なぜ、北海の底が陸だったのか。"}, {"t": 329.5, "x": "答えは、海の水がどこにあったかにあります。"}, {"t": 332.75, "x": "いまからおよそ二万年あまり前、地球は、"}, {"t": 335.81666666666666, "x": "最終氷期のもっとも寒い時期にありました。"}, {"t": 338.81666666666666, "x": "北アメリカの北半分と、北ヨーロッパは、"}, {"t": 341.85, "x": "厚い氷に覆われていました。"}, {"t": 344.05, "x": "氷床と呼ばれる、大陸規模の氷のかたまりです。"}, {"t": 347.68333333333334, "x": "この氷は、もとをたどれば海の水です。"}, {"t": 350.56666666666666, "x": "海から蒸発した水が、雪として陸に降り、"}, {"t": 353.71666666666664, "x": "とけないまま積み重なっていきました。"}, {"t": 356.21666666666664, "x": "陸に積もった分だけ、海の水は減ります。"}, {"t": 359.5, "x": "この時期、世界の海面は、いまより"}, {"t": 362.3333333333333, "x": "およそ120メートル█"}, {"t": 362.95, "x": "およそ120メートル低かったとされています。"}, {"t": 366.23333333333335, "x": "百二十メートルは、高いビルの"}, {"t": 368.6, "x": "三十階から四十階ほどに当たる高さです。"}, {"t": 371.53333333333336, "x": "それだけの厚さの水が、世界中の海から、"}, {"t": 374.75, "x": "陸の氷へ移っていたということです。"}, {"t": 377.3, "x": "では、いまの北海は、どのくらいの深さなのか。"}, {"t": 380.98333333333335, "x": "北海の面積は、およそ五十七万平方キロメートル。"}, {"t": 385.03333333333336, "x": "平均の深さは、およそ九十五メートルです。"}, {"t": 388.3333333333333, "x": "いちばん深いのはノルウェー沿岸の溝で、"}, {"t": 390.85, "x": "七百メートルほどあります。"}, {"t": 392.93333333333334, "x": "ただし南の半分は浅く、多くの場所が数十メートルです。"}, {"t": 397.21666666666664, "x": "平均の深さが九十五メートルの海で、海面が"}, {"t": 400.81666666666666, "x": "百二十メートル下がれば、どうなるか。"}, {"t": 403.51666666666665, "x": "北海の大部分が、底を見せることになります。"}, {"t": 406.81666666666666, "x": "実際、氷床がもっとも広がった時期には、北海は"}, {"t": 410.8, "x": "ほとんど干上がっていたと考えられています。"}, {"t": 413.26666666666665, "x": "しかも、それは一度きりのことではありません。"}, {"t": 416.3333333333333, "x": "氷床が大きく広がる時期が来るたびに、北海は、"}, {"t": 419.85, "x": "ほとんど干上がってきたとされています。"}, {"t": 422.18333333333334, "x": "ドッガーランドは、その繰り返しの、最後の一回の姿です。"}, {"t": 426.73333333333335, "x": "ただし、そのすべてが、歩ける"}, {"t": 429.45, "x": "土地だったわけではありません。"}, {"t": 431.0833333333333, "x": "もっとも寒い時期には、北海の北の側と、イギリスの"}, {"t": 435.06666666666666, "x": "多くが、氷に覆われていたとされています。"}, {"t": 438.0833333333333, "x": "いまのドッガーバンクも、この氷が作った地形です。"}, {"t": 441.68333333333334, "x": "氷の前にできた湖に土砂がたまり、"}, {"t": 444.0833333333333, "x": "それを氷が押し曲げて、盛り上げました。"}, {"t": 447.4, "x": "その盛り上がりは、およそ三万千六百年前から、"}, {"t": 451.05, "x": "二万三千百年前にかけてできたとされています。 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
