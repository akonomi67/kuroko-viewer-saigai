<script>
const D={"name": "ep002", "file": "ep002", "dur": 1929.9333125, "segs": [], "subs": [{"t": 0.0, "x": "1931年の9月、北海で一隻の漁船が網を上げました。"}, {"t": 5.166666666666667, "x": "イングランド東部、ノーフォークの沖合です。"}, {"t": 8.233333333333333, "x": "網の中に、魚に混じって、黒っぽい土の"}, {"t": 11.666666666666666, "x": "塊が入っていました。泥炭です。"}, {"t": 14.2, "x": "湿った土地に植物が積もり、"}, {"t": 16.1, "x": "腐りきらずに残った土のことです。"}, {"t": 18.683333333333334, "x": "船の上では、それをシャベルで"}, {"t": 20.8, "x": "割って、海に捨てようとしました。"}, {"t": 23.233333333333334, "x": "シャベルが、何か硬いものに当たりました。"}, {"t": 26.1, "x": "中から出てきたのは、鹿の角を"}, {"t": 28.383333333333333, "x": "削って作った、銛の先でした。"}, {"t": 30.9, "x": "かえしの付いた、人の手による道具です。"}, {"t": 33.75, "x": "網が上がってきた場所の水深は、"}, {"t": 35.9, "x": "三十メートルを超えていました。"}, {"t": 38.11666666666667, "x": "人は、水深三十メートルの海の"}, {"t": 40.766666666666666, "x": "底で、狩りの道具を作りません。"}, {"t": 43.18333333333333, "x": "つまり、この道具が作られたとき、"}, {"t": 45.65, "x": "そこは海ではなかったことになります。"}, {"t": 48.1, "x": "のちに、この銛の先は年代が測られています。"}, {"t": 51.46666666666667, "x": "結果は、いまから一万三千年以上前でした。"}, {"t": 55.1, "x": "銛の先は、泥炭に包まれていました。"}, {"t": 58.016666666666666, "x": "泥炭は、湿った陸の上でしかできない土です。"}, {"t": 61.56666666666667, "x": "この道具は、水の底ではなく、湿った陸地の"}, {"t": 65.28333333333333, "x": "上に残されていたことになります。"}, {"t": 67.18333333333334, "x": "北海█"}, {"t": 67.18333333333334, "x": "北海の南部には、かつて広い陸地がありました。"}, {"t": 71.16666666666667, "x": "イギリスとヨーロッパ大陸は、"}, {"t": 72.9, "x": "歩いて行き来できる一つの大地でした。"}, {"t": 75.6, "x": "その大地は、ある日突然消えたのではありません。"}, {"t": 79.05, "x": "氷がとけ、海が少しずつ上がり、数千年をかけて、"}, {"t": 83.35, "x": "岸が、内側へ内側へと寄ってきました。"}, {"t": 86.78333333333333, "x": "丘は島になり、島は砂の浅瀬になり、"}, {"t": 89.75, "x": "最後は海の底になりました。"}, {"t": 92.01666666666667, "x": "いまこの場所は、ドッガーランドと呼ばれています。"}, {"t": 93.25, "x": "ドッガーランド█"}, {"t": 95.71666666666667, "x": "国ひとつぶんの大地が、ゆっくりと"}, {"t": 98.25, "x": "海に沈んでいった記録です。"}, {"t": 100.01666666666667, "x": "主語は、氷と海と、平らな大地です。"}, {"t": 103.5, "x": "海の底に陸があった、という考え自体は、"}, {"t": 106.8, "x": "1931年より前からありました。"}, {"t": 109.96666666666667, "x": "イギリスの海岸には、潮が大きく引いたときにだけ、"}, {"t": 113.51666666666667, "x": "木の切り株が現れる場所があります。"}, {"t": 116.03333333333333, "x": "根を張ったまま、海の中に立っている切り株です。"}, {"t": 119.48333333333333, "x": "木は、海の中では育ちません。"}, {"t": 122.08333333333333, "x": "そこがかつて森だった、ということになります。"}, {"t": 125.21666666666667, "x": "こうした場所は、沈んだ森と呼ばれてきました。"}, {"t": 128.31666666666666, "x": "1913年、クレメント・リードという"}, {"t": 129.45, "x": "クレメント・リード█"}, {"t": 131.7, "x": "研究者が、一冊の本を出しました。"}, {"t": 134.73333333333332, "x": "リードは、イギリスの地質調査所に、"}, {"t": 137.36666666666667, "x": "四十年近く勤めた人物です。"}, {"t": 139.95, "x": "植物の種や実の化石から、昔の"}, {"t": 142.65, "x": "気候を読み解く専門家でした。"}, {"t": 144.55, "x": "本の題名は、そのまま『沈んだ森』です。"}, {"t": 148.91666666666666, "x": "リードは、ドッガーバンクから"}, {"t": 150.96666666666667, "x": "引き揚げられた植物の化石も調べています。"}, {"t": 153.66666666666666, "x": "そして本の中で、一枚の地図を描きました。"}, {"t": 157.08333333333334, "x": "イングランドの東と、ヨーロッパ大陸とが、"}, {"t": 160.11666666666667, "x": "陸でつながっている地図です。"}, {"t": 162.03333333333333, "x": "いまの北海の南半分が、そっくり陸として"}, {"t": 165.28333333333333, "x": "描かれていました。この地図は、"}, {"t": 167.46666666666667, "x": "のちの研究で分かった姿に、"}, {"t": 169.35, "x": "驚くほど近かったと評価されています。"}, {"t": 172.15, "x": "リードが亡くなったのは、1916年です。"}, {"t": 175.63333333333333, "x": "コリンダ号の網に銛の先が掛かる、十五年前のことでした。"}, {"t": 179.83333333333334, "x": "ただ、当時はまだ、人がそこにいたという"}, {"t": 182.93333333333334, "x": "物証がありませんでした。そこへ、"}, {"t": 185.4, "x": "1931年█"}, {"t": 186.01666666666668, "x": "1931年の銛の先が上がってきます。"}, {"t": 189.5, "x": "網を引いていたのは、コリンダ号という漁船でした。"}, {"t": 192.95, "x": "場所は、リーマン・アンド・オー"}, {"t": 194.8, "x": "ワー・バンクと呼ばれる浅瀬のあたりです。"}, {"t": 197.05, "x": "ノーフォークの東、およそ四十キロメートルの"}, {"t": 200.26666666666668, "x": "沖とされています。水深は、"}, {"t": 202.31666666666666, "x": "三十数メートルと記録されています。"}, {"t": 204.98333333333332, "x": "同じ船は、その後も同じ海域から、"}, {"t": 207.78333333333333, "x": "泥炭の塊を引き揚げました。"}, {"t": 210.06666666666666, "x": "その泥炭の花粉を調べると、何種類もの"}, {"t": 213.2, "x": "木が混じった森の花粉が出てきました。"}, {"t": 215.41666666666666, "x": "銛が沈んでいた場所は、森のそばだったことになります。"}, {"t": 219.05, "x": "海の底から上がった泥炭が、そこに木の生える"}, {"t": 222.21666666666667, "x": "陸があったことを、花粉で語ったわけです。"}, {"t": 225.11666666666667, "x": "銛の先そのものは、1988年に、"}, {"t": 228.56666666666666, "x": "放射性炭素で年代が測られました。"}, {"t": 231.28333333333333, "x": "結果は、およそ一万三千九百年前から、"}, {"t": 234.83333333333334, "x": "一万三千二百年前のあいだです。"}, {"t": 237.7, "x": "いまは、イングランドのノリッジ城"}, {"t": 240.05, "x": "博物館に収められています。"}, {"t": 241.96666666666667, "x": "証拠は、その後も別の形で上がり続けました。"}, {"t": 245.45, "x": "オランダでは、海岸を守るために、沖合の海底から"}, {"t": 249.45, "x": "砂を大量に吸い上げて、浜に盛っています。"}, {"t": 252.51666666666668, "x": "港を広げる埋め立て工事にも、"}, {"t": 254.55, "x": "同じように海の砂が使われてきました。"}, {"t": 257.25, "x": "その砂の中から、骨や角で作られた道具が"}, {"t": 260.5, "x": "見つかるようになりました。"}, {"t": 261.9, "x": "南ホラント州の浜辺などで集められた、骨や"}, {"t": 265.2, "x": "角の尖った道具は、千点を超えています。"}, {"t": 268.26666666666665, "x": "多くは、浜を歩く人たちが拾い集め、"}, {"t": 271.23333333333335, "x": "個人で持っているものです。"}, {"t": 273.1666666666667, "x": "中には、海岸から二十キロメートルほど"}, {"t": 276.1166666666667, "x": "内陸で見つかったものもあります。"}, {"t": 278.01666666666665, "x": "海の砂が、工事で内陸まで運ばれていたためです。"}, {"t": 281.7, "x": "年代を測ったものの中には、一万三千年前ごろのものや、"}, {"t": 286.1, "x": "一万五百年前ごろのものがあります。"}, {"t": 288.95, "x": "北海の底の砂には、陸だった時代の暮らしの"}, {"t": 292.1, "x": "跡が、まとめて混じっているということです。"}, {"t": 294.8333333333333, "x": "こうした証拠が積み上がり、1990年代に、"}, {"t": 298.6666666666667, "x": "この陸地に名前が付きました。"}, {"t": 300.76666666666665, "x": "イギリスの考古学者ブライオニー・コールズが、"}, {"t": 303.6, "x": "この失われた大地を、ドッガーランドと呼んだのです。"}, {"t": 305.5833333333333, "x": "ドッガーランド█"}, {"t": 307.85, "x": "由来は、北海の真ん中にある、"}, {"t": 310.1666666666667, "x": "ドッガーバンクという浅瀬です。"}, {"t": 312.48333333333335, "x": "ドッガーバンクという名前は、この海で"}, {"t": 315.1166666666667, "x": "魚を獲っていた、ドッガーと呼ばれる二本"}, {"t": 318.03333333333336, "x": "マストの漁船から来たと考えられています。"}, {"t": 320.5833333333333, "x": "漁船の名前が浅瀬の名前になり、浅瀬の"}, {"t": 323.73333333333335, "x": "名前が、沈んだ大地の名前になりました。"}, {"t": 326.6666666666667, "x": "なぜ、北海の底が陸だったのか。"}, {"t": 329.4, "x": "答えは、海の水がどこにあったかにあります。"}, {"t": 332.65, "x": "いまからおよそ二万年あまり前、地球は、"}, {"t": 335.71666666666664, "x": "最終氷期のもっとも寒い時期にありました。"}, {"t": 338.71666666666664, "x": "北アメリカの北半分と、北ヨーロッパは、"}, {"t": 341.75, "x": "厚い氷に覆われていました。"}, {"t": 343.95, "x": "氷床と呼ばれる、大陸規模の氷のかたまりです。"}, {"t": 347.5833333333333, "x": "この氷は、もとをたどれば海の水です。"}, {"t": 350.45, "x": "海から蒸発した水が、雪として陸に降り、"}, {"t": 353.6, "x": "とけないまま積み重なっていきました。"}, {"t": 356.1, "x": "陸に積もった分だけ、海の水は減ります。"}, {"t": 359.3833333333333, "x": "この時期、世界の海面は、いまより"}, {"t": 362.21666666666664, "x": "およそ120メートル█"}, {"t": 362.8333333333333, "x": "およそ120メートル低かったとされています。"}, {"t": 366.1166666666667, "x": "百二十メートルは、高いビルの"}, {"t": 368.48333333333335, "x": "三十階から四十階ほどに当たる高さです。"}, {"t": 371.4166666666667, "x": "それだけの厚さの水が、世界中の海から、"}, {"t": 374.6333333333333, "x": "陸の氷へ移っていたということです。"}, {"t": 377.18333333333334, "x": "では、いまの北海は、どのくらいの深さなのか。"}, {"t": 380.8666666666667, "x": "北海の面積は、およそ五十七万平方キロメートル。"}, {"t": 384.9166666666667, "x": "平均の深さは、およそ九十五メートルです。"}, {"t": 388.21666666666664, "x": "いちばん深いのはノルウェー沿岸の溝で、"}, {"t": 390.73333333333335, "x": "七百メートルほどあります。"}, {"t": 392.81666666666666, "x": "ただし南の半分は浅く、多くの場所が数十メートルです。"}, {"t": 397.1, "x": "平均の深さが九十五メートルの海で、海面が"}, {"t": 400.7, "x": "百二十メートル下がれば、どうなるか。"}, {"t": 403.4, "x": "北海の大部分が、底を見せることになります。"}, {"t": 406.68333333333334, "x": "実際、氷床がもっとも広がった時期には、北海は"}, {"t": 410.6666666666667, "x": "ほとんど干上がっていたと考えられています。"}, {"t": 413.1333333333333, "x": "しかも、それは一度きりのことではありません。"}, {"t": 416.2, "x": "氷床が大きく広がる時期が来るたびに、北海は、"}, {"t": 419.71666666666664, "x": "ほとんど干上がってきたとされています。"}, {"t": 422.05, "x": "ドッガーランドは、その繰り返しの、最後の一回の姿です。"}, {"t": 426.6, "x": "ただし、そのすべてが、歩ける"}, {"t": 429.31666666666666, "x": "土地だったわけではありません。"}, {"t": 430.95, "x": "もっとも寒い時期には、北海の北の側と、イギリスの"}, {"t": 434.93333333333334, "x": "多くが、氷に覆われていたとされています。"}, {"t": 437.95, "x": "いまのドッガーバンクも、この氷が作った地形です。"}, {"t": 441.55, "x": "氷の前にできた湖に土砂がたまり、"}, {"t": 443.95, "x": "それを氷が押し曲げて、盛り上げました。"}, {"t": 447.26666666666665, "x": "その盛り上がりは、およそ三万千六百年前から、"}, {"t": 450.9166666666667, "x": "二万三千百年前にかけてできたとされています。"}, {"t": 454.25, "x": "のちのドッガーランドで、いちばん高い"}, {"t": 456.85, "x": "丘になった場所です。南の側には、別の地形がありました。"}, {"t": 461.1, "x": "いまのイギリス海峡も、この時期は陸です。"}, {"t": 464.18333333 33, "x": "研究チームが、この記録を、考古学に使いました。"}, {"t": 587.9333333333333, "x": "2003年から2007年にかけて、"}, {"t": 590.6166666666667, "x": "およそ二万三千平方キロメートルの範囲で、"}, {"t": 591.3666666666667, "x": "二万三千平方キロメートル█"}, {"t": 594.25, "x": "埋もれた地形が描き出されています。"}, {"t": 597.2, "x": "現れたのは、川の跡、湖の跡、入り江の跡、丘と谷でした。"}, {"t": 603.0166666666667, "x": "何本もの川が、海底の下で、"}, {"t": 605.6666666666666, "x": "大きく曲がりながら続いていました。"}, {"t": 608.1, "x": "その後、欧州研究会議の資金による、"}, {"t": 611.1, "x": "大きな研究計画が始まります。"}, {"t": 613.6833333333333, "x": "期間は、2015年から2021年までです。"}, {"t": 617.5166666666667, "x": "研究費は、およそ二百五十万ユーロです。"}, {"t": 620.7833333333333, "x": "この計画では、地図にできた範囲が、"}, {"t": 623.4333333333333, "x": "およそ十八万五千平方キロメートルに"}, {"t": 626.35, "x": "広がったと報告されています。"}, {"t": 628.2, "x": "沈んだ昔の地形としては、世界で"}, {"t": 630.9833333333333, "x": "もっとも広く描かれた地図だとされています。"}, {"t": 633.6333333333333, "x": "計画では、地図を頼りに、埋もれた川の"}, {"t": 636.95, "x": "谷を狙って、海底に筒を打ち込みました。"}, {"t": 640.05, "x": "引き抜いた土の柱は、六十か所から七十八本です。"}, {"t": 644.1833333333333, "x": "その中には、陸だった時代の土と、海が来た"}, {"t": 647.6666666666666, "x": "あとの土が、順番に重なっていました。"}, {"t": 650.3833333333333, "x": "土に残った生き物のかけらや遺伝子の断片から、"}, {"t": 653.4833333333333, "x": "そこがどんな土地だったかも調べられています。"}, {"t": 656.3666666666667, "x": "遺伝子の断片を取り出せたのは、"}, {"t": 658.35, "x": "四十本の柱、三十三か所に及びます。"}, {"t": 662.0166666666667, "x": "海の底の土から、陸だった時代の"}, {"t": 664.5, "x": "景色を読み取るという試みです。"}, {"t": 666.5, "x": "地図から見えてくる姿を、順に見ていきます。"}, {"t": 669.7333333333333, "x": "およそ一万年前、この大地は、いまの"}, {"t": 673.0, "x": "イングランド北東部のヨークシャーから、"}, {"t": 675.1333333333333, "x": "デンマークまで続いていたと考えられています。"}, {"t": 678.1, "x": "北の端には、いまのドッガーバンクに"}, {"t": 680.65, "x": "あたる、なだらかな丘の地帯がありました。"}, {"t": 683.45, "x": "研究者は、ここをドッガー丘陵と呼んでいます。"}, {"t": 686.85, "x": "その南には、低く平らな土地が広がっていました。"}, {"t": 690.2666666666667, "x": "北海の中ほどには、アウター・シルバー・ピットと"}, {"t": 693.35, "x": "呼ばれる、東西にのびる大きなくぼみがあります。"}, {"t": 696.5666666666667, "x": "ドッガーランドの時代、ここは"}, {"t": 698.65, "x": "湖だったと考えられています。"}, {"t": 700.75, "x": "その湖へ、ドッガー丘陵の側から川が"}, {"t": 704.3, "x": "流れ込み、岸や河口の跡が残っています。"}, {"t": 707.5166666666667, "x": "湖があり、川があり、丘があり、"}, {"t": 710.6, "x": "そのあいだに湿地と森がありました。"}, {"t": 713.2333333333333, "x": "コリンダ号が引き揚げた泥炭も、"}, {"t": 715.2333333333333, "x": "こうした低地の森と湿地が残したものです。この大地は、"}, {"t": 718.9833333333333, "x": "氷の縁の荒れ地のままだったわけではありません。"}, {"t": 722.3, "x": "氷が引いたあとには、草原が"}, {"t": 724.6, "x": "広がり、やがて森が育ちました。"}, {"t": 727.1, "x": "川と湖と海岸が入り組んだ土地は、食べ物の"}, {"t": 730.6166666666667, "x": "多い、豊かな場所だったと考えられています。"}, {"t": 733.6166666666667, "x": "この時代、北西ヨーロッパには、"}, {"t": 735.9166666666666, "x": "狩りと漁と採集で暮らす人々がいました。"}, {"t": 738.85, "x": "中石器時代と呼ばれる時代の人々です。"}, {"t": 741.55, "x": "北海の底から上がる道具は、その人々が、"}, {"t": 744.7166666666667, "x": "この大地を行き来していたことを示しています。"}, {"t": 747.6666666666666, "x": "2019年には、ノーフォークの沖、"}, {"t": 750.3666666666667, "x": "およそ四十キロメートルの海底から、石を"}, {"t": 753.7, "x": "打ち欠くための石が引き揚げられました。"}, {"t": 755.8333333333334, "x": "水深は、三十二メートルです。"}, {"t": 758.4666666666667, "x": "この時期の研究計画は、深い海の底で、"}, {"t": 761.6666666666666, "x": "狙いを定めて直接探し当てた先史時代の"}, {"t": 764.8, "x": "道具を、世界で初めて得たと報告しています。"}, {"t": 768.0166666666667, "x": "網にたまたま掛かるのを待つのではなく、"}, {"t": 770.25, "x": "地図を頼りに、ここにあるはずだと"}, {"t": 772.8166666666667, "x": "探しに行く段階に入ったということです。"}, {"t": 775.2833333333333, "x": "氷床がとけると、水は海に戻ります。"}, {"t": 778.2666666666667, "x": "戻った分だけ、海面が上がります。"}, {"t": 781.1333333333333, "x": "ここまでは単純な話です。問題は、どのくらいの"}, {"t": 784.65, "x": "速さで上がったのか、という点です。"}, {"t": 787.3666666666667, "x": "それを測る手がかりが、北海の底にあります。"}, {"t": 790.6666666666666, "x": "泥炭です。泥炭は、水はけの悪い、湿った陸地にできます。"}, {"t": 795.9166666666666, "x": "海の中ではできません。そして海面が"}, {"t": 798.5833333333334, "x": "上がってくると、泥炭の層の"}, {"t": 800.6333333333333, "x": "上には、海が運んだ泥や砂が重なります。"}, {"t": 803.8833333333333, "x": "つまり、泥炭の層のいちばん上は、"}, {"t": 806.6666666666666, "x": "そこに海が届いた時点の記録です。"}, {"t": 809.2, "x": "その泥炭が、いま何メートルの深さにあるかを測ります。"}, {"t": 813.2166666666667, "x": "そして泥炭の年代を測れば、"}, {"t": 815.3166666666667, "x": "その時点の海面の高さが分かります。"}, {"t": 818.1, "x": "2025年に発表された研究は、この方法で、"}, {"t": 822.1, "x": "北海の海面の変化を描き直しました。"}, {"t": 824.9666666666667, "x": "使ったのは、北海の底を掘った試料から"}, {"t": 828.1666666666666, "x": "新しく得た、八十八点の記録です。"}, {"t": 829.5, "x": "八十八点█"}, {"t": 831.3833333333333, "x": "年代は、一万三千七百年前から、"}, {"t": 834.6333333333333, "x": "六千二百年前までにわたります。"}, {"t": 837.1833333333333, "x": "これに、1960年代から2000年ごろまでに"}, {"t": 840.9333333333333, "x": "集められた、古い記録を加えています。"}, {"t": 843.7333333333333, "x": "合わせて、百三十九点の記録になります。"}, {"t": 847.0333333333333, "x": "こうした研究では、年代を測るのに、泥炭の"}, {"t": 850.6833333333333, "x": "中に残った、陸の植物のかけらを使います。"}, {"t": 854.0166666666667, "x": "海から流れ着いたものではなく、その場に生えていた植物を"}, {"t": 857.9833333333333, "x": "選ぶことで、海が来る前の時刻を押さえます。"}, {"t": 861.1833333333333, "x": "結果を見ていきます。いまから"}, {"t": 863.6666666666666, "x": "一万一千年前、北海での海面は、いまより"}, {"t": 867.0333333333333, "x": "およそ五十メートル低いところにありました。"}, {"t": 869.55, "x": "それが、その後の三千年で、いまより"}, {"t": 872.7666666666667, "x": "十五メートルほど低いところまで上がっています。"}, {"t": 875.4833333333333, "x": "三千年で、およそ三十五メートルです。"}, {"t": 878.6833333333333, "x": "平均すれば、百年でおよそ一メートル余りです。"}, {"t": 882.35, "x": "ただし、上がり方は一定ではありませんでした。"}, {"t": 885.75, "x": "この研究は、上昇が速まった"}, {"t": 888.2833333333333, "x": "時期が、二回あったとしています。"}, {"t": 890.4833333333333, "x": "一回目は、およそ一万三百年前。"}, {"t": 893.6333333333333, "x": "二回目は、およそ八千三百年前です。"}, {"t": 896.85, "x": "ピークのときの世界の海面の上昇は、一年あたり"}, {"t": 900.4166666666666, "x": "八ミリから九ミリと見積もられています。"}, {"t": 902.7833333333333, "x": "その水を送り込んだのは、主に、北アメリカの"}, {"t": 906.35, "x": "氷床と、南極の氷床だったとされています。"}, {"t": 909.6, "x": "一万一千年前から三千年前までのあいだに、"}, {"t": 912.9166666666666, "x": "世界の平均海面は、合わせて"}, {"t": 915.7, "x": "およそ三十八メートル上がったという計算です。"}, {"t": 918.6666666666666, "x": "それまでの見積もりは、三十二メートルから"}, {"t": 921.5166666666667, "x": "五十五メートルまでと、大きく割れていました。"}, {"t": 924.5166666666667, "x": "北海の泥炭が、その幅を狭めたことになります。"}, {"t": 928.0833333333334, "x": "一年に八ミリという速さは、人の目には見えません。"}, {"t": 931.8, "x": "一日に直せば、髪の毛の太さにも届きません。"}, {"t": 935.3333333333334, "x": "それでも、一人の人間が生まれてから年を"}, {"t": 938.2666666666667, "x": "取るまでのあいだに、海面は数十センチ上がります。"}, {"t": 941.8666666666667, "x": "そして、この速さが、何千年も途切れずに続きました。"}, {"t": 946.116 function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;

function mark(pane,i){

}

  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
