": 618}, {"t": 1805.6, "i": 619}, {"t": 1807.6666666666667, "i": 620}, {"t": 1810.7333333333333, "i": 621}, {"t": 1813.5833333333333, "i": 622}, {"t": 1815.7833333333333, "i": 623}, {"t": 1819.1666666666667, "i": 624}, {"t": 1824.1833333333334, "i": 625}, {"t": 1827.5666666666666, "i": 626}, {"t": 1830.15, "i": 627}, {"t": 1832.4666666666667, "i": 628}, {"t": 1834.9833333333333, "i": 629}, {"t": 1836.8, "i": 630}, {"t": 1840.2666666666667, "i": 631}, {"t": 1843.5833333333333, "i": 632}, {"t": 1846.8666666666666, "i": 633}, {"t": 1849.6, "i": 634}, {"t": 1853.1166666666666, "i": 635}, {"t": 1857.0833333333333, "i": 636}, {"t": 1860.0833333333333, "i": 637}, {"t": 1863.6333333333334, "i": 638}, {"t": 1866.55, "i": 639}, {"t": 1870.4666666666667, "i": 640}, {"t": 1873.5, "i": 641}, {"t": 1875.9666666666667, "i": 642}, {"t": 1877.9833333333333, "i": 643}, {"t": 1882.4666666666667, "i": 644}, {"t": 1885.7833333333333, "i": 645}, {"t": 1887.8666666666666, "i": 646}, {"t": 1890.65, "i": 647}, {"t": 1894.7666666666667, "i": 648}, {"t": 1898.2833333333333, "i": 649}, {"t": 1902.35, "i": 650}, {"t": 1905.75, "i": 651}, {"t": 1909.4166666666667, "i": 652}, {"t": 1912.95, "i": 653}, {"t": 1916.6333333333334, "i": 654}, {"t": 1919.0666666666666, "i": 655}, {"t": 1922.8166666666666, "i": 656}, {"t": 1926.6833333333334, "i": 657}, {"t": 1929.65, "i": 657}], "subs": [{"t": 0.0, "x": "1931年の9月、北海で一隻の漁船が網を上げました。"}, {"t": 5.166666666666667, "x": "イングランド東部、ノーフォークの沖合です。"}, {"t": 8.233333333333333, "x": "網の中に、魚に混じって、黒っぽい土の"}, {"t": 11.666666666666666, "x": "塊が入っていました。泥炭です。"}, {"t": 14.2, "x": "湿った土地に植物が積もり、"}, {"t": 16.1, "x": "腐りきらずに残った土のことです。"}, {"t": 18.683333333333334, "x": "船の上では、それをシャベルで"}, {"t": 20.8, "x": "割って、海に捨てようとしました。"}, {"t": 23.233333333333334, "x": "シャベルが、何か硬いものに当たりました。"}, {"t": 26.1, "x": "中から出てきたのは、鹿の角を"}, {"t": 28.383333333333333, "x": "削って作った、銛の先でした。"}, {"t": 30.9, "x": "かえしの付いた、人の手による道具です。"}, {"t": 33.75, "x": "網が上がってきた場所の水深は、"}, {"t": 35.9, "x": "三十メートルを超えていました。"}, {"t": 38.11666666666667, "x": "人は、水深三十メートルの海の"}, {"t": 40.766666666666666, "x": "底で、狩りの道具を作りません。"}, {"t": 43.18333333333333, "x": "つまり、この道具が作られたとき、"}, {"t": 45.65, "x": "そこは海ではなかったことになります。"}, {"t": 48.1, "x": "のちに、この銛の先は年代が測られています。"}, {"t": 51.46666666666667, "x": "結果は、いまから一万三千年以上前でした。"}, {"t": 55.1, "x": "銛の先は、泥炭に包まれていました。"}, {"t": 58.016666666666666, "x": "泥炭は、湿った陸の上でしかできない土です。"}, {"t": 61.56666666666667, "x": "この道具は、水の底ではなく、湿った陸地の"}, {"t": 65.28333333333333, "x": "上に残されていたことになります。"}, {"t": 67.18333333333334, "x": "北海█"}, {"t": 67.18333333333334, "x": "北海の南部には、かつて広い陸地がありました。"}, {"t": 71.16666666666667, "x": "イギリスとヨーロッパ大陸は、"}, {"t": 72.9, "x": "歩いて行き来できる一つの大地でした。"}, {"t": 75.6, "x": "その大地は、ある日突然消えたのではありません。"}, {"t": 79.05, "x": "氷がとけ、海が少しずつ上がり、数千年をかけて、"}, {"t": 83.35, "x": "岸が、内側へ内側へと寄ってきました。"}, {"t": 86.78333333333333, "x": "丘は島になり、島は砂の浅瀬になり、"}, {"t": 89.75, "x": "最後は海の底になりました。"}, {"t": 92.01666666666667, "x": "いまこの場所は、ドッガーランドと呼ばれています。"}, {"t": 93.25, "x": "ドッガーランド█"}, {"t": 95.71666666666667, "x": "国ひとつぶんの大地が、ゆっくりと"}, {"t": 98.25, "x": "海に沈んでいった記録です。"}, {"t": 100.01666666666667, "x": "主語は、氷と海と、平らな大地です。"}, {"t": 103.5, "x": "海の底に陸があった、という考え自体は、"}, {"t": 106.8, "x": "1931年より前からありました。"}, {"t": 109.96666666666667, "x": "イギリスの海岸には、潮が大きく引いたときにだけ、"}, {"t": 113.51666666666667, "x": "木の切り株が現れる場所があります。"}, {"t": 116.03333333333333, "x": "根を張ったまま、海の中に立っている切り株です。"}, {"t": 119.48333333333333, "x": "木は、海の中では育ちません。"}, {"t": 122.08333333333333, "x": "そこがかつて森だった、ということになります。"}, {"t": 125.21666666666667, "x": "こうした場所は、沈んだ森と呼ばれてきました。"}, {"t": 128.31666666666666, "x": "1913年、クレメント・リードという"}, {"t": 129.45, "x": "クレメント・リード█"}, {"t": 131.7, "x": "研究者が、一冊の本を出しました。"}, {"t": 134.73333333333332, "x": "リードは、イギリスの地質調査所に、"}, {"t": 137.36666666666667, "x": "四十年近く勤めた人物です。"}, {"t": 139.95, "x": "植物の種や実の化石から、昔の"}, {"t": 142.65, "x": "気候を読み解く専門家でした。"}, {"t": 144.55, "x": "本の題名は、そのまま『沈んだ森』です。"}, {"t": 148.91666666666666, "x": "リードは、ドッガーバンクから"}, {"t": 150.96666666666667, "x": "引き揚げられた植物の化石も調べています。"}, {"t": 153.66666666666666, "x": "そして本の中で、一枚の地図を描きました。"}, {"t": 157.08333333333334, "x": "イングランドの東と、ヨーロッパ大陸とが、"}, {"t": 160.11666666666667, "x": "陸でつながっている地図です。"}, {"t": 162.03333333333333, "x": "いまの北海の南半分が、そっくり陸として"}, {"t": 165.28333333333333, "x": "描かれていました。この地図は、"}, {"t": 167.46666666666667, "x": "のちの研究で分かった姿に、"}, {"t": 169.35, "x": "驚くほど近かったと評価されています。"}, {"t": 172.15, "x": "リードが亡くなったのは、1916年です。"}, {"t": 175.63333333333333, "x": "コリンダ号の網に銛の先が掛かる、十五年前のことでした。"}, {"t": 179.83333333333334, "x": "ただ、当時はまだ、人がそこにいたという"}, {"t": 182.93333333333334, "x": "物証がありませんでした。そこへ、"}, {"t": 185.4, "x": "1931年█"}, {"t": 186.01666666666668, "x": "1931年の銛の先が上がってきます。"}, {"t": 189.5, "x": "網を引いていたのは、コリンダ号という漁船でした。"}, {"t": 192.95, "x": "場所は、リーマン・アンド・オー"}, {"t": 194.8, "x": "ワー・バンクと呼ばれる浅瀬のあたりです。"}, {"t": 197.05, "x": "ノーフォークの東、およそ四十キロメートルの"}, {"t": 200.26666666666668, "x": "沖とされています。水深は、"}, {"t": 202.31666666666666, "x": "三十数メートルと記録されています。"}, {"t": 204.98333333333332, "x": "同じ船は、その後も同じ海域から、"}, {"t": 207.78333333333333, "x": "泥炭の塊を引き揚げました。"}, {"t": 210.06666666666666, "x": "その泥炭の花粉を調べると、何種類もの"}, {"t": 213.2, "x": "木が混じった森の花粉が出てきました。"}, {"t": 215.41666666666666, "x": "銛が沈んでいた場所は、森のそばだったことになります。"}, {"t": 219.05, "x": "海の底から上がった泥炭が、そこに木の生える"}, {"t": 222.21666666666667, "x": "陸があったことを、花粉で語ったわけです。"}, {"t": 225.11666666666667, "x": "銛の先そのものは、1988年に、"}, {"t": 228.56666666666666, "x": "放射性炭素で年代が測られました。"}, {"t": 231.28333333333333, "x": "結果は、およそ一万三千九百年前から、"}, {"t": 234.83333333333334, "x": "一万三千二百年前のあいだです。"}, {"t": 237.7, "x": "いまは、イングランドのノリッジ城"}, {"t": 240.05, "x": "博物館に収められています。"}, {"t": 241.96666666666667, "x": "証拠は、その後も別の形で上がり続けました。"}, {"t": 245.45, "x": "オランダでは、海岸を守るために、沖合の海底から"}, {"t": 249.45, "x": "砂を大量に吸い上げて、浜に盛っています。"}, {"t": 252.51666666666668, "x": "港を広げる埋め立て工事にも、"}, {"t": 254.55, "x": "同じように海の砂が使われてきました。"}, {"t": 257.25, "x": "その砂の中から、骨や角で作られた道具が"}, {"t": 260.5, "x": "見つかるようになりました。"}, {"t": 261.9, "x": "南ホラント州の浜辺などで集められた、骨や"}, {"t": 265.2, "x": "角の尖った道具は、千点を超えています。"}, {"t": 268.26666666666665, "x": "多くは、浜を歩く人たちが拾い集め、"}, {"t": 271.23333333333335, "x": "個人で持っているものです。"}, {"t": 273.1666666666667, "x": "中には、海岸から二十キロメートルほど"}, {"t": 276.1166666666667, "x": "内陸で見つかったものもあります。"}, {"t": 278.01666666666665, "x": "海の砂が、工事で内陸まで運ばれていたためです。"}, {"t": 281.7, "x": "年代を測ったものの中には、一万三千年前ごろのものや、"}, {"t": 286.1, "x": "一万五百年前ごろのものがあります。"}, {"t": 288.95, "x": "北海の底の砂には、陸だった時代の暮らしの"}, {"t": 292.1, "x": "跡が、まとめて混じっているということです。"}, {"t": 294.8333333333333, "x": "こうした証拠が積み上がり、1990年代に、"}, {"t": 298.6666666666667, "x": "この陸地に名前が付きました。"}, {"t": 300.76666666666665, "x": "イギリスの考古学者ブライオニー・コールズが、"}, {"t": 303.6, "x": "この失われた大地を、ドッガーランドと呼んだのです。"}, {"t": 305.5833333333333, "x": "ドッガーランド█"}, {"t": 307.85, "x": "由来は、北海の真ん中にある、"}, {"t": 310.1666666666667, "x": "ドッガーバンクという浅瀬です。"}, {"t": 312.48333333333335, "x": "ドッガーバンクという名前は、この海で"}, {"t": 315.1166666666667, "x": "魚を獲っていた、ドッガーと呼ばれる二本"}, {"t": 318.03333333333336, "x": "マストの漁船から来たと考えられています。"}, {"t": 320.5833333333333, "x": "漁船の名前が浅瀬の名前になり、浅瀬の"}, {"t": 323.73333333333335, "x": "名前が、沈んだ大地の名前になりました。"}, {"t": 326.6666666666667, "x": "なぜ、北海の底が陸だったのか。"}, {"t": 329.4, "x": "答えは、海の水がどこにあったかにあります。"}, {"t": 332.65, "x": "いまからおよそ二万年あまり前、地球は、"}, {"t": 335.71666666666664, "x": "最終氷期のもっとも寒い時期にありました。"}, {"t": 338.71666666666664, "x": "北アメリカの北半分と、北ヨーロッパは、"}, {"t": 341.75, "x": "厚い氷に覆われていました。"}, {"t": 343.95, "x": "氷床と呼ばれる、大陸規模の氷のかたまりです。"}, {"t": 347.5833333333333, "x": "この氷は、もとをたどれば海の水です。"}, {"t": 350.45, "x": "海から蒸発した水が、雪として陸に降り、"}, {"t": 353.6, "x": "とけないまま積み重なっていきました。"}, {"t": 356.1, "x": "陸に積もった分だけ、海の水は減ります。"}, {"t": 359.3833333333333, "x": "この時期、世界の海面は、いまより"}, {"t": 362.21666666666664, "x": "およそ120メートル█"}, {"t": 362.8333333333333, "x": "およそ120メートル低かったとされています。"}, {"t": 366.1166666666667, "x": "百二十メートルは、高いビルの"}, {"t": 368.48333333333335, "x": "三十階から四十階ほどに当たる高さです。"}, {"t": 371.4166666666667, "x": "それだけの厚さの水が、世界中の海から、"}, {"t": 374.6333333333333, "x": "陸の氷へ移っていたということです。"}, {"t": 377.18333333333334, "x": "では、いまの北海は、どのくらいの深さなのか。"}, {"t": 380.8666666666667, "x": "北海の面積は、およそ五十七万平方キロメートル。"}, {"t": 384.9166666666667, "x": "平均の深さは、およそ九十五メートルです。"}, {"t": 388.21666666666664, "x": "いちばん深いのはノルウェー沿岸の溝で、"}, {"t": 390.73333333333335, "x": "七百メートルほどあります。"}, {"t": 392.81666666666666, "x": "ただし南の半分は浅く、多くの場所が数十メートルです。"}, {"t": 397.1, "x": "平均の深さが九十五メートルの海で、海面が"}, {"t": 400.7, "x": "百二十メートル下がれば、どうなるか。"}, {"t": 403.4, "x": "北海の大部分が、底を見せることになります。"}, {"t": 406.68333333333334, "x": "実際、氷床がもっとも広がった時期には、北海は"}, {"t": 410.6666666666667, "x": "ほとんど干上がっていたと考えられています。"}, {"t": 413.1333333333333, "x": "しかも、それは一度きりのことではありません。"}, {"t": 416.2, "x": "氷床が大きく広がる時期が来るたびに、北海は、"}, {"t": 419.71666666666664, "x": "ほとんど干上がってきたとされています。"}, {"t": 422.05, "x": "ドッガーランドは、その繰り返しの、最後の一回の姿です。"}, {"t": 426.6, "x": "ただし、そのすべてが、歩ける"}, {"t": 429.31666666666666, "x": "土地だったわけではありません。"}, {"t": 430.95, "x": "もっとも寒い時期には、北海の北の側と、イギリスの"}, {"t": 434.93333333333334, "x": "多くが、氷に覆われていたとされています。"}, {"t": 437.95, "x": "いまのドッガーバンクも、この氷が作った地形です。"}, {"t": 441.55, "x": "氷の前にできた湖に土砂がたまり、"}, {"t": 443.95, "x": "それを氷が押し曲げて、盛り上げました。"}, {"t": 447.26666666666665, "x": "その盛り上がりは、およそ三万千六百年前から、"}, {"t": 450.9166666666667, "x": "二万三千百年前にかけてできたとされています。"}, {"t": 454.25, "x": "のちのドッガーランドで、いちばん高い"}, {"t": 456.85, "x": "丘になった場所です。南の側には、別の地形がありました。"}, {"t": 461.1, "x": "いまのイギリス海峡も、この時期は陸です。"}, {"t": 464.18333333333334, "x": "そこを、巨大な川が西へ流れていました。"}, {"t": 467.35, "x": "ライン川、テムズ川、セーヌ川、マース川、スヘルデ川。"}, {"t": 472.51666666666665, "x": "いまはそれぞれ別の海に注いでいる川が、"}, {"t": 475.15, "x": "合わさって一本になり、大西洋の"}, {"t": 478.0, "x": "ビスケー湾まで流れていたと考えられています。"}, {"t": 480.8, "x": "研究者はこれを、英語でチャネル・"}, {"t": 483.21666666666664, "x": "リバー、海峡の川と呼んでいます。"}, {"t": 485.81666666666666, "x": "いまのヨーロッパの、どの川よりも"}, {"t": 488.0833333333333, "x": "大きな川だったとされています。"}, {"t": 489.93333333333334, "x": "ロンドンを流れるテムズ川と、ドイツや"}, {"t": 492.53333333333336, "x": "オランダを流れるライン川が、同じ一本の"}, {"t": 495.3833333333333, "x": "川に注いでいた時代があるということです。"}, {"t": 497.9166666666667, "x": "地図の上で国と国を分けている海は、"}, {"t": 500.3, "x": "この時代には存在していませんでした。"}, {"t": 502.9166666666667, "x": "そして、およそ二万年前を過ぎると、氷は縮みはじめます。"}, {"t": 507.6, "x": "氷期が終わり、いまの温かい時代、完新世が"}, {"t": 511.3833333333333, "x": "始まったとされるのは、およそ一万一千七百年前です。"}, {"t": 515.5, "x": "ただ、氷は、時代の区切りと"}, {"t": 518.1166666666667, "x": "同時に消えたわけではありません。"}, {"t": 520.0, "x": "大陸を覆うほどの氷は、とけきるまでに、"}, {"t": 523.0166666666667, "x": "そこから何千年もかかりました。"}, {"t": 525.3833333333333, "x": "そのあいだ、海は上がり続けます。"}, {"t": 528.1166666666667, "x": "とけた水は、川を通って海へ戻ります。"}, {"t": 531.2, "x": "海峡の川が流れていた谷も、やがて海に沈みました。"}, {"t": 535.15, "x": "いまのイギリス海峡は、その川の"}, {"t": 537.5833333333334, "x": "谷を、海が満たしたものです。"}, {"t": 539.8166666666667, "x": "ここから、海が戻ってくる長い時間が始まります。"}, {"t": 543.4333333333333, "x": "沈んだ大地の形は、どうやって分かるのでしょうか。"}, {"t": 547.0666666666667, "x": "海の底は、ただ平らな砂地に見えます。"}, {"t": 550.0333333333333, "x": "陸だったころの谷や丘は、その後に"}, {"t": 552.5666666666667, "x": "積もった砂や泥の下に埋まっています。"}, {"t": 554.9, "x": "潜って見ても、分かりません。"}, {"t": 557.1, "x": "手がかりになったのは、まったく別の"}, {"t": 559.5, "x": "目的で集められたデータでした。"}, {"t": 561.4666666666667, "x": "北海は、石油と天然ガスの海です。"}, {"t": 564.5, "x": "資源を探す会社は、海底の下に音を送り込み、"}, {"t": 568.25, "x": "はね返ってくる音から、地層の形を読み取ってきました。"}, {"t": 572.35, "x": "地震探査と呼ばれる方法です。"}, {"t": 574.6, "x": "その記録には、資源の層だけでなく、"}, {"t": 577.3, "x": "浅いところに埋まった昔の地面も写っていました。"}, {"t": 580.7333333333333, "x": "イギリスのバーミンガム大学で、ヴィンス・ギャフニーらの"}, {"t": 584.0333333333333, "x": "研究チームが、この記録を、考古学に使いました。"}, {"t": 587.9333333333333, "x": "2003年から2007年にかけて、"}, {"t": 590.6166666666667, "x": "およそ二万三千平方キロメートルの範囲で、"}, {"t": 591.3666666666667, "x": "二万三千平方キロメートル█"}, {"t": 594.25, "x": "埋もれた地形が描き出されています。"}, {"t": 597.2, "x": "現れたのは、川の跡、湖の跡、入り江の跡、丘と谷でした。"}, {"t": 603.0166666666667, "x": "何本もの川が、海底の下で、"}, {"t": 605.6666666666666, "x": "大きく曲がりながら続いていました。"}, {"t": 608.1, "x": "その後、欧州研究会議の資金による、"}, {"t": 611.1, "x": "大きな研究計画が始まります。"}, {"t": 613.6833333333333, "x": "期間は、2015年から2021年までです。"}, {"t": 617.5166666666667, "x": "研究費は、およそ二百五十万ユーロです。"}, {"t": 620.7833333333333, "x": "この計画では、地図にできた範囲が、"}, {"t": 623.4333333333333, "x": "およそ十八万五千平方キロメートルに"}, {"t": 626.35, "x": "広がったと報告されています。"}, .6, "x": "地図を描く材料になってきました。"}, {"t": 1807.6666666666667, "x": "海の底を使おうとするたびに、その下にある"}, {"t": 1810.7333333333333, "x": "陸の記録が、少しずつ読まれていきます。"}, {"t": 1813.5833333333333, "x": "石油とガスを探すための記録が、"}, {"t": 1815.7833333333333, "x": "最初の地図を描かせたのと、同じ構図です。"}, {"t": 1819.1666666666667, "x": "次に、砂です。オランダでは、海岸を守るために、沖合の"}, {"t": 1824.1833333333334, "x": "海底から砂を吸い上げ、浜に盛り続けています。"}, {"t": 1827.5666666666666, "x": "港を海側へ広げる埋め立て工事でも、"}, {"t": 1830.15, "x": "北海の砂が使われてきました。"}, {"t": 1832.4666666666667, "x": "その砂の中から、先ほどの骨や"}, {"t": 1834.9833333333333, "x": "角の道具が見つかっています。"}, {"t": 1836.8, "x": "沈んだ大地の表面にあった砂が、いまは浜を"}, {"t": 1840.2666666666667, "x": "守る砂として、陸に戻ってきているということです。"}, {"t": 1843.5833333333333, "x": "そして、泥炭です。北海の底の泥炭は、"}, {"t": 1846.8666666666666, "x": "陸だった時代の植物の記録です。"}, {"t": 1849.6, "x": "同時に、海面の高さを測る目盛りでもあります。"}, {"t": 1853.1166666666666, "x": "2025年の研究が、世界の海面の上がり方を"}, {"t": 1857.0833333333333, "x": "描き直すのに使ったのも、この泥炭でした。"}, {"t": 1860.0833333333333, "x": "ドッガーランドは、沈んだあとも、地球の海が"}, {"t": 1863.6333333333334, "x": "どう動いたかを測る物差しとして使われています。"}, {"t": 1866.55, "x": "八十八点の泥炭は、それぞれが、ある年に、"}, {"t": 1870.4666666666667, "x": "ある場所へ海が届いたことを記録しています。"}, {"t": 1873.5, "x": "最後に、海そのものです。イギリスと"}, {"t": 1875.9666666666667, "x": "ヨーロッパ大陸のあいだには、"}, {"t": 1877.9833333333333, "x": "いま海があります。その海の底には、テムズ川とライン川が"}, {"t": 1882.4666666666667, "x": "合わさって流れていた、谷の跡が沈んでいます。"}, {"t": 1885.7833333333333, "x": "イギリスが島であるという事実は、"}, {"t": 1887.8666666666666, "x": "その後の長い歴史の前提になりました。"}, {"t": 1890.65, "x": "しかし、その海は、はじめからあったものではありません。"}, {"t": 1894.7666666666667, "x": "氷がとけ、海面が一年に数ミリずつ上がり、"}, {"t": 1898.2833333333333, "x": "平らな大地の上を、横から進んできた結果です。"}, {"t": 1902.35, "x": "数千年をかけて、一つの大地が、島の"}, {"t": 1905.75, "x": "群れになり、浅瀬になり、海の底になりました。"}, {"t": 1909.4166666666667, "x": "1931年にコリンダ号の網に掛かった銛の"}, {"t": 1912.95, "x": "先は、いま、ノリッジの博物館にあります。"}, {"t": 1916.6333333333334, "x": "それを作った人々が歩いた地面は、"}, {"t": 1919.0666666666666, "x": "いま、水深三十数メートルの下にあります。"}, {"t": 1922.8166666666666, "x": "北海の底には、国ひとつぶんの大地が、泥炭と"}, {"t": 1926.6833 const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
const src=i=>'f/'+String(i).padStart(4,'0')+'.jpg';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　カット'+D.n_cuts+'　字幕'+D.subs.length+'</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function seg(t){let lo=0,hi=D.segs.length-1,r=0;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.segs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-1;
function preload(i){for(let k=1;k<=4;k++){const s=D.segs[i+k]; if(s)new Image().src=src(s.i)}}
function paint(t){
  const i=seg(t);
  if(i!==cur){cur=i; v.src=src(D.segs[i].i);
    bdg.textContent='カット '+(i+1)+' / '+D.segs.length;
    mark('cuts',i); preload(i); }
  mark('subs',subIdx(t));
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b>'+fmt(s.t)+'</b><span></span>';
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
D.segs.forEach(s=>{const f=document.createElement('figure');
  f.innerHTML='<img loading="lazy" src="'+src(s.i)+'"><em>'+fmt(s.t)+'</em>';
  f.onclick=()=>go(s.t); document.getElementById('cuts').appendChild(f)});
const mk=document.getElementById('mk');
D.segs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,D.dur-0.05); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>go(D.segs[Math.max(0,seg(a.currentTime)-1)].t);
document.getElementById('nx').onclick=()=>go(D.segs[Math.min(D.segs.length-1,seg(a.currentTime)+1)].t);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('subs').hidden=b.dataset.p!=='subs';
  document.getElementById('cuts').hidden=b.dataset.p!=='cuts'});
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
