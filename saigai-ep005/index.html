<script>
const D={"name": "ep005", "file": "ep005", "dur": 1973.45, "segs": [], "subs": [{"t": 0.0, "x": "いま、東京の東側に広がっている"}, {"t": 2.8, "x": "低い土地は、かつて海の底でした。"}, {"t": 5.316666666666666, "x": "いまからおよそ6000年前のことです。"}, {"t": 7.733333333333333, "x": "その海は、東京湾から北へまっすぐ伸びていました。"}, {"t": 11.366666666666667, "x": "いまの埼玉県を縦に抜け、群馬県と"}, {"t": 13.55, "x": "群馬県█"}, {"t": 14.6, "x": "茨城県の境目の近くまで届いていました。"}, {"t": 17.716666666666665, "x": "海岸線は、いまの東京湾の岸から、"}, {"t": 20.783333333333335, "x": "五十キロメートル以上も内陸にありました。"}, {"t": 23.716666666666665, "x": "同じころ、大阪では、生駒山の"}, {"t": 26.483333333333334, "x": "ふもと近くまで海が入りこんでいました。"}, {"t": 28.9, "x": "名古屋の周りでも、いまの平野の"}, {"t": 31.25, "x": "奥深くまで、海が広がっていました。"}, {"t": 33.983333333333334, "x": "その海面は、いまの海面よりも"}, {"t": 36.516666666666666, "x": "数メートル高かったと考えられています。"}, {"t": 39.0, "x": "ただ、どれだけ高かったのかは、"}, {"t": 41.18333333333333, "x": "場所によって答えが違います。"}, {"t": 43.36666666666667, "x": "そして、その海は、いつの間にか消えました。"}, {"t": 46.8, "x": "海が干上がったわけではありません。"}, {"t": 48.916666666666664, "x": "海が去ったあとに残ったのは、"}, {"t": 50.733333333333334, "x": "平らで、やわらかい土地でした。"}, {"t": 53.35, "x": "いま、日本の大きな都市の多くは、"}, {"t": 56.0, "x": "その土地の上に建っています。"}, {"t": 58.05, "x": "関東平野の低地も、濃尾平野も、大阪平野も同じです。"}, {"t": 62.733333333333334, "x": "つまり日本の平野の低い部分の多くは、"}, {"t": 65.43333333333334, "x": "この6000年ほどのあいだにできた、新しい地面です。"}, {"t": 69.46666666666667, "x": "地球の歴史の尺度でいえば、"}, {"t": 71.31666666666666, "x": "ついさっき、海から引き渡された土地です。"}, {"t": 74.73333333333333, "x": "この出来事は、日本では縄文海進と呼ばれています。"}, {"t": 76.98333333333333, "x": "縄文海進█"}, {"t": 79.63333333333334, "x": "海が、陸の上まで進んできた。"}, {"t": 82.18333333333334, "x": "そして、陸に押し返されていった。"}, {"t": 84.8, "x": "今回は、その記録を、海と大地の側からたどります。"}, {"t": 88.95, "x": "最初の手がかりは、貝殻でした。"}, {"t": 91.6, "x": "1877年█"}, {"t": 91.6, "x": "1877年、アメリカの動物学者エドワード・"}, {"t": 95.63333333333334, "x": "モースが、東京の大森で貝塚を見つけました。"}, {"t": 98.96666666666667, "x": "横浜から新橋へ向かう汽車の窓から、崖に"}, {"t": 102.31666666666666, "x": "積み重なった貝殻が見えたと伝えられています。"}, {"t": 105.2, "x": "貝塚とは、大昔に食べられた貝の殻が、"}, {"t": 108.4, "x": "長い時間をかけて積み重なった場所です。"}, {"t": 111.28333333333333, "x": "モースはそれを掘り、1879年に報告書をまとめています。"}, {"t": 116.21666666666667, "x": "この報告は、縄文時代の遺跡と、海が進んできたことを、"}, {"t": 120.9, "x": "初めて結びつけて論じたものとされています。"}, {"t": 123.85, "x": "大森の貝塚は、当時の海岸から、"}, {"t": 126.63333333333334, "x": "およそ三百メートル離れた場所にありました。"}, {"t": 129.66666666666666, "x": "三百メートルなら、まだ海の近くと言えます。"}, {"t": 133.01666666666668, "x": "しかし関東では、その後、もっと奇妙な"}, {"t": 136.25, "x": "場所から貝塚が見つかっていきます。"}, {"t": 138.4, "x": "海から何十キロメートルも離れた、内陸の台地の縁です。"}, {"t": 142.61666666666667, "x": "そこから、海の貝の殻が出てきました。"}, {"t": 145.55, "x": "貝は、自分で内陸まで歩いてはいきません。"}, {"t": 148.91666666666666, "x": "遠くの海から、わざわざ運んできたと"}, {"t": 151.55, "x": "考えるより、すぐ目の前に海があったと"}, {"t": 154.31666666666666, "x": "考えるほうが、無理がありません。"}, {"t": 156.63333333333333, "x": "この考えを、地図の形にした人がいます。"}, {"t": 159.73333333333332, "x": "1926年█"}, {"t": 159.73333333333332, "x": "1926年、地理学者の東木龍七が、関東低地の"}, {"t": 164.8, "x": "昔の海岸線についての論文を発表しました。"}, {"t": 168.01666666666668, "x": "東木は、土地の高さと、貝塚の分布を重ね合わせました。"}, {"t": 172.65, "x": "そこから、かつての海岸線を描き出しています。"}, {"t": 176.06666666666666, "x": "描かれた海は、いまの東京湾よりはるかに"}, {"t": 179.15, "x": "大きく、はるかに入り組んだものでした。"}, {"t": 181.68333333333334, "x": "この入り組んだ海は、現在、奥東京湾と呼ばれています。"}, {"t": 184.15, "x": "奥東京湾█"}, {"t": 186.63333333333333, "x": "ただし、貝塚は、海岸線そのものではありません。"}, {"t": 190.85, "x": "貝塚が示すのは、人がそこに貝殻を捨てたという事実です。"}, {"t": 195.06666666666666, "x": "海岸線の正確な位置を決めるには、別の証拠が要ります。"}, {"t": 199.21666666666667, "x": "その証拠は、地面の下にありました。"}, {"t": 202.05, "x": "平野の地下を掘ると、海の底でしかできない"}, {"t": 205.2, "x": "泥の層が出てきます。その泥の中には、珪藻と呼ばれる、"}, {"t": 209.23333333333332, "x": "ごく小さな藻の殻が残っています。"}, {"t": 211.86666666666667, "x": "珪藻は種類によって、海水を好むもの、真水を"}, {"t": 215.81666666666666, "x": "好むもの、その中間を好むものに分かれます。"}, {"t": 218.96666666666667, "x": "殻の顔ぶれを数えれば、その場所が"}, {"t": 221.61666666666667, "x": "海だったのか、川だったのかが分かります。"}, {"t": 224.46666666666667, "x": "1989年には、東京湾の周りの十三の地点で、"}, {"t": 229.16666666666666, "x": "この珪藻の化石を調べた研究が出ています。"}, {"t": 232.45, "x": "その研究によれば、海が最も奥まで入りこんだのは、"}, {"t": 236.46666666666667, "x": "6500年前から5300年前ごろです。"}, {"t": 240.01666666666668, "x": "そのとき、海岸線は、群馬県の館林や、"}, {"t": 244.0, "x": "茨城県の古河に近いあたりまで達していました。"}, {"t": 247.55, "x": "いまの東京湾の岸から、五十キロメートルを"}, {"t": 250.8, "x": "超える内陸です。珪藻は、貝塚の"}, {"t": 253.26666666666668, "x": "読み方にも、手がかりを与えました。"}, {"t": 256.05, "x": "埼玉県の荒川沿いでは、大宮台地の側と、"}, {"t": 259.81666666666666, "x": "武蔵野台地の側とで、貝塚の中身が違います。"}, {"t": 263.68333333333334, "x": "大宮台地の側の貝塚からは、ヤマトシジミや"}, {"t": 267.0, "x": "カキといった、海や河口の貝が多く出ます。"}, {"t": 270.2, "x": "武蔵野台地の側の貝塚は、主に真水の貝でできています。"}, {"t": 274.46666666666664, "x": "珪藻で調べると、理由が見えてきました。"}, {"t": 277.5833333333333, "x": "武蔵野台地の側には、入間川などが真水を"}, {"t": 280.8666666666667, "x": "運び込み、淡水の水域が広がっていました。"}, {"t": 284.06666666666666, "x": "同じ入り江でも、岸によって水の性質が違っていたのです。"}, {"t": 288.1666666666667, "x": "貝塚の中身の違いは、当時の"}, {"t": 290.55, "x": "水の違いを、そのまま映していました。"}, {"t": 293.21666666666664, "x": "貝殻の山は、人の暮らしの跡であると同時に、"}, {"t": 296.53333333333336, "x": "その時代の海の縁を記録した、目印でもありました。"}, {"t": 300.5833333333333, "x": "海が陸の奥まで入ってきた理由を知るには、"}, {"t": 303.3, "x": "その前の時代を見る必要があります。"}, {"t": 305.95, "x": "いまからおよそ二万年前、地球は"}, {"t": 308.65, "x": "最終氷期█"}, {"t": 309.06666666666666, "x": "最終氷期のいちばん寒い時期にありました。"}, {"t": 312.26666666666665, "x": "北アメリカやヨーロッパの北部は、"}, {"t": 314.28333333333336, "x": "厚い氷の板に覆われていました。氷床と呼ばれるものです。"}, {"t": 318.5833333333333, "x": "氷床の氷は、もとをたどれば海の水です。"}, {"t": 321.78333333333336, "x": "海から蒸発した水が、雪になって陸に降り、"}, {"t": 325.05, "x": "溶けずに積み重なっていきました。"}, {"t": 327.3333333333333, "x": "その分だけ、海の水は減ります。"}, {"t": 330.1666666666667, "x": "2014年に発表された研究は、"}, {"t": 332.75, "x": "このときの海面の低さを見積もっています。"}, {"t": 335.68333333333334, "x": "最も低いとき、世界の海面は、いまより"}, {"t": 339.2, "x": "百三十四メートル█"}, {"t": 339.78333333333336, "x": "百三十四メートルほど下にありました。"}, {"t": 342.71666666666664, "x": "氷期のいちばん寒い時期が始まるときには、"}, {"t": 345.3333333333333, "x": "二千年に満たない間に、海面がおよそ四十メートル"}, {"t": 349.3833333333333, "x": "下がったとも見積もられています。"}, {"t": 351.15, "x": "陸の上に余分に載っていた氷の量は、"}, {"t": 353.73333333333335, "x": "およそ五千二百万立方キロメートルです。"}, {"t": 356.73333333333335, "x": "海面が百メートル以上下がると、"}, {"t": 358.95, "x": "海岸線は大きく沖へ退きます。"}, {"t": 361.8, "x": "いまは海の底になっている浅い部分が、陸として現れます。"}, {"t": 365.8833333333333, "x": "日本の周りでも、同じことが起きていました。"}, {"t": 368.98333333333335, "x": "その証拠の一つは、大阪にあります。"}, {"t": 371.93333333333334, "x": "大阪駅の地下、およそ二十六メートルの深さから、"}, {"t": 375.53333333333336, "x": "クヌギの大木の化石が見つかっています。"}, {"t": 378.28333333333336, "x": "根を張ったままの状態でした。"}, {"t": 380.23333333333335, "x": "駅の基礎を補強する工事の最中に、"}, {"t": 382.7, "x": "掘り当てられたものです。この木の"}, {"t": 385.51666666666665, "x": "年代が測られ、およそ9360年前という"}, {"t": 388.85, "x": "値が出ました。つまり、いまから9000年あまり前、大阪の"}, {"t": 393.48333333333335, "x": "梅田のあたりは、いまの地面より二十六メートルほど"}, {"t": 396.85, "x": "低いところにあり、クヌギの林に覆われていました。"}, {"t": 400.1666666666667, "x": "当時の海面は、いまより少なくとも"}, {"t": 402.76666666666665, "x": "二十数メートル以上低かったことになります。"}, {"t": 405.43333333333334, "x": "同じ大阪の地下、沖積層のいちばん下の"}, {"t": 408.4, "x": "ところどころからは、泥炭の層が見つかっています。"}, {"t": 411.78333333333336, "x": "年代は、およそ二万年前です。"}, {"t": 414.46666666666664, "x": "その中には、ミツガシワという、寒い気候を"}, {"t": 418.06666666666666, "x": "示す植物の遺体が含まれていました。"}, {"t": 420.45, "x": "この時代、大阪湾から紀伊水道にかけての"}, {"t": 423.6666666666667, "x": "一帯は、陸でした。そこには、"}, {"t": 426.05, "x": "古大阪川と名付けられた川が流れ、"}, {"t": 428.76666666666665, "x": "紀伊水道まで流路を延ばしていたとされています。"}, {"t": 431.95, "x": "いまの大阪湾の海底は、川の"}, {"t": 434.5, "x": "流れる平野だったということです。"}, {"t": 436.46666666666664, "x": "瀬戸内海にも、似た記録があります。"}, {"t": 439.2, "x": "岡山県の児島半島の近くの島々には、"}, {"t": 442.1666666666667, "x": "ヤマトシジミの殻でできた貝塚が残っています。"}, {"t": 445.4, "x": "ヤマトシジミは、海水と真水が混じる汽水にすむ貝です。"}, {"t": 449.5, "x": "その一つの年代は、およそ8400年前と測られています。"}, {"t": 454.1, "x": "島の周りの海底には、水深十五メートル前後の"}, {"t": 457.8, "x": "平らな面が広がっています。"}, {"t": 459.56666666666666, "x": "この面が、当時はシジミの採れる汽水の"}, {"t": 462.31666666666666, "x": "湿地だったと考える研究者がいました。"}, {"t": 464.8333333333333, "x": "そうだとすれば、8400年前の海面は、いまより"}, {"t": 469.1333333333333, "x": "十五メートル前後低かったことになります。"}, {"t": 471.6, "x": "愛知県の知多半島でも、同じ時代の"}, {"t": 474.43333333333334, "x": "証拠が見つかっています。先苅貝塚という貝塚です。"}, {"t": 478.1166666666667, "x"  950.9166666666666, "x": "浮かんで釣り合っている状態のことです。"}, {"t": 953.1166666666667, "x": "上に重いものが載れば、板は沈みます。"}, {"t": 956.15, "x": "重いものが取り除かれれば、板は浮き上がります。"}, {"t": 959.5333333333333, "x": "氷床が溶けて海に水が戻ると、海の底には、"}, {"t": 963.1, "x": "新しく百メートル以上の水が載ることになります。"}, {"t": 966.4833333333333, "x": "その重みで、海の底はゆっくりと沈みます。"}, {"t": 969.9333333333333, "x": "海の底が沈むと、その下にある"}, {"t": 972.3666666666667, "x": "やわらかい層が、周りへ押しのけられます。"}, {"t": 975.2333333333333, "x": "押しのけられた分は、陸の下へ回りこみます。"}, {"t": 978.5166666666667, "x": "その結果、海の底が沈むのに対して、陸の"}, {"t": 982.2666666666667, "x": "縁は、わずかに持ち上がる方向へ動きます。"}, {"t": 985.35, "x": "陸が持ち上がれば、同じ海面でも、"}, {"t": 988.05, "x": "陸から見た海の高さは下がって見えます。"}, {"t": 990.8666666666667, "x": "この動きは、氷床が溶け終わった"}, {"t": 993.3166666666667, "x": "あとも、しばらく続きます。"}, {"t": 995.3333333333334, "x": "地球の内部は、すぐには釣り合いを取り戻さないからです。"}, {"t": 999.1166666666667, "x": "つまり、世界の海の水の量がほとんど"}, {"t": 1001.9, "x": "増えなくなってからも、日本の陸地のほうが、"}, {"t": 1004.8666666666667, "x": "少しずつ持ち上がり続けました。"}, {"t": 1007.1, "x": "その結果、陸から見た海面は、"}, {"t": 1009.65, "x": "6000年前ごろにいちばん高くなり、"}, {"t": 1012.2166666666667, "x": "そこから下がっていったように見えます。"}, {"t": 1014.7833333333333, "x": "ただし、同じ仕組みが、場所に"}, {"t": 1017.35, "x": "よっては陸を沈める方向にも働きます。"}, {"t": 1020.1, "x": "1994年には、この効果を"}, {"t": 1023.0333333333333, "x": "数字で確かめた研究が出ています。"}, {"t": 1025.3, "x": "対象は、九州の西の海の中に"}, {"t": 1027.9666666666667, "x": "沈んでいる、縄文時代の遺跡です。"}, {"t": 1030.7, "x": "その遺跡が海に沈んだ主な原因は、氷床の融解に"}, {"t": 1034.7, "x": "ともなうハイドロアイソスタシーだと結論づけています。"}, {"t": 1037.65, "x": "1997年の研究は、有明海の沿岸で、海面が"}, {"t": 1042.9333333333334, "x": "いまより二メートル高くなった時期を確かめました。"}, {"t": 1045.7, "x": "それはおよそ4900年前のことでした。"}, {"t": 1048.7666666666667, "x": "そして、それがハイドロアイソスタシーによる陸の"}, {"t": 1051.8833333333334, "x": "持ち上がりで説明できることを示しています。"}, {"t": 1054.5833333333333, "x": "ここで大事なのは、場所によって"}, {"t": 1056.7166666666667, "x": "効き方が違うという点です。"}, {"t": 1058.5333333333333, "x": "この効果は、溶けた氷床から遠く離れた地域で、"}, {"t": 1062.1166666666666, "x": "はっきり現れやすいと考えられています。"}, {"t": 1065.0666666666666, "x": "日本列島は、まさにそうした場所にあります。"}, {"t": 1068.2833333333333, "x": "陸がどれだけ持ち上がるかは、周りの海の"}, {"t": 1071.15, "x": "広さや、深い海までの距離によって変わります。"}, {"t": 1074.4333333333334, "x": "さらに日本列島は、プレートの境目の上にあります。"}, {"t": 1078.3666666666666, "x": "ハイドロアイソスタシーとは別に、"}, {"t": 1080.3, "x": "地震のたびに持ち上がる土地もあれば、"}, {"t": 1082.8166666666666, "x": "ゆっくり沈み続ける土地もあります。"}, {"t": 1085.3166666666666, "x": "海の水の量が同じでも、陸から見た海の"}, {"t": 1088.2833333333333, "x": "高さは、場所ごとに違って見える。"}, {"t": 1090.6333333333334, "x": "これが、次の章で見る、答えの"}, {"t": 1093.35, "x": "割れ方の原因になっています。"}, {"t": 1095.1666666666667, "x": "縄文海進のとき、海面はいまより何メートル高かったのか。"}, {"t": 1099.5, "x": "よく目にする答えは、二メートルから三メートルです。"}, {"t": 1103.0, "x": "しかし研究の中身を見ていくと、"}, {"t": 1105.1, "x": "一つの数字には収まりません。"}, {"t": 1107.4166666666667, "x": "いくつかの地点を並べます。"}, {"t": 1109.2333333333333, "x": "千葉県の古流山湾では、6500年前から"}, {"t": 1112.7333333333333, "x": "5300年前にかけて、およそプラス三メートル。"}, {"t": 1116.35, "x": "埼玉県の荒川沿いの低地では、"}, {"t": 1118.7833333333333, "x": "6000年前ごろに、三メートルあまり。"}, {"t": 1121.8166666666666, "x": "大阪では、6000年前に、プラス三メートル。"}, {"t": 1125.6, "x": "有明海の沿岸では、およそ4900年前に、"}, {"t": 1129.5333333333333, "x": "プラス二メートル。愛知県の"}, {"t": 1131.7, "x": "先苅貝塚の周りでは、6000年前に、"}, {"t": 1134.6833333333334, "x": "プラス四・五メートルから五・五メートル。"}, {"t": 1137.7166666666667, "x": "千葉県の九十九里浜では、6000年前から"}, {"t": 1140.85, "x": "5300年前にかけて、プラス四メートルから六メートル。"}, {"t": 1144.9666666666667, "x": "一方、宮城県の仙台平野を調べた1978年の"}, {"t": 1149.7666666666667, "x": "研究は、海面がいまより大きく高かったことを"}, {"t": 1153.1333333333334, "x": "示す十分な証拠は見つからない、としています。"}, {"t": 1156.45, "x": "仙台の周りの海面は、7500年前ごろ以降、"}, {"t": 1160.4833333333333, "x": "二メートルに満たない幅で上下していたという結論です。"}, {"t": 1164.1, "x": "同じ日本列島の中で、ゼロに近いところから、"}, {"t": 1167.55, "x": "六メートルに届くところまであります。"}, {"t": 1170.05, "x": "なぜこれほど違うのか。理由の一つは、"}, {"t": 1173.0833333333333, "x": "前の章で見た、陸の動きの違いです。"}, {"t": 1175.95, "x": "九十九里浜の研究では、地震にともなって"}, {"t": 1179.0166666666667, "x": "土地が一度に〇・四メートルから一・二メートル"}, {"t": 1181.9833333333333, "x": "持ち上がったことが、何回も記録されています。"}, {"t": 1185.0333333333333, "x": "房総半島の南の端では、海岸に階段のような"}, {"t": 1188.85, "x": "平らな面が何段も残っています。"}, {"t": 1191.0333333333333, "x": "それぞれの段は、地震のたびに陸が持ち上がって、"}, {"t": 1194.4166666666667, "x": "海の底が陸になったものと考えられています。"}, {"t": 1197.7333333333333, "x": "1980年の研究は、その持ち上がりが、"}, {"t": 1201.4666666666667, "x": "6150年前、4350年前、2850年前、"}, {"t": 1207.7333333333333, "x": "そして270年前ごろに起きたとしています。"}, {"t": 1211.1333333333334, "x": "長い目で見た隆起の速さは、一年あたり"}, {"t": 1214.1666666666667, "x": "三ミリメートルと計算されています。"}, {"t": 1216.4333333333334, "x": "神奈川県の大磯の丘陵では、千年あたり三・四メートルの"}, {"t": 1221.0333333333333, "x": "速さで土地が持ち上がっているとされています。"}, {"t": 1223.6333333333334, "x": "こうした土地では、6000年前の海の跡は、"}, {"t": 1226.75, "x": "いまでは数メートルどころではない高さにあります。"}, {"t": 1229.9666666666667, "x": "逆に、沈み続けている土地では、"}, {"t": 1232.55, "x": "海の跡は地面の下に隠れます。"}, {"t": 1235.05, "x": "1982年にまとめられた研究では、高い海面の"}, {"t": 1239.4, "x": "時期そのものにも、地域差があるとされました。"}, {"t": 1242.3166666666666, "x": "隆起の激しい地域では6500年前ごろ、安定している地域や"}, {"t": 1247.0333333333333, "x": "沈んでいる地域では5000年前ごろです。"}, {"t": 1249.6666666666667, "x": "二つ目の理由は、何を海面の目印にするかという問題です。"}, {"t": 1254.1333333333334, "x": "海の地層の上端は、平均の海面ではなく、大潮の"}, {"t": 1258.4833333333333, "x": "満潮のときの高さを示している、とする指摘があります。"}, {"t": 1262.3333333333333, "x": "そうであれば、潮の満ち引きの幅の分だけ、"}, {"t": 1265.5, "x": "海面を高く見積もってしまうことになります。"}, {"t": 1268.5666666666666, "x": "珪藻の種類や、地層にできた小さな鉱物の結晶を"}, {"t": 1272.4333333333334, "x": "使って、より正確な目印を探す研究も続いています。"}, {"t": 1276.7666666666667, "x": "三つ目の理由は、地層そのものの縮みです。"}, {"t": 1279.9833333333333, "x": "泥の層は、上に土が積もると、水が絞り出されて縮みます。"}, {"t": 1284.7666666666667, "x": "縮めば、地層の中の目印は、"}, {"t": 1287.2833333333333, "x": "もとの高さより低い位置に移ります。"}, {"t": 1289.85, "x": "先苅貝塚の研究には、同じ雑誌の同じ号に、"}, {"t": 1293.55, "x": "ほかの研究者たちの論評が付けられました。"}, {"t": 1296.5166666666667, "x": "その一人は、プラス四・五メートル以上という"}, {"t": 1299.7166666666667, "x": "値について、ほかの研究と照らし合わせると、"}, {"t": 1302.8666666666666, "x": "やや高すぎる感じがする、と書いています。"}, {"t": 1306.1333333333334, "x": "そのうえで、この付近の土地はいまも少し持ち上がる"}, {"t": 1309.5333333333333, "x": "傾向があるので、当時沈んでいたという証拠が"}, {"t": 1312.6833333333334, "x": "出ない限り、四・五メートル以上の高 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
