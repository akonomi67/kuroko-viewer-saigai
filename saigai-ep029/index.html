<script>
const D={"name": "ep029", "file": "ep029", "dur": 1875.3833125, "segs": [], "subs": [{"t": 0.0, "x": "大西洋のまんなかより少し北に深い海があります。"}, {"t": 3.4, "x": "アイルランドの南西、陸から800キロほど沖です。"}, {"t": 7.116666666666666, "x": "水深はおよそ4000メートルあります。"}, {"t": 9.733333333333333, "x": "光は届きません。水はいつも冷たいままです。"}, {"t": 13.016666666666667, "x": "その海の底には白っぽい泥が積もっています。"}, {"t": 16.0, "x": "小さな生き物の殻が降り積もったものです。"}, {"t": 18.75, "x": "ところが泥を深く掘ると、ときどき様子が変わります。"}, {"t": 22.35, "x": "殻がほとんど消えるのです。"}, {"t": 24.1, "x": "代わりに、とがった石の粒ばかりの層が出てきます。"}, {"t": 27.633333333333333, "x": "石の粒は遠い陸のものでした。"}, {"t": 29.833333333333332, "x": "そこから西へ、3000キロ以上も離れた陸です。"}, {"t": 33.4, "x": "カナダの北、ハドソン湾のまわりの岩とよく似ていました。"}, {"t": 37.13333333333333, "x": "海の流れでは、石はそこまで運ばれません。"}, {"t": 40.416666666666664, "x": "運んだのは氷山でした。最後の氷期に、"}, {"t": 43.38333333333333, "x": "北米をおおう氷が何度も崩れました。"}, {"t": 46.2, "x": "そのたびに、氷山の大群が大西洋を東へ渡ったのです。"}, {"t": 50.63333333333333, "x": "氷山は溶けながら進みました。"}, {"t": 52.78333333333333, "x": "そして抱えていた石を海に落としていきました。"}, {"t": 55.68333333333333, "x": "この出来事はハインリッヒ・イベントと呼ばれます。"}, {"t": 58.516666666666666, "x": "見つけた人の名前をとった呼び名です。"}, {"t": 60.93333333333333, "x": "はっきりした層は6つあります。"}, {"t": 63.05, "x": "およそ6万年前から1万6800年前にかけての出来事です。"}, {"t": 67.51666666666667, "x": "氷山の大群が来るたびに、海の"}, {"t": 70.08333333333333, "x": "底に石の層が一枚増えました。"}, {"t": 72.2, "x": "その層を数えると、氷が崩れた回数が分かります。"}, {"t": 76.11666666666666, "x": "この回の主語は海です。寒さそのものの話ではありません。"}, {"t": 80.16666666666667, "x": "海の底の泥に残った石の粒を追います。"}, {"t": 82.95, "x": "石はどこから来たのか。どの道を通って運ばれたのか。"}, {"t": 86.6, "x": "そして氷はなぜ崩れたのか。"}, {"t": 88.6, "x": "最後に一粒の石の旅を始めから見てみます。"}, {"t": 91.73333333333333, "x": "この話は1980年代のドイツから始まります。"}, {"t": 95.55, "x": "港町ハンブルクに、ドイツの水路の研究所がありました。"}, {"t": 99.56666666666666, "x": "そこに一人の海洋地質学者がいました。"}, {"t": 102.26666666666667, "x": "名前をハルトムート・ハインリッヒといいます。"}, {"t": 104.91666666666667, "x": "彼が調べたのは北大西洋の東にある海山でした。"}, {"t": 108.43333333333334, "x": "海山とは海の底から盛り上がった山のことです。"}, {"t": 111.53333333333333, "x": "その山はドライツァックと呼ばれていました。"}, {"t": 114.13333333333334, "x": "ドイツ語で、三つまたのやりを意味する言葉です。"}, {"t": 117.28333333333333, "x": "場所は北緯47度、西経19度あたりです。"}, {"t": 121.03333333333333, "x": "まわりの海の深さは、3900メートルから"}, {"t": 124.35, "x": "4550メートルです。なぜ、"}, {"t": 126.73333333333333, "x": "わざわざ海山の上を選んだのでしょうか。"}, {"t": 129.96666666666667, "x": "平らな海の底には、ときどき濁った水が押し寄せます。"}, {"t": 133.83333333333334, "x": "陸に近い斜面から、泥や砂が一気に流れ下るのです。"}, {"t": 137.86666666666667, "x": "その砂は、氷山が落とした石と見分けにくくなります。"}, {"t": 141.66666666666666, "x": "一段高い海山の上なら、その流れが届きにくいのです。"}, {"t": 145.83333333333334, "x": "もう一つ、この場所には大事な理由がありました。"}, {"t": 149.26666666666668, "x": "北緯45度から50度の海は、気候で姿を大きく変えます。"}, {"t": 153.8, "x": "寒い時代と暖かい時代で、水の様子が違うのです。"}, {"t": 157.71666666666667, "x": "しかも強い氷山の波が来たときだけ、石が届く場所でした。"}, {"t": 162.08333333333334, "x": "ハインリッヒたちは泥の柱を13本抜き取りました。"}, {"t": 165.51666666666668, "x": "海山の上と、そのまわりの平らな海の底からです。"}, {"t": 169.25, "x": "長い筒を海の底に打ち込みます。"}, {"t": 171.63333333333333, "x": "中に泥を詰めたまま、船の上へ引き上げるのです。"}, {"t": 175.15, "x": "こうした泥の柱は、太さが7センチから11センチほどです。"}, {"t": 179.55, "x": "長さは2メートルから20メートルほどになります。"}, {"t": 182.61666666666667, "x": "広い海の底から見れば、針で刺したような小さな穴です。"}, {"t": 186.76666666666668, "x": "だからこそ、どこを掘るかが大事でした。"}, {"t": 189.56666666666666, "x": "柱はまず切り分けられました。"}, {"t": 191.53333333333333, "x": "次にエックス線で写真を撮りました。"}, {"t": 194.01666666666668, "x": "海の底の生き物が掘った穴を、避けて調べるためです。"}, {"t": 197.81666666666666, "x": "そのうえで、泥を3センチごとに取り分けました。"}, {"t": 201.15, "x": "取り分けた泥はふるいで洗われました。"}, {"t": 203.46666666666667, "x": "ふるいの目は0.18ミリです。"}, {"t": 205.73333333333332, "x": "海の真ん中では0.15ミリより"}, {"t": 208.1, "x": "大きな粒はまず氷が運んだものです。"}, {"t": 210.63333333333333, "x": "研究者のまとめでは、そう考えてよいとされています。"}, {"t": 214.38333333333333, "x": "細かい泥は流れ去り、砂ほどの粒だけが残ります。"}, {"t": 218.16666666666666, "x": "その粒を300個から600個ずつ、顕微鏡で数えました。"}, {"t": 222.58333333333334, "x": "火山のガラスか、石英か。火山の岩か、ほかの岩か。"}, {"t": 227.11666666666667, "x": "一粒ずつ見分けて、数を記録していったのです。"}, {"t": 230.53333333333333, "x": "3ミリより大きなかけらは数に入れませんでした。"}, {"t": 233.63333333333333, "x": "気の遠くなるような作業でした。"}, {"t": 235.7, "x": "けれども、この地道な数え方が大きな発見につながります。"}, {"t": 239.83333333333334, "x": "ふだんの海の底の泥は何でできているのでしょうか。"}, {"t": 243.01666666666668, "x": "ドライツァックのまわりでは、多くが小さな殻でした。"}, {"t": 246.6, "x": "有孔虫と呼ばれる生き物の殻です。"}, {"t": 249.06666666666666, "x": "海に浮かんで暮らす、砂粒ほどの生き物です。"}, {"t": 252.36666666666667, "x": "死ぬと殻だけが海の底へ沈みます。"}, {"t": 254.91666666666666, "x": "暖かい時代の泥は、こうした殻で埋まっていました。"}, {"t": 258.3666666666667, "x": "ところが、ある深さで結果ががらりと変わりました。"}, {"t": 261.71666666666664, "x": "殻の数が急に減ったのです。"}, {"t": 263.7, "x": "代わりに石の粒の割合がはね上がりました。"}, {"t": 266.5, "x": "のちの研究者がまとめています。"}, {"t": 268.6333333333333, "x": "その割合は100パーセント近くです。"}, {"t": 271.1166666666667, "x": "ほとんど石だけの砂だったのです。"}, {"t": 273.25, "x": "ふだんの泥とはまるで別の場所の砂のようでした。"}, {"t": 276.28333333333336, "x": "石の粒の多くは透き通った石英でした。"}, {"t": 279.15, "x": "しかも角がとがっていました。"}, {"t": 280.93333333333334, "x": "川や波に長く転がされた石なら、角は丸くなります。"}, {"t": 284.8833333333333, "x": "とがった角は、転がらずに運ばれた印でした。"}, {"t": 288.25, "x": "なかには丸く磨かれた粒も少しありました。"}, {"t": 291.06666666666666, "x": "表面に引っかき傷のある粒です。"}, {"t": 293.4166666666667, "x": "氷の底で、岩にこすられた跡と考えられます。"}, {"t": 297.0833333333333, "x": "エックス線の写真でも、その層は見分けられました。"}, {"t": 300.76666666666665, "x": "殻の多い泥と石の多い泥では、"}, {"t": 302.93333333333334, "x": "写り方の濃さが違ったのです。"}, {"t": 305.23333333333335, "x": "しかもその境目はとても急でした。"}, {"t": 307.65, "x": "ゆっくり変わったのではありません。"}, {"t": 309.6666666666667, "x": "ある深さで、突然入れかわっていたのです。"}, {"t": 312.65, "x": "この層は、13本の柱のどれにも出てきました。"}, {"t": 316.15, "x": "しかも同じ順番で並んでいました。"}, {"t": 318.46666666666664, "x": "いちばん上から、氷期が本格的に始まったころの境目まで。"}, {"t": 322.8, "x": "そのあいだに、はっきりした山が6つありました。"}, {"t": 326.15, "x": "さらに、海の底のいちばん表面にも、"}, {"t": 329.18333333333334, "x": "小さな7つ目の山がありました。"}, {"t": 331.5833333333333, "x": "石英が5パーセントから10パーセントほど"}, {"t": 334.21666666666664, "x": "増えた小さな山です。海の底の写真には、"}, {"t": 337.15, "x": "角ばった大きな小石も写っていました。"}, {"t": 339.93333333333334, "x": "殻の種類にも変化がありました。"}, {"t": 342.06666666666666, "x": "冷たい海を好む有孔虫がいます。"}, {"t": 344.55, "x": "その割合が石の層とほぼぴったり重なって"}, {"t": 347.35, "x": "増えていたのです。石が降った時期には"}, {"t": 349.75, "x": "海の表面も冷たくなっていました。"}, {"t": 351.8833333333333, "x": "泥のたまる速さも見積もられました。"}, {"t": 354.15, "x": "1000年でおよそ2センチです。"}, {"t": 356.15, "x": "6万年分を積み上げてみます。"}, {"t": 358.35, "x": "それでも1メートル20センチほどにしかなりません。"}, {"t": 361.56666666666666, "x": "石だらけの層は、その薄い泥の"}, {"t": 364.01666666666665, "x": "中に何度も挟まっていました。"}, {"t": 365.8666666666667, "x": "海の底の泥は、石の降った回数を数えていたのです。"}, {"t": 369.81666666666666, "x": "ハインリッヒは、この結果を1988年に論文にしました。"}, {"t": 374.73333333333335, "x": "題を訳すと、北大西洋の北東で"}, {"t": 377.48333333333335, "x": "氷が繰り返し石を運んだ話です。"}, {"t": 380.0833333333333, "x": "その原因と結果を論じたものでした。"}, {"t": 382.55, "x": "調べた範囲は過去13万年でした。"}, {"t": 385.26666666666665, "x": "彼が理由として考えたのは、地球の動きでした。"}, {"t": 388.8333333333333, "x": "地球の地軸は、こまのように首をふっています。"}, {"t": 392.2, "x": "とてもゆっくりした動きです。"}, {"t": 394.03333333333336, "x": "この首ふりで、夏に届く日の光の強さが変わります。"}, {"t": 397.93333333333334, "x": "首ふりがひと回りするには、2万年ほどかかります。"}, {"t": 401.46666666666664, "x": "ハインリッヒは、その半分の周期を読み取りました。"}, {"t": 405.03333333333336, "x": "およそ1万1000年に一度です。"}, {"t": 407.1666666666667, "x": "前後に1000年ほどの幅があります。"}, {"t": 409.46666666666664, "x": "石の層は寒い時期だけに積もったのではない。"}, {"t": 412.25, "x": "少し暖かい時期の中の寒い時にも"}, {"t": 414.6333333333333, "x": "積もった、と彼は考えました。"}, {"t": 417.03333333333336, "x": "調べた13万年のあいだを見ます。"}, {"t": 419.55, "x": "石の層はこのリズムで何度も積もっていました。"}, {"t": 422.45, "x": "夏の日ざしが強い時期には、"}, {"t": 424.25, "x": "氷床の溶け水が海に流れ込みます。"}, {"t": 426.93333333333334, "x": "すると冬に海が凍りやすくなります。"}, {"t": 429.4, "x": "逆に夏の日ざしが弱い時期には、陸の氷が育ちます。"}, {"t": 433.35, "x": "すると海に出る氷山が増えます。"}, {"t": 435.6166666666667, "x": "どちらの場合も、冷たい水が南へ張り出します。"}, {"t": 439.1333333333333, "x": "石を運ぶ氷が、遠くまで来るというのです。"}, {"t": 442.46666666666664, "x": "ここで一つ覚えておきたいことが"}, {"t": 444.6333333333333, "x": "あります。発見した人の説明が、"}, {"t": 446.8, "x": "そのまま答えになったわけではありません。"}, {"t": 449.46666666666664, "x": "のちに年代を測り直すと、層と"}, {"t": 452.0, "x": "層の間はもっと短いと分かりました。"}, {"t": 454.43333333333334, "x": "石の出どころも、この論文ではまだ分かっていません。"}, {"t": 458.03333333333336, "x": "それでも、この論文が見つけたものは"}, {"t": 460.6333333333333, "x": "大きな意味を持ちました。同じ形の層が、"}, {"t": 463.51666666666665, "x": "何本もの柱にそろって出てくる。"}, {"t": 465.78333333333336, "x": "それは、広い範囲で同じ時期に何かが起きた印でした。"}, {"t": 469.76666666666665, "x": "ハインリッヒ自身も、この点を強調しています。"}, {"t": 473.31666666666666, "x": "規則正しい層は、遠い海の気候を読む手がかりになる。"}, {"t": 477.18333333333334, "x": "彼はそう書いて論文を結んでいます。"}, {"t": 479.73333333333335, "x": "ただ、この層が世界中で注目されるのは、"}, {"t": 482.8333333333333, "x": "もう少しあとです。転機は論文から4年後に来ました。"}, {"t": 486.6666666666667, "x": "大西洋の反対側の泥が、同じ層を抱えていたのです。"}, {"t": 490.76666666666665, "x": "1992年、いくつかの論文が続けて出ました。"}, {"t": 494.9, "x": "一つは、ジョン・アンドリュースたちの研究です。"}, {"t": 498.1166666666667, "x": "アメリカのコロラド大学の研究者です。"}, {"t": 500.71666666666664, "x": "彼らが調べたのは、ラブラドル海の北西の泥でした。"}, {"t": 504.3833333333333, "x": "カナダの北東、ハドソン海峡の出口に近い海です。"}, {"t": 508.18333333333334, "x": "1本の柱は、水深2.4キロから抜かれました。"}, {"t": 512.1333333333333, "x": "もう1本は水深1.4キロからです。"}, {"t": 515.0, "x": "その泥に、ふだんは見られない層が2つありました。"}, {"t": 518.45, "x": "削られた石灰岩の細かい粉が、どっと詰まった層です。"}, {"t": 522.5, "x": "有孔虫の殻で年代が測られました。"}, {"t": 525.1333333333333, "x": "新しいほうは、1万4000年前から"}, {"t": 528.1833333333333, "x": "1万5000年前ごろです。"}, {"t": 530.0, "x": "古いほうは、1万9000年前から"}, {"t": 532.8333333333334, "x": "2万1000年前ごろでした。"}, {"t": 534.5166666666667, "x": "これは、炭素の年代の測り方で出した値です。"}, {"t": 537.9333333333333, "x": "この2つの層は、大西洋の東の"}, {"t": 540.7, "x": "層と時期がそろっていました。"}, {"t": 542.3833333333333, "x": "新しいほうが1番目の層にあたります。"}, {"t": 545.1, "x": "古いほうが2番目の層です。"}, {"t": 547.0833333333334, "x": "このうち水深1.4キロの柱は、"}, {"t": 549.6166666666667, "x": "のちに顕微鏡写真でも紹介されました。"}, {"t": 552.5833333333334, "x": "ふつうの深さの砂はほとんどが有孔虫の殻です。"}, {"t": 555.95, "x": "ところが2番目の層の深さでは、"}, {"t": 558.0833333333334, "x": "ほとんどが石のかけらでした。"}, {"t": 560.05, "x": "深さ6メートル70センチのあたりです。"}, {"t": 562.7166666666667, "x": "アンドリュースたちはこう考えました。"}, {"t": 564.9833333333333, "x": "ローレンタイド氷床には、速い氷の流れがあった。"}, {"t": 568.65, "x": "ハドソン海峡を通って、海へ流れ出す流れだ。"}, {"t": 572.3666666666667, "x": "その流れが大陸棚の端まで伸びた。"}, {"t": 574.8666666666667, "x": "そして泥を斜面と深い海へ送り込んだのだ、と。"}, {"t": 578.5166666666667, "x": "同じ年、ウォレス・ブロッカーたちも論文を出しました。"}, {"t": 582.1833333333333, "x": "彼らは、北大西洋の各地の泥を見比べました。"}, {"t": 585.7, "x": "そして、この層が一か所だけのものではないと示しました。"}, {"t": 589.5, "x": "上の6つの層を生んだ出来事に、名前もつけました。"}, {"t": 593.1833333333333, "x": "それがハインリッヒ・イベントです。"}, {"t": 595.2333333333333, "x": "ハドソン海峡から出た氷山の大艦隊。"}, {"t": 598.0333333333333, "x": "それが層を作ったと考えたのです。"}, {"t": 600.5, "x": "大艦隊という言葉にはわけがあります。"}, {"t": 603.0666666666667, "x": "氷山は一つずつ出たのではない。"}, {"t": 605.1833333333333, "x": "数えきれないほど一度に出た、と考えたからです。"}, {"t": 608.6333333333333, "x": "ジェラルド・ボンドたちも、層の中を調べました。"}, {"t": 611.75, "x": "石灰岩のかけらが、多く含まれていました。"}, {"t": 615.0166666666667, "x": "有孔虫は少ないものの、残った殻はきれいな形でした。"}, {"t": 619.05, "x": "殻が溶けて減ったのではない、ということです。"}, {"t": 622.0833333333334, "x": "石の粒が大量に降ってきたのです。"}, {"t": 624.4333333333333, "x": "こうして層に番号がつけられました。"}, {"t": 626.7333333333333, "x": "いちばん新しい層が1番です。"}, {"t": 629.0666666666667, "x": "いちばん古い層が6番です。"}, {"t": 631.15, "x": "石が氷山で運ばれたことは分かりました。"}, {"t": 633.9166666666666, "x": "ではどこの陸から来たのでしょうか。"}, {"t": 636.0666666666667, "x": "北大西洋のまわりには、いくつもの陸があります。"}, {"t": 639.4666666666667, "x": "カナダ、グリーンランド、アイスランド、"}, {"t": 642.3333333333334, "x": "そしてヨーロッパです。どの陸の氷河も、"}, {"t": 645.2833333333333, "x": "氷山を海に送り出していました。"}, {"t": 647.6166666666667, "x": "出どころを決めるには、石の身元を調べるしかありません。"}, {"t": 651.45, "x": "最初の手がかりは石灰岩の粉でした。"}, {"t": 654.1166666666667, "x": "ハドソン湾とハドソン海峡の底は、"}, {"t": 656.5333333333333, "x": "古い石灰岩でおおわれています。"}, {"t": 659.0333333333333, "x": "ただ石灰岩はほかの場所にもあります。"}, {"t": 661.5666666666667, "x": "そこで層の厚さが比べられました。"}, {"t": 663.8333333333334, "x": "すると層はカナダに近づくほど厚くなっていました。"}, {"t": 666.95, "x": "いちばん厚いのは、ハドソン海峡のすぐ沖です。"}, {"t": 670.4166666666666, "x": "その近くでは砂より細かい石灰岩の粉がとくに目立ちます。"}, {"t": 674.3666666666667, "x": "二つ目の手がかりは石の年齢でした。"}, {"t": 676.85, "x": "岩には生まれた時の記録が残ります。"}, {"t": 679.3, "x": "強い熱を受けた時の記録も残ります。"}, {"t": 681.9, "x": "北大西洋のまわりの岩は、地域ごとに"}, {"t": 684.8, "x": "熱を受けた時代が違います。"}, {"t": 686.5833333333334, "x": "38億年前もあれば18億年前もあります。"}, {"t": 690.3833333333333, "x": "10億年前など、いくつもの時代があるのです。"}, {"t": 693.7, "x": "だから石の年齢は出身地を見分ける手がかりになるのです。"}, {"t": 697.4166666666666, "x": "長石という鉱物の粒には、鉛がわずかに含まれます。"}, {"t": 701.4333333333333, "x": "鉛には、重さの違う種類がいくつかあります。"}, {"t": 704.7666666666667, "x": "その混ざり方は、岩の生い立ちで変わるのです。"}, {"t": 707.9833333333333, "x": "石の層から、長石の粒が取り出されました。"}, {"t": 711.2666666666667, "x": "調べるとはっきりした特徴が出ました。"}, {"t": 713.7333333333333, "x": "27億年前に生まれた岩です。"}, {"t": 716.2333333333333, "x": "それが18億年前に、強い熱を受けていました。"}, {"t": 719.9833333333333, "x": "カナダのハドソン湾のまわりには、古い岩の地域が"}, {"t": 723.15, "x": "あります。チャーチル区と呼ばれる地域です。"}, {"t": 726.0333333333333, "x": "その岩も27億年前に生まれています。"}, {"t": 729.0166666666667, "x": "そして18億年前に強い熱で作りかえられています。"}, {"t": 732.7, "x": "石の層の長石は、この岩の特徴とよく合っていました。"}, {"t": 736.6833333333333, "x": "ハドソン海峡のすぐ沖の泥とも、よく似ていました。"}, {"t": 740.3166666666667, "x": "バフィン島の氷河が残した土砂とも、似ていました。"}, {"t": 743.8, "x": "こうして石の出どころが絞られました。"}, {"t": 746.0333333333333, "x": "1番2番4番5番の層の石です。"}, {"t": 748.7666666666667, "x": "これらは、ハドソン海峡のまわりから来たと"}, {"t": 751.5666666666667, "x": "考えられています。ここで一つ注意しておきます。"}, {"t": 754.7333333333333, "x": "石の一粒ずつに、名札がついているわけではありません。"}, {"t": 758.6, "x": "何種類もの調べ方を重ねて、"}, {"t": 760.7333333333333, "x": "筋の通る出どころを選んでいます。"}, {"t": 763.1166666666667, "x": "それでも手がかりはそろって同じ場所を指していました。"}, {"t": 766.2166666666667, "x": "カナダの北の岩が削られ、氷山に乗って運ばれたのです。"}, {"t": 770.25, "x": "石は生まれた土地の印を自分の中に持っていたのです。"}, {"t": 773.7333333333333, "x": "氷山はどの道を通ったのでしょうか。"}, {"t": 776.2166666666667, "x": "手がかりは、ハインリッヒの論文より前からありました。"}, {"t": 779.8, "x": "1977年、ウィリアム・ラディマンが"}, {"t": 783.0666666666667, "x": "北大西洋の泥を広く調べています。"}, {"t": 785.4833333333333, "x": "氷が運んだ砂が、どこにどれだけ積もったか。"}, {"t": 788.75, "x": "それを地図にしたのです。暖かい時代には、"}, {"t": 791.8833333333333, "x": "砂が多いのは北西の海でした。"}, {"t": 794.0666666666667, "x": "グリーンランドや、ニューファンドランドの近くです。"}, {"t": 797.3166666666667, "x": "氷山は、陸を離れてわりあい早く溶けていました。"}, {"t": 800.8833333333333, "x": "ところが、およそ7万5000年前を境に、形が変わります。"}, {"t": 805.65, "x": "砂の多い場所が、東西に長い帯へ移ったのです。"}, {"t": 809.3833333333333, "x": "北緯46度から50度の帯です。"}, {"t": 811.9166666666666, "x": "大西洋を横に切るような形でした。"}, {"t": 814.4333333333333, "x": "ラディマンは、その理由をこう読みました。"}, {"t": 817.2333333333333, "x": "氷期の海は冷たく、氷山はなかなか溶けない。"}, {"t": 820.6833333333333, "x": "溶けるほど暖かい水に出会うまで、遠くへ流れたのだ。"}, {"t": 824.3666666666667, "x": "カナダの氷山は、ラブラドル海を南へ下ります。"}, {"t": 827.9666666666667, "x": "そこから流れに乗って、東や南東へ向かいました。"}, {"t": 831.5833333333334, "x": "そして、この帯で溶けて石を落としたのです。"}, {"t": 834.65, "x": "北欧から出た氷山もありました。"}, {"t": 836.9166666666666, "x": "こちらはノルウェーの近くで石の一部を落としました。"}, {"t": 840.0166666666667, "x": "そのあとアイスランドの南を回り込みます。"}, {"t": 842.8, "x": "そしてやはり同じ帯のあたりで溶けたのです。"}, {"t": 845.55, "x": "この形は、およそ6万5000年のあいだ"}, {"t": 848.55, "x": "ほぼ変わりませんでした。氷が運ぶ砂の量は"}, {"t": 851.3666666666667, "x": "氷床が大きいほど増えていました。"}, {"t": 853.6333333333333, "x": "11万5000年前に少し増えています。"}, {"t": 856.55, "x": "そして7万5000年前に大きく増えました。"}, {"t": 859.5333333333333, "x": "ドライツァックは、ちょうどこの帯の中にあります。"}, {"t": 862.7166666666667, "x": "ハインリッヒの海山は、氷山の"}, {"t": 865.2166666666667, "x": "通り道の真下にあったのです。"}, {"t": 867.0833333333334, "x": "ラディマンは、もう一つ大きな数字を出しています。"}, {"t": 870.4833333333333, "x": "300万年のあいだに、氷が陸から運んだ土砂の量です。"}, {"t": 874.8333333333334, "x": "深い大西洋へ運ばれた量は、およそ20万立方キロメートル。"}, {"t": 879.3166666666667, "x": "もとの陸に広げると、厚さ16メートルにもなる量です。"}, {"t": 883.2833333333333, "x": "世界の海で、氷が運んだ陸の土砂は多くあります。"}, {"t": 887.1833333333333, "x": "その7割ほどは、アイスランドより"}, {"t": 889.6666666666666, "x": "南の北大西洋に積もりました。"}, {"t": 891.8166666666667, "x": "ここは、氷が石を捨てる地球最大の場所だったのです。"}, {"t": 895.7666666666667, "x": "氷山が溶ける場所は海の温度で決まりました。"}, {"t": 898.6333333333333, "x": "冷たい海が南へ広がるほど石も南へ落ちたのです。"}, {"t": 902.3, "x": "20世紀に入っても、この海は氷山の多い海でした。"}, {"t": 906.35, "x": "1912年には、客船タイタニック号が"}, {"t": 909.8166666666667, "x": "氷山にぶつかって沈んでいます。"}, {"t": 911.85, "x": "いまの氷山はほんの名残にすぎません。"}, {"t": 914.4, "x": "氷期には、それとは比べものにならない"}, {"t": 917.0666666666667, "x": "数の氷山が渡っていました。"}, {"t": 918.9833333333333, "x": "6つの層はいつできたのでしょうか。"}, {"t": 921.2166666666667, "x": "新しい層ほど、年代ははっきりしています。"}, {"t": 924.5166666666667, "x": "1番と2番は、有孔虫の殻で年代が測られました。"}, {"t": 928.6333333333333, "x": " ": "18億年前、その岩は地下深くで強い熱を受けました。"}, {"t": 1742.4333333333334, "x": "そして作りかえられました。"}, {"t": 1744.1666666666667, "x": "そのあと、石は長いあいだ地面の下で眠っていました。"}, {"t": 1748.0, "x": "やがて地球は寒い時代に入ります。"}, {"t": 1750.4666666666667, "x": "北米の上に、厚い氷が積もっていきました。"}, {"t": 1753.8666666666666, "x": "ハドソン湾のまわりも、氷の下に沈みました。"}, {"t": 1757.25, "x": "氷の厚さは1000メートルを"}, {"t": 1759.0, "x": "超えていたと考えられています。"}, {"t": 1760.8666666666666, "x": "氷はゆっくり動き底の岩を削ります。"}, {"t": 1763.6333333333334, "x": "石は、そのとき氷の底に取り込まれました。"}, {"t": 1766.8833333333334, "x": "石灰岩の粉といっしょに、氷のいちばん底に入ったのです。"}, {"t": 1771.1, "x": "何千年かが過ぎました。ある時、氷が速く流れ始めます。"}, {"t": 1775.75, "x": "氷はハドソン海峡を通り、海へ押し出されました。"}, {"t": 1779.5166666666667, "x": "氷の縁が割れて、石を抱えた氷山になりました。"}, {"t": 1783.2166666666667, "x": "石は氷のいちばん底にいたまま海へ出ました。"}, {"t": 1786.2333333333333, "x": "同じ時期に、数えきれない氷山が海へ出ていきました。"}, {"t": 1789.9833333333333, "x": "氷山はラブラドル海を南へ下りました。"}, {"t": 1792.75, "x": "そこから、海の流れに押されて東へ向かいます。"}, {"t": 1796.3333333333333, "x": "冷たい海の上を長いあいだ漂いました。"}, {"t": 1799.0666666666666, "x": "まわりにも同じように石を抱えた氷山が浮かんでいました。"}, {"t": 1802.6666666666667, "x": "溶けるほど暖かい水には、なかなか出会いません。"}, {"t": 1805.9333333333334, "x": "氷山は少しずつやせながら、"}, {"t": 1807.8666666666666, "x": "北緯47度のあたりまで来ました。"}, {"t": 1810.45, "x": "カナダの岸から、3000キロ以上離れた海です。"}, {"t": 1813.8833333333334, "x": "そこで氷山の底が溶けました。石は氷から離れました。"}, {"t": 1817.85, "x": "そしてまっすぐ下へ沈んでいきました。"}, {"t": 1820.25, "x": "水深4000メートルの、暗い水の中です。"}, {"t": 1823.6166666666666, "x": "光の届かない水の中を石はただ下へ向かいました。"}, {"t": 1826.95, "x": "海の底に着いた石の上に、ほかの石も次々と降ってきます。"}, {"t": 1831.2, "x": "やがて氷山の大群は去りました。"}, {"t": 1833.55, "x": "海の底には、また小さな殻が静かに積もり始めます。"}, {"t": 1837.45, "x": "1000年でわずか2センチずつです。"}, {"t": 1839.65, "x": "石の上には、何万年ものあいだ白い泥が重なりました。"}, {"t": 1843.6833333333334, "x": "そして1980年代、長い筒がその泥を突き抜けました。"}, {"t": 1848.4833333333333, "x": "泥は3センチずつ取り分けられ、ふるいで洗われました。"}, {"t": 1852.2, "x": "顕微鏡の下で、とがった透明な一粒が数えられました。"}, {"t": 1856.3333333333333, "x": "火山のガラスでも殻でもありません。"}, {"t": 1858.6333333333334, "x": "透き通った石英の粒です。カナダの岩から"}, {"t": 1861.6666666666667, "x": " const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
