<script>
const D={"name": "ep037", "file": "ep037", "dur": 1933.6333125, "segs": [], "subs": [{"t": 0.0, "x": "滋賀県の湖の岸に、こんな言い伝えが残っています。"}, {"t": 4.033333333333333, "x": "昔、このあたりの岸には村がありました。"}, {"t": 7.216666666666667, "x": "ある日、大きな地震が来ました。"}, {"t": 9.683333333333334, "x": "村は家もお寺も、まるごと湖の底へ沈みました。"}, {"t": 13.65, "x": "言い伝えの残る場所の沖を調べると。"}, {"t": 16.116666666666667, "x": "水の底から土器や家の跡が見つかっています。"}, {"t": 19.083333333333332, "x": "地元では、こうした場所を千軒と呼んできました。"}, {"t": 22.466666666666665, "x": "千軒もの家がある大きな村、という意味です。"}, {"t": 25.883333333333333, "x": "水の下に沈んだ村。これはただの昔話ではありません。"}, {"t": 29.866666666666667, "x": "湖の岸の土地は、本当に水の下へ動くことがあります。"}, {"t": 34.06666666666667, "x": "そしてその動きは、もっとずっと大きな動きの一部でした。"}, {"t": 38.05, "x": "湖そのものが、場所を変えてきたのです。"}, {"t": 41.0, "x": "今の琵琶湖につながる初めの湖。"}, {"t": 43.416666666666664, "x": "それがあったのは、今の滋賀県ではありません。"}, {"t": 46.6, "x": "およそ400万年前。湖があったのは"}, {"t": 49.18333333333333, "x": "三重県の伊賀市のあたりでした。"}, {"t": 51.46666666666667, "x": "そこから湖は、場所を変えながら北へ移ってきました。"}, {"t": 55.31666666666667, "x": "およそ300万年前には伊賀市の"}, {"t": 57.53333333333333, "x": "北から甲賀市にまたがるあたり。"}, {"t": 59.4, "x": "260万年前のころからは、"}, {"t": 61.56666666666667, "x": "日野町のあたりの湿地。そして今の場所へ。"}, {"t": 64.88333333333334, "x": "湖が動く、というと不思議に聞こえます。"}, {"t": 68.05, "x": "湖の水が、自分で歩くわけではありません。"}, {"t": 71.5, "x": "動いたのは、水をためる窪みのほうです。"}, {"t": 74.4, "x": "大地のどこかが沈むと、そこに水がたまります。"}, {"t": 77.7, "x": "沈む場所が変われば、湖の場所も変わります。"}, {"t": 81.2, "x": "この回の主語は水をためてきた窪みです。"}, {"t": 83.86666666666666, "x": "そして、その窪みを沈めてきた大地です。"}, {"t": 86.93333333333334, "x": "手がかりは4つあります。湖の"}, {"t": 89.41666666666667, "x": "まわりの丘に残る、昔の湖の底の地層。"}, {"t": 92.61666666666666, "x": "水がどちらへ流れ出ていたか、という川の向き。"}, {"t": 96.0, "x": "今も湖の西の岸を走る断層。"}, {"t": 98.68333333333334, "x": "そして、湖の底に沈んだ村の跡です。"}, {"t": 102.03333333333333, "x": "初めの湖はいつできたのか。"}, {"t": 104.15, "x": "窪みはなぜ北へ移ったのか。"}, {"t": 106.1, "x": "今の湖は、いつから今の場所にあるのか。"}, {"t": 109.23333333333333, "x": "資料どうしで答えが分かれている所もあります。"}, {"t": 112.25, "x": "分かれている所は、分かれたまま並べていきます。"}, {"t": 115.55, "x": "まず、今の琵琶湖の大きさを数字で見ておきます。"}, {"t": 119.15, "x": "滋賀県の資料では琵琶湖の面積は"}, {"t": 121.5, "x": "669.26平方キロメートルです。"}, {"t": 124.7, "x": "いちばん深い所は103.58メートル。"}, {"t": 127.78333333333333, "x": "平均の深さは、およそ41.2メートルです。たまっている"}, {"t": 132.28333333333333, "x": "水の量は、275億立方メートルとされています。"}, {"t": 136.11666666666667, "x": "岸の線をぐるりとたどると235.20キロメートルあります。"}, {"t": 140.58333333333334, "x": "湖は、まん中のあたりで細くくびれています。"}, {"t": 144.0, "x": "くびれた所より北を北湖、南を南湖と呼びます。"}, {"t": 147.78333333333333, "x": "北湖と南湖は、深さがまるで違います。"}, {"t": 150.73333333333332, "x": "北湖の平均の深さは、およそ43メートル。"}, {"t": 154.26666666666668, "x": "南湖の平均の深さは、およそ4メートルです。"}, {"t": 157.66666666666666, "x": "水の量は北湖が273億立方メートル。"}, {"t": 161.15, "x": "南湖が2億立方メートルです。"}, {"t": 163.3, "x": "湖の水のほとんどは、北湖にあります。"}, {"t": 166.33333333333334, "x": "北湖は、深くて大きな器です。"}, {"t": 168.91666666666666, "x": "南湖は、浅くて小さな皿のようなものです。"}, {"t": 172.13333333333333, "x": "この違いは、湖の生まれの違いにつながっています。"}, {"t": 175.81666666666666, "x": "南湖と北湖は、同じ時に湖になったわけではありません。"}, {"t": 179.91666666666666, "x": "そのことは、あとの章で見ていきます。"}, {"t": 182.61666666666667, "x": "もうひとつ、琵琶湖には大事な特徴があります。"}, {"t": 185.95, "x": "とても古い湖だということです。"}, {"t": 188.13333333333333, "x": "湖の多くは、やがて土砂に埋まって消えていきます。"}, {"t": 191.76666666666668, "x": "川が運んでくる土や砂が、少しずつ"}, {"t": 194.7, "x": "湖を浅くしていくからです。"}, {"t": 196.63333333333333, "x": "ところが世界には、10万年を"}, {"t": 198.98333333333332, "x": "こえて続いている湖があります。"}, {"t": 201.11666666666667, "x": "その中でも、その湖にしかいない生き物が暮らす湖。"}, {"t": 205.28333333333333, "x": "それを古代湖と呼びます。滋賀県の資料によると、古代湖は"}, {"t": 209.48333333333332, "x": "世界に20ほどしかありません。"}, {"t": 211.41666666666666, "x": "琵琶湖は、そのひとつに数えられています。"}, {"t": 214.31666666666666, "x": "国内で古代湖と言える湖は、琵琶湖だけだとされます。"}, {"t": 218.15, "x": "川から土砂は流れこみ続けています。"}, {"t": 220.65, "x": "それなのに、なぜ琵琶湖は埋まらないのか。"}, {"t": 223.51666666666668, "x": "答えは、湖の下の大地にあります。"}, {"t": 226.45, "x": "湖の底の大地が沈み続けているのです。"}, {"t": 229.36666666666667, "x": "土砂がたまるのに負けないように。"}, {"t": 231.28333333333333, "x": "沈む大地と、たまる土砂。その2つの"}, {"t": 234.1, "x": "つり合いが、湖を長く生かしてきました。"}, {"t": 237.23333333333332, "x": "そしてこのつり合いが崩れたとき、"}, {"t": 239.23333333333332, "x": "湖は場所を変えてきました。"}, {"t": 241.48333333333332, "x": "湖ができるには、2つのものが要ります。"}, {"t": 244.46666666666667, "x": "水が集まってくること。そして、"}, {"t": 246.66666666666666, "x": "集まった水が出ていきにくいことです。"}, {"t": 249.31666666666666, "x": "琵琶湖のまわりを地図で見ると、四方を山が囲んでいます。"}, {"t": 253.21666666666667, "x": "この山に囲まれた低い土地を、近江盆地と呼びます。"}, {"t": 256.8666666666667, "x": "近江盆地には、ほぼ滋賀県の範囲から水が集まってきます。"}, {"t": 261.0, "x": "山に降った雨は、川になって盆地のまん中へ流れ下ります。"}, {"t": 265.3333333333333, "x": "盆地のまん中の、いちばん低い所が琵琶湖です。"}, {"t": 268.78333333333336, "x": "では、湖の水はどこから出ていくのでしょうか。"}, {"t": 272.23333333333335, "x": "出口は、湖の南の端にある瀬田川です。川は1本だけです。"}, {"t": 277.28333333333336, "x": "瀬田川は京都府の宇治市へ向かって流れます。"}, {"t": 280.26666666666665, "x": "その途中で、深くて狭い谷を抜けていきます。"}, {"t": 283.6333333333333, "x": "谷が狭いので、一度にたくさんの"}, {"t": 286.0833333333333, "x": "水を流すことができません。"}, {"t": 287.8333333333333, "x": "広い範囲から集まってくる水を、出しきれないのです。"}, {"t": 291.51666666666665, "x": "出しきれない水が盆地にたまって、湖になっています。"}, {"t": 295.4, "x": "滋賀県の資料は、琵琶湖のでき方をこう説明しています。"}, {"t": 299.45, "x": "水が集まる盆地と、狭い出口。"}, {"t": 302.1333333333333, "x": "この形があるから、水がたまるのです。"}, {"t": 304.9166666666667, "x": "けれども、それだけでは湖は続きません。"}, {"t": 308.06666666666666, "x": "川は水だけでなく、土や砂も運んできます。"}, {"t": 311.48333333333335, "x": "湖の岸には、川が運んだ土砂で三角州が広がっていきます。"}, {"t": 316.1, "x": "放っておけば、湖はやがて土砂で埋まってしまいます。"}, {"t": 319.9, "x": "湖が何十万年も続くにはどうすればよいか。"}, {"t": 323.23333333333335, "x": "底が、埋まる速さ以上に下がり続ければよいのです。"}, {"t": 327.05, "x": "では、何が底を下げているのか。"}, {"t": 329.6, "x": "滋賀県の資料は、それを断層の運動だとしています。"}, {"t": 333.43333333333334, "x": "断層とは、大地の割れ目です。"}, {"t": 335.9, "x": "割れ目をはさんで片側の大地がずれ動きます。"}, {"t": 338.81666666666666, "x": "片側が持ち上がれば、もう片側は相対的に下がります。"}, {"t": 343.0, "x": "下がった側に、窪みができます。"}, {"t": 345.53333333333336, "x": "窪みに水がたまり、湖になります。"}, {"t": 348.46666666666664, "x": "断層が動き続けるかぎり、窪みは深くなり続けます。"}, {"t": 352.3833333333333, "x": "土砂が積もっても、そのぶん底が下がっていきます。"}, {"t": 355.76666666666665, "x": "では、その断層が動かなくなったらどうなるでしょうか。"}, {"t": 359.43333333333334, "x": "窪みは深くならなくなります。"}, {"t": 361.35, "x": "流れこむ土砂が、少しずつ窪みを埋めていきます。"}, {"t": 364.8666666666667, "x": "湖は浅くなります。湿地になり、やがて陸になります。"}, {"t": 369.1666666666667, "x": "そのかわりに、別の場所の断層が動きはじめたら。"}, {"t": 372.71666666666664, "x": "今度はそちらに、新しい窪みができます。"}, {"t": 375.85, "x": "水は新しい窪みにたまり、そこが湖になります。"}, {"t": 379.6333333333333, "x": "湖が移動するというのは、この入れかわりのことです。"}, {"t": 383.21666666666664, "x": "これが本当に起きたのかどうか。"}, {"t": 385.28333333333336, "x": "その答えは、湖のまわりの丘の中に残っていました。"}, {"t": 389.2, "x": "湖の底には、毎年少しずつ泥や砂がたまっていきます。"}, {"t": 393.48333333333335, "x": "細かい粘土。川が運んだ砂。ときには山から流れた石。"}, {"t": 397.8, "x": "火山の灰が降れば、その灰も一枚の層になって積もります。"}, {"t": 401.96666666666664, "x": "こうして湖の底には、何枚もの地層が重なっていきます。"}, {"t": 406.1333333333333, "x": "湖が消えたあとも、この地層は地面の下に残ります。"}, {"t": 410.0833333333333, "x": "琵琶湖のまわりの丘や川の岸の崖。"}, {"t": 412.56666666666666, "x": "そこに、そうした地層が顔を出しています。"}, {"t": 415.55, "x": "これらの地層をまとめて、古琵琶湖層群と呼びます。"}, {"t": 419.05, "x": "昔の琵琶湖が残した地層の集まり、という意味です。"}, {"t": 422.78333333333336, "x": "古琵琶湖層群は広い範囲にあります。"}, {"t": 425.31666666666666, "x": "湖の南の丘から三重県の伊賀市のあたりまでです。"}, {"t": 428.8, "x": "地層の中身を見れば、昔の水辺の様子がわかります。"}, {"t": 432.73333333333335, "x": "細かい粘土が厚く積もっていれば静かで深い水の底です。"}, {"t": 436.5, "x": "砂や小石が混ざっていれば、"}, {"t": 438.3833333333333, "x": "そこは川の流れのある場所でした。"}, {"t": 440.85, "x": "植物の根や倒れた木が埋もれていれば、そこは湿地でした。"}, {"t": 444.9166666666667, "x": "地層に挟まった火山の灰は、年代を決める目印になります。"}, {"t": 449.26666666666665, "x": "同じ噴火の灰は遠く離れた場所の地層にも挟まっています。"}, {"t": 453.15, "x": "その灰をたどれば離れた地層の年代を結びつけられます。"}, {"t": 456.73333333333335, "x": "こうして調べていくと、あることがわかりました。"}, {"t": 459.8833333333333, "x": "古琵琶湖層群のいちばん古い地層は伊賀市にあります。"}, {"t": 463.21666666666664, "x": "その年代は、およそ440万年前です。"}, {"t": 466.9, "x": "さらに調べると、400万年前の地層が見つかります。"}, {"t": 471.0, "x": "それは湖の沖合でできる地層でした。"}, {"t": 473.73333333333335, "x": "沖合でできる地層があるなら、"}, {"t": 475.56666666666666, "x": "そこには広い水がありました。"}, {"t": 477.75, "x": "岸から離れた沖があったということです。"}, {"t": 480.28333333333336, "x": "そこで、初めの湖はこう考えられています。"}, {"t": 483.76666666666665, "x": "伊賀市にできた、およそ400万年前の湖です。"}, {"t": 487.55, "x": "地層は、下から上へ積み重なります。"}, {"t": 490.4166666666667, "x": "古い地層は伊賀市のあたりにあります。"}, {"t": 492.76666666666665, "x": "新しい地層は、より北のほうにあります。"}, {"t": 495.9, "x": "湖がずっと同じ場所にあったとしたら。"}, {"t": 498.5, "x": "古い地層も新しい地層も同じ場所に重なっているはずです。"}, {"t": 502.3833333333333, "x": "ところが実際は違います。年代が"}, {"t": 504.81666666666666, "x": "新しくなるほど、地層のある"}, {"t": 506.9166666666667, "x": "場所が北へずれていきます。"}, {"t": 508.51666666666665, "x": "これが、湖が移動してきたことを示す大きな手がかりです。"}, {"t": 512.6666666666666, "x": "もうひとつ手がかりがあります。"}, {"t": 514.4666666666667, "x": "今の琵琶湖の湖の底にも、泥がたまり続けています。"}, {"t": 518.4333333333333, "x": "その泥の年代は、丘に残る古琵琶湖層群の"}, {"t": 521.7666666666667, "x": "年代とつながっています。湖の底の泥と丘の地層。"}, {"t": 525.4333333333333, "x": "2つはひとつながりの記録だと考えられているのです。"}, {"t": 528.6833333333333, "x": "およそ400万年ぶんの水辺の記録。"}, {"t": 531.35, "x": "それが場所をずらしながら、"}, {"t": 532.95, "x": "ほぼ途切れずに残っているのです。"}, {"t": 535.2, "x": "研究者たちはこうした記録をもとに、"}, {"t": 537.5333333333333, "x": "湖の歩みを8つの段階に分けました。"}, {"t": 540.6, "x": "次の章から、その段階を古いほうから"}, {"t": 543.5333333333333, "x": "順にたどっていきます。8つの段階の、"}, {"t": 546.1166666666667, "x": "いちばん初めから見ていきます。"}, {"t": 548.2666666666667, "x": "およそ400万年前から320万年前。"}, {"t": 551.7833333333333, "x": "今の三重県伊賀市のあたりに、湖がありました。"}, {"t": 555.2333333333333, "x": "この湖は、大山田湖と呼ばれています。"}, {"t": 558.3833333333333, "x": "滋賀県の資料は、この湖を浅くて狭い湖と書いています。"}, {"t": 562.9666666666667, "x": "今の琵琶湖のような、深くて"}, {"t": 564.9833333333333, "x": "大きな湖ではありませんでした。"}, {"t": 567.1333333333333, "x": "伊賀のあたりの大地が沈んでできた窪み。"}, {"t": 569.7, "x": "そこに水がたまった湖です。"}, {"t": 571.8333333333334, "x": "このころの地層からは、たくさんの化石が"}, {"t": 574.6666666666666, "x": "見つかっています。化石は、昔の"}, {"t": 576.8666666666667, "x": "水辺の様子を教えてくれる手がかりです。"}, {"t": 579.65, "x": "地層からは、大きな動物の足跡も見つかっています。"}, {"t": 583.4666666666667, "x": "足跡は、そこがぬかるんだ岸辺だったことを示しています。"}, {"t": 587.45, "x": "骨が残らない場所でも、足跡だけは残ることがあります。"}, {"t": 591.4666666666667, "x": "足跡は、まちがいなくその場所を歩いた跡です。"}, {"t": 594.95, "x": "大山田湖の地層からは、ワニの骨や歯も見つかっています。"}, {"t": 598.9333333333333, "x": "暖かい水辺だったことがうかがえます。"}, {"t": 601.3, "x": "滋賀県の資料はこう書いています。"}, {"t": , {"t": 1195.5, "x": "西側が持ち上がるなら、東側は相対的に下がります。"}, {"t": 1199.6666666666667, "x": "東側には、琵琶湖があります。"}, {"t": 1202.2, "x": "湖の西の岸の山々は、持ち上がる側にあります。"}, {"t": 1206.1, "x": "湖の底は、下がる側にあります。"}, {"t": 1208.9333333333334, "x": "ずれの速さも見積もられています。"}, {"t": 1211.05, "x": "北の区間では、上下のずれの"}, {"t": 1213.2166666666667, "x": "平均の速さが見積もられています。"}, {"t": 1215.4166666666667, "x": "千年あたりおよそ1.7メートルから2.0メートルです。"}, {"t": 1219.4, "x": "南の区間では、千年あたりおよそ1.3メートル。"}, {"t": 1223.3, "x": "地震調査委員会は、どちらも可能性として示しています。"}, {"t": 1227.5, "x": "千年で2メートル足らず。人の一生では、"}, {"t": 1230.3833333333334, "x": "ほとんど気づかない動きです。"}, {"t": 1232.5, "x": "けれどもこの速さが10万年続いたとします。"}, {"t": 1235.4666666666667, "x": "すると170メートルから200メートルになる計算です。"}, {"t": 1239.2333333333333, "x": "ただしこのずれは、毎年少しずつ起きるのではありません。"}, {"t": 1243.05, "x": "断層は、ふだんはじっとしています。"}, {"t": 1245.75, "x": "そして、地震のときに一度に大きくずれます。"}, {"t": 1248.9666666666667, "x": "南の区間の最も新しい活動は"}, {"t": 1251.4166666666667, "x": "1185年の地震だった可能性があります。"}, {"t": 1254.7166666666667, "x": "地震調査委員会の評価です。"}, {"t": 1256.9666666666667, "x": "そのとき断層の西側は東側に対して持ち上がりました。"}, {"t": 1260.8166666666666, "x": "その高さは、6メートルから7メートルほどだった"}, {"t": 1264.1, "x": "可能性があるとされています。"}, {"t": 1265.8666666666666, "x": "北の区間の最も新しい活動はもっと古い時代です。"}, {"t": 1269.55, "x": "およそ2800年前から2500年前のあいだだった"}, {"t": 1273.2333333333333, "x": "可能性があります。そのとき西側が"}, {"t": 1275.3833333333334, "x": "3メートルから5メートルほど"}, {"t": 1277.2666666666667, "x": "持ち上がった可能性があるとされています。"}, {"t": 1279.7166666666667, "x": "こうした大きなずれが何度も積み重なりました。"}, {"t": 1282.5166666666667, "x": "そうして湖の窪みは深くなってきたと考えられます。"}, {"t": 1285.9833333333333, "x": "一回ずつは、地震という出来事です。"}, {"t": 1288.9, "x": "けれども何十万年と積み重なれば"}, {"t": 1291.15, "x": "湖をひとつ保つ働きになります。"}, {"t": 1293.5, "x": "そしてその一回ずつの地震は、"}, {"t": 1295.6166666666666, "x": "湖の岸に暮らす人々にとって災害でした。"}, {"t": 1298.9333333333334, "x": "琵琶湖の湖の底には、人の暮らしの"}, {"t": 1301.75, "x": "跡がたくさん沈んでいます。"}, {"t": 1303.4666666666667, "x": "2024年にまとめられた研究の報告があります。"}, {"t": 1307.0833333333333, "x": "それによるとこうです。琵琶湖では、90から100か所の"}, {"t": 1311.0333333333333, "x const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
