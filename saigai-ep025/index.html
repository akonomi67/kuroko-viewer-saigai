<script>
const D={"name": "ep025", "file": "ep025", "dur": 1861.8333125, "segs": [], "subs": [{"t": 0.0, "x": "いま私たちが生きている時代には、名前があります。"}, {"t": 3.45, "x": "人が決めた暦の名前ではありません。"}, {"t": 5.933333333333334, "x": "地球の歴史に引かれた線としての名前です。"}, {"t": 8.816666666666666, "x": "その名前をメガラヤン期といいます。"}, {"t": 11.1, "x": "始まりはいまからおよそ4200年前です。"}, {"t": 14.183333333333334, "x": "この線を引くきっかけになったのは、一つの干ばつでした。"}, {"t": 17.916666666666668, "x": "地中海の東からインドにかけての広い土地です。"}, {"t": 21.05, "x": "そこで雨が減りました。川の水が細りました。"}, {"t": 24.3, "x": "風が砂ぼこりを運びました。"}, {"t": 26.266666666666666, "x": "北メソポタミアでは、大きな町から人が去りました。"}, {"t": 29.9, "x": "ナイル川のほとりでは王の国が揺らぎました。"}, {"t": 32.75, "x": "インダス川の流域でも、雨の少ない年が重なりました。"}, {"t": 36.8, "x": "その乾きの跡は、インド北東部の洞窟にも残っていました。"}, {"t": 41.083333333333336, "x": "一本の石の柱に刻まれていたのです。2018年のことです。"}, {"t": 45.6, "x": "地質学の国際的な組織が、その石の柱を選びました。"}, {"t": 49.85, "x": "時代の境目の見本としてです。"}, {"t": 52.11666666666667, "x": "年表の線は、ふつう何百万年という単位で引かれます。"}, {"t": 56.31666666666667, "x": "生き物が大きく入れかわった跡などが使われます。"}, {"t": 59.43333333333333, "x": "ところが今回は数百年の乾きが選ばれました。"}, {"t": 62.666666666666664, "x": "しかも、人が文字を書いていた時代の出来事です。"}, {"t": 65.98333333333333, "x": "けれども、この決定には今も反対の声があります。"}, {"t": 69.63333333333334, "x": "本当に地球全体の出来事だったのか。"}, {"t": 72.3, "x": "国が倒れたのは本当に雨のせいだったのか。"}, {"t": 75.25, "x": "研究者のあいだで答えは割れています。"}, {"t": 77.75, "x": "この回の主語は空です。空から"}, {"t": 79.78333333333333, "x": "降る雨があるとき減りました。"}, {"t": 81.81666666666666, "x": "そのことがどうやって石に残ったのか。"}, {"t": 84.2, "x": "どうやって時代の名前になったのか。"}, {"t": 86.36666666666666, "x": "そして、その名前にどんな疑問が向けられているのか。"}, {"t": 89.93333333333334, "x": "順番に見ていきます。地球の歴史は、"}, {"t": 92.46666666666667, "x": "箱を重ねるように区切られています。"}, {"t": 95.01666666666667, "x": "大きな箱の中に小さな箱が入っています。"}, {"t": 97.93333333333334, "x": "いちばん新しい大きな箱は新生代です。"}, {"t": 100.93333333333334, "x": "その中に第四紀という箱があります。"}, {"t": 103.4, "x": "第四紀は、さらに二つに分かれます。"}, {"t": 106.2, "x": "氷の時代をくり返した更新世と、そのあとの完新世です。"}, {"t": 110.78333333333333, "x": "完新世は、最後の氷期が終わったところから始まります。"}, {"t": 114.83333333333333, "x": "いまからおよそ1万1700年前です。"}, {"t": 117.65, "x": "農業が広まったのも完新世です。"}, {"t": 120.21666666666667, "x": "町ができたのも、文字が生まれたのも完新世です。"}, {"t": 123.8, "x": "人の歴史の大部分は、この箱の中に入っています。"}, {"t": 127.53333333333333, "x": "ピラミッドも完新世の出来事です。"}, {"t": 129.95, "x": "稲作も完新世の出来事です。"}, {"t": 132.21666666666667, "x": "完新世という言葉の意味は「すっかり新しい」です。"}, {"t": 136.88333333333333, "x": "19世紀のフランスの研究者が使いはじめました。"}, {"t": 140.26666666666668, "x": "完新世の始まりの位置は、2008年に正式に決まりました。"}, {"t": 144.7, "x": "グリーンランドの氷の中の一点です。"}, {"t": 147.23333333333332, "x": "ところが、完新世の中は長いあいだ"}, {"t": 149.95, "x": "区切られていませんでした。"}, {"t": 151.38333333333333, "x": "研究者は、前期、中期、後期という言葉を使っていました。"}, {"t": 156.43333333333334, "x": "けれどもどこからどこまでが中期なのか。"}, {"t": 158.81666666666666, "x": "決まった約束はありませんでした。"}, {"t": 161.0, "x": "人によって、線の位置が少しずつ違っていたのです。"}, {"t": 164.63333333333333, "x": "理由の一つは、完新世が落ち着いた時代だったことです。"}, {"t": 168.6, "x": "氷の時代と暖かい時代が入れかわることはありません。"}, {"t": 171.96666666666667, "x": "地球全体で同時に起きた大きな変化が、"}, {"t": 174.73333333333332, "x": "見つけにくかったのです。2010年のことです。"}, {"t": 178.01666666666668, "x": "研究者の作業部会がこの問題に取り組みはじめました。"}, {"t": 181.56666666666666, "x": "氷の記録、海の記録、陸の記録を読む専門家たちです。"}, {"t": 186.21666666666667, "x": "2012年には、考え方をまとめた論文が出されました。"}, {"t": 190.41666666666666, "x": "完新世を三つに分ける。それぞれの"}, {"t": 193.08333333333334, "x": "境目には、年代のよく分かる目印を置く。"}, {"t": 196.23333333333332, "x": "目印にするのは、広い範囲で"}, {"t": 198.48333333333332, "x": "記録された急な気候の変化です。候補は二つありました。"}, {"t": 202.25, "x": "一つはおよそ8200年前の寒さの戻りです。"}, {"t": 205.73333333333332, "x": "もう一つがおよそ4200年前の乾きでした。"}, {"t": 209.05, "x": "目に見える地層の変わり目ではありません。"}, {"t": 211.5, "x": "空の変化が、時代の目印に選ばれようとしていたのです。"}, {"t": 215.61666666666667, "x": "地質学では、時代の境目を言葉だけでは決めません。"}, {"t": 219.51666666666668, "x": "世界のどこか一か所に境目の見本を置きます。"}, {"t": 222.65, "x": "その見本は国際境界模式層断面と呼ばれます。"}, {"t": 226.21666666666667, "x": "多くの場合見本は地層の崖です。"}, {"t": 228.6, "x": "崖のある高さに印をつけます。"}, {"t": 230.9, "x": "ここから上が新しい時代だと決めるのです。"}, {"t": 233.65, "x": "世界中の地層は、この見本と見比べて時代を判断します。"}, {"t": 237.95, "x": "だから見本は、年代がよく分かる"}, {"t": 240.48333333333332, "x": "場所でなければなりません。"}, {"t": 241.96666666666667, "x": "ほかの土地と比べやすいことも大切です。"}, {"t": 244.55, "x": "完新世の始まりの見本は、崖ではありませんでした。"}, {"t": 248.43333333333334, "x": "グリーンランドの氷床を掘りぬいた、氷の柱です。"}, {"t": 252.18333333333334, "x": "氷は一年ごとに層を重ねます。"}, {"t": 254.6, "x": "数えていけば年代が分かります。"}, {"t": 256.8, "x": "2018年の区分では、三つの時代に名前がつきました。"}, {"t": 261.01666666666665, "x": "最初がグリーンランディアン期です。"}, {"t": 263.1, "x": "1万1700年前から始まります。"}, {"t": 265.78333333333336, "x": "見本はグリーンランドの氷の柱です。"}, {"t": 268.4, "x": "次がノースグリッピアン期です。"}, {"t": 270.3666666666667, "x": "およそ8200年前から始まります。"}, {"t": 273.06666666666666, "x": "見本は同じグリーンランドの別の氷の柱です。"}, {"t": 276.3, "x": "目印は氷の中の酸の層です。"}, {"t": 278.76666666666665, "x": "寒さの戻りの最中に積もった層です。"}, {"t": 281.48333333333335, "x": "アイスランドの火山から来たとみられています。"}, {"t": 284.0833333333333, "x": "名前は、その氷を掘った計画の名前から取られました。"}, {"t": 288.0, "x": "そして三つめがメガラヤン期です。"}, {"t": 290.15, "x": "見本はインド北東部の洞窟の石の柱です。"}, {"t": 293.3, "x": "提案は国際層序委員会で認められました。"}, {"t": 296.35, "x": "そして2018年6月14日。"}, {"t": 299.01666666666665, "x": "国際地質科学連合の執行委員会が、"}, {"t": 302.03333333333336, "x": "全員一致で承認しました。三つの"}, {"t": 304.68333333333334, "x": "境目には共通点があります。"}, {"t": 306.96666666666664, "x": "どれも生き物の化石では決めていません。"}, {"t": 309.45, "x": "氷や石の中の物理と化学の目印で決めています。"}, {"t": 312.8833333333333, "x": "論文はこう書いています。これらは"}, {"t": 315.35, "x": "地質の年表の中で最も細かく"}, {"t": 317.3666666666667, "x": "年代の分かる境目かもしれない。"}, {"t": 319.4166666666667, "x": "新しい時代の名前は、すぐに世界中で報じられました。"}, {"t": 323.4166666666667, "x": "ここで、年代の数え方を一つだけ断っておきます。"}, {"t": 327.2, "x": "4200年前という数字は、"}, {"t": 329.4166666666667, "x": "1950年を起点にした数え方です。"}, {"t": 332.75, "x": "ところが氷の記録は、2000年を起点に数えています。"}, {"t": 336.65, "x": "そこで公式の数字も、2000年起点にそろえられました。"}, {"t": 340.56666666666666, "x": "そのため、メガラヤン期の始まりは"}, {"t": 343.06666666666666, "x": "4250年前と書かれています。"}, {"t": 345.71666666666664, "x": "どちらも同じ一点を指しています。"}, {"t": 348.0, "x": "補助の見本も決められました。"}, {"t": 349.81666666666666, "x": "カナダのローガン山で掘られた氷の柱です。"}, {"t": 352.73333333333335, "x": "インドの石の柱だけに頼らないためです。"}, {"t": 355.4166666666667, "x": "遠く離れた北米の氷でも、同じ境目を"}, {"t": 358.5833333333333, "x": "確かめられるようにしたのです。"}, {"t": 360.35, "x": "この決定を伝えた論文があります。"}, {"t": 362.8, "x": "そこには13人の名前が並んでいます。"}, {"t": 365.6, "x": "その中には、のちほど登場する考古学者の名前もあります。"}, {"t": 369.76666666666665, "x": "4200年前の乾きを、最初に強く唱えた人です。"}, {"t": 373.96666666666664, "x": "メガラヤ州はインドの北東のはしにあります。"}, {"t": 376.8333333333333, "x": "南はバングラデシュと接しています。"}, {"t": 379.15, "x": "州の中心は標高の高い台地です。"}, {"t": 381.9166666666667, "x": "夏になると、インド洋から湿った風が吹きつけます。"}, {"t": 385.5833333333333, "x": "その風が台地にぶつかり、大量の雨を降らせます。"}, {"t": 389.3, "x": "この地域は、地球でもっとも雨の多い"}, {"t": 392.2, "x": "場所の一つとされています。"}, {"t": 393.8, "x": "台地の南のはしにソーラという町があります。"}, {"t": 396.73333333333335, "x": "チェラプンジという名前でも知られる町です。"}, {"t": 399.35, "x": "州都のシロンから南東におよそ58キロ。"}, {"t": 402.45, "x": "バングラデシュとの国境からは、北へおよそ15キロです。"}, {"t": 406.31666666666666, "x": "このあたりの地下には石灰岩の層があります。"}, {"t": 409.25, "x": "石灰岩は雨水にゆっくり溶けます。"}, {"t": 411.8833333333333, "x": "長い年月のあいだに、地下には洞窟がいくつもできました。"}, {"t": 415.93333333333334, "x": "その一つがマウムルー洞窟です。"}, {"t": 418.1166666666667, "x": "長さはおよそ7キロあります。"}, {"t": 420.1333333333333, "x": "洞窟の上には、30メートルから"}, {"t": 422.71666666666664, "x": "100メートルの岩がのっています。"}, {"t": 424.6666666666667, "x": "天井からはしずくが落ちてきます。"}, {"t": 426.85, "x": "しずくには、岩から溶け出した成分がふくまれています。"}, {"t": 430.6333333333333, "x": "床に落ちたしずくから、その成分が少しずつ固まります。"}, {"t": 434.6333333333333, "x": "それが積み重なって、下から上へ伸びる"}, {"t": 437.45, "x": "石の柱ができます。これを石筍と呼びます。"}, {"t": 440.56666666666666, "x": "タケノコのように伸びる石という意味です。"}, {"t": 442.98333333333335, "x": "石筍は下から上へ育ちます。"}, {"t": 445.21666666666664, "x": "下のほうが古く上のほうが新しい。"}, {"t": 447.78333333333336, "x": "一本の石筍はその場所の長い記録になります。"}, {"t": 451.0, "x": "雨の多い年と少ない年の違いも、"}, {"t": 453.3666666666667, "x": "成分のわずかな差として残ります。"}, {"t": 455.8666666666667, "x": "マウムルー洞窟には、たくさんの石筍があります。"}, {"t": 459.3666666666667, "x": "その中で、最初に長い記録が発表されたものがありました。"}, {"t": 463.51666666666665, "x": "ケーエム・エーと名づけられた一本です。"}, {"t": 465.9, "x": "長さはおよそ30センチです。"}, {"t": 468.1, "x": "片手で持てそうなほどの小さな石の柱です。"}, {"t": 471.06666666666666, "x": "その中には、最後の氷期の終わりごろからの"}, {"t": 474.1, "x": "記録が入っていました。石筍が育つのを"}, {"t": 476.93333333333334, "x": "やめたのは、およそ3600年前です。"}, {"t": 479.78333333333336, "x": "4200年前の前後は、すっぽり中にふくまれていました。"}, {"t": 483.98333333333335, "x": "雨が多いことで知られる土地です。"}, {"t": 486.1166666666667, "x": "その土地の石が、雨の減った時代を覚えていたのです。"}, {"t": 489.8833333333333, "x": "石筍が雨を覚えるしくみは酸素にあります。"}, {"t": 492.9166666666667, "x": "酸素には重さのわずかに違う種類があります。"}, {"t": 495.98333333333335, "x": "軽い酸素と少し重い酸素です。"}, {"t": 498.31666666666666, "x": "雨の水にはその両方がまじっています。"}, {"t": 500.96666666666664, "x": "この地域では、季節風の雨が"}, {"t": 503.4, "x": "減ると重い酸素の割合が上がります。"}, {"t": 505.75, "x": "その割合が石筍の層ごとに残ります。"}, {"t": 508.55, "x": "研究者は、石筍を縦に切り、細かい間隔で粉を取りました。"}, {"t": 513.4833333333333, "x": "一つ一つの粉の酸素を測っていきます。"}, {"t": 516.2, "x": "ケーエム・エーの場合、その間隔はおよそ5年以下でした。"}, {"t": 520.1333333333333, "x": "5年ごとの雨の記録が、何千年分も並んだのです。"}, {"t": 524.0833333333334, "x": "年代は、石筍にわずかにふくまれるウランで決めます。"}, {"t": 527.8666666666667, "x": "ウランは、決まった速さで別の元素に変わっていきます。"}, {"t": 531.6166666666667, "x": "変わった割合を測れば、層が"}, {"t": 533.9166666666666, "x": "できてからの年数が分かります。"}, {"t": 535.8333333333334, "x": "ケーエム・エーでは、12か所の年代が測られました。"}, {"t": 539.3666666666667, "x": "4200年前に近い二つの年代は、"}, {"t": 542.2166666666667, "x": "誤差が20年と30年でした。"}, {"t": 544.7166666666667, "x": "この時期の石筍は、ほぼ一定の速さで育っていました。"}, {"t": 548.6, "x": "そのことも年代の確かさを支えています。"}, {"t": 551.3166666666667, "x": "数千年前の出来事を、数十年の幅で言える精度です。"}, {"t": 555.5666666666667, "x": "では、その記録には何が書かれていたのでしょうか。"}, {"t": 559.0166666666667, "x": "まず1万2000年前から6000年前ごろまで。"}, {"t": 562.2166666666667, "x": "この間、季節風は強まっていきました。"}, {"t": 565.25, "x": "そのあと季節風はゆっくり弱まりはじめます。"}, {"t": 568.25, "x": "そして4303年前。重い酸素の割合が一段上がりました。"}, {"t": 573.15, "x": "少しおいてもう一段上がりました。"}, {"t": 575.45, "x": "その変化が終わるのは3888年前です。"}, {"t": 579.3166666666667, "x": "始まりから終わりまで415年。"}, {"t": 581.8333333333334, "x": "特に雨が少なかったのは、4071年前からの"}, {"t": 585.7833333333333, "x": "183年間でした。研究者は、季節風の雨が2割から"}, {"t": 590.5166666666667, "x": "3割減ったと見積もっています。"}, {"t": 592.4833333333333, "x": "世界有数の雨の土地で、雨が2割から3割減ったのです。"}, {"t": 596.95, "x": "境目の位置は二つの段の中間に置かれました。"}, {"t": 600.1166666666667, "x": "一段めはおよそ4300年前。"}, {"t": 602.8333333333334, "x": "二段めはおよそ4100年前。"}, {"t": 605.25, "x": "その真ん中の4200年前に、"}, {"t": 607.6333333333333, "x": "新しい時代の線が引かれました。"}, {"t": 610.0666666666667, "x": "この石筍には別の変化も見えています。"}, {"t": 612.7333333333333, "x": "8200年前の寒さの戻りです。"}, {"t": 615.3666666666667, "x": "そちらも酸素の割合の振れとして残っていました。"}, {"t": 618.4666666666667, "x": "一本の石が二つの境目を覚えていたのです。"}, {"t": 621.5833333333334, "x": "原因はまだよく分かっていません。"}, {"t": 623.7666666666667, "x": "雨を降らせる帯が、南へずれたという考えがあります。"}, {"t": 627.7333333333333, "x": "北大西洋の海が冷えたという考えもあります。"}, {"t": 630.85, "x": "太平洋の海の状態が変わったという考えもあります。"}, {"t": 634.4, "x": "2018年の論文も、原因は"}, {"t": 637.2166666666667, "x": "よく分かっていないと書いています。"}, {"t": 639.1166666666667, "x": "この石筍は、インド北部の研究所で"}, {"t": 641.9666666666667, "x": "保管されることになりました。"}, {"t": 643.5833333333334, "x": "時代の境目の見本はふつう崖や氷の柱です。"}, {"t": 647.15, "x": "博物館で展示できる見本は、"}, {"t": 649.3, "x": "これが初めてだとされています。"}, {"t": 651.4833333333333, "x": "棚に置ける大きさの時代の境目です。"}, {"t": 654.0333333333333, "x": "ここで時間を少し戻します。4200年前の乾き。"}, {"t": 658.05, "x": "それに最初に強い光を当てたのは、遺跡を掘る人でした。"}, {"t": 662.1, "x": "シリアの北東部に、テル・レイランという丘があります。"}, {"t": 665.7666666666667, "x": "テルとは、昔の町の跡が積み重なってできた丘のことです。"}, {"t": 669.8666666666667, "x": "アメリカの大学の考古学者、ハーヴェイ・ワイスさん。"}, {"t": 673.4666666666667, "x": "その調査隊が、1970年代の"}, {"t": 676.6666666666666, "x": "終わりからこの丘を掘っていました。"}, {"t": 678.5833333333334, "x": "ここにはかつて大きな町がありました。"}, {"t": 680.9166666666666, "x": "まわりの平原は、雨だけで麦を育てられる土地でした。"}, {"t": 684.7833333333333, "x": "川の水を引かなくても、冬の雨で畑がうるおいます。"}, {"t": 688.65, "x": "その代わり雨が減ればすぐに収穫に響きます。"}, {"t": 691.8, "x": "発掘を進めると、町が一度空っぽになっていたことが"}, {"t": 695.5666666666667, "x": "分かりました。人が暮らしたのは"}, {"t": 697.7333333333333, "x": "紀元前2700年ごろからです。"}, {"t": 699.9166666666666, "x": "それが紀元前2200年ごろまで続きました。"}, {"t": 703.0833333333334, "x": "そのあと、およそ300年、人の気配が消えます。"}, {"t": 707.15, "x": "人がまた住みはじめるのは、紀元前1900年ごろです。"}, {"t": 711.25, "x": "空白の時期の土は、それまでとはまるで違っていました。"}, {"t": 715.0333333333333, "x": "風で運ばれた細かい土がつもっていたのです。"}, {"t": 717.95, "x": "その土には、ミミズが土を耕した跡が"}, {"t": 720.95, "x": "ほとんどありませんでした。"}, {"t": 722.4333333333333, "x": "生き物が住みにくいほど、乾いた土だったと考えられます。"}, {"t": 726.4166666666666, "x": "1993年のことです。ワイスさんたちは"}, {"t": 729.4333333333333, "x": "科学雑誌サイエンスに論文を出しました。"}, {"t": 732.45, "x": "紀元前2200年ごろ、この地域で急に乾燥が強まった。"}, {"t": 736.9666666666667, "x": "風も強くなった。その変化が"}, {"t": 739.0166666666667, "x": "町の放棄と人の流出につながった。"}, {"t": 741.5333333333333, "x": "南メソポタミアのアッカドの国が"}, {"t": 743.5833333333334, "x": "崩れたことにも、関わっていた。"}, {"t": 745.85, "x": "そういう内容です。アッカドは、メソポタミアの広い"}, {"t": 749.6, "x": "範囲を一つにまとめた国でした。"}, {"t": 751.5833333333334, "x": "国の広がりはペルシャ湾から川の上流まで及びました。"}, {"t": 755.15, "x": "けれども栄えた期間は短いものでした。"}, {"t": 757.8166666666667, "x": "百年足らずだったとされています。"}, {"t": 760.0, "x": "北の雨で育つ麦畑も、その支配の下にありました。"}, {"t": 763.9833333333333, "x": "論文は火山の噴火にも触れていました。"}, {"t": 766.6, "x": "乾燥が始まる前に噴火があったというのです。"}, {"t": 769.6166666666667, "x": "土の中に、ごく薄い火山灰の層があったからです。"}, {"t": 773.3833333333333, "x": "けれども噴火を原因とする考えは、のちに外れていきます。"}, {"t": 777.5166666666667, "x": "説明の中心ではなくなったのです。"}, {"t": 779.9666666666667, "x": "ワイスさん自身の考えも、その後変わっていきました。"}, {"t": 783.6166666666667, "x": "発表当時の同業者の反応はどうだったか。"}, {"t": 786.65, "x": "「信じられない」というものだったそうです。"}, {"t": 789.5333333333333, "x": "地域の大きな国が急な気候の変化で揺らぐ。"}, {"t": 792.5333333333333, "x": "そういう考え方はまだ珍しかったのです。"}, {"t": 795.4166666666666, "x": "けれども、この丘の土だけでは、"}, {"t": 797.7, "x": "乾きの広がりは分かりません。"}, {"t": 799.9333333333333, "x": "一つの町が空っぽになった理由は、ほかにもありえます。"}, {"t": 803.6833333333333, "x": "乾きは本当にあったのか。それを"}, {"t": 806.0666666666667, "x": "確かめるには、遺跡の外の記録が必要でした。"}, {"t": 809.4, "x": "2000年のことです。別の研究班が"}, {"t": 811.8, "x": "海の底からこの問いに答えようとしました。"}, {"t": 814.6333333333333, "x": "目をつけたのはオマーン湾です。"}, {"t": 816.6, "x": "アラビア半島とイランのあいだにある海です。"}, {"t": 819.3166666666667, "x": "夏のメソポタミアの平原には、北西の風が吹きます。"}, {"t": 823.1333333333333, "x": "その風に乗った砂ぼこりは、オマーン湾に落ちます。"}, {"t": 826.75, "x": "そして海の底にたまります。"}, {"t": 828.6166666666667, "x": "研究班は、水深2732メートルの"}, {"t": 832.3666666666667, "x": "海底から泥の柱を引き上げました。"}, {"t": 834.65, "x": "注目したのはドロマイトという鉱物です。"}, {"t": 837.3333333333334, "x": "メソポタミアの砂ぼこりには、"}, {"t": 839.1333333333333, "x": "この鉱物が多くふくまれています。"}, {"t": 841.6166666666667, "x": "泥の中のドロマイトが増えていたとします。"}, {"t": 844.15, "x": "それは砂ぼこりが多かったことを意味します。"}, {"t": 846.9666666666667, "x": "結果ははっきりしていました。"}, {"t": 848.8166666666667, "x": "ある層で、ドロマイトの割合が急に増えていたのです。"}, {"t": 852.5, "x": "それまでは重さで1.5パーセントほど。それが、"}, {"t": 855.7333333333333, "x": "多いところでは9パーセント近くになっていました。"}, {"t": 859.1, "x": "年代は、4025年前で、前後に125年の幅があります。"}, {"t": 864.6333333333333, "x": "砂ぼこりの多い状態は、およそ300年続いていました。"}, {"t": 868.8166666666667, "x": "この増え方は完新世の中でも特に大きなものでした。"}, {"t": 872.4166666666666, "x": "1万2900年前からの寒の戻りのころに近い大きさです。"}, {"t": 876.85, "x": "その寒の戻りは別の回で扱いました。"}, {"t": 879.5333333333333, "x": "ここでは大きさの比べ物として名前だけ出しておきます。"}, {"t": 882.95, "x": "研究班は砂ぼこりの出どころも確かめました。"}, {"t": 885.9833333333333, "x": "元素の種類の割合が、メソポタミアの土と"}, {"t": 889.1, "x": "同じだったのです。さらに、"}, {"t": 891.05, "x": "泥の中には薄い火山灰の層がありました。"}, {"t": 893.9, "x": "その成分は、テル・レイランで"}, {"t": 896.05, "x": "見つかった火山灰と合いました。"}, {"t": 897.9, "x": "遠い海の底とシリアの丘の土。"}, {"t": 900.1, "x": "その二つが同じ灰でつながったのです。"}, {"t": 902.6333333333333, "x": "研究班はこう結論しました。"}, {"t": 904.8666666666667, "x": "乾燥の始まりと町の放棄の年代は、"}, {"t": 907.45, "x": "誤差の範囲で区別できない。"}, {"t": 909.3833333333333, "x": "遺跡の土の話が、地域の空の話に広がった瞬間でした。"}, {"t": 913.9, "x": "2019年には、イランの山の"}, {"t": 916.45, "x": "洞窟の石筍からも記録が出ました。"}, {"t": 918.8166666666667, "x": "ここでは、マグネシウムの割合が"}, {"t": 921.2, "x": "砂ぼこりの目印になりました。"}, {"t": 923.1333333333333, "x": "砂ぼこりの出どころは、やはりメソポタミアの方角です。"}, {"t": 926.95, "x": "年代は25か所で測られ、誤差は平均31年でした。"}, {"t": 931.6666666666666, "x": "記録には、砂ぼこりの多い時期が二回ありました。"}, {"t": 935.1166666666667, "x": "一回めは4510年前に急に始まり、110年続きました。"}, {"t": 940.2833333333333, "x": "二回めは4260年前に急に始まり、290年続きました。"}, {"t": 945.85, "x": "二回めのほうが、規模が大きかったと考えられています。"}, {"t": 949.6, "x": "研究班は砂ぼこりの出方にも注目しました。"}, {"t": 952.7833333333333, "x": "増え方がゆるやかではなく急だったのです。"}, {"t": 955.4166666666666, "x": "乾きがある線を越えると砂ぼこりが一気に増える。"}, {"t": 958.6166666666667, "x": "この土地はそういう性質を持っていると考えられました。"}, {"t": 962.0333333333333, "x": "研究班は、二回めの始まりの時期に注目しました。"}, {"t": 965.8666666666667, "x": "北メソポタミアで町が放棄された時期と比べたのです。"}, {"t": 969.2666666666667, "x": "十年単位で見ても、大きな差はありませんでした。"}, {"t": 972.6666666666666, "x": "続いた長さも、町が空っぽだった期間とよく似ていました。"}, {"t": 976.6666666666666, "x": "研究班はもう一つのことも示しました。この地域の空は"}, {"t": 980.25, "x": "数百年も乾いたままでいられるということです。"}, {"t": 983.4, "x": "人の力ではなく、気候そのものの性質としてです。"}, {"t": 987.1666666666666, "x": "ここまでで見えてきたことがあります。"}, {"t": 989.2666666666667, "x": "メソポタミアのまわりの乾きは、"}, {"t": 991.2, "x": "かなり確かだということです。"}, {"t": 993.2166666666667, "x": "ではもっと遠くではどうだったのでしょうか。"}, {"t": 995.75, "x": "西のエジプトでも、同じころ、"}, {"t": 997.95, "x": "国が大きく揺らいでいました。"}, {"t": 999.9666666666667, "x": "ピラミッドを築いた古王国の時代が終わります。"}, {"t": 1002.9666666666667, "x": "王の力が弱まり各地に別々の力が立ちました。"}, {"t": 1006.4166666666666, "x": "第一中間期と呼ばれる時代です。"}, {"t": 1008.8166666666667, "x": "始まりは紀元前2181年ごろ。"}, {"t": 1011.9166666666666, "x": "終わりは紀元前2055年ごろとされています。"}, {"t": 1015.1833333333333, "x": "エジプトの暮らしは、ナイル川の"}, {"t": 1017.4666666666667, "x": "毎年の洪水に支えられていました。"}, {"t": 1019.7666666666667, "x": "洪水が畑に水と土を運び麦を育てます。"}, {"t": 1022.95, "x": "2003年のことです。ナイル川の"}, {"t": 1025.3833333333334, "x": "河口の三角州で掘られた泥の柱が調べられました。"}, {"t": 1028.6333333333334, "x": "泥にふくまれる元素の種類の割合を見ます。"}, {"t": 1031.4833333333333, "x": "すると、泥の出どころが分かります。"}, {"t": 1034.1, "x": "ナイル川には大きく二つの源があります。"}, {"t": 1037.05, "x": "赤道に近い湖から来る白ナイル。"}, {"t": 1039.6333333333334, "x": "そして、エチオピアの高原から来る青ナイルです。"}, {"t": 1043.1333333333334, "x": "調べた結果が出ました。4200年前ごろには、青ナイルの"}, {"t": 1047.7166666666667, "x": "泥の割合が大きくなっていました。"}, {"t": 1049.8166666666666, "x": "研究班は、雨が大きく減ったためだと考えました。"}, {"t": 1053.7166666666667, "x": "植物が少なくなり、土が削られやすくなったというのです。"}, {"t": 1057.7666666666667, "x": "そして、ナイル川の洪水と水量の変化を指摘しました。"}, {"t": 1061.8333333333333, "x": "それが古王国の崩れに一部関わったかも"}, {"t": 1064.4666666666667, "x": "しれない、としています。ただし、"}, {"t": 1067.0333333333333, "x": "   if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
