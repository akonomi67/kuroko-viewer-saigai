<script>
const D={"name": "ep027", "file": "ep027", "dur": 1889.6333125, "segs": [], "subs": [{"t": 0.0, "x": "鹿児島の南の海に、屋久島という島があります。"}, {"t": 3.65, "x": "山の斜面には千年をこえて生きる杉が立っています。"}, {"t": 7.133333333333334, "x": "屋久杉と呼ばれる木です。その幹を"}, {"t": 9.566666666666666, "x": "輪切りにすると、細い輪が何百本も並んでいます。"}, {"t": 13.066666666666666, "x": "一年に一本ずつ増えていく年輪です。"}, {"t": 15.783333333333333, "x": "その中の一本だけが、ほかと違っていました。"}, {"t": 18.933333333333334, "x": "西暦775年にできた輪です。"}, {"t": 21.8, "x": "見た目はとなりの輪と変わりません。"}, {"t": 23.916666666666668, "x": "色も幅もふつうの一年の輪です。"}, {"t": 26.266666666666666, "x": "違っていたのは、輪の中の炭素でした。"}, {"t": 29.066666666666666, "x": "炭素14という種類の炭素が、急に増えていたのです。"}, {"t": 33.016666666666666, "x": "増え方はおよそ千分の十二です。"}, {"t": 35.4, "x": "数字だけ見ると、小さく見えます。"}, {"t": 38.0, "x": "けれども太陽のふだんの変化で"}, {"t": 39.85, "x": "起きる増え方の、およそ20倍でした。"}, {"t": 42.55, "x": "しかもたった一年のあいだに起きています。"}, {"t": 45.083333333333336, "x": "炭素14は地面の上ではつくられません。"}, {"t": 47.86666666666667, "x": "空の高いところで生まれます。"}, {"t": 49.81666666666667, "x": "宇宙から来た粒子が、空気にぶつかってできるのです。"}, {"t": 53.43333333333333, "x": "775年のころ、地球の空に"}, {"t": 56.36666666666667, "x": "何かが大量に降ったことになります。"}, {"t": 58.56666666666667, "x": "その年、地上で大きな被害が出た記録はありません。"}, {"t": 62.28333333333333, "x": "人が倒れたわけでもありません。"}, {"t": 64.35, "x": "町が壊れたわけでもありません。"}, {"t": 66.43333333333334, "x": "当時の人はほとんど気づかなかったはずです。"}, {"t": 69.08333333333333, "x": "気づかないまま、杉だけがその年の"}, {"t": 71.6, "x": "空気を輪に閉じこめました。"}, {"t": 73.21666666666667, "x": "この跡は「三宅イベント」と呼ばれています。"}, {"t": 76.75, "x": "見つけた研究者の名前です。"}, {"t": 78.81666666666666, "x": "名古屋大学の三宅芙沙さんたちが見つけました。"}, {"t": 81.73333333333333, "x": "日本の研究者が、日本の木から見つけた跡でした。"}, {"t": 85.56666666666666, "x": "論文が出たのは2012年です。"}, {"t": 87.98333333333333, "x": "それから世界中で、木と氷が測り直されました。"}, {"t": 91.55, "x": "空から来たのは、何だったのか。"}, {"t": 93.95, "x": "太陽なのか。遠くの星の爆発なのか。"}, {"t": 96.86666666666666, "x": "それとも宇宙の閃光なのか。"}, {"t": 98.88333333333334, "x": "候補はひとつずつ消されていきました。"}, {"t": 101.11666666666666, "x": "そしてこの一年の跡は、思わぬ"}, {"t": 103.6, "x": "使われ方をすることになります。"}, {"t": 105.48333333333333, "x": "はじめに炭素14がどこから来るのかを見ておきます。"}, {"t": 108.8, "x": "宇宙にはとても速く飛ぶ粒子が満ちています。"}, {"t": 111.7, "x": "宇宙線と呼ばれるものです。"}, {"t": 113.51666666666667, "x": "宇宙線は地球の空に飛びこむと空気の原子にぶつかります。"}, {"t": 117.45, "x": "そのとき中性子という小さな粒が飛び出します。"}, {"t": 120.61666666666666, "x": "中性子が窒素に当たると、炭素14が生まれます。"}, {"t": 124.33333333333333, "x": "空の上ではこの反応が毎日休まず起きています。"}, {"t": 127.75, "x": "生まれた炭素14は、すぐに酸素と結びつきます。"}, {"t": 131.46666666666667, "x": "二酸化炭素になって、空気の中を漂います。"}, {"t": 134.91666666666666, "x": "ほかの炭素と見分けのつかない形です。"}, {"t": 137.45, "x": "植物は光合成で二酸化炭素を取りこみます。"}, {"t": 140.73333333333332, "x": "その炭素で自分の体をつくります。"}, {"t": 143.25, "x": "木の幹は一年ごとに外側へ太ります。"}, {"t": 145.96666666666667, "x": "春から夏に太った部分が、一本の輪になります。"}, {"t": 149.56666666666666, "x": "年輪の一本一本には、その年の"}, {"t": 152.31666666666666, "x": "空気の炭素が入っているのです。"}, {"t": 154.3, "x": "一度輪になった炭素は、あとから入れかわりません。"}, {"t": 157.65, "x": "そして炭素14は、少しずつ壊れて別の原子に変わります。"}, {"t": 162.01666666666668, "x": "半分に減るまでに、五千年あまりかかります。"}, {"t": 165.4, "x": "リビーという研究者が決めた半減期は5568年です。"}, {"t": 169.83333333333334, "x": "いまも年代の計算には、この値が"}, {"t": 172.48333333333332, "x": "決まりとして使われています。"}, {"t": 174.13333333333333, "x": "この減り方を使うと、木や骨の年代が測れます。"}, {"t": 177.76666666666668, "x": "炭素14による年代測定です。"}, {"t": 180.2, "x": "ただしそのためには前提があります。"}, {"t": 182.53333333333333, "x": "空の炭素14の量が、昔から一定だったという前提です。"}, {"t": 187.06666666666666, "x": "実際には一定ではありません。"}, {"t": 189.18333333333334, "x": "太陽の活動が強い時期は、太陽の"}, {"t": 192.03333333333333, "x": "風が宇宙線を押し返します。"}, {"t": 194.0, "x": "地球に届く宇宙線が減ります。"}, {"t": 196.2, "x": "炭素14も少なくつくられます。"}, {"t": 198.43333333333334, "x": "反対に、太陽が静かな時期は多くつくられます。"}, {"t": 202.05, "x": "地球の磁場の強さでも、量は変わります。"}, {"t": 205.13333333333333, "x": "そこで研究者は、年代の分かった年輪を測りました。"}, {"t": 209.08333333333334, "x": "その値を並べて、昔の空の炭素14の表をつくったのです。"}, {"t": 213.76666666666668, "x": "年代測定の答えは、この表で直して使います。"}, {"t": 217.46666666666667, "x": "表づくりのために、世界中で古い木が測られてきました。"}, {"t": 221.36666666666667, "x": "表は空から降ったものの量を記した帳面でもあります。"}, {"t": 225.05, "x": "三宅さんたちが目をつけたのは、この帳面でした。"}, {"t": 228.48333333333332, "x": "2009年の時点で使われていた表があります。"}, {"t": 231.61666666666667, "x": "IntCal09と呼ばれる表です。"}, {"t": 233.96666666666667, "x": "およそ一万年ぶんの、木の炭素14をまとめたものです。"}, {"t": 237.98333333333332, "x": "ただし表の目は粗いものでした。"}, {"t": 239.98333333333332, "x": "値は5年おきに並んでいます。"}, {"t": 242.13333333333333, "x": "一年ごとの細かい動きは、そこからは読めません。"}, {"t": 245.65, "x": "三宅さんたちは、この表の最近の三千年を見ました。"}, {"t": 249.63333333333333, "x": "すると目立つ時期が三つありました。"}, {"t": 251.86666666666667, "x": "10年のあいだに、千分の三をこえて増えた時期です。"}, {"t": 255.66666666666666, "x": "ふだんのゆっくりした変化より、急な上がり方です。"}, {"t": 259.23333333333335, "x": "この三つのうち、二つはすでに細かく測られていました。"}, {"t": 263.1, "x": "細かい目で測っても、一年で跳ねる動きは無かったのです。"}, {"t": 267.15, "x": "残る一つが西暦750年から820年でした。"}, {"t": 271.21666666666664, "x": "ここだけはまだ細かく測られていませんでした。"}, {"t": 274.03333333333336, "x": "5年おきの表で見えていたのは、なだらかな坂です。"}, {"t": 277.48333333333335, "x": "坂の中に段があるのかは、表からは分かりません。"}, {"t": 281.0833333333333, "x": "5年をならせば、一年の跳ね上がりはなだらかに見えます。"}, {"t": 285.05, "x": "10年をならせば、もっとなだらかに見えます。"}, {"t": 288.23333333333335, "x": "確かめるには一年ずつ測るしかありません。"}, {"t": 290.96666666666664, "x": "近道はありません。けれども"}, {"t": 292.85, "x": "一年ぶんの輪はとても細いものです。"}, {"t": 295.3, "x": "しかも測る輪の年代がはっきりしている必要があります。"}, {"t": 298.85, "x": "一年でもずれれば、跳ね上がりの年もずれてしまいます。"}, {"t": 302.56666666666666, "x": "必要なのは年代が一年単位で分かった古い木でした。"}, {"t": 306.1166666666667, "x": "そしてそれを一本ずつ削り分ける手間でした。"}, {"t": 308.96666666666664, "x": "三宅さんたちは、残る70年を測ることに決めます。"}, {"t": 312.78333333333336, "x": "誰も見ていなかった、最後の空白です。"}, {"t": 315.8, "x": "70年ぶんの輪は、70本です。"}, {"t": 318.75, "x": "一本ずつなら、手の届く数でした。"}, {"t": 321.43333333333334, "x": "ここに何も無ければ、三つの段差は"}, {"t": 323.95, "x": "ただの坂だったことになります。"}, {"t": 325.68333333333334, "x": "答えはその空白の中にありました。"}, {"t": 328.0833333333333, "x": "その前に使われた木と測り方を見ていきます。"}, {"t": 331.03333333333336, "x": "三宅さんたちが測ったのは、日本の杉です。"}, {"t": 334.28333333333336, "x": "論文には日本の杉の年輪と書かれています。"}, {"t": 337.43333333333334, "x": "三宅さんの試料の多くは、屋久島の杉です。"}, {"t": 340.78333333333336, "x": "屋久島は世界自然遺産の島です。"}, {"t": 343.25, "x": "生きている屋久杉を切ることはできません。"}, {"t": 345.7, "x": "使われているのは、すでに枯れた木の切り株です。"}, {"t": 348.9, "x": "研究所の人たちが、何年も前に買い取っていたものでした。"}, {"t": 352.95, "x": "2013年の名古屋大学の紹介記事に、"}, {"t": 355.9166666666667, "x": "一本の杉が出てきます。樹齢およそ1900年の杉です。"}, {"t": 360.3333333333333, "x": "その木は20年以上前に名古屋大学へ来ていました。"}, {"t": 363.81666666666666, "x": "1900年生きた木には、1900本の輪があります。"}, {"t": 367.8666666666667, "x": "奈良時代の輪も、平安時代の輪も並んでいます。"}, {"t": 371.28333333333336, "x": "輪の年代は年輪の研究者が確かめます。"}, {"t": 374.2, "x": "幅の広い年と狭い年の並びを見ます。"}, {"t": 376.93333333333334, "x": "それを、年代の分かった木と照らし合わせるのです。"}, {"t": 380.35, "x": "こうしてどの輪が何年のものかが決まります。"}, {"t": 382.96666666666664, "x": "当時の三宅さんは、博士課程の学生でした。"}, {"t": 386.26666666666665, "x": "研究を始めて、まだ数年のころです。"}, {"t": 389.3333333333333, "x": "同じ研究所の増田公明さんたちと組んでいました。"}, {"t": 392.56666666666666, "x": "まず刃物で輪を一本ずつ削り分けます。"}, {"t": 395.18333333333334, "x": "一年ぶんの輪は、1ミリに届かないこともあります。"}, {"t": 398.75, "x": "となりの年の木が混ざれば、その年の値は狂います。"}, {"t": 402.5, "x": "削った木くずから、炭素を取り出します。"}, {"t": 405.28333333333336, "x": "それを装置にかけて、炭素14の割合を測ります。"}, {"t": 409.06666666666666, "x": "紹介記事によれば、30年ぶんでおよそひと月かかりました。"}, {"t": 413.3333333333333, "x": "それまでに測った輪は、600年ぶんです。"}, {"t": 416.3666666666667, "x": "一年に一本なので、600本の輪を削ったことになります。"}, {"t": 420.48333333333335, "x": "その一本一本に、同じ手順をくり返します。"}, {"t": 424.0, "x": "三宅さんはこの仕事についてこう話しています。"}, {"t": 427.03333333333336, "x": "絶え間ない集中と、完全な正確さが求められる研究です。"}, {"t": 431.45, "x": "750年から820年は、一年ごとに測りました。"}, {"t": 436.05, "x": "ところによっては二年ごとです。"}, {"t": 438.03333333333336, "x": "ふつうの年代測定なら、ここまで細かく測りません。"}, {"t": 441.71666666666664, "x": "5年や10年の目で足りるところです。"}, {"t": 444.05, "x": "それを、わざわざ一年の目で見たのです。"}, {"t": 447.0, "x": "その目でなければ、見えないものがありました。"}, {"t": 449.98333333333335, "x": "測った値を、年の順に並べていきます。"}, {"t": 453.21666666666664, "x": "750年代も760年代も、値はほぼ横ばいです。"}, {"t": 458.01666666666665, "x": "小さな上下はあっても、目立つ動きはありません。"}, {"t": 461.53333333333336, "x": "ところが774年から775年で、値が一気に上がりました。"}, {"t": 467.0, "x": "上がり幅はおよそ千分の十二です。"}, {"t": 469.5, "x": "ふだんの太陽の変化による増え方の、およそ20倍でした。"}, {"t": 473.5, "x": "上がった値はすぐには下がりません。"}, {"t": 475.81666666666666, "x": "何年もかけて、ゆっくり戻っていきます。"}, {"t": 478.8, "x": "空気の炭素14が、海や森に少しずつ吸いこまれるためです。"}, {"t": 483.21666666666664, "x": "グラフにすると、階段を一段のぼった形です。"}, {"t": 486.73333333333335, "x": "そのあとゆっくり坂を下ります。"}, {"t": 488.8, "x": "この形が5年おきの表ではなだらかな坂に見えていました。"}, {"t": 492.48333333333335, "x": "三宅さんたちは、もう一つ確かめました。"}, {"t": 495.3666666666667, "x": "自分たちの値を、10年ずつならしてみたのです。"}, {"t": 498.8666666666667, "x": "すると北アメリカとヨーロッパの木の表と合いました。"}, {"t": 501.85, "x": "10年ならしの表と、食いちがいはありません。"}, {"t": 505.03333333333336, "x": "食いちがわないから、跳ね上がりは長く隠れていたのです。"}, {"t": 508.68333333333334, "x": "その年は十年の平均の中に溶けていました。"}, {"t": 511.7, "x": "表をつくった人たちが、見落としたわけではありません。"}, {"t": 515.3166666666667, "x": "5年おきの目では、もともと見えない大きさだったのです。"}, {"t": 518.9166666666666, "x": "一年の目で見た人が、まだいなかっただけでした。"}, {"t": 522.1666666666666, "x": "では千分の十二とはどれほどのことでしょう。"}, {"t": 524.9333333333333, "x": "空気の中の炭素の大部分は、もとからある炭素です。"}, {"t": 528.6666666666666, "x": "炭素14が少し増えても、すぐには目立ちません。"}, {"t": 532.2, "x": "一年で目に見える上乗せをするのは大変です。"}, {"t": 535.3833333333333, "x": "ふだんよりずっと多く、炭素14をつくる必要があります。"}, {"t": 539.5, "x": "ふだんの一年の量の何倍もが、"}, {"t": 541.65, "x": "短いあいだにつくられたことになります。"}, {"t": 544.2, "x": "宇宙線が空にあたる量が、大きく増えたのです。"}, {"t": 547.6666666666666, "x": "それも、ほんの短いあいだにです。"}, {"t": 550.2166666666667, "x": "2012年この結果はネイチャーに載ります。"}, {"t": 553.05, "x": "イギリスの科学誌です。論文の題は日本の年輪にある"}, {"t": 556.8666666666667, "x": "宇宙線増加の跡、というものでした。"}, {"t": 559.6, "x": "ここから、世界の研究者が動き出します。"}, {"t": 562.75, "x": "最初の問いは単純です。空から、何が来たのか。"}, {"t": 566.6666666666666, "x": "宇宙線を大きく増やせるものは、いくつかあります。"}, {"t": 570.1, "x": "一つは近くの星の爆発です。"}, {"t": 572.35, "x": "超新星と呼ばれます。星が一生の終わりに大爆発すると、"}, {"t": 576.4666666666667, "x": "強い光と粒子が飛び出します。"}, {"t": 578.8166666666667, "x": "近くで起きれば、地球の空にも届きます。"}, {"t": 581.9666666666667, "x": "けれども超新星は空に明るい星として現れます。"}, {"t": 585.4666666666667, "x": "774年ごろに、そうした新しい"}, {"t": 588.5833333333334, "x": "星の記録は見つかっていません。"}, {"t": 590.55, "x": "爆発のあとには、ガスの残骸も広がって残ります。"}, {"t": 594.3, "x": "年齢の合う残骸も、見つかっていません。"}, {"t": 597.3666666666667, "x": "空に何も見えない爆発は、超新星では考えにくいのです。"}, {"t": 601.85, "x": "三宅さんたちの論文は、近くの"}, {"t": 604.3, "x": "超新星の可能性は低いとしました。二つ目は太陽です。"}, {"t": 608.35, "x": "太陽の表面ではときどき大きな爆発が起きます。"}, {"t": 611.7833333333333, "x": "太陽フレアと呼ばれるものです。"}, {"t": 613.8, "x": "このとき、陽子などの粒子が"}, {"t": 615.9333333333333, "x": "大量に飛び出すことがあります。"}, {"t": 617.8166666666667, "x": "地球に届けば、空で炭素14がつくられます。"}, {"t": 621.3833333333333, "x": "材料は、空のどこにでもある窒素です。"}, {"t": 624.5, "x": "ただし2012年の論文は、ここにも疑問を出しました。"}, {"t": 628.4666666666667, "x": "これほどの炭素14には、とてつもない量の粒子が要ります。"}, {"t": 632.5333333333333, "x": "ふつうの考え方の太陽フレアでは、届かない大きさです。"}, {"t": 636.6833333333333, "x": "論文は太陽フレアの可能性も低いと述べました。"}, {"t": 639.9666666666667, "x": "こうして身近な二つの候補がいったん外されます。"}, {"t": 643.0333333333333, "x": "では何が残るのか。ここから、さまざまな説が出てきます。"}, {"t": 647.2333333333333, "x": "ただその前に確かめることがあります。"}, {"t": 649.55, "x": "本当にそんなに大きな出来事だったのかです。"}, {"t": 652.4666666666667, "x": "跳ね上がりの大きさは、測った値です。"}, {"t": 655.3833333333333, "x": "しかし、空でつくられた量に直すには計算が要ります。"}, {"t": 659.4333333333333, "x": "空気と海と森で、炭素がどう行き来するかの計算です。"}, {"t": 663.2166666666667, "x": "計算のしかたで、必要な量は大きく変わります。"}, {"t": 666.75, "x": "この計算がのちに見直されていきます。"}, {"t": 669.2666666666667, "x": "その年の終わりごろ、新しい説が出ます。"}, {"t": 672.3333333333334, "x": "天の川銀河の中で起きた、短いガンマ線バーストです。"}, {"t": 676.4333333333333, "x": "ガンマ線バーストは、宇宙で"}, {"t": 678.5666666666667, "x": "起きるとても短く強い爆発です。"}, {"t": 680.85, "x": "このとき出るのは、目に見えないガンマ線です。"}, {"t": 683.8833333333333, "x": "説によれば、距離は1キロパーセクから4キロパーセクです。"}, {"t": 687.9833333333333, "x": "光でも三千年から一万三千年ほどかかる遠さです。"}, {"t": 691.8166666666667, "x": "短いので、空に新しい星が残りません。"}, {"t": 695.2166666666667, "x": "残骸も目立って残らないと考えられました。"}, {"t": 697.9833333333333, "x": "記録が無いことを、ここでは説明できるわけです。"}, {"t": 701.35, "x": "ガンマ線バーストは、別の回でも取り上げました。"}, {"t": 704.65, "x": "宇宙の閃光が空に与える影響を考えた回です。"}, {"t": 708.2166666666667, "x": "今回は候補の一つとして名前を挙げるにとどめます。"}, {"t": 711.45, "x": "もう一方で太陽を見直す動きも出ました。"}, {"t": 714.2833333333333, "x": "2013年ウソスキンさんたちが論文を出します。"}, {"t": 717.7, "x": "題は775年の出来事を見直す、"}, {"t": 720.6333333333333, "x": "太陽のせいだ、というものでした。"}, {"t": 723.4833333333333, "x": "新しい年輪の測定で、跳ね上がり"}, {"t": 726.2, "x": "そのものは確かめられました。"}, {"t": 727.85, "x": "ベリリウム10など、別の記録とも合いました。"}, {"t": 730.8833333333333, "x": "問題は強さの見積もりでした。"}, {"t": 732.9833333333333, "x": "2012年の論文は、炭素の"}, {"t": 735.4666666666667, "x": "めぐり方の計算が合っていなかった。"}, {"t": 737.7166666666667, "x": "そのため、強さをかなり大きく見積もっていた。"}, {"t": 741.0666666666667, "x": "そういう指摘です。見直すと、"}, {"t": 743.3833333333333, "x": "強い太陽の粒子の嵐で説明できました。"}, {"t": 746.35, "x": "説明できないほどの強さではなかったのです。"}, {"t": 749.1833333333333, "x": "一回の嵐でも続けて起きた嵐でもよい、とされています。"}, {"t": 753.4333333333333, "x": "メロットさんたちも、計算をやり直しました。"}, {"t": 756.6166666666667, "x": "必要なエネルギーは、主張より"}, {"t": 758.8333333333334, "x": "ずっと小さいという結論です。"}, {"t": 760.7833333333333, "x": "それでも1859年のキャリントン・イベントより、"}, {"t": 764.25, "x": "かなり大きいとしています。"}, {"t": 766.2166666666667, "x": "1859年の嵐は、機械の時代に"}, {"t": 769.6, "x": "知られる大きな太陽の嵐です。"}, {"t": 771.65, "x": "こうして太陽は候補に戻ってきました。"}, {"t": 774.1333333333333, "x": "ただ見積もりの直し合いだけでは"}, {"t": 776.5666666666667, "x": "決着しません。宇宙の閃光か、太陽か。"}, {"t": 779.4833333333333, "x": "見分けるには別の物差しが要りました。"}, {"t": 781.85, "x": "手がかりは二本目の段差と、氷の中にありました。"}, {"t": 785.3833333333333, "x": "三宅さんたちは、測る範囲を広げました。"}, {"t": 788.3833333333333, "x": "822年から1020年までです。"}, {"t": 791.2666666666667, "x": "およそ200年ぶんの輪を、一本ずつ削って測ります。"}, {"t": 795.2, "x": "30年でひと月の作業です。"}, {"t": 797.5, "x": "200年なら、半年以上かかる計算です。"}, {"t": 800.8333333333334, "x": "その中にもう一つの段差がありました。"}, {"t": 803.3, "x": "992年から993年にかけての急な増加です。"}, {"t": 807.9, "x": "2013年この結果が論文になります。"}, {"t": 810.7833333333333, "x": "題は木の年輪の炭素14にある、もう一つの急な出来事です。"}, {"t": 815.4, "x": "993年の跳ね上がりは、775年より小さめです。"}, {"t": 820.5166666666667, "x": "のちの世界の測定ではおよそ半分とされています。"}, {"t": 823.8166666666667, "x": "三宅さんたちは、南極の氷の記録も見ました。"}, {"t": 827.25, "x": "氷にはベリリウム10という原子が入っています。"}, {"t": 830.3333333333334, "x": "ベリリウム10も、宇宙線が空気にぶつかってできます。"}, {"t": 834.1, "x": "ただし二酸化炭素にはなりません。"}, {"t": 836.3, "x": "雪といっしょに降りて、そのまま氷になります。"}, {"t": 839.5, "x": "南極の氷は、雪が年ごとに積もってできています。"}, {"t": 843.2833333333333, "x": "その層を数えれば、氷にも年が付きます。"}, {"t": 846.5833333333334, "x": "木とはまったく別の帳面です。"}, {"t": 848.7333333333333, "x": "その別の帳面に、同じ跡があるかを見たのです。"}, {"t": 852.2666666666667, "x": "南極の氷のベリリウム10には、二つの山がありました。"}, {"t": 856.25, "x": "775年ごろと、993年ごろです。"}, {"t": 860.4166666666666, "x": "さらに二つの原子の増え方を比べました。"}, {"t": 863.1666666666666, "x": "炭素14とベリリウム10です。"}, {"t": 865.35, "x": "二つの出来事で、その割合が合っていました。"}, {"t": 868.55, "x": "割合が同じなら、同じ種類の原因の見込みが高くなります。"}, {"t": 872.7666666666667, "x": "ここでもう一つの考え方が効いてきます。起きる回数です。"}, {"t": 876.7666666666667, "x": "近くのガンマ線バーストや超新星は、めったに起きません。"}, {"t": 880.9, "x": "わずか200年あまりで、二度も起きるでしょうか。"}, {"t": 884.15, "x": "太陽の大きな爆発のほうが、ずっと起こりやすいはずです。"}, {"t": 888.2, "x": "2013年の論文は、太陽の活動が"}, {"t": 891.5166666666667, "x": "もっともらしい原因だと結んでいます。"}, {"t": 893.85, "x": "一度は外した太陽を、三宅さんたち自身が"}, {"t": 897.2333333333333, "x": "呼び戻したのです。とはいえこれは"}, {"t": 899.4, "x": "まだ有力な見方の一つです。"}, {"t": 901.15, "x": "決め手は氷を何本も調べることでした。"}, {"t": 903.8833333333333, "x": "しかも何種類もの原子で調べることでした。"}, {"t": 906.6833333333333, "x": "2015年メカルディさんたちが論文を出します。"}, {"t": 909.8666666666667, "x": "使ったのは北と南の両方の氷の柱です。"}, {"t": 913.1166666666667, "x": "グリーンランドからは、三本の氷の柱を使いました。"}, {"t": 916.95, "x": "NGRIP、NEEM、GRIPと呼ばれる柱です。"}, {"t": 921.9166666666666, "x": "南極からは西南極の氷床で掘られた柱です。"}, {"t": 925.4, "x": "どれも一年ごとの層を数えられる氷です。"}, {"t": 928.2666666666667, "x": "それまでの南極のドームふじの記録は、"}, {"t": 930.7, "x": "6年から15年の目でした。"}, {"t": 932.9, "x": "今回はベリリウム10を一年ごとに測りました。"}, {"t": 935.9666666666667, "x": "一つの原子だけでは、原因は決めきれません。"}, {"t": 939.2666666666667, "x": "原子ごとに、得意な粒子の強さが違うからです。"}, {"t": 942.9, "x": "だから三つの原子を並べたのです。"}, {"t": 945.2, "x": "775年ごろの値は、ふだんの平均の3.4倍でした。"}, {"t": 950.15, "x": "993年ごろは、ふだんの1.2倍ほどでした。"}, {"t": 954.25, "x": "次に塩素36という原子も使いました。"}, {"t": 957.25, "x": "塩素36も宇宙線から生まれます。"}, {"t": 959.8833333333333, "x": "ただし生まれやすい粒子の強さがベリリウム10と違います。"}, {"t": 963.5833333333334, "x": "二つの増え方を比べると、降った"}, {"t": 966.1, "x": "粒子の強さの分け方が分かります。"}, {"t": 968.2833333333333, "x": "答えはとても硬い粒子の嵐でした。"}, {"t": 970.7333333333333, "x": "100メガ電子ボルトをこえる陽子が、大量に降った形です。"}, {"t": 974.9666666666667, "x": "ここでガンマ線説との違いが出てきます。"}, {"t": 977.6166666666667, "x": "ガンマ線なら、炭素14と塩素36ははっきり増えます。"}, {"t": 982.0, "x": "けれどもベリリウム10は増えないはずだとされていました。"}, {"t": 985.2166666666667, "x": "実際にはベリリウム10ははっきり増えていました。"}, {"t": 988.2833333333333, "x": "もう一つの手がかりは、北と南の形です。"}, {"t": 991.5333333333333, "x": "両方の氷で、同じ形に増えていたのです。"}, {"t": 994.9333333333333, "x": "電気を帯びた粒子は、地球の磁場で曲げられます。"}, {"t": 998.35, "x": "そして両極のほうへ集まります。"}, {"t": 1000.5666666666667, "x": "オーロラが両極の空に出るのも、そのためです。"}, {"t": 1003.8, "x": "ガンマ線のような光は、磁場では曲がりません。"}, {"t": 1007.15, "x": "両極で同じ形なら、光ではなく、電気を帯びた粒子です。"}, {"t": 1011.8833333333333, "x": "論文はこの点でガンマ線を外しています。"}, {"t": 1014.7666666666667, "x": "200年のあいだに二度も地球を"}, {"t": 1016.7333333333333, "x": "打つのは考えにくい、とも書いています。"}, {"t": 1019.4666666666667, "x": "ではその嵐はどれほど強かったのか。"}, {"t": 1021.9333333333333, "x": "比べる相手は1956年2月の太陽の嵐です。"}, {"t": 1026.0333333333333, "x": "機械で観測された中でも、特に強い粒子を"}, {"t": 1029.3666666666666, "x": "浴びせた嵐でした。775年の出来事は、その少なくとも"}, {"t": 1034.0166666666667, "x": "5倍強かったとされています。"}, {"t": 1035.8166666666666, "x": "観測されてきた、どの太陽の嵐と比べても同じです。"}, {"t": 1039.6333333333334, "x": "こうして太陽の非常に強い粒子の嵐が、"}, {"t": 1042.3833333333334, "x": "いちばん有力な説になりました。"}, {"t": 1044.7166666666667, "x": "炭素14とベリリウム10と塩素36。"}, {"t": 1047.7166666666667, "x": "三つの物差しがそろったことになります。"}, {"t": 1050.1, "x": "木の中の炭素。氷の中のベリリウム。"}, {"t": 1052.8166666666666, "x": "そして氷の中の塩素です。それでも"}, {"t": 1055.0333333333333, "x": "確かめていないことが一つありました。"}, {"t": 1057.5166666666667, "x": "世界中の木が本当に同じ年を記録しているのかです。"}, {"t": 1061.1666666666667, "x": "775年の跳ね上がりは、日本の杉で見つかりました。"}, {"t": 1065.5666666666666, "x": "ほかの国の木でも、同じ跡が確かめられていきます。"}, {"t": 1069.0666666666666, "x": "では地球の反対側の木ではどうか。"}, {"t": 1071.6333333333334, "x": "年輪の年代そのものは、どこまで正しいのか。"}, {"t": 1074.9666666666667, "x": "2018年ビュントゲンさんたちが大きな測定をまとめます。"}, {"t": 1078.9166666666667, "x": "使ったのは5大陸の44本の年輪の記録です。"}, {"t": 1082.4666666666667, "x": "北は北緯72度、南は南緯42度までの木です。"}, {"t": 1086.6333333333334, "x": "アラスカ、オレゴン、アルバ   if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
