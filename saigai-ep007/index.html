<script>
const D={"name": "ep007", "file": "ep007", "dur": 1944.8833125, "segs": [], "subs": [{"t": 0.0, "x": "いまからおよそ9400万年前、"}, {"t": 1.3166666666666667, "x": "9400万年前█"}, {"t": 2.7666666666666666, "x": "世界中の海で、同じことが起きました。"}, {"t": 6.233333333333333, "x": "海の水から、酸素が消えていったのです。"}, {"t": 9.116666666666667, "x": "ひとつの入り江や、ひとつの湾の話ではありません。"}, {"t": 12.566666666666666, "x": "大西洋でも、太平洋でも、当時ヨーロッパの"}, {"t": 16.25, "x": "南に広がっていた海でも、ほぼ同じ時期に、"}, {"t": 19.283333333333335, "x": "海の底へ黒い泥が積もりはじめました。"}, {"t": 22.083333333333332, "x": "酸素のある海の底では、沈んできた"}, {"t": 24.85, "x": "生き物の死骸は片付けられます。"}, {"t": 26.833333333333332, "x": "小さな生き物や微生物が、酸素を"}, {"t": 29.466666666666665, "x": "使って分解してしまうからです。"}, {"t": 31.45, "x": "ところが酸素が無くなると、"}, {"t": 33.083333333333336, "x": "片付ける側がはたらけなくなります。"}, {"t": 35.56666666666667, "x": "死骸は分解されきらないまま、"}, {"t": 37.65, "x": "泥の中に炭素として残ります。"}, {"t": 40.016666666666666, "x": "その炭素が、泥を黒く染めました。"}, {"t": 42.63333333333333, "x": "黒い泥は、やがて押し固められて、黒い岩になりました。"}, {"t": 46.8, "x": "いまでも、イタリアの山の中で、北アメリカの"}, {"t": 50.15, "x": "平原で、南アメリカ沖の海底を掘った試料の"}, {"t": 53.65, "x": "中で、同じ時代の黒い層が見つかります。"}, {"t": 56.6, "x": "場所がこれほど離れているのに、時期がそろっている。"}, {"t": 59.88333333333333, "x": "それは、ひとつの海の事情ではなく、地球の"}, {"t": 63.4, "x": "海全体の仕組みが変わったことを示しています。"}, {"t": 66.21666666666667, "x": "この状態は、数十万年にわたって続いたと"}, {"t": 69.5, "x": "見積もられています。そして、ある時点から、海は"}, {"t": 73.21666666666667, "x": "ふたたび酸素を取り戻していきます。"}, {"t": 75.28333333333333, "x": "何が海から酸素を奪い、何が海を元に戻したのか。"}, {"t": 79.35, "x": "原因については、いまも研究が続いています。"}, {"t": 82.83333333333333, "x": "ただ、この時代に海の底が息をしていなかったこと自体は、"}, {"t": 86.71666666666667, "x": "岩の中に実物として残っています。"}, {"t": 89.4, "x": "この出来事には、名前が付いています。海洋無酸素事変。"}, {"t": 92.16666666666667, "x": "海洋無酸素事変█"}, {"t": 93.76666666666667, "x": "白亜紀に起きたものには番号が振られていて、"}, {"t": 96.48333333333333, "x": "今回の出来事は二番目にあたります。"}, {"t": 99.15, "x": "海が、息を止めていた記録です。"}, {"t": 101.61666666666666, "x": "最初にこの黒い層に目を留めたのは、"}, {"t": 103.93333333333334, "x": "海の研究者ではありませんでした。"}, {"t": 106.48333333333333, "x": "1891年█"}, {"t": 106.48333333333333, "x": "1891年、イタリア中部の山あいで、"}, {"t": 110.18333333333334, "x": "ひとりの地質学者が地層を調べていました。"}, {"t": 113.13333333333334, "x": "名前は、グイド・ボナレッリ。"}, {"t": 115.3, "x": "場所は、ウンブリア地方の古い町、グッビオの近くです。"}, {"t": 119.66666666666667, "x": "このあたりの山は、かつて海の"}, {"t": 121.81666666666666, "x": "底に溜まった石灰岩でできています。"}, {"t": 124.18333333333334, "x": "その石灰岩の中に、色のまったく違う層が、"}, {"t": 127.63333333333334, "x": "一枚だけ挟まっていました。"}, {"t": 129.73333333333332, "x": "暗い色をした、粘土と細かい砂の層です。"}, {"t": 132.93333333333334, "x": "厚さは、場所によって数十センチから二メートルほど。"}, {"t": 136.6, "x": "石灰分はほとんど含まず、代わりに、"}, {"t": 139.6, "x": "有機物を多く含んでいました。"}, {"t": 141.9, "x": "もうひとつ、多く含まれていたのが、"}, {"t": 144.38333333333333, "x": "ガラス質の小さな殻です。放散虫と呼ばれる、"}, {"t": 148.06666666666666, "x": "海に漂う小さな生き物の殻でした。"}, {"t": 150.86666666666667, "x": "ボナレッリは、1901年に"}, {"t": 152.15, "x": "1901年█"}, {"t": 153.71666666666667, "x": "この層をくわしく報告しています。"}, {"t": 156.18333333333334, "x": "そのとき注目したのは、この黒い層が"}, {"t": 158.9, "x": "石油と関係しうる、という点でした。"}, {"t": 161.71666666666667, "x": "この層は、のちに彼の名前をとって、"}, {"t": 164.43333333333334, "x": "ボナレッリ層と呼ばれるようになります。"}, {"t": 167.06666666666666, "x": "同じ層は、イタリア北部のロンバルディアから、"}, {"t": 170.08333333333334, "x": "中部のアブルッツォまで、アペニン山脈の"}, {"t": 173.36666666666667, "x": "あちこちで確かめられています。"}, {"t": 175.06666666666666, "x": "ただ、この時点では、イタリアの山の中の、"}, {"t": 178.46666666666667, "x": "少し変わった一枚の層にすぎませんでした。"}, {"t": 181.45, "x": "話が大きく変わるのは、海の"}, {"t": 183.83333333333334, "x": "底が掘られるようになってからです。"}, {"t": 185.85, "x": "二十世紀の後半、深海掘削の船が、世界の"}, {"t": 189.98333333333332, "x": "海の底から泥の柱を引き上げはじめます。"}, {"t": 192.65, "x": "太平洋の海底を掘った試料の中からも、"}, {"t": 195.45, "x": "同じような黒い泥が出てきました。"}, {"t": 197.75, "x": "しかも、その年代は、互いに"}, {"t": 200.33333333333334, "x": "遠く離れた場所で、ほぼそろっていました。"}, {"t": 203.1, "x": "ふつう、海の底から酸素が無くなるのは、"}, {"t": 206.21666666666667, "x": "限られた場所だけです。陸に"}, {"t": 208.16666666666666, "x": "囲まれた入り江や、水が入れ替わりにくい"}, {"t": 211.0, "x": "深い窪地がそれにあたります。"}, {"t": 212.81666666666666, "x": "それが、海盆をいくつもまたいで、同じ時期に起きている。"}, {"t": 217.1, "x": "1976年█"}, {"t": 217.1, "x": "1976年、二人の研究者が、"}, {"t": 220.61666666666667, "x": "これをひとつの考えにまとめました。"}, {"t": 223.01666666666668, "x": "シーモア・シュランガーと、ヒュー・ジェンキンズです。"}, {"t": 225.91666666666666, "x": "世界の海が、ある時期、広い範囲で"}, {"t": 228.91666666666666, "x": "酸素を失った出来事があったのではないか。"}, {"t": 231.55, "x": "二人はこれを、海洋無酸素事変と名付けました。"}, {"t": 235.13333333333333, "x": "その後の研究で、白亜紀には、こうした"}, {"t": 238.33333333333334, "x": "出来事がいくつか見つかっていきます。"}, {"t": 240.45, "x": "およそ1億2000万年前のもの、"}, {"t": 242.76666666666668, "x": "およそ1億1100万年前のもの。"}, {"t": 245.41666666666666, "x": "その中でも、もっとも広く、"}, {"t": 247.65, "x": "もっともはっきり記録されているのが、今回の出来事です。"}, {"t": 251.75, "x": "イタリアの山の中の黒い層は、この出来事の"}, {"t": 254.85, "x": "代表的な記録として、あらためて見直されました。"}, {"t": 258.15, "x": "証拠は、泥の色だけではありません。"}, {"t": 260.8666666666667, "x": "炭素には、重さのわずかに違う二つの種類があります。"}, {"t": 264.71666666666664, "x": "生き物は、軽いほうの炭素を好んで体に取り込みます。"}, {"t": 268.6166666666667, "x": "その生き物が死んで、分解されずに大量に"}, {"t": 271.7, "x": "埋まると、軽い炭素が海から抜けていきます。"}, {"t": 274.76666666666665, "x": "すると、海に残る炭素は、重いほうへ傾きます。"}, {"t": 278.85, "x": "この傾きが、この時代の地層では、"}, {"t": 281.48333333333335, "x": "世界中で同じ時期に現れます。"}, {"t": 283.98333333333335, "x": "黒い泥が、たまたまあちこちに溜まったのではない。"}, {"t": 287.1333333333333, "x": "海全体から、大量の炭素が海底へ運び去られていた。"}, {"t": 291.2, "x": "そのことを、炭素の重さの比率が、"}, {"t": 293.76666666666665, "x": "場所を問わず同じように示しています。"}, {"t": 296.43333333333334, "x": "海から酸素が消える、という話をする前に、そもそも海の"}, {"t": 301.01666666666665, "x": "酸素がどこから来ているのかを確かめておきます。"}, {"t": 303.8333333333333, "x": "海の酸素の入り口は、ほぼ海面だけです。"}, {"t": 306.93333333333334, "x": "空気に触れている水面から、酸素が水に溶けこみます。"}, {"t": 310.75, "x": "そして、光の届く浅いところでは、"}, {"t": 313.3333333333333, "x": "植物プランクトンが光合成をして酸素を出します。"}, {"t": 316.93333333333334, "x": "どちらも、海の上のほうで起きることです。"}, {"t": 319.95, "x": "では、光も空気も届かない深い海には、"}, {"t": 323.01666666666665, "x": "どうやって酸素が届くのか。"}, {"t": 325.03333333333336, "x": "答えは、海面の水そのものが沈んでいくことです。"}, {"t": 328.78333333333336, "x": "北や南の寒い海では、冬に海面の水が冷やされます。"}, {"t": 333.03333333333336, "x": "海氷ができると、氷には塩がほとんど"}, {"t": 335.95, "x": "入らないので、残った水は塩辛くなります。"}, {"t": 339.1333333333333, "x": "冷たくて塩辛い水は重くなり、"}, {"t": 341.28333333333336, "x": "深いところへ沈んでいきます。"}, {"t": 343.53333333333336, "x": "沈んだ水の代わりに、別の場所から"}, {"t": 346.15, "x": "海面の水が引きこまれます。"}, {"t": 347.95, "x": "こうして、海には深いところを巡る流れが生まれます。"}, {"t": 351.6666666666667, "x": "沈んでいく水は、海面にいたときに溶かしこんだ"}, {"t": 355.03333333333336, "x": "酸素を、そのまま深い海へ運びます。"}, {"t": 357.81666666666666, "x": "つまり深い海の酸素は、極の近くで"}, {"t": 360.6, "x": "沈む水によって、上から配達されています。"}, {"t": 364.0, "x": "もうひとつ、大事な性質があります。"}, {"t": 366.98333333333335, "x": "水は、冷たいほど多くの酸素を溶かしておけます。"}, {"t": 370.48333333333335, "x": "温かい水は、同じ量でも、溶かしておける"}, {"t": 373.93333333333334, "x": "酸素が少なくなります。寒い海で沈む水が"}, {"t": 376.9, "x": "酸素を多く運べるのは、そのためです。"}, {"t": 379.71666666666664, "x": "一方で、深い海では、酸素は使われる一方です。"}, {"t": 383.8833333333333, "x": "海の上のほうで育ったプランクトンは、"}, {"t": 386.23333333333335, "x": "死ぬと沈んでいきます。その死骸を、微生物が分解します。"}, {"t": 391.0, "x": "分解には、酸素が使われます。"}, {"t": 393.46666666666664, "x": "つまり、深い海の酸素は、配られる量と、"}, {"t": 397.03333333333336, "x": "使われる量の差し引きで決まっています。"}, {"t": 399.5833333333333, "x": "配達が弱まるか、使う量が増えるか。"}, {"t": 402.6333333333333, "x": "どちらかが大きく動けば、深い"}, {"t": 405.05, "x": "海から酸素が減っていきます。"}, {"t": 406.9166666666667, "x": "両方が同時に動けば、減り方はさらに大きくなります。"}, {"t": 410.9, "x": "ここで一つ、言葉を整理しておきます。"}, {"t": 413.81666666666666, "x": "酸素が少ない状態と、酸素がまったく無い"}, {"t": 416.8666666666667, "x": "状態は、別のものとして扱われます。"}, {"t": 419.6666666666667, "x": "研究者は、少ない状態を貧酸素、まったく無い"}, {"t": 423.8333333333333, "x": "状態を無酸素と呼び分けています。"}, {"t": 425.96666666666664, "x": "この回で、酸素が消えた、と言うときは、"}, {"t": 429.18333333333334, "x": "主に無酸素の状態を指します。"}, {"t": 431.6166666666667, "x": "ただし、無酸素の水の周りには、"}, {"t": 434.2, "x": "たいてい貧酸素の水が広く取り巻いています。"}, {"t": 437.31666666666666, "x": "この区別は、あとで広さの話をするときに効いてきます。"}, {"t": 441.23333333333335, "x": "この仕組みがどう崩れるかは、"}, {"t": 442.98333333333335, "x": "いまの海でも見ることができます。"}, {"t": 445.21666666666664, "x": "例として、黒海があります。"}, {"t": 447.5, "x": "黒海では、深さ百メートルから二百メートルより"}, {"t": 450.85, "x": "下の水に、酸素がほとんどありません。"}, {"t": 453.53333333333336, const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');

const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];

sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];

a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
