<script>
const D={"name": "ep033", "file": "ep033", "dur": 1981.06665625, "segs": [], "subs": [{"t": 0.0, "x": "今からおよそ7億年前のことです。"}, {"t": 2.45, "x": "地球は今とはまるで違う姿をしていました。"}, {"t": 5.4, "x": "陸はひとかたまりに近い形で集まっていました。"}, {"t": 8.45, "x": "その陸がいくつかに割れ始めていた時代です。"}, {"t": 11.266666666666667, "x": "そして、その時代の岩には奇妙な跡が残っています。"}, {"t": 15.133333333333333, "x": "氷河が運んだ石の跡です。大きな氷が、"}, {"t": 18.033333333333335, "x": "ゆっくりと地面をこすって運んだ石です。"}, {"t": 21.1, "x": "氷河の跡そのものは珍しくありません。"}, {"t": 23.75, "x": "寒い地方や高い山には今も氷河があります。"}, {"t": 26.9, "x": "奇妙なのはその跡が見つかる場所です。"}, {"t": 29.4, "x": "当時、赤道の近くにあった土地なのです。"}, {"t": 32.416666666666664, "x": "しかも山の上ではありません。"}, {"t": 34.38333333333333, "x": "海の高さまで氷河が下りてきた跡でした。"}, {"t": 37.1, "x": "熱帯の海べりです。今なら、"}, {"t": 39.13333333333333, "x": "ヤシの木が並ぶような緯度です。"}, {"t": 41.46666666666667, "x": "赤道の海べりまで氷が届いていた。"}, {"t": 44.06666666666667, "x": "そんなことが本当にあったのでしょうか。"}, {"t": 46.53333333333333, "x": "もし赤道まで凍ったのなら、地球はほとんど全部が氷です。"}, {"t": 50.833333333333336, "x": "海も陸も白い氷におおわれた星になります。"}, {"t": 53.8, "x": "研究者はこれを全球凍結と呼びます。"}, {"t": 56.56666666666667, "x": "英語ではスノーボールアースです。"}, {"t": 58.61666666666667, "x": "日本語では、全球凍結です。"}, {"t": 61.18333333333333, "x": "雪の玉のような地球という意味です。"}, {"t": 63.583333333333336, "x": "この説には、大きな問いがいくつもつきまといます。"}, {"t": 67.05, "x": "一つめはなぜそこまで凍ったのかです。"}, {"t": 69.58333333333333, "x": "二つめは、凍った地球がどうやって溶けたのかです。"}, {"t": 73.1, "x": "三つめは本当に全部が凍ったのかです。"}, {"t": 75.86666666666666, "x": "手がかりは、世界の何か所かの岩に残っています。"}, {"t": 79.35, "x": "南オーストラリアの谷に残る、氷が運んだ石。"}, {"t": 83.1, "x": "カナダの北の山に残る、火山の灰。"}, {"t": 85.98333333333333, "x": "アフリカのナミビアに残る、白っぽい岩の層。"}, {"t": 89.4, "x": "どれも7億年ほど前の地球の記録です。"}, {"t": 92.18333333333334, "x": "この回の主語は地球の海と氷と空です。"}, {"t": 95.1, "x": "白い氷が広がりそして消えていく。"}, {"t": 97.55, "x": "その流れを岩の記録からたどります。"}, {"t": 99.93333333333334, "x": "ただし、この説は全部が決まった話ではありません。"}, {"t": 103.71666666666667, "x": "氷の厚さも凍っていた長さも、資料によって違います。"}, {"t": 107.76666666666667, "x": "海の一部は凍らずに残ったと考える研究者もいます。"}, {"t": 111.51666666666667, "x": "どこまでが確かでどこからが解釈なのか。"}, {"t": 114.13333333333334, "x": "その線を引きながら進みます。"}, {"t": 116.25, "x": "最後は今の南オーストラリアの谷を歩きます。"}, {"t": 119.46666666666667, "x": "舞台は、南オーストラリアの州都アデレードです。"}, {"t": 122.93333333333334, "x": "海に面した、落ち着いた町です。"}, {"t": 125.4, "x": "南の海の向こうは、南極です。"}, {"t": 128.05, "x": "町の南の郊外に、スタート川という川が流れています。"}, {"t": 132.26666666666668, "x": "川は丘の間を削り細い谷をつくっています。"}, {"t": 135.45, "x": "その谷の岩を見ると、少し変わった姿をしています。"}, {"t": 139.26666666666668, "x": "細かい泥が固まった岩の中に、"}, {"t": 141.38333333333333, "x": "大小の石が散らばっているのです。"}, {"t": 143.78333333333333, "x": "丸い石もあれば角ばった石もあります。"}, {"t": 146.3, "x": "大きさもばらばらです。まるで、"}, {"t": 148.6, "x": "泥の中に石をばらまいたような姿です。"}, {"t": 151.35, "x": "川が運んだ石なら、大きさがそろいやすくなります。"}, {"t": 154.98333333333332, "x": "流れの強さで運べる石が決まるからです。"}, {"t": 157.75, "x": "ところがこの岩では、細かい泥と"}, {"t": 160.18333333333334, "x": "大きな石がまざっています。"}, {"t": 161.8, "x": "こういう岩は氷河の跡でよく見られます。"}, {"t": 164.43333333333334, "x": "地質学では、こうした岩を氷河の堆積物とよびます。"}, {"t": 168.35, "x": "氷河は大きな石も小さな石も、まとめて運ぶからです。"}, {"t": 172.35, "x": "氷河が溶けると、運ばれた石はその場に落ちます。"}, {"t": 175.8, "x": "海に浮かんだ氷から、石が泥の上に落ちることもあります。"}, {"t": 179.86666666666667, "x": "泥の層を押し曲げて、石がめりこんだ跡も残ります。"}, {"t": 183.66666666666666, "x": "上から落ちてきた石の跡です。"}, {"t": 185.68333333333334, "x": "この地方の氷河の跡は、1908年には"}, {"t": 189.11666666666667, "x": "すでに報告されています。1949年のことです。"}, {"t": 193.13333333333333, "x": "オーストラリアの地質学者モーソンが、"}, {"t": 195.43333333333334, "x": "ある考えを出しました。この氷河の跡は、"}, {"t": 198.65, "x": "世界中に広がった氷期の一部だ。"}, {"t": 201.18333333333334, "x": "モーソンは、これを世界で最大の氷期と呼びました。"}, {"t": 204.83333333333334, "x": "地層の名前はこの谷からとられています。"}, {"t": 207.4, "x": "スターチアンという名前です。"}, {"t": 209.28333333333333, "x": "スタート川の名前から来ています。"}, {"t": 211.46666666666667, "x": "アデレードの近くには、もう一つ名前のもとがあります。"}, {"t": 215.01666666666668, "x": "海べりの郊外の町、マリノです。"}, {"t": 217.75, "x": "こちらは、マリノアンという名前のもとになりました。"}, {"t": 221.05, "x": "スターチアン氷期とマリノアン氷期。"}, {"t": 223.35, "x": "南オーストラリアの地名をもつ、二つの古い氷期です。"}, {"t": 227.43333333333334, "x": "マリノアン氷期の跡は、北の"}, {"t": 229.68333333333334, "x": "フリンダース山脈にもあります。"}, {"t": 231.65, "x": "エラティナ層と呼ばれる岩です。"}, {"t": 233.58333333333334, "x": "細かい泥の層が、何枚も重なっています。"}, {"t": 236.78333333333333, "x": "泥の中に石が落ちた跡が、たくさん残っています。"}, {"t": 240.45, "x": "海にせり出した氷河が、浅い海に"}, {"t": 243.08333333333334, "x": "石を落とした跡とされます。"}, {"t": 244.78333333333333, "x": "ここまでなら、昔の寒い時代の跡というだけの話です。"}, {"t": 248.78333333333333, "x": "ところが、この岩には別の記録も入っていました。"}, {"t": 252.15, "x": "岩の中に、目に見えない小さな磁石が入っていたのです。"}, {"t": 256.1, "x": "その磁石が、思いがけない緯度を指していました。"}, {"t": 259.4, "x": "岩の中には、鉄をふくむ細かい粒が入っています。"}, {"t": 263.0833333333333, "x": "岩ができるとき、粒はそのころの"}, {"t": 265.4166666666667, "x": "地球の磁石の向きにそろいます。"}, {"t": 267.43333333333334, "x": "そして岩が固まると向きがそのまま残ります。"}, {"t": 270.31666666666666, "x": "地球の磁石の向きは、緯度によって傾きが変わります。"}, {"t": 274.06666666666666, "x": "赤道の近くではほぼ水平になります。"}, {"t": 276.7, "x": "方位磁針を立てて持つと、針は横を向きます。"}, {"t": 280.0833333333333, "x": "北極や南極に近づくほど、地面に向かって立ってきます。"}, {"t": 284.06666666666666, "x": "極の上では、針はほぼまっすぐ下を向きます。"}, {"t": 287.35, "x": "ですから岩の中の磁石の傾きを測ります。"}, {"t": 290.3333333333333, "x": "するとその岩ができた緯度がわかります。"}, {"t": 292.76666666666665, "x": "陸は長い時間をかけて動いてきました。"}, {"t": 295.3333333333333, "x": "今は南の高い緯度にある土地も、"}, {"t": 297.51666666666665, "x": "昔は赤道にあったかもしれない。"}, {"t": 299.8833333333333, "x": "それを確かめる手がかりが岩の中の磁石です。"}, {"t": 302.8666666666667, "x": "1950年代の終わりのことです。"}, {"t": 305.5833333333333, "x": "イギリスの地質学者ハーランドたちです。"}, {"t": 308.1166666666667, "x": "この方法を、古い氷河の跡に使いました。"}, {"t": 311.45, "x": "すると、磁石の傾きが小さい岩がいくつも見つかりました。"}, {"t": 315.6333333333333, "x": "氷河の跡なのに、赤道に近い"}, {"t": 318.0833333333333, "x": "場所でできたように見えたのです。"}, {"t": 319.8833333333333, "x": "1964年、ハーランドは論文を書きました。"}, {"t": 323.9, "x": "大きな氷期が世界に広がっていた、という内容です。"}, {"t": 327.75, "x": "ただ、すぐには受け入れられませんでした。"}, {"t": 330.46666666666664, "x": "疑う理由があったのです。岩の磁石は、あとから向きが"}, {"t": 334.43333333333334, "x": "書きかえられることがあるからです。"}, {"t": 336.28333333333336, "x": "岩が熱を受けると粒の向きが変わります。"}, {"t": 338.95, "x": "水がしみこんでも変わることがあります。"}, {"t": 341.3333333333333, "x": "そうなると古い緯度は読めません。"}, {"t": 343.4, "x": "別の時代の緯度が、上書きされてしまうからです。"}, {"t": 346.8, "x": "実際、ハーランドが使ったデータの"}, {"t": 349.31666666666666, "x": "一部は、のちに疑われました。"}, {"t": 351.5833333333333, "x": "あとから書きかえられた磁石だったとされています。"}, {"t": 354.4, "x": "疑いを晴らすには別の確かめ方が必要でした。"}, {"t": 357.65, "x": "1987年、アメリカの研究者カーシュビンクが動きます。"}, {"t": 362.5833333333333, "x": "エラティナ層の岩の試料を、別の研究者に渡したのです。"}, {"t": 366.65, "x": "カーシュビンク自身は、この話を疑っていました。"}, {"t": 370.2, "x": "赤道の海べりに氷河があったとは思えなかったのです。"}, {"t": 373.6666666666667, "x": "確かめてもらったのは、地層の曲がりを使う方法です。"}, {"t": 377.4166666666667, "x": "地層が曲がる前にできた磁石を考えます。"}, {"t": 380.25, "x": "曲がった地層をもとに戻すと、向きがそろいます。"}, {"t": 383.55, "x": "曲がったあとに書きかえられた磁石は違います。"}, {"t": 386.35, "x": "戻すとかえってばらばらになります。"}, {"t": 388.45, "x": "結果は地層が曲がる前の磁石でした。"}, {"t": 391.0, "x": "磁石は、氷河の跡ができたときのものだったのです。"}, {"t": 394.5, "x": "カーシュビンクにとっては、"}, {"t": 396.0, "x": "意外な結果だったと伝えられています。"}, {"t": 398.6333333333333, "x": "この確かめ方は、その後も別の"}, {"t": 400.98333333333335, "x": "研究者たちがくり返しました。"}, {"t": 402.96666666666664, "x": "1999年の論文もこの岩を調べました。"}, {"t": 406.68333333333334, "x": "エラティナ層ができた緯度は、およそ7.5度と出ています。"}, {"t": 410.4, "x": "赤道からほんの少し離れただけの場所です。"}, {"t": 413.26666666666665, "x": "今でいえば赤道に近い熱帯の海の緯度です。"}, {"t": 416.26666666666665, "x": "同じ論文ではもう一つの発見がありました。"}, {"t": 419.25, "x": "氷河の跡の中で地球の磁石の向きが"}, {"t": 421.8, "x": "何度か入れかわっていたのです。"}, {"t": 423.53333333333336, "x": "磁石の向きの入れかわりは、そう頻繁には起きません。"}, {"t": 427.1666666666667, "x": "ですから、この氷河の跡は短い"}, {"t": 429.68333333333334, "x": "間にできたものではありません。"}, {"t": 431.45, "x": "長い時間をかけてできたと考えられました。"}, {"t": 434.18333333333334, "x": "赤道に近い海べりに長い時間、氷河があった。"}, {"t": 438.0, "x": "それをどう説明すればいいのか。"}, {"t": 440.1333333333333, "x": "答えの候補は意外なところにありました。"}, {"t": 442.7, "x": "氷そのものの白さです。雪の日に外に"}, {"t": 445.3333333333333, "x": "出ると、まぶしく感じることがあります。"}, {"t": 448.28333333333336, "x": "白い雪が日の光を強くはね返すからです。"}, {"t": 451.3833333333333, "x": "地球の表面でも同じことが起きています。"}, {"t": 454.1166666666667, "x": "海や森は暗い色をしていて、日の光をよく吸いこみます。"}, {"t": 458.01666666666665, "x": "吸いこんだ光は熱になります。"}, {"t": 460.0833333333333, "x": "夏の黒いアスファルトが熱くなるのと同じです。"}, {"t": 462.96666666666664, "x": "一方、白い氷や雪は、光の多くをはね返してしまいます。"}, {"t": 467.85, "x": "はね返された光は宇宙へ逃げていきます。"}, {"t": 470.5833333333333, "x": "ですから氷が広がると、地球が受け取る熱は減ります。"}, {"t": 474.51666666666665, "x": "熱が減るとさらに寒くなります。"}, {"t": 476.6333333333333, "x": "寒くなると氷がもっと広がります。"}, {"t": 479.0833333333333, "x": "氷が広がるとまた熱が減ります。"}, {"t": 481.3833333333333, "x": "こうして寒さが寒さを呼ぶ連鎖が起きます。"}, {"t": 484.18333333333334, "x": "研究者は、氷と光のはね返しの連鎖と呼びます。"}, {"t": 488.05, "x": "この連鎖を、簡単な計算で調べた研究者がいます。"}, {"t": 492.03333333333336, "x": "旧ソ連のブディコとアメリカのセラーズです。"}, {"t": 494.6166666666667, "x": "計算では氷の端がある緯度をこえました。"}, {"t": 497.4166666666667, "x": "するともう止まらなくなりました。"}, {"t": 499.31666666666666, "x": "氷は赤道まで一気に進み、地球全体が"}, {"t": 502.71666666666664, "x": "凍ってしまったのです。2010年の"}, {"t": 505.06666666666666, "x": "ハーバード大学の発表は、この考えをこう説明しています。"}, {"t": 509.21666666666664, "x": "海の氷が赤道から30度の内側まで届く。"}, {"t": 512.5333333333333, "x": "すると、海全体が凍ることが計算で示されている。"}, {"t": 516.4333333333333, "x": "赤道から30度というのは、"}, {"t": 518.4, "x": "今でいえば鹿児島より少し南の緯度です。"}, {"t": 521.3833333333333, "x": "そこをこえると引き返せなくなる。"}, {"t": 523.4166666666666, "x": "計算の上ではそういう線があるのです。"}, {"t": 526.0333333333333, "x": "ただしこの計算には、困ったことがひとつありました。"}, {"t": 529.55, "x": "一度全部が凍ってしまうと、"}, {"t": 531.45, "x": "白い氷が光をはね返し続けます。"}, {"t": 534.3, "x": "すると、いつまでたっても溶けない計算になるのです。"}, {"t": 537.75, "x": "地球は二度と元に戻れないことになります。"}, {"t": 540.3666666666667, "x": "白い氷の星のまま、止まってしまうのです。"}, {"t": 543.6833333333333, "x": "けれども地球は凍ったままではありません。"}, {"t": 546.3333333333334, "x": "今、私たちのまわりには青い海があります。"}, {"t": 549.6833333333333, "x": "ですから多くの研究者はこう考えてきました。"}, {"t": 552.75, "x": "地球が全部凍ったことはない、と。"}, {"t": 555.6666666666666, "x": "全部凍ったら戻れないなら、全部凍ったことはないはずだ。"}, {"t": 559.6, "x": "そう考えるのは自然なことでした。"}, {"t": 561.8833333333333, "x": "では、エラティナ層の赤道の氷河の跡は何なのか。"}, {"t": 565.65, "x": "凍った地球を溶かすしくみは本当に無いのか。"}, {"t": 568.65, "x": "カーシュビンクが目をつけたのは火山でした。"}, {"t": 571.2, "x": "地球が凍っても地下の熱は止まりません。"}, {"t": 573.8666666666667, "x": "火山は、氷をつき破って二酸化炭素を出し続けます。"}, {"t": 577.9666666666667, "x": "地球の中の熱が、外へ逃げる道だからです。"}, {"t": 581.2666666666667, "x": "この考えはのちの章でくわしく見ます。"}, {"t": 583.7666666666667, "x": "その前に、凍結の始まりの時刻を"}, {"t": 586.4833333333333, "x": "測った研究を見ておきます。"}, {"t": 588.35, "x": "舞台はカナダの北の山です。"}, {"t": 590.3333333333334, "x": "カナダの北西のはしに、ユーコンという地方があります。"}, {"t": 593.95, "x": "アラスカと境を接する、山と森の広がる土地です。"}, {"t": 597.75, "x": "夏は短く、冬は長い土地です。"}, {"t": 600.5666666666667, "x": "人の住む町は少なく、山の奥は"}, {"t": 603.2333333333333, "x": "冬になると雪に閉ざされます。"}, {"t": 605.0833333333334, "x": "この山の中に、古い氷河の跡が出ている場所があります。"}, {"t": 609.0166666666667, "x": "石のまじった泥の岩が、厚く積み重なっているのです。"}, {"t": 612.8, "x": "氷にけずられた筋のある石もまじっています。"}, {"t": 615.65, "x": "そしてその下には、もっと古い時代の岩があります。"}, {"t": 619.25, "x": "暖かい浅い海でできた、石灰の岩の礁です。"}, {"t": 622.9166666666666, "x": "サンゴ礁のような、暖かい海の跡です。"}, {"t": 626.0666666666667, "x": "暖かい海の跡の上に、いきなり氷河の跡が"}, {"t": 629.3833333333333, "x": "重なっているのです。2010年、"}, {"t": 631.8166666666667, "x": "この場所の研究が発表されました。"}, {"t": 634.2666666666667, "x": "発表したのは、ハーバード大学のマクドナルドたちです。"}, {"t": 637.9166666666666, "x": "決め手は、一枚の灰の層でした。"}, {"t": 640.5833333333334, "x": "氷河の跡の間に、火山灰がはさまっていたのです。"}, {"t": 644.3333333333334, "x": "火山灰には、ジルコンという"}, {"t": 646.4333333333333, "x": "小さな鉱物の粒が入っています。"}, {"t": 648.75, "x": "ジルコンの中のウランは、とてもゆっくり鉛に"}, {"t": 651.8666666666667, "x": "変わっていきます。その割合を測ると、"}, {"t": 654.4666666666667, "x": "灰が降った時期がわかります。"}, {"t": 656.5, "x": "時計のように使えるのです。"}, {"t": 658.3, "x": "測った結果は、およそ7億1650万年前でした。"}, {"t": 662.7, "x": "誤差はプラスマイナス24万年ほどです。"}, {"t": 665.5166666666667, "x": "7億年という長さからみれば、ごく小さな誤差です。"}, {"t": 669.4, "x": "さらにこの場所の岩の磁石も調べられました。"}, {"t": 672.2833333333333, "x": "するとここは当時、赤道から"}, {"t": 674.6, "x": "10度ほどの所にあったと出ました。"}, {"t": 676.6333333333333, "x": "熱帯の、しかも海の高さの場所です。"}, {"t": 679.5166666666667, "x": "山の上の氷河では、ありません。"}, {"t": 682.15, "x": "そこに氷河がとどいていたのです。"}, {"t": 684.2666666666667, "x": "マクドナルドは、この研究の意味をこう述べています。"}, {"t": 687.7166666666667, "x": "スターチアン氷期が熱帯にあったことを、"}, {"t": 690.1833333333333, "x": "初めて示したものだ。赤道から30度の"}, {"t": 693.15, "x": "線を、はるかに内側までこえています。"}, {"t": 696.1166666666667, "x": "計算の上では海全体が凍る条件にあたります。"}, {"t": 699.5333333333333, "x": "もう一つ、気になる一致がありました。"}, {"t": 702.25, "x": "同じころ、北アメリカの北の地域で"}, {"t": 704.75, "x": "大きな出来事がありました。"}, {"t": 706.4, "x": "地下から大量の溶岩が出ていたのです。"}, {"t": 708.9333333333333, "x": "フランクリンと呼ばれる溶岩の地帯です。"}, {"t": 711.4666666666667, "x": "今もカナダの北の島々に、その跡が残っています。"}, {"t": 715.1833333333333, "x": "その広がりは3000キロにわたります。"}, {"t": 717.6833333333333, "x": "ユーコンとアラスカの境から、"}, {"t": 719.5166666666667, "x": "北極の海のエルズミーア島までです。"}, {"t": 722.15, "x": "フランクリンの溶岩の年代は、"}, {"t": 724.15, "x": "およそ7億1633万年前と測られました。"}, {"t": 728.1833333333333, "x": "氷河の跡の火山灰と、誤差の範囲でほぼ同じです。"}, {"t": 731.9666666666667, "x": "大きな溶岩の流れと熱帯の氷河の跡。"}, {"t": 734.8, "x": "二つが同じ時期に重なっているのです。"}, {"t": 737.25, "x": "ただ、論文はここで言い切っていません。"}, {"t": 740.1166666666667, "x": "この一致は、噴火が凍結を引き起こしたことを"}, {"t": 743.4166666666666, "x": "意味するのかもしれない。あるいは、凍結を終わらせる側に"}, {"t": 747.2, "x": "働いたことを意味するのかもしれない。"}, {"t": 749.3833333333333, "x": "論文はその両方の可能性を書いています。"}, {"t": 752.35, "x": "2017年の大きなまとめの論文は、"}, {"t": 755.0833333333334, "x": "ひとつの見方を示しています。"}, {"t": 757.1833333333333, "x": "溶岩は、赤道をまたぐように出た。"}, {"t": 759.9833333333333, "x": "そこから、硫黄をふくむ細かい粒が空に上がった。"}, {"t": 763.6666666666666, "x": "その粒が日の光をさえぎった。"}, {"t": 765.85, "x": "それが凍結の引き金になったのかも"}, {"t": 768.0666666666667, "x": "しれない、というものです。"}, {"t": 769.9333333333333, "x": "ただしこれも決まった答えではありません。"}, {"t": 772.2833333333333, "x": "引き金は、今も議論が続いています。"}, {"t": 775.2, "x": "確かなのは時刻のほうです。"}, {"t": 777.0666666666667, "x": "世界のいくつかの場所で、年代が測られています。"}, {"t": 780.6333333333333, "x": "スターチアン氷期の始まりは、"}, {"t": 782.5, "x": "およそ7億1700万年前とされています。"}, {"t": 785.9, "x": "では、凍った地球の上はどんな景色だったのでしょうか。"}, {"t": 789.8, "x": "ここからは、気候の計算と地層から考えられている姿です。"}, {"t": 794.1166666666667, "x": "見てきた人はいません。ですから"}, {"t": 796.1, "x": "ここは仮の姿として聞いてください。"}, {"t": 798.3333333333334, "x": "まず海です。海の表面は氷におおわれます。"}, {"t": 801.7, "x": "氷の上には雪が積もります。下でも海水が凍ります。"}, {"t": 805.6333333333333, "x": "こうして氷は少しずつ厚くなっていきます。"}, {"t": 808.4166666666666, "x": "2017年のまとめの論文は、その厚さを"}, {"t": 811.75, "x": "数百メートルと見積もっています。"}, {"t": 813.8, "x": "一方で、1キロをこえる厚さを出す計算もあります。"}, {"t": 817.6833333333333, "x": "氷の白さをどう仮定するかで、答えが大きく変わるのです。"}, {"t": 821.8, "x": "ですから厚さは一つに決まっていません。"}, {"t": 824.2833333333333, "x": "厚い氷か、それほど厚くない氷か。"}, {"t": 827.35, "x": "答えは、まだ出ていません。"}, {"t": 829.4333333333333, "x": "厚くなった海の氷はゆっくりと流れます。"}, {"t": 832.2166666666667, "x": "2017年の論文によると、高い緯度の氷は厚くなります。"}, {"t": 836.7666666666667, "x": "その氷が重さで赤道の方へ流れていくのです。"}, {"t": 840.0666666666667, "x": "海の上を、氷河のような氷がはうように進むのです。"}, {"t": 843.9333333333333, "x": "次に空気の流れです。今の地球では、"}, {"t": 846.7, "x": "赤道のあたりでよく雨が降ります。"}, {"t": 849.3166666666667, "x": "熱帯の雨林が、その証拠です。"}, {"t": 851.8833333333333, "x": "暖かい海から水が蒸発して、雲ができるからです。"}, {"t": 855.7333333333333, "x": "ところが海が氷におおわれると、話が変わります。"}, {"t": 859.35, "x": "2017年の論文の計算では、"}, {"t": 861.8666666666667, "x": "熱帯の空気の流れが変わります。"}, {"t": 864.3166666666667, "x": "凍った地球では今と逆向きになるのです。"}, {"t": 867.0333333333333, "x": "そうすると、赤道のあたりは雨の少ない砂漠になります。"}, {"t": 870.9666666666667, "x": "赤道が白く乾いた土地になるのです。"}, {"t": 873.4333333333333, "x": "熱帯の雨林とは、正反対の姿です。"}, {"t": 876.6666666666666, "x": "雪はほとんど降らず、氷の表面は乾いた風にさらされます。"}, {"t": 881.1333333333333, "x": "氷は少しずつ削られて空に逃げていきます。"}, {"t": 884.1166666666667, "x": "その一方で氷の上には土ぼこりが積もります。"}, {"t": 887.3333333333334, "x": "火山の灰も積もっていきます。"}, {"t": 889.2666666666667, "x": "氷の下の海ではどうなっていたのでしょう。"}, {"t": 891.8166666666667, "x": "日の光は厚い氷にさえぎられます。"}, {"t": 894.35, "x": "空気とのやりとりもほとんど止まります。"}, {"t": 896.65, "x": "すると海の水から酸素が減っていきます。"}, {"t": 899.3666666666667, "x": "酸素が少ない水には、鉄が溶けこみやすくなります。"}, {"t": 903.0333333333333, "x": "この鉄が、のちに地層に残ったと考えられています。"}, {"t": 906.7, "x": "カナダの北に、マッケンジー山脈があります。"}, {"t": 910.1666666666666, "x": "そこに、ラピタン層群という地層があります。"}, {"t": 913.3166666666667, "x": "氷河の時代の地層の中に、鉄を"}, {"t": 915.8166666666667, "x": "たくさんふくむ層がはさまっています。"}, {"t": 918.0166666666667, "x": "酸素の少ない海の水と、酸素をふくむ水が出会った。"}, {"t": 921.9166666666666, "x": "その所で鉄が沈んだと考えられています。"}, {"t": 924.8666666666667, "x": "赤道の氷河の跡、厚い海の氷、乾いた赤道、鉄の地層。"}, {"t": 930.5166666666667, "x": "どれも、凍った地球の姿とつながる手がかりです。"}, {"t": 934.1166666666667, "x": "ではこの凍った星に、名前を"}, {"t": 936.5, "x": "つけたのは誰だったのでしょう。"}, {"t": 938.1833333333333, "x": "1992年、一冊の分厚い本が出ました。"}, {"t": 942.3166666666667, "x": "古い時代の生き物の研究をまとめた、"}, {"t": 944.7833333333333, "x": "1348ページの本です。その中に"}, {"t": 947.7833333333333, "x": "短い文章が入っていました。"}, {"t": 950.2333333333333, "x": "わずか数ページの文章です。"}, {"t": 952.3, "x": "書いたのは、第2章に出てきたカーシュビンクです。"}, {"t": 955.6, "x": "題は原生代の終わりの、緯度の"}, {"t": 957.95, "x": "低い所までの地球規模の氷河。"}, {"t": 960.15, "x": "そして副題に、スノーボールアースという"}, {"t": 962.8166666666667, "x": "言葉がありました。この言葉が、ここで初めて名前として"}, {"t": 966.6166666666667, "x": "世に出たとされています。カーシュビンクはこの文章で、"}, {"t": 969.8333333333334, "x": "二つの考えを組み合わせました。"}, {"t": 972.3, "x": "一つは陸の配置です。陸の多くが、赤道に近い緯度や"}, {"t": 976.5333333333333, "x": "中ほどの緯度に集まっていた。"}, {"t": 978.3, "x": "それが、地球全体の凍結を起こしやすくしたと"}, {"t": 981.7666666666667, "x": "考えたのです。その理由として、"}, {"t": 983.9, "x": "よく挙げられることがあります。"}, {"t": 986.0166666666667, "x": "陸は、海より光をはね返しやすい性質があります。"}, {"t": 990.0666666666667, "x": "さらに陸が熱帯にあると、雨で岩がよく溶けます。"}, {"t": 993.7333333333333, "x": "岩が溶けるとき、空気の中の"}, {"t": 995.9166666666666, "x": "二酸化炭素が使われていきます。"}, {"t": 997.9833333333333, "x": "二酸化炭素が減ると、空気が熱をためこむ力が弱まります。"}, {"t": 1002.4, "x": "こうして、地球が冷えやすい条件が"}, {"t": 1005.0166666666667, "x": "そろっていたというわけです。"}, {"t": 1006.5666666666667, "x": "もう一つは溶けるしくみです。"}, {"t": 1008.4333333333333, "x": "ここが、この文章の大事な所でした。"}, {"t": 1011.4, "x": "地球が凍ると雨は降らなくなります。"}, {"t": 1013.85, "x": "岩が溶けることもほとんど止まります。"}, {"t": 1016.0833333333334, "x": "海の表面が凍ると海の中の営みも弱まります。"}, {"t": 1019.6166666666667, "x": "小さな生き物が二酸化炭素を使う量も減ります。"}, {"t": 1022.9833333333333, "x": "二酸化炭素を減らすしくみが、"}, {"t": 1024.9333333333334, "x": "ほとんど止まってしまうのです。"}, {"t": 1026.9333333333334, "x": "ところが火山は二酸化炭素を出し続けます。"}, {"t": 1029.8166666666666, "x": "すると空気の中の二酸化炭素は、"}, {"t": 1032.0666666666666, "x": "減ることなくたまり続けます。"}, {"t": 1034.0666666666666, "x": "長い年月がたつと、空気はとても熱を"}, {"t": 1037.05, "x": "ためこみやすくなります。やがて、"}, {"t": 1039.4833333333333, "x": "白い氷の冷やす力を上回るときが来ます。"}, {"t": 1042.3833333333334, "x": "そこで凍った地球は溶け始める。"}, {"t": 1044.6166666666666, "x": "カーシュビンクはそう考えました。"}, {"t": 1046.7, "x": "第3章で見た、戻れないはずの"}, {"t": 1049.05, "x": "問題に、出口を示したのです。"}, {"t": 1051.7166666666667, "x": "ただ、この文章は短く、本の中の小さな一編でした。"}, {"t": 1056.3, "x": "すぐに大きく取り上げられたわけではありません。"}, {"t": 1059.1333333333334, "x": "説が広く知られるようになるのは、それから6年後です。"}, {"t": 1062.8833333333334, "x": "舞台はアフリカの南西の国ナミビアです。"}, {"t": 1065.65, "x": "そこで別の研究者たちが、白い岩の層を調べていました。"}, {"t": 1069.95, "x": "ナミビアは、アフリカの南西の大西洋に面した国です。"}, {"t": 1074.0, "x": "国の西には乾いた砂漠が広がっています。"}, {"t": 1076.8333333333333, "x": "雨は少なく、草もまばらです。"}, {"t": 1079.3166666666666, "x": "北の方には、石灰の岩でできた山並みがあります。"}, {"t": 1083.0333333333333, "x": "オタビと呼ばれる地域の地層です。"}, {"t": 1085.15, "x": "植物が少ないので、地層の重なりがよく見えます。"}, {"t": 1088.8333333333333, "x": "この山並みで、長く調査を続けていた人たちがいます。"}, {"t": 1092.6166666666666, "x": "ハーバード大学のホフマンたちです。"}, {"t": 1094.9, "x": "ホフマンたちが注目したのは、氷河の跡の上下の岩です。"}, {"t": 1099.0333333333333, "x": "氷河の跡の下には、暖かい浅い"}, {"t": 1101.7833333333333, "x": "海でできた石灰の岩があります。"}, {"t": 1103.8833333333334, "x": "そして、氷河の跡の真上には薄い色の岩の層があります。"}, {"t": 1108.1166666666666, "x": "ふたのようにのっているのです。"}, {"t": 1109.9, "x": "炭酸塩でできた岩です。石灰岩のなかまです。"}, {"t": 1113.4, "x": "研究者は、これをキャップカーボネートと呼びます。"}, {"t": 1116.65, "x": "ふたのようにかぶさる炭酸塩の岩、という意味です。"}, {"t": 1120.2, "x": "不思議なのはこの組み合わせでした。"}, {"t": 1122.2833333333333, "x": "寒さの跡の真上に、暖かさの跡があるのです。"}, {"t": 1125.8833333333334, "x": "炭酸塩の岩はふつう暖かい海でできます。"}, {"t": 1128.9333333333334, "x": "寒い時代の氷河の跡の、すぐ真上にできるのは奇妙です。"}, {"t": 1133.0833333333333, "x": "しかも境目がはっきりしています。"}, {"t": 1135.35, "x": "寒い時代から暖かい時代へ、"}, {"t": 1137.4833333333333, "x": "いきなり切りかわったように見えるのです。"}, {"t": 1140.2, "x": "ホフマンたちは、岩にふくまれる炭素の性質も調べました。"}, {"t": 1144.3, "x": "炭素には重さのわずかに違う種類があります。"}, {"t": 1147.2666666666667, "x": "海の中では小さな生き物が育ちます。"}, {"t": 1149.9166666666667, "x": "その営みがさかんになると割合が変わります。"}, {"t": 1152.9166666666667, "x": "その割合が、氷河の跡の前後で大きくずれていました。"}, {"t": 1156.8666666666666, "x": "1998年、ホフマンたちは論文を出しました。"}, {"t": 1161.15, "x": "載ったのは科学雑誌のサイエンスです。"}, {"t": 1163.6166666666666, "x": "題は原生代のスノーボールアース。"}, {"t": 1165.9, "x": "論文はこう解釈しました。海の表面での生き物の営みが、"}, {"t": 1170.1333333333334, "x": "数百万年にわたってほとんど止まった。"}, {"t": 1172.95, "x": "それは、地球規模の氷河で海が閉ざされたからだ。"}, {"t": 1176.4833333333333, "x": "やがて火山の二酸化炭素がたまっていった。"}, {"t": 1179.2166666666667, "x": "今のおよそ350倍までたまったところで、"}, {"t": 1182.15, "x": "氷は突然終わった。溶けたあとの地球はとても暑くなった。"}, {"t": 1186.3833333333334, "x": "空気の中の大量の二酸化炭素が、海に溶けこんでいった。"}, {"t": 1190.5166666666667, "x": "そして暖かい海の表面で、炭酸塩が速く沈んでいった。"}, {"t": 1194.9166666666667, "x": "それが世界中の氷河の跡の上にのる、"}, {"t": 1197.45, "x": "ふたの岩だ、というのです。"}, {"t": 1199.7833333333333, "x": "カーシュビンクが示した出口。"}, {"t": 1201.6333333333334, "x": "それが、ナミビアの白い岩で"}, {"t": 1203.8166666666666, "x": "確かめられようとしていました。"}, {"t": 1205.5333333333333, "x": "論文は大きな反響を呼びました。"}, {"t": 1207.9166666666667, "x": "同時に反論もすぐに出ました。"}, {"t": 1209.9166666666667, "x": "オーストラリアや北アメリカの"}, {"t": 1211.5333333333333, "x": "氷河の跡は、ナミビアとは違う。"}, {"t": 1214.0333333333333, "x": "炭素の割合のずれにはほかの説明もありうる。"}, {"t": 1217.0, "x": "そういう反論です。ゆるい凍結、という呼び方もあります。"}, {"t": 1221.5333333333333, "x": "論争は今も続いています。ただ、"}, {"t": 1224.2833333333333, "x": "この1998年の論文が、きっかけになりました。"}, {"t": 1228.5, "x": "全球凍結は、世界の研究者が確かめる説になったのです。"}, {"t": 1232.9, "x": "数字についてもひとつ断っておきます。"}, {"t": 1235.4333333333334, "x": "二酸化炭素がどれだけたまれば溶けるのか。"}, {"t": 1238.0166666666667, "x": "1998年の論文では、今のおよそ350倍でした。"}, {"t": 1243.2, "x": "2017年のまとめの論文では、"}, {"t": 1245.6, "x": "1万から10万ppmとされています。"}, {"t": 1248.6833333333334, "x": "計算のしかたによって、答えには大きな幅があるのです。"}, {"t": 1252.6333333333334, "x": "全球凍結は、一度だけではなかったと考えられています。"}, {"t": 1256.7333333333333, "x": "クライオジェニアン紀と呼ばれる時代に、"}, {"t": 1258.8666666666666, "x": "大きな氷期が2回ありました。"}, {"t": 1261.1, "x": "クライオジェニアンとは、氷の時代という意味の名前です。"}, {"t": 1264.8666666666666, "x": "一度目がスターチアン氷期です。"}, {"t": 1266.95, "x": "始まりはおよそ7億1700万年前です。"}, {"t": 1270.1666666666667, "x": "終わりは、およそ6億5900万年前とされています。"}, {"t": 1274.45, "x": "2017年のまとめの論文に、年代の表があります。"}, {"t": 1278.5, "x": "その表では、長さは5800万年ほどになります。"}, {"t": 1282.4166666666667, "x": "ただ、2010年の発表は違います。"}, {"t": 1285.35, "x": "ハーバード大学の発表では、"}, {"t": 1287.2666666666667, "x": "少なくとも500万年と書かれていました。"}, {"t": 1290.1166666666666, "x": "年代の測定が進むにつれて、数字が変わってきたのです。"}, {"t": 1294.1333333333334, "x": "そのあいだずっと一度の凍結が続いたのか。"}, {"t": 1296.9833333333333, "x": "それとも、凍ったり溶けたりを何回かくり返したのか。"}, {"t": 1300.6666666666667, "x": "そこはまだ決まっていません。"}, {"t": 1302.4666666666667, "x": "一度目の凍結が終わってから、"}, {"t": 1304.4, "x": "しばらく氷のない時代が続きました。"}, {"t": 1307.05, "x": "その長さは、1000万年から"}, {"t": 1309.3833333333334, "x": "2000万年ほどと見積もられています。"}, {"t": 1311.6166666666666, "x": "そして二度目のマリノアン氷期が来ます。"}, {"t": 1314.0166666666667, "x": "二度目の始まりの時期は、まだよく決まっていません。"}, {"t": 1317.3666666666666, "x": "終わりはおよそ6億3500万年前です。"}, {"t": 1320.6, "x": "長さは300万年から1500万年と、"}, {"t": 1323.55, "x": "幅のある見積もりになっています。"}, {"t": 1325.8, "x": "二度目の終わりについては、"}, {"t": 1327.3833333333334, "x": "溶け方の速さが議論されてきました。"}, {"t": 1330.0, "x": "2017年のまとめの論文の計算があります。"}, {"t": 1333.3333333333333, "x": "熱帯の海が一度開くと、氷の端は"}, {"t": 1336.25, "x": "2000年ほどで極の方へ退いていきます。"}, {"t": 1338.9666666666667, "x": "白い氷が消えると暗い海が光を吸いこみます。"}, {"t": 1342.3333333333333, "x": "するとまた氷が溶けます。第3章の連鎖が"}, {"t": 1345.2666666666667, "x": "今度は逆向きに回るのです。"}, {"t": 1347.2833333333333, "x": "氷が溶けた水は海に流れこみます。"}, {"t": 1349.8166666666666, "x": "海の高さは急に上がっていきます。"}, {"t": 1352.1, "x": "陸の上の氷も、溶けて海へ流れこむからです。"}, {"t": 1355.5833333333333, "x": "フリンダース山脈に、エラティナ川という川があります。"}, {"t": 1359.4833333333333, "x": "その近くにこの時代のふたの岩があります。"}, {"t": 1362.1833333333334, "x": "ヌッカリーナ層と呼ばれる、薄い桃色や白っぽい岩です。"}, {"t": 1366.2833333333333, "x": "その中には、大きな波がつくった砂の模様が残っています。"}, {"t": 1370.5, "x": "ひとつの模様の高さが、1.4メートルほどに"}, {"t": 1373.8333333333333, "x": "積み重なった所もあります。"}, {"t": 1375.5833333333333, "x": "開いた海に、大きな波が立っていたことを示す跡です。"}, {"t": 1379.4666666666667, "x": "ただしふたの岩ができた速さには、異なる見方があります。"}, {"t": 1383.3666666666666, "x": "1998年の論文のモデルでは、数千年ほどの出来事でした。"}, {"t": 1388.5333333333333, "x": "一方で岩の磁石の記録を使う研究もあります。"}, {"t": 1391.9333333333334, "x": "そこからは、数万年から十数万年かかったと"}, {"t": 1395.4166666666667, "x": const a=document.getElementById('a');

const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

const mk=document.getElementById('mk');

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}

document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
