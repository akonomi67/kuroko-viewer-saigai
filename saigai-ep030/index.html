<script>
const D={"name": "ep030", "file": "ep030", "dur": 1839.7, "segs": [], "subs": [{"t": 0.0, "x": "イギリスの西に、細長く入りこんだ海があります。"}, {"t": 3.566666666666667, "x": "ブリストル海峡と呼ばれる海です。"}, {"t": 5.766666666666667, "x": "その奥は、セヴァーン川の河口につながっています。"}, {"t": 9.316666666666666, "x": "1607年の1月の終わりのことです。"}, {"t": 12.233333333333333, "x": "この海の水が陸に上がりました。"}, {"t": 14.366666666666667, "x": "北はウェールズ南はイングランドの両岸です。"}, {"t": 17.283333333333335, "x": "畑も牧場も村もひと朝で水の下になりました。"}, {"t": 20.566666666666666, "x": "のちの研究では、水につかった土地は"}, {"t": 23.216666666666665, "x": "500平方キロをこえます。"}, {"t": 25.0, "x": "亡くなった人は、およそ2000人と見積もられています。"}, {"t": 28.533333333333335, "x": "イギリスの陸の自然災害では最悪の部類です。"}, {"t": 31.783333333333335, "x": "この出来事には、当時の記録がたくさんあります。"}, {"t": 35.15, "x": "ロンドンでは小冊子が何冊も刷られました。"}, {"t": 38.06666666666667, "x": "町の書記の覚え書きもあります。"}, {"t": 40.13333333333333, "x": "教会の壁には水の高さの印も残っています。"}, {"t": 43.45, "x": "ところが肝心なことが決まっていません。"}, {"t": 45.833333333333336, "x": "この水は嵐が押しあげた高潮だったのか。"}, {"t": 48.65, "x": "それとも海の底で生まれた津波だったのか。"}, {"t": 51.333333333333336, "x": "400年あまりたった今も、考えは二つに分かれています。"}, {"t": 55.5, "x": "今回の舞台は、潮の満ち引きがとても大きな海です。"}, {"t": 59.25, "x": "記録が多いのになぜ答えが出ないのか。"}, {"t": 61.7, "x": "当時の人の言葉と、のちの研究を並べていきます。"}, {"t": 65.35, "x": "どちらの説にもうなずける根拠があります。"}, {"t": 67.98333333333333, "x": "そしてどちらの説にも弱いところがあります。"}, {"t": 70.71666666666667, "x": "その両方を順に見ていきます。"}, {"t": 72.83333333333333, "x": "ブリストル海峡は西に口を開いています。"}, {"t": 75.66666666666667, "x": "奥へ進むほど幅がせまくなります。"}, {"t": 77.96666666666667, "x": "地図で見ると横にねかせた漏斗の形です。"}, {"t": 80.66666666666667, "x": "いちばん奥にはセヴァーン川が流れこみます。"}, {"t": 83.51666666666667, "x": "この海には目立つ特徴があります。"}, {"t": 85.7, "x": "満ち潮と引き潮の差がとても大きいのです。"}, {"t": 88.5, "x": "その差は世界で二番目に大きいとされます。"}, {"t": 91.33333333333333, "x": "海の高さが一日に二回大きく上下します。"}, {"t": 94.41666666666667, "x": "引き潮になると広い干潟が顔を出します。"}, {"t": 97.21666666666667, "x": "灰色がかった茶色の泥の平地です。"}, {"t": 99.71666666666667, "x": "満ち潮になると干潟は海の下に消えます。"}, {"t": 102.45, "x": "海峡の両岸には、低くて平らな土地がありました。"}, {"t": 105.98333333333333, "x": "ウェールズ側はグウェント・レベルズです。"}, {"t": 108.16666666666667, "x": "イングランド側はサマセット・レベルズです。"}, {"t": 110.65, "x": "レベルズとは平らな低地という意味です。"}, {"t": 113.15, "x": "もとは海に近い湿地でした。"}, {"t": 115.15, "x": "人々は長い年月をかけて、海ぎわに土手を築きました。"}, {"t": 119.28333333333333, "x": "水路を掘って湿地の水を抜きました。"}, {"t": 121.81666666666666, "x": "そうしてできた土地は、草のよく育つ牧場になりました。"}, {"t": 125.63333333333334, "x": "羊や牛が放たれました。麦の畑も作られました。"}, {"t": 129.26666666666668, "x": "小さな村が点々と並びました。"}, {"t": 131.56666666666666, "x": "どの村にも石造りの教会がありました。"}, {"t": 134.2, "x": "ただしこの土地には弱みがあります。"}, {"t": 136.41666666666666, "x": "土地が低く海との境目は土手だけでした。"}, {"t": 139.08333333333334, "x": "土手が海を止めているうちは豊かな土地です。"}, {"t": 141.78333333333333, "x": "海が土手をこえると水はなかなか引きません。"}, {"t": 144.51666666666668, "x": "低地は水をためるお皿のような形だからです。"}, {"t": 147.55, "x": "1607年の1月も、人々はここで冬を過ごしていました。"}, {"t": 152.1, "x": "次はその朝の日付を確かめます。"}, {"t": 154.51666666666668, "x": "これが少しややこしいのです。"}, {"t": 156.43333333333334, "x": "この大水の日付は二通りに書かれています。"}, {"t": 159.35, "x": "一つは1607年1月30日です。"}, {"t": 162.58333333333334, "x": "もう一つは1606年1月20日です。"}, {"t": 165.68333333333334, "x": "年も日もちがいます。けれども同じ一日を指しています。"}, {"t": 169.45, "x": "理由は暦です。当時のイギリスは、"}, {"t": 171.96666666666667, "x": "ユリウス暦を使っていました。"}, {"t": 174.16666666666666, "x": "今の暦とは日付が10日ずれていました。"}, {"t": 176.81666666666666, "x": "しかも新しい年は3月25日に始まりました。"}, {"t": 180.38333333333333, "x": "1月はまだ前の年のうちだったのです。"}, {"t": 182.96666666666667, "x": "だから当時の人は、1606年1月20日と書きました。"}, {"t": 187.26666666666668, "x": "今の暦では1607年1月30日です。"}, {"t": 190.83333333333334, "x": "イギリスが今の暦に変えたのは、1752年です。"}, {"t": 195.08333333333334, "x": "ここからは今の暦の日付で話します。"}, {"t": 197.7, "x": "この日は火曜日でした。町の"}, {"t": 199.56666666666666, "x": "記録にも火曜日の朝とあります。"}, {"t": 201.71666666666667, "x": "もう一つ大事なのが潮です。"}, {"t": 203.68333333333334, "x": "この日は大潮のころでした。"}, {"t": 205.53333333333333, "x": "大潮は潮の差が大きくなる時期です。"}, {"t": 208.1, "x": "月と太陽の引く力が重なるからです。"}, {"t": 210.78333333333333, "x": "海峡の南岸に、アップルドアという港があります。"}, {"t": 214.5, "x": "デヴォン州の川の出口の町です。"}, {"t": 216.71666666666667, "x": "のちの研究者が、この朝の満潮の時刻を計算しました。"}, {"t": 220.93333333333334, "x": "アップルドアの満潮は、午前7時25分ごろです。"}, {"t": 224.91666666666666, "x": "川を12キロさかのぼったバーンスタプルは、"}, {"t": 227.56666666666666, "x": "7時40分ごろです。日の出は午前7時58分でした。"}, {"t": 232.15, "x": "いちばん潮が高いのは夜明けの少し前でした。"}, {"t": 235.15, "x": "冬の朝で外はまだ暗かったはずです。"}, {"t": 237.75, "x": "この満潮が話の鍵になります。"}, {"t": 240.01666666666668, "x": "潮の差がとても大きい海です。"}, {"t": 242.23333333333332, "x": "引き潮のときなら水は干潟の上で止まります。"}, {"t": 245.16666666666666, "x": "満潮のときならそのまま土手まで届きます。"}, {"t": 247.81666666666666, "x": "大潮の満潮と重なったことは、どの説も認めています。"}, {"t": 251.83333333333334, "x": "争いは満ち潮の上に何が乗ったのかです。"}, {"t": 254.66666666666666, "x": "大水のあとロンドンで小冊子が刷られました。"}, {"t": 257.55, "x": "挿絵の入った薄い読み物です。"}, {"t": 259.78333333333336, "x": "今でいえば号外のようなものです。"}, {"t": 261.96666666666664, "x": "小冊子どうしで、同じ挿絵が"}, {"t": 264.3833333333333, "x": "使い回されることもありました。"}, {"t": 266.21666666666664, "x": "サマセットの小冊子に載った版画が、のちに"}, {"t": 269.3833333333333, "x": "モンマスシャーの小冊子にも使われています。"}, {"t": 272.06666666666666, "x": "絵は、その土地を見て描かれたものとは"}, {"t": 274.65, "x": "限らなかったのです。その一冊にこんな話が載っています。"}, {"t": 278.51666666666665, "x": "海から6キロあまりの所に、一人の紳士が住んでいました。"}, {"t": 282.56666666666666, "x": "バーンスタプルとブリストルのあいだ、と書かれています。"}, {"t": 285.9, "x": "その朝紳士は畑を見に外へ出ました。"}, {"t": 288.7, "x": "海の方を見上げて紳士は立ちすくみました。"}, {"t": 291.5, "x": "いつも平らに見えていた土地が、見えないのです。"}, {"t": 294.6666666666667, "x": "丘も谷も、森も草地も、海にうまったように見えました。"}, {"t": 298.8666666666667, "x": "遠くの水は、地面より何ヤードも高く立っていました。"}, {"t": 302.56666666666666, "x": "紳士は、最初は山か雲のかたまりだと思いました。"}, {"t": 306.23333333333335, "x": "我に返って急いで家へもどりました。"}, {"t": 308.6166666666667, "x": "妻に見たことを話しました。"}, {"t": 310.43333333333334, "x": "家族に逃げる支度をさせました。"}, {"t": 312.5, "x": "荷物を持って、内陸の知人の家へ向かうつもりでした。"}, {"t": 316.4166666666667, "x": "けれども、荷物を背負う前に水が来たといいます。"}, {"t": 319.8333333333333, "x": "水の見え方をこう描いた小冊子もあります。"}, {"t": 322.8, "x": "転がる水の丘がいくつも重なって押し寄せた。"}, {"t": 325.71666666666664, "x": "世界一高い山々が、低い村をおおったようだった。"}, {"t": 329.48333333333335, "x": "霧かもやが来ると思った人もいた。"}, {"t": 331.75, "x": "山が燃えて煙を上げているようだった。"}, {"t": 334.2, "x": "無数の矢がいっせいに放たれたようだった。"}, {"t": 336.7, "x": "水の速さも書かれています。"}, {"t": 338.6166666666667, "x": "足の速い猟犬でも、前を走って逃げきれなかっただろう。"}, {"t": 342.8666666666667, "x": "この一文は、のちに何度も引かれることになります。"}, {"t": 346.26666666666665, "x": "ここで小冊子の性格にふれておきます。"}, {"t": 349.0, "x": "書き手はたいてい現地にいませんでした。"}, {"t": 351.3833333333333, "x": "ロンドンで知らせを受けて、急いでまとめたのです。"}, {"t": 354.73333333333335, "x": "ある書き手は前書きで打ち明けています。"}, {"t": 357.0833333333333, "x": "書くための時間は一日もなかったそうです。"}, {"t": 359.81666666666666, "x": "しかも、多くは大水を神の怒りと結びつけました。"}, {"t": 363.53333333333336, "x": "読者に行いを改めるよう説く、説教の色が濃い読み物です。"}, {"t": 368.05, "x": "一つ一つの言葉を、計器の数字のようには扱えません。"}, {"t": 372.03333333333336, "x": "それでも、山のような水という"}, {"t": 374.3333333333333, "x": "描き方はくり返し出てきます。"}, {"t": 376.25, "x": "この描き方を、のちの研究者は二通りに読みました。"}, {"t": 380.0833333333333, "x": "いちばん詳しいのは、ウェールズ側の小冊子です。"}, {"t": 383.65, "x": "題は「モンマスシャーからの悲しい知らせ」です。"}, {"t": 387.8666666666667, "x": "モンマスシャーは海峡の北岸にあった州です。"}, {"t": 390.8833333333333, "x": "小冊子は土地の役人の話として書いています。"}, {"t": 394.1333333333333, "x": "1月の火曜日、海が風にひどく揺り動かされた。"}, {"t": 397.81666666666666, "x": "海は土手をこえ、海ぞいの26の教区をのみこんだ。"}, {"t": 401.95, "x": "教区とは教会を中心にした村の単位です。"}, {"t": 404.98333333333335, "x": "小冊子は26の名前を一つずつ挙げています。"}, {"t": 408.3666666666667, "x": "マシャーン、カルディコット、マゴール、レドウィック。"}, {"t": 412.5, "x": "ゴールドクリフ、ナッシュ、クライストチャーチ。"}, {"t": 416.25, "x": "セント・ブライズ、ピーターストン、マーシュフィールド。"}, {"t": 419.8833333333333, "x": "どれもグウェント・レベルズの低地の村です。"}, {"t": 422.35, "x": "水は、長さ24マイル、幅4マイルをおおいました。"}, {"t": 426.65, "x": "長さはおよそ39キロ幅はおよそ6キロです。"}, {"t": 430.1166666666667, "x": "その範囲の羊や牛や馬は、ほとんどが溺れました。"}, {"t": 433.81666666666666, "x": "積んであった麦の山は根こそぎ流されました。"}, {"t": 436.73333333333335, "x": "たくさんの家が海に打ち倒されました。"}, {"t": 439.1166666666667, "x": "損害は、10万ポンドをこえると見積もられました。"}, {"t": 442.68333333333334, "x": "この土地は、州でいちばん豊かで"}, {"t": 445.03333333333336, "x": "実りの多い場所と呼ばれていました。"}, {"t": 447.0833333333333, "x": "水の下になった土地だけで、1年に"}, {"t": 449.68333333333334, "x": "4万ポンドの値打ちがあったといいます。"}, {"t": 452.01666666666665, "x": "被害は、海峡の北の州だけではありません。"}, {"t": 455.31666666666666, "x": "となりのグラモーガンでも、海から"}, {"t": 457.68333333333334, "x": "6キロほどの所に住む婦人が羊を失いました。"}, {"t": 460.95, "x": "その数は、400頭と書かれています。"}, {"t": 463.9, "x": "助かった人の話もいくつか載っています。"}, {"t": 466.51666666666665, "x": "ある男女は木に登って水をのがれていました。"}, {"t": 469.25, "x": "そこへ大きなたらいが流れてきました。"}, {"t": 471.6, "x": "たらいは二人のいる木に引っかかりました。"}, {"t": 473.93333333333334, "x": "二人はたらいに乗り移り、岸まで運ばれたそうです。"}, {"t": 477.6, "x": "4歳ほどの女の子の話もあります。"}, {"t": 480.18333333333334, "x": "母親は子どもを連れて逃げられませんでした。"}, {"t": 482.95, "x": "そこで家の梁の上に子どもを乗せました。"}, {"t": 485.53333333333336, "x": "助けが来たとき、子どもの胸には一羽のひよこがいました。"}, {"t": 489.26666666666665, "x": "そのぬくもりで命が守られた、と書かれています。"}, {"t": 492.6166666666667, "x": "ゆりかごで岸に流れ着いた、赤んぼうの話もあります。"}, {"t": 496.55, "x": "ゆりかごの中には一匹の猫がいました。"}, {"t": 499.06666666666666, "x": "猫は、ゆりかごの左右を跳び移っていたそうです。"}, {"t": 502.65, "x": "助からなかった人のことも記されています。"}, {"t": 505.3, "x": "海から6キロ以上離れた家の一人の婦人です。"}, {"t": 508.51666666666665, "x": "水に気づいて上の階へ逃げようとしました。"}, {"t": 511.23333333333335, "x": "けれどもその前に水に追いつかれました。"}, {"t": 513.7, "x": "亡くなった人の数にはこうあります。"}, {"t": 515.9833333333333, "x": "今わかっている数は、2000人をこえてはいない。"}, {"t": 519.2333333333333, "x": "まだ数えきれていないという書き方です。"}, {"t": 521.6833333333333, "x": "寒さと飢えで、さらに多くの命が失われるところでした。"}, {"t": 525.7833333333333, "x": "近くの領主と騎士が、ボートを出して人々を救いました。"}, {"t": 529.65, "x": "小冊子は、牧場がもとにもどるまで"}, {"t": 532.3666666666667, "x": "5年か6年かかると見ています。"}, {"t": 534.3833333333333, "x": "26の教区の名前は今も地図に残っています。"}, {"t": 537.6833333333333, "x": "ただ、その朝に亡くなった人のすべては分かっていません。"}, {"t": 541.4, "x": "海峡の南のイングランド側も同じでした。"}, {"t": 544.2833333333333, "x": "ロンドンの別の小冊子は、サマセット州を伝えています。"}, {"t": 548.3666666666667, "x": "1月の終わりごろ、満ち潮の海が陸の水とぶつかった。"}, {"t": 552.3166666666667, "x": "土手が食い破られ、海がサマセットへ流れこんだ。"}, {"t": 555.9, "x": "小冊子はそう書いています。"}, {"t": 557.85, "x": "陸の水とは、大雨などで増えた川の水と読めます。"}, {"t": 561.6333333333333, "x": "水は朝に入りはじめました。"}, {"t": 563.5833333333334, "x": "そして数時間のうちに広がりました。"}, {"t": 565.9833333333333, "x": "長さ20マイル幅は4マイルか5マイルです。"}, {"t": 568.9333333333333, "x": "長さおよそ32キロ幅6キロから8キロです。"}, {"t": 572.3333333333334, "x": "深さは、所により11フィートから12フィートでした。"}, {"t": 576.15, "x": "およそ3メートル40センチから、3メートル70センチです。"}, {"t": 580.5166666666667, "x": "もっと深い所もあったと書かれています。"}, {"t": 582.9833333333333, "x": "水は、ブリッジウォーターの町の方まで達しました。"}, {"t": 586.55, "x": "仕事に出る人々は、迫る水を見て家へ引き返しました。"}, {"t": 590.6333333333333, "x": "けれども戸口に着く前に水が来たといいます。"}, {"t": 593.4333333333333, "x": "村は水に囲まれた島のようになりました。"}, {"t": 596.05, "x": "やがて島も見えなくなりました。"}, {"t": 598.0, "x": "木と屋根の先だけが水の上に残ったそうです。"}, {"t": 600.9333333333333, "x": "北デヴォンの海岸にも記録があります。"}, {"t": 603.4, "x": "こちらは町の人が自分で書いたものです。"}, {"t": 605.9833333333333, "x": "バーンスタプルはトー川ぞいの港町です。"}, {"t": 608.75, "x": "海から12キロほど内陸にあります。"}, {"t": 611.1, "x": "教会の書記が帳面に覚え書きを残しました。"}, {"t": 614.2, "x": "大きな嵐が潮の満ちるのとともに川から来た。"}, {"t": 617.2333333333333, "x": "嵐は朝の3時から昼の12時まで続いた。"}, {"t": 620.3, "x": "そう書かれています。町の書記も年代記に書きとめました。"}, {"t": 623.9333333333333, "x": "大潮のいちばん高いときで、南西の風がとても強かった。"}, {"t": 628.0666666666667, "x": "水は波止場ちかくの家と地下室に入った。"}, {"t": 630.7833333333333, "x": "鍵のかかった戸を押し破った。"}, {"t": 632.7833333333333, "x": "多くの家と塀が倒れ塩や砂糖が失われた。"}, {"t": 635.9166666666666, "x": "波止場の石の台もすっかり水をかぶった。"}, {"t": 638.6, "x": "今生きている誰が見たよりも、"}, {"t": 640.3, "x": "5フィートか6フィート高かった。"}, {"t": 642.4666666666667, "x": "およそ1メートル50センチから、1メートル80センチです。"}, {"t": 646.8666666666667, "x": "一軒の家が倒れ、父親と二人の子どもが亡くなりました。"}, {"t": 651.05, "x": "子どもたちはまだ寝床にいたそうです。"}, {"t": 653.3166666666667, "x": "十数年後、デヴォンの地誌を書いた人も、"}, {"t": 656.4666666666667, "x": "この町の大水にふれています。"}, {"t": 658.7166666666667, "x": "大潮の日に、海からとても高くふくれた水が来て、"}, {"t": 662.2833333333333, "x": "家を倒し、家畜を溺れさせ、人の命をうばった。"}, {"t": 666.75, "x": "上の部屋に逃げた人の中には、"}, {"t": 668.6666666666666, "x": "そこから舟に乗って逃げた人もいた。"}, {"t": 671.15, "x": "地誌には、そう書かれています。"}, {"t": 673.4, "x": "川の石の橋も水をかぶりました。"}, {"t": 675.7166666666667, "x": "のちに、この町の記録をていねいに"}, {"t": 678.1166666666667, "x": "読み直した研究者がいます。"}, {"t": 679.9666666666667, "x": "記録に出てくる通りの名前と、"}, {"t": 681.8833333333333, "x": "今の地面の高さを照らし合わせたのです。"}, {"t": 684.7833333333333, "x": "水が届いた通りは、どこもほぼ同じ高さにそろいました。"}, {"t": 688.6333333333333, "x": "満潮の海面より、さらに数十センチ上まで"}, {"t": 692.1, "x": "水が来ていた計算です。書記の書いた「5フィートか"}, {"t": 695.5166666666667, "x": "6フィート高い」と合わせると、"}, {"t": 697.65, "x": "最初の水はもっと高かった可能性もあります。"}, {"t": 700.8833333333333, "x": "およそ1メートル80センチの波が、"}, {"t": 703.3666666666667, "x": "満ち潮の上に乗っていたという読み方です。"}, {"t": 706.25, "x": "橋の西の壁は、8センチから10センチ押し出されました。"}, {"t": 710.1833333333333, "x": "河口のアップルドアについては、小冊子が書いています。"}, {"t": 713.8833333333333, "x": "多くの家が倒されくずれた。"}, {"t": 715.7666666666667, "x": "帆を上げる支度をしていた60トンの船が、"}, {"t": 718.5, "x": "湿地まで運ばれた。船は満潮の線より"}, {"t": 721.3333333333334, "x": "高い所に乗り上げたのです。"}, {"t": 723.5, "x": "アップルドアの海ぞいの土地は、基準の海面より"}, {"t": 726.7833333333333, "x": "8メートル50センチほど高い所にあります。"}, {"t": 729.7166666666667, "x": "その家々が倒されたのなら、水は満潮の海面より"}, {"t": 733.4833333333333, "x": "3メートル以上高かったことになります。"}, {"t": 735.8166666666667, "x": "研究者は、そう見積もっています。"}, {"t": 738.4166666666666, "x": "ただし、これは小冊子の一文から逆算した数字です。"}, {"t": 742.6333333333333, "x": "倒れた家が、どこにあったのかまでは分かりません。"}, {"t": 745.95, "x": "今、この町々の海ぞいに1607年より"}, {"t": 749.3666666666667, "x": "古い建物は残っていないとされます。"}, {"t": 751.65, "x": "アップルドアで最も古いのは、1750年ごろの家です。"}, {"t": 756.1333333333333, "x": "バーンスタプルの記録に出てくる通りでも、"}, {"t": 758.5333333333333, "x": "建物はみな大水のあとに建て直されています。"}, {"t": 761.9333333333333, "x": "同じ朝、海峡の北と南でこれだけのことが起きていました。"}, {"t": 766.1833333333333, "x": "ウェールズ側の低地には、大水を伝える教会があります。"}, {"t": 770.2666666666667, "x": "ゴールドクリフの教会には、"}, {"t": 772.0333333333333, "x": "真ちゅうの板がかかっています。"}, {"t": 774.1833333333333, "x": "文字は当時の言葉づかいのままです。"}, {"t": 776.5166666666667, "x": "この教区では、5000ポンドあまりが失われた。"}, {"t": 779.85, "x": "そのうえ22人がこの教区で溺れた。"}, {"t": 782.5, "x": "読みやすくするとそういう中身です。"}, {"t": 784.75, "x": "5000ポンドは、今のお金で65万ポンドほどとされます。"}, {"t": 788.9166666666666, "x": "ここで目をとめたいのは22人という数です。"}, {"t": 791.8166666666667, "x": "小冊子の2000人は、広い地域をまとめた数でした。"}, {"t": 795.8333333333334, "x": "こちらは一つの村で失われた22人の命です。"}, {"t": 799.2166666666667, "x": "レドウィックの教会にも、水の高さの印があります。"}, {"t": 803.0333333333333, "x": "ナッシュとセント・ブライズの教会にもあります。"}, {"t": 805.7333333333333, "x": "どれも教会の外から見ることができます。"}, {"t": 808.3333333333334, "x": "ただし、すべてが大水の直後の物ではありません。"}, {"t": 812.0, "x": "のちに作られた板もある、と地元の団体は注意しています。"}, {"t": 816.0666666666667, "x": "海峡の南の、キングストン・シーモアにも板があります。"}, {"t": 819.8833333333333, "x": "教会の戸口の内側に、水の高さが示されています。"}, {"t": 823.9, "x": "村の多くは、少なくとも5フィートの水につかりました。"}, {"t": 827.6166666666667, "x": "およそ1メートル50センチです。"}, {"t": 829.85, "x": "大人の胸から肩ほどの深さです。"}, {"t": 832.1166666666667, "x": "家の一階は、ほとんど水の中です。"}, {"t": 834.8833333333333, "x": "こうした記念の板には、1606年と"}, {"t": 837.85, "x": "書かれたものがあります。古い暦の年の数え方のためです。"}, {"t": 841.7166666666667, "x": "では、板と印はどちらの説の味方なのでしょうか。"}, {"t": 845.45, "x": "実はどちらの味方もしません。"}, {"t": 847.5166666666667, "x": "印が教えるのは、水がそこまで来たという高さです。"}, {"t": 851.3333333333334, "x": "水がどうやって来たのかは、板に書かれていません。"}, {"t": 854.7333333333333, "x": "高潮でも津波でも同じ高さの水は来られます。"}, {"t": 857.9166666666666, "x": "問題はその水を何が運んできたのかです。"}, {"t": 860.8166666666667, "x": "研究者はそこで別の点に目を向けました。"}, {"t": 863.5833333333334, "x": "水が来る前、空はどうだったのか。"}, {"t": 866.2833333333333, "x": "荒れていたのか。それとも晴れていたのか。"}, {"t": 868.8833333333333, "x": "記録を読み比べると、ここで話が二つに割れます。"}, {"t": 872.45, "x": "まず嵐だったと読める記録です。"}, {"t": 874.5166666666667, "x": "いちばん分かりやすいのは、モンマスシャーの小冊子です。"}, {"t": 878.2833333333333, "x": "海が風にひどく揺り動かされ土手をこえた。"}, {"t": 881.0166666666667, "x": "風で海が荒れたとはっきり書いています。"}, {"t": 883.4833333333333, "x": "バーンスタプルの町の書記も、"}, {"t": 885.2333333333333, "x": "南西の強い風を書いていました。"}, {"t": 887.6666666666666, "x": "教会の書記は、嵐が朝の3時から"}, {"t": 890.4833333333333, "x": "昼まで続いたと書きました。"}, {"t": 892.15, "x": "南西の風は海峡の口から奥へ吹く風です。"}, {"t": 895.4, "x": "漏斗の口から水を奥へ押しこむ向きです。"}, {"t": 898.1666666666666, "x": "サマセットの小冊子は、満ち潮が"}, {"t": 900.8166666666667, "x": "陸の水とぶつかったと書きました。"}, {"t": 902.7333333333333, "x": "大雨で川の水が増えていたとも読めます。"}, {"t": 905.45, "x": "遠く離れた土地の記録もあります。"}, {"t": 907.65, "x": "同じ小冊子に、イングランドの東の話が載っています。"}, {"t": 911.6833333333333, "x": "ノーフォーク州の、キングズ・リンに近い湿地です。"}, {"t": 915.0333333333333, "x": "同じ月の同じ週、1月20日ごろに水が入ったそうです。"}, {"t": 919.2666666666667, "x": "春を前に牛を買いこんだ農家が、家畜を失いました。"}, {"t": 923.2166666666667, "x": "その冬は湿地が乾いていて、"}, {"t": 925.2833333333333, "x": "いつもの年より早く牛を放せたのです。"}, {"t": 928.2333333333333, "x": "そこへ、水がほうきで掃くように"}, {"t": 930.8333333333334, "x": "入ってきたと書かれています。"}, {"t": 932.4333333333333, "x": "牛たちは、湿地の中の小高い丘に逃げて助かりました。"}, {"t": 936.3166666666667, "x": "けれども丘のまわりは水に囲まれ、"}, {"t": 938.5166666666667, "x": "人も牛も渡れなくなりました。"}, {"t": 940.7833333333333, "x": "湿地は、16キロから19キロほどの範囲で"}, {"t": 944.1666666666666, "x": "水の下になったといいます。"}, {"t": 945.8, "x": "ウェールズの低地の歴史をまとめる"}, {"t": 947.7, "x": "団体も、ここを挙げています。"}, {"t": 949.85, "x": "次の日に、イングランド東部でも嵐の被害が記録された。"}, {"t": 953.8166666666667, "x": "それは嵐が国を横切ったことを示す。そういう見方です。"}, {"t": 957.8666666666667, "x": "同じ団体によれば、水は所によって10フィート、"}, {"t": 961.3833333333333, "x": "3メートルほどの深さになりました。"}, {"t": 963.7333333333333, "x": "カーディフ、ブリストル、グロスターといった"}, {"t": 966.85, "x": "町も、水をかぶったとされています。"}, {"t": 969.3833333333333, "x": "同じ団体は、いちばんありそうな原因をこうまとめます。"}, {"t": 973.3166666666667, "x": "とりわけ高い大潮に低い気圧が重なった。"}, {"t": 976.2333333333333, "x": "それで海面がさらに持ち上がった。そこへ激しい嵐が来た。"}, {"t": 980.35, "x": "高潮が土手をこえたり破ったりした。"}, {"t": 982.7833333333333, "x": "これが高潮説の筋書きです。"}, {"t": 984.9, "x": "台風が近づくと、海面が高くなるのと同じ仕組みです。"}, {"t": 988.95, "x": "気圧が下がると海は少し盛り上がります。"}, {"t": 991.6, "x": "空気が海を押す力が弱まるからです。"}, {"t": 994.2, "x": "強い風が吹き続けると、水が岸へ吹き寄せられます。"}, {"t": 998.0833333333334, "x": "それが大潮の満潮と重なります。"}, {"t": 1000.55, "x": "すると、ふだん届かない高さまで海が上がります。"}, {"t": 1004.0, "x": "しかもブリストル海峡は奥ほどせまい形です。"}, {"t": 1007.0833333333334, "x": "押しこまれた水は逃げ場がありません。"}, {"t": 1009.4, "x": "奥へ行くほど水は高くなります。"}, {"t": 1011.5833333333334, "x": "こう並べると嵐の説明はとても自然です。"}, {"t": 1014.5833333333334, "x": "ところが話はここで終わりません。"}, {"t": 1016.7833333333333, "x": "同じ朝について、ちがう空を書いた記録があるのです。"}, {"t": 1020.5, "x": "その記録も当時の小冊子の一冊です。"}, {"t": 1023.3, "x": "その朝の空をこう書いています。"}, {"t": 1025.45, "x": "とても美しく明るく晴れわたっていた。"}, {"t": 1027.9333333333334, "x": "嵐の朝とは思えない書き方です。"}, {"t": 1030.2666666666667, "x": "2002年、二人の研究者がこの言葉に注目しました。"}, {"t": 1034.4333333333334, "x": "オーストラリアの大学のエドワード・ブライアント。"}, {"t": 1037.2333333333333, "x": "イギリスの大学のサイモン・ハスレットです。"}, {"t": 1039.85, "x": "二人は、小冊子の描き方を津波の目撃談と比べました。"}, {"t": 1044.1666666666667, "x": "晴れた日に前ぶれなく水が来た。"}, {"t": 1046.2166666666667, "x": "水は山のように盛り上がって見えた。"}, {"t": 1048.45, "x": "煙や霧のようにも見えた。猟犬でも"}, {"t": 1050.9166666666667, "x": "逃げきれない速さで陸を走った。"}, {"t": 1053.2166666666667, "x": "こうした言葉は、のちの津波の証言によく似ています。"}, {"t": 1056.8833333333334, "x": "二人はそう考えました。一方で、"}, {"t": 1059.3333333333333, "x": "二人は自分たちに都合のよい"}, {"t": 1061.4666666666667, "x": "記録をうのみにもしていません。"}, {"t": 1063.25, "x": "コーンウォールの教会の帳面の表紙に、"}, {"t": 1065.8166666666666, "x": "こんな書きこみがあります。"}, {"t": 1067.6166666666666, "x": "1607年に恐ろしい大風があり、"}, {"t": 1070.3833333333334, "x": "砂が流れこんだのかもしれない。"}, {"t": 1072.75, "x": "けれども、これは大水から200年以上あとの"}, {"t": 1076.0, "x": "書きこみでした。二人は、この書きこみはとても疑わしいと"}, {"t": 1079.85, "x": "論文に書いています。記録を選ぶときの慎重さが、"}, {"t": 1083.1833333333334, "x": "この論争の土台になっています。"}, {"t": 1085.45, "x": "二人はデヴォンの町の記録も読み直しました。"}, {"t": 1088.2166666666667, "x": "そして気になる点を挙げています。"}, {"t": 1090.25, "x": "強い風は出てくるのに雨の話がほとんどない。"}, {"t": 1093.3166666666666, "x": "風が家を壊した話は内陸から見つからない。"}, {"t": 1096.4166666666667, "x": "被害は水の入った海ぞいに限られている。"}, {"t": 1099.1833333333334, "x": "ここで計算の話が出てきます。"}, {"t": 1101.35, "x": "高潮の研究者に、ケヴィン・ホースバーグがいます。"}, {"t": 1104.8833333333334, "x": "彼は、この大水を風で再現する計算をしていました。"}, {"t": 1108.9, "x": "当時はまだ発表前の計算でした。"}, {"t": 1111.4, "x": "大潮の満潮の上に、1.5メートルから2メートルの水を積む。"}, {"t": 1115.95, "x": "それにはどれほどの風がいるのか。"}, {"t": 1118.05, "x": "答えは時速およそ130キロの風でした。"}, {"t": 1121.1, "x": "風の強さを13の段に分けた表で、いちばん上の段です。"}, {"t": 1125.5, "x": "陸の上なら、家や木に大きな被害が出る強さです。"}, {"t": 1129.2833333333333, "x": "ブライアントとハスレットは、ここを突きました。"}, {"t": 1132.3166666666666, "x": "それほどの風なら内陸でも被害が出たはずだ。"}, {"t": 1135.1833333333334, "x": "けれどもそうした記録は見当たらない。"}, {"t": 1137.4166666666667, "x": "二人は強い風そのものは否定していません。"}, {"t": 1140.25, "x": "家を壊さない程度の強風なら、吹いていたかもしれない。"}, {"t": 1144.1333333333334, "x": "目安として二人が挙げたのは、"}, {"t": 1145.9833333333333, "x": "時速63キロから72キロほどの強い風です。"}, {"t": 1149.8666666666666, "x": "建物にほとんど被害を出さない、"}, {"t": 1151.8333333333333, "x": "いちばん強い風の段がそれにあたります。"}, {"t": 1154.75, "x": "論文にはそう書いています。"}, {"t": 1156.5833333333333, "x": "そのうえで、風だけでは説明しきれないと考えました。"}, {"t": 1160.45, "x": "もう一つ、満ち潮の波という考えも退けています。"}, {"t": 1164.4, "x": "川をさかのぼる潮の波は、満潮より"}, {"t": 1167.2166666666667, "x": "1時間以上も前に来ます。ところがバーンスタプルでは、"}, {"t": 1170.65, "x": "水は満潮のころに来ていました。"}, {"t": 1172.9833333333333, "x": "子どもたちがまだ寝床にいたからです。"}, {"t": 1175.2166666666667, "x": "二人は言葉の使い分けにも目をつけました。"}, {"t": 1177.95, "x": "当時の書き手は風をストームと書いています。"}, {"t": 1180.5666666666666, "x": "一方で、家を倒した水そのものを"}, {"t": 1183.3166666666666, "x": "テンペストと書いたらしい。"}, {"t": 1184.7833333333333, "x": "テンペストもふつうは嵐と訳す言葉です。"}, {"t": 1187.5, "x": "もし水を指していたなら、嵐の記録の読み方が変わります。"}, {"t": 1191.55, "x": "2004年の論文で、二人は津波の説明を取ると書きました。"}, {"t": 1195.8666666666666, "x": "理由は二つです。被害が海ぞいに限られていたこと。"}, {"t": 1199.4666666666667, "x": "海峡のほかの場所では、晴れた"}, {"t": 1201.7, "x": "空のもとで水が来たらしいこと。"}, {"t": 1203.6666666666667, "x": "言葉の読み比べだけでは決着はつきません。"}, {"t": 1206.5333333333333, "x": "そこで二人は海岸そのものを調べました。"}, {"t": 1209.2833333333333, "x": "大きな津波なら海岸に跡が残るはずです。"}, {"t": 1212.1833333333334, "x": "二人が注目したのは、岩の海岸に転がる大きな石でした。"}, {"t": 1216.5166666666667, "x": "海峡の岩の多い海岸には、波に"}, {"t": 1219.2166666666667, "x": "運ばれたらしい石があります。"}, {"t": 1221.0833333333333, "x": "屋根の瓦のように、斜めに重なり合った石もあります。"}, {"t": 1224.9666666666667, "x": "強い流れが一つの向きに押すとこう並びます。"}, {"t": 1227.9166666666667, "x": "岩の台の表面が、えぐられたように削れた所もありました。"}, {"t": 1232.1666666666667, "x": "海岸の土地が、まとめて削り取られたような"}, {"t": 1235.0833333333333, "x": "所もありました。二人は2007年、"}, {"t": 1237.6166666666666, "x": "これらを論文にまとめました。"}, {"t": 1239.7166666666667, "x": "その中で、大水の大きさをこう見積もっています。"}, {"t": 1243.3833333333334, "x": "水につかった低地は500平方キロ以上。"}, {"t": 1246.1833333333334, "x": "被害を受けた海岸の長さは570キロ。"}, {"t": 1249.25, "x": "二人は、石の大きさから波の高さを計算しました。"}, {"t": 1253.1333333333334, "x": "その石を動かすのに、どれほどの波がいるかです。"}, {"t": 1256.7333333333333, "x": "海峡の外側ではおよそ4メートル。"}, {"t": 1259.3, "x": "奥のセヴァーン川の河口では、6メートルをこえる。"}, {"t": 1262.75, "x": "そういう答えでした。流れの速さも見積もりました。"}, {"t": 1266.25, "x": "1秒あたり11.8メートルから、18.1メートルです。"}, {"t": 1270.7333333333333, "x": "時速に直すと、およそ42キロから65キロです。"}, {"t": 1274.6666666666667, "x": "走る自転車より、ずっと速い流れです。"}, {"t": 1277.7, "x": "奥へ行くほど速くなるという結果でした。"}, {"t": 1280.2833333333333, "x": "問題は石がいつ動いたのかです。"}, {"t": 1282.55, "x": "1607年の水だったとは限りません。"}, {"t": 1285.4666666666667, "x": "ほかの年の嵐かもしれないのです。"}, {"t": 1287.7333333333333, "x": "二人は、ダンレイヴン湾という海岸で年代を考えました。"}, {"t": 1291.8833333333334, "x": "この湾では、崖が少しずつ後ろへ下がっています。"}, {"t": 1295.4833333333333, "x": "その速さから、石の列が置かれた時期を逆算しました。"}, {"t": 1299.5166666666667, "x": "答えは、1590年から1672年のあいだです。"}, {"t": 1304.2666666666667, "x": "この幅の中に1607年が入っています。"}, {"t": 1307.3333333333333, "x": "ただし、1607年だけを指す数字ではありません。"}, {"t": 1311.3166666666666, "x": "80年ほどの幅があります。"}, {"t": 1313.3833333333334, "x": "そのあいだに、別の大きな嵐があったかもしれません。"}, {"t": 1317.0666666666666, "x": "津波説の手がかりはここで少し強まりました。"}, {"t": 1320.1, "x": "けれども決め手とまでは言えません。"}, {"t": 1322.15, "x": "しかも、この計算はのちに見直されることになります。"}, {"t": 1325.7333333333333, "x": "2021年、ハスレットは石の計算をやり直しました。"}, {"t": 1330.0166666666667, "x": "新しい共同研究者といっしょです。"}, {"t": 1332.5833333333333, "x": "2007年に使った式が、古くなっていたからです。"}, {"t": 1336.2166666666667, "x": "調べた石は全部で136個です。"}, {"t": 1339.0833333333333, "x": "そのうち129個が、波に運ばれた石とされました。"}, {"t": 1343.1, "x": "新しい式ではこういう答えになりました。"}, {"t": 1345.8166666666666, "x": "高さ4.2メートルの津波なら、すべての石を動かせる。"}, {"t": 1349.9166666666667, "x": "嵐の波なら、高さ16.9メートルが必要になる。"}, {"t": 1353.9, "x": "では、この海の嵐の波はどれくらいなのでしょう。"}, {"t": 1357.3, "x": "50年に一度の嵐で、海峡の奥はおよそ4.7メートルです。"}, {"t": 1362.1166666666666, "x": "セヴァーン川の河口は、およそ3.5メートルです。"}, {"t": 1365.7333333333333, "x": "16.9メートルにはとても届きません。"}, {"t": 1368.55, "x": "北大西洋の東の深い海なら、"}, {"t": 1370.8666666666666, "x": "35メートルの波も記録されています。"}, {"t": 1373.7333333333333, "x": "けれども、それは岸から遠い外洋の話です。"}, {"t": 1377.15, "x": "せまい海峡の奥まで、そのまま届く高さではありません。"}, {"t": 1381.0833333333333, "x": "二人の計算では、津波の高さは"}, {"t": 1383.6, "x": function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
