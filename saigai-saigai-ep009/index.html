<script>
const D={"name": "ep009", "file": "ep009", "dur": 1980.41665625, "segs": [], "subs": [{"t": 0.0, "x": "アメリカ合衆国の北の内陸、ノースダコタ州。"}, {"t": 3.566666666666667, "x": "その南西部の牧場に、少し変わった地層が"}, {"t": 6.8, "x": "顔を出している場所があります。"}, {"t": 8.566666666666666, "x": "厚さは、1メートル余り。砂と泥が、まだ固まりきらずに、"}, {"t": 13.216666666666667, "x": "柔らかいまま重なっています。"}, {"t": 15.433333333333334, "x": "その中には、魚の骨格が、同じ向きに"}, {"t": 18.833333333333332, "x": "そろって横たわっています。"}, {"t": 20.4, "x": "魚のえらの間には、直径1ミリ前後の、"}, {"t": 23.733333333333334, "x": "ガラスの粒がはさまっています。"}, {"t": 25.95, "x": "地層のいちばん上には、厚さ1センチから"}, {"t": 28.933333333333334, "x": "2センチの、薄い粘土の帯がかぶさっています。"}, {"t": 32.06666666666667, "x": "その粘土からは、地表ではめったに見つからない"}, {"t": 35.56666666666667, "x": "金属、イリジウムが見つかりました。"}, {"t": 36.13333333333333, "x": "イリジウム█"}, {"t": 38.416666666666664, "x": "ガラスの粒も金属も、およそ三千キロ離れた"}, {"t": 41.78333333333333, "x": "場所から、空を通って運ばれてきたものです。"}, {"t": 44.86666666666667, "x": "現在のメキシコ、ユカタン半島。"}, {"t": 46.233333333333334, "x": "ユカタン半島█"}, {"t": 47.416666666666664, "x": "いまからおよそ6600万年前、そこに、"}, {"t": 48.583333333333336, "x": "6600万年前█"}, {"t": 50.95, "x": "直径10キロ前後と見積もられる天体がぶつかりました。"}, {"t": 54.95, "x": "この地層を調べた研究チームは、これが衝突から"}, {"t": 58.583333333333336, "x": "1時間ほどのうちに積もったと考えました。"}, {"t": 61.15, "x": "もしそうなら、ある一日の、それも最初の数十分が、"}, {"t": 65.28333333333333, "x": "そのまま地層になっていることになります。"}, {"t": 67.88333333333334, "x": "ただし、この読み方には、いまも異論があります。"}, {"t": 71.65, "x": "本当に衝突の当日のものなのか。"}, {"t": 74.16666666666667, "x": "研究者のあいだで、決着はついていません。"}, {"t": 77.46666666666667, "x": "この回で追うのは、衝突という出来事そのものです。"}, {"t": 81.08333333333333, "x": "空から何が来て、地面に何が起き、"}, {"t": 83.85, "x": "揺れと波がどこまで届いたのか。"}, {"t": 86.08333333333333, "x": "そしてその記録が、どこに、"}, {"t": 88.16666666666667, "x": "どのくらいの細かさで残っているのか。"}, {"t": 90.73333333333333, "x": "発掘した人々は、この場所をタニスと名付けました。"}, {"t": 93.28333333333333, "x": "タニス█"}, {"t": 95.43333333333334, "x": "古い文字を読み解く手がかりになった碑文が"}, {"t": 97.88333333333334, "x": "見つかった、古代エジプトの都市の名前です。"}, {"t": 100.96666666666667, "x": "この地層が、衝突の最初の一日を読み解く"}, {"t": 104.2, "x": "手がかりになるように、という名前です。"}, {"t": 106.78333333333333, "x": "話は、イタリアの石灰岩から始まります。"}, {"t": 110.08333333333333, "x": "地質の年代では、恐竜がいた"}, {"t": 113.01666666666667, "x": "時代の最後を白亜紀と呼びます。"}, {"t": 113.71666666666667, "x": "白亜紀█"}, {"t": 115.45, "x": "その次の時代は、古第三紀です。"}, {"t": 118.1, "x": "二つの時代の境目は、世界のあちこちの"}, {"t": 121.03333333333333, "x": "地層に、一本の線として残っています。"}, {"t": 123.95, "x": "地質学では、この境目をK-Pg境界と呼んでいます。"}, {"t": 126.25, "x": "K-Pg境界█"}, {"t": 129.16666666666666, "x": "境目の上と下では、地層に含まれる化石の"}, {"t": 132.51666666666668, "x": "顔ぶれが、はっきり入れ替わります。"}, {"t": 134.95, "x": "長いあいだ、その原因は、火山や気候の変化が"}, {"t": 138.81666666666666, "x": "ゆっくり効いたものと考えられてきました。"}, {"t": 141.16666666666666, "x": "この境目に、別の角度から光を当てた人たちがいます。"}, {"t": 145.11666666666667, "x": "地質学者のウォルター・アルバレスと、"}, {"t": 147.2, "x": "物理学者だったその父、ルイス・アルバレス。"}, {"t": 150.48333333333332, "x": "そして、化学者のフランク・"}, {"t": 152.43333333333334, "x": "アサロと、ヘレン・ミシェルです。"}, {"t": 154.31666666666666, "x": "四人が測ったのは、イリジウムを"}, {"t": 156.58333333333334, "x": "はじめとする、白金のなかまの金属でした。"}, {"t": 159.78333333333333, "x": "これらの金属は、地球の表面の岩には、"}, {"t": 163.01666666666668, "x": "ほとんど含まれていません。"}, {"t": 164.83333333333334, "x": "一方、宇宙から来る物質には、"}, {"t": 167.41666666666666, "x": "地表の岩よりずっと多く含まれています。"}, {"t": 170.33333333333334, "x": "地層の中で急にこの金属が増えていれば、"}, {"t": 173.16666666666666, "x": "宇宙から何かが大量に届いた目印になります。"}, {"t": 176.66666666666666, "x": "1980年、四人は、その測定結果を"}, {"t": 180.96666666666667, "x": "サイエンス誌に発表しました。"}, {"t": 182.78333333333333, "x": "イタリアの深い海でできた石灰岩では、"}, {"t": 185.31666666666666, "x": "境目でイリジウムがふだんのおよそ30倍。"}, {"t": 188.41666666666666, "x": "デンマークでは、およそ160倍。"}, {"t": 191.13333333333333, "x": "ニュージーランドでは、およそ20倍。"}, {"t": 193.71666666666667, "x": "遠く離れた三つの場所で、同じ境目にだけ、"}, {"t": 197.05, "x": "はっきりした増え方が見つかったのです。"}, {"t": 199.71666666666667, "x": "四人は、地球の軌道と交わる大きな小惑星が"}, {"t": 203.31666666666666, "x": "ぶつかった、という仮説を示しました。"}, {"t": 206.01666666666668, "x": "衝突すると、天体の重さのおよそ60倍の"}, {"t": 209.48333333333332, "x": "岩が、粉になって大気へ吹き上げられる。"}, {"t": 212.2, "x": "その細かな塵が、数年のあいだ成層圏に"}, {"t": 215.43333333333334, "x": "残り、世界中に広がる。論文は、"}, {"t": 218.13333333333333, "x": "そういう筋道を描いています。"}, {"t": 220.66666666666666, "x": "天体の大きさは、四つの別々の方法で見積もられました。"}, {"t": 224.91666666666666, "x": "答えは、直径10キロ、前後4キロの"}, {"t": 228.16666666666666, "x": "幅つき、というものでした。"}, {"t": 230.21666666666667, "x": "同じ1980年、オランダのヤン・スミットらも、"}, {"t": 233.98333333333332, "x": "同じ趣旨の論文をネイチャー誌に出しています。"}, {"t": 236.95, "x": "スミットの名前は、のちにタニスの"}, {"t": 239.31666666666666, "x": "論文にも、共著者として登場します。"}, {"t": 242.08333333333334, "x": "ただ、この時点では、決定的なものが欠けていました。"}, {"t": 246.1, "x": "ぶつかった跡、つまりクレーターが、"}, {"t": 248.51666666666668, "x": "どこにも見つかっていなかったのです。"}, {"t": 250.8, "x": "次の手がかりは、1984年に、アメリカの"}, {"t": 254.96666666666667, "x": "モンタナ州東部から出てきました。"}, {"t": 256.93333333333334, "x": "陸でできた地層の、同じ境目の粘土から、"}, {"t": 260.0, "x": "石英の粒が取り出されました。"}, {"t": 262.31666666666666, "x": "その粒には、結晶の決まった向きに沿って、"}, {"t": 265.3833333333333, "x": "細い平行な筋が刻まれていました。"}, {"t": 268.01666666666665, "x": "衝撃石英█"}, {"t": 268.01666666666665, "x": "衝撃石英と呼ばれるものです。"}, {"t": 270.78333333333336, "x": "この筋は、非常に速い物体がぶつかったときの、"}, {"t": 274.15, "x": "一瞬の強い衝撃でできる特徴です。"}, {"t": 276.98333333333335, "x": "論文は、これを地球の外から来た大きな天体との、"}, {"t": 280.78333333333336, "x": "高速の衝突の産物だと結論づけています。"}, {"t": 284.03333333333336, "x": "境目の粘土には、宇宙の金属と、衝撃を受けた"}, {"t": 288.21666666666664, "x": "鉱物の、二つが混じっていたことになります。"}, {"t": 291.1333333333333, "x": "残る問いは、ひとつでした。"}, {"t": 293.2, "x": "その衝突は、どこで起きたのか。"}, {"t": 295.71666666666664, "x": "手がかりになったのは、境目の"}, {"t": 297.81666666666666, "x": "地層に含まれる、小さなガラスの粒でした。"}, {"t": 300.95, "x": "岩が一瞬で溶けて空へ飛び、冷えて"}, {"t": 303.5833333333333, "x": "固まると、丸いガラスの粒になります。"}, {"t": 306.5, "x": "1991年、カリブ海のハイチ、ベロックという"}, {"t": 311.05, "x": "場所の境目から、ガラスの粒が報告されました。"}, {"t": 314.48333333333335, "x": "粒の成分には、二つの種類がありました。"}, {"t": 317.6333333333333, "x": "大陸の地殻の岩が溶けてできた、ケイ素の多いガラス。"}, {"t": 321.3833333333333, "x": "そして、石灰分を含む泥の地層が"}, {"t": 324.2, "x": "溶けてできた、カルシウムの多いガラスです。"}, {"t": 327.15, "x": "つまり、ぶつかった場所は、大陸のふちの、"}, {"t": 330.45, "x": "浅い海の底だった可能性が高い。"}, {"t": 333.06666666666666, "x": "論文は、そう読み取っています。"}, {"t": 335.51666666666665, "x": "ハイチの粒は、平均で直径3ミリから"}, {"t": 338.55, "x": "4ミリ、大きいものでは8ミリを超えます。"}, {"t": 341.5833333333333, "x": "粒は、遠くへ行くほど小さくなる傾向があります。"}, {"t": 345.23333333333335, "x": "大きな粒が出るということは、衝突した"}, {"t": 348.06666666666666, "x": "場所がそれほど遠くない、ということです。"}, {"t": 350.78333333333336, "x": "同じ1991年、アラン・ヒルデブランドらの"}, {"t": 354.53333333333336, "x": "論文が、地質学の専門誌に載りました。"}, {"t": 357.65, "x": "ユカタン半島の地下にある構造を、白亜紀の"}, {"t": 360.73333333333335, "x": "終わりの衝突クレーターの候補とするものです。"}, {"t": 363.53333333333336, "x": "共著者には、グレン・ペンフィールドと、"}, {"t": 366.05, "x": "アントニオ・カマルゴの名前があります。"}, {"t": 368.45, "x": "二人は、それ以前から、メキシコの石油探査の"}, {"t": 372.0, "x": "中で、この地下の円い構造に気づいていました。"}, {"t": 375.15, "x": "同じ年、ネイチャー誌にも、この場所を題名に"}, {"t": 378.5833333333333, "x": "疑問符付きで紹介する論文が出ています。"}, {"t": 381.26666666666665, "x": "チクシュルーブ█"}, {"t": 381.26666666666665, "x": "チクシュルーブは、半島の北の海岸にある地名です。"}, {"t": 385.93333333333334, "x": "このクレーターは、地表からは見えません。"}, {"t": 388.8833333333333, "x": "衝突のあとに積もった石灰岩の下に、"}, {"t": 391.55, "x": "すっぽりと埋まっているからです。"}, {"t": 393.6333333333333, "x": "そのため、大きさの見積もりは、直径170キロから"}, {"t": 397.9, "x": "300キロまで、大きくばらついていました。"}, {"t": 400.81666666666666, "x": "直径が変われば、衝突のエネルギーの"}, {"t": 403.6, "x": "見積もりは、十倍ほども変わってしまいます。"}, {"t": 406.5833333333333, "x": "1995年、重力の測定データを細かく読み直した"}, {"t": 411.1666666666667, "x": "研究が、直径をおよそ180キロと示しました。"}, {"t": 415.01666666666665, "x": "この研究は、ユカタン半島の地表に開いている、"}, {"t": 418.56666666666666, "x": "水をたたえた穴の並び方も証拠に添えています。"}, {"t": 422.03333333333336, "x": "これについては、終章でもう一度触れます。"}, {"t": 425.1333333333333, "x": "年代の確認も進みました。2013年、"}, {"t": 428.25, "x": "岩に含まれるアルゴンの割合を"}, {"t": 430.68333333333334, "x": "使って、衝突と境目の年代が測り直されました。"}, {"t": 434.5, "x": "その結果、二つは、3万2千年の"}, {"t": 437.78333333333336, "x": "範囲の中で同時だと示されました。"}, {"t": 439.95, "x": "6600万年のうちの、3万2千年です。"}, {"t": 443.5833333333333, "x": "地質の時計としては、ほぼ同じ瞬間と言ってよい精度です。"}, {"t": 447.68333333333334, "x": "2010年には、世界の40人を超える研究者が、"}, {"t": 451.6333  {"t": 1173.95, "x": "口を開けて泳ぎ、えらで水をこして餌をとる魚が、"}, {"t": 1177.6833333333334, "x": "沈んでくる粒を吸い込んだと考えられています。"}, {"t": 1180.9333333333334, "x": "地層の途中には、落ちてきた粒が、柔らかい地面を"}, {"t": 1184.9333333333334, "x": "3センチから8センチへこませた跡もありました。"}, {"t": 1187.8666666666666, "x": "一度目の水が引き、二度目の水が来るまでのあいだ。"}, {"t": 1191.5, "x": "むき出しになった地面へ、粒が"}, {"t": 1193.75, "x": "空から落ちてきた、と読める跡です。"}, {"t": 1196.3, "x": "ここからが、タニスの読み方の核心です。"}, {"t": 1199.35, "x": "まず、この地層を作った水は、何だったのか。"}, {"t": 1203.0833333333333, "x": "論文自身が認めるとおり、この地層は、津波の"}, {"t": 1206.85, "x": "堆積物と、見た目の特徴がすべてそろっています。"}, {"t": 1210.3833333333334, "x": "しかし、メキシコ湾からの津波がタニスに"}, {"t": 1213.3333333333333, "x": "届くには、少なくとも18時間かかります。"}, {"t": 1216.5, "x": "そこで論文が持ち出したのが、セイシュという現象です。"}, {"t": 1218.9, "x": "セイシュ█"}, {"t": 1220.95, "x": "セイシュとは、湖や入り江など、閉じた水域の"}, {"t": 1224.45, "x": "水が、全体として大きく揺れ動く現象です。"}, {"t": 1227.8666666666666, "x": "浴槽の水を片側から押すと、水は"}, {"t": 1230.7333333333333, "x": "向こう側で盛り上がり、また戻ってきます。"}, {"t": 1233.5833333333333, "x": "それと同じことが、湖や入り江の大きさで起きるのです。"}, {"t": 1237.5166666666667, "x": "大きな地震の揺れは、遠く離れた場所の"}, {"t": 1240.3833333333334, "x": "水にも、この揺れを起こすことがあります。"}, {"t": 1243.0833333333333, "x": "津波と違って、水そのものが"}, {"t": 1245.4, "x": "長い距離を旅してくる必要はありません。"}, {"t": 1247.9333333333334, "x": "揺れが届けば、その場の水が、その場で揺れはじめます。"}, {"t": 1252.0333333333333, "x": "論文の計算では、この揺れは、世界中の閉じた"}, {"t": 1255.8, "x": "水域で、大きなセイシュを起こしえました。"}, {"t": 1258.6833333333334, "x": "その規模は、10メートルから100メートルとされます。"}, {"t": 1262.2, "x": "タニスの、少なくとも10メートルという"}, {"t": 1264.7666666666667, "x": "水の高さは、その範囲に入ります。"}, {"t": 1267.45, "x": "次に、時刻です。論文は、ガラスの粒が飛んできた道筋を、"}, {"t": 1272.3833333333334, "x": "弾道として計算し直しています。"}, {"t": 1274.95, "x": "粒が斜め30度から60度で打ち上げられたとすると、"}, {"t": 1278.35, "x": "タニスの上空に届くのは13分後から25分後。"}, {"t": 1282.35, "x": "粒が降りはじめるのは、およそ15分後。"}, {"t": 1285.4, "x": "大半は、1時間から2時間のうちに降り終えます。"}, {"t": 1289.1, "x": "衝撃石英は、より高く打ち上げられ、"}, {"t": 1292.05, "x": "およそ38分後から2時間後ごろに届くとされます。"}, {"t": 1295.9666666666667, "x": "ここで、地層の中身と照らし合わせます。"}, {"t": 1298.85, "x": "1.3メートルの地層の中には、"}, {"t": 1301.0833333333333, "x": "ガラスの粒が散らばっていました。"}, {"t": 1303.3166666666666, "x": "いちばん上の粘土の帯には、"}, {"t": 1305.15, "x": "衝撃石英とイリジウムが集まっていました。"}, {"t": 1308.25, "x": "もし地層の中の粒が、空から直接降ってきたものなら。"}, {"t": 1312.2, "x": "水が押し寄せていたのは、粒が"}, {"t": 1314.4, "x": "降っていたあいだ、ということになります。"}, {"t": 1316.9166666666667, "x": "論文は、この条件のもとで、水が来たのは衝突の"}, {"t": 1320.95, "x": "13分後から2時間後のあいだ、としています。"}, {"t": 1324.2, "x": "揺れがタニスに届いたのは、6分後から13分後。"}, {"t": 1327.9166666666667, "x": "その直後にセイシュが立ち上がれば、ガラスの"}, {"t": 1330.8666666666666, "x": "粒が降りはじめる時刻と、ちょうど重なります。"}, {"t": 1333.9833333333333, "x": "論文が描いた順番を、並べ直すと、次のようになります。"}, {"t": 1338.5, "x": "衝突から数分後、地面の揺れがタニスに届く。"}, {"t": 1342.0833333333333, "x": "内海の入り江の水が揺れ動き、"}, {"t": 1344.1166666666666, "x": "川をさかのぼって、陸の奥へ押し寄せる。"}, {"t": 1347.4333333333334, "x": "そのころ、空からガラスの粒が降りはじめ、"}, {"t": 1350.4833333333333, "x": "水の中の魚が、それをえらで受けとめる。"}, {"t": 1353.7833333333333, "x": "水はいったん引き、むき出しの地面に粒が刺さる。"}, {"t": 1357.1166666666666, "x": "二度目の水が押し寄せ、また引く。"}, {"t": 1359.7333333333333, "x": "最後に、衝撃石英やイリジウムを含む細かい"}, {"t": 1363.2166666666667, "x": "塵が降り積もって、全体にふたをする。"}, {"t": 1365.9166666666667, "x": "クレーターの中の130メートルが、"}, {"t": 1368.3166666666666, "x": "衝突した場所の真上の一日だとします。"}, {"t": 1371.3166666666666, "x": "するとタニスは、三千キロ離れた場所の、"}, {"t": 1374.2166666666667, "x": "同じ日の最初の数時間ということになります。"}, {"t": 1377.2333333333333, "x": "ただし、この読み方には、いくつもの「もし」が"}, {"t": 1381.7333333333333, "x": "含まれています。そのことを、次の章で整理します。"}, {"t": 1385.4166666666667, "x": "この回は、話を三つの段階に分けて扱います。"}, {"t": 1389.1833333333334, "x": "争われていないこと。有力だが、"}, {"t": 1391.4833333333333, "x": "確かめられている途中のこと。"}, {"t": 1393.6333333333334, "x": "そして、少数の見方や、決着のついていないことです。"}, {"t": 1397.95, "x": "一つ目、争われていない部分です。"}, {"t": 1400.7666666666667, "x": "6600万年前、ユカタン半島に天体がぶつかったこと。"}, {"t": 1405.2833333333333, "x": "それが、白亜紀と古第三紀の"}, {"t": 1407.4833333333333, "x": "境目と、ほぼ同じ時期だったこと。"}, {"t": 1409.9833333333333, "x": "その噴出物の層が、世界中の境目に広がっていること。"}, {"t": 1414.3, "x": "クレーターが直径およそ180キロで、"}, {"t": 1417.0666666666666, "x": "ピークリングを持 7, "x": "グラフの点や誤差の表し方に、不自然な点があること。"}, {"t": 1555.2166666666667, "x": "2021年の論文を載せた雑誌は、"}, {"t": 1557.9833333333333, "x": "2022年12月9日付で、注意書きを付けました。"}, {"t": 1562.5, "x": "データの信頼性が、現在疑問視されている、という"}, {"t": 1566.5833333333333, "x": "内容です。確認した時点で、注意書きは付いたままで、"}, {"t": 1570.55, "x": "最終的な判断は示されていません。"}, {"t": 1573.3833333333334, "x": "注意書きが付いているのは2021年の季節の"}, {"t": 1576.5666666666666, "x": "論文で、2019年の地層の論文ではありません。"}, {"t": 1580.3666666666666, "x": "それでも、同じ現場の読み方に、慎重な目が"}, {"t": 1583.9, "x": "向けられる理由のひとつにはなっています。"}, {"t": 1586.15, "x": "さらに少数の見方として、衝突が境目より30万年ほど"}, {"t": 1590.6333333333334, "x": "早かったとする、2004年の論文もあります。"}, {"t": 1593.9, "x": "この見方は、2013年の年代測定が示した、"}, {"t": 1597.6333333333334, "x": "3万2千年以内の同時性とは合いません。"}, {"t": 1600.7666666666667, "x": "2010年のまとめの結論とも異なる、少数の見方です。"}, {"t": 1605.1, "x": "この回の立場を、口に出しておきます。"}, {"t": 1607.9333333333334, "x": "衝突と、その規模と、年代は、"}, {"t": 1610.85, "x": "確かめられた事実として扱いました。"}, {"t": 1613.4333333333334, "x": "タニスを衝突から1時間から2時間の記録とする"}, {"t": 1616.6, "x": "読み方は、有力な説のひとつとして紹介しました。"}, {"t": 1620.1833333333334, "x": "確定した事実としては、扱っていません。"}, {"t": 1623.2833333333333, "x": "同じ1メートルの地層が、読み方しだいで、"}, {"t": 1626.3, "x": "数時間の記録にも、別の時期の洪水の跡にもなります。"}, {"t": 1630.45, "x": "揺れと波が収まったあとも、"}, {"t": 1632.2333333333333, "x": "衝突の影響は、空に残りました。"}, {"t": 1635.3166666666666, "x": "1980年の論文は、細かい塵が成層圏に"}, {"t": 1639.5166666666667, "x": "とどまり、日光をさえぎる筋道を描いていました。"}, {"t": 1643.0, "x": "その後の研究で、空へ上がったものは、"}, {"t": 1645.9833333333333, "x": "塵だけではないことが分かってきます。"}, {"t": 1648.5, "x": "ぶつかられた地面から出た、硫黄のガス。"}, {"t": 1651.3833333333334, "x": "岩が砕けてできた、非常に細かい塵。"}, {"t": 1654.25, "x": "そして、燃えたものから出た、すすです。"}, {"t": 1657.3833333333334, "x": "2019年の掘削の論文は、クレーターの中の岩に、"}, {"t": 1661.55, "x": "硫黄の多い蒸発岩がほとんど無いと報告しています。"}, {"t": 1665.2666666666667, "x": "地下にあったはずの石膏などが、"}, {"t": 1667.3, "x": "ガスとなって空へ出ていった。"}, {"t": 1669.2666666666667, "x": "それが、急な寒冷化と暗さに"}, {"t": 1671.7166666666667, "x": "つながったという見方を、この結果は支えています。"}, {"t": 1675.1833333333334, "x": "2023年には、塵の役割を"}, {"t": 1678.0833333333 セノーテです。セノーテとは、"}, {"t": 1797.4, "x": "石灰岩が水に溶かされてできた、"}, {"t": 1800.1333333333334, "x": "地下水をたたえた縦穴のことです。"}, {"t": 1802.6333333333334, "x": "ユカタン半島の北西部では、このセノーテが、"}, {"t": 1805.9, "x": "弧を描くように並んでいます。"}, {"t": 1808.05, "x": "1995年の研究は、この並びが、重力で見つかった"}, {"t": 1813.1, "x": "クレーターの縁と重なることを示しました。"}, {"t": 1815.5833333333333, "x": "縁の近くでは、衝突のあと、岩が内側へ"}, {"t": 1819.25, "x": "滑り落ちて、たくさんの割れ目ができました。"}, {"t": 1822.2, "x": "その割れ目に沿って地下水が流れやすくなり、"}, {"t": 1824.85, "x": "石灰岩が溶けて、穴が開いたと考えられています。"}, {"t": 1829.0166666666667, "x": "この弧は、セノーテの輪と呼ばれています。"}, {"t": 1829.8333333333333, "x": "セノーテの輪█"}, {"t": 1832.3, "x": "6600万年前の穴の縁が、地下水の"}, {"t": 1835.7, "x": "通り道として、地表に点線を描いているのです。"}, {"t": 1839.1666666666667, "x": "ユカタン半島の地面は、雨を"}, {"t": 1841.5666666666666, "x": "すぐに地下へしみこませてしまいます。"}, {"t": 1843.7166666666667, "x": "そのため、地表には川や湖がほとんどできません。"}, {"t": 1847.6166666666666, "x": "半島で使える淡水は、地下水だけだと報告されています。"}, {"t": 1851.9, "x": "セノーテの輪の地下水は、いまも"}, {"t": 1854.2666666666667, "x": "暮らしの水として使われています。"}, {"t": 1856.2833333333333, "x": "その水質を守ることが、いまの研究の課題になっています。"}, {"t": 1860.45, "x": "衝突の縁にできた割れ目が、川のない土地で、"}, {"t": 1863.7833333333333, "x": "水を集める仕組みになっているのです。"}, {"t": 1866.25, "x": "もうひとつは、海の底です。"}, {"t": 1868.55, "x": "ユカタン半島の西、カンペチェの沖の"}, {"t": 1871.5333333333333, "x": "メキシコ湾に、カンタレルという油田があります。"}, {"t": 1872.4, "x": "カンタレル█"}, {"t": 1874.9666666666667, "x": "この油田で、いちばん多くの石油を産み出してきた"}, {"t": 1878.25, "x": "地層は、白亜紀と古第三紀の境目にあります。"}, {"t": 1881.5, "x": "炭酸塩の岩の、角ばったかけらが積み重なった層です。"}, {"t": 1885.4333333333334, "x": "2000年と2002年の研究は、この層がチクシュルーブの"}, {"t": 1889.4166666666667, "x": "衝突と結びついてできたと報告しています。"}, {"t": 1892.2666666666667, "x": "衝突の揺れで浅い海の台地のふちが崩れ、"}, {"t": 1895.1666666666667, "x": "斜面の下に岩のかけらが厚く積もった。"}, {"t": 1898.15, "x": "その、すき間の多い岩の層が、のちに石油を"}, {"t": 1901.6666666666667, "x": "ためる入れ物になったという考え方です。"}, {"t": 1904.1666666666667, "x": "クレーターの存在に最初に気づいたのは、"}, {"t": 1906.6333333333334, "x": "石油を探していた技術者たちでした。"}, {"t": 1909.25, "x": "その穴の揺れで崩れた岩が、"}, {"t": 1911.15, "x": "いまの石油の入れ物になっていました。"}, {"t":   const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
