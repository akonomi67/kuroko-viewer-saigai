<script>
const D={"name": "ep018", "file": "ep018", "dur": 1979.36665625, "segs": [], "subs": [{"t": 0.0, "x": "アカホヤ。九州の南の農家や、土を調べる"}, {"t": 3.6, "x": "人たちが使ってきた呼び名です。"}, {"t": 5.45, "x": "畑を掘っていくと、ある深さで、"}, {"t": 7.983333333333333, "x": "黄色みを帯びた茶色の層にぶつかります。"}, {"t": 10.833333333333334, "x": "軽くて、固まりにくく、ほかの土とはっきり違う層です。"}, {"t": 15.183333333333334, "x": "この層が、じつは一回の噴火で降った灰だと"}, {"t": 18.65, "x": "分かったのは、1978年のことでした。"}, {"t": 20.216666666666665, "x": "1978年█"}, {"t": 22.45, "x": "灰を出したのは、陸の上の山ではありません。"}, {"t": 25.666666666666668, "x": "鹿児島県の南の海の底に沈んでいる、大きなくぼみです。"}, {"t": 29.883333333333333, "x": "名前を、鬼界カルデラといいます。"}, {"t": 30.633333333333333, "x": "鬼界カルデラ█"}, {"t": 32.9, "x": "いまからおよそ7300年前、ここで起きた噴火は、"}, {"t": 34.1, "x": "7300年前█"}, {"t": 37.15, "x": "日本で過去一万年のうちで最大とされています。"}, {"t": 40.833333333333336, "x": "噴火で生まれた高温の流れは、"}, {"t": 42.86666666666667, "x": "海の上を五十キロメートル以上も進み、"}, {"t": 45.833333333333336, "x": "九州の南の端に上がりました。"}, {"t": 48.31666666666667, "x": "細かい灰は風に乗り、四国を越え、"}, {"t": 51.03333333333333, "x": "東北地方の南の部分まで届きました。"}, {"t": 54.13333333333333, "x": "そして、南九州では、縄文時代の人々が暮らした"}, {"t": 58.333333333333336, "x": "跡が、噴火のあと、目に見えて少なくなります。"}, {"t": 61.85, "x": "ただ、この回の主役は、噴火の激しさだけではありません。"}, {"t": 66.16666666666667, "x": "日本の広い範囲に、ほぼ同じ時に降った"}, {"t": 69.1, "x": "一枚の灰の層が敷かれた、ということです。"}, {"t": 72.1, "x": "その一枚は、のちに研究者たちの物差しになりました。"}, {"t": 75.96666666666667, "x": "土器の新しい古いの順番を決める物差しです。"}, {"t": 79.1, "x": "そしてその物差しは、一度、年表を逆さまにしました。"}, {"t": 83.53333333333333, "x": "海の底の火山が、どうやって陸を襲ったのか。"}, {"t": 86.93333333333334, "x": "その灰が、なぜ縄文時代の時計になったのか。"}, {"t": 90.4, "x": "一枚の層をたどりながら、順に見ていきます。"}, {"t": 93.73333333333333, "x": "噴火が起きたのは、人が文字を"}, {"t": 95.86666666666666, "x": "書き始めるより、ずっと前のことです。"}, {"t": 98.48333333333333, "x": "記録は、紙ではなく、地面の中にしか残っていません。"}, {"t": 102.73333333333333, "x": "その地面の記録を、火山の研究者と、土器の"}, {"t": 106.31666666666666, "x": "研究者が、別々の方向から読んできました。"}, {"t": 109.61666666666666, "x": "はじめに、少しだけ時代の位置を確かめておきます。"}, {"t": 113.21666666666667, "x": "七千三百年前は、日本列島では縄文時代の"}, {"t": 117.1, "x": "早い時期の、終わりのころにあたります。"}, {"t": 119.63333333333334, "x": "土器を使い、木の実や魚や獣をとって暮らす"}, {"t": 122.9, "x": "人々が、九州の南にも多く住んでいました。"}, {"t": 126.23333333333333, "x": "その暮らしの跡の真上に、この灰は降りました。"}, {"t": 129.56666666666666, "x": "南九州の地面を掘ると、灰の下と上とで、"}, {"t": 133.13333333333333, "x": "見つかるものの量がはっきり変わります。"}, {"t": 135.68333333333334, "x": "その変わり方を数えた研究も、この回の後半で紹介します。"}, {"t": 140.43333333333334, "x": "話は、灰の正体が分かる前から始まります。"}, {"t": 143.93333333333334, "x": "九州の南の台地は、火山の灰や"}, {"t": 146.7, "x": "軽石が何枚も重なってできています。"}, {"t": 149.1, "x": "崖を見れば、色の違う層が、しま模様のように"}, {"t": 152.91666666666666, "x": "積み重なっているのが分かります。"}, {"t": 154.81666666666666, "x": "その中に、南九州のどこを掘っても出てくる、"}, {"t": 158.18333333333334, "x": "ひときわ目立つ一枚がありました。"}, {"t": 160.58333333333334, "x": "それが、アカホヤと呼ばれていた層です。"}, {"t": 163.46666666666667, "x": "ただ、それがどこから来たのかは、"}, {"t": 165.73333333333332, "x": "はっきりしていませんでした。"}, {"t": 167.68333333333334, "x": "西日本の各地の地層にも、薄い灰の層が挟まっています。"}, {"t": 171.96666666666667, "x": "それらは、ばらばらの噴火の灰なのか。"}, {"t": 174.75, "x": "それとも、南九州の層と同じ、一つの噴火の灰なのか。"}, {"t": 179.63333333333333, "x": "それを確かめたのが、町田洋さんと"}, {"t": 182.36666666666667, "x": "新井房夫さんという二人の研究者です。"}, {"t": 184.91666666666666, "x": "二人は、灰の中に含まれる細かい粒を調べました。"}, {"t": 188.63333333333333, "x": "火山の灰には、マグマが急に冷えてできたガラスの"}, {"t": 191.96666666666667, "x": "かけらや、小さな鉱物の粒が入っています。"}, {"t": 195.25, "x": "その種類や性質は、噴火ごとに少しずつ違います。"}, {"t": 199.08333333333334, "x": "いわば、灰の指紋です。各地の"}, {"t": 201.43333333333334, "x": "灰の指紋を比べていくと、遠く離れた場所の"}, {"t": 204.8, "x": "層どうしが、同じ性質を持っていることが分かりました。"}, {"t": 208.45, "x": "1978年█"}, {"t": 208.45, "x": "1978年、二人は論文を発表します。"}, {"t": 212.71666666666667, "x": "南九州の鬼界カルデラから噴き出した、"}, {"t": 215.33333333333334, "x": "広い範囲に広がる灰。その灰を、"}, {"t": 217.68333333333334, "x": "土地の呼び名をそのまま借りて、"}, {"t": 220.03333333333333, "x": "アカホヤ火山灰と名づけました。"}, {"t": 222.25, "x": "論文によれば、灰は西日本から中部日本の大部分と、"}, {"t": 226.48333333333332, "x": "太平洋の北西の海にまで広がっていました。"}, {"t": 229.71666666666667, "x": "灰が降った範囲の長さは、千キロメートルを超えます。"}, {"t": 233.55, "x": "一つの噴火が、日本列島の半分以上に、"}, {"t": 236.98333333333332, "x": "同じ一枚の層を残していたのです。"}, {"t": 239.58333333333334, "x": "これは、研究者にとって、特別な意味を持ちます。"}, {"t": 243.63333333333333, "x": "地層の中で、場所をまたいで"}, {"t": 245.7, "x": "同じ時を指す層のことを、鍵層と呼びます。"}, {"t": 248.91666666666666, "x": "鍵になる層、という意味です。"}, {"t": 251.3, "x": "ある遺跡の地面と、何百キロメートルも離れた"}, {"t": 254.68333333333334, "x": "別の遺跡の地面を、同じ一枚の線でつなげる。"}, {"t": 258.06666666666666, "x": "それができる層は、そう多くありません。"}, {"t": 260.98333333333335, "x": "アカホヤは、その中でも、ずば抜けて"}, {"t": 263.8666666666667, "x": "広い範囲に追える鍵層になりました。"}, {"t": 266.1666666666667, "x": "このとき、灰の年代は、六千年から"}, {"t": 269.28333333333336, "x": "六千五百年前ほどとされました。"}, {"t": 271.48333333333335, "x": "炭の中に残る炭素を使って測った数字です。"}, {"t": 274.6666666666667, "x": "この数字は、のちに大きく書き換わります。"}, {"t": 277.6166666666667, "x": "そのいきさつは、この回の後半で見ていきます。"}, {"t": 281.0, "x": "まずは、この灰を出した場所へ向かいます。"}, {"t": 283.93333333333334, "x": "鹿児島の南の、海の上です。"}, {"t": 286.53333333333336, "x": "鹿児島県の大隅半島の南の端から、"}, {"t": 289.45, "x": "南へおよそ四十キロメートル。"}, {"t": 291.81666666666666, "x": "そこの海の底に、鬼界カルデラがあります。"}, {"t": 294.9, "x": "カルデラとは、大きな噴火のあとに、地面が"}, {"t": 298.23333333333335, "x": "落ちこんでできた、鍋のようなくぼみのことです。"}, {"t": 301.35, "x": "気象庁の資料によると、その大きさは、"}, {"t": 304.25, "x": "東西がおよそ二十三キロメートル、"}, {"t": 306.8333333333333, "x": "南北がおよそ十六キロメートル。"}, {"t": 309.35, "x": "底は、海面から三百メートルから"}, {"t": 312.15, "x": "五百メートルほどの深さにあります。"}, {"t": 314.3, "x": "くぼみのほとんどは、海の中に沈んでいて、"}, {"t": 317.35, "x": "船の上から見ても、ただの海にしか見えません。"}, {"t": 320.8833333333333, "x": "ただ、その縁の一部だけが、島として海の上に出ています。"}, {"t": 325.35, "x": "竹島█"}, {"t": 325.35, "x": "竹島と、薩摩硫黄島です。どちらも、"}, {"t": 326.5833333333333, "x": "薩摩硫黄島█"}, {"t": 329.1166666666667, "x": "鹿児島県の三島村に属する島です。"}, {"t": 332.6666666666667, "x": "薩摩硫黄島は、東西およそ六キロメートル、"}, {"t": 335.95, "x": "南北およそ三キロメートルの小さな島です。"}, {"t": 339.21666666666664, "x": "その島が、差し渡し二十キロメートルを超える"}, {"t": 342.4, "x": "くぼみの、ほんの縁の一かけらにすぎません。"}, {"t": 345.28333333333336, "x": "竹島の崖にも、薩摩硫黄島の崖にも、噴火の"}, {"t": 349.0833333333333, "x": "順番どおりに積もった層が、むき出しになっています。"}, {"t": 352.4166666666667, "x": "研究者たちは、その崖の層を、一枚ずつ調べてきました。"}, {"t": 356.98333333333335, "x": "この二つの島は、カルデラの北側の縁にあたります。"}, {"t": 360.65, "x": "つまり、島の崖を見ることは、巨大な"}, {"t": 363.8, "x": "くぼみの縁の断面を見ることでもあります。"}, {"t": 366.35, "x": "この場所で大きな噴火が起きたのは、"}, {"t": 368.56666666666666, "x": "一度だけではありません。東京大学地震研究所や"}, {"t": 372.25, "x": "産総研の地質調査総合センターの"}, {"t": 374.76666666666665, "x": "資料には、さらに古い噴火も記録されています。"}, {"t": 378.03333333333336, "x": "およそ十四万年前に、一度。"}, {"t": 380.76666666666665, "x": "およそ九万五千年前に、もう一度。"}, {"t": 383.8833333333333, "x": "どちらも、大量の高温の流れを出した大きな噴火でした。"}, {"t": 387.96666666666664, "x": "7300年前█"}, {"t": 387.96666666666664, "x": "7300年前の噴火のマグマは、"}, {"t": 390.8666666666667, "x": "大量にたまっていたと推定されています。"}, {"t": 394.05, "x": "その深さは、地下およそ七キロメートルです。"}, {"t": 397.2, "x": "温度は、摂氏およそ九百六十度と見積もられています。"}, {"t": 401.23333333333335, "x": "その量は、岩の体積に直して、"}, {"t": 403.9166666666667, "x": "七十から八十立方キロメートル。"}, {"t": 406.5833333333333, "x": "噴き出したものを、すき間を含めて全部合わせると、"}, {"t": 409.93333333333334, "x": "百五十から百七十立方キロメートルに達するとされます。"}, {"t": 414.1333333333333, "x": "火山の噴火の大きさを表す、"}, {"t": 416.23333333333335, "x": "火山爆発指数という物差しがあります。"}, {"t": 419.3666666666667, "x": "この噴火は、そのうち上から"}, {"t": 421.53333333333336, "x": "二番目の、七に分類されています。"}, {"t": 424.1666666666667, "x": "ギリシャのサントリーニ島の古代の噴火や、"}, {"t": 426.73333333333335, "x": "インドネシアのクラカタウの噴火は、一つ下の六です。"}, {"t": 430.71666666666664, "x": "時期も、確かめておきます。"}, {"t": 432.93333333333334, "x": "この噴火は、暖かくなっていく時代の中で起きました。"}, {"t": 436.68333333333334, "x": "海面の上昇がいちばん高くなる、"}, {"t": 438.8833333333333, "x": "少し前のことと考えられています。"}, {"t": 441.6166666666667, "x": "噴火のあと、カルデラの縁では、新しい火山が育ちました。"}, {"t": 446.2, "x": "いまの薩摩硫黄島の山は、そうしてできたものです。"}, {"t": 449.73333333333335, "x": "それでは、その噴火は、どんな順番で進んだのでしょうか。"}, {"t": 454.06666666666666, "x": "島の崖に残る層が、その順番を教えてくれます。"}, {"t": 457.9, "x": "噴火は、いきなり最大の場面から"}, {"t": 460.48333333333335, "x": "始まったわけではありません。"}, {"t": 462.15, "x": "薩摩硫黄島と竹島の崖を細かく調べた研究があります。"}, {"t": 466.28333333333336, "x": "東北大学と東京大学の研究者による、2007年の論文です。"}, {"t": 469.76666666666665, "x": "2007年█"}, {"t": 472.01666666666665, "x": "崖の層は、下から順に、四つのまとまりに分けられました。"}, {"t": 476.5, "x": "いちばん下は、空から降ってきた軽石の層です。"}, {"t": 479.98333333333335, "x": "その次が、噴煙の柱が崩れて流れ下った層。"}, {"t": 483.6166666666667, "x": "その次が、いちばん大規模な高温の流れの層。"}, {"t": 487.18333333333334, "x": "そしていちばん上が、その流れから"}, {"t": 489.7, "x": "舞い上がって降った、細かい灰の層です。"}, {"t": 492.71666666666664, "x": "下にあるものほど、先に積もったものです。"}, {"t": 495.65, "x": "ですから、この順番が、そのまま噴火の進み方になります。"}, {"t": 500.0833333333333, "x": "最初の段階は、軽石を空高く噴き上げる噴火でした。"}, {"t": 504.3, "x": "噴煙の柱の高さは、四十キロメートルから"}, {"t": 507.53333333333336, "x": "四十三キロメートルと見積もられています。"}, {"t": 510.03333333333336, "x": "この柱から降った軽石は、九州の本土では幸屋の"}, {"t": 514.15, "x": "幸屋█"}, {"t": 514.8333333333334, "x": "軽石、島の側では船倉の軽石と呼ばれています。"}, {"t": 516.5166666666667, "x": "船倉█"}, {"t": 519.55, "x": "同じ層でも、見つかった場所ごとに、"}, {"t": 522.1833333333333, "x": "別々に名前がつけられてきたのです。"}, {"t": 524.7166666666667, "x": "遠い本土の層と、火口に近い島の層は、"}, {"t": 527.9666666666667, "x": "別々の研究者たちが調べてきました。"}, {"t": 530.75, "x": "名前が二つあるのは、その道のりの名残です。"}, {"t": 534.0666666666667, "x": "この段階で噴き出した量は、およそ四十立方キロメートル。"}, {"t": 538.15, "x": "一秒あたり二億キログラムという勢いで、"}, {"t": 540.9, "x": "マグマが噴き出していたと計算されています。"}, {"t": 543.8166666666667, "x": "その勢いが続いた時間は、少なくとも二十八時間ほど。"}, {"t": 548.0833333333334, "x": "論文は、丸一日以上だったと見積もっています。"}, {"t": 551.6833333333333, "x": "やがて、高く上がっていた噴煙の柱が、"}, {"t": 554.7333333333333, "x": "自分の重さを支えきれなくなって崩れます。"}, {"t": 557.7666666666667, "x": "崩れた噴煙は、高温の流れとなって、"}, {"t": 560.7666666666667, "x": "火口のまわりに流れ下りました。"}, {"t": 563.0333333333333, "x": "島の崖には、この流れが残した、"}, {"t": 565.6666666666666, "x": "何枚もの薄い層があります。"}, {"t": 567.8166666666667, "x": "その中には、熱で粒どうしが溶けてくっつき、"}, {"t": 570.9, "x": "固い岩のようになった層も含まれています。"}, {"t": 573.95, "x": "積もったときに、まだ相当な熱を"}, {"t": 576.4833333333333, "x": "持っていたことを示しています。"}, {"t": 578.25, "x": "つまりこの流れは、止まって積もったあとも、"}, {"t": 581.15, "x": "しばらく熱を持ち続けていたことになります。"}, {"t": 584.0666666666667, "x": "研究者たちは、この段階で、マグマと"}, {"t": 587.3833333333333, "x": "海の水が触れ合い始めたと考えています。"}, {"t": 590.0666666666667, "x": "火山の口が、浅い海の中にあったからです。"}, {"t": 593.35, "x": "そして、カルデラの縁にある断層の上を、次の"}, {"t": 597.0, "x": "段階の流れが覆っていることも分かりました。"}, {"t": 599.6166666666667, "x": "地面の落ちこみは、最大の流れが出る前から、"}, {"t": 602.9166666666666, "x": "すでに始まっていたのかもしれません。"}, {"t": 605.3166666666667, "x": "ここまでが、いわば前置きです。"}, {"t": 607.7833333333333, "x": "次に来たのが、九州の本土まで届いた、最大の流れでした。"}, {"t": 612.5666666666667, "x": "火山から出る高温の流れを、火砕流といいます。"}, {"t": 616.1333333333333, "x": "火山の灰や軽石、岩のかけらが、熱いガスと"}, {"t": 620.0666666666667, "x": "混ざり合い、地面を這うように流れ下るものです。"}, {"t": 623.2666666666667, "x": "その速さは、ふつうの川の水とは比べものになりません。"}, {"t": 627.1333333333333, "x": "7300年前█"}, {"t": 627.1333333333333, "x": "7300年前の噴火で出た最大の火砕流は、"}, {"t": 631.2, "x": "九州の本土では、幸屋火砕流と呼ばれています。"}, {"t": 632.8333333333334, "x": "幸屋火砕流█"}, {"t": 635.6833333333333, "x": "島の側では、竹島の火砕流と呼ばれてきました。"}, {"t": 639.4333333333333, "x": "名前をつけたのは、1973年に"}, {"t": 641.2333333333333, "x": "1973年█"}, {"t": 643.0833333333334, "x": "論文を書いた宇井忠英さんです。"}, {"t": 645.4333333333333, "x": "その論文の題には、この流れの"}, {"t": 647.85, "x": "特徴が、そのまま書かれています。"}, {"t": 650.25, "x": "極めて薄く、広がって積もった火砕流、です。"}, {"t": 654.4, "x": "ふつう、火砕流の積もったものは、"}, {"t": 656.8833333333333, "x": "谷を埋め、厚くたまります。"}, {"t": 659.35, "x": "ところが幸屋火砕流は、山も谷も関係なく、"}, {"t": 662.7666666666667, "x": "土地を薄く覆うように積もっていました。"}, {"t": 665.4666666666667, "x": "流れが、それだけ勢いよく、"}, {"t": 667.8333333333334, "x": "遠くまで広がったということです。"}, {"t": 670.1666666666666, "x": "流れは、カルデラからまわりの海へ広がりました。"}, {"t": 673.5833333333334, "x": "そして、北に向かった流れは、海の上を進みました。"}, {"t": 677.7666666666667, "x": "その距離は、五十キロメートル以上。"}, {"t": 680.4666666666667, "x": "流れは海を渡りきり、薩摩半島と"}, {"t": 683.4166666666666, "x": "大隅半島の南の部分に上がりました。"}, {"t": 686.05, "x": "種子島の南の部分、屋久島、そのほかカルデラの"}, {"t": 690.1333333333333, "x": "まわりの島々にも、同じ流れの跡が残っています。"}, {"t": 693.65, "x": "追いかけていくと、火口から百キロメートルほどの"}, {"t": 696.8166666666667, "x": "場所まで、この流れの積もったものがたどれます。"}, {"t": 699.8333333333334, "x": "ここで一つの疑問が出てきます。"}, {"t": 701.8666666666667, "x": "高温の流れが、なぜ水の上を"}, {"t": 704.3, "x": "五十キロメートルも進めたのか。"}, {"t": 706.2666666666667, "x": "研究者たちは、いくつかの考え方を示しています。"}, {"t": 709.9666666666667, "x": "一つは、海の水が火口に一気に"}, {"t": 712.6, "x": "流れこんだ、という考え方です。"}, {"t": 715.15, "x": "急に膨らんだ水蒸気が、流れに"}, {"t": 717.75, "x": "大きな勢いを与えたというものです。"}, {"t": 720.0, "x": "もう一つは、もともと非常に"}, {"t": 722.0333333333333, "x": "速い流れだった、という考え方です。"}, {"t": 724.9666666666667, "x": "さえぎるもののない海の上を進んだことで、"}, {"t": 727.6833333333333, "x": "勢いを保ったというものです。"}, {"t": 729.7833333333333, "x": "ただ、2007年の論文は、どちらについても、"}, {"t": 730.3166666666667, "x": "2007年█"}, {"t": 733.8333333333334, "x": "今後さらに詳しい検討が必要だと書いています。"}, {"t": 737.65, "x": "海の水が、この種の流れにどう働くのか。"}, {"t": 740.9, "x": "それは、まだ解けきっていない問題なのです。"}, {"t": 743.9, "x": "似たような例は、世界にもあります。"}, {"t": 746.5166666666667, "x": "ギリシャのサントリーニ島や、インドネシアの"}, {"t": 749.3666666666667, "x": "クラカタウも、海の中や海辺で起きた噴火でした。"}, {"t": 752.8333333333334, "x": "それでも、海の水と火山の関わりについては、"}, {"t": 756.2333333333333, "x": "まだ分からないことが多いと、論文は書いています。"}, {"t": 759.9166666666666, "x": "これまでの研究の多くが、陸の"}, {"t": 762.35, "x": "上で起きた噴火に向けられてきたからです。"}, {"t": 764.7333333333333, "x": "流れが上がった先の陸では、"}, {"t": 766.6, "x": "森が大規模に壊れたと考えられています。"}, {"t": 769.5833333333334, "x": "ただ、火砕流の積もったものの中から、そのときの"}, {"t": 773.2, "x": "集落が見つかった例は、まだありません。"}, {"t": 775.9333333333333, "x": "人の骨が直接見つかった例も、いまのところありません。"}, {"t": 779.8666666666667, "x": "何が起きたのかは、別の方向から、"}, {"t": 782.5833333333334, "x": "少しずつ確かめられてきました。"}, {"t": 784.7666666666667, "x": "その一つが、海の岸に残された、薄い砂の層です。"}, {"t": 789.25, "x": "海の底の火山が大きく噴火すれば、海そのものも動きます。"}, {"t": 793.5666666666667, "x": "7300年前█"}, {"t": 793.5666666666667, "x": "7300年前の噴火でも、津波が起きたと考えられています。"}, {"t": 798.9, "x": "その証拠として、噴火と結びつく津波の"}, {"t": 801.7666666666667, "x": "砂の層が、各地で報告されてきました。"}, {"t": 804.7, "x": "大分市の海辺。カルデラに近い屋久島。"}, {"t": 807.6833333333333, "x": "そして、2020年に発表された研究では、"}, {"t": 808.4333333333333, "x": "2020年█"}, {"t": 811.5166666666667, "x": "徳島県の海岸でも見つかっています。"}, {"t": 814.55, "x": "その場所は、海岸線から二百メートルほど"}, {"t": 817.65, "x": "内陸に入った、低い土地です。"}, {"t": 820.0, "x": "地面を十三メートルの深さまで掘り抜いて、"}, {"t": 822.85, "x": "地層の柱を取り出しました。"}, {"t": 824.9333333333333, "x": "その中に、アカホヤの灰の層がありました。"}, {"t": 828.0166666666667, "x": "そして灰のすぐ下に、厚さ四センチメートルの"}, {"t": 831.3, "x": "砂の層が挟まっていました。"}, {"t": 833.0833333333334, "x": "砂の層のさらに下は、泥の層です。"}, {"t": 836.0166666666667, "x": "泥と砂のさかいめは、くっきりと分かれていました。"}, {"t": 839.4166666666666, "x": "静かに泥がたまっていた場所に、ある時、"}, {"t": 842.2833333333333, "x": "突然砂が運びこまれたということです。"}, {"t": 845.15, "x": "しかも、その砂の層と灰の層は、"}, {"t": 847.8833333333333, "x": "すき間なく接していました。"}, {"t": 849.7, "x": "砂が運ばれてから灰が降るまでに、"}, {"t": 851.9666666666667, "x": "時間があいていないのです。"}, {"t": 853.8666666666667, "x": "研究者たちは、この砂を、噴火と同時に起きた津波が"}, {"t": 857.95, "x": "運んだものである可能性が高いと考えました。"}, {"t": 860.8833333333333, "x": "アカホヤの灰の真下に砂の層がある"}, {"t": 863.15, "x": "場所は、ほかにもあります。"}, {"t": 865.0, "x": "大分県と和歌山県の、海辺の湿地です。"}, {"t": 868.4833333333333, "x": "一か所だけなら、嵐の高波かもしれません。"}, {"t": 871.7333333333333, "x": "けれども、離れた何か所もで同じ並びが見つかっています。"}, {"t": 875.5833333333334, "x": "それなら、広い範囲に届いた"}, {"t": 877.7833333333333, "x": "大きな津波だったと考えるほうが自然です。"}, {"t": 880.55, "x": "そして、この並びには、もう一つの意味があります。"}, {"t": 884.3, "x": "遠く離れた海岸には、灰が降るより前に、"}, {"t": 887.4333333333333, "x": "波が着いていたということです。"}, {"t": 889.6, "x": "では、その津波は、何が起こしたのでしょうか。"}, {"t": 893.2166666666667, "x": "ここは、研究者の考えが分かれている点です。"}, {"t": 896.6833333333333, "x": "カルデラに近い屋久島などでは、津波の砂の"}, {"t": 899.75, "x": "層の上を、火砕流の積もったものが覆っています。"}, {"t": 903.2, "x": "ここから、火砕流が海に流れこんだことが"}, {"t": 906.1, "x": "津波を起こした、という考えが出されました。"}, {"t": 909.0833333333334, "x": "一方、2020年の研究は、計算で別の答えを出しています。"}, {"t": 909.7333333333333, "x": "2020年█"}, {"t": 915.1666666666666, "x": "火砕流が流れこむだけでは、徳島の"}, {"t": 917.9166666666666, "x": "海岸まで水をあふれさせるには足りない。"}, {"t": 920.3666666666667, "x": "三十分から九十分ほどの短い時間で、カルデラが"}, {"t": 924.3, "x": "一気に崩れ落ちる必要がある、というものです。"}, {"t": 927.55, "x": "その計算では、最も速い崩れ方の場合、"}, {"t": 930.75, "x": "崩れ始めてから二時間半ほどで波が着きます。"}, {"t": 934.0, "x": "徳島の海岸で、高さは七メートルほどです。"}, {"t": 937.45, "x": "これは、あくまで一つの計算の結果です。"}, {"t": 940.6, "x": "けれども、九州から四国の海までの広い範囲が、"}, {"t": 944.1666666666666, "x": "同じ日に揺さぶられた可能性を示しています。"}, {"t": 947.2833333333333, "x": "海の上を走った火砕流からは、"}, {"t": 949.45, "x": "細かい灰が大量に舞い上がりました。"}, {"t": 952.0833333333334, "x": "その灰は、高い空を西から東へ"}, {"t": 954.8666666666667, "x": "吹く風、偏西風に乗りました。"}, {"t": 957.2333333333333, "x": "行き先は、九州の東側、四国、"}, {"t": 960.5333333333333, "x": "紀伊半島、そして本州の東へ。"}, {"t": 963.6833333333333, "x": "灰が降った範囲は、東北地方の南半分にまで及んでいます。"}, {"t": 968.2833333333333, "x": "積もった厚さは、場所によって大きく違います。"}, {"t": 971.5833333333334, "x": "宮崎県都城市の教育委員会の研究者、"}, {"t": 975.1166666666667, "x": "桒畑光博さんは、この違いに目をつけました。"}, {"t": 978.9666666666667, "x": "厚さをもとに、九州とそのまわりを、"}, {"t": 981.7, "x": "四つの区域に分けています。"}, {"t": 983.9, "x": "一つめは、火砕流そのものに覆われた区域です。"}, {"t": 987.4166666666666, "x": "鹿児島県の本土の南半分と、"}, {"t": 989.7666666666667, "x": "種子島、屋久島などの島々です。"}, {"t": 992.9666666666667, "x": "二つめは、火砕流は届かなかったものの、"}, {"t": 995.9, "x": "灰が三十センチメートル以上積もった区域。"}, {"t": 999.0, "x": "鹿児島県の本土の北半分、宮崎県の大部分、"}, {"t": 1002.9833333333333, "x": "熊本県の南の端がここに入ります。"}, {"t": 1006.0333333333333, "x": "三つめは、十センチメートルから"}, {"t": 1008.25, "x": "三十センチメートルの区域。"}, {"t": 1010.1, "x": "熊本県や大分県の大部分、四国、紀伊半島の南西の端です。"}, {"t": 1015.6, "x": "四つめは、十センチメートルより薄い区域。"}, {"t": 1018.7, "x": "九州の北西部、本州の西の大半、そして"}, {"t": 1022.4333333333333, "x": "東北の南半分より南の、本州の東側です。"}, {"t": 1026.3666666666666, "x": "灰が三十センチメートル積もるということは、"}, {"t": 1029.0833333333333, "x": "地面がまるごと一枚、新しい層で覆われるということです。"}, {"t": 1033.5833333333333, "x": "山の斜面で草木が傷むと、雨のたびに斜面が崩れます。"}, {"t": 1037.75, "x": "土石流や洪水が繰り返し起き、"}, {"t": 1040.0, "x": "大量の灰が川から海岸へ運ばれました。"}, {"t": 1043.1833333333334, "x": "宮崎や鹿児島の海辺では、その跡が確かめられています。"}, {"t": 1047.25, "x": "川の河口や浅い海が、運ばれてきた灰や"}, {"t": 1050.35, "x": "土砂で、埋まっていったのです。"}, {"t": 1052.4666666666667, "x": "水の底で暮らす生き物たちにも、"}, {"t": 1054.5166666666667, "x": "大きな影響があったと考えられています。"}, {"t": 1057.3666666666666, "x": "灰の性質そのものも、特徴的です。"}, {"t": 1060.35, "x": "香川県高松市の山の中では、道路工事で"}, {"t": 1063.75, "x": "アカホヤの層が現れたことがあります。"}, {"t": 1066.0666666666666, "x": "厚さは、三十から四十センチメートルでした。"}, {"t": 1069.45, "x": "香川大学の研究者が調べると、その灰は、"}, {"t": 1072.9166666666667, "x": "黄色みを帯びた茶色で、驚くほど軽いものでした。"}, {"t": 1076.65, "x": "乾いた状態での重さは、一立方センチメートルあたり"}, {"t": 1080.5, "x": "〇・四五グラム。水より軽いということになります。"}, {"t": 1083.9166666666667, "x": "踏み固めようとしても、なかなか締まりません。"}, {"t": 1087.0166666666667, "x": "南九州の農家が、この層をほかの土と"}, {"t": 1090.2, "x": "はっきり区別してきたのも、うなずけます。"}, {"t": 1092.9, "x": "一方で、遠く離れた地域では、"}, {"t": 1095.4666666666667, "x": "灰の影響は見えにくくなります。"}, {"t": 1097.8666666666666, "x": "東京湾のまわりでは、ちょうどこの噴火の前後から、"}, {"t": 1101.3333333333333, "x": "貝塚がむしろ急に増えていることが知られています。"}, {"t": 1104.7833333333333, "x": "同じ一枚の灰でも、それがどれほどの"}, {"t": 1107.4833333333333, "x": "災害だったかは、場所によってまるで違ったのです。"}, {"t": 1110.7833333333333, "x": "九州の南では、暮らしの土台を丸ごと覆う出来事。"}, {"t": 1114.65, "x": "遠く離れた土地では、灰がうっすらと"}, {"t": 1117.2333333333333, "x": "積もった、という程度の出来事。"}, {"t": 1119.5666666666666, "x": "それでも、どちらの土地の地面にも、"}, {"t": 1122.1166666666666, "x": "同じ灰の層がはさまっています。"}, {"t": 1124.4166666666667, "x": "次の章からは、その同じ層が、"}, {"t": 1126.95, "x": "研究の道具に変わっていく話です。"}, {"t": 1129.65, "x": "ここからは、灰の層が、どうやって"}, {"t": 1132.4333333333334, "x": "物差しになったのかを見ていきます。"}, {"t": 1134.5, "x": "考古学では、見つかった土器の形や模様を比べて、"}, {"t": 1138.0666666666666, "x": "どれが古く、どれが新しいかを並べます。"}, {"t": 1141.6833333333334, "x": "形が似ているものは、近い時代のもの。"}, {"t": 1144.5833333333333, "x": "単純な形から複雑な形へ、あるいは"}, {"t": 1147.8666666666666, "x": "その逆へ、少しずつ移り変わっていく。"}, {"t": 1150.8833333333334, "x": "そうした見方で、土器の年表が組み立てられてきました。"}, {"t": 1154.5333333333333, "x": "南九州でも、その方法で、縄文時代の"}, {"t": 1158.35, "x": "土器が並べられていました。"}, {"t": 1159.85, "x": "底のとがった土器や、底の丸い土器は、古い時代のもの。"}, {"t": 1164.1, "x": "平らな底をした、筒のような形の、貝殻で模様を"}, {"t": 1168.15, "x": "つけた土器は、それより新しい時代のもの。"}, {"t": 1171.1166666666666, "x": "そう考えられていたのです。"}, {"t": 1172.9333333333334, "x": "そこに、アカホヤの層が現れます。"}, {"t": 1175.65, "x": "1978年█"}, {"t": 1175.65, "x": "1978年に、この灰が一つの"}, {"t": 1179.3333333333333, "x": "噴火で一度に降ったものだと分かりました。"}, {"t": 1182.05, "x": "一度に降った灰なら、その層より"}, {"t": 1184.5166666666667, "x": "下にあるものは、必ず噴火より前のもの。"}, {"t": 1187.5166666666667, "x": "その層より上にあるものは、必ず噴火よりあとのものです。"}, {"t": 1191.6, "x": "形の似かたや、研究者の考えとは関係なく、"}, {"t": 1195.2166666666667, "x": "上と下という位置だけで、前と後ろが決まります。"}, {"t": 1199.0, "x": "南九州の研究者たちは、この一枚を目印に、"}, {"t": 1202.8833333333334, "x": "土地を掘り分けていきました。"}, {"t": 1204.8333333333333, "x": "すると、思いがけないことが起きました。"}, {"t": 1207.55, "x": "古いと考えられていた、底のとがった土器が、"}, {"t": 1210.6833333333334, "x": "アカホヤの層の上から出てきたのです。"}, {"t": 1213.2166666666667, "x": "そして、新しいと考えられていた、平らな底の"}, {"t": 1217.0333333333333, "x": "筒形の土器が、アカホヤの層の下から見つかりました。"}, {"t": 1220.6166666666666, "x": "土器の順番は、まるごと入れ替わりました。"}, {"t": 1223.6166666666666, "x": "都城市の教育委員会の研究者は、1995年の"}, {"t": 1226.6333333333334, "x": "1995年█"}, {"t": 1228.8166666666666, "x": "報告で、このときのことを書いています。"}, {"t": 1231.6666666666667, "x": "両者の配置が逆転し、年表が組み直された、と。"}, {"t": 1236.0166666666667, "x": "形の見た目だけで組んだ年表が、一枚の灰の"}, {"t": 1239.4166666666667, "x": "位置によって、ひっくり返されたのです。"}, {"t": 1242.0166666666667, "x": "南九州の地面には、アカホヤのほかにも、"}, {"t": 1245.2166666666667, "x": "多くの灰の層が重なっています。"}, {"t": 1247.5833333333333, "x": "鹿児島県霧島市にある上野原遺跡は、"}, {"t": 1249.5166666666667, "x": "上野原遺跡█"}, {"t": 1251.0833333333333, "x": "そうした層に守られてきた場所です。"}, {"t": 1254.1333333333334, "x": "文化庁の資料によれば、この遺跡は、アカホヤより"}, {"t": 1257.9333333333334, "x": "ずっと古い軽石の層のすぐ下から見つかりました。"}, {"t": 1260.9666666666667, "x": "五十二棟の竪穴の住まいの跡が、"}, {"t": 1263.3, "x": "軽石に覆われて残っていたのです。"}, {"t": 1265.8333333333333, "x": "台地の上には、十数枚の灰の"}, {"t": 1268.35, "x": "層が厚く積もっているとされます。"}, {"t": 1270.35, "x": "この集落の年代は、資料によって、"}, {"t": 1273.1166666666666, "x": "九千五百年前とも、一万六百年前とも書かれています。"}, {"t": 1277.8166666666666, "x": "いずれにしても、アカホヤの噴火より、"}, {"t": 1280.35, "x": "ずっと前の暮らしの跡です。"}, {"t": 1282.45, "x": "何枚も重なった灰の層は、南九州では、"}, {"t": 1285.9166666666667, "x": "そのまま時代の区切りの線として使われています。"}, {"t": 1289.1, "x": "その中でも、アカホヤは、九州から東北の"}, {"t": 1292.6666666666667, "x": "南まで追える、とびきり長い一本の線でした。"}, {"t": 1296.0666666666666, "x": "物差しとして使うには、その目盛りそのものが"}, {"t": 1299.0, "x": "何年前なのかを、知っておく必要があります。"}, {"t": 1302.2166666666667, "x": "アカホヤの年代は、はじめ、"}, {"t": 1304.3, "x": "炭などに残る炭素を使って測られました。"}, {"t": 1307.3333333333333, "x": "生き物の体には、炭素十四という、"}, {"t": 1310.1833333333334, "x": "ゆっくり減っていく種類の炭素が含まれています。"}, {"t": 1313.4833333333333, "x": "その量は、五千七百三十年で半分になります。"}, {"t": 1317.3833333333334, "x": "残っている量を測れば、その生き物が死んでから"}, {"t": 1320.6833333333334, "x": "どれくらいたったかが分かる、というしくみです。"}, {"t": 1323.6333333333334, "x": "この方法で、アカホヤの年代は、"}, {"t": 1326.2166666666667, "x": "およそ六千三百年前とされていました。"}, {"t": 1329.1666666666667, "x": "1978年█"}, {"t": 1329.1666666666667, "x": "1978年の論文でも、六千年から"}, {"t": 1333.3833333333334, "x": "六千五百年前とされています。"}, {"t": 1335.7166666666667, "x": "ところが、この方法だけでは、誤差が大きくなります。"}, {"t": 1339.6333333333334, "x": "測った数字をそのまま暦の年に"}, {"t": 1341.8333333333333, "x": "読みかえると、ずれが出るのです。"}, {"t": 1344.05, "x": "このずれを直すには、別の方法で年がはっきり分かっている"}, {"t": 1347.9833333333333, "x": "試料と、突き合わせる必要があります。"}, {"t": 1350.6166666666666, "x": "そこで使われたのが、福井県にある水月湖の底の泥です。"}, {"t": 1353.7666666666667, "x": "水月湖█"}, {"t": 1355.7333333333333, "x": "水月湖の底には、一年に一枚ずつ、明るい層と"}, {"t": 1360.0166666666667, "x": "暗い層が対になった縞が積もっています。"}, {"t": 1362.5, "x": "年縞と呼ばれるものです。春から秋には、"}, {"t": 1365.25, "x": "土やプランクトンの死がいなどが。"}, {"t": 1367.5666666666666, "x": "晩秋から冬には、鉄分や、大陸から飛んできた黄砂などが。"}, {"t": 1372.45, "x": "一年ぶんの厚さは、平均でわずか〇・七ミリメートル。"}, {"t": 1376.5666666666666, "x": "それが、七万年ぶん、途切れずに積み重なっています。"}, {"t": 1380.9, "x": "縞を一枚ずつ数えれば、木の年輪のように、"}, {"t": 1384.2333333333333, "x": "何年前かを直接数えられるのです。"}, {"t": 1386.9833333333333, "x": "そして、この湖の泥の中にも、"}, {"t": 1389.55, "x": "アカホヤの灰が挟まっていました。"}, {"t": 1391.85, "x": "1995年█"}, {"t": 1391.85, "x": "1995年、年縞を数えた結果、アカホヤの"}, {"t": 1396.4166666666667, "x": "年代は、七千二百八十年前とされました。"}, {"t": 1399.9166666666667, "x": "それまでの数字より、千年ほど古くなったのです。"}, {"t": 1403.4333333333334, "x": "ここから、7300年前という表し方が"}, {"t": 1404.3333333333333, "x": "7300年前█"}, {"t": 1407.3, "x": "広く使われるようになりました。"}, {"t": 1409.3333333333333, "x": "そのあと、2006年に水月湖で取り出された新しい泥の"}, {"t": 1410.1833333333334, "x": "2006年█"}, {"t": 1413.7, "x": "柱を使って、さらに詳しく調べられました。"}, {"t": 1417.15, "x": "2013年█"}, {"t": 1417.15, "x": "2013年の論文では、アカホヤの"}, {"t": 1420.2, "x": "   }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
