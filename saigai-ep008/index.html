<script>
const D={"name": "ep008", "file": "ep008", "dur": 1977.55, "segs": [], "subs": [{"t": 0.0, "x": "黒海の底には、乾いた泥があります。"}, {"t": 2.933333333333333, "x": "海の底にあるのに、一度は空気にさらされた泥です。"}, {"t": 6.583333333333333, "x": "表面には、ひび割れの跡が残っています。"}, {"t": 9.75, "x": "その下からは、陸に生える低い木の根が見つかっています。"}, {"t": 13.55, "x": "見つかった深さは、水深百メートルから"}, {"t": 16.416666666666668, "x": "百二十メートルほどです。つまり、"}, {"t": 18.75, "x": "いまは深い海の底になっている"}, {"t": 20.8, "x": "場所が、かつては地面でした。"}, {"t": 22.933333333333334, "x": "その地面の上に、あるとき、"}, {"t": 25.25, "x": "水が来ました。問題は、その来かたです。"}, {"t": 28.616666666666667, "x": "一つの見方では、水は一気に来ました。"}, {"t": 31.55, "x": "地中海の水が細い海峡を越え、"}, {"t": 33.93333333333333, "x": "滝のように湖へ落ちこんだとされます。"}, {"t": 37.06666666666667, "x": "提唱者の本では、その量はナイアガラの"}, {"t": 39.95, "x": "滝の二百倍と書かれました。"}, {"t": 41.7, "x": "もう一つの見方では、水はゆっくり来ました。"}, {"t": 44.85, "x": "湖はすでに満ちていて、むしろ湖の"}, {"t": 47.733333333333334, "x": "水が外へ流れ出していた、とされます。"}, {"t": 50.516666666666666, "x": "二つの見方は、同じ海の底を調べて、"}, {"t": 53.6, "x": "正反対の答えを出しています。"}, {"t": 55.916666666666664, "x": "そして、この論争は四半世紀以上"}, {"t": 58.61666666666667, "x": "たったいまも、決着していません。"}, {"t": 61.0, "x": "提唱した側も、反対した側も、その後、"}, {"t": 64.46666666666667, "x": "自分たちの数字を何度も見直しています。"}, {"t": 67.35, "x": "年代だけでも、同じ研究者の"}, {"t": 69.73333333333333, "x": "中で、二千年近く動いています。"}, {"t": 72.38333333333334, "x": "この出来事には、名前が付いています。黒海洪水説。"}, {"t": 75.15, "x": "黒海洪水説█"}, {"t": 76.53333333333333, "x": "説、という字が付いたまま呼ばれている出来事です。"}, {"t": 80.25, "x": "湖が海に変わったこと自体は、疑われていません。"}, {"t": 84.1, "x": "割れているのは、それが数年の出来事だったのか、"}, {"t": 87.3, "x": "数千年の出来事だったのかです。"}, {"t": 89.66666666666667, "x": "湖と海のあいだで起きたことの"}, {"t": 91.66666666666667, "x": "記録を、順番に見ていきます。"}, {"t": 93.91666666666667, "x": "最初に、いまの黒海を見ておきます。"}, {"t": 96.75, "x": "黒海は、ヨーロッパとアジアのあいだにある内海です。"}, {"t": 100.33333333333333, "x": "面積は、およそ五十万平方キロメートル。"}, {"t": 103.66666666666667, "x": "日本の国土よりも広い水面です。"}, {"t": 106.16666666666667, "x": "この海には、ほかの海にはない特徴があります。"}, {"t": 109.41666666666667, "x": "深さおよそ百メートルより下に、酸素がありません。"}, {"t": 112.96666666666667, "x": "1989年の海洋学の報告は、黒海を"}, {"t": 116.68333333333334, "x": "世界最大の無酸素の海█"}, {"t": 117.73333333333333, "x": "世界最大の無酸素の海と書いています。"}, {"t": 120.63333333333334, "x": "酸素の代わりに溶けているのは、硫化水素です。"}, {"t": 123.93333333333334, "x": "深いところの水は、上の水と"}, {"t": 126.31666666666666, "x": "混ざらず、ほとんど動いていません。"}, {"t": 128.71666666666667, "x": "なぜ混ざらないのか。理由は、塩分の違いです。"}, {"t": 132.48333333333332, "x": "黒海の上のほうの水は、川の水で"}, {"t": 135.28333333333333, "x": "薄められていて、塩分が低くなっています。"}, {"t": 138.36666666666667, "x": "いまの表層の塩分は、千分の十八ほどです。"}, {"t": 142.06666666666666, "x": "一方、深いところにあるのは、地中海から"}, {"t": 145.43333333333334, "x": "入ってきた、塩分の高い重い水です。"}, {"t": 148.48333333333332, "x": "軽い水が上に、重い水が下に、"}, {"t": 151.06666666666666, "x": "はっきり分かれて重なっています。"}, {"t": 153.31666666666666, "x": "その境目が、ふたの役目をしています。"}, {"t": 156.25, "x": "上の水は風や波でかき混ぜられますが、"}, {"t": 158.76666666666668, "x": "ふたの下までは届きません。"}, {"t": 160.76666666666668, "x": "酸素は、水面から入ってきます。"}, {"t": 163.48333333333332, "x": "ふたの下へは、その酸素が運ばれません。"}, {"t": 166.45, "x": "結果として、深い水は、酸素のないまま"}, {"t": 169.58333333333334, "x": "溜まり続けています。この重なり方を"}, {"t": 172.11666666666667, "x": "作っているのが、黒海の出口です。"}, {"t": 174.5, "x": "黒海は、南西の端にある細い水路で、"}, {"t": 177.61666666666667, "x": "マルマラ海につながっています。"}, {"t": 179.8, "x": "その水路が、ボスポラス海峡です。"}, {"t": 181.16666666666666, "x": "ボスポラス海峡█"}, {"t": 183.46666666666667, "x": "マルマラ海は、さらにダーダネルス海峡で"}, {"t": 186.31666666666666, "x": "エーゲ海、つまり地中海につながります。"}, {"t": 189.08333333333334, "x": "二本の細い海峡と、そのあいだの小さな海。"}, {"t": 192.53333333333333, "x": "この三つが、黒海と外の海を結ぶ、ただ一本の通り道です。"}, {"t": 197.61666666666667, "x": "マルマラ海は小さな海ですが、"}, {"t": 199.61666666666667, "x": "深いところでは千二百メートルを超えます。"}, {"t": 202.61666666666667, "x": "二本の海峡の浅さと、そのあいだの深い海。"}, {"t": 206.01666666666668, "x": "この組み合わせが、水の出入りを"}, {"t": 208.18333333333334, "x": "細く絞る弁のような役目をしています。"}, {"t": 210.63333333333333, "x": "マルマラ海は、長さおよそ二百十キロメートル、"}, {"t": 214.03333333333333, "x": "幅はおよそ七十五キロメートル。"}, {"t": 216.51666666666668, "x": "エーゲ海側の水の塩分は千分の"}, {"t": 218.93333333333334, "x": "三十八ほどで、黒海の倍以上あります。"}, {"t": 222.11666666666667, "x": "ボスポラス海峡の中では、水が"}, {"t": 224.6, "x": "上下で逆向きに流れています。"}, {"t": 226.58333333333334, "x": "上の層では、黒海の薄い水が外へ出ていきます。"}, {"t": 230.33333333333334, "x": "下の層では、地中海の濃い水が黒海へ入ってきます。"}, {"t": 234.51666666666668, "x": "黒海が外へ出している水の量は、一年あたり"}, {"t": 237.85, "x": "およそ三百立方キロメートルと見積もられています。"}, {"t": 240.96666666666667, "x": "流れこむ大きな川が多いため、"}, {"t": 243.1, "x": "黒海は水が余っている海です。"}, {"t": 245.6, "x": "蒸発のほうが多く、水の足りない"}, {"t": 248.18333333333334, "x": "地中海とは、ちょうど逆です。"}, {"t": 250.41666666666666, "x": "この、上下で逆向きに流れる仕組みが、"}, {"t": 253.18333333333334, "x": "今回の論争の中心になります。"}, {"t": 255.73333333333332, "x": "ふたの上と下で、黒海は二つの"}, {"t": 258.21666666666664, "x": "別の海のようにふるまっています。"}, {"t": 260.21666666666664, "x": "上は川の水で薄まった海、下は地中海から来た重い海です。"}, {"t": 264.8833333333333, "x": "ある時代、水はどちら向きに流れていたのか。"}, {"t": 268.06666666666666, "x": "それが分かれば、洪水があったかどうかも、"}, {"t": 271.03333333333336, "x": "かなり絞りこめるからです。"}, {"t": 272.96666666666664, "x": "黒海は、ずっと海だったわけではありません。"}, {"t": 276.1, "x": "地質学的には、かつてユーラシアの内陸に"}, {"t": 279.6166666666667, "x": "広がっていたパラテチス海という海の名残です。"}, {"t": 280.23333333333335, "x": "パラテチス海█"}, {"t": 282.8833333333333, "x": "カスピ海も、同じ海の名残とされています。"}, {"t": 286.01666666666665, "x": "この海は、山脈ができるにつれて外の海から切り離され、"}, {"t": 290.06666666666666, "x": "湖と海のあいだを行き来するようになりました。"}, {"t": 293.23333333333335, "x": "2003年に発表された総説は、黒海をこう要約しています。"}, {"t": 297.9, "x": "過去およそ二百万年のあいだ、黒海は、"}, {"t": 300.93333333333334, "x": "ほとんどの時間を淡水の湖として過ごしてきた。"}, {"t": 304.28333333333336, "x": "海の水が入ってきたのは、世界の海面が"}, {"t": 307.28333333333336, "x": "高かった時期の、短いあいだだけだった。"}, {"t": 310.05, "x": "つまり、いまの黒海は、長い歴史の中では、"}, {"t": 313.68333333333334, "x": "海でいる時期のほうが珍しいということです。"}, {"t": 316.73333333333335, "x": "では、最後に湖だったのは、いつなのか。"}, {"t": 320.2, "x": "それが、最終氷期です。北半球の"}, {"t": 321.3333333333333, "x": "最終氷期█"}, {"t": 323.6333333333333, "x": "大陸を厚い氷が覆い、その分だけ、"}, {"t": 327.28333333333336, "x": "世界の海の水が減っていた時代です。"}, {"t": 329.98333333333335, "x": "世界の海面は、いまより百メートル以上"}, {"t": 333.0833333333333, "x": "低いところにありました。ボスポラス海峡の"}, {"t": 335.8833333333333, "x": "底は、いまでも浅いところで"}, {"t": 337.7, "x": "水深四十メートルほどしかありません。"}, {"t": 340.1666666666667, "x": "海面が百メートル以上も下がれば、"}, {"t": 342.53333333333336, "x": "海峡は干上がり、谷になります。"}, {"t": 345.43333333333334, "x": "こうして黒海は、地中海から切り離されました。"}, {"t": 348.9, "x": "このときの湖は、研究者のあいだで"}, {"t": 351.71666666666664, "x": "新エウクシン湖と呼ばれています。"}, {"t": 353.65, "x": "湖の水の塩分は、千分の一・五から三ほど。"}, {"t": 357.6, "x": "ほとんど真水です。湖の底には、真水や、わずかに"}, {"t": 362.01666666666665, "x": "塩気のある水に住む貝が暮らしていました。"}, {"t": 364.56666666666666, "x": "湖の水位も、大きく下がっていたとされています。"}, {"t": 368.1333333333333, "x": "気候が寒く乾いていて、湖に入る水が少なかったためです。"}, {"t": 372.73333333333335, "x": "どこまで下がったかについては、見積もりに幅があります。"}, {"t": 376.4166666666667, "x": "いまの海面より百十メートル低かったとする"}, {"t": 379.1333333333333, "x": "見積もりから、百五十メートル"}, {"t": 381.3, "x": "低かったとする見積もりまであります。"}, {"t": 383.35, "x": "水位が下がると、黒海の縁に"}, {"t": 385.75, "x": "広がっていた浅い大陸棚が、陸になります。"}, {"t": 388.8833333333333, "x": "黒海の北西側には、とくに広くて平らな大陸棚があります。"}, {"t": 393.31666666666666, "x": "その上を、ドナウ川やドニエプル川が、いまより"}, {"t": 397.0833333333333, "x": "二百キロメートルも沖まで流れていたとされています。"}, {"t": 400.2, "x": "いまのアゾフ海は、平らな低地でした。"}, {"t": 403.1166666666667, "x": "その真ん中を、ドン川が流れていました。"}, {"t": 406.1666666666667, "x": "2019年に発表された総説は、この時代の"}, {"t": 409.75, "x": "風景を、そのように描いています。"}, {"t": 412.28333333333336, "x": "湖のまわりは、寒い草原に覆われていたとされています。"}, {"t": 416.45, "x": "花粉の記録からは、寒く乾いた気候が読み取られています。"}, {"t": 420.43333333333334, "x": "氷期の終わりには、北のほうから"}, {"t": 422.76666666666665, "x": "水が来たこともありました。"}, {"t": 424.3, "x": "氷がとけて水量の増えたカスピ海の水が、"}, {"t": 427.1, "x": "マヌイチ低地と呼ばれる谷を通り、"}, {"t": 429.51666666666665, "x": "黒海の湖へあふれこんだとされています。"}, {"t": 432.55, "x": "その時期は、一万四千七百年前から"}, {"t": 435.8, "x": "一万二千六百年前ごろとされています。"}, {"t": 438.51666666666665, "x": "このころ、湖の水位は、いまより二十メートルほど"}, {"t": 442.48333333333335, "x": "低いところまで上がったとする見積もりもあります。"}, {"t": 445.2, "x": "そして湖の水は、南西のマルマラ海の側へも"}, {"t": 448.76666666666665, "x": "あふれ出していたと考えられています。"}, {"t": 450.9, "x": "湖の水位は、一度下がりきったまま"}, {"t": 453.81666666666666, "x": "止まっていたわけでは x": "その勢いは強くなります。これが、"}, {"t": 578.3833333333333, "x": "急激な洪水が起きる筋書きです。"}, {"t": 581.0, "x": "反対に、湖の水面が先に敷居まで満ちていたとします。"}, {"t": 585.4, "x": "すると、湖の水は、あふれて外へ流れ出します。"}, {"t": 589.7333333333333, "x": "あとから上がってきた海と出会うとき、"}, {"t": 591.8, "x": "落差はほとんどありません。"}, {"t": 593.8666666666667, "x": "その場合、海の水は、あふれ出る川の下に"}, {"t": 597.5, "x": "もぐりこむように、少しずつ入ってきます。"}, {"t": 600.3333333333334, "x": "これが、ゆっくりつながり直す筋書きです。"}, {"t": 603.4333333333333, "x": "同じ海峡、同じ敷居、同じ海面上昇です。"}, {"t": 607.4833333333333, "x": "違うのは、湖の水面の高さだけです。"}, {"t": 610.7166666666667, "x": "湖の水面がどこにあったのかで、起きたことが"}, {"t": 613.9833333333333, "x": "大災害にも、静かな入れ替わりにもなります。"}, {"t": 617.0666666666667, "x": "だからこの論争は、ほとんどが、湖の岸が"}, {"t": 620.6, "x": "どこにあったのかを探す作業になっています。"}, {"t": 623.2, "x": "岸の跡は、いまは深い海の底です。"}, {"t": 626.15, "x": "波が削った段、砂浜、砂丘、川の流れた跡。"}, {"t": 631.1166666666667, "x": "それらがどの深さにあり、いつのものなのか。"}, {"t": 634.0833333333334, "x": "研究者たちは、音波と掘削で、"}, {"t": 636.7, "x": "それを一つずつ確かめてきました。"}, {"t": 639.0833333333334, "x": "黒海の側からは、沈んだ湖の岸の跡を探す。"}, {"t": 642.95, "x": "マルマラ海の側からは、黒海から流れ出た水の跡を探す。"}, {"t": 647.1666666666666, "x": "同じ問いに、海峡の両側から迫る形になっています。"}, {"t": 651.1166666666667, "x": "その最初の答えが出たのは、1990年代の半ばでした。"}, {"t": 655.7833333333333, "x": "1993年、黒海の北側で、ロシアと"}, {"t": 660.0833333333334, "x": "アメリカの共同調査が行われました。"}, {"t": 662.4833333333333, "x": "場所は、クリミア半島の東にある"}, {"t": 665.0666666666667, "x": "ケルチ海峡の南の大陸棚です。"}, {"t": 667.4, "x": "アメリカ側の中心にいたのは、ウィリアム・"}, {"t": 670.25, "x": "ライアンとウォルター・ピットマン。"}, {"t": 671.9166666666666, "x": "どちらも、海の底の地層を研究する地質学者です。"}, {"t": 675.9333333333333, "x": "ライアンは、1970年に地中海の底で塩の"}, {"t": 680.0333333333333, "x": "層を掘り当てた研究者の一人でもあります。"}, {"t": 682.7, "x": "調査船は、海底の下を音波で探りながら、狙った"}, {"t": 686.9166666666666, "x": "場所に筒を打ちこみ、泥を抜き取りました。"}, {"t": 689.8, "x": "その泥から、奇妙なものが出てきます。"}, {"t": 692.5666666666667, "x": "水深九十九メートルの泥には、"}, {"t": 694.9166666666666, "x": "乾いてひび割れた跡がありました。"}, {"t": 697.3333333333334, "x": "水深百十メートルからは、藻の名残が出ました。"}, {"t": 700.8666666666667, "x": "そして水深百二十三メートルほどの乾いた泥には、"}, {"t": 704.2666666666667, "x": "低い木の根が、生えていた位置のまま残っていました。"}, {"t": 707.85, "x": "どれも、ボスポラス海峡の岩の"}, {"t": 710.2, "x": "敷居より、ずっと深い場所です。"}, {"t": 712.5333333333333, "x": "乾いた泥も、木の根も、水の中ではできません。"}, {"t": 716.3333333333334, "x": "この場所は、かつて空気にさらされた地面でした。"}, {"t": 719.6333333333333, "x": "さらに、音波の断面にも特徴がありました。"}, {"t": 722.9333333333333, "x": "その地面の上を、海の泥が、同じ厚さで覆っていました。"}, {"t": 727.4333333333333, "x": "くぼみの中も、盛り上がった所の上も、同じ厚さです。"}, {"t": 731.6666666666666, "x": "ふつう、海がゆっくり陸へ進んでくる場合、"}, {"t": 734.8666666666667, "x": "波が岸を削り、削られた土砂が段になって残ります。"}, {"t": 739.0666666666667, "x": "ところがここでは、陸だった面が、削られた跡もなく、"}, {"t": 743.0, "x": "そのまま泥の下に閉じこめられていました。"}, {"t": 745.7833333333333, "x": "研究チームは、これを、水が速く来すぎて、"}, {"t": 749.5, "x": "波が地面を削る暇がなかった跡だと読みました。"}, {"t": 752.85, "x": "もう一つの手がかりが、貝殻です。"}, {"t": 755.55, "x": "陸だった面の上には、海の貝が"}, {"t": 758.0333333333333, "x": "住みつきはじめた跡が残っていました。"}, {"t": 760.2666666666667, "x": "その貝殻を放射性炭素で測ると、"}, {"t": 762.7833333333333, "x": "どこでもほぼ同じ年代が出ました。"}, {"t": 765.2, "x": "浅いところでも、深いところでも、"}, {"t": 767.5333333333333, "x": "同じ時期に海の貝が現れています。"}, {"t": 770.2, "x": "海がゆっくり進んできたのなら、"}, {"t": 772.1666666666666, "x": "深いところから先に海の貝が現れるはずです。"}, {"t": 775.5333333333333, "x": "それが同時だということは、一度に水が満ちたことを"}, {"t": 778.95, "x": "示している、と研究チームは考えました。"}, {"t": 782.1, "x": "1997年、この結果はマリン・"}, {"t": 784.3166666666667, "x": "マリン・ジオロジー█"}, {"t": 785.9333333333333, "x": "ジオロジーという学術誌に発表されます。"}, {"t": 788.95, "x": "論文の題は、黒海の大陸棚の急激な水没。"}, {"t": 792.7833333333333, "x": "内容を要約すると、次のようになります。"}, {"t": 795.9333333333333, "x": "最終氷期のあいだ、黒海は巨大な淡水湖になった。"}, {"t": 799.9833333333333, "x": "湖面は、出口より百メートル以上も下がっていた。"}, {"t": 803.6833333333333, "x": "地中海の海面がボスポラスの敷居まで"}, {"t": 806.1833333333333, "x": "上がったとき、塩水がこの出口から流れこんだ。"}, {"t": 809.4166666666666, "x": "そして、陸になっていた十万平方キロメートル以上の"}, {"t": 813.05, "x": "大陸棚を、一気に沈めた。十万平方キロメートルは、"}, {"t": 817.4666666666667, "x": "本州の半分に近い広さです。"}, {"t": 819.85, "x": "年代は、放射性炭素の年代で七千百五十年前です。"}, {"t": 824.3666666666667, "x": "放射性炭素の年代は、生き物の体に取りこまれた"}, {"t": 828.0, "x": "炭素のうち、ゆっくり減っていく種類の"}, {"t": 830.6166666666667, "x": "炭素が、どれだけ残っているかで測ります。"}, {"t": 833.5333333333333, "x": "ただし、その値は、そのままでは暦の年と一致しません。"}, {"t": 838.2333333333333, "x": "この、ずれの問題は、あとで論争の中心の一つになります。"}, {"t": 842.8, "x": "暦の年に直すと、およそ7500年前とされました。"}, {"t": 845.2166666666667, "x": "7500年前█"}, {"t": 848.0833333333334, "x": "論文は、最後に一文を付け加えています。"}, {"t": 851.5, "x": "広い大地が永久に沈んだことが、初期の"}, {"t": 854.4333333333333, "x": "農耕民や狩猟採集民の、ヨーロッパ内陸への"}, {"t": 857.9333333333333, "x": "広がりを早めたのかもしれない。"}, {"t": 859.8166666666667, "x": "可能性として書かれた、この一文が、"}, {"t": 862.5833333333334, "x": "のちに大きな反響を呼ぶことになります。"}, {"t": 865.3166666666667, "x": "それまで、黒海が湖から海に戻った過程は、"}, {"t": 868.8333333333334, "x": "なめらかに進んだと考えるのが一般的でした。"}, {"t": 872.05, "x": "1970年代の研究者たちは、そう書いています。"}, {"t": 876.25, "x": "洪水説は、その見方を正面からくつがえすものでした。"}, {"t": 880.2333333333333, "x": "1998年、ライアンとピットマンは、"}, {"t": 883.95, "x": "この研究を一般向けの本にまとめました。"}, {"t": 886.9333333333333, "x": "題名は、ノアの洪水です。本の中で、二人は、論文よりも"}, {"t": 887.9833333333333, "x": "ノアの洪水█"}, {"t": 892.9166666666666, "x": "踏みこんだ描写をしています。"}, {"t": 894.6333333333333, "x": "ボスポラスをふさいでいた土や"}, {"t": 896.3666666666667, "x": "岩屑は、たちまち押し流された。"}, {"t": 898.8833333333333, "x": "一日に十立方マイルの水が流れこんだ。"}, {"t": 901.7666666666667, "x": "それは、ナイアガラの滝を越える水の二百倍にあたる。"}, {"t": 905.5166666666667, "x": "十立方マイルは、およそ四十二立方キロメートルです。"}, {"t": 909.4833333333333, "x": "その量が、毎日、湖へ落ちこみ続けたという"}, {"t": 913.1333333333333, "x": "描写です。一秒あたりに直すと、"}, {"t": 915.8833333333333, "x": "およそ四十九万立方メートルになります。"}, {"t": 918.9666666666667, "x": "2002年に反対側の研究者がまとめた要約に"}, {"t": 922.2666666666667, "x": "よると、洪水説では、この再充填は二年に"}, {"t": 925.8833333333333, "x": "満たない期間で起きたとされています。"}, {"t": 927.9333333333333, "x": "また、その前の湖の水位は、いまの海面より"}, {"t": 931.85, "x": "およそ百五十メートル低かったとされています。"}, {"t": 934.65, "x": "ここで一つ、筋書きに必要な条件があります。"}, {"t": 938.2, "x": "同じ要約は、次の点を指摘しています。"}, {"t": 941.3, "x": "七千五百年前ごろには、地中海と"}, {"t": 944.2166666666667, "x": "マルマラ海の水面は、すでに、いまの海面より"}, {"t": 947.9, "x": "十五メートルほど低いところまで上がっていた。"}, {"t": 950.4666666666667, "x": "それは、ボスポラス海峡のいまの"}, {"t": 952.8333333333334, "x": "岩の敷居より、ずっと高い位置です。"}, {"t": 955.4833333333333, "x": "そうなると、海の水は、もっと早い段階で"}, {"t": 959.0166666666667, "x": "黒海へ流れこんでいたはずです。"}, {"t": 961.1166666666667, "x": "それでも洪水が七千五百年前まで"}, {"t": 963.65, "x": "起きなかったとするなら、海峡を一時的に"}, {"t": 966.5166666666667, "x": "ふさいでいた何かが必要になります。"}, {"t": 968.6333333333333, "x": "洪水説は、海峡に土砂がたまって、"}, {"t": 971.4833333333333, "x": "仮のせきになっていたと考えました。"}, {"t": 973.9833333333333, "x": "そのせきが、海の水に押されて一気に崩れた。"}, {"t": 977.4666666666667, "x": "それが、洪水の始まりだという筋書きです。"}, {"t": 980.7333333333333, "x": "この仮のせきがあったかどうかも、"}, {"t": 982.7, "x": "論争の一つになっています。"}, {"t": 984.7833333333333, "x": "本は、さらに先の推測にまで進みました。"}, {"t": 988.0833333333334, "x": "この洪水の記憶が、周囲の文化に長く語り継がれた。"}, {"t": 992.1, "x": "それが、古代メソポタミアのギルガメシュ叙事詩に"}, {"t": 995.2, "x": "出てくる洪水の話になり、さらに聖書の"}, {"t": 998.2333333333333, "x": "ノアの箱舟の話につながったのではないか。"}, {"t": 1000.8666666666667, "x": "この部分は、地質学の論文ではなく、"}, {"t": 1003.85, "x": "一般向けの本の中での推測です。"}, {"t": 1006.6, "x": "地層の記録から、物語の元を直接たどることはできません。"}, {"t": 1010.8, "x": "洪水の伝説は、世界のさまざまな地域に残っています。"}, {"t": 1014.9, "x": "その一つ一つを、特定の出来事に結びつける"}, {"t": 1018.2, "x": "決め手は、いまのところ見つかっていません。"}, {"t": 1020.9166666666666, "x": "この番組では、この部分を、提唱者がそういう"}, {"t": 1024.5666666666666, "x": "仮説を立てた、という紹介にとどめます。"}, {"t": 1027.4166666666667, "x": "ただ、この本によって、黒海洪水説は研究者の"}, {"t": 1031.5166666666667, "x": "外にまで広く知られるようになりました。"}, {"t": 1033.7333333333333, "x": "海の底の泥の話が、古代の物語と結びついたからです。"}, {"t": 1038.0666666666666, "x": "注目が集まれば、反論も集まります。"}, {"t": 1041.1666666666667, "x": "そして、反論のほうも、海の底の泥から出てきました。"}, {"t": 1045.3666666666666, "x": "しかも、洪水説とはまったく逆の向きを指す泥でした。"}, {"t": 1049.2833333333333, "x": "洪水説に正面から反対したのが、カナダの研究者、"}, {"t": 1053.3, "x": "アリ・アクスとリチャード・ヒスコットのチームです。"}, {"t": 1056.2, "x": "彼らが調べたのは、黒海の中ではなく、出口の"}, {"t": 1059.8333333333333, "x": "向こう側でした。マルマラ海と、エーゲ海の北部です。"}, {"t": 1064.15, "x": "考え方は、単純です。洪水説が"}, {"t": 1067.15, "x": "正しければ、洪水の前、黒海の湖の"}, {"t": 1070.5833333333333, "x": "水面は敷居より低く、外へは流れ出ていなかったはずです。"}, {"t": 1074.8166666666666, "x": "逆に、湖の水が外へ流れ出ていたなら、"}, {"t": 1078.2, "x": "出口の外側に、その跡が残っているはずです。"}, {"t": 1082.0833333333333, "x": "2002年の論文で、チームは、七千五百キロメートルに"}, {"t": 1086.4666666666667, "x": "およぶ音波の探査線と、六十五本のコア、"}, {"t": 1089.8, "x": "四十三個の放射性炭素年代を示しました。"}, {"t": 1093.3333333333333, "x": "そこから出てきたのが、三角州です。"}, {"t": 1095.7, "x": "三角州█"}, {"t": 1097.0, "x": "ボスポラス海峡の南口を出たすぐ先、マルマラ海の"}, {"t": 1100.95, "x": "大陸棚の中ほどに、埋もれた三角州がありました。"}, {"t": 1104.5333333333333, "x": "三角州は、川が運んできた土砂が、"}, {"t": 1107.4333333333334, "x": "河口の先に積もってできる地形です。"}, {"t": 1110.0333333333333, "x": "ここでは、その川にあたるのが、"}, {"t": 1112.3, "x": "黒海から流れ出る水だったと読まれました。"}, {"t": 1115.1666666666667, "x": "2022年の総説では、この三角州ができたのは、"}, {"t": 1119.0666666666666, "x": "一万千百年前から一万二百年前ごろとされています。"}, {"t": 1123.2666666666667, "x": "三角州は、およそ三・三キロメートル沖へ"}, {"t": 1126.55, "x": "張り出し、上がっていく海面を追うように、"}, {"t": 1129.5666666666666, "x": "八メートルから九メートル積み上がっていました。"}, {"t": 1132.55, "x": "海峡の中にも、南向きの強い流れが作った、"}, {"t": 1136.1166666666666, "x": "流線形の砂の高まりや、大きなえぐれの跡が並んでいます。"}, {"t": 1140.6333333333334, "x": "チームは、これを、洪水の前から黒海の湖が"}, {"t": 1144.5666666666666, "x": "勢いよく水をあふれさせていた証拠だとしました。"}, {"t": 1147.55, "x": "黒海の南西の大陸棚では、水深七十八メートルほどの"}, {"t": 1151.8333333333333, "x": "浅いところまで、波の届かない静かな水の"}, {"t": 1154.7666666666667, "x": "底でたまった泥が見つかっています。"}, {"t": 1156.8166666666666, "x": "そこから、一万二千三百年前から"}, {"t": 1159.7333333333333, "x": "九千五百年前ごろ、湖の水面は、敷居を越えて"}, {"t": 1164.1666666666667, "x": "外へあふれるほど高かったとされました。"}, {"t": 1166.4333333333334, "x": "そうだとすれば、落差は生まれません。"}, {"t": 1169.0833333333333, "x": "では、海の貝の登場は、どう説明するのか。"}, {"t": 1172.9833333333333, "x": "チームは、つながり直しを三つの段階に分けています。"}, {"t": 1176.8333333333333, "x": "まず、一万二百年前ごろ、地中海の塩水が、"}, {"t": 1181.0666666666666, "x": "くさびのように海峡の底へ入りこみます。"}, {"t": 1183.9833333333333, "x": "次に、九千五百年前ごろまでに、底を這って"}, {"t": 1187.7833333333333, "x": "入る塩水が増え、海の水に含まれる元素が、"}, {"t": 1191.45, "x": "湖の貝の殻に取りこまれはじめます。"}, {"t": 1194.1833333333334, "x": "そして七千五百年前ごろ、黒海の水の塩分が十分に上がり、"}, {"t": 1198.8833333333334, "x": "海の生き物が湖の生き物と入れ替わります。"}, {"t": 1202.2333333333333, "x": "洪水説が決め手にした、海の貝の一斉の登場。"}, {"t": 1205.9833333333333, "x": "それは洪水の瞬間ではなく、塩分が生き物の"}, {"t": 1209.5, "x": "耐えられる値を越えた瞬間だった、という読み方です。"}, {"t": 1213.3, "x": "チームの2002年の論文は、はっきりこう書いています。"}, {"t": 1217.1666666666667, "x": "地震波、化学、堆積物、微化石、花粉のどのデータも、"}, {"t": 1222.6333333333334, "x": "地中海の水が北へ一気に流れこんだことを支持しない。"}, {"t": 1226.3, "x": "2022年には、それまで二十五年分の証拠を"}, {"t": 1230.0, "x": "見直した総説でも、同じ結論を繰り返しています。"}, {"t": 1233.65, "x": "ただし、この反論にも、反論が出ています。"}, {"t": 1237.3333333333333, "x": "2008年、ライアンを含むトルコなどの研究チームが、"}, {"t": 1241.3666666666666, "x": "ボスポラス南口の近くの地層を調べ直しました。"}, {"t": 1244.9333333333334, "x": "その論文では、そこにある三角州は、"}, {"t": 1247.7166666666667, "x": "黒海の水ではなく、近くの小さな川の"}, {"t": 1251.0333333333333, "x": "土砂でできていて、年代も新しいと読んでいます。"}, {"t": 1254.3666666666666, "x": "黒海からの流れが一万年前から続いていたという"}, {"t": 1257.5833333333333, "x": "主張とは食い違う、としています。"}, {"t": 1260.0, "x": "これに対して2016年、アクスらは、"}, {"t": 1262.8166666666666, "x": "早い時期の三角州は、やはり黒海からの"}, {"t": 1266.1, "x": "強い流れで作られたと反論しています。"}, {"t": 1268.5833333333333, "x": "同じ三角州を見て、黒海の水の跡だと読む見方と、"}, {"t": 1272.45, "x": "陸の川の跡だと読む見方があります。"}, {"t": 1275.1166666666666, "x": "証拠は、どちらの側にも読めてしまう。"}, {"t": 1277.95, "x": "それが、この論争の難しさです。"}, {"t": 1280.7166666666667, "x": "ここからは、割れている話を整理します。"}, {"t": 1283.7166666666667, "x": "黒海が最終氷期に淡水の湖だったこと。"}, {"t": 1286.8833333333334, "x": "湖の水位が、いまより大きく低かった時期があること。"}, {"t": 1290.8166666666666, "x": "完新世に入って、地中海の水が"}, {"t": 1293.6166666666666, "x": "入り、湖が海に変わったこと。"}, {"t": 1296.2, "x": "ここまでは、争われていません。"}, {"t": 1298.5833333333333, "x": "定説として扱われています。"}, {"t": 1300.5833333333333, "x": "割れているのは、どれだけの高さを、"}, {"t": 1302.9166666666667, "x": "どれだけの時間で上がったのか、という点です。"}, {"t": 1306.5166666666667, "x": "第一の見方は、大きく、速く上がったとするものです。"}, {"t": 1310.7333333333333, "x": "1997年の洪水説がその出発点です。"}, {"t": 1314.6666666666667, "x": "フランスの海洋研究機関イフレメールは、1998年と"}, {"t": 1319.4666666666667, "x": "2002年に黒海の北西部を調査しました。"}, {"t": 1322.35, "x": "ルーマニア沖の大陸棚で、水深百メートル前後に、"}, {"t": 1326.1333333333334, "x": "波が削った段が見つかっています。"}, {"t": 1328.65, "x": "その下には、風が作った砂丘が、"}, {"t": 1331.35, "x": "形を保ったまま埋もれていました。"}, {"t": 1333.85, "x": "砂丘が崩されずに残っているのは、波が削る"}, {"t": 1337.1, "x": "暇もなく水が深くなったためだ、と読まれています。"}, {"t": 1340.45, "x": "この研究では、海が大陸棚を進んだのは、"}, {"t": 1343.65, "x": "百年に満たない█"}, {"t": 1344.15, "x": "百年に満たないあいだだったとされています。"}, {"t": 1347.1833333333334, "x": "2017年には、ライアンを含むチームが、"}, {"t": 1350.4166666666667, "x": "ウクライナ、ルーマニア、ブルガリア、トルコの"}, {"t": 1354.3333333333333, "x": "四か国の大陸棚でコアを集めた結果を発表しました。"}, {"t": 1357.9, "x": "貝殻のストロンチウムという元素の比率から、"}, {"t": 1360.8, "x": "海の水が入った時期を読み取っています。"}, {"t": 1363.7, "x": "その答えは、およそ9300年前。"}, {"t": 1365.7833333333333, "x": "9300年前█"}, {"t": 1367.4166666666667, "x": "大陸棚の水没は、四十年に満たない"}, {"t": 1370.4333333333334, "x": "短いあいだに起きたとされました。"}, {"t": 1372.35, "x": "洪水の前、湖の岸は水深百二十メートルより深いところまで"}, {"t": 1377.15, "x": "下がっていた可能性がある、とも書かれています。"}, {"t": 1380.25, "x": "提唱者の側も、年代そのものは、最初の七千五百年前から、"}, {"t": 1385.2666666666667, "x": "ずっと古いほうへ見直したことになります。"}, {"t": 1387.9666666666667, "x": "第二の見方は、ゆっくり、少しずつ"}, {"t": 1391.0833333333333, "x": "上がったとするものです。前の章で見た、"}, {"t": 1393.6833333333334, "x": "アクスとヒスコットの流出説がこちらです。"}, {"t": 1396.4333333333334, "x": "第三の見方は、上がったこと自体は認めつつ、"}, {"t": 1399.7666666666667, "x": "その量がずっと小さかったとするものです。"}, {"t": 1402.7166666666667, "x": "2009年、アメリカのウッズホール海洋研究所の"}, {"t": 1406.4333333333334, "x": "リヴィウ・ジョサンらは、ドナウ川の三角州で、"}, {"t": 1409.3, "x": "深さ四十二メートルのコアを掘りました。"}, {"t": 1412.0833333333333, "x": "年代を測るのに使ったのは、"}, {"t": 1414.0333333333333, "x": "二枚の殻がつながったままの二枚貝です。"}, {"t": 1416.8666666666666, "x": "波に運ばれた古い殻と、その場で"}, {"t": 1419.4166666666667, "x": "死んだ貝とを見分けるための工夫です。"}, {"t": 1421.7333333333333, "x": "その結果、つながり直す直前の湖の水面は、"}, {"t": 1425.6666666666667, "x": "いまより三十メートルほど低いだけだったとされました。"}, {"t": 1429.1333333333334, "x": "上がった量は、五メートルから十メートル。"}, {"t": 1431.9666666666667, "x": "水に沈んだ範囲は、およそ二千平方キロメートルです。"}, {"t": 1435.95, "x": "洪水説が描いた七万平方キロメートルと"}, {"t": 1438.8, "x": "比べると、三十五分の一ほどです。つながり直しは起きた。"}, {"t": 1443.1166666666666, "x": "しかし大洪水と呼べる規模ではなかった、という見方です。"}, {"t": 1447.1666666666667, "x": "なぜ、ここまで食い違うのか。"}, {"t": 1449.5833333333333, "x": "理由の一つは、時計の狂いです。"}, {"t": 1452.2666666666667, "x": "黒海の貝殻の年代は、そのままでは信用できません。"}, {"t": 1456.2833333333333, "x": "湖の水には、古い石灰岩から"}, {"t": 1459.05, "x": "溶け出した炭素が混じっています。"}, {"t": 1460.95, "x": "その水で殻を作った貝は、実際より古い年代を示します。"}, {"t": 1465.5333333333333, "x": "その古く見える量が、時代によって変わっていました。"}, {"t": 1469.0333333333333, "x": "2014年の研究は、同じ地層の木と"}, {"t": 1472.1, "x": "貝殻を比べて、貝殻の年代が千百二十年以上"}, {"t": 1476.0333333333333, "x": "ずれうることを示しています。"}, {"t": 1477.6333333333334, "x": "研究者自身が、この状況を年代合わせの"}, {"t": 1480.05, "x": "年代合わせの勝負█"}, {"t": 1481.7333333333333, "x": "勝負と呼んでいます。実際、2019年の"}, {"t": 1485.0166666666667, "x": "総説にまとめられた海進の年代は、"}, {"t": 1487.7833333333333, "x": "一万一千年前、一万年前、九千年前、八千年から"}, {"t": 1493.7166666666667, "x": "九千年前、七千年から八千年前と、ばらばらです。"}, {"t": 1498.5166666666667, "x": "千年ずれれば、どちらが先に敷居を"}, {"t": 1501.25, "x": "越えたかの答えが、入れ替わってしまいます。"}, {"t": 1504.15, "x": "さらに、別の方向からの説もあります。"}, {"t": 1507.1833333333334, "x": "大洪水は確かにあったが、それは地中海からではなく、"}, {"t": 1511.1166666666666, "x": "一万七千年前から一万四千年前ごろ、"}, {"t": 1514.7166666666667, "x": "カスピ海の側から来たとする説です。"}, {"t": 1517.2333333333333, "x": "この番組では、どの見方も正解として扱いません。"}, {"t": 1520.9333333333334, "x": "速かったとする研究も、遅かったとする"}, {"t": 1523.75, "x": "研究も、査読を通った学術誌に出ています。"}, {"t": 1527.1, "x": "2003年の総説で、ライアンらは、異論はあるが"}, {"t": 1531.0333333333333, "x": "洪水説が観測全体に最もよく合う、と書きました。"}, {"t": 1535.0, "x": "2022年の総説で、アクスとヒスコットは、"}, {"t": 1538.4333333333334, "x": "観測は大洪水という考え方とは両立しない、と書きました。"}, {"t": 1543.0833333333333, "x": "湖の岸は、まだ全部は見つかっていません。"}, {"t": 1546.3833333333334, "x": "答えが割れているのは、そのためです。"}, {"t": 1549.0, "x": "黒海洪水説が研究者の外で注目を集めた理由は、"}, {"t": 1552.9, "x": "人間の歴史と結びつけられたからでした。"}, {"t": 1555.6833333333334, "x": "沈んだ大陸棚に人が住んでいたなら、"}, {"t": 1558.1166666666666, "x": "その跡が海の底に残っているかもしれない。"}, {"t": 1561.1166666666666, "x": "そう考えて、海の底を探しに行った人たちがいます。"}, {"t": 1565.1, "x": "中心にいたのは、深海探査で"}, {"t": 1567.5166666666667, "x": "知られるロバート・バラードです。"}, {"t": 1569.1833333333334, "x": "調査の舞台は、黒海の南岸、トルコのシノプ沖でした。"}, {"t": 1573.65, const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
