<script>
const D={"name": "ep022", "file": "ep022", "dur": 1872.5833125, "segs": [], "subs": [{"t": 0.0, "x": "1783年の夏のことです。"}, {"t": 2.8, "x": "イングランド南部の村に一人の牧師がいました。"}, {"t": 5.633333333333334, "x": "名前はギルバート・ホワイト。"}, {"t": 7.483333333333333, "x": "鳥や虫や天気を長く書き留めてきた人です。"}, {"t": 10.433333333333334, "x": "その日記に、6月23日から奇妙な記録が続きます。"}, {"t": 14.833333333333334, "x": "空がもやに覆われているのです。"}, {"t": 16.9, "x": "風向きが変わっても、もやは晴れません。"}, {"t": 19.733333333333334, "x": "昼の太陽は、かすんだ月のように白く見えました。"}, {"t": 23.25, "x": "床には、さびのような色の光が落ちました。"}, {"t": 26.35, "x": "朝日と夕日は血のように赤く見えました。"}, {"t": 28.916666666666668, "x": "霧ならふつうは湿っています。"}, {"t": 30.9, "x": "けれどもこの霧は乾いていました。"}, {"t": 33.016666666666666, "x": "同じころフランスでも似た空が記録されています。"}, {"t": 35.96666666666667, "x": "ドイツでもイタリアでもそうでした。"}, {"t": 38.0, "x": "ホワイトは記憶にない現象だと書きました。"}, {"t": 40.68333333333333, "x": "もやの出どころは北の海の向こうにありました。"}, {"t": 43.4, "x": "アイスランドの南の高地です。"}, {"t": 45.46666666666667, "x": "そこで大きな山が吹き飛んだのではありません。"}, {"t": 48.266666666666666, "x": "地面に長い裂け目が走っていました。"}, {"t": 50.63333333333333, "x": "そこから、溶岩とガスが出続けていたのです。"}, {"t": 53.93333333333333, "x": "噴火の期間はおよそ八か月に及びました。"}, {"t": 56.81666666666667, "x": "空を濁らせたのは灰の雲ではありません。"}, {"t": 59.53333333333333, "x": "硫黄を含んだガスでした。北半球の"}, {"t": 62.13333333333333, "x": "空のかすみは、五か月以上続いたと"}, {"t": 64.75, "x": "見積もられています。島では家畜の大半が死にました。"}, {"t": 68.16666666666667, "x": "人々の五人に一人が、飢えと病で亡くなりました。"}, {"t": 71.88333333333334, "x": "遠いイングランドでも、死者の帳簿がふくらみました。"}, {"t": 75.41666666666667, "x": "けれども、大きな山は一つも生まれていません。"}, {"t": 78.66666666666667, "x": "残ったのは、地面の長い傷あとのような列だけです。"}, {"t": 82.35, "x": "この回の主語は空です。遠い島から"}, {"t": 84.65, "x": "出たものは空にどう広がったのか。"}, {"t": 86.95, "x": "どこまでが確かで、どこからが言い切れないのか。"}, {"t": 90.1, "x": "順番に見ていきます。火山と聞くと、"}, {"t": 92.7, "x": "とがった山を思い浮かべがちです。"}, {"t": 95.15, "x": "頂上に火口があり煙や灰が噴き上がる。"}, {"t": 97.91666666666667, "x": "そういう形です。けれども1783年の噴火は違いました。"}, {"t": 102.85, "x": "火を噴いたのは山の頂上ではありません。"}, {"t": 105.46666666666667, "x": "地面にできた細長い裂け目でした。"}, {"t": 107.76666666666667, "x": "裂け目の列は、およそ27キロメートル続きます。"}, {"t": 111.43333333333334, "x": "国立公園の案内では、29キロメートルあまりです。"}, {"t": 115.43333333333334, "x": "測りかたによって、数字には幅があります。"}, {"t": 118.55, "x": "この裂け目は、まっすぐな一本の線ではありません。"}, {"t": 122.05, "x": "少しずつずれて並んだ、十本の短い裂け目です。"}, {"t": 125.7, "x": "その途中にラキという名前の山があります。"}, {"t": 128.53333333333333, "x": "噴火の名前はこの山から来ています。"}, {"t": 130.95, "x": "ただしラキ山は1783年に火を噴いていません。"}, {"t": 134.93333333333334, "x": "ずっと古い時代にできた山です。"}, {"t": 137.08333333333334, "x": "水や氷の下で噴火したときにできる、もろい岩の山です。"}, {"t": 141.28333333333333, "x": "ガラスのかけらが固まったような岩でできています。"}, {"t": 144.28333333333333, "x": "裂け目は、その山の両わきを抜けていました。"}, {"t": 147.43333333333334, "x": "名前を貸した山は主役ではなかったのです。"}, {"t": 150.21666666666667, "x": "地元では、この噴火をスカフタ川の火と呼んできました。"}, {"t": 153.95, "x": "溶岩が、スカフタ川の谷に流れこんだからです。"}, {"t": 157.51666666666668, "x": "この裂け目は、ある火山の仲間に数えられます。"}, {"t": 160.81666666666666, "x": "大きな氷河の下にある、グリムスヴォトンです。"}, {"t": 163.96666666666667, "x": "1993年に、二人の研究者が経過を整理しました。"}, {"t": 168.76666666666668, "x": "ソルダルソンとセルフです。"}, {"t": 170.46666666666667, "x": "二人は、ラキとグリムスヴォトンを一続きと見ました。"}, {"t": 173.88333333333333, "x": "二年にわたり、地下の同じしくみが動いていた。"}, {"t": 177.13333333333333, "x": "そう考えたのです。グリムスヴォトンも、"}, {"t": 179.85, "x": "この時期に何度も噴火しています。"}, {"t": 182.13333333333333, "x": "少なくとも1783年に五回、"}, {"t": 185.01666666666668, "x": "84年に二回、85年に一回です。"}, {"t": 188.73333333333332, "x": "ではなぜアイスランドでは地面が裂けるのでしょうか。"}, {"t": 191.75, "x": "この島は大西洋の海底の山脈の上にあります。"}, {"t": 195.13333333333333, "x": "山脈は海の底を南北に走っています。"}, {"t": 198.11666666666667, "x": "ここでは地球の表面の板が東西に離れています。"}, {"t": 201.56666666666666, "x": "その速さは合わせて1年に2センチほどです。"}, {"t": 204.55, "x": "離れる板のすき間にマグマが上がってきます。"}, {"t": 207.2, "x": "マグマは割れ目に沿って、横一列に噴き出します。"}, {"t": 210.75, "x": "これが割れ目噴火です。とがった山を"}, {"t": 213.06666666666666, "x": "一つ作るのではありません。"}, {"t": 214.83333333333334, "x": "細長い線の上に小さな丘を並べていきます。"}, {"t": 218.05, "x": "ラキの裂け目にも、百三十を超える火口の丘があります。"}, {"t": 221.98333333333332, "x": "出てきたマグマは、14.7立方キロメートルとされます。"}, {"t": 226.08333333333334, "x": "国立公園の案内では、およそ12立方キロメートルです。"}, {"t": 230.31666666666666, "x": "溶岩が覆った広さは565平方キロメートル。"}, {"t": 234.03333333333333, "x": "歴史時代では最大級の溶岩の流れです。"}, {"t": 237.06666666666666, "x": "数字に幅はあっても、とてつもない量です。"}, {"t": 240.28333333333333, "x": "噴火が始まったのは1783年6月8日です。"}, {"t": 244.43333333333334, "x": "暦をさかのぼると日曜日にあたります。"}, {"t": 247.05, "x": "最初は短い裂け目で短い爆発が起きました。"}, {"t": 250.31666666666666, "x": "そのあと溶岩が流れ出します。"}, {"t": 252.45, "x": "溶岩はスカフタ川の深い谷に入りました。"}, {"t": 255.36666666666667, "x": "四日後には、35キロメートル先の低地に届きます。"}, {"t": 259.3, "x": "ここから、噴火は波のようにくり返しました。"}, {"t": 262.53333333333336, "x": "研究者は八か月で十回の波を数えています。"}, {"t": 265.93333333333334, "x": "一回ごとの流れはよく似ていました。"}, {"t": 268.28333333333336, "x": "まず小さな地震が群れになって起こります。"}, {"t": 270.93333333333334, "x": "揺れはだんだん強くなります。"}, {"t": 272.76666666666665, "x": "そして地面に新しい裂け目が開きます。"}, {"t": 275.48333333333335, "x": "開いた直後には水蒸気の爆発が起きました。"}, {"t": 278.55, "x": "このあたりは地下水の多い土地です。"}, {"t": 280.8333333333333, "x": "上がってきたマグマが、水に触れたのです。"}, {"t": 283.68333333333334, "x": "地下水が尽きると爆発は弱まります。"}, {"t": 286.3, "x": "かわりに溶岩が噴水のように噴き上がりました。"}, {"t": 289.31666666666666, "x": "やがて溶岩は静かに流れ出すようになります。"}, {"t": 292.26666666666665, "x": "裂け目に沿って、火口の丘が次々に積み上がりました。"}, {"t": 296.1666666666667, "x": "丘には、いくつかの種類があります。"}, {"t": 298.7, "x": "軽い溶岩のかけらが積もった丘。"}, {"t": 300.93333333333334, "x": "溶岩のしぶきが重なって固まった丘。"}, {"t": 303.55, "x": "そして、水と触れて砕けた灰が積もった丘です。"}, {"t": 306.98333333333335, "x": "一つの裂け目に、これらが切れ目なく並びました。"}, {"t": 310.23333333333335, "x": "次の波が来ると、また新しい裂け目が開きました。"}, {"t": 313.95, "x": "裂け目は時とともに北東へ伸びていきます。"}, {"t": 316.68333333333334, "x": "その先にはグリムスヴォトンがあります。"}, {"t": 319.0833333333333, "x": "特に激しかったのは最初の二回の波です。"}, {"t": 321.9166666666667, "x": "裂け目の長さは2キロあまりにすぎません。"}, {"t": 324.55, "x": "それでも1秒に8700立方メートルほどの溶岩が出ました。"}, {"t": 328.8333333333333, "x": "一辺20メートルあまりの箱を、一秒で満たす計算です。"}, {"t": 333.2, "x": "溶岩の九割ほどは最初の五か月で出ています。"}, {"t": 336.45, "x": "その後、出かたはだんだん弱まりました。"}, {"t": 339.25, "x": "1784年2月7日、溶岩の流れは止まります。"}, {"t": 343.8333333333333, "x": "一方、グリムスヴォトンの活動は"}, {"t": 346.3, "x": "1785年の5月まで続きました。"}, {"t": 349.3333333333333, "x": "ここで一つの数字に注目します。"}, {"t": 351.6666666666667, "x": "空中に飛んだ火山灰や軽石の量です。"}, {"t": 354.5, "x": "マグマの量に直すと、全体のわずか2.6パーセント。"}, {"t": 358.48333333333335, "x": "残りのほとんどは溶岩として地面を流れました。"}, {"t": 361.6333333333333, "x": "これがこの噴火のいちばんの特徴です。"}, {"t": 364.1333333333333, "x": "灰はヨーロッパ大陸まで少し届いています。"}, {"t": 367.01666666666665, "x": "それでも量としてはごく一部でした。"}, {"t": 369.3833333333333, "x": "山が吹き飛ぶ噴火とは、まるで違うのです。"}, {"t": 372.51666666666665, "x": "それなのにヨーロッパの空は濁りました。"}, {"t": 375.0, "x": "濁らせたのは溶岩から抜けたガスです。"}, {"t": 377.51666666666665, "x": "その話の前に地元で起きたことを見ておきます。"}, {"t": 380.6166666666667, "x": "噴火の現場に近い村があります。"}, {"t": 382.93333333333334, "x": "キルキュバイヤルクロイストゥルという村です。"}, {"t": 385.31666666666666, "x": "そこに、ヨウン・ステイングリムソンという"}, {"t": 387.95, "x": "牧師がいました。1728年に生まれ、"}, {"t": 391.43333333333334, "x": "1791年に亡くなった人です。"}, {"t": 394.35, "x": "南部の牧師たちを、まとめる役目もありました。"}, {"t": 397.68333333333334, "x": "彼は噴火を間近で見続け、くわしく書き残しました。"}, {"t": 401.51666666666665, "x": "その記録はのちに英語にも訳されます。"}, {"t": 404.0833333333333, "x": "1998年の英訳の題は、大地の火という意味です。"}, {"t": 408.71666666666664, "x": "もとの題は、地の火についての完全な報告と"}, {"t": 411.8833333333333, "x": "書きつけ、といった意味です。"}, {"t": 413.9166666666667, "x": "地の火とは、噴火のことです。"}, {"t": 416.1166666666667, "x": "その郡で起きた噴火を、まるごと書き残そうとした題です。"}, {"t": 420.28333333333336, "x": "いまも、この噴火を語るのに欠かせない資料です。"}, {"t": 423.7, "x": "彼は自分の生涯の記録も残しました。"}, {"t": 426.3666666666667, "x": "こちらは2002年に英語に訳されています。"}, {"t": 429.23333333333335, "x": "噴火の記録には、噴火の前の"}, {"t": 431.55, "x": "村のもめごとまで書かれています。"}, {"t": 433.46666666666664, "x": "新しい土地の測量をめぐって、村の中が割れていたのです。"}, {"t": 437.5833333333333, "x": "火が上がる前から、村は一つではありませんでした。"}, {"t": 441.05, "x": "溶岩は、二つの大きな流れになって村々に達しました。"}, {"t": 445.0833333333333, "x": "いまはエルドフロインと呼ばれる溶岩原。"}, {"t": 447.5, "x": "そしてブルナフロインと呼ばれる溶岩原です。"}, {"t": 450.3, "x": "溶岩に埋まった農場は二十にのぼります。"}, {"t": 453.05, "x": "大きな被害を受けた農場も、三十ありました。"}, {"t": 456.4166666666667, "x": "1783年7月20日のことです。"}, {"t": 459.71666666666664, "x": "溶岩は、ステイングリムソンの教会に迫っていました。"}, {"t": 463.51666666666665, "x": "この日、彼は教会で礼拝を行います。"}, {"t": 466.75, "x": "アイスランドでは火の説教と呼ばれる礼拝です。"}, {"t": 469.73333333333335, "x": "言い伝えでは、このあと溶岩が教会の手前で止まりました。"}, {"t": 473.73333333333335, "x": "もちろん説教が溶岩を止めたとは確かめられません。"}, {"t": 477.03333333333336, "x": "この番組では、言い伝えとして紹介するにとどめます。"}, {"t": 480.85, "x": "ただ、この話は二百年以上語り継がれてきました。"}, {"t": 484.6, "x": "本当に苦しい時期はそのあとに来ます。"}, {"t": 487.2, "x": "1784年の夏、農場を捨てる人が相次ぎました。"}, {"t": 491.85, "x": "この年の5月、彼は総督から包みを預かります。"}, {"t": 495.8, "x": "封をした包みで中身はお金でした。"}, {"t": 498.21666666666664, "x": "困った農家に配る、600リクスダラーです。"}, {"t": 501.3666666666667, "x": "本来は郡の役人に届ける決まりでした。"}, {"t": 504.1166666666667, "x": "けれども帰り道で、彼は逃げる教区の人々に出会います。"}, {"t": 508.1666666666667, "x": "彼は同行者と相談し、その場で配り始めました。"}, {"t": 511.96666666666664, "x": "この行動は、のちに決まり違反として訴えられます。"}, {"t": 515.4833333333333, "x": "最後には人前で謝ることになりました。"}, {"t": 518.2, "x": "2022年、この一件をたどり直す研究書が出ました。"}, {"t": 522.45, "x": "残された手紙や受取書を読み直したものです。"}, {"t": 525.55, "x": "彼の自伝の説明には、抜けた事実もあったといいます。"}, {"t": 529.2666666666667, "x": "語り継がれた姿と書類には、ずれがあったのです。"}, {"t": 532.8, "x": "研究書によれば、彼は生きていた当時は"}, {"t": 535.6666666666666, "x": "いまほど有名ではありませんでした。"}, {"t": 537.7833333333333, "x": "名声が高まったのは亡くなったあとのことです。"}, {"t": 540.6166666666667, "x": "十九世紀から二十世紀の前半にかけて、"}, {"t": 543.4833333333333, "x": "彼は英雄のように語られました。"}, {"t": 545.8833333333333, "x": "勇気と、力のこもった文章のためです。"}, {"t": 549.05, "x": "それでも現地の目で書いた人がいた意味は大きいものです。"}, {"t": 552.4833333333333, "x": "ソルダルソンとセルフは、当時の記述を"}, {"t": 555.2166666666667, "x": "地層と照らし合わせました。"}, {"t": 556.8166666666667, "x": "どの週にどこで灰が降ったのか。"}, {"t": 558.9333333333333, "x": "そうして、噴火の経過を週ごとにたどれたのです。"}, {"t": 562.2666666666667, "x": "空を濁らせたガスは、どれほどの量だったのでしょうか。"}, {"t": 566.0166666666667, "x": "1783年にガスを測る機械はありません。"}, {"t": 569.7666666666667, "x": "それでもいまはその量が数字で示されています。"}, {"t": 572.7666666666667, "x": "手がかりは固まった溶岩や軽石の中にあります。"}, {"t": 575.9333333333333, "x": "マグマには、もともと硫黄が溶けこんでいます。"}, {"t": 578.8833333333333, "x": "炭酸飲料にガスが溶けているのと似ています。"}, {"t": 581.7333333333333, "x": "マグマが地表に近づくと、圧力が下がります。"}, {"t": 585.1333333333333, "x": "すると硫黄はガスになり、外へ抜けていきます。"}, {"t": 588.45, "x": "ふたを開けた炭酸飲料の泡と同じです。"}, {"t": 591.2166666666667, "x": "ここで役に立つのが、マグマの中の小さな結晶です。"}, {"t": 595.0833333333334, "x": "結晶は育つとき、まわりのマグマを少し包みこみます。"}, {"t": 599.0166666666667, "x": "包まれたマグマはガラスの粒として固まります。"}, {"t": 601.9833333333333, "x": "この粒はガスが抜ける前の見本になります。"}, {"t": 604.7833333333333, "x": "一方で、固まった溶岩にもガラスの部分があります。"}, {"t": 608.5833333333334, "x": "そこには抜けたあとの硫黄しか残っていません。"}, {"t": 611.45, "x": "抜ける前と抜けたあと。その差に"}, {"t": 613.4166666666666, "x": "出てきたマグマの量をかけます。"}, {"t": 615.4, "x": "すると空へ出た硫黄の量が分かります。"}, {"t": 617.9166666666666, "x": "岩石から量る方法と呼ばれるやりかたです。"}, {"t": 620.9, "x": "1996年、ソルダルソンらはこの方法を使いました。"}, {"t": 625.6833333333333, "x": "噴火のすべての段階の試料を調べたのです。"}, {"t": 628.6166666666667, "x": "八か月で出た二酸化硫黄は1億2200万トン。"}, {"t": 632.25, "x": "そこから、2億5000万トンほどの硫酸の粒ができうる。"}, {"t": 636.2666666666667, "x": "そう計算されました。空のかすみ具合から"}, {"t": 639.15, "x": "出した値とも、よく合いました。"}, {"t": 641.4333333333333, "x": "論文は、この噴火をこう位置づけています。"}, {"t": 644.5666666666667, "x": "過去250年で最大級の、大気の汚れの一つだ、と。"}, {"t": 649.3, "x": "ガスの出かたには大きな偏りがありました。"}, {"t": 651.95, "x": "およそ六割が、最初の一か月半に出ていたのです。"}, {"t": 655.6333333333333, "x": "ヨーロッパに霧が届いたのは、ちょうどこの時期です。"}, {"t": 658.9, "x": "出たのは硫黄だけではありません。"}, {"t": 660.9333333333333, "x": "塩素のガスは塩酸に直して700万トン。"}, {"t": 663.9166666666666, "x": "フッ素のガスは、フッ化水素に直して1500万トンです。"}, {"t": 668.1333333333333, "x": "このフッ素が、のちに島の家畜を苦しめます。"}, {"t": 671.4333333333333, "x": "もう一つ大事な数字があります。"}, {"t": 673.5166666666667, "x": "ガスの四分の三ほどは裂け目の口で抜けました。"}, {"t": 676.6, "x": "溶岩の噴水と噴煙が、それを空へ運び上げます。"}, {"t": 680.5, "x": "高さは、6キロから13キロメートルに達しました。"}, {"t": 684.1833333333333, "x": "勢いの強い割れ目噴火は、ガスを"}, {"t": 686.8, "x": "これほど高く持ち上げられます。"}, {"t": 688.6166666666667, "x": "そこで生まれた粒は、何か月も空にとどまります。"}, {"t": 692.15, "x": "ときには一年から二年も残ると、論文は指摘しています。"}, {"t": 696.25, "x": "流れる溶岩から、あとで抜けたガスもあります。"}, {"t": 699.4666666666667, "x": "こちらは全体の18パーセントほどでした。"}, {"t": 702.2666666666667, "x": "このガスは空の低いところにとどまりました。"}, {"t": 704.95, "x": "影響は主に島の中に限られたとされます。"}, {"t": 707.9, "x": "高く上がったガスは遠くへ向かう。"}, {"t": 710.0166666666667, "x": "低いガスは島の中にとどまる。"}, {"t": 712.0666666666667, "x": "この二つの道すじが、違う被害を生みました。"}, {"t": 715.35, "x": "島の人々を苦しめたのは、溶岩だけではありません。"}, {"t": 719.15, "x": "島の上には、ガスと細かい粒がもやになって漂いました。"}, {"t": 723.0833333333334, "x": "アイスランドでは、このあとの年月をこう呼びます。"}, {"t": 726.5, "x": "モーズハルジンディ。もやの苦難という意味です。"}, {"t": 729.3666666666667, "x": "当時の島の暮らしは家畜に支えられていました。"}, {"t": 732.35, "x": "家畜が食べるのは牧草です。"}, {"t": 734.3166666666667, "x": "その牧草に、フッ素を含んだ火山の粒が降りました。"}, {"t": 738.0, "x": "フッ素をとりすぎると、家畜は体をこわします。"}, {"t": 741.4, "x": "2018年の研究は、放牧の"}, {"t": 744.2166666666667, "x": "家畜の六割が死んだとしています。"}, {"t": 746.3833333333333, "x": "飢えによるものと、フッ素によるものです。"}, {"t": 749.05, "x": "国立公園の案内では、およそ四分の三です。"}, {"t": 752.7333333333333, "x": "資料によって数字には幅があります。"}, {"t": 755.2333333333333, "x": "けれども半分を大きく超えた点は一致しています。"}, {"t": 758.5, "x": "家畜が死ぬと乳も肉も手に入りません。"}, {"t": 761.0666666666667, "x": "冬を越す食べ物が足りなくなりました。"}, {"t": 763.4, "x": "そこへ天然痘の流行も重なります。"}, {"t": 766.0333333333333, "x": "国立公園の案内はこう伝えています。"}, {"t": 768.8, "x": "飢えと天然痘で島の五人に一人が亡くなった。"}, {"t": 771.9, "x": "2018年の研究も、ほぼ同じ見積もりです。"}, {"t": 775.5833333333334, "x": "三年のうちに、人口の二割が亡くなったとしています。"}, {"t": 779.4166666666666, "x": "噴火に近い地域では、住民の四割ほどが亡くなりました。"}, {"t": 783.6166666666667, "x": "島全体では五人に一人。近くの地域では五人に二人です。"}, {"t": 787.9166666666666, "x": "国立公園の案内はこう書いています。"}, {"t": 790.5666666666667, "x": "人が住み始めて以来、最悪の自然災害の一つだ、と。"}, {"t": 795.2833333333333, "x": "2023年の書評も、似た言葉を使っています。"}, {"t": 799.1666666666666, "x": "九世紀の入植以来、島が経験したもっとも過酷な出来事。"}, {"t": 803.7166666666667, "x": "ここで目を向けたいのは、命を奪ったものの順番です。"}, {"t": 807.4666666666667, "x": "多くの命を奪ったのは、溶岩ではありませんでした。"}, {"t": 811.2166666666667, "x": "そのあとに来た飢えと病です。"}, {"t": 813.2666666666667, "x": "目に見える火の川よりも、見えにくいガスと粒。"}, {"t": 816.55, "x": "それが暮らしの土台を崩したのです。"}, {"t": 818.85, "x": "農場を捨てる人が相次いだのも、この流れの中です。"}, {"t": 822.5666666666667, "x": "牧草が育たず家畜もいない。"}, {"t": 824.5, "x": "そうなれば、土地にとどまる理由がなくなります。"}, {"t": 827.7166666666667, "x": "島を離れる人を止めるため、役所は"}, {"t": 830.4833333333333, "x": "家畜を買い直すお金を配ろうとしました。"}, {"t": 833.15, "x": "1783年から84年の冬には、デンマークと"}, {"t": 837.5666666666667, "x": "ノルウェーで寄付も集められました。"}, {"t": 839.4166666666666, "x": "けれども研究書は、1784年に島へ"}, {"t": 843.0833333333334, "x": "助けが届いた記録は無いと書いています。"}, {"t": 845.5166666666667, "x": "ステイングリムソンが預かったお金も、"}, {"t": 847.85, "x": "寄付ではありませんでした。"}, {"t": 849.7166666666667, "x": "総督が自分で管理する、別の"}, {"t": 852.2166666666667, "x": "公の基金から出したものでした。"}, {"t": 854.3, "x": "このあと、同じガスは海を越えていきます。"}, {"t": 857.25, "x": "ただ届いた先で起きたことは、かなり違っていました。"}, {"t": 860.7666666666667, "x": "高く上がったガスは強い西風に乗りました。"}, {"t": 863.55, "x": "北大西洋の上空を流れる、ジェット気流です。"}, {"t": 867.15, "x": "ガスは東へ東へと運ばれていきます。"}, {"t": 869.9666666666667, "x": "その途中で空気中の水分と反応しました。"}, {"t": 873.0666666666667, "x": "そして硫酸の細かい粒に変わっていきます。"}, {"t": 875.9, "x": "2003年の論文は、その量を2億トンほどとしています。"}, {"t": 880.0333333333333, "x": "1996年の論文とは少し違う数字です。"}, {"t": 883.9, "x": "見積もりの方法が変われば、数字も動きます。"}, {"t": 887.2166666666667, "x": "この噴火の話では、そういう場面が何度も出てきます。"}, {"t": 891.0166666666667, "x": "では霧はどの順番で広がったのでしょうか。"}, {"t": 893.8, "x": "2018年の研究が、その道すじをたどりました。"}, {"t": 897.7666666666667, "x": "当時の記録と、天気の再現を組み合わせたのです。"}, {"t": 901.3333333333334, "x": "6月10日。最初のもやがフェロー諸島に現れます。"}, {"t": 905.0, "x": "同じ日、スコットランドの北東部にも出ました。"}, {"t": 908.2, "x": "ノルウェーの西海岸にもです。"}, {"t": 910.1333333333333, "x": "6月17日から18日には、フランスとドイツに達しました。"}, {"t": 914.7666666666667, "x": "北イタリアにも届いています。"}, {"t": 916.6333333333333, "x": "6月21日から23日には、イングランド南部が覆われます。"}, {"t": 921.5666666666667, "x": "とても濃いもやだったと記録されています。"}, {"t": 923.95, "x": "計算で再現した空でも、ガスの帯が見えています。"}, {"t": 927.7666666666667, "x": "6月21日には、アイスランドから"}, {"t": 930.6333333333333, "x": "アゾレス諸島まで帯が伸びていました。"}, {"t": 932.8333333333334, "x": "その帯が東へ進み、22日にイングランドの西に届きます。"}, {"t": 937.4333333333333, "x": "23日には東の端まで達しました。"}, {"t": 940.3166666666667, "x": "ただし、計算と記録がいつも合うわけではありません。"}, {"t": 944.0666666666667, "x": "計算ではもやが出ているのに、"}, {"t": 945.9166666666666, "x": "記録が見つからない日もあります。"}, {"t": 948.15, "x": "研究者自身が、その食い違いを限界として書いています。"}, {"t": 952.25, "x": "6月26日にはリスボンからも報告が出ました。"}, {"t": 955.7, "x": "サンクトペテルブルクからもです。"}, {"t": 957.6166666666667, "x": "6月の終わりには、ほぼすべての"}, {"t": 959.9, "x": "国が霧を記録していました。"}, {"t": 961.65, "x": "中央と西のヨーロッパの国々です。"}, {"t": 964.1, "x": "なぜ、高い空の粒が地面まで降りたのでしょうか。"}, {"t": 967.8666666666667, "x": "ソルダルソンとセルフは高気圧に注目しました。"}, {"t": 971.0166666666667, "x": "高気圧の中では空気がゆっくりと沈みます。"}, {"t": 974.05, "x": "その沈む空気が、上空の粒を地表まで運んだ。"}, {"t": 977.9166666666666, "x": "二人はそう考えたのです。二人の"}, {"t": 980.3666666666667, "x": "見積もりでは、1億7500万トンほどが地上に落ちました。"}, {"t": 984.6, "x": "酸性の雨や霧になって、降りてきたのです。"}, {"t": 987.8666666666667, "x": "これが、乾いた霧の正体だとされています。"}, {"t": 991.1166666666667, "x": "残りの2500万トンほどは、高い空に残りました。"}, {"t": 995.05, "x": "一年以上とどまったと見られています。"}, {"t": 997.4666666666667, "x": "北半球を覆ったかすみは五か月以上続きました。"}, {"t": 1000.8333333333334, "x": "霧の中では硫黄のにおいがしたといいます。"}, {"t": 1003.4833333333333, "x": "そうした記録が各地に残っています。"}, {"t": 1005.8666666666667, "x": "頭痛や息苦しさを訴える人もいました。"}, {"t": 1008.65, "x": "ぜんそくの発作を起こす人もいました。"}, {"t": 1011.0, "x": "酸性の雨で植物が傷んだという報告もあります。"}, {"t": 1014.4833333333333, "x": "冒頭のホワイトの日記に戻ります。"}, {"t": 1016.8166666666667, "x": "彼は、6月23日から7月20日までもやを書き留めました。"}, {"t": 1021.4166666666666, "x": "その夏はひどく暑くなりました。"}, {"t": 1023.5166666666667, "x": "肉は、さばいた翌日には食べられなかったと書いています。"}, {"t": 1027.3833333333334, "x": "道ばたにはハエが群がり、馬が暴れるほどでした。"}, {"t": 1030.9833333333333, "x": "村の人々は、赤い太陽をおそれの目で見上げました。"}, {"t": 1034.6666666666667, "x": "2018年の研究によれば、この夏の西ヨーロッパは"}, {"t": 1038.6833333333334, "x": "平年より1度から3度暑かったとされます。"}, {"t": 1041.4333333333334, "x": "比べたのは、1970年から2000年の平均です。"}, {"t": 1045.7166666666667, "x": "この暑さについて、2003年の論文は理由を挙げています。"}, {"t": 1050.0333333333333, "x": "南からの風が、長く吹き続けたためだろう、と。"}, {"t": 1054.1333333333334, "x": "同じ夏、パリのそばにはフランクリンがいました。"}, {"t": 1057.4333333333334, "x": "ベンジャミン・フランクリンです。"}, {"t": 1059.2, "x": "アメリカの使節として、フランスに滞在していたのです。"}, {"t": 1062.8166666666666, "x": "彼はのちにこう書いています。"}, {"t": 1064.6666666666667, "x": "虫めがねで日ざしを集めても、紙にほとんど火がつかない。"}, {"t": 1068.5166666666667, "x": "それほど光は弱くなっていました。"}, {"t": 1070.75, "x": "乾いた霧は日ざしの力を削っていたのです。"}, {"t": 1073.7, "x": "いまの私たちは霧の出どころを知っています。"}, {"t": 1076.4666666666667, "x": "けれども当時の人々は、それを知りませんでした。"}, {"t": 1079.8, "x": "遠い島の出来事が、すぐ伝わる時代ではありません。"}, {"t": 1083.45, "x": "ホワイトは、同じころの出来事を日記に並べています。"}, {"t": 1087.1666666666667, "x": "イタリア南部で大きな地震が続いていたこと。"}, {"t": 1090.0333333333333, "x": "カラブリアとシチリアです。"}, {"t": 1091.7, "x": "そしてノルウェーの沖の海から火山が現れたこと。"}, {"t": 1094.8166666666666, "x": "ホワイトは、それが霧の原因だとは書いていません。"}, {"t": 1098.3, "x": "人々を不安にさせた出来事として並べたのです。"}, {"t": 1101.4166666666667, "x": "霧をアイスランドと結びつけた最初の一人がいます。"}, {"t": 1104.5833333333333, "x": "フランスの博物学者、ムルグ・ド・モントルドンです。"}, {"t": 1108.1333333333334, "x": "そのあと、フランクリンも火山に目を向けました。"}, {"t": 1111.35, "x": "1784年の5月、彼は短い文章を書いています。"}, {"t": 1116.2833333333333, "x": "題は気象についての想像と推測。"}, {"t": 1118.8, "x": "その年の12月22日、マンチェスターの"}, {"t": 1122.0666666666666, "x": "学会で読み上げられました。"}, {"t": 1123.7, "x": "フランクリンは、霧の原因として二つの見立てを挙げます。"}, {"t": 1127.6333333333334, "x": "一つめは宇宙から来た火の玉の煙です。"}, {"t": 1130.35, "x": "地球は、太陽のまわりを回る途中で火の玉に出会う。"}, {"t": 1134.3, "x": "その燃えた煙が、地球に引き寄せられたのではないか。"}, {"t": 1137.9833333333333, "x": "そういう考えでした。二つめは"}, {"t": 1140.0833333333333, "x": "アイスランドの火山の煙です。"}, {"t": 1142.1666666666667, "x": "名前を挙げたのはヘクラ山でした。"}, {"t": 1144.3666666666666, "x": "そしてその島の近くの海から現れた火山です。"}, {"t": 1147.55, "x": "フランクリンは、どちらとも決めていません。"}, {"t": 1150.45, "x": "原因はまだ分からないと書いています。"}, {"t": 1152.8, "x": "けれども霧の出どころはヘクラではありませんでした。"}, {"t": 1155.8, "x": "火を噴いていたのはラキの裂け目です。"}, {"t": 1157.9833333333333, "x": "フランクリンの見立ては半分は合っていました。"}, {"t": 1160.75, "x": "アイスランドの火山という向きは、正しかったのです。"}, {"t": 1164.2166666666667, "x": "けれども名前を挙げた山は違っていました。"}, {"t": 1166.8666666666666, "x": "霧の出どころは、その後も確かめられていきます。"}, {"t": 1170.1, "x": "手がかりの一つはグリーンランドの氷床です。"}, {"t": 1172.8833333333334, "x": "氷床には毎年の雪が層になって積もっています。"}, {"t": 1176.15, "x": "その中に空から落ちた硫酸も閉じこめられます。"}, {"t": 1179.2166666666667, "x": "グリーンランドの氷には、大きな硫酸の山があります。"}, {"t": 1183.15, "x": "1780年代にあたる深さです。"}, {"t": 1186.0666666666666, "x": "この山は、1783年の夏に積もったと考えられてきました。"}, {"t": 1191.0333333333333, "x": "そして氷の年代を合わせる目印に使われてきました。"}, {"t": 1194.6, "x": "ところが1994年、ある研究がこれを見直します。"}, {"t": 1199.1166666666666, "x": "グリーンランド中央部の氷を、細かく調べたのです。"}, {"t": 1202.8666666666666, "x": "硫酸の山の少し下から、火山ガラスのかけらが出ました。"}, {"t": 1206.8333333333333, "x": "ラキから来たかけらです。灰は、"}, {"t": 1209.4333333333334, "x": "1783年の夏に少しだけ届いていたのです。"}, {"t": 1213.0666666666666, "x": "けれども硫酸が最も多く降ったのは1784年でした。"}, {"t": 1217.5, "x": "その春から夏にかけてです。"}, {"t": 1219.4166666666667, "x": "北極の冬には、ガスが硫酸に変わる反応が進みにくい。"}, {"t": 1223.5833333333333, "x": "そのため、硫酸の山は遅れてできていたのです。"}, {"t": 1227.0, "x": "目印の山は一年ずれていたことになります。"}, {"t": 1229.8666666666666, "x": "この結果は、もう一つのことも示していました。"}, {"t": 1233.0833333333333, "x": "ガスの一部が、高い空に一年以上とどまったことです。"}, {"t": 1237.0666666666666, "x": "1784年の夏、グリーンランドの中央部は冷えていました。"}, {"t": 1242.0166666666667, "x": "氷に残る季節の手がかりが、それを示しています。"}, {"t": 1245.6833333333334, "x": "乾いた霧は人の命にも関わったのでしょうか。"}, {"t": 1248.75, "x": "手がかりは教会の帳簿です。"}, {"t": 1250.7666666666667, "x": "当時の教会は亡くなった人を記録していました。"}, {"t": 1253.7, "x": "イングランドの人口の歴史で、1783年は危機の年です。"}, {"t": 1258.6666666666667, "x": "84年にかけて死者が多かったのです。"}, {"t": 1261.4166666666667, "x": "2004年、二人の研究者がその記録を調べました。"}, {"t": 1265.4, "x": "ウィザムとオッペンハイマーです。"}, {"t": 1267.25, "x": "地域ごと、月ごとに死者の数を並べ直しました。"}, {"t": 1270.7333333333333, "x": "するとふくらみは二つの時期に分かれていました。"}, {"t": 1273.5333333333333, "x": "一つめは1783年の8月から9月。"}, {"t": 1277.1666666666667, "x": "二つめは1784年の1月から2月です。"}, {"t": 1280.9166666666667, "x": "二つを合わせると、二万人ほど多く亡くなっていました。"}, {"t": 1284.6333333333334, "x": "どちらも、いちばん影響が大きかったのは東部です。"}, {"t": 1288.2, "x": "では原因は霧だったのでしょうか。"}, {"t": 1290.4333333333334, "x": "二人の答えは慎重なものでした。"}, {"t": 1292.7166666666667, "x": "冬のふくらみは、1784年1月の寒さで説明がつく。"}, {"t": 1297.7333333333333, "x": "二人はそう見ています。夏のふくらみは、"}, {"t": 1300.9333333333334, "x": "7月の猛暑の一、二か月あとです。"}, {"t": 1303.6166666666666, "x": "暑さで広がるおなかの病気があります。"}, {"t": 1306.1833333333334, "x": "マラリアが関わった可能性もあります。"}, {"t": 1308.6333333333334, "x": "けれどもそれだけですべては説明できません。"}, {"t": 1311.3833333333334, "x": "そこで二人は、霧の中の酸の粒やガスを挙げました。"}, {"t": 1315.1833333333334, "x": "これも夏の死者を増やした可能性がある、としたのです。"}, {"t": 1318.9166666666667, "x": "霧は、天気の異常にも関わっていたと考えられます。"}, {"t": 1322.5333333333333, "x": "そうであれば、噴火も何らかの役割を果たしただろう。"}, {"t": 1326.3166666666666, "x": "これが二人の結論です。フランスにも似た記録があります。"}, {"t": 1330.0833333333333, "x": "2005年の研究は、三つの地域の記録を調べました。"}, {"t": 1334.2333333333333, "x": "1783年の8月から10月の死者に注目したのです。"}, {"t": 1338.8333333333333, "x": "三年間の平均より、48パーセント多くなっていました。"}, {"t": 1343.3, "x": "2018年の研究は、比べる物差しを16年に広げています。"}, {"t": 1348.3666666666666, "x": "1774年から1789年までの平均と比べたのです。"}, {"t": 1353.5833333333333, "x": "この研究は、さらに一歩進めています。"}, {"t": 1356.6833333333334, "x": "当時の霧の濃さを計算で再現したのです。"}, {"t": 1359.5833333333333, "x": "それを、いまの医学の式に当てはめました。"}, {"t": 1362.6166666666666, "x": "細かい粒と死亡の関係を示す式です。"}, {"t": 1365.5, "x": "結果は、霧だけでは説明しきれない、というものでした。"}, {"t": 1369.75, "x": "当時のフランスでは飢饉は起きていません。"}, {"t": 1372.35, "x": "研究者たちは、いくつもの重なりを挙げています。"}, {"t": 1375.7166666666667, "x": "霧のガスと細かい粒。記録的な暑さ。"}, {"t": 1378.6, "x": "体の弱った人々と乏しい医療です。"}, {"t": 1381.2166666666667, "x": "死者の数は帳簿に確かに残っています。"}, {"t": 1383.9333333333334, "x": "けれどもそのうち何人が霧のせいかは分けられません。"}, {"t": 1387.1333333333334, "x": "暑さと寒さと病気と霧。それが、"}, {"t": 1389.6, "x": "帳簿の同じ行に重なっているのです。"}, {"t": 1392.3833333333334, "x": "1783年から84年の冬は、とても厳しくなりました。"}, {"t": 1397.5, "x": "ヨーロッパでは、平年より2度ほど低かったとされます。"}, {"t": 1401.1, "x": "1700年代後半の平均と比べた値です。"}, {"t": 1404.55, "x": "北アメリカの東部でも、指折りの厳しい冬でした。"}, {"t": 1408.15, "x": "過去500年の中でも、上位に入る冬です。"}, {"t": 1411.5333333333333, "x": "フランクリンは、この冬と霧を結びつけました。"}, {"t": 1414.8333333333333, "x": "霧が日ざしを弱め、地面が温まらなかった。"}, {"t": 1418.2833333333333, "x": "だから地面は早く凍り、最初の雪がとけ残った。"}, {"t": 1422.0666666666666, "x": "その上に雪が積もり冬が厳しくなった。"}, {"t": 1424.7833333333333, "x": "そういう推理です。フランクリンはさらに提案しています。"}, {"t": 1428.5333333333333, "x": "ほかの厳しい冬の前にも、夏の霧があったのか。"}, {"t": 1432.1, "x": "それを調べる価値があるというのです。"}, {"t": 1434.3833333333334, "x": "もしそうなら、夏の霧を見て冬に備えられます。"}, {"t": 1437.7833333333333, "x": "春に凍った川の氷が割れて流れ出す"}, {"t": 1440.3333333333333, "x": "被害にも、前もって手を打てる。"}, {"t": 1442.6, "x": "フランクリンは、そこまで書いています。"}, {"t": 1445.2333333333333, "x": "ラキは、気候の異常と結びつけられた"}, {"t": 1447.8333333333333, "x": "最初期の噴火の一つです。ではいまの研究は"}, {"t": 1450.4833333333333, "x": "この推理をどう見ているのでしょうか。"}, {"t": 1452.8833333333334, "x": "答えは一つにまとまっていません。"}, {"t": 1455.0333333333333, "x": "2003年、ソルダルソンとセルフはこう書きました。"}, {"t": 1458.7333333333333, "x": "ヨーロッパと北アメリカでは冷えこみが続いた。"}, {"t": 1461.5333333333333, "x": "年平均で1.3度ほどです。"}, {"t": 1463.7666666666667, "x": "それが、2年から3年続いたとしています。"}, {"t": 1466.9833333333333, "x": "二人は、北極の夏の熱のつり合いが崩れたと考えました。"}, {"t": 1471.05, "x": "高い空に残った硫酸が、二度の夏にわたって効いた。"}, {"t": 1474.8666666666666, "x": "そういう見立てです。同じ年の気候モデルの"}, {"t": 1477.95, "x": "研究は、違う数字を出しました。"}, {"t": 1480.25, "x": "北半球全体の1783年の平均で、0.21度の低下です。"}, {"t": 1486.05, "x": "比べている範囲が違うので、そのままは比べられません。"}, {"t": 1489.8333333333333, "x": "それでも見積もりには大きな幅があります。"}, {"t": 1492.4666666666667, "x": "モデルの研究自身も、計算に"}, {"t": 1495.0, "x": "少なくとも5割の幅があると認めています。"}, {"t": 1497.6666666666667, "x": "2011年には別の答えを示す研究が出ました。"}, {"t": 1501.3, "x": "ダリーゴらは600年ぶんの年輪を使いました。"}, {"t": 1504.3166666666666, "x": "そこから、大気と海の状態を復元したのです。"}, {"t": 1507.8, "x": "一つは北大西洋の気圧のシーソーです。"}, {"t": 1510.6833333333334, "x": "北大西洋振動と呼ばれています。"}, {"t": 1513.1, "x": "もう一つは太平洋のエルニーニョです。"}, {"t": 1515.6, "x": "1783年から84年の冬は、この二つがそろっていました。"}, {"t": 1520.8833333333334, "x": "どちらも寒い冬を呼ぶ向きです。"}, {"t": 1523.0, "x": "その組み合わせは、600年で二番目の強さでした。"}, {"t": 1526.7333333333333, "x": "ダリーゴらの結論はこうです。"}, {"t": 1528.7666666666667, "x": "あの冬の主な原因は、この組み合わせだった。"}, {"t": 1532.1166666666666, "x": "それはラキと関係のない自然の揺らぎだった。"}, {"t": 1534.9833333333333, "x": "その可能性が高いというのです。"}, {"t": 1537.1833333333334, "x": "霧の影響は、ヨーロッパの外にも探されてきました。"}, {"t": 1540.85, "x": "エジプトのナイル川では、噴火のあと水が減りました。"}, {"t": 1544.4833333333333, "x": "とても少なかったという記録があります。"}, {"t": 1546.8833333333334, "x": "2006年の研究は、気候モデルでこう説明しました。"}, {"t": 1550.8833333333334, "x": "北半球の陸が夏に冷えた。そのため、"}, {"t": 1553.6666666666667, "x": "アフリカとインドの季節風が弱まった。"}, {"t": 1556.6, "x": "そして雨が減ったのではないか、というのです。"}, {"t": 1559.7833333333333, "x": "アラスカの北西部では、年輪が手がかりになりました。"}, {"t": 1563.3666666666666, "x": "1783年は四百年あまりで最も寒い夏でした。"}, {"t": 1567.9166666666667, "x": "1999年の研究は、これを飢えの記録と結びつけました。"}, {"t": 1572.9166666666667, "x": "イヌイットの言い伝えとも、照らし合わせています。"}, {"t": 1576.25, "x": "ただし論文自身がこれを仮説と書いています。"}, {"t": 1579.2, "x": "そして日本です。1783年は日本の天明3年にあたります。"}, {"t": 1584.75, "x": "この年の8月4日の夜、浅間山が大きく噴火しました。"}, {"t": 1589.1833333333334, "x": "噴火は翌5日にかけて続きます。"}, {"t": 1591.5333333333333, "x": "内閣府の報告書によると、1624人が亡くなりました。"}, {"t": 1596.1, "x": "火砕流や泥流などによるものです。"}, {"t": 1598.4, "x": "山の北のふもとでは、鎌原村が土砂に埋まりました。"}, {"t": 1602.15, "x": "泥の流れは川を下り、銚子や江戸にまで達しています。"}, {"t": 1606.05, "x": "浅間山の噴火は、地元に大きな傷を残した噴火でした。"}, {"t": 1610.4, "x": "同じころ日本は天明の大飢饉のさなかでした。"}, {"t": 1613.65, "x": "では飢饉はラキや浅間山のせいだったのでしょうか。"}, {"t": 1616.8, "x": "内閣府の報告書はここでも慎重です。"}, {"t": 1619.6666666666667, "x": "東北の藩の記録が引用されています。"}, {"t": 1622.3, "x": "前の年の天明2年から、雨と冷えこみが続いていた。"}, {"t": 1626.3333333333333, "x": "そう書かれた記録です。浅間山は、ラキより"}, {"t": 1629.3, "x": "マグマの量がずっと小さい噴火でした。"}, {"t": 1631.9833333333333, "x": "報告書は、気温の低下の主な原因ではないとしています。"}, {"t": 1635.9833333333333, "x": "そのうえで、1783年はエルニーニョの"}, {"t": 1639.5833333333333, "x": "年だった可能性が高い。そのことにも触れています。"}, {"t": 1642.9333333333334, "x": "世界の天候の異常は、いくつもの原因が重なった。"}, {"t": 1646.6833333333334, "x": "報告書はそう見ています。ラキが"}, {"t": 1648.8166666666666, "x": "日本の飢饉にどれだけ関わったのか。"}, {"t": 1651.25, "x": "それは分かっていません。この番組では、"}, {"t": 1653.8833333333334, "x": "つながりを言い切らずにおきます。"}, {"t": 1656.1, "x": "ここまでの話を確かさの重さで仕分けます。"}, {"t": 1659.0, "x": "まず定説として争われていないことです。"}, {"t": 1661.6166666666666, "x": "1783年6月8日から、ラキの裂け目が溶岩とガスを出した。"}, {"t": 1666.9833333333333, "x": "それは1784年2月7日まで続いた。"}, {"t": 1670.5666666666666, "x": "裂け目は十本の集まりで、長さは27キロメートルほど。"}, {"t": 1674.8833333333334, "x": "空に飛んだ灰はごく一部で、ほとんどが溶岩だった。"}, {"t": 1678.6833333333334, "x": "1783年の夏、ヨーロッパの広い範囲で乾いた霧が出た。"}, {"t": 1683.85, "x": "アイスランドでは家畜の大半が死んだ。"}, {"t": 1686.3, "x": "そして人々の五人に一人が亡くなった。"}, {"t": 1688.8833333333334, "x": "次に有力説として数字に幅があるものです。"}, {"t": 1691.95, "x": "二酸化硫黄の量は1億2200万トン。"}, {"t": 1695.0, "x": "岩の中のガラスの粒から量った値です。"}, {"t": 1697.7833333333333, "x": "硫酸の粒は、2億トンとも、"}, {"t": 1700.1666666666667, "x": "2億5000万トンともいわれます。"}, {"t": 1702.5, "x": "高気圧の沈む空気が霧を下ろした、という説明。"}, {"t": 1706.25, "x": "これもこの段に入ります。7月の猛暑が、"}, {"t": 1709.2833333333333, "x": "南からの風のせいだったという説明。"}, {"t": 1711.9833333333333, "x": "これも同じ段に入ります。イングランドで"}, {"t": 1714.55, "x": "多く亡くなった人は二万人ほど。"}, {"t": 1716.5833333333333, "x": "ただし霧の分は切り分けられません。"}, {"t": 1718.85, "x": "最後に少数説や、まだ決着していない話です。"}, {"t": 1722.7833333333333, "x": "1783年から84年の厳しい冬は、ラキのせいだったのか。"}, {"t": 1728.15, "x": "それとも自然の揺らぎだったのか。"}, {"t": 1730.2333333333333, "x": "ナイル川の水の少なさや、アラスカの寒い夏。"}, {"t": 1733.6666666666667, "x": "日本の天明の飢饉との関わり。どれもこの段に入ります。"}, {"t": 1737.7333333333333, "x": "この番組では、冬の寒さについては、"}, {"t": 1740.6833333333334, "x": "ラキのせいと言い切らない立場をとります。"}, {"t": 1743.3166666666666, "x": "冷えこみがあったことは確かです。"}, {"t": 1745.3833333333334, "x": "けれども原因を一つに決める材料はそろっていません。"}, {"t": 1748.7833333333333, "x": "大切なのは二つの話を分けることです。"}, {"t": 1751.5, "x": "乾いた霧そのものと、そのあとの寒さです。"}, {"t": 1754.65, "x": "霧が出たことは、各地の記録が同じように伝えています。"}, {"t": 1758.4666666666667, "x": "寒さの原因は、いまも研究者の答えが割れています。"}, {"t": 1762.4666666666667, "x": "同じ噴火でも近いところほど確かです。"}, {"t": 1765.0333333333333, "x": "遠くへ行くほど話は揺れていきます。"}, {"t": 1767.45, "x": "島の草の上で起きたことは、はっきりしています。"}, {"t": 1770.85, "x": "海を越えた空で起きたことは、まだ議論の途中です。"}, {"t": 1774.4666666666667, "x": "1784年2月7日。ラキの裂け目から"}, {"t": 1777.7166666666667, "x": "流れる溶岩が、止まりました。"}, {"t": 1780.2333333333333, "x": "噴火が終わったとき、そこに大きな山はありません。"}, {"t": 1783.7166666666667, "x": "高い山を積み上げる噴火ではなかったからです。"}, {"t": 1786.7, "x": "残ったのは地面の裂け目です。"}, {"t": 1788.6833333333334, "x": "それに沿って、小さな火口の丘が並んでいます。"}, {"t": 1792.2, "x": "その数は百三十を超えます。"}, {"t": 1794.4666666666667, "x": "列の途中には古いラキ山がいまも立っています。"}, {"t": 1797.5333333333333, "x": "名前を貸しただけの山です。"}, {"t": 1799.4666666666667, "x": "流れ出た溶岩は、その後、厚いコケに覆われました。"}, {"t": 1803.5333333333333, "x": "いまは国立公園の中で守られています。"}, {"t": 1806.2666666666667, "x": "若い溶岩原と湿った気候が、厚いコケを育てました。"}, {"t": 1810.25, "x": "珍しい地衣類も、ここで暮らしています。"}, {"t": 1813.1833333333334, "x": "コケは厚くなると、ほかの植物が入れないほどになります。"}, {"t": 1816.8666666666666, "x": "けれども、やがて洪水や灰や溶岩がそれを覆います。"}, {"t": 1820.7333333333333, "x": "そしてまた、新しい土地が生まれます。"}, {"t": 1823.4666666666667, "x": "国立公園の案内は、この土地をそう説明しています。"}, {"t": 1827.4833333333333, "x": "噴火から、二百四十年あまりがたちました。"}, {"t": 1830.7333333333333, "x": "裂け目の列は、いまも同じ場所に横たわっています。"}, {"t": 1834.2666666666667, "x": "噴火と聞くと、高くそびえる山を思い浮かべます。"}, {"t": 1837.7833333333333, "x": "けれども1783年の噴火は山を作りませんでした。"}, {"t": 1842.0666666666666, "x": "遠くまで届いたのは目に見えないガスです。"}, {"t": 1844.65, "x": "ガスはヨーロッパの空をかすませました。"}, {"t": 1847.1, "x": "島の草に降り、グリーンランドの雪にも落ちました。"}, {"t": 1850.6333333333334, "x": "けれども空の上に跡は残りません。"}, {"t": 1853.05, "x": "霧は晴れ空は元の色に戻りました。"}, {"t": 1855.4666666666667, "x": "いまのヨーロッパの空に、あの夏のかすみはありません。"}, {"t": 1859.0166666666667, "x": "地面に残ったのは、細長い傷あとのような列だけです。"}, {"t": 1862.9166666666667, "x": "山は生まれませんでした。それでも"}, {"t": 1864.9833333333333, "x": "その細い裂け目から出たものがあります。"}, {"t": 1867.45, "x": "それが一つの夏、遠い国々の空の色を変えたのです。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
