<script>
const D={"name": "ep023", "file": "ep023", "dur": 1889.41665625, "segs": [], "subs": [{"t": 0.0, "x": "カリフォルニアと聞くと、乾いた土地を"}, {"t": 2.533333333333333, "x": "思い浮かべる人も多いはずです。"}, {"t": 4.483333333333333, "x": "夏のあいだは何か月も雨が降りません。"}, {"t": 7.15, "x": "丘の草は枯れて茶色に変わります。"}, {"t": 9.45, "x": "その州のまんなかに、ある冬、細長い湖が現れました。"}, {"t": 14.15, "x": "長さはおよそ400キロです。"}, {"t": 16.283333333333335, "x": "東京から大阪までの直線の距離に近い長さです。"}, {"t": 19.866666666666667, "x": "時は1861年の終わりです。"}, {"t": 22.733333333333334, "x": "そこから1862年のはじめにかけての出来事でした。"}, {"t": 26.6, "x": "もとからあった湖ではありません。"}, {"t": 28.833333333333332, "x": "畑と牧場と町が並ぶ谷に、雨の水がたまったのです。"}, {"t": 33.03333333333333, "x": "州都サクラメントは水の底に沈みました。"}, {"t": 35.9, "x": "州の議会は町を離れて、海辺の町へ移りました。"}, {"t": 39.9, "x": "牧場の牛は群れごと水にのまれました。"}, {"t": 42.5, "x": "この出来事は、のちに1862年の大洪水と呼ばれます。"}, {"t": 47.1, "x": "けれども日本ではほとんど知られていません。"}, {"t": 49.78333333333333, "x": "地元でも長く忘れられかけていました。"}, {"t": 52.18333333333333, "x": "この回の主語は空です。海の上から運ばれた水が、ひと冬で"}, {"t": 56.65, "x": "どれほどの量になったのか。"}, {"t": 58.166666666666664, "x": "その様子を一人の学者が手紙に書き残していました。"}, {"t": 61.5, "x": "州の地質を調べるために雇われた人です。"}, {"t": 64.45, "x": "名前をウィリアム・ブルワーといいます。"}, {"t": 66.71666666666667, "x": "彼の手紙と州の記録をたどります。"}, {"t": 69.06666666666666, "x": "そのあとで、のちの研究が明かしたことを見ます。"}, {"t": 72.48333333333333, "x": "最後に、水が引いたあとの谷の姿も確かめます。"}, {"t": 76.18333333333334, "x": "まず舞台となる谷の形を見ておきます。"}, {"t": 78.75, "x": "カリフォルニア州の東には高い山脈があります。"}, {"t": 81.93333333333334, "x": "シエラネバダ山脈です。西の海ぞいには"}, {"t": 84.7, "x": "低い山並みが走っています。"}, {"t": 86.7, "x": "こちらは海岸山脈と呼ばれます。"}, {"t": 89.0, "x": "二つの山並みのあいだに、南北に"}, {"t": 91.55, "x": "長い平地が横たわっています。"}, {"t": 93.46666666666667, "x": "これがセントラル・バレー、中央の谷です。"}, {"t": 96.55, "x": "谷の北を流れるのはサクラメント川です。"}, {"t": 99.3, "x": "南を流れるのはサンホアキン川です。"}, {"t": 101.88333333333334, "x": "二つの川は谷のまんなかで出会います。"}, {"t": 104.41666666666667, "x": "そこから西へ曲がり、サンフランシスコ湾を"}, {"t": 107.51666666666667, "x": "通って海へ出ます。谷の水の"}, {"t": 109.46666666666667, "x": "出口は、ほぼこの一か所だけです。"}, {"t": 111.85, "x": "この土地の雨は、ほとんどが冬に降ります。"}, {"t": 114.85, "x": "秋の終わりから春先までが雨の季節です。"}, {"t": 117.76666666666667, "x": "夏は晴れが続きます。ブルワーの日誌には、"}, {"t": 120.83333333333333, "x": "くわしい注がついています。"}, {"t": 122.83333333333333, "x": "その注に、サンフランシスコの雨量の表が載っています。"}, {"t": 126.63333333333334, "x": "長い年月をならすと、一年の雨はおよそ56センチです。"}, {"t": 131.15, "x": "東京の一年の雨は160センチほどです。"}, {"t": 134.38333333333333, "x": "その3分の1ほどしか降らない土地なのです。"}, {"t": 137.26666666666668, "x": "しかも1862年の前には、雨の少ない年がありました。"}, {"t": 142.0, "x": "1860年夏から61年夏までの"}, {"t": 145.23333333333332, "x": "一年は、およそ50センチでした。"}, {"t": 147.8, "x": "ならした値より、さらに少なかったのです。"}, {"t": 150.83333333333334, "x": "ブルワー自身も1862年2月の手紙に書いています。"}, {"t": 155.0, "x": "ふもとの丘はここ数年の干ばつに苦しんできた。"}, {"t": 158.25, "x": "谷の井戸も水が出にくくなりはじめていた、と。"}, {"t": 161.5, "x": "そんな乾いた土地に、人は急いで町をつくっていました。"}, {"t": 165.25, "x": "1848年に金が見つかると、"}, {"t": 168.1, "x": "世界中から人が押し寄せました。"}, {"t": 170.45, "x": "サクラメントは金の山へ向かう"}, {"t": 172.45, "x": "入り口として大きくなりました。"}, {"t": 174.23333333333332, "x": "二つの川が出会う、低い土地の町です。"}, {"t": 177.3, "x": "市の歴史の資料を見てみます。"}, {"t": 179.35, "x": "最初の堤防は1850年に築かれました。"}, {"t": 182.78333333333333, "x": "その後も1852年と53年に続けて洪水に遭っています。"}, {"t": 187.55, "x": "町は水と向き合わずにはいられない場所にありました。"}, {"t": 190.7, "x": "それでも人々は谷の土の豊かさに賭けました。"}, {"t": 193.73333333333332, "x": "牧場には牛が放たれました。"}, {"t": 195.76666666666668, "x": "平地には畑が広がっていきました。"}, {"t": 198.1, "x": "谷はまだ、乾いた夏の顔を見せていました。"}, {"t": 201.28333333333333, "x": "ここで、この回の記録係を紹介します。"}, {"t": 204.46666666666667, "x": "ウィリアム・ブルワーはアメリカ東部から来た人です。"}, {"t": 207.4, "x": "1860年11月、サンフランシスコの港に着きました。"}, {"t": 212.13333333333333, "x": "州の地質調査所で働くためです。"}, {"t": 214.65, "x": "この調査所は、州の議会が法律でつくったものでした。"}, {"t": 218.55, "x": "率いていたのはジョサイア・"}, {"t": 219.95, "x": "ホイットニーという地質学者です。"}, {"t": 222.06666666666666, "x": "最初の予算は2万ドルでした。"}, {"t": 224.21666666666667, "x": "次の議会が、さらに1万5000ドルを足しました。"}, {"t": 227.76666666666668, "x": "ブルワーは野外の調べを取り仕切る役目でした。"}, {"t": 230.68333333333334, "x": "ラバに乗って山をこえました。"}, {"t": 232.55, "x": "岩を割り、植物を集めました。"}, {"t": 235.15, "x": "彼は自分の動いた距離まで数えています。"}, {"t": 237.93333333333334, "x": "1861年の一年で、ラバで約4260キロ。"}, {"t": 242.96666666666667, "x": "歩いて約1650キロ。ほかの乗り物で約1860キロです。"}, {"t": 248.0, "x": "合わせると7700キロをこえます。"}, {"t": 250.6, "x": "そのうえで、彼は東部の家族へ手紙を書き続けました。"}, {"t": 254.55, "x": "その年だけで600ページあまりになりました。"}, {"t": 257.28333333333336, "x": "その手紙が、のちに一冊の本にまとめられます。"}, {"t": 260.75, "x": "本は1930年に出ました。"}, {"t": 263.26666666666665, "x": "題名は『アップ・アンド・ダウン・カリフォルニア』です。"}, {"t": 267.18333333333334, "x": "本の注には、サンフランシスコの"}, {"t": 269.55, "x": "月ごとの雨量の表もついています。"}, {"t": 271.73333333333335, "x": "数字は1912年に出た気象の本から引かれたものです。"}, {"t": 275.8, "x": "話を1861年の11月に戻します。"}, {"t": 279.53333333333336, "x": "ブルワーはサンフランシスコの"}, {"t": 281.18333333333334, "x": "北の山で調べを続けていました。"}, {"t": 283.3333333333333, "x": "11月の半ば、雨の季節が始まりました。"}, {"t": 286.8333333333333, "x": "夜どおし激しい雨が降りました。"}, {"t": 289.0, "x": "泊まった小屋の屋根からは水がもれました。"}, {"t": 291.46666666666664, "x": "山の上では雨が雪になっていました。"}, {"t": 293.9166666666667, "x": "一行は調べを切り上げて、サンフランシスコへ戻りました。"}, {"t": 297.9166666666667, "x": "帰り道の11月14日は、特別な日でした。"}, {"t": 301.6666666666667, "x": "ブルワーがこの土地に着いて、ちょうど一年の日です。"}, {"t": 305.1166666666667, "x": "祝うつもりだったその夜も、暗い雨でした。"}, {"t": 308.25, "x": "11月の終わりの手紙には、こうあります。"}, {"t": 311.45, "x": "また野外に出たくてたまらない。"}, {"t": 313.25, "x": "これほどぬれていなければ、の話だ。"}, {"t": 315.78333333333336, "x": "あれからずいぶん雨が降っている、と。"}, {"t": 318.5833333333333, "x": "この時点では、まだ誰も知りません。"}, {"t": 321.18333333333334, "x": "この冬の雨が、記録にない量になることを。"}, {"t": 324.4, "x": "1862年1月19日。サンフランシスコで、"}, {"t": 328.03333333333336, "x": "ブルワーは長い手紙を書きました。"}, {"t": 330.8, "x": "書き出しはこうです。雨はやまない。"}, {"t": 333.28333333333336, "x": "前の手紙のあと、洪水はさらにひどくなった。"}, {"t": 336.5833333333333, "x": "彼はまず雨の量を数字で示しました。"}, {"t": 339.21666666666664, "x": "サンフランシスコには雨量の記録がありました。"}, {"t": 342.06666666666666, "x": "1853年からとられていたものです。"}, {"t": 345.0833333333333, "x": "それまでの8年の平均は、一年でおよそ55センチです。"}, {"t": 349.56666666666666, "x": "少ない年は50センチほどでした。"}, {"t": 351.98333333333335, "x": "多い年でも60センチほどでした。"}, {"t": 354.3333333333333, "x": "ところが、この冬は違いました。"}, {"t": 356.71666666666664, "x": "最初のにわか雨が来たのは11月6日です。"}, {"t": 359.8833333333333, "x": "そこから1月18日までに、雨は83センチに達していました。"}, {"t": 364.93333333333334, "x": "およそ二か月半のことです。"}, {"t": 366.81666666666666, "x": "平年の一年ぶんを、すでに大きくこえています。"}, {"t": 370.3333333333333, "x": "しかも雨はまだ降っていました。"}, {"t": 372.31666666666666, "x": "山の側は、さらに多く降りました。"}, {"t": 375.0, "x": "ブルワーは金の採れる町ソノラの記録を引いています。"}, {"t": 378.3, "x": "シエラネバダのふもとにある町です。"}, {"t": 380.56666666666666, "x": "ソノラの記録は11月11日から1月14日までです。"}, {"t": 384.85, "x": "そのあいだに1メートル80センチ降りました。"}, {"t": 387.85, "x": "人の背丈をこえる高さぶんの雨です。"}, {"t": 390.43333333333334, "x": "1メートル50センチをこえた場所もあちこちにありました。"}, {"t": 393.95, "x": "ブルワーはニューヨーク州の"}, {"t": 395.5, "x": "イサカという町とくらべました。"}, {"t": 397.25, "x": "その町に二年かけて降る雨が、"}, {"t": 399.3333333333333, "x": "ここでは二か月で降った、と。"}, {"t": 402.03333333333336, "x": "1月31日の手紙では、数字がさらに増えています。"}, {"t": 406.28333333333336, "x": "サンフランシスコでおよそ94センチ。"}, {"t": 409.01666666666665, "x": "ソノラでは2メートル60センチです。"}, {"t": 411.48333333333335, "x": "山の上には雪も積もっていました。"}, {"t": 413.75, "x": "のちにブルワーは、シエラネバダの峠を訪ねています。"}, {"t": 417.4166666666667, "x": "そのとき日誌にこう書きとめました。"}, {"t": 419.6166666666667, "x": "標高2100メートルほどの峠のことです。"}, {"t": 422.56666666666666, "x": "この冬に積もった雪を合わせると15メートルになった、と。"}, {"t": 426.76666666666665, "x": "注の表も見てみます。1862年1月の一か月だけで、"}, {"t": 431.4166666666667, "x": "サンフランシスコの雨は62センチです。"}, {"t": 434.43333333333334, "x": "ならした一年の雨を、ひと月で上回りました。"}, {"t": 437.9166666666667, "x": "1861年7月から62年6月までの"}, {"t": 441.73333333333335, "x": "一年では125センチです。"}, {"t": 443.85, "x": "表の注には、記録が始まってから"}, {"t": 446.45, "x": "いちばん多い一年とあります。"}, {"t": 448.35, "x": "いちばん少なかった年は19センチほどでした。"}, {"t": 451.46666666666664, "x": "同じ町で、年によって6倍以上の開きがあるのです。"}, {"t": 455.3333333333333, "x": "表を月ごとに追うと、雨の増えかたが見えてきます。"}, {"t": 459.01666666666665, "x": "1861年11月は10センチほどでした。"}, {"t": 462.8, "x": "12月は24センチになりました。"}, {"t": 465.31666666666666, "x": "そして1862年1月が62センチです。"}, {"t": 469.1, "x": "2月も19センチ降りました。"}, {"t": 471.21666666666664, "x": "雨は一度に降ったのではありません。"}, {"t": 473.43333333333334, "x": "月を追うごとに、重なっていったのです。"}, {"t": 476.1666666666667, "x": "乾いていた土も、すぐに水を吸い"}, {"t": 478.43333333333334, "x": "きれなくなりました。降った雨は、そのまま川へ"}, {"t": 481.76666666666665, "x": "流れこむようになっていきました。"}, {"t": 483.6333333333333, "x": "雨が集まる先は谷の底です。"}, {"t": 485.8833333333333, "x": "サクラメント川とその支流は、"}, {"t": 487.93333333333334, "x": "山の雨を一度に受けとめました。"}, {"t": 490.35, "x": "川は堤防をこえて町へ流れこみました。"}, {"t": 493.1333333333333, "x": "サクラメントの町は、この冬に何度も水につかりました。"}, {"t": 497.0, "x": "1月19日のブルワーの手紙はこう書いています。"}, {"t": 500.28333333333336, "x": "サクラメントと多くの町が、ふたたびあふれた。"}, {"t": 503.46666666666664, "x": "水がいくらか引いたあと、また上がってきた。"}, {"t": 506.4166666666667, "x": "あの町は、おそらく今日も水の下だろう、と。"}, {"t": 510.18333333333334, "x": "大きな被害が出たのは1月の上旬です。"}, {"t": 512.9833333333333, "x": "地質学者のリン・イングラムさんが解説しています。"}, {"t": 516.0833333333334, "x": "1月10日、堤防が切れました。"}, {"t": 518.7333333333333, "x": "その日は新しい州知事の就任式の日でした。"}, {"t": 521.9, "x": "知事の名はリーランド・スタンフォードです。"}, {"t": 524.1, "x": "のちにスタンフォード大学を開く人物です。"}, {"t": 526.9166666666666, "x": "町は3メートルほどの濁った水に沈みました。"}, {"t": 529.9666666666667, "x": "それでも就任式は開かれました。"}, {"t": 532.3333333333334, "x": "知事は手こぎの舟で式場へ向かったと伝えられています。"}, {"t": 535.85, "x": "帰りも舟で戻りました。そして"}, {"t": 537.8666666666667, "x": "自宅の二階の窓から家に入ったといいます。"}, {"t": 540.7333333333333, "x": "助けの手は海辺の町から伸びました。"}, {"t": 543.0666666666667, "x": "慈善の団体が動きました。舟が谷へ送られました。"}, {"t": 546.7833333333333, "x": "ブルワーの手紙によると、知らせが"}, {"t": 549.1666666666666, "x": "届いたのは夜の9時でした。"}, {"t": 550.8666666666667, "x": "人々はすぐに動きだしました。"}, {"t": 552.95, "x": "夜明けまでに何トンもの食べ物がそろいました。"}, {"t": 555.75, "x": "ハムだけで5トン近くが調理されたといいます。"}, {"t": 558.6666666666666, "x": "その日の夕方には二せきの蒸気船が出ました。"}, {"t": 561.6833333333333, "x": "積み荷は30トンをこえる食べ物と22トンの衣類です。"}, {"t": 565.3666666666667, "x": "数千ドルのお金も積まれていました。"}, {"t": 567.7, "x": "乗組員つきのボートもいっしょでした。"}, {"t": 570.0833333333334, "x": "町を離れて逃げる人も大勢いました。"}, {"t": 572.5833333333334, "x": "何千人もがサンフランシスコへ"}, {"t": 574.6, "x": "流れこんだと書かれています。"}, {"t": 576.3, "x": "州の議会もサクラメントにとどまれませんでした。"}, {"t": 579.3, "x": "州議会の議事堂委員会がまとめた歴史には、こうあります。"}, {"t": 583.4833333333333, "x": "1861年から62年の冬、激しい洪水が起きた。"}, {"t": 588.45, "x": "そのため議会はサンフランシスコの建物へ移された、と。"}, {"t": 592.5, "x": "イングラムさんの解説では、移った日は1月22日です。"}, {"t": 596.8666666666667, "x": "1月31日のブルワーの手紙にも同じことが書かれています。"}, {"t": 601.05, "x": "議会は州都を離れてこちらへ来た。"}, {"t": 603.4333333333333, "x": "州都が水の下にあるからだ、と。"}, {"t": 606.0833333333334, "x": "州を動かす人たちが、ほかの町で議論を続けたのです。"}, {"t": 610.05, "x": "水は州都だけを沈めたのではありません。"}, {"t": 612.7166666666667, "x": "ブルワーは谷全体の姿を書いています。"}, {"t": 615.4333333333333, "x": "州の中央の大きな谷が水の下にある。"}, {"t": 618.1833333333333, "x": "サクラメントとサンホアキンの二つの谷だ。"}, {"t": 620.8, "x": "長さは400キロから480キロ。"}, {"t": 623.7333333333333, "x": "幅は平均で少なくとも32キロ。"}, {"t": 626.3666666666667, "x": "面積にすると1万3000平方キロから"}, {"t": 629.1, "x": "1万5500平方キロほど。"}, {"t": 631.2666666666667, "x": "長野県ひとつぶんに近い面積です。"}, {"t": 633.85, "x": "もちろん谷の全部に人が住んでいたわけではありません。"}, {"t": 637.15, "x": "それでも、その一部は州でいちばん豊かな畑でした。"}, {"t": 640.9833333333333, "x": "何千もの農場が、まるごと水の下に入りました。"}, {"t": 644.6333333333333, "x": "牛はえさを失って飢えました。そして水におぼれました。"}, {"t": 648.35, "x": "2月9日の手紙には、知り合いの牧童の話が出てきます。"}, {"t": 652.6333333333333, "x": "彼のいた牧場も水につかりました。"}, {"t": 654.9666666666667, "x": "平屋の家の床は6週間も水の下にありました。"}, {"t": 658.3666666666667, "x": "そして最後に、家はばらばらにくずれました。"}, {"t": 661.5166666666667, "x": "その場所では、湖の幅は100キロ近くあったといいます。"}, {"t": 665.6833333333333, "x": "片側の山から反対側の丘まで、すべてが水でした。"}, {"t": 669.7, "x": "蒸気船が、川から20キロ以上離れた牧場の上を走りました。"}, {"t": 674.4833333333333, "x": "牛や荷物を積んで高い丘へ運ぶためです。"}, {"t": 677.45, "x": "ブルワーはこう続けます。この広い"}, {"t": 679.8, "x": "土地の家と農場は、ほとんど消えた。"}, {"t": 682.3, "x": "水は氷のように冷たく、泥で濁っていた。"}, {"t": 685.7, "x": "その広い水の上を風が吹くと、高い波が立った。"}, {"t": 689.4833333333333, "x": "その波が農家を打ちくだいた、と。"}, {"t": 692.1833333333333, "x": "陸の上に、波の立つ海ができたのです。"}, {"t": 695.1666666666666, "x": "電信も止まりました。サクラメントの"}, {"t": 697.5166666666667, "x": "谷の様子も書かれています。"}, {"t": 699.3166666666667, "x": "電信柱のてっぺんまで水につかった場所がありました。"}, {"t": 702.8166666666667, "x": "道はどれも通れなくなりました。"}, {"t": 704.7833333333333, "x": "郵便も届かなくなりました。"}, {"t": 706.6333333333333, "x": "大陸を横切って手紙を運ぶ便も、何週間も来ませんでした。"}, {"t": 711.1666666666666, "x": "ブルワーは書いています。アメリカは、これほど洪水に"}, {"t": 714.8, "x": "荒らされた姿を見たことがない。"}, {"t": 716.6833333333333, "x": "古い大陸でも、めったにないだろう。"}, {"t": 719.3666666666667, "x": "もしこの洪水が10年遅れていたら、"}, {"t": 721.7833333333333, "x": "被害は倍をこえていただろう、と。"}, {"t": 724.7166666666667, "x": "町と畑が広がる前だったことが、"}, {"t": 726.9833333333333, "x": "まだしもの救いだったのです。"}, {"t": 729.0, "x": "ブルワーは、人々の様子にも触れています。"}, {"t": 732.0, "x": "みんなの気持ちは持ち直してきている。"}, {"t": 734.1666666666666, "x": "この経験で、これからはもっと用心深くなるだろう、と。"}, {"t": 738.6, "x": "水は人々の財布も直撃しました。"}, {"t": 741.1166666666667, "x": "1月31日の手紙で、ブルワーはこう書いています。"}, {"t": 745.2, "x": "州の課税対象の財産が大きく減った。"}, {"t": 748.1166666666667, "x": "4分の1以上が失われたと考えられている。"}, {"t": 751.25, "x": "課税対象の財産とは、税をかける元になるものです。"}, {"t": 755.2, "x": "土地や建物や家畜がそれにあたります。"}, {"t": 757.7166666666667, "x": "3月9日の手紙では、もっと細かい数字が出てきます。"}, {"t": 761.8166666666667, "x": "ブルワーは州の財務官に直接会って話を聞いていました。"}, {"t": 765.6166666666667, "x": "財務官の見立てはこうです。"}, {"t": 767.5833333333334, "x": "次の税の台帳では、課税される財産が3分の1ほど減る。"}, {"t": 772.0666666666667, "x": "金額にすると5000万ドルほどになるだろう、と。"}, {"t": 775.5666666666667, "x": "ブルワー自身の見積もりは、もっと幅があります。"}, {"t": 778.8666666666667, "x": "失われた財産は5000万ドルから1億ドルのあいだ。"}, {"t": 782.4, "x": "並の災いではない、と彼は書いています。"}, {"t": 785.5333333333333, "x": "お金の流れも細くなりました。"}, {"t": 787.5166666666667, "x": "2月の手紙によると、借金の利子が上がっていました。"}, {"t": 791.3166666666667, "x": "それまでは、ひと月に1.5パーセントでした。"}, {"t": 794.5666666666667, "x": "それが、ひと月に3パーセントにはね上がったのです。"}, {"t": 798.1666666666666, "x": "ブルワーたち調査所の給料も払われないままでした。"}, {"t": 801.45, "x": "州は彼に1400ドルの借りがありました。"}, {"t": 804.4, "x": "もともと州の財布は苦しい状態でした。"}, {"t": 807.1333333333333, "x": "前の年の11月の手紙には、こうあります。"}, {"t": 810.5833333333334, "x": "知事でさえ、5月から給料を受け取っていない。"}, {"t": 814.0333333333333, "x": "そこへ洪水が重なったのです。"}, {"t": 816.1, "x": "払われるのは12月になるかも"}, {"t": 818.0166666666667, "x": "しれない、と彼は書いています。"}, {"t": 820.2, "x": "牛を育てる牧場も大きな打撃を受けました。"}, {"t": 823.2, "x": "イングラムさんの解説によると、"}, {"t": 825.15, "x": "州にいた牛はおよそ80万頭。"}, {"t": 827.8333333333334, "x": "その4分の1がおぼれ死んだとされます。"}, {"t": 830.5333333333333, "x": "道が使えないことも商売を止めました。"}, {"t": 833.0666666666667, "x": "サンノゼの近くには、水銀を掘る大きな鉱山がありました。"}, {"t": 837.2666666666667, "x": "ブルワーによると、運び出せない水銀が"}, {"t": 839.9166666666666, "x": "450トン近くたまっていました。"}, {"t": 842.2333333333333, "x": "道がぬかるみ、港まで運べなかったのです。"}, {"t": 845.4833333333333, "x": "ブルワー自身も、2月の終わりにこの道を通っています。"}, {"t": 849.3833333333333, "x": "港から町までは11キロほどでした。"}, {"t": 852.0, "x": "乗合馬車の車輪は、すぐに車軸まで泥に沈みました。"}, {"t": 855.8833333333333, "x": "馬も腹のあたりまで沈みました。"}, {"t": 858.0333333333333, "x": "乗客は降りて泥の中を歩きました。"}, {"t": 860.45, "x": "車を押し、また乗り、また降りました。"}, {"t": 863.55, "x": "その11キロに4時間かかったといいます。"}, {"t": 866.3333333333334, "x": "帰り道では、あふれた小川が"}, {"t": 868.7166666666667, "x": "新しい流れをつくっていました。"}, {"t": 870.7333333333333, "x": "道は切られて、馬車は渡れませんでした。"}, {"t": 873.6666666666666, "x": "アメリカ地質調査所の紹介文もあります。"}, {"t": 876.5, "x": "そこには、この洪水が州を破産させたとまで"}, {"t": 879.75, "x": "書かれています。ただ、どこまでを"}, {"t": 881.95, "x": "破産と呼ぶのかは資料ごとに違います。"}, {"t": 884.4333333333333, "x": "この番組では、州の財政が大きく"}, {"t": 887.2, "x": "傷ついた、という言い方にとどめます。"}, {"t": 889.7833333333333, "x": "亡くなった人の数もはっきりしません。"}, {"t": 892.1833333333333, "x": "イングラムさんは、何千もの命が失われたと書いています。"}, {"t": 896.25, "x": "けれども元になった数えかたまでは、たどれませんでした。"}, {"t": 899.8833333333333, "x": "そのため、この回では数字を一つに決めずにおきます。"}, {"t": 903.6666666666666, "x": "2月に入ると、雨はいったん弱まりました。"}, {"t": 906.8666666666667, "x": "谷の水も少しずつ引きはじめました。"}, {"t": 909.2666666666667, "x": "それでも町はすぐには乾きませんでした。"}, {"t": 911.9, "x": "サクラメントに住む判事が、"}, {"t": 913.6666666666666, "x": "ブルワーにこんな話をしています。"}, {"t": 916.0333333333333, "x": "自分の家は町でいちばん高い土地にある。"}, {"t": 918.7, "x": "それでも水が引いたあと、客間には"}, {"t": 921.1666666666666, "x": "60センチの泥が残った、と。"}, {"t": 923.75, "x": "3月の初め、ブルワーは自分の目で"}, {"t": 926.55, "x": "サクラメントを見に行きました。"}, {"t": 928.2666666666667, "x": "給料のことで州の財務官に会うためです。"}, {"t": 931.0666666666667, "x": "夕方に蒸気船でサンフランシスコを出ました。"}, {"t": 934.0666666666667, "x": "着いたのは翌朝です。彼が見た町はこうでした。"}, {"t": 937.4833333333333, "x": "町の大部分は、まだ水の下にある。"}, {"t": 940.1666666666666, "x": "もう三か月もこのままだ。道が水の上に出ている所でも、"}, {"t": 944.0, "x": "低い場所はみな水でいっぱいだ。"}, {"t": 946.2666666666667, "x": "地下室も庭も水びたしで、家の壁はぬれている。"}, {"t": 949.8, "x": "町の多くの場所では、いまも舟でしか動けない。"}, {"t": 953.1833333333333, "x": "ブルワーは二人の少年がこぐ舟に乗りました。"}, {"t": 956.0666666666667, "x": "一、二時間ほど町の中をめぐりました。"}, {"t": 959.15, "x": "家も店も馬小屋も、水にかこまれていました。"}, {"t": 962.4666666666667, "x": "庭は泥だらけの柵でかこまれた池になっていました。"}, {"t": 965.5666666666667, "x": "椅子や机やソファが、濁った水に浮かんでいました。"}, {"t": 969.1, "x": "彼は三つの庭で、三つのソファが"}, {"t": 971.7, "x": "浮いているのを見ています。"}, {"t": 973.0833333333334, "x": "学校の窓からは、長椅子と机が"}, {"t": 975.8166666666667, "x": "浮かんでいるのが見えました。"}, {"t": 977.3166666666667, "x": "建てかけの新しい議事堂は、"}, {"t": 979.1833333333333, "x": "水の中に遠く取り残されていました。"}, {"t": 981.7833333333333, "x": "知事の家は湖の中に立っているようでした。"}, {"t": 984.6666666666666, "x": "くずれかけた家もありました。"}, {"t": 986.45, "x": "流されてきた家が通りをふさいでいる所もありました。"}, {"t": 989.8166666666667, "x": "ブルワーは書いています。この町は"}, {"t": 991.85, "x": "二度と立ち直れないのではないか。"}, {"t": 993.8666666666667, "x": "けれども、こうも書いています。"}, {"t": 996.0166666666667, "x": "この土地の人ほど災いに強い人々はいない。"}, {"t": 998.9, "x": "財産がすぐにでき、すぐに消える"}, {"t": 1001.3333333333334, "x": "話に、みな慣れているのだ、と。"}, {"t": 1004.0, "x": "その日の午後、ブルワーは船で川を下りました。"}, {"t": 1007.2166666666667, "x": "川の両側には、まだ水におおわれた平地が"}, {"t": 1010.3333333333334, "x": "広がっていました。農場も牧場も水の下でした。"}, {"t": 1013.6666666666666, "x": "ところどころに家が見えました。"}, {"t": 1015.5833333333334, "x": "水の上にぽつんと立つ家もありました。"}, {"t": 1018.1166666666667, "x": "小さな高まりの上に取り残され、"}, {"t": 1020.3166666666667, "x": "島のようになった家もありました。"}, {"t": 1022.7166666666667, "x": "3月の半ばには、山でまた激しい嵐が来ています。"}, {"t": 1026.7333333333333, "x": "ブルワーは書きました。もう雨が"}, {"t": 1029.1, "x": "やんでいい季節なのに、やまない、と。"}, {"t": 1031.9333333333334, "x": "それでも、町は実際に立ち直りました。"}, {"t": 1035.0, "x": "サクラメント市の歴史の資料に、"}, {"t": 1037.0333333333333, "x": "その後のことが書かれています。"}, {"t": 1039.15, "x": "町は通りの高さを上げる工事に乗り出しました。"}, {"t": 1042.1833333333334, "x": "1850年代の洪水のあとにも、"}, {"t": 1044.9166666666667, "x": "通りを上げたことがありました。"}, {"t": 1046.9666666666667, "x": "1861年から62年の冬のあと、もう一度上げたのです。"}, {"t": 1052.2333333333333, "x": "町の地面は、もとの土地より高くなりました。"}, {"t": 1055.3333333333333, "x": "その差は3メートルから3.7メートルほどです。"}, {"t": 1058.55, "x": "それまでの一階は地下室になりました。"}, {"t": 1061.0166666666667, "x": "歩道の下には空洞が残りました。"}, {"t": 1063.35, "x": "費用は土地の持ち主にかけた税でまかなわれました。"}, {"t": 1066.45, "x": "工事はそれだけではありません。"}, {"t": 1068.3833333333334, "x": "1864年から68年にかけて、町は"}, {"t": 1072.3166666666666, "x": "アメリカン川の流れを北へ付けかえています。"}, {"t": 1074.9833333333333, "x": "町は自分の地面ごと、水より高い場所へ持ち上げたのです。"}, {"t": 1079.15, "x": "この冬の雨は、サクラメントの"}, {"t": 1081.45, "x": "谷だけのものではありませんでした。"}, {"t": 1083.4666666666667, "x": "ブルワーは1月31日の手紙にこう書いています。"}, {"t": 1087.05, "x": "この洪水は、この海岸全体に広がっている。"}, {"t": 1090.4166666666667, "x": "ロサンゼルスでは28日間、雨がやむことなく降った。"}, {"t": 1094.5833333333333, "x": "大きな被害が出て、村が一つまるごと壊された、と。"}, {"t": 1098.75, "x": "雨は海岸ぞいを北から南まで、広くおおっていました。"}, {"t": 1102.65, "x": "イングラムさんの解説は、北のオレゴンにも触れています。"}, {"t": 1106.45, "x": "オレゴンでは2週間半にわたって雨が降り続きました。"}, {"t": 1109.9333333333334, "x": "記録に残るなかで、いちばんひどい"}, {"t": 1112.3166666666666, "x": "洪水になったといいます。山脈の東側の、"}, {"t": 1115.1833333333334, "x": "いまのネバダ州にあたる土地も同じでした。"}, {"t": 1118.2, "x": "1861年12月からの二か月の雨は、"}, {"t": 1121.8166666666666, "x": "一年ぶんの倍だったとされます。"}, {"t": 1124.1166666666666, "x": "雨の降った期間について、よく引かれる数字があります。"}, {"t": 1127.9833333333333, "x": "43日です。地質学者のイングラムさんは、"}, {"t": 1131.35, "x": "43日続いた嵐と書いています。"}, {"t": 1134.2833333333333, "x": "デッティンガーさんとの共著でも同じです。"}, {"t": 1136.85, "x": "アメリカ地質調査所で水を研究してきた人です。"}, {"t": 1140.1166666666666, "x": "ただし、この数字には注意が必要です。"}, {"t": 1143.3666666666666, "x": "いつから数えるのかが、資料によって違うからです。"}, {"t": 1146.85, "x": "イングラムさんの文章では、"}, {"t": 1148.6, "x": "嵐の始まりは1861年12月です。"}, {"t": 1152.4166666666667, "x": "一方、ブルワーの手紙は違います。"}, {"t": 1155.2333333333333, "x": "サンフランシスコの最初の雨は11月6日です。"}, {"t": 1158.6833333333334, "x": "ロサンゼルスについては28日間という数字が出てきます。"}, {"t": 1162.5833333333333, "x": "雨は場所ごとに違う日に始まりました。"}, {"t": 1165.1, "x": "弱まった日も、場所ごとに違いました。"}, {"t": 1167.9, "x": "そこで、この番組では43日を目安の数字として扱います。"}, {"t": 1172.7666666666667, "x": "降りはじめから終わりまでを、"}, {"t": 1174.3, "x": "一つの数字で言い切ることはしません。"}, {"t": 1176.9333333333334, "x": "雨量の数字も同じです。サンフランシスコの"}, {"t": 1180.0333333333333, "x": "雨量計は、町の一か所の記録です。"}, {"t": 1182.5166666666667, "x": "ソノラの数字は、山のふもとの町の記録です。"}, {"t": 1185.9, "x": "谷全体にどれだけの水が降ったのか。"}, {"t": 1188.3833333333334, "x": "それを直接はかった記録はありません。"}, {"t": 1190.85, "x": "分かっていることもあります。"}, {"t": 1192.5, "x": "記録のあった場所は、どこも桁外れでした。"}, {"t": 1195.45, "x": "そしてその水はみな、出口の"}, {"t": 1197.8, "x": "一つしかない谷へ集まりました。"}, {"t": 1199.75, "x": "山に降った雨は川になりました。"}, {"t": 1201.9833333333333, "x": "山に積もった雪も、やがてとけて流れ下りました。"}, {"t": 1205.4666666666667, "x": "谷は、その全部を受けとめる鉢のような形をしていました。"}, {"t": 1209.4166666666667, "x": "鉢の口にあたるのは、サンフランシスコ湾へ"}, {"t": 1212.4, "x": "抜ける狭い水路だけです。入ってくる水が、"}, {"t": 1215.4333333333334, "x": "出ていく水をはるかに上回りました。"}, {"t": 1218.0, "x": "それが、何か月も水が引かなかった"}, {"t": 1220.6666666666667, "x": "理由の一つと考えられます。"}, {"t": 1222.4666666666667, "x": "これほどの雨は、どこから来たのでしょうか。"}, {"t": 1225.3, "x": "1862年には天気図も気象衛星もありませんでした。"}, {"t": 1229.55, "x": "空の上で何が起きていたのかを、直接見た人はいません。"}, {"t": 1233.5333333333333, "x": "手がかりになるのは、ずっとあとに見つかった現象です。"}, {"t": 1237.1333333333334, "x": "大気の川と呼ばれるものです。"}, {"t": 1239.05, "x": "アメリカ海洋大気庁が説明しています。"}, {"t": 1241.8166666666666, "x": "大気の川は、空の中の細長い帯です。"}, {"t": 1245.0166666666667, "x": "水蒸気がまとまって流れていく帯です。"}, {"t": 1247.65, "x": "熱帯の外では、運ばれる水蒸気の大半を"}, {"t": 1250.8833333333334, "x": "この帯が受け持っています。"}, {"t": 1252.4666666666667, "x": "ふつうの大気の川でも、運ぶ水の量は大きなものです。"}, {"t": 1256.3166666666666, "x": "ミシシッピ川の河口を流れる"}, {"t": 1258.1833333333334, "x": "水の量と、ほぼ同じだといいます。"}, {"t": 1260.65, "x": "とくに強いものは、その15倍に"}, {"t": 1263.0333333333333, "x": "達することもあるとされます。"}, {"t": 1264.7166666666667, "x": "ハワイの近くから湿った空気を運ぶ、強い帯もあります。"}, {"t": 1268.8, "x": "パイナップル・エクスプレスというあだ名で"}, {"t": 1270.9666666666667, "x": "呼ばれています。この帯が山に"}, {"t": 1272.9833333333333, "x": "ぶつかると、空気は斜面をのぼります。"}, {"t": 1275.5833333333333, "x": "のぼった空気は冷えます。すると"}, {"t": 1277.8166666666666, "x": "水蒸気が雨や雪に変わります。"}, {"t": 1279.9, "x": "カリフォルニアでは、海岸山脈と"}, {"t": 1282.4333333333334, "x": "シエラネバダがその壁になります。"}, {"t": 1284.4166666666667, "x": "2011年に、デッティンガーさんたちが"}, {"t": 1287.4166666666667, "x": "論文を出しています。この帯の重みを示した論文です。"}, {"t": 1291.1166666666666, "x": "カリフォルニアの雨の降りかたは独特です。"}, {"t": 1293.7666666666667, "x": "一年の雨の大半が、わずか5日から15日で降ります。"}, {"t": 1298.0166666666667, "x": "大きな嵐が来るかどうかで、年の運命が変わります。"}, {"t": 1301.8333333333333, "x": "豊かな年にも、干ばつの年にもなるのです。"}, {"t": 1305.0166666666667, "x": "3日間の雨量では、ハリケーンの"}, {"t": 1307.3833333333334, "x": "通り道にも並ぶといいます。"}, {"t": 1309.2333333333333, "x": "アメリカ南東部の、あの嵐の多い地域です。"}, {"t": 1312.6, "x": "そして大きな嵐の多くは、大気の川が"}, {"t": 1315.6333333333334, "x": "上陸したときに起きています。"}, {"t": 1317.3833333333334, "x": "州の降水と川の流れのうち、"}, {"t": 1319.55, "x": "2割から5割が大気の川によるものです。"}, {"t": 1322.6166666666666, "x": "論文は、州の水の恵みと洪水が"}, {"t": 1325.4, "x": "同じ嵐から来ているとも述べています。"}, {"t": 1327.65, "x": "では、1862年の雨は大気の川だったのか。"}, {"t": 1331.7833333333333, "x": "アメリカ地質調査所が紹介する"}, {"t": 1333.8666666666666, "x": "二人の文章は、こう書いています。"}, {"t": 1336.3833333333334, "x": "こうした大洪水は、大気の川が原因だった可能性が高い。"}, {"t": 1340.7166666666667, "x": "雨の山が何度も来たことは、手紙からも分かります。"}, {"t": 1344.35, "x": "水が引きかけては、また上がりました。"}, {"t": 1346.95, "x": "3月になっても、また激しい雨が降っています。"}, {"t": 1350.55, "x": "大気の川が、何度も続けてやってきたのではないか。"}, {"t": 1354.05, "x": "これが、いまの有力な説です。"}, {"t": 1356.5833333333333, "x": "ただし、これは当時の観測で"}, {"t": 1359.0, "x": "確かめられたものではありません。"}, {"t": 1360.8666666666666, "x": "雨の降りかたと広がりかたが、"}, {"t": 1362.8166666666666, "x": "いまの大気の川とよく似ている。"}, {"t": 1365.05, "x": "そのことから筋道を立てて考えたものです。"}, {"t": 1367.9333333333334, "x": "この番組では、大気の川説を有力説として扱います。"}, {"t": 1372.2333333333333, "x": "空の上の帯そのものは、誰の目にも見えませんでした。"}, {"t": 1376.0833333333333, "x": "ブルワーが見たのは、帯が落としていった水だけです。"}, {"t": 1379.5666666666666, "x": "では、この冬の雨は一度きりの出来事だったのでしょうか。"}, {"t": 1383.5, "x": "それを調べる手がかりが、海の底と"}, {"t": 1386.15, "x": "川ぞいの土の中にあります。"}, {"t": 1387.9833333333333, "x": "カリフォルニアの南に、サンタバーバラ沖の"}, {"t": 1390.85, "x": "海盆があります。海の底の深いくぼ地です。"}, {"t": 1393.7833333333333, "x": "そこでは泥が年ごとの縞になって積もっています。"}, {"t": 1396.8666666666666, "x": "研究者は、この縞を一枚ずつ数えて年代を決めます。"}, {"t": 1400.9333333333334, "x": "縞のあいだには、ときどき灰色の層がはさまっています。"}, {"t": 1404.7666666666667, "x": "陸から一度にたくさん流れてきた、細かい泥の層です。"}, {"t": 1408.65, "x": "シメルマンさんたちは1998年に、"}, {"t": 1411.7333333333333, "x": "この灰色の層を調べました。"}, {"t": 1413.9833333333333, "x": "厚さ1センチから2センチの層が見つかりました。"}, {"t": 1417.0166666666667, "x": "縞を数えると、西暦1605年ごろに積もったものでした。"}, {"t": 1421.4333333333334, "x": "論文の見立てでは、過去1000年で並ぶものがありません。"}, {"t": 1425.2166666666667, "x": "それほどの雨と洪水だったというのです。"}, {"t": 1427.7833333333333, "x": "同じころの別の手がかりもあります。"}, {"t": 1430.0, "x": "300キロ東のモハーベ砂漠です。"}, {"t": 1432.6, "x": "ふだんは干上がっている場所です。"}, {"t": 1434.6, "x": "そこに水をたたえた湖があったらしいのです。"}, {"t": 1437.7, "x": "その地方の木の年輪も、雨の多い"}, {"t": 1440.3333333333333, "x": "寒い時期を示していました。"}, {"t": 1442.0166666666667, "x": "2003年の論文では、さらに長い期間を見ています。"}, {"t": 1445.95, "x": "過去2000年の泥を調べたものです。"}, {"t": 1448.2833333333333, "x": "同じような灰色の層が、何枚も見つかりました。"}, {"t": 1451.7666666666667, "x": "年代は西暦212年、440年、603年。"}, {"t": 1456.9833333333333, "x": "そして1029年、1418年、1605年ごろです。"}, {"t": 1462.5833333333333, "x": "研究者はその間隔に目をつけました。こうした大洪水は、"}, {"t": 1466.5166666666667, "x": "およそ200年ごとに来ていたと見ています。"}, {"t": 1469.3333333333333, "x": "論文は、その原因についても考えを出しています。"}, {"t": 1473.05, "x": "440年と1418年の洪水は、ある時期に重なる。"}, {"t": 1478.0, "x": "地球規模で、大気の流れが組みかわった時期だ。"}, {"t": 1481.25, "x": "1029年と1605年には、寒さもいっしょに来たようだ。"}, {"t": 1485.8166666666666, "x": "200年ほどの周期は、太陽の活動の波と"}, {"t": 1489.2, "x": "関係があるのではないか、と。"}, {"t": 1491.45, "x": "ただし、太陽との関係は一つの考えにとどまります。"}, {"t": 1495.5166666666667, "x": "この番組では、洪水の年代の記録と、"}, {"t": 1498.5, "x": "原因の考えを分けて扱います。"}, {"t": 1501.1833333333334, "x": "陸の上にも記録はあります。"}, {"t": 1503.1166666666666, "x": "2007年に、過去の記録をまとめた研究があります。"}, {"t": 1507.0166666666667, "x": "マラムード・ロームさんたちによるものです。"}, {"t": 1509.35, "x": "そのなかに、サクラメント川ぞいの"}, {"t": 1511.85, "x": "土を調べた研究があります。"}, {"t": 1513.8333333333333, "x": "いちばん大きな洪水は、1555年から"}, {"t": 1517.3166666666666, "x": "1615年のあいだにありました。"}, {"t": 1519.7, "x": "そのあとも、1750年ごろと"}, {"t": 1522.4833333333333, "x": "1810年ごろに洪水の跡が続きます。"}, {"t": 1525.5166666666667, "x": "そして1861年の、記録に残る洪水です。"}, {"t": 1529.6833333333334, "x": "アメリカン川を調べた研究もあります。"}, {"t": 1532.3333333333333, "x": "1300年から1800年のあいだに、"}, {"t": 1535.1, "x": "大きな洪水が三度ありました。"}, {"t": 1537.4333333333334, "x": "どれも、記録に残る洪水より大きかったとされます。"}, {"t": 1541.15, "x": "2024年には、北カリフォルニアの"}, {"t": 1543.9, "x": "湖の泥を調べた論文も出ました。"}, {"t": 1546.2833333333333, "x": "過去3200年ほどの嵐の強さを読み取ったものです。"}, {"t": 1549.9833333333333, "x": "手がかりは、泥にふくまれる成分でした。"}, {"t": 1552.85, "x": "論文によると、過去には今より雨の多い時期がありました。"}, {"t": 1556.8333333333333, "x": "観測が始まってからの、どの時期よりも"}, {"t": 1559.6, "x": "多かったといいます。まとめると、こう言えます。"}, {"t": 1562.7666666666667, "x": "1862年の大洪水は、記録に"}, {"t": 1566.0666666666666, "x": "残るなかではとびぬけた出来事でした。"}, {"t": 1568.3, "x": "けれども、ただ一度きりではありませんでした。"}, {"t": 1571.3, "x": "土と泥の記録が、そう語っています。"}, {"t": 1574.15, "x": "どのくらいの間隔で来たのかは、まだ割れています。"}, {"t": 1577.4666666666667, "x": "100年から200年ごとという言い方もあります。"}, {"t": 1580.4666666666667, "x": "およそ200年ごとという言い方もあります。"}, {"t": 1583.1166666666666, "x": "川ごとに、海盆ごとに、記録の読みかたが違うからです。"}, {"t": 1587.4333333333334, "x": "マラムード・ロームさんたちは、こうも書いています。"}, {"t": 1590.5833333333333, "x": "1850年からあとのカリフォルニアの"}, {"t": 1593.1833333333334, "x": "気候は、珍しくおだやかだった。"}, {"t": 1595.6, "x": "それまでの2000年あまりとくらべると、という意味です。"}, {"t": 1599.2666666666667, "x": "人が谷に町をつくった時代です。"}, {"t": 1601.6, "x": "それは、たまたま静かな時代だったのかもしれません。"}, {"t": 1605.0666666666666, "x": "ここで、この回の話を確かさの順に分けておきます。"}, {"t": 1608.85, "x": "まず確かなことです。1861年から62年の冬、"}, {"t": 1613.3166666666666, "x": "カリフォルニアに長い雨が降りました。"}, {"t": 1615.8833333333334, "x": "セントラル・バレーは広く水につかりました。"}, {"t": 1618.5166666666667, "x": "長さ400キロをこえる湖のようになりました。"}, {"t": 1621.7666666666667, "x": "州都サクラメントは水に沈みました。"}, {"t": 1624.2833333333333, "x": "州の議会はサンフランシスコへ移りました。"}, {"t": 1627.0833333333333, "x": "これらは、ブルワーの手紙と"}, {"t": 1629.0166666666667, "x": "州の記録の両方に書かれています。"}, {"t": 1631.25, "x": "サンフランシスコの雨量計も、"}, {"t": 1633.2, "x": "はっきりした数字を残しました。"}, {"t": 1635.4833333333333, "x": "記録が始まってからいちばん多い一年です。"}, {"t": 1638.3666666666666, "x": "次に有力なことです。雨をもたらしたのは、"}, {"t": 1641.45, "x": "大気の川だと考えられています。"}, {"t": 1643.7666666666667, "x": "それが続けてやってきた、という見かたです。"}, {"t": 1646.85, "x": "同じような大洪水がくり返してきたことも、有力です。"}, {"t": 1650.7166666666667, "x": "間隔は二百年ほど、という見かたです。"}, {"t": 1653.75, "x": "どちらも、いまの研究者の多くが支持する考えです。"}, {"t": 1657.5833333333333, "x": "けれども1862年の空を直接はかった記録はありません。"}, {"t": 1661.9333333333334, "x": "そして、まだ割れていることです。"}, {"t": 1664.2833333333333, "x": "雨が何日続いたのか。43日という数字はよく引かれます。"}, {"t": 1668.8333333333333, "x": "けれども、どこから数えるかで変わります。"}, {"t": 1671.6666666666667, "x": "谷全体にどれだけの雨が降ったのかも、"}, {"t": 1674.1666666666667, "x": "はかった記録はありません。"}, {"t": 1676.0, "x": "亡くなった人の数は、資料によって幅が大きいままです。"}, {"t": 1680.05, "x": "元の記録は、たどれていません。"}, {"t": 1682.4333333333334, "x": "同じ規模の洪水がどのくらいの"}, {"t": 1684.2666666666667, "x": "間隔で来たのかも、記録によって違います。"}, {"t": 1687.3166666666666, "x": "この番組では、確かなことは"}, {"t": 1689.4833333333333, "x": "確かなこととして語ってきました。"}, {"t": 1691.4, "x": "有力な説は、有力な説として名前を出して伝えました。"}, {"t": 1695.4666666666667, "x": "割れている数字は、一つに決めずに"}, {"t": 1697.85, "x": "幅のまま置いておきます。ブルワーは"}, {"t": 1700.0166666666667, "x": "気象の学者ではありませんでした。"}, {"t": 1702.05, "x": "それでも彼は、雨量を数字で"}, {"t": 1704.2833333333333, "x": "書き、場所と日付を添えました。"}, {"t": 1706.6166666666666, "x": "だからこそ、いまの研究者も、"}, {"t": 1708.9333333333334, "x": "その数字を確かめ直すことができるのです。"}, {"t": 1711.9, "x": "1862年6月。ブルワーはふたたび野外の調べに出ました。"}, {"t": 1716.5166666666667, "x": "向かったのはサンホアキン川の西側の平地です。"}, {"t": 1719.65, "x": "冬のあいだ、谷の多くが水の下にあった土地です。"}, {"t": 1723.1833333333334, "x": "6月になっても、川の渡し舟はまだ動いていませんでした。"}, {"t": 1727.4, "x": "川上130キロ近くまで、どの渡しも"}, {"t": 1730.6666666666667, "x": "使えなかったといいます。ある朝、"}, {"t": 1732.8833333333334, "x": "ブルワーは平地をながめて書きました。"}, {"t": 1735.3666666666666, "x": "平地は海のように見えた。いや、"}, {"t": 1737.8166666666666, "x": "大きな入り江のように見えた、と。"}, {"t": 1740.4333333333334, "x": "その日、平地の上にはしんきろうが揺れていました。"}, {"t": 1743.85, "x": "本物の水は、すでに引いていました。"}, {"t": 1746.5666666666666, "x": "近くの谷には、冬の水の跡が残っていました。"}, {"t": 1750.0333333333333, "x": "川のような激流が谷を下り、道を壊していったのです。"}, {"t": 1754.0833333333333, "x": "6月19日、一行はある牧場で野営しました。"}, {"t": 1757.8833333333334, "x": "その日の気温は、一日じゅう35度から39度でした。"}, {"t": 1762.3166666666666, "x": "サンルイス・ゴンザーガという牧場です。"}, {"t": 1764.8333333333333, "x": "牧場のまわりには、緑の牧草地が広がっていました。"}, {"t": 1768.6, "x": "二年後の1864年5月。ブルワーは同じ道を通りました。"}, {"t": 1773.3666666666666, "x": "その日の気温は36度でした。"}, {"t": 1775.7, "x": "空気は焼けつくようで、ほこりが舞っていました。"}, {"t": 1778.8, "x": "豊かなはずの谷で、収穫は4分の"}, {"t": 1781.65, "x": "1にも届かない見込みでした。"}, {"t": 1783.35, "x": "同じ牧場に着いた彼は、こう書いています。"}, {"t": 1786.4833333333333, "x": "二年前に野営したとき、ここには緑の牧草地があった。"}, {"t": 1790.4833333333333, "x": "いまは乾いた、ほこりだらけの、むき出しの地面しかない。"}, {"t": 1794.4333333333334, "x": "家の裏のわずかな水たまりのそばで、"}, {"t": 1796.6833333333334, "x": "300頭の牛が死んでいた。"}, {"t": 1798.9, "x": "この牧場は、かつて1万頭の牛を飼っていました。"}, {"t": 1802.5333333333333, "x": "二年前には1万6000頭の羊を飼っていました。"}, {"t": 1805.8666666666666, "x": "それがこの年は、羊を1000頭養えるかどうかでした。"}, {"t": 1809.7666666666667, "x": "最後に残った牛は、およそ1000頭でした。"}, {"t": 1812.9833333333333, "x": "その牛は、1頭わずか1ドル50セントで売られました。"}, {"t": 1816.9166666666667, "x": "途中の谷でも、何百頭もの牛が"}, {"t": 1819.55, "x": "死んでいるのを彼は見ています。"}, {"t": 1821.35, "x": "注の表で、この年の雨を見てみます。"}, {"t": 1824.3, "x": "1863年7月から64年6月までの一年です。"}, {"t": 1828.9666666666667, "x": "サンフランシスコの雨は、およそ26センチでした。"}, {"t": 1832.6666666666667, "x": "ならした一年の、半分にも届きません。"}, {"t": 1835.6666666666667, "x": "大洪水の冬の、およそ5分の1です。"}, {"t": 1838.7333333333333, "x": "牧場の土地は200平方キロに近い広さでした。"}, {"t": 1842.1166666666666, "x": "その広い土地の上を、強い風が"}, {"t": 1844.6, "x": "ほこりを巻き上げて吹いていました。"}, {"t": 1846.5166666666667, "x": "料理をしても、食べる前に砂が積もりました。"}, {"t": 1849.9, "x": "色も分からなくなるほどだったといいます。"}, {"t": 1852.2833333333333, "x": "二年前、同じ谷には水が広がっていました。"}, {"t": 1855.7333333333333, "x": "片側の山から反対側の丘まで、すべてが水でした。"}, {"t": 1859.75, "x": "波が立ち、農家の家を打ちくだいていました。"}, {"t": 1862.9166666666667, "x": "その同じ谷で、いまは飲み水にも困っていました。"}, {"t": 1866.4333333333334, "x": "ブ const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
