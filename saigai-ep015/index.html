<script>
const D={"name": "ep015", "file": "ep015", "dur": 2062.1833125, "segs": [], "subs": [{"t": 0.0, "x": "太平洋と大西洋は、つながっていました。"}, {"t": 3.1, "x": "南北アメリカ大陸のあいだに、海の道が開いていたのです。"}, {"t": 7.4, "x": "赤道に近いその道を通って、太平洋の水は、"}, {"t": 11.2, "x": "カリブ海へ流れこんでいました。"}, {"t": 13.433333333333334, "x": "いま、そこには陸があります。"}, {"t": 15.7, "x": "パナマ地峡█"}, {"t": 15.7, "x": "パナマ地峡と呼ばれる、細長い陸地です。"}, {"t": 19.383333333333333, "x": "この陸が、二つの大洋を、最後まで"}, {"t": 22.566666666666666, "x": "仕切り終えたのはいつか。多くの研究が示してきたのは、"}, {"t": 26.4, "x": "およそ300万年前という数字です。"}, {"t": 27.2, "x": "300万年前█"}, {"t": 29.85, "x": "2016年に三十五人の研究者がまとめた総説は、"}, {"t": 34.3, "x": "それを280万年前ごろと絞りこみました。"}, {"t": 34.983333333333334, "x": "280万年前█"}, {"t": 38.333333333333336, "x": "海の道がふさがると、二つの"}, {"t": 40.583333333333336, "x": "海は別々の道を歩きはじめます。"}, {"t": 42.916666666666664, "x": "大西洋は、太平洋よりも塩辛い海になりました。"}, {"t": 46.81666666666667, "x": "海の流れが組み替えられ、北大西洋へ"}, {"t": 49.766666666666666, "x": "運ばれる水の性質が変わりました。"}, {"t": 52.016666666666666, "x": "そして、ほぼ同じころ、北半球では"}, {"t": 55.0, "x": "大きな氷床が広がりはじめます。"}, {"t": 57.15, "x": "氷期と、あたたかい時期とが、"}, {"t": 59.266666666666666, "x": "何十回も入れ替わる時代の始まりです。"}, {"t": 62.06666666666667, "x": "陸ができたから、北が凍ったのか。"}, {"t": 64.71666666666667, "x": "それとも、たまたま同じころに起きただけなのか。"}, {"t": 67.98333333333333, "x": "先に、断っておくことがあります。"}, {"t": 70.66666666666667, "x": "この問いには、まだ決着がついていません。"}, {"t": 73.63333333333334, "x": "さらに、地峡が閉じた時期そのものについても、"}, {"t": 76.76666666666667, "x": "はるかに古いとする研究者たちがいます。"}, {"t": 79.55, "x": "一千五百万年ほど前には、すでに海の"}, {"t": 82.63333333333334, "x": "道は消えていた、という説です。"}, {"t": 85.05, "x": "この回では、どちらの論争も、定説と、"}, {"t": 88.46666666666667, "x": "有力説と、少数説とに分けて扱います。主役は、海です。"}, {"t": 94.03333333333333, "x": "二つの海が引き離されたとき、水の中で何が"}, {"t": 97.38333333333334, "x": "変わり、その変化がどこまで届いたのか。"}, {"t": 100.28333333333333, "x": "それを、深い海の泥と、パナマの"}, {"t": 103.05, "x": "地層に残った記録から、順にたどります。"}, {"t": 105.9, "x": "パナマの陸は、ある日突然、"}, {"t": 108.1, "x": "海から現れたわけではありません。"}, {"t": 110.65, "x": "始まりは、火山の島の列でした。"}, {"t": 113.25, "x": "話は、恐竜がまだ生きていた時代にさかのぼります。"}, {"t": 116.93333333333334, "x": "およそ7300万年前、のちにパナマの"}, {"t": 117.48333333333333, "x": "7300万年前█"}, {"t": 120.56666666666666, "x": "土台となる火山の列が、でき始めました。"}, {"t": 123.73333333333333, "x": "火山の列は、海の底の岩の板が、"}, {"t": 126.61666666666666, "x": "別の板の下へ沈みこむ場所にできます。"}, {"t": 129.43333333333334, "x": "沈みこんだ板の深いところで岩が溶け、"}, {"t": 131.98333333333332, "x": "そのマグマが地表へ上がってくるからです。"}, {"t": 134.75, "x": "地球の表面は、何枚もの岩の板に分かれています。"}, {"t": 138.58333333333334, "x": "カリブ海の下にある板は、カリブプレートと"}, {"t": 140.46666666666667, "x": "カリブプレート█"}, {"t": 141.93333333333334, "x": "呼ばれています。この板は、太平洋の側から"}, {"t": 145.05, "x": "東へ向かって動いてきました。"}, {"t": 147.23333333333332, "x": "現在の位置にたどり着いたのは、"}, {"t": 149.16666666666666, "x": "およそ五千万年前とされます。"}, {"t": 151.58333333333334, "x": "その西の縁にあたる火山の列は、"}, {"t": 153.83333333333334, "x": "しばらくのあいだ、海に浮かぶ島々でした。"}, {"t": 157.3, "x": "島と島のすきまを通って、太平洋の水が、"}, {"t": 160.75, "x": "カリブ海へ流れこんでいました。"}, {"t": 162.98333333333332, "x": "一部の島は、かなり早い時期から、海面の"}, {"t": 166.5, "x": "上に顔を出していたと考えられています。"}, {"t": 168.91666666666666, "x": "いまの運河の周辺の地層からは、サンゴ礁や、"}, {"t": 172.3, "x": "マングローブの林の跡が見つかっています。"}, {"t": 175.25, "x": "川の河口にたまった砂の地層も出てきます。"}, {"t": 178.0, "x": "少なくとも三千万年前には、陸になっていた"}, {"t": 181.31666666666666, "x": "場所があったということです。"}, {"t": 182.86666666666667, "x": "ところが、陸がところどころにあっても、"}, {"t": 185.43333333333334, "x": "海の道はふさがりません。島の列の"}, {"t": 188.15, "x": "すきまは、深く、そして広かったからです。"}, {"t": 191.53333333333333, "x": "次の転機は、およそ2400万年前に訪れます。"}, {"t": 193.66666666666666, "x": "2400万年前█"}, {"t": 196.73333333333332, "x": "東へ進んできた火山の列が、南アメリカ大陸の"}, {"t": 200.51666666666668, "x": "北西の端に、ぶつかりはじめたのです。"}, {"t": 203.23333333333332, "x": "ただし、この衝突は、はじめは海の中で起きていました。"}, {"t": 207.55, "x": "陸と陸がぶつかったのではなく、"}, {"t": 209.41666666666666, "x": "水面下の岩の塊どうしが押し合ったのです。"}, {"t": 212.66666666666666, "x": "それでも、この衝突の跡は、岩に残っています。"}, {"t": 216.7, "x": "パナマの運河地帯では、2400万年前ごろに、"}, {"t": 218.56666666666666, "x": "2400万年前█"}, {"t": 220.7, "x": "火山から出るマグマの性質が変わりました。"}, {"t": 223.85, "x": "それまでとは違う、地面が引き裂かれる場所に"}, {"t": 226.86666666666667, "x": "特有のマグマが出てくるようになったのです。"}, {"t": 229.36666666666667, "x": "研究者たちは、これを、南米にぶつかった衝撃で"}, {"t": 233.28333333333333, "x": "火山の列が割れはじめた跡と読んでいます。"}, {"t": 235.85, "x": "押し合いは、そこで終わりませんでした。"}, {"t": 238.55, "x": "衝突は、この時から現在まで、"}, {"t": 241.18333333333334, "x": "ずっと続いているとされます。"}, {"t": 243.21666666666667, "x": "パナマの陸を持ち上げてきたのは、二千万年以上に"}, {"t": 246.63333333333333, "x": "わたって続く、この押し合いの力です。"}, {"t": 249.38333333333333, "x": "ただし、押し合いが始まってから、海の道が"}, {"t": 252.96666666666667, "x": "本当に閉じるまでには、長い時間がかかりました。"}, {"t": 256.31666666666666, "x": "その時間の長さこそが、のちに"}, {"t": 258.6666666666667, "x": "大きな論争を生むことになります。"}, {"t": 260.71666666666664, "x": "百五十年ほど前、博物学者たちは、"}, {"t": 263.73333333333335, "x": "ある事実に気づいていました。"}, {"t": 265.73333333333335, "x": "パナマの陸をはさんだ両側の海に、よく似た"}, {"t": 268.9166666666667, "x": "海の生き物が暮らしていることです。"}, {"t": 270.93333333333334, "x": "そこから彼らは、太平洋とカリブ海のあいだに、"}, {"t": 274.3, "x": "かつて海の道があったと考えました。"}, {"t": 276.93333333333334, "x": "陸の両側の海は、昔は一つだった、ということです。"}, {"t": 281.25, "x": "では、その海の道は、どう閉じていったのか。"}, {"t": 284.73333333333335, "x": "海の道がふさがる、と言っても、"}, {"t": 287.1333333333333, "x": "一度に閉じるわけではありません。閉じる順番があります。"}, {"t": 291.05, "x": "まず、深いところから閉じていきます。"}, {"t": 293.85, "x": "海の底が浅くなるにつれて、深い水は越えられなくなり、"}, {"t": 297.65, "x": "表面の水だけが行き来できるようになるからです。"}, {"t": 301.0, "x": "二つの海のあいだにある、いちばん浅い"}, {"t": 304.1166666666667, "x": "部分の底を、敷居と呼びます。"}, {"t": 305.35, "x": "敷居█"}, {"t": 306.8, "x": "ドアの下の敷居と同じで、この高さより"}, {"t": 309.6, "x": "下の水は、向こう側へ行けません。"}, {"t": 312.05, "x": "パナマの海の道で、深い水の行き来が止まったのはいつか。"}, {"t": 315.9, "x": "手がかりは、深い海の底の泥にあります。"}, {"t": 318.93333333333334, "x": "一つは、ネオジムという元素です。"}, {"t": 321.5, "x": "ネオジムには、重さがわずかに違う原子が何種類かあり、"}, {"t": 325.3666666666667, "x": "その割合は、海ごとに少しずつ違っています。"}, {"t": 329.1666666666667, "x": "海の底にたまった魚の歯や、小さな殻の化石には、"}, {"t": 333.0, "x": "そのときの海水の割合が写し取られます。"}, {"t": 335.93333333333334, "x": "カリブ海と太平洋で、この割合が食い違いはじめた"}, {"t": 339.6166666666667, "x": "時期が、深い水の行き来が止まった時期です。"}, {"t": 342.55, "x": "もう一つは、海の底に暮らしていた有孔虫という"}, {"t": 346.06666666666666, "x": "小さな生き物の殻に残る、炭素の同位体です。"}, {"t": 349.5, "x": "こちらも、カリブ海と太平洋とで、差が開いていきました。"}, {"t": 353.8666666666667, "x": "2016年の総説は、こうした記録を"}, {"t": 356.9, "x": "並べて、一つの結論を出しています。"}, {"t": 359.6, "x": "深い水のつながりが断たれたのは、1200万年前から"}, {"t": 362.8666666666667, "x": "1200万年前█"}, {"t": 364.3833333333333, "x": "920万年前のあいだ、というものです。"}, {"t": 364.7, "x": "920万年前█"}, {"t": 368.56666666666666, "x": "そのころ、敷居のいちばん深い部分は、深さ"}, {"t": 372.0, "x": "千八百メートルより浅くなっていました。"}, {"t": 374.43333333333334, "x": "浅ければ、千二百メートルほどだったかも"}, {"t": 377.3, "x": "しれない、とされます。それまでは、二つの海のあいだに、"}, {"t": 381.43333333333334, "x": "千二百メートルより深い海峡がありました。"}, {"t": 384.55, "x": "深い水が大量に行き来できる、大きな道です。"}, {"t": 388.0, "x": "それが、九百万年あまり前には、深い水の"}, {"t": 391.71666666666664, "x": "通れない道になっていたということです。"}, {"t": 393.9166666666667, "x": "ただし、ここで海の道が閉じたわけではありません。"}, {"t": 397.45, "x": "敷居が千メートルを超える深さなら、"}, {"t": 399.81666666666666, "x": "深い水こそ止まります。けれども、表面から中ほどまでの"}, {"t": 404.06666666666666, "x": "水は、まだ自由に流れています。"}, {"t": 406.5, "x": "1982年、アメリカの研究者ロイド・"}, {"t": 410.06666666666666, "x": "ケイグウィンは、深海掘削で得た泥を比べました。"}, {"t": 413.51666666666665, "x": "カリブ海の西の地点と、太平洋の東の地点です。"}, {"t": 417.53333333333336, "x": "すると、炭素の同位体の差は、"}, {"t": 419.81666666666666, "x": "およそ六百万年前に、いったん広がっていました。"}, {"t": 423.6166666666667, "x": "そして、およそ三百万年前にもう一度広がり、"}, {"t": 427.21666666666664, "x": "いまと同じ水準に達していたのです。"}, {"t": 429.95, "x": "海の道は、一度にではなく、"}, {"t": 432.23333333333335, "x": "段階を追って細っていったのです。"}, {"t": 434.8, "x": "深い水が先に止まり、表面の水が最後まで残る。"}, {"t": 438.75, "x": "この順番は、あとで出てくる論争を"}, {"t": 441.35, "x": "読み解くうえで、大事な鍵になります。"}, {"t": 444.01666666666665, "x": "どの深さの水が止まったときを「閉じた」と呼ぶのか。"}, {"t": 447.8833333333333, "x": "その呼び方の違いが、研究者どうしの"}, {"t": 450.7, "x": "答えの違いにつながっているからです。"}, {"t": 452.9166666666667, "x": "深い水が止まったあと、陸は"}, {"t": 455.1, "x": "まっすぐ上がり続けたわけではありません。"}, {"t": 457.51666666666665, "x": "ここで、話が一度逆向きになります。"}, {"t": 460.35, "x": "900万年前█"}, {"t": 460.35, "x": "900万年前から600万年前にかけて、"}, {"t": 461.9166666666667, "x": "600万年前█"}, {"t": ": "1300万年前█"}, {"t": 1286.8166666666666, "x": "260万年前█"}, {"t": 1287.3333333333333, "x": "260万年前にかけて、少しずつ閉じていったとされます。"}, {"t": 1292.4166666666667, "x": "パナマの細い陸が、遠く離れたグリーンランドや"}, {"t": 1295.65, "x": "北アメリカの氷を育てた、という筋書きです。"}, {"t": 1298.9333333333334, "x": "二つの海が分かれたことが、北の果ての氷につながる。"}, {"t": 1302.7, "x": "話としては、とてもよくできています。"}, {"t": 1305.4666666666667, "x": "けれども、この筋書きには、"}, {"t": 1307.55, "x": "一か所、引っかかるところがありました。"}, {"t": 1310.5, "x": "暖かい水を北へ運ぶことが、なぜ、北を"}, {"t": 1314.15, "x": "凍らせることになるのか、という点です。"}, {"t": 1316.85, "x": "北へ運ばれるのは、水蒸気だけではありません。"}, {"t": 1320.1166666666666, "x": "熱も、一緒に運ばれます。メキシコ湾流が"}, {"t": 1323.4666666666667, "x": "強まれば、北大西洋は暖かくなります。"}, {"t": 1326.65, "x": "暖かくなれば、雪は解けやすくなり、"}, {"t": 1329.2666666666667, "x": "氷は育ちにくくなるはずです。"}, {"t": 1331.6166666666666, "x": "雪の材料が増えても、それを解かす熱も増える。"}, {"t": 1335.0666666666666, "x": "この食い違いを、正面から取り上げたのが、"}, {"t": 1338.05, "x": "1998年のもう一本の論文でした。"}, {"t": 1341.7666666666667, "x": "書いたのは、アメリカの研究者ニール・"}, {"t": 1344.3, "x": "ドリスコルと、前の章に出てきたハウグです。"}, {"t": 1347.3, "x": "その論文の書き出しは、率直です。"}, {"t": 1350.1333333333334, "x": "およそ三百万年前の北半球の"}, {"t": 1352.5666666666666, "x": "氷河化の原因は、まだ不確かである。"}, {"t": 1355.2166666666667, "x": "地峡の閉鎖は、北への水蒸気の供給を増やしたが、"}, {"t": 1359.1, "x": "一緒に運ばれた熱は、氷の成長を妨げたはずだ、と。"}, {"t": 1364.0833333333333, "x": "そのうえで、二人は一つの解決案を出しました。"}, {"t": 1367.5166666666667, "x": "北へ運ばれた水蒸気の一部は、"}, {"t": 1369.7333333333333, "x": "ユーラシア大陸に雨や雪として降ります。"}, {"t": 1372.7166666666667, "x": "その水は、シベリアの大きな川を"}, {"t": 1375.2333333333333, "x": "通って、北極海へ流れこみます。"}, {"t": 1377.8666666666666, "x": "北極海に真水が増えると、海の表面が"}, {"t": 1381.0833333333333, "x": "塩辛くなくなり、海氷ができやすくなります。"}, {"t": 1384.3166666666666, "x": "海氷は日の光を跳ね返し、海の熱を空気から切り離します。"}, {"t": 1389.05, "x": "こうして、北の海が冷える仕組みが、暖かい"}, {"t": 1392.4, "x": "流れとは別に働いたのではないか、というのです。"}, {"t": 1395.8166666666666, "x": "2005年には、ドイツなどの研究者たちが、"}, {"t": 1398.9333333333334, "x": "北大西洋の泥から、さらに細かい記録を示しました。"}, {"t": 1403.15, "x": "千年より細かい刻みで、当時の"}, {"t": 1405.7333333333333, "x": "海の表面の変化を追ったものです。"}, {" const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
