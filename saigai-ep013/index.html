<script>
const D={"name": "ep013", "file": "ep013", "dur": 1968.8333125, "segs": [], "subs": [{"t": 0.0, "x": "雨は、ふつう数日でやみます。"}, {"t": 2.5, "x": "長い雨季でも、数か月です。"}, {"t": 4.916666666666667, "x": "ところが、地球の歴史には、雨の多い時代が"}, {"t": 8.483333333333333, "x": "百万年を超えて続いた時期があります。"}, {"t": 10.983333333333333, "x": "いまからおよそ2億3400万年前に"}, {"t": 12.383333333333333, "x": "2億3400万年前█"}, {"t": 14.2, "x": "始まり、およそ2億3200万年前まで。"}, {"t": 18.183333333333334, "x": "地質の時代でいえば、三畳紀の後半、"}, {"t": 21.283333333333335, "x": "カーニアン期█"}, {"t": 21.433333333333334, "x": "カーニアン期の中ごろです。"}, {"t": 23.65, "x": "その前の地球は、乾いていました。"}, {"t": 26.433333333333334, "x": "陸地はほとんど一つにまとまり、その内側には、"}, {"t": 29.916666666666668, "x": "塩の湖と乾いた泥の土地が広がっていました。"}, {"t": 33.266666666666666, "x": "そこへ、川が戻ってきました。"}, {"t": 35.9, "x": "砂漠のあとに、大きな湖ができ、"}, {"t": 38.61666666666667, "x": "海には陸から削られた泥が流れこみました。"}, {"t": 41.81666666666667, "x": "やがて雨の時代は終わり、陸はまた乾いていきます。"}, {"t": 45.5, "x": "この出来事は、カーニアン多雨事象と呼ばれています。"}, {"t": 46.63333333333333, "x": "カーニアン多雨事象█"}, {"t": 49.53333333333333, "x": "ただし、この呼び名には、注意がいります。"}, {"t": 52.95, "x": "二百万年のあいだ、空から雨が一日も休まず"}, {"t": 56.516666666666666, "x": "降り続いた、という意味ではありません。"}, {"t": 59.1, "x": "研究者が地層から読み取ったのは、雨が増えた"}, {"t": 62.4, "x": "時期が、四回ほどあったということです。"}, {"t": 65.1, "x": "乾いた時代の真ん中に、湿った時代がはさまっていた。"}, {"t": 68.86666666666666, "x": "その湿り気が、地球のあちこちの地層に、"}, {"t": 71.86666666666666, "x": "同じころの印として残っている。"}, {"t": 74.18333333333334, "x": "ここから追っていくのは、その印です。"}, {"t": 76.91666666666667, "x": "空の水の回り方が、どう変わったのか。"}, {"t": 79.98333333333333, "x": "雨はどこに跡を残し、人はどうやってそれに気づいたのか。"}, {"t": 83.96666666666667, "x": "そして、その雨を呼んだのは、なんだったのか。"}, {"t": 87.45, "x": "答えの候補は、赤道の海で積み重なった、"}, {"t": 90.68333333333334, "x": "厚さ数キロメートルの溶岩です。"}, {"t": 93.21666666666667, "x": "その溶岩はいま、遠く北のアラスカの山にあります。"}, {"t": 96.96666666666667, "x": "そして、その溶岩と同じ時代の海の"}, {"t": 99.75, "x": "底の岩は、日本の山の中にも眠っています。"}, {"t": 103.05, "x": "赤道の火山、超大陸の川、日本の深い海の岩。"}, {"t": 107.55, "x": "遠く離れた三つの場所が、一つの"}, {"t": 110.03333333333333, "x": "湿った時代で、つながっています。"}, {"t": 112.4, "x": "まず、雨が降る前の地球を見ておきます。"}, {"t": 115.73333333333333, "x": "三畳紀の地球では、大陸の多くが"}, {"t": 118.63333333333334, "x": "一つにつながっていました。"}, {"t": 120.13333333333334, "x": "パンゲア█"}, {"t": 120.13333333333334, "x": "パンゲアと呼ばれる、ひとかたまりの大きな陸です。"}, {"t": 124.0, "x": "陸が一つにまとまると、その真ん中は"}, {"t": 126.71666666666667, "x": "海から非常に遠くなります。"}, {"t": 128.5, "x": "海から来る湿った風は、内陸に届くまでに、"}, {"t": 131.76666666666668, "x": "水気を落としてしまいます。"}, {"t": 133.76666666666668, "x": "そのため、三畳紀の後半は、乾いた土地が"}, {"t": 137.38333333333333, "x": "広く続いた時代だったとされます。"}, {"t": 139.41666666666666, "x": "1989年の論文も、最初にそのことを書いています。"}, {"t": 144.08333333333334, "x": "三畳紀の後半は、広い範囲で乾燥していた時代だった、と。"}, {"t": 149.06666666666666, "x": "その乾き方は、いまのヨーロッパの"}, {"t": 151.6, "x": "地面の下に残っています。イギリスや"}, {"t": 154.0, "x": "ドイツには、この時代の泥の"}, {"t": 155.85, "x": "地層が、厚く重なっているところがあります。"}, {"t": 158.76666666666668, "x": "その泥の多くは、雨の少ない低地の、"}, {"t": 161.71666666666667, "x": "浅い湖の底でたまったものです。"}, {"t": 164.26666666666668, "x": "雨が少し降ると、低い土地に"}, {"t": 166.43333333333334, "x": "水がたまって、平たい湖ができる。"}, {"t": 169.15, "x": "晴れが続くと、その水は干上がり、底に塩と泥が残る。"}, {"t": 173.61666666666667, "x": "こうした湖を、地質学ではプラヤ湖と呼びます。"}, {"t": 176.1, "x": "プラヤ湖█"}, {"t": 178.18333333333334, "x": "いまも、乾いた土地で見ることができる地形です。"}, {"t": 181.55, "x": "三畳紀の後半の泥の地層は、このプラヤ湖の泥が、"}, {"t": 185.35, "x": "何度も何度も重なってできたものとされます。"}, {"t": 188.23333333333332, "x": "ドイツの南部にも、同じころの地層があります。"}, {"t": 191.31666666666666, "x": "こちらも、塩の湖や、内陸の塩原と"}, {"t": 194.91666666666666, "x": "呼ばれる環境でたまった泥が中心です。"}, {"t": 197.48333333333332, "x": "塩原とは、海から離れた低い土地で、地下の"}, {"t": 201.13333333333333, "x": "水が蒸発し、地面に塩が白く残る場所のことです。"}, {"t": 205.05, "x": "川の流れがほとんど無く、水はたまっては消える。"}, {"t": 208.65, "x": "そういう土地が、何百万年ものあいだ、"}, {"t": 211.61666666666667, "x": "同じように続いていました。"}, {"t": 213.6, "x": "つまり、この時代のヨーロッパは、雨の少ない低地でした。"}, {"t": 217.85, "x": "では、その泥の積み重なりは、"}, {"t": 220.2, "x": "ずっと同じ調子で続いていたのか。"}, {"t": 222.68333333333334, "x": "そうではありませんでした。"}, {"t": 224.35, "x": "泥の積み重なりの途中に、まるで別の場所から"}, {"t": 227.58333333333334, "x": "持ってきたような地層が、はさまっていたのです。"}, {"t": 230.45, "x": "それは、砂でした。しかも、ただの砂ではありません。"}, {"t": 234.76666666666668, "x": "流れる水によって運ばれ、下の"}, {"t": 237.35, "x": "泥を削りこんで積もった砂です。"}, {"t": 239.43333333333334, "x": "乾いた湖の泥の列に、突然、川が割りこんでいた。"}, {"t": 243.98333333333332, "x": "この違和感が、雨の時代を見つける入り口になりました。"}, {"t": 247.76666666666668, "x": "1989年、アメリカ地質学会の学術誌"}, {"t": 251.6, "x": "ジオロジー█"}, {"t": 252.63333333333333, "x": "ジオロジーに、四ページの論文が載りました。"}, {"t": 256.0833333333333, "x": "書いたのは、イギリスの二人の地質学者です。"}, {"t": 259.3, "x": "リバプール大学のマイケル・シムズと、"}, {"t": 261.4166666666667, "x": "バーミンガム大学のアラステア・ラッフェル。"}, {"t": 263.96666666666664, "x": "表題は、「三畳紀後期の、気候の変化と絶滅の同時性」。"}, {"t": 268.6333333333333, "x": "二人は、ばらばらに報告されていた"}, {"t": 271.0833333333333, "x": "手がかりを、一つの表に並べました。"}, {"t": 273.65, "x": "どれも、それだけを見れば、ある地域の"}, {"t": 276.68333333333334, "x": "小さな変化にすぎないものでした。"}, {"t": 278.76666666666665, "x": "けれども、時期をそろえて並べると、"}, {"t": 281.21666666666664, "x": "同じ向きを指していたのです。"}, {"t": 283.23333333333335, "x": "一つ目は、さきほどの川の砂岩です。"}, {"t": 286.1, "x": "塩の湖の泥が、底を削りこんだ川の砂岩で途切れている。"}, {"t": 290.56666666666666, "x": "その砂岩は、カーニアン期の後半にあたる地層でした。"}, {"t": 294.3666666666667, "x": "二つ目は、その砂岩の中の、粘土の種類です。"}, {"t": 298.1166666666667, "x": "粘土には、いくつかの種類があります。"}, {"t": 300.8333333333333, "x": "雨が多く、岩が水で強く分解される土地では、"}, {"t": 304.23333333333335, "x": "カオリナイト█"}, {"t": 304.73333333333335, "x": "カオリナイトという粘土ができやすいとされます。"}, {"t": 307.96666666666664, "x": "雨が少ない土地では、別の種類の粘土が多く残ります。"}, {"t": 311.98333333333335, "x": "この砂岩では、カオリナイトの割合が高くなっていました。"}, {"t": 315.78333333333336, "x": "つまり、砂のもとになった岩は、雨の"}, {"t": 318.85, "x": "多い環境で崩されていた、ということです。"}, {"t": 321.8333333333333, "x": "三つ目は、海の地層です。同じ時期の海の地層では、陸から"}, {"t": 326.5, "x": "流れてきた砂や泥の割合が増えていました。"}, {"t": 329.23333333333335, "x": "川が運ぶ土砂が増えれば、その先の海にも、"}, {"t": 332.55, "x": "陸のかけらが多く届きます。"}, {"t": 334.6333333333333, "x": "四つ目は、石灰岩の地域の様子です。"}, {"t": 337.81666666666666, "x": "このころ陸の表面に出ていた石灰岩には、雨水に"}, {"t": 341.56666666666666, "x": "溶かされてできた穴やくぼみがありました。"}, {"t": 343.9, "x": "それも、大きな規模で作られていました。"}, {"t": 346.7, "x": "石灰岩は、雨水にじわじわと溶かされます。"}, {"t": 350.1166666666667, "x": "水が多ければ、その溶け方も大きくなります。"}, {"t": 353.4, "x": "五つ目は、海でできた石灰岩の"}, {"t": 355.9166666666667, "x": "中の、炭素の性質の変化でした。"}, {"t": 358.48333333333335, "x": "これについては、第6章でくわしく見ます。"}, {"t": 361.6166666666667, "x": "さらに二人は、同じ時期に、海と陸で生き物の"}, {"t": 365.35, "x": "顔ぶれが大きく入れ替わっていることにも触れました。"}, {"t": 368.28333333333336, "x": "海では、カーニアン期の前半と中ごろの境目で。"}, {"t": 371.9, "x": "陸では、カーニアン期の終わりに。"}, {"t": 374.3, "x": "湿った時代の始まりと終わりが、それぞれの"}, {"t": 377.35, "x": "入れ替わりと、ほぼ重なっていたのです。"}, {"t": 379.8333333333333, "x": "二人は、この湿った時代を、カーニアン期の"}, {"t": 383.1, "x": "多雨エピソード、と呼びました。"}, {"t": 385.15, "x": "原因については、慎重な書き方をしています。"}, {"t": 388.56666666666666, "x": "一つにまとまっていた大陸が裂け始めたことで、"}, {"t": 391.45, "x": "大気と海の流れが乱れたのではないか。"}, {"t": 394.15, "x": "海面の高さが変わったのではないか。"}, {"t": 396.51666666666665, "x": "裂け目に伴う火山が関わっていたのではないか。"}, {"t": 399.55, "x": "どれも、可能性としての書き方です。"}, {"t": 402.31666666666666, "x": "この段階では、雨を呼んだものは、"}, {"t": 404.8666666666667, "x": "まだ特定されていませんでした。"}, {"t": 407.03333333333336, "x": "翌1990年、二人はロンドン地質学会の"}, {"t": 411.01666666666665, "x": "学術誌に、続きの論文を出しています。"}, {"t": 413.8666666666667, "x": "表題は、「三畳紀後期の、気候と生き物の変化」。"}, {"t": 417.8833333333333, "x": "雨の時代という考えは、ここから、ほかの"}, {"t": 421.0833333333333, "x": "研究者の目にも触れるようになっていきます。"}, {"t": 423.6333333333333, "x": "新しい考えは、すぐには受け入れられませんでした。"}, {"t": 427.21666666666664, "x": "1994年、別の研究班が、"}, {"t": 430.65, "x": "はっきりとした表題の論文を出しています。"}, {"t": 433.6166666666667, "x": "「ヨーロッパにおける、カーニアン期の多雨事象の否定」。"}, {"t": 437.1166666666667, "x": "書いたのは、花粉や胞子の化石を調べる研究者たちでした。"}, {"t": 441.3666666666667, "x": "植物の花粉や胞子は、とても小さく、"}, {"t": 444.45, "x": "丈夫で、地層の中によく残ります。"}, {"t": 447.48333333333335, "x": "どんな植物が生えていたかが分かれば、そこが"}, {"t": 450.5, "x": "湿っていたか乾いていたかの手がかりになります。"}, {"t": 453.18333333333334, "x": "その立場から見ると、ヨーロッパに雨の時代があったとは"}, {"t": 456.8, "x": "言えない、というのが、この論文の主張でした。"}, {"t": 460.18333333333334, "x": "疑いには、もっともな理由もありました。"}, {"t": 463.03333333333336, "x": "川の砂岩が一枚はさまっていることは、事実です。"}, {"t": 466.7, "x": "けれども、それが地球全体の気候の変化なのか。"}, {"t": 470.25, "x": "それとも、一つの地域で、川の"}, {"t": 473.06666666666666, "x": "流れる道筋が変わっただけなのか。"}, {"t": 475.21666666666664, "x": "地層一枚からは、そこまでは決められません。"}, {"t": 478.35, "x": "雨が増えたという証拠が、どこまで広く見つかるのか。"}, {"t": 481.98333333333335, "x": "それが、この説の分かれ目になりました。"}, {"t": 484.81666666666666, "x": "もし雨が地球の広い範囲で増えたのなら、どうなるか。"}, {"t": 488.6666666666667, "x": "遠く離れた土地の地層にも、同じ時期に、"}, {"t": 491.5, "x": "同じ向きの変化が出るはずです。"}, {"t": 493.76666666666665, "x": "逆に、一つの地域だけの出来事なら、"}, {"t": 496.5833333333333, "x": "隣の地域には何も残らないはずです。"}, {"t": 499.4, "x": "つまり、確かめる方法は、世界中の地層を、"}, {"t": 503.21666666666664, "x": "同じ時刻にそろえて比べることでした。"}, {"t": 505.76666666666665, "x": "そのための物差しは、のちに、"}, {"t": 507.93333333333334, "x": "炭素の中から見つかることになります。"}, {"t": 510.4, "x": "それから四半世紀をかけて、"}, {"t": 512.2166666666667, "x": "証拠は世界のあちこちから集まってきます。"}, {"t": 515.1333333333333, "x": "2015年、最初の論文の二人を含む研究者たちが、"}, {"t": 519.45, "x": "それまでの研究をまとめ直しました。"}, {"t": 522.05, "x": "その総説には、いくつか正直な記述があります。"}, {"t": 525.5666666666667, "x": "まず、呼び名です。この出来事は、"}, {"t": 528.6333333333333, "x": "多くの研究者に、多雨事象、"}, {"t": 531.1166666666667, "x": "英語ではイベントと呼ばれるようになった。"}, {"t": 533.7666666666667, "x": "けれども、それは正しくない呼び名だ、と書いています。"}, {"t": 537.55, "x": "著者たちが使っているのは、湿潤エピソード、"}, {"t": 540.6333333333333, "x": "つまり、湿ったひと続きの時期という呼び方です。"}, {"t": 544.35, "x": "次に、証拠の強さです。証拠が"}, {"t": 547.0833333333334, "x": "強いのは、ヨーロッパ、中東、"}, {"t": 549.8, "x": "ヒマラヤ、北アメリカ、そして日本の地層。"}, {"t": 553.55, "x": "一方で、南アメリカ、南極、オーストラリアでは、"}, {"t": 557.9833333333333, "x": "いつもはっきりしているわけではない。"}, {"t": 560.25, "x": "そして、決着していない点も書かれています。"}, {"t": 563.4333333333333, "x": "広い範囲で雨が増えたのか、それとも、"}, {"t": 566.2833333333333, "x": "一部の地域だけの効果だったのか。"}, {"t": 568.7166666666667, "x": "究極の原因は、なんだったのか。"}, {"t": 571.3166666666667, "x": "この二つは、まだ決着していない、とされています。"}, {"t": 575.1833333333333, "x": "雨の時代は、見つけた本人たちが、"}, {"t": 577.8333333333334, "x": "いまも慎重に扱っている考えなのです。"}, {"t": 580.85, "x": "ここから先は、その慎重さを残したまま、"}, {"t": 583.9833333333333, "x": "雨の跡を一つずつ見ていきます。"}, {"t": 586.45, "x": "イタリアの北東部に、ドロミテと呼ばれる山々があります。"}, {"t": 588.0833333333334, "x": "ドロミテ█"}, {"t": 590.85, "x": "白っぽい岩の壁が切り立つ山々です。"}, {"t": 593.6166666666667, "x": "その岩の多くは、三畳紀の海でできた石灰の岩です。"}, {"t": 597.7, "x": "当時、このあたりは暖かく浅い海でした。"}, {"t": 600.9333333333333, "x": "大陸の東側に大きく入りこんだ海、"}, {"t": 604.0, "x": "テチス海の、北の縁にあたる場所です。"}, {"t": 604.0166666666667, "x": "テチス海█"}, {"t": 607.5, "x": "海の中には、石灰でできた台のような"}, {"t": 610.2666666666667, "x": "地形が、いくつも盛りあがっていました。"}, {"t": 612.7833333333333, "x": "地質学では、炭酸塩の台地、と呼ばれます。"}, {"t": 616.6333333333333, "x": "この台地をつくっていたのは、主に、目に"}, {"t": 619.7833333333333, "x": "見えないほど小さな微生物の働きでした。"}, {"t": 622.4833333333333, "x": "海水に溶けている成分が、微生物のまわりで"}, {"t": 625.6833333333333, "x": "石灰として固まり、少しずつ積み重なる。"}, {"t": 628.8333333333334, "x": "いわば、海の中の石灰の工場です。"}, {"t": 631.9, "x": "ところが、カーニアン期の中ごろ、"}, {"t": 634.2, "x": "この工場の様子が変わります。"}, {"t": 636.4166666666666, "x": "2020年にまとめられた総説があります。"}, {"t": 639.3333333333334, "x": "それによると、多雨事象の始まりとともに、"}, {"t": 642.2333333333333, "x": "微生物がつくる石灰の量が急に減りました。"}, {"t": 645.4, "x": "石灰をつくる主役は、微生物から、"}, {"t": 648.2666666666667, "x": "殻や骨を持つ生き物へと移っていきます。"}, {"t": 651.2833333333333, "x": "ただ、その新しい工場は、前の工場ほど"}, {"t": 654.9, "x": "多くの石灰をつくれなかったとされます。"}, {"t": 657.3166666666667, "x": "その代わりに、台地のまわりの海には、"}, {"t": 660.1, "x": "陸から来た泥や砂が流れこむようになります。"}, {"t": 663.1333333333333, "x": "石灰の台地は、澄んだ海でなければ育ちにくいものです。"}, {"t": 667.1166666666667, "x": "川が運んできた泥で海がにごると、日の光が"}, {"t": 670.2666666666667, "x": "届きにくくなり、工場の働きは弱まります。"}, {"t": 673.6666666666666, "x": "同じころ、テチス海の沿岸の各地では、黒い"}, {"t": 677.2333333333333, "x": "泥の岩が広くたまったことが知られています。"}, {"t": 679.85, "x": "石灰の海に、泥がかぶさった。"}, {"t": 682.5166666666667, "x": "それは、陸で雨が増え、川が"}, {"t": 685.4166666666666, "x": "土砂を運び出したことと、話が合います。"}, {"t": 688.2, "x": "さらに、深い海の底でも変化が起きていました。"}, {"t": 691.65, "x": "海の深いところでは、水の圧力と冷たさで、"}, {"t": 694.9, "x": "石灰が溶けやすくなります。"}, {"t": 696.9666666666667, "x": "石灰の粒が溶けずに底に残れる深さには、限りがあります。"}, {"t": 701.3, "x": "総説では、この深さが一時的に浅くなったか、"}, {"t": 704.7833333333333, "x": "石灰の供給そのものが止まったと書かれています。"}, {"t": 708.1333333333333, "x": "浅い海では泥に埋もれ、深い海では溶かされる。"}, {"t": 711.8, "x": "この時期、海が石灰をためこむ仕組みは、浅いところと"}, {"t": 715.9333333333333, "x": "深いところの両方で揺さぶられていました。"}, {"t": 718.4, "x": "ドロミテの岩は、この変化を、地層を一枚ずつ"}, {"t": 722.05, "x": "採りながら調べられる、数少ない場所の一つです。"}, {"t": 725.5, "x": "2015年の総説は、ドロミテで一層ずつ採った試料から、"}, {"t": 729.75, "x": "雨の時代の始まりの様子を読み取っています。"}, {"t": 732.8666666666667, "x": "その話は、炭素の目盛りの章で、もう一度出てきます。"}, {"t": 737.15, "x": "海の中の工場が止まったころ、陸では、"}, {"t": 740.0, "x": "水の通り道が大きく変わっていました。"}, {"t": 742.7, "x": "ドイツの南部に、シュトゥットガルト層と"}, {"t": 743.9, "x": "シュトゥットガルト層█"}, {"t": 745.75, "x": "呼ばれる地層があります。ドイツ語では、"}, {"t": 748.3333333333334, "x": "シルフ砂岩とも呼ばれてきました。"}, {"t": 750.5166666666667, "x": "シルフは、アシのような水辺の草を指す言葉です。"}, {"t": 754.1333333333333, "x": "この地層の下には、塩の湖や、"}, {"t": 756.85, "x": "内陸の塩原でたまった泥がありました。"}, {"t": 759.75, "x": "ところが、シュトゥットガルト層になると、"}, {"t": 762.4166666666666, "x": "景色が変わります。川の流れでできた砂の層や、淡水の"}, {"t": 766.7333333333333, "x": "湖でたまった泥が、広く現れるのです。"}, {"t": 769.7666666666667, "x": "2020年の総説は、これを、大きな川の流れが、"}, {"t": 774.0166666666667, "x": "淡水の湖に注いでいた跡だとしています。"}, {"t": 777.15, "x": "塩の湖のあとに、真水の湖ができた。"}, {"t": 780.6166666666667, "x": "雨が増えなければ、起きにくい変化です。"}, {"t": 783.6, "x": "同じころの土の化石も、同じことを示しています。"}, {"t": 787.1, "x": "地層の中には、当時の地面が、土のまま"}, {"t": 790.4, "x": "埋もれて残っていることがあります。"}, {"t": 792.3833333333333, "x": "土は、雨の量や気温によって、できかたが変わります。"}, {"t": 796.6666666666666, "x": "この時期の土の化石は、その前後の時代よりも、"}, {"t": 800.0333333333333, "x": "湿った条件でできていたとされます。"}, {"t": 802.6, "x": "雨の跡は、ヨーロッパの外にも広がっています。"}, {"t": 806.0, "x": "ノルウェーの北、いまの北極圏にあたる"}, {"t": 808.7, "x": "場所では、巨大な三角州が育っていました。"}, {"t": 811.7166666666667, "x": "川が海に土砂を運びこみ、扇のように広げていく地形です。"}, {"t": 816.0833333333334, "x": "この三角州は、多雨事象の時期に、"}, {"t": 818.7166666666667, "x": "いちばん大きく広がりました。"}, {"t": 820.9, "x": "その面積は、およそ100万平方キロメートル。"}, {"t": 822.55, "x": "100万平方キロメートル█"}, {"t": 824.9166666666666, "x": "知られている中では、地球の"}, {"t": 827.0833333333334, "x": "歴史で最大の三角州とされています。"}, {"t": 829.5166666666667, "x": "三角州が広がるには、川が運ぶ土砂が、海に"}, {"t": 833.4833333333333, "x": "削り取られ const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];

a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
