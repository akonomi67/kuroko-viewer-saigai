<script>
const D={"name": "ep034", "file": "ep034", "dur": 1892.3833125, "segs": [], "subs": [{"t": 0.0, "x": "大西洋の地図を思いうかべてください。"}, {"t": 2.4833333333333334, "x": "左に北アメリカと南アメリカがあります。"}, {"t": 5.283333333333333, "x": "右には、ヨーロッパとアフリカがあります。"}, {"t": 8.083333333333334, "x": "そのあいだを広い海が南北にのびています。"}, {"t": 10.95, "x": "この海の両側の岸には、よく似た黒い岩があります。"}, {"t": 14.783333333333333, "x": "北アメリカの東の海べりにあります。"}, {"t": 17.233333333333334, "x": "アフリカのモロッコの山あいにもあります。"}, {"t": 19.766666666666666, "x": "南アメリカのブラジルの奥地にもあります。"}, {"t": 22.483333333333334, "x": "ヨーロッパのスペインやポルトガルにもあります。"}, {"t": 25.166666666666668, "x": "どれも玄武岩という岩です。"}, {"t": 27.166666666666668, "x": "溶岩が冷えて固まった岩です。"}, {"t": 29.366666666666667, "x": "しかも、できた時代がほぼ同じです。"}, {"t": 32.016666666666666, "x": "今からおよそ2億100万年前です。"}, {"t": 34.55, "x": "そのころ、この海はまだありませんでした。"}, {"t": 37.4, "x": "大陸は、一つにつながっていたのです。"}, {"t": 40.166666666666664, "x": "その大陸に長い割れ目が走りました。"}, {"t": 42.65, "x": "割れ目から溶岩があふれました。"}, {"t": 44.63333333333333, "x": "溶岩は大地を広くおおいました。"}, {"t": 46.93333333333333, "x": "これが中央大西洋の溶岩の地帯です。"}, {"t": 49.766666666666666, "x": "研究者は、頭文字をとってキャンプと呼びます。"}, {"t": 53.13333333333333, "x": "ちょうど同じころ、地球では大きな絶滅が起きていました。"}, {"t": 57.016666666666666, "x": "陸でも海でも生き物の種類が大きく減ったのです。"}, {"t": 60.233333333333334, "x": "地質の時代でいうと三畳紀の終わりです。"}, {"t": 62.86666666666667, "x": "この絶滅のあとにジュラ紀が始まります。"}, {"t": 65.36666666666666, "x": "溶岩と絶滅は、時期がほぼ重なります。"}, {"t": 68.5, "x": "けれども、ほぼ重なるだけでは原因とは言えません。"}, {"t": 71.91666666666667, "x": "100万年ずれていれば話は変わります。"}, {"t": 74.56666666666666, "x": "では、どこまで細かく時刻を合わせられるのか。"}, {"t": 77.75, "x": "手がかりは、湖の底にたまった地層です。"}, {"t": 80.9, "x": "そして、溶岩の中の小さな石の粒です。"}, {"t": 84.21666666666667, "x": "この回の主語は大地です。裂けていく"}, {"t": 86.75, "x": "大地と、そこからあふれた溶岩です。"}, {"t": 89.28333333333333, "x": "ただし、全部が決まった話ではありません。"}, {"t": 92.43333333333334, "x": "絶滅の大きさは、資料によって数字が違います。"}, {"t": 96.11666666666666, "x": "溶岩の広さや量にも幅があります。"}, {"t": 98.66666666666667, "x": "原因は、別にあったという説もありました。"}, {"t": 101.8, "x": "どこまでが確かで、どこからが解釈なのか。"}, {"t": 104.85, "x": "その線を引きながら進みます。"}, {"t": 106.96666666666667, "x": "最後は、今のニューヨークの川べりに立ちます。"}, {"t": 110.21666666666667, "x": "三畳紀の終わりごろの地球をのぞいてみます。"}, {"t": 113.11666666666666, "x": "陸はほとんどが一つにまとまっていました。"}, {"t": 115.66666666666667, "x": "この大きな大陸をパンゲアと呼びます。"}, {"t": 118.15, "x": "今の北アメリカとアフリカは、くっついていました。"}, {"t": 121.45, "x": "南アメリカもアフリカと地続きでした。"}, {"t": 123.96666666666667, "x": "ヨーロッパもすぐ北でつながっていました。"}, {"t": 126.31666666666666, "x": "その大陸がゆっくりと引っぱられはじめます。"}, {"t": 129.08333333333334, "x": "引っぱられた大地には、細長い谷ができます。"}, {"t": 132.26666666666668, "x": "地面が帯のように落ちこんでできる谷です。"}, {"t": 134.98333333333332, "x": "北アメリカの東にも、こうした谷がいくつもできました。"}, {"t": 138.63333333333333, "x": "谷は今の海べりに沿って並んでいました。"}, {"t": 141.2, "x": "アフリカの側では、モロッコに同じ形の谷がありました。"}, {"t": 145.13333333333333, "x": "アルガナという盆地もその一つです。"}, {"t": 147.43333333333334, "x": "谷の底には川が流れこみます。"}, {"t": 149.73333333333332, "x": "やがて、谷には湖ができました。"}, {"t": 152.46666666666667, "x": "細長い湖です。雨が多い時期には、湖は深くなります。"}, {"t": 157.16666666666666, "x": "乾いた時期には浅くなります。"}, {"t": 159.13333333333333, "x": "ときには干上がることもあります。"}, {"t": 161.05, "x": "そのたびに、湖の底には泥や砂がたまりました。"}, {"t": 164.78333333333333, "x": "黒っぽい泥の層と赤茶色の泥の層です。"}, {"t": 167.61666666666667, "x": "色の違う層が何枚も積み重なっていきます。"}, {"t": 170.6, "x": "この湖の地層がのちに大切な記録になりました。"}, {"t": 173.85, "x": "中でもニュージャージーのあたりの谷が有名です。"}, {"t": 176.9, "x": "ニューアークという町があります。"}, {"t": 178.83333333333334, "x": "その名前からニューアーク盆地と呼ばれます。"}, {"t": 181.46666666666667, "x": "この回の主な舞台です。この谷の地層には、"}, {"t": 184.56666666666666, "x": "溶岩の層もはさまっていました。"}, {"t": 186.88333333333333, "x": "湖の泥の上に黒い溶岩がのっているのです。"}, {"t": 189.95, "x": "その上にまた湖の泥がたまります。"}, {"t": 192.45, "x": "そして、また溶岩がのります。"}, {"t": 194.8, "x": "泥と溶岩が何度か交互に重なっていました。"}, {"t": 197.66666666666666, "x": "割れ目から出た溶岩が谷の底を流れた跡です。"}, {"t": 200.8, "x": "湖の地層と溶岩が同じ場所に重なっている。"}, {"t": 203.95, "x": "これが時刻をそろえる大きな手がかりになりました。"}, {"t": 206.93333333333334, "x": "絶滅と溶岩のどちらが先だったのか。"}, {"t": 209.48333333333332, "x": "同じ谷の地層なら上下の順番で見られます。"}, {"t": 212.45, "x": "大陸が裂けていくこの割れ目は、やがて海になります。"}, {"t": 216.0, "x": "今の大西洋の始まりです。1999年、カリフォルニア大学"}, {"t": 221.38333333333333, "x": "バークレー校のチームが発表しました。"}, {"t": 223.71666666666667, "x": "この噴火が大陸を引きはなす流れを始めた。"}, {"t": 226.7, "x": "そして大西洋をつくっていった、と。"}, {"t": 229.58333333333334, "x": "溶岩の地帯は、大西洋の生まれる場所に"}, {"t": 232.63333333333333, "x": "沿って広がっていたのです。"}, {"t": 234.18333333333334, "x": "ニューアーク盆地の湖の地層には、"}, {"t": 236.5, "x": "決まったくり返しがあります。"}, {"t": 238.55, "x": "深い湖の層と浅い湖の層です。"}, {"t": 241.41666666666666, "x": "これがほぼ同じ間隔で何度も並んでいます。"}, {"t": 244.28333333333333, "x": "なぜくり返すのでしょうか。"}, {"t": 246.05, "x": "理由は地球の動きにあります。"}, {"t": 248.21666666666667, "x": "地球の自転の軸は、こまのように少しずつ向きを変えます。"}, {"t": 252.28333333333333, "x": "首ふり運動のようなゆっくりした回り方です。"}, {"t": 255.28333333333333, "x": "この動きで季節ごとの日の当たり方が変わります。"}, {"t": 258.3, "x": "日の当たり方が変わると雨の降り方も変わります。"}, {"t": 261.4, "x": "雨が多い時代には、湖は深くなります。"}, {"t": 264.6166666666667, "x": "雨が少ない時代には、湖は浅くなります。"}, {"t": 267.95, "x": "その周期が地層のしま模様として残ったのです。"}, {"t": 271.03333333333336, "x": "首ふり運動の周期は、平均でおよそ2万1000年です。"}, {"t": 275.1666666666667, "x": "2億年前には、少し短かったと計算されています。"}, {"t": 279.01666666666665, "x": "月の動きの違いが関わるためです。"}, {"t": 281.43333333333334, "x": "2013年の論文の計算です。"}, {"t": 284.05, "x": "2億年前の周期は、およそ1万9800年です。"}, {"t": 288.3333333333333, "x": "しま模様を一つ数えればおよそ2万年です。"}, {"t": 291.3833333333333, "x": "しま模様の数を数えれば経った時間が分かります。"}, {"t": 294.6, "x": "地層がそのまま時計の目盛りになるのです。"}, {"t": 297.18333333333334, "x": "天文の動きを使った年代の測り方です。"}, {"t": 300.2, "x": "ただし、この時計には弱点もありました。"}, {"t": 303.3333333333333, "x": "しま模様は、本当に地球の動きでできたのか。"}, {"t": 306.76666666666665, "x": "2億年前の周期を正しく計算できるのか。"}, {"t": 309.8, "x": "この二つを疑う声があったのです。"}, {"t": 312.1333333333333, "x": "もう一つの手がかりは、地層の中の磁石です。"}, {"t": 315.4, "x": "岩の中には、できたときの磁石の向きが残ります。"}, {"t": 318.85, "x": "地球の磁石の北と南は、ときどき入れかわってきました。"}, {"t": 322.65, "x": "その入れかわりは、世界中で同じ時に起きます。"}, {"t": 326.06666666666666, "x": "ニューアークの地層にも、北と"}, {"t": 328.05, "x": "南が逆だった時期が刻まれていました。"}, {"t": 330.46666666666664, "x": "その逆向きの層は、絶滅の層のすぐ下にあります。"}, {"t": 334.3333333333333, "x": "同じ逆向きの層は、ほかの谷にも見つかりました。"}, {"t": 337.71666666666664, "x": "カナダのノバスコシアのファンディ盆地です。"}, {"t": 340.1666666666667, "x": "そして、モロッコのアルガナ盆地です。"}, {"t": 342.9, "x": "磁石の向きをそろえれば、遠くの谷の地層も並べられます。"}, {"t": 346.95, "x": "しま模様で時間をはかります。"}, {"t": 349.01666666666665, "x": "磁石で遠くの場所をつなぎます。"}, {"t": 351.1666666666667, "x": "こうして、大西洋の両側の谷の"}, {"t": 353.7, "x": "記録がまとめられていきました。"}, {"t": 355.46666666666664, "x": "ただ、しま模様の時計には限りがあります。"}, {"t": 358.5833333333333, "x": "分かるのは、層から層までの長さだけです。"}, {"t": 361.7, "x": "今から何年前かは分かりません。"}, {"t": 363.93333333333334, "x": "それを決めるには、別の時計が要ります。"}, {"t": 366.8, "x": "それが溶岩の中にある小さな石の粒でした。"}, {"t": 369.9, "x": "この話は第5章でたどります。"}, {"t": 372.06666666666666, "x": "その前に、谷にあふれた溶岩を見ておきます。"}, {"t": 375.48333333333335, "x": "裂けはじめた大地の割れ目から溶岩がわき出しました。"}, {"t": 378.73333333333335, "x": "山のような火山が爆発したのではありません。"}, {"t": 381.68333333333334, "x": "噴火の形が違うのです。長い割れ目から、"}, {"t": 384.6333333333333, "x": "さらさらした溶岩が流れ出たのです。"}, {"t": 387.28333333333336, "x": "こうした溶岩は、地面を平らにおおって広がります。"}, {"t": 390.93333333333334, "x": "一回で流れ出る量がとても多いのが特徴です。"}, {"t": 394.1333333333333, "x": "流れた溶岩は、冷えて黒い玄武岩になりました。"}, {"t": 397.65, "x": "その上にまた次の溶岩が重なります。"}, {"t": 400.3, "x": "こうして、何枚もの溶岩の層ができていきました。"}, {"t": 403.78333333333336, "x": "溶岩は、地上を流れただけではありません。"}, {"t": 406.96666666666664, "x": "地下でも地層のすき間に入りこんで固まりました。"}, {"t": 409.96666666666664, "x": "板のように横に広がって固まったものがあります。"}, {"t": 413.0, "x": "縦の割れ目を埋めたものもあります。形はさまざまです。"}, {"t": 416.65, "x": "では、どのくらいの広さだったのでしょうか。"}, {"t": 419.53333333333336, "x": "1999年の論文の数字です。"}, {"t": 422.6666666666667, "x": "ブラジルの北と中部だけで、250万平方キロです。"}, {"t": 426.65, "x": "全体では、700万平方キロをこえるとしています。"}, {"t": 430.5, "x": "その後も各地で同じ時代の岩が見つかりました。"}, {"t": 433.56666666666666, "x": "2017年と2020年の論文もあります。"}, {"t": 436.93333333333334, "x": "こちらは、およそ1000万平方キロです。"}, {"t": 440.03333333333336, "x": "日本の面積は、およそ38万平方キロです。"}, {"t": 443.98333333333335, "x": "700万平方キロなら日本の18倍ほどです。"}, {"t": 447.5, "x": "1000万平方キロなら26倍ほどになります。"}, {"t": 450.75, "x": "とてつもない広さです。2013年の論文は、"}, {"t": 454.1666666666667, "x": "広さでは地球で一番だと書いています。"}, {"t": 457.0833333333333, "x": "量にも見積もりの幅があります。"}, {"t": 459.2, "x": "2013年の論文では、200万から300万立方キロです。"}, {"t": 463.93333333333334, "x": "2020年の論文は、少なくとも"}, {"t": 466.68333333333334, "x": "300万立方キロと書きました。"}, {"t": 468.8, "x": "同じ論文の計算では、500万から"}, {"t": 471.6333333333333, "x": "600万立方キロも使っています。"}, {"t": 473.9166666666667, "x": "どこまでを同じ溶岩の地帯に数えるか。"}, {"t": 476.56666666666666, "x": "見積もりの仕方で数字が変わるのです。"}, {"t": 478.98333333333335, "x": "その後、大西洋が開くと溶岩の地帯は引きさかれました。"}, {"t": 483.0833333333333, "x": "今では、その跡が4つの大陸に分かれて残っています。"}, {"t": 487.01666666666665, "x": "北アメリカでは、ニュージャージーや"}, {"t": 489.26666666666665, "x": "ノバスコシアの溶岩の崖です。"}, {"t": 491.23333333333335, "x": "南アメリカでは、アマゾンの地下に広がる溶岩の板です。"}, {"t": 495.3, "x": "アフリカでは、モロッコの山地や"}, {"t": 497.55, "x": "西アフリカのギニアの岩です。"}, {"t": 499.45, "x": "ヨーロッパでは、スペインやポルトガルの岩です。"}, {"t": 502.6333333333333, "x": "地図の上で大西洋をとじてみます。"}, {"t": 504.98333333333335, "x": "すると、これらの岩は一つの大きなまとまりになります。"}, {"t": 508.6666666666667, "x": "バークレー校の1999年の発表は、"}, {"t": 512.0333333333333, "x": "その広がりをこう書きました。"}, {"t": 514.05, "x": "ニュージャージーのパリセーズから、"}, {"t": 515.8, "x": "ブラジルのアマゾンまで。そして"}, {"t": 518.1, "x": "スペインと西アフリカまで、と。"}, {"t": 520.4, "x": "大地が裂けた跡を溶岩がつないでいるのです。"}, {"t": 523.2666666666667, "x": "では、この溶岩はいつ出たのでしょうか。"}, {"t": 526.15, "x": "そして、絶滅とどちらが先だったのでしょうか。"}, {"t": 529.4166666666666, "x": "次の章では、絶滅の跡そのものを見ていきます。"}, {"t": 533.0666666666667, "x": "陸の絶滅は、地層の中でどう見分けるのでしょうか。"}, {"t": 536.7833333333333, "x": "手がかりは花粉と胞子です。どちらも植物の粒です。"}, {"t": 540.5166666666667, "x": "植物は、とても小さな花粉や胞子を風に飛ばします。"}, {"t": 544.6166666666667, "x": "その粒は丈夫で、湖の泥の中に何億年も残ります。"}, {"t": 549.0166666666667, "x": "化石になって残るのです。顕微鏡で見ると"}, {"t": 551.8833333333333, "x": "形から植物の種類が分かります。"}, {"t": 554.1333333333333, "x": "ニューアーク盆地の湖の地層でも粒が調べられました。"}, {"t": 557.6666666666666, "x": "三畳紀の地層には、いろいろな形の粒がまじっています。"}, {"t": 561.7166666666667, "x": "ところが、ある薄い層を境に顔ぶれががらりと変わります。"}, {"t": 565.8166666666667, "x": "三畳紀によく見られた形の粒がそこで消えるのです。"}, {"t": 569.2666666666667, "x": "すぐ上の層では、シダの胞子が急に増えています。"}, {"t": 573.0166666666667, "x": "その後、しばらくは粒の種類が少ない時期が続きます。"}, {"t": 576.8833333333333, "x": "2013年の論文がのった号の表紙です。"}, {"t": 580.0166666666667, "x": "そこには、一つの花粉の写真が使われました。"}, {"t": 583.35, "x": "絶滅の直後の湖の地層から出た花粉です。"}, {"t": 586.6166666666667, "x": "針葉樹のなかまの花粉で、直径は"}, {"t": 589.3833333333333, "x": "30マイクロメートルほどです。"}, {"t": 591.2833333333333, "x": "植物の種類が少なくなった時期を"}, {"t": 593.4833333333333, "x": "代表する粒だと説明されています。"}, {"t": 595.85, "x": "この入れかわりの層が陸の絶滅の目印です。"}, {"t": 598.9333333333333, "x": "北アメリカの東の谷では、この層は溶岩の"}, {"t": 601.9333333333333, "x": "少し下にあります。いちばん下の溶岩の層よりも下です。"}, {"t": 606.05, "x": "ニューアーク盆地でもファンディ盆地でも同じでした。"}, {"t": 608.9333333333333, "x": "北アメリカの谷では、溶岩より"}, {"t": 611.3333333333334, "x": "先に絶滅の層が来ているのです。"}, {"t": 613.5166666666667, "x": "ここだけ見ると、溶岩は絶滅のあとで出たことになります。"}, {"t": 617.4833333333333, "x": "ところが、モロッコのアルガナ盆地では様子が違いました。"}, {"t": 621.25, "x": "三畳紀の花粉や胞子が溶岩の真下まで続いていたのです。"}, {"t": 625.1833333333333, "x": "入れかわりの層が溶岩より下に見当たりません。"}, {"t": 628.15, "x": "アルガナの溶岩は、北アメリカの"}, {"t": 630.5333333333333, "x": "溶岩より古いのかもしれない。"}, {"t": 632.3833333333333, "x": "そう考えればつじつまが合います。"}, {"t": 634.6, "x": "絶滅の層は、アルガナの一番古い溶岩の根もとに来ます。"}, {"t": 638.8833333333333, "x": "陸の大きな植物の顔ぶれは、"}, {"t": 640.95, "x": "95％以上入れかわったとされます。"}, {"t": 644.1166666666667, "x": "2017年の論文が紹介している研究の数字です。"}, {"t": 648.0333333333333, "x": "海の地層でも同じころに大きな変化がありました。"}, {"t": 651.15, "x": "陸と海の両方で同じ時期に大きく減ったのです。"}, {"t": 654.3666666666667, "x": "では、この絶滅はどのくらいの速さで起きたのか。"}, {"t": 657.9333333333333, "x": "地層の厚さから見るととても短い時間です。"}, {"t": 660.8166666666667, "x": "けれども、厚さだけでは何年かは決まりません。"}, {"t": 664.0, "x": "その年数をもう一つの時計で測った研究があります。"}, {"t": 667.6833333333333, "x": "次の章で見ていきます。溶岩の"}, {"t": 670.0, "x": "中には、ジルコンという鉱物の粒が"}, {"t": 672.65, "x": "ふくまれることがあります。"}, {"t": 674.0166666666667, "x": "砂つぶよりも小さいかたい結晶です。"}, {"t": 676.6333333333333, "x": "この粒は、できるときにウランを取りこみます。"}, {"t": 679.7, "x": "ウランは、長い時間をかけて少しずつ鉛に変わります。"}, {"t": 683.4833333333333, "x": "変わる速さは決まっています。ここが時計の仕組みです。"}, {"t": 687.0166666666667, "x": "粒の中のウランと鉛の割合を測ります。"}, {"t": 689.9, "x": "すると、粒ができた年代が分かります。"}, {"t": 692.8333333333334, "x": "ウランと鉛の年代測定です。"}, {"t": 695.0166666666667, "x": "2013年、マサチューセッツ工科大学などの"}, {"t": 698.5666666666667, "x": "チームが論文を出しました。"}, {"t": 700.2333333333333, "x": "コロンビア大学の研究者も加わっています。"}, {"t": 703.1166666666667, "x": "チームは、8か所の岩からジルコンを取り出しました。"}, {"t": 706.6666666666666, "x": "北アメリカの東の7か所とモロッコの1か所です。"}, {"t": 709.8666666666667, "x": "溶岩や、地下で固まった溶岩の板の岩です。"}, {"t": 713.3833333333333, "x": "それまでの年代には、100万年から"}, {"t": 715.9833333333333, "x": "200万年の誤差がありました。"}, {"t": 717.9, "x": "新しい測定では、3万年ほどの幅まで絞りこまれました。"}, {"t": 722.1666666666666, "x": "ファンディ盆地の溶岩は、およそ2億156万年前です。"}, {"t": 726.6666666666666, "x": "ニュージャージーのパリセーズの岩は、"}, {"t": 728.65, "x": "およそ2億152万年前です。"}, {"t": 731.4, "x": "モロッコのアルガナの岩もほぼ同じ年代でした。"}, {"t": 734.35, "x": "チームは、この年代を湖のしま模様の時計と"}, {"t": 737.8333333333334, "x": "組み合わせました。しま模様の時計は、"}, {"t": 740.5, "x": "層と層のあいだの長さに強い時計です。"}, {"t": 743.1833333333333, "x": "ジルコンの時計は、今から何年前かに強い時計です。"}, {"t": 747.1333333333333, "x": "二つを合わせて一番つじつまの合う答えを計算しました。"}, {"t": 750.85, "x": "その結果、絶滅の層はおよそ2億156万年前と出ました。"}, {"t": 755.8833333333333, "x": "二つの時計の答えは、誤差の範囲でよく合っていました。"}, {"t": 759.6666666666666, "x": "しま模様の時計を疑う声に一つの答えが出たのです。"}, {"t": 763.2666666666667, "x": "さらに、細かい順番も見えてきました。"}, {"t": 766.1666666666666, "x": "三つの谷の順番です。ファンディ盆地の一番下の溶岩は、"}, {"t": 770.2333333333333, "x": "絶滅の3000年あまりあとです。"}, {"t": 772.7833333333333, "x": "ニューアーク盆地の一番下の溶岩は、"}, {"t": 775.2833333333333, "x": "絶滅のおよそ1万3000年あとです。"}, {"t": 778.2833333333333, "x": "モロッコの一番下の溶岩は、"}, {"t": 780.3166666666667, "x": "ちょうど絶滅のころにあたります。"}, {"t": 782.5666666666667, "x": "第4章で見たアルガナの花粉とぴったり合う順番です。"}, {"t": 786.2, "x": "チームは、最初の噴火と絶滅が"}, {"t": 788.7833333333333, "x": "同じ時期だったと結論しました。"}, {"t": 790.7166666666667, "x": "研究を率いた地質学者の一人は、こう話しています。"}, {"t": 794.7, "x": "この絶滅は地質の時間でいえば一瞬で起きた、と。"}, {"t": 798.6333333333333, "x": "同じ人は慎重な言葉も残しました。"}, {"t": 801.2, "x": "ほぼ同じ時期でも原因と結果だとは限らない。"}, {"t": 804.1166666666667, "x": "時期を結びつけるとき、100万年は永遠のように長い、と。"}, {"t": 808.8666666666667, "x": "だからこそ何千年の単位まで合わせる必要が const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();

sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
