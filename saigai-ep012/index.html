<script>
const D={"name": "ep012", "file": "ep012", "dur": 1935.1833125, "segs": [], "subs": [{"t": 0.0, "x": "鉄は、さびます。雨ざらしの自転車も、海辺の手すりも、"}, {"t": 4.5, "x": "放っておけば赤茶色に変わっていきます。"}, {"t": 7.266666666666667, "x": "鉄が、空気の中の酸素と結びつくからです。"}, {"t": 10.633333333333333, "x": "これと同じことが、地球の海で、"}, {"t": 13.083333333333334, "x": "とてつもない規模で起きた時代があります。"}, {"t": 15.816666666666666, "x": "いまからおよそ24億年前のことです。"}, {"t": 17.3, "x": "24億年前█"}, {"t": 19.65, "x": "そのころの海には、たくさんの鉄が溶けていました。"}, {"t": 23.05, "x": "溶けていたのは、まだ酸素に出会っていない鉄です。"}, {"t": 26.3, "x": "そこへ、酸素が入ってきました。"}, {"t": 28.9, "x": "鉄は酸素と結びつき、水に溶けない、"}, {"t": 31.733333333333334, "x": "さびの粒に変わりました。粒は"}, {"t": 34.31666666666667, "x": "海の底へ沈み、何億年もかけて、"}, {"t": 37.083333333333336, "x": "厚い層に積み重なりました。"}, {"t": 39.38333333333333, "x": "その層は、赤や黒の縞模様の岩になって、"}, {"t": 42.666666666666664, "x": "いくつもの大陸に残っています。"}, {"t": 44.96666666666667, "x": "縞状鉄鉱層█"}, {"t": 44.96666666666667, "x": "縞状鉄鉱層と呼ばれる岩です。"}, {"t": 47.95, "x": "それより前の地球の空気には、"}, {"t": 50.016666666666666, "x": "酸素がほとんどありませんでした。"}, {"t": 52.233333333333334, "x": "いまの空気は、およそ五分の一が酸素です。"}, {"t": 55.5, "x": "ところが、そのころの酸素は、いまの十万分の"}, {"t": 59.05, "x": "一にも届かなかったと考えられています。"}, {"t": 61.46666666666667, "x": "酸素のない世界で組み上がっていた"}, {"t": 63.46666666666667, "x": "仕組みにとって、酸素は、ものを壊す物質でした。"}, {"t": 67.23333333333333, "x": "鉄をさびさせるのと同じ性質で、"}, {"t": 69.45, "x": "ほかのものからも電子を奪っていくからです。"}, {"t": 72.31666666666666, "x": "地球の歴史では、空気に酸素がたまりはじめた"}, {"t": 75.88333333333334, "x": "この変化を、大酸化イベントと呼んでいます。"}, {"t": 76.78333333333333, "x": "大酸化イベント█"}, {"t": 79.26666666666667, "x": "空の成分が入れ替わり、それにつられて、"}, {"t": 82.38333333333334, "x": "海の中身が書き換わりました。"}, {"t": 84.61666666666666, "x": "何が起き、なぜそれが分かり、"}, {"t": 87.06666666666666, "x": "どこがまだ分かっていないのか。"}, {"t": 89.2, "x": "手がかりは、三つあります。"}, {"t": 91.28333333333333, "x": "岩に残った硫黄の、わずかな重さの違い。"}, {"t": 94.45, "x": "川が運んだ砂の中の、壊れやすい鉱物の粒。"}, {"t": 98.16666666666667, "x": "そして、海の底に積もった、鉄の縞です。"}, {"t": 101.83333333333333, "x": "三つとも、酸素が増えたときに、"}, {"t": 104.15, "x": "はっきりと姿を変えたものです。"}, {"t": 106.53333333333333, "x": "さびた海の跡を手がかりに、順にたどります。"}, {"t": 109.7, "x": "二十四億年より昔の空気を、"}, {"t": 111.98333333333333, "x": "直接すくって調べることはできません。"}, {"t": 114.6, "x": "その時代の空気の泡が、どこかに閉じこめられて"}, {"t": 117.76666666666667, "x": "残っているわけではないからです。"}, {"t": 119.66666666666667, "x": "手がかりになったのは、岩の中の硫黄でした。"}, {"t": 122.81666666666666, "x": "硫黄█"}, {"t": 124.08333333333333, "x": "硫黄の原子には、重さのわずかに"}, {"t": 126.48333333333333, "x": "違うものが、何種類か混ざっています。"}, {"t": 129.16666666666666, "x": "こうした、重さだけが違う仲間を、同位体と呼びます。"}, {"t": 133.3, "x": "ふつう、硫黄が化学反応で二つに"}, {"t": 136.08333333333334, "x": "分かれるとき、重いものと軽いものの"}, {"t": 138.41666666666666, "x": "分かれかたには、決まった比率があります。"}, {"t": 141.15, "x": "重さの差に、ほぼ比例した割合で分かれるのです。"}, {"t": 144.55, "x": "ところが、古い岩の中には、この決まりから"}, {"t": 147.8, "x": "外れた硫黄が見つかりました。"}, {"t": 149.56666666666666, "x": "2000年█"}, {"t": 149.56666666666666, "x": "2000年、ファーカーらの研究チームが、"}, {"t": 152.56666666666666, "x": "その結果を科学誌サイエンスに発表しました。"}, {"t": 155.8, "x": "調べたのは、先カンブリア時代と呼ばれる、"}, {"t": 158.73333333333332, "x": "とても古い時代の岩に含まれる硫黄です。"}, {"t": 161.76666666666668, "x": "決まりから外れた分かれかたは、"}, {"t": 163.63333333333333, "x": "およそ二十四億五千万年前より古い岩に見られました。"}, {"t": 167.76666666666668, "x": "そして、二十億九千万年前から"}, {"t": 170.61666666666667, "x": "二十四億五千万年前までのあいだの"}, {"t": 173.16666666666666, "x": "どこかで、その特徴は消えていました。"}, {"t": 175.8, "x": "なぜ、こんな分かれかたが起きたのか。"}, {"t": 178.53333333333333, "x": "説明として残ったのは、空の"}, {"t": 180.9, "x": "高いところで起きる反応でした。"}, {"t": 182.93333333333334, "x": "火山から出た二酸化硫黄の分子が、"}, {"t": 185.26666666666668, "x": "太陽の強い紫外線を浴びて割れる。"}, {"t": 187.9, "x": "そのとき、決まりから外れた分かれかたが"}, {"t": 190.65, "x": "生まれる、というものです。"}, {"t": 192.5, "x": "ここで、酸素が関わってきます。"}, {"t": 194.88333333333333, "x": "2002年█"}, {"t": 194.88333333333333, "x": "2002年、パブロフとカスティングという二人の"}, {"t": 198.11666666666667, "x": "研究者が、この仕組みを計算で確かめました。"}, {"t": 201.43333333333334, "x": "空気の酸素が、いまの十万分の一より少なければ、"}, {"t": 205.18333333333334, "x": "硫黄は、いろいろな形のまま地面に降ります。"}, {"t": 208.75, "x": "形ごとに違うしるしを抱えたまま、別々に"}, {"t": 212.03333333333333, "x": "地層へ入るので、しるしは消えずに残ります。"}, {"t": 215.2, "x": "ところが、酸素が十万分の一を超えると、話が変わります。"}, {"t": 219.83333333333334, "x": "硫黄はほとんどすべて、一度、海に溶けた硫酸という"}, {"t": 223.91666666666666, "x": "形を通ってから、地層に入るようになります。"}, {"t": 227.1, "x": "そこでしるしは混ぜ合わされ、消えてしまいます。"}, {"t": 230.36666666666667, "x": "つまり、このしるしが岩に残っているあいだは、空の"}, {"t": 234.16666666666666, "x": "酸素が、いまの十万分の一より少なかったことになります。"}, {"t": 238.15, "x": "二人の結論は、二十三億年前より前の空の酸素は、"}, {"t": 242.3, "x": "その値より少なかった、というものでした。"}, {"t": 245.6, "x": "硫黄のしるしが消えた時期は、空に酸素が"}, {"t": 248.56666666666666, "x": "たまりはじめた時期を示す、目印になりました。"}, {"t": 251.86666666666667, "x": "いまも、大酸化イベントの年代を調べる研究では、"}, {"t": 255.63333333333333, "x": "このしるしのあるなしが、中心になる手がかりの一つです。"}, {"t": 259.68333333333334, "x": "硫黄のほかにも、酸素の少なさを示す手がかりがあります。"}, {"t": 263.53333333333336, "x": "川が運んで積もらせた、砂の粒です。"}, {"t": 266.45, "x": "その中に、酸素があるとすぐに壊れてしまう"}, {"t": 269.45, "x": "鉱物の粒が、混ざっていることがあります。一つは、"}, {"t": 273.68333333333334, "x": "黄鉄鉱█"}, {"t": 274.0833333333333, "x": "黄鉄鉱です。鉄と硫黄でできた、金色に光る鉱物です。"}, {"t": 278.9, "x": "地表で酸素の多い空気や水にさらされると、"}, {"t": 281.78333333333336, "x": "酸化して、溶けたり別の鉱物に変わったりします。"}, {"t": 285.46666666666664, "x": "もう一つは、閃ウラン鉱という、"}, {"t": 286.68333333333334, "x": "閃ウラン鉱█"}, {"t": 288.43333333333334, "x": "ウランを含む黒い鉱物です。"}, {"t": 291.1666666666667, "x": "こちらも、酸素の多い水の中では溶け出してしまいます。"}, {"t": 294.8833333333333, "x": "いまの地球では、こうした粒が、川に削られ、"}, {"t": 298.51666666666665, "x": "転がされ、長い距離を運ばれて、そのまま砂の"}, {"t": 302.53333333333336, "x": "層に残ることは、まず期待できません。"}, {"t": 305.18333333333334, "x": "運ばれている途中で、酸素に壊されてしまうからです。"}, {"t": 308.9166666666667, "x": "ところが、古い砂岩の中には、その粒が残っています。"}, {"t": 313.0833333333333, "x": "2014年、カリフォルニア工科大学の"}, {"t": 316.5, "x": "研究者たちは、南アフリカの"}, {"t": 318.55, "x": "コエガス層群█"}, {"t": 319.0833333333333, "x": "コエガス層群と呼ばれる地層を調べました。"}, {"t": 322.0833333333333, "x": "年代は、およそ二十四億一千五百万年前です。"}, {"t": 326.25, "x": "調べた砂岩の層の、どれからも、運ばれてきた"}, {"t": 329.8833333333333, "x": "黄鉄鉱と閃ウラン鉱の粒が見つかりました。"}, {"t": 332.71666666666664, "x": "研究者たちは、粒が川を流れるあいだに、どれだけ削られ、"}, {"t": 337.2, "x": "どれだけ溶けるかを計算に組み込みました。"}, {"t": 340.1, "x": "その結果、この時代の空気の酸素は、"}, {"t": 343.06666666666666, "x": "ごくわずかだったと見積もっています。"}, {"t": 345.4166666666667, "x": "そして、酸素が大きく増えると、こうした粒は"}, {"t": 348.8666666666667, "x": "地層の記録から、ほとんど姿を消す、とまとめています。"}, {"t": 353.01666666666665, "x": "では、酸素が増えたことを示す"}, {"t": 355.35, "x": "地層は、どこにあるのでしょうか。"}, {"t": 357.56666666666666, "x": "2004年、アンドレイ・ベッカーらが、"}, {"t": 360.1166666666667, "x": "科学誌ネイチャーに一つの答えを発表しました。"}, {"t": 363.4166666666667, "x": "舞台は、同じ南アフリカの、"}, {"t": 365.6, "x": "ローイフーフテ層█"}, {"t": 366.03333333333336, "x": "ローイフーフテ層とタイムボール・ヒル層です。"}, {"t": 369.31666666666666, "x": "年代は、およそ23億2000万年前。"}, {"t": 370.8833333333333, "x": "23億2000万年前█"}, {"t": 373.3333333333333, "x": "この地層の黄鉄鉱の硫黄には、はじめに見た、"}, {"t": 376.55, "x": "決まりから外れたしるしがありませんでした。"}, {"t": 379.3333333333333, "x": "つまり、空の酸素は、すでにいまの"}, {"t": 382.3333333333333, "x": "十万分の一を超えていたことになります。"}, {"t": 384.85, "x": "さらに、この地層の新しいほうの部分には、"}, {"t": 388.06666666666666, "x": "厚い鉄の岩の層がありました。"}, {"t": 390.46666666666664, "x": "赤鉄鉱█"}, {"t": 390.46666666666664, "x": "赤鉄鉱という、酸素と結びついた鉄の鉱物が、"}, {"t": 394.6166666666667, "x": "小さな丸い粒になって集まった層です。"}, {"t": 397.85, "x": "ベッカーらは、この地層が積もったころに、"}, {"t": 400.5, "x": "空の酸素が大きく増えた、それも"}, {"t": 403.3333333333333, "x": "おそらく初めて増えた、と書いています。"}, {"t": 405.9166666666667, "x": "二十四億年あまり前の川の砂には、酸素の少ない空の跡が。"}, {"t": 410.6, "x": "二十三億年ほど前の地層には、酸素の増えた空の跡が。"}, {"t": 414.85, "x": "そのあいだのどこかで、空気の"}, {"t": 416.93333333333334, "x": "中身が入れ替わりはじめたことになります。"}, {"t": 419.28333333333336, "x": "二つの地層のあいだは、およそ一億年です。"}, {"t": 422.6166666666667, "x": "地球の歴史の中では短く、人間の時間の"}, {"t": 425.98333333333335, "x": "感覚からすれば、とてつもなく長い幅です。"}, {"t": 429.15, "x": "空で酸素が増えたとき、海では"}, {"t": 431.68333333333334, "x": "何が起きていたのでしょうか。"}, {"t": 433.35, "x": "鍵になるのは、鉄が水に溶けるかどうか、です。"}, {"t": 437.21666666666664, "x": "鉄は、水の中で、大きく分けて二つの状態をとります。"}, {"t": 441.55, "x": "一つは、酸素と結びつく前の状態の鉄です。"}, {"t": 445.05, "x": "こちらは、水によく溶けます。"}, {"t": 447.25, "x": "もう一つは、酸素と結びついたあとの状態の鉄です。"}, {"t": 451.03333333333336, "x": "こちらは、水にほとんど溶けず、"}, {"t": 453.26666666666665, "x": "細かな粒になって出てきます。"}, {"t": 455.45, "x": "私たちが、さびと呼んでいる赤茶色のものは、"}, {"t": 458.55, "x": "この、酸素と結びついた鉄の仲間です。"}, {"t": 461.78333333333336, "x": "酸素の少ない海では、鉄は、"}, {"t": 464.21666666666664, "x": "溶けたまま海水の中を漂っていられます。"}, {"t": 467.2, "x": "しかし、そこへ酸素が来ると、溶けていた鉄は、"}, {"t": 470.8666666666667, "x": "さびの粒になって、ゆっくりと海の底へ沈んでいきます。"}, {"t": 475.1, "x": "では、昔の海には、どれほど鉄が溶けていたのでしょうか。"}, {"t": 479.4166666666667, "x": "2017年、ある研究チームが、ネイチャー・"}, {"t": 483.0833333333333, "x": "コミュニケーションズ誌に、一つの見積もりを出しました。"}, {"t": 486.3833333333333, "x": "縞状鉄鉱層ができるには、海水に溶けている"}, {"t": 489.81666666666666, "x": "鉄が、ある濃さを超えている必要があります。"}, {"t": 492.9, "x": "その濃さは、ずっと新しい時代の海の底にできる、"}, {"t": 496.46666666666664, "x": "赤い泥の層に必要な濃さの、一万倍以上でした。"}, {"t": 500.68333333333334, "x": "それほど濃い鉄が、かつての"}, {"t": 502.73333333333335, "x": "海には溶けていた、ということになります。"}, {"t": 505.4166666666667, "x": "同じ論文は、縞状鉄鉱層が、"}, {"t": 508.46666666666664, "x": "およそ38億年前から18億年前にかけて、"}, {"t": 508.65, "x": "38億年前から18億年前█"}, {"t": 512.75, "x": "海の堆積物の目立つ特徴だったとしています。"}, {"t": 516.3333333333334, "x": "鉄はどこから来たのでしょうか。"}, {"t": 518.2666666666667, "x": "縞状鉄鉱層には、大きく分けて"}, {"t": 521.0333333333333, "x": "二つの型があることが知られています。"}, {"t": 523.2166666666667, "x": "海の底の火山の岩と重なるように見つかる、小さめの型。"}, {"t": 527.3833333333333, "x": "そして、大陸のへりの、穏やかな浅い海に"}, {"t": 530.8, "x": "積もった、ずっと大きな型です。"}, {"t": 533.15, "x": "前のほうの型は、海の底の火山活動と、"}, {"t": 536.5, "x": "深く結びついていたと考えられています。"}, {"t": 539.3, "x": "地球の内側から、海の底を通って、溶けた"}, {"t": 543.0166666666667, "x": "鉄が運びこまれていたということです。"}, {"t": 545.2166666666667, "x": "こうしてためこまれた鉄が、酸素に"}, {"t": 547.5166666666667, "x": "出会ったところで、さびとなって沈みました。"}, {"t": 550.2666666666667, "x": "見た目にも、時代による違いがあります。"}, {"t": 553.0666666666667, "x": "細かな縞がきれいに重なった形は、太古代から、"}, {"t": 556.6166666666667, "x": "原生代のごく初めにかけて多く見られます。"}, {"t": 559.6833333333333, "x": "それより新しい時代になると、砂粒のような丸い粒が"}, {"t": 563.5, "x": "集まった形の鉄の層が、ずっと多くなります。"}, {"t": 566.7666666666667, "x": "海の中で、鉄がさびて沈む場所や、沈み方が、"}, {"t": 570.7166666666667, "x": "時代とともに変わっていったことを示しています。"}, {"t": 573.66666 ": 1158.6833333333334, "x": "奪う力が、とても強い気体です。"}, {"t": 1161.3, "x": "鉄がさびるのも、鉄から電子が奪われる反応です。"}, {"t": 1164.95, "x": "同じことが、細胞の中の、繊細な部品にも起きます。"}, {"t": 1169.1666666666667, "x": "酸素が中途半端に電子を受け取ると、"}, {"t": 1171.65, "x": "さらに攻撃的な形に変わることがあります。"}, {"t": 1174.7666666666667, "x": "過酸化水素█"}, {"t": 1174.7666666666667, "x": "過酸化水素などの、活性酸素と呼ばれるものです。"}, {"t": 1178.9166666666667, "x": "これらは、細胞の中で働く、"}, {"t": 1181.3, "x": "化学反応の道具を壊してしまいます。"}, {"t": 1184.1333333333334, "x": "2021年、微生物の研究者たちが、"}, {"t": 1187.5333333333333, "x": "この問題を総まとめした論文を出しました。"}, {"t": 1190.55, "x": "その書き出しは、次のような内容です。"}, {"t": 1193.4333333333334, "x": "大昔の細胞は、酸素のない地球の上で、"}, {"t": 1196.7166666666667, "x": "体の中の化学反応の仕組みを組み上げた。"}, {"t": 1199.85, "x": "酸素が現れたのは、それよりずっとあとのことだった。"}, {"t": 1203.45, "x": "そのため細胞は、活性酸素と、酸素そのものの"}, {"t": 1207.2166666666667, "x": "両方から身を守るための、何重もの守りを、"}, {"t": 1210.45, "x": "あとから編み出さなければならなかった。"}, {"t": 1212.8, "x": "さらに論文は、酸素そのものが、酸素のない"}, {"t": 1216.1833333333334, "x": "場所で働くように作られた、金属を使った"}, {"t": 1219.3333333333333, "x": "部品を、じかに傷めると述べています。"}, {"t": 1221.8, "x": "酸素のない世界で最適化された化学は、酸素がある"}, {"t": 1225.3666666666666, "x": "世界では、壊れやすい化学だったということです。"}, {"t": 1228.6666666666667, "x": "空と海に酸素が広がっていったとき、酸素のない"}, {"t": 1231.95, "x": "世界を前提にしていた仕組みは、酸素の届かない"}, {"t": 1235.1666666666667, "x": "場所へ追いやられていったと考えられています。"}, {"t": 1237.75, "x": "泥の中や、深い水の底のような場所です。"}, {"t": 1240.9666666666667, "x": "ここで一つ、注意しておくことがあります。"}, {"t": 1244.0, "x": "大酸化イベントのころに、酸素のせいで小さな生き物が"}, {"t": 1247.6333333333334, "x": "大量に消えた、と語られることがあります。"}, {"t": 1250.4666666666667, "x": "そう考えても不思議ではありません。"}, {"t": 1252.75, "x": "ただ、とても小さな細胞は、形の"}, {"t": 1255.8166666666666, "x": "はっきりした化石をほとんど残しません。"}, {"t": 1258.2333333333333, "x": "どれだけ消えたのかを、岩の記録から"}, {"t": 1260.8166666666666, "x": "数えることは、いまのところできていません。"}, {"t": 1263.6, "x": "この番組では、それを、ありえた出来事の"}, {"t": 1266.85, "x": "一つとして扱い、事実としては語りません。"}, {"t": 1269.9, "x": "その一方で、細胞の側も、守りを固めていきました。"}, {"t": 1274.2333333333333, "x": "活性酸素を片づける仕組みは、"}, {"t": 1276.3333333333333, "x": "以前からよく知られています。"}, {"t": 1278.3666666666666, "x": "同じ論文は、それに加えて、活性酸素がどの道具を"}, {"t": 1282.5666666666666, "x": "ねらうのか、そして、それを防ぐ細かな工夫が、"}, {"t": 1286.2166666666667, "x": "近年つぎつぎに突き止められてきた、と書いています。"}, {"t": 1289.8666666666666, "x": "酸素のない場所でしか生きられない細胞でさえ、"}, {"t": 1292.6666666666667, "x": "ときどき酸素に触れてしまうときのために、"}, {"t": 1295.4, "x": "専用の守りを持っているといいます。"}, {"t": 1297.9166666666667, "x": "確かに言えるのは、化学の側の変化です。"}, {"t": 1301.0166666666667, "x": "電子を奪う力の強い気体が、"}, {"t": 1303.2, "x": "空と浅い海に居座るようになった。"}, {"t": 1305.8666666666666, "x": "それによって、鉄はさびて沈み、硫黄のしるしは"}, {"t": 1309.7166666666667, "x": "消え、川の砂の粒は壊れるようになった。"}, {"t": 1312.9666666666667, "x": "岩に残っているのは、そうした、化学の書き換えの跡です。"}, {"t": 1317.1833333333334, "x": "大酸化イベントという名前からは、ある時、一気に"}, {"t": 1320.9833333333333, "x": "酸素が満ちた、という姿を思い浮かべるかもしれません。"}, {"t": 1324.75, "x": "ところが、ここ十年ほどの研究は、"}, {"t": 1327.4166666666667, "x": "ずっと入り組んだ姿を描いています。"}, {"t": 1329.9833333333333, "x": "2017年、南アフリカの火山の岩の年代を測り"}, {"t": 1334.1333333333334, "x": "直した研究が、アメリカ科学アカデミー紀要に出ました。"}, {"t": 1337.9833333333333, "x": "それによると、大酸化イベントの始まりは、"}, {"t": 1341.0333333333333, "x": "二十四億六千万年前から二十四億二千六百万年前のあいだ。"}, {"t": 1346.1, "x": "それまでの見積もりより、一億年ほど早い時期です。"}, {"t": 1349.7, "x": "さらに、酸素の増え方は一方向ではなく、"}, {"t": 1352.8333333333333, "x": "上がったり下がったりを繰り返しながら、"}, {"t": 1355.6666666666667, "x": "およそ二億年続いた可能性がある、としました。"}, {"t": 1359.3166666666666, "x": "この揺れの時代には、地球全体が強く"}, {"t": 1362.2333333333333, "x": "冷えこんだ時期が、何度か重なっています。"}, {"t": 1365.0666666666666, "x": "ただ、その寒さは、それだけで一つの"}, {"t": 1368.0666666666666, "x": "大きな話になるので、ここでは深く立ち入りません。"}, {"t": 1371.4666666666667, "x": "2021年█"}, {"t": 1371.4666666666667, "x": "2021年には、ポールトンらの研究チームが、"}, {"t": 1375.75, "x": "ネイチャーに論文を出しました。"}, {"t": 1378.1333333333334, "x": "調べたのは、南アフリカのトランスバール累層群と"}, {"t": 1381.7166666666667, "x": "呼ばれる、海でできた地層です。"}, {"t": 1384.1, "x": "それまでは、二十三億二千万年前ごろには、"}, {"t": 1387.5166666666667, "x": "空の酸素は二度と減らないところまで"}, {"t": 1389.9666666666667, "x": "増えた、と考えられていました。"}, {"t": 1392.15, "x": "ところが、ポールトンらの結果では、そのあとも、"}, {"t": 1395.5666666666666, "x": "空の酸素は、いまの十万分の一という境目を"}, {"t": 1399.35, "x": "またいで、行ったり来たりしていました。"}, {"t": 1401.7666666666667, "x": "その揺れは、およそ二億年続いたとしています。"}, {"t": 1405.0666666666666, "x": "酸素が、戻らない形で空に定着したのは、"}, {"t": 1408.7333333333333, "x": "およそ22億2000万年前。"}, {"t": 1409.35, "x": "22億2000万年前█"}, {"t": 1411.4833333333333, "x": "それまでの見積もりより、一億年ほど遅い、という"}, {"t": 1415.3, "x": "結論です。この時期には、岩の中の炭素の同位体が、"}, {"t": 1419.2666666666667, "x": "大きく偏る現象も記録されています。"}, {"t": 1422.0833333333333, "x": "ロマグンディ・イベントと呼ばれるもので、"}, {"t": 1424.05, "x": "ポールトンらは、酸素の定着が、"}, {"t": 1426.75, "x": "この変化と一緒にやって来たとしています。"}, {"t": 1429.4833333333333, "x": "酸素は、そのあとも、まっすぐには増えていません。"}, {"t": 1433.4166666666667, "x": "2009年の研究は、およそ十八億八千万年前の"}, {"t": 1437.7333333333333, "x": "縞状鉄鉱層に含まれるクロムを調べ、そのころ空の"}, {"t": 1441.55, "x": "酸素が、いったん減っていた可能性を示しました。"}, {"t": 1444.9, "x": "大酸化イベントは、酸素が一方向に階段を"}, {"t": 1448.25, "x": "上っていくような変化ではなかった、とまとめています。"}, {"t": 1451.8, "x": "そして、深い海の底まで、しっかりと酸素が行き"}, {"t": 1455.6166666666666, "x": "渡ったのは、ずっとあとのことでした。"}, {"t": 1458.0666666666666, "x": "2017年の研究は、深い海に酸素が行き渡った"}, {"t": 1462.0833333333333, "x": "時期を、およそ五億八千万年前ごろとしています。"}, {"t": 1465.6333333333334, "x": "そのあいだの段階も、少しずつ分かってきています。"}, {"t": 1469.1, "x": "2008年、モリブデンという金属を調べた"}, {"t": 1472.4333333333334, "x": "研究は、陸の岩が酸素によって、しっかりと、"}, {"t": 1476.1833333333334, "x": "途切れずに風化するようになったのは、"}, {"t": 1478.6166666666666, "x": "およそ二十一億五千万年前だとしました。"}, {"t": 1481.8333333333333, "x": "空の酸素が最初に増えてから、二億年以上あとのことです。"}, {"t": 1486.0, "x": "2014年に出た総まとめの論文は、酸素が、"}, {"t": 1489.55, "x": "海と空で、いまに近い量まで増えたのは、最初の"}, {"t": 1493.7333333333333, "x": "増加から二十億年ほどあとだったとしています。"}, {"t": 1496.5333333333333, "x": "空に酸素がたまりはじめてから、十八億年以上あとです。"}, {"t": 1500.7833333333333, "x": "つまり、二十四億年前の大酸化イベントは、酸素が"}, {"t": 1505.0166666666667, "x": "空と浅い海に入ってきた、最初の大きな段にすぎません。"}, {"t": 1509.0, "x": "深い海は、そのあとも長いあいだ、"}, {"t": 1511.6, "x": "酸素の少ないまま残りました。"}, {"t": 1513.7833333333333, "x": "空の成分が入れ替わるのに何億年も"}, {"t": 1516.25, "x": "かかり、海の底まで変わるのには、"}, {"t": 1518.75, "x": "さらに十億年以上がかかったという : 1771.5, "x": "そこから、四千三百種類へ。"}, {"t": 1774.2833333333333, "x": "その増え方の大きな部分に、"}, {"t": 1776.1833333333334, "x": "酸素が関わっていたことになります。"}, {"t": 1778.5833333333333, "x": "さびた鉄の鉱物も、その一つです。"}, {"t": 1781.3833333333334, "x": "ここで、ハマスレーの話に戻ります。"}, {"t": 1784.1, "x": "アメリカ地質調査所の集計によると、"}, {"t": 1786.4833333333333, "x": "2024年の世界の鉄鉱石の生産量は、"}, {"t": 1790.1333333333334, "x": "およそ二十五億トンと見積もられています。"}, {"t": 1792.9333333333334, "x": "そのうち最も多いのがオーストラリアで、"}, {"t": 1795.4166666666667, "x": "およそ九億三千万トン。世界全体の、"}, {"t": 1798.6666666666667, "x": "三分の一を超える量です。カーティン大学の"}, {"t": 1802.2333333333333, "x": "発表によると、鉄鉱石の生産で"}, {"t": 1804.7333333333333, "x": "世界の先頭に立っているのは西オーストラリア州です。"}, {"t": 1808.0666666666666, "x": "オーストラリアの一年ぶんの鉄鉱石の輸出額は、"}, {"t": 1811.3166666666666, "x": "千三百十億オーストラリア・ドルにのぼったとされます。"}, {"t": 1814.9833333333333, "x": "同じ資料は、鉄そのものを新しく取り出す"}, {"t": 1817.9333333333334, "x": "元になるのは、鉄鉱石しかない、と書いています。"}, {"t": 1821.6666666666667, "x": "そして、地球で最大級の鉄鉱床は、"}, {"t": 1824.8333333333333, "x": "縞状鉄鉱層の中にあります。"}, {"t": 1827.3166666666666, "x": "ただし、海の底に沈んだばかりの縞状鉄鉱層は、"}, {"t": 1831.3, "x": "そのままでは、掘って使うには鉄が薄すぎました。"}, {"t": 1834.85, "x": "重さでおよそ三割だった鉄が、あとの時代に"}, {"t": 1837.9333333333334, "x": "大地の中で手を加えられ、六割を超える"}, {"t": 1840.8833333333334, "x": "濃さになった部分が、鉱石として掘られています。"}, {"t": 1844.0666666666666, "x": "その濃くなった時期について、"}, {"t": 1845.8, "x": "2024年に、新しい数字が出ました。"}, {"t": 1849.3, "x": "オーストラリアのカーティン大学などの"}, {"t": 1851.2833333333333, "x": "研究チームが、ハマスレーの鉱石の鉄の鉱物"}, {"t": 1854.75, "x": "そのものの年代を、ウランと鉛を使って測りました。"}, {"t": 1858.4, "x": "すると、大きな鉱床ができたのは、"}, {"t": 1861.15, "x": "およそ14億年前から11億年前。"}, {"t": 1862.1666666666667, "x": "14億年前から11億年前█"}, {"t": 1864.75, "x": "それまで考えられていた、二十二億年前ごろより、"}, {"t": 1868.35, "x": "十億年近く新しい時期でした。"}, {"t": 1870.95, "x": "大陸どうしが分かれ、また集まる、大地の"}, {"t": 1874.4, "x": "大きな動きの中で起きた、とされています。"}, {"t": 1877.3333333333333, "x": "つまり、鉄鉱石には、二つの時代が重なっています。"}, {"t": 1881.5333333333333, "x": "二十四億年前ごろ、海に溶けていた鉄が、"}, {"t": 1884.9, "x": "酸素に出会って沈んだ時代。"}, {"t": 1886.95, "x": "そして、十数億年前、その沈んだ鉄が、"}, {"t": 1890.7166666666667, "x": "大地の動きの中で濃くされた時代です。"}, {"t": 1893.45, "x": "どちらが欠けても、いまの鉄鉱山はありません。"}, {"t": 1896.7166666666667, "x": "私たちが使っている鉄の多くは、一度、海の"}, {"t": 1900.5666666666666, "x": "中でさびた鉄を、もう一度取り出したものです。"}, {"t": 1903.75, "x": "製鉄は、酸素と結びついた鉄から、酸素を"}, {"t": 1907.3, "x": "引きはがす仕事だと言いかえることができます。"}, {"t": 1909.8666666666666, "x": "二十四億年前に海がやったことを、"}, {"t": 1912.3833333333334, "x": "逆向きにたどっているのです。"}, {"t": 1914.5333333333333, "x": "そして、その鉄は、使っているうちに、また"}, {"t": 1918.15, "x": "空気の酸素と結びついて、さびていきます。"}, {"t": 1921.25, "x": "雨ざらしの自転車が赤くなるとき、そこで"}, {"t": 1924.15, "x": "起きているのは、二十四億年前の海と同じ反応です。"}, {"t": 1928.1166666666666, "x": "あのとき海の鉄をさびさせた気体を、いま、"}, {"t": 1931.3833333333334, "x": "私たちは一日じゅう吸って生きています。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
