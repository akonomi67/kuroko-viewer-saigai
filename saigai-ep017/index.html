<script>
const D={"name": "ep017", "file": "ep017", "dur": 2039.56665625, "segs": [], "subs": [{"t": 0.0, "x": "ある年を境に、空から降る雪の量が、倍になりました。"}, {"t": 4.433333333333334, "x": "場所は、グリーンランドを覆う氷の、"}, {"t": 7.066666666666666, "x": "ちょうどまんなかのあたりです。"}, {"t": 8.916666666666666, "x": "その変化は、長く見積もっても"}, {"t": 11.2, "x": "三年ほどのうちに起きたと読み取れます。"}, {"t": 13.5, "x": "同じころ、その土地の気温は、数十年のうちに"}, {"t": 17.2, "x": "五度から十度ほど上がりました。"}, {"t": 18.933333333333334, "x": "いまから、およそ1万1700年前のことです。"}, {"t": 20.6, "x": "1万1700年前█"}, {"t": 23.516666666666666, "x": "これは、ひとつの長い寒さが終わったときの記録です。"}, {"t": 27.05, "x": "では、その寒さは、いつ始まったのか。"}, {"t": 30.233333333333334, "x": "およそ1万2900年前です。"}, {"t": 31.083333333333332, "x": "1万2900年前█"}, {"t": 34.233333333333334, "x": "そのころ地球は、最後の氷河期を抜け出しつつありました。"}, {"t": 38.25, "x": "北アメリカやヨーロッパの北を覆っていた"}, {"t": 40.516666666666666, "x": "巨大な氷は、とけはじめていました。"}, {"t": 43.11666666666667, "x": "ところが、暖かくなっていく途中で、北大西洋の"}, {"t": 46.983333333333334, "x": "まわりは、急に氷河期に近い寒さへ引き返します。"}, {"t": 50.68333333333333, "x": "その寒さは、千二百年ほど続きました。"}, {"t": 53.81666666666667, "x": "この出来事は、ヤンガードリアスと呼ばれています。"}, {"t": 54.95, "x": "ヤンガードリアス█"}, {"t": 57.68333333333333, "x": "日本語にすれば、「新しいほうのドリアス」。"}, {"t": 60.7, "x": "ドリアスとは、寒い土地に咲く、野の花の名前です。"}, {"t": 64.75, "x": "今回の主役は、グリーンランドの氷です。"}, {"t": 67.85, "x": "氷は、毎年の雪が積み重なってできています。"}, {"t": 71.36666666666666, "x": "その層を一枚ずつ数えれば、"}, {"t": 73.41666666666667, "x": "何年前の雪なのかが分かります。"}, {"t": 75.95, "x": "そして層の中には、その雪が降ったころの"}, {"t": 78.91666666666667, "x": "気温や風の手がかりが、閉じこめられています。"}, {"t": 82.0, "x": "氷が教えてくれるのは、どれだけ"}, {"t": 84.35, "x": "寒くなったか、だけではありません。"}, {"t": 86.86666666666666, "x": "どれだけの速さで変わったか、です。"}, {"t": 89.66666666666667, "x": "先に、今回の立ち位置をお伝えしておきます。"}, {"t": 93.01666666666667, "x": "寒さが戻ってきたこと、そしてその終わりが"}, {"t": 95.93333333333334, "x": "きわめて速かったことは、ほとんど争われていません。"}, {"t": 99.36666666666666, "x": "一方で、なぜ寒さが戻ってきたのかに"}, {"t": 102.3, "x": "ついては、説が分かれています。"}, {"t": 104.6, "x": "北アメリカの氷がとけた水が、海の流れを弱めたという"}, {"t": 108.55, "x": "説明が、もっとも多くの研究者に支持されています。"}, {"t": 112.26666666666667, "x": "空から来た天体が引き金を引いたという説もありますが、"}, {"t": 115.73333333333333, "x": "こちらは少数説で、強い反論を受けています。"}, {"t": 119.45, "x": "この番組では、この二つを同じ重さでは扱いません。"}, {"t": 123.41666666666667, "x": "どこまでが記録で、どこからが解釈なのか。"}, {"t": 126.48333333333333, "x": "その境目を確かめながら、氷の層を、"}, {"t": 129.6, "x": "深いほうへ読み進めていきます。"}, {"t": 131.86666666666667, "x": "グリーンランドは、島の大部分を、"}, {"t": 134.38333333333333, "x": "厚い氷に覆われています。この氷は、"}, {"t": 137.31666666666666, "x": "海が凍ってできた氷ではありません。"}, {"t": 140.23333333333332, "x": "陸に降り積もった雪が、固まってできた氷です。"}, {"t": 143.75, "x": "夏にとけきらなかった雪が、次の年の雪に"}, {"t": 146.88333333333333, "x": "押されて、少しずつ締まり、やがて氷になります。"}, {"t": 150.61666666666667, "x": "それを何万年も繰り返してできたのが、氷床です。"}, {"t": 154.25, "x": "氷床█"}, {"t": 155.25, "x": "そこで、一九九〇年代、二つの"}, {"t": 158.78333333333333, "x": "大きな掘削の計画が進められました。"}, {"t": 161.28333333333333, "x": "グリップ計画と、ジスプツー計画です。"}, {"t": 164.18333333333334, "x": "二つの計画は、グリーンランドの中央部で、"}, {"t": 167.35, "x": "氷を筒の形のまま、深くまで掘り抜きました。"}, {"t": 171.1, "x": "この筒のような氷の柱を、氷床コアと呼びます。"}, {"t": 173.43333333333334, "x": "氷床コア█"}, {"t": 175.36666666666667, "x": "氷床コアを細かく調べると、一年ごとの縞が見えてきます。"}, {"t": 179.7, "x": "たとえば、氷に含まれる細かいちりの量は、"}, {"t": 182.96666666666667, "x": "季節によって増えたり減ったりします。"}, {"t": 185.46666666666667, "x": "ちりの多い層と少ない層が、"}, {"t": 187.45, "x": "一年に一回ずつ、交互に並んでいるのです。"}, {"t": 191.1, "x": "これを、木の年輪を数えるように、"}, {"t": 193.61666666666667, "x": "一枚ずつ数えていきます。ヤンガードリアスの"}, {"t": 196.5, "x": "終わりについていえば、数えた年代の誤差は、"}, {"t": 199.63333333333333, "x": "およそ一パーセントとされています。"}, {"t": 202.18333333333334, "x": "一万年以上さかのぼって、ずれが百年あまり。"}, {"t": 205.75, "x": "地質の記録としては、きわめて細かい物差しです。"}, {"t": 209.31666666666666, "x": "その後、グリーンランドの北部でも、エヌグリップと"}, {"t": 212.85, "x": "呼ばれる計画で、別の氷床コアが掘られました。"}, {"t": 216.18333333333334, "x": "そちらでも、いくつもの成分を同時に"}, {"t": 218.8, "x": "測りながら、層が一年ずつ数えられています。"}, {"t": 222.05, "x": "では、氷から、どうやって気温が分かるのか。"}, {"t": 225.66666666666666, "x": "手がかりの一つは、水そのものです。"}, {"t": 228.31666666666666, "x": "水をつくる酸素には、わずかに重いものと、"}, {"t": 231.45, "x": "軽いものが混じっています。"}, {"t": 233.36666666666667, "x": "寒い時期に降る雪ほど、重い酸素の"}, {"t": 236.06666666666666, "x": "割合が小さくなる傾向があります。"}, {"t": 238.41666666666666, "x": "この割合を測ると、雪が降った"}, {"t": 240.88333333333333, "x": "ころの寒さの目安になります。"}, {"t": 242.73333333333332, "x": "もう一つの手がかりは、層の厚さです。"}, {"t": 245.6, "x": "一年ぶんの層が厚ければ、その年は"}, {"t": 248.41666666666666, "x": "雪がたくさん降ったことになります。"}, {"t": 250.43333333333334, "x": "氷は長い年月のうちに流れて薄くなるので、"}, {"t": 253.46666666666667, "x": "その薄くなった量を、計算で補います。"}, {"t": 256.8833333333333, "x": "そして、三つ目の手がかりが、"}, {"t": 259.0833333333333, "x": "氷の中の小さな空気の泡です。"}, {"t": 261.75, "x": "雪が氷に変わるとき、すきまにあった"}, {"t": 264.45, "x": "空気が、泡として閉じこめられます。"}, {"t": 266.98333333333335, "x": "つまり氷床コアは、昔の雪と、昔の空気を、"}, {"t": 270.8666666666667, "x": "同じ一本の柱の中に保存しているのです。"}, {"t": 273.95, "x": "ジスプツー計画のコアでは、ヤンガードリアスの終わりは、"}, {"t": 277.6333333333333, "x": "深さ千六百七十八メートルほどのところにあります。"}, {"t": 281.35, "x": "その一メートルほどの範囲に、地球の気候が"}, {"t": 284.5, "x": "切り替わった数年が、詰まっています。"}, {"t": 287.15, "x": "ヤンガードリアスの寒さを知るには、"}, {"t": 289.28333333333336, "x": "その前の暖かさから見ておく必要があります。"}, {"t": 292.5833333333333, "x": "時計の針を、氷河期のもっとも寒い時期まで戻します。"}, {"t": 296.43333333333334, "x": "北アメリカの北部は、厚い氷に覆われていました。"}, {"t": 300.1166666666667, "x": "この氷のかたまりを、ローレンタイド氷床と呼びます。"}, {"t": 301.8333333333333, "x": "ローレンタイド氷床█"}, {"t": 304.4, "x": "氷床に開けた穴の中の温度を測る方法で"}, {"t": 307.21666666666664, "x": "見積もると、この寒い時期から現在までに、"}, {"t": 310.1166666666667, "x": "中央グリーンランドの気温は、二十度以上も"}, {"t": 313.51666666666665, "x": "上がったと見積もられています。"}, {"t": 315.0833333333333, "x": "その上がり方は、ゆっくりした坂道ではありませんでした。"}, {"t": 319.01666666666665, "x": "階段のように、急に上がる時期と、"}, {"t": 321.56666666666666, "x": "足踏みする時期がありました。"}, {"t": 323.73333333333335, "x": "大きな一段目は、およそ1万4700年前にやってきます。"}, {"t": 326.06666666666666, "x": "1万4700年前█"}, {"t": 329.45, "x": "北グリーンランドの氷床コアを数えた年代では、"}, {"t": 332.53333333333336, "x": "西暦二〇〇〇年から数えて一万四千六百九十二年前。"}, {"t": 337.05, "x": "氷河期の寒さから、急に暖かい時期へ移った境目です。"}, {"t": 341.3333333333333, "x": "この暖かい時期は、ベーリング期、"}, {"t": 343.81666666666666, "x": "アレレード期と呼ばれています。"}, {"t": 345.8833333333333, "x": "この暖かさは、海の流れと深く"}, {"t": 348.45, "x": "結びついていたと考えられています。"}, {"t": 350.65, "x": "北大西洋には、南から暖かい海水が運ばれてきて、"}, {"t": 354.73333333333335, "x": "北の海で冷やされ、深く沈みこむ大きな流れがあります。"}, {"t": 359.01666666666665, "x": "この流れは、大西洋を南北にめぐることから、"}, {"t": 362.73333333333335, "x": "大西洋子午面循環と呼ばれます。"}, {"t": 362.8833333333333, "x": "大西洋子午面循環█"}, {"t": 365.6333333333333, "x": "暖かい海水が北へ運ばれることで、"}, {"t": 368.03333333333336, "x": "北大西洋のまわりの空気は温められています。"}, {"t": 371.43333333333334, "x": "研究者たちは、大西洋の海底の泥に含まれる、"}, {"t": 375.1, "x": "二つの放射性の元素の比を測りました。"}, {"t": 378.1666666666667, "x": "これは、深い海の水がどれだけ速く"}, {"t": 380.85, "x": "入れ替わっていたかを知る手がかりになります。"}, {"t": 383.21666666666664, "x": "その結果、およそ1万7500年前から続いた"}, {"t": 384.68333333333334, "x": "1万7500年前█"}, {"t": 387.6333333333333, "x": "寒い時期には、この流れがほとんど、"}, {"t": 390.45, "x": "あるいは完全に止まっていたこと。"}, {"t": 393.1, "x": "そして、暖かさが戻った大きな二つの場面では、"}, {"t": 396.6666666666667, "x": "流れが急に強まっていたことが示されました。"}, {"t": 399.75, "x": "つまり、海の流れが強まれば"}, {"t": 402.06666666666666, "x": "北大西洋は暖まり、弱まれば冷える。"}, {"t": 405.18333333333334, "x": "そのつながりが、海底の泥から読み取れたのです。"}, {"t": 408.6666666666667, "x": "一方、陸の上では、巨大な氷がとけつづけていました。"}, {"t": 413.0, "x": "とけた水は、湖をつくり、川になって、"}, {"t": 416.55, "x": "海へと流れこみます。ローレンタイド氷床の縁には、とけた"}, {"t": 421.0, "x": "水をためた大きな湖ができていました。"}, {"t": 423.56666666666666, "x": "その湖は、アガシー湖と呼ばれています。"}, {"t": 424.51666666666665, "x": "アガシー湖█"}, {"t": 427.2, "x": "こうして、およそ千八百年のあいだ、"}, {"t": 429.95, "x": "北半球は暖かさの側にありました。"}, {"t": 432.81666666666666, "x": "氷河期は、このまま終わっていくように見えました。"}, {"t": 436.06666666666666, "x": "ところが、その流れが、途中で断ち切られます。"}, {"t": 439.7, "x": "ヤンガードリアスという名前は、"}, {"t": 441.6, "x": "氷床コアより、ずっと古い研究から来ています。"}, {"t": 445.35, "x": "二十世紀のはじめごろ、スカンジナビアで、"}, {"t": 448.1666666666667, "x": "氷河が去ったあとにたまった地層が調べられていました。"}, {"t": 451.6, "x": "その中に、ある植物の名残が、"}, {"t": 454.1666666666667, "x": "何度か現れることが分かります。ドリアス・オクトペタラ。"}, {"t": 456.5, "x": "ドリアス・オクトペタラ█"}, {"t": 457.9, "x": "北極に近い、寒い土地に咲く野の花です。"}, {"t": 461.26666666666665, "x": "この花の名残が地層の中に出てくることは、その時代、"}, {"t": 464.81666666666666, "x": "その土地が寒かったことを示す手がかりになります。"}, {"t": 468.2, "x": "暖かくなったことを示す地層の上に、"}, {"t": 470.6166666666667, "x": "もう一度、この花の層が重なっている。"}, {"t": 473.78333333333336, "x": "それは、いったん暖かくなった土地が、"}, {"t": 476.51666666666665, "x": "また寒さに戻ったことを意味していました。"}, {"t": 479.25, "x": "この花の層は、一度だけではなく、何度か現れます。"}, {"t": 483.53333333333336, "x": "そこで、古いものと区別して、"}, {"t": 485.75, "x": "いちばん新しいものが「新しいほうのドリアス」、"}, {"t": 489.3833333333333, "x": "つまりヤンガードリアスと呼ばれるようになりました。"}, {"t": 492.4, "x": "やがてこの名前は、北大西洋のまわりの地層の"}, {"t": 495.7, "x": "年代を区切る、便利な目印として使われるようになります。"}, {"t": 499.55, "x": "ここで、一つ大事な点があります。"}, {"t": 502.1666666666667, "x": "花の地層は、その土地の寒さを示してはくれますが、"}, {"t": 505.76666666666665, "x": "それが北半球の広い範囲で同時に起きたのか、"}, {"t": 509.06666666666666, "x": "何年かけて寒くなったのかまでは、"}, {"t": 511.43333333333334, "x": "はっきりとは教えてくれません。"}, {"t": 513.5333333333333, "x": "地層は、何百年ぶんがまとめて"}, {"t": 515.9833333333333, "x": "一枚になっていることが多いからです。"}, {"t": 518.2, "x": "その問いに、一年きざみの答えを"}, {"t": 520.6666666666666, "x": "出したのが、グリーンランドの氷でした。"}, {"t": 523.2833333333333, "x": "氷の研究者たちは、同じ寒い時期に、"}, {"t": 526.3333333333334, "x": "別の呼び名もつけています。"}, {"t": 528.2833333333333, "x": "グリーンランドの氷の研究では、寒い時期に"}, {"t": 531.4166666666666, "x": "番号をつけて整理しており、ヤンガードリアスは、"}, {"t": 534.7333333333333, "x": "グリーンランド亜氷期の一番にあたります。"}, {"t": 537.55, "x": "ヨーロッパの花の地層と、グリーンランドの氷の層。"}, {"t": 541.15, "x": "まったく違う場所の、まったく違う記録が、"}, {"t": 544.2833333333333, "x": "同じ寒さを指していました。"}, {"t": 546.3166666666667, "x": "それは、この寒さが、どこか一か所の"}, {"t": 549.3166666666667, "x": "天気の話ではなかったことを示しています。"}, {"t": 551.9833333333333, "x": "今回は、その中でも記録のはっきりしている、"}, {"t": 555.1666666666666, "x": "北大西洋のまわりに話をしぼります。"}, {"t": 558.1333333333333, "x": "およそ1万2900年前、北大西洋の"}, {"t": 558.7333333333333, "x": "1万2900年前█"}, {"t": 562.0166666666667, "x": "まわりは、寒さの側へ戻りはじめます。"}, {"t": 565.05, "x": "その寒さは、どれほどのものだったのか。"}, {"t": 567.8666666666667, "x": "グリーンランドの中央部では、"}, {"t": 569.6166666666667, "x": "ヤンガードリアスのあいだ、気温がいまより"}, {"t": 572.5833333333334, "x": "十五度ほど低かったと見積もられています。"}, {"t": 574.9333333333333, "x": "見積もりの幅は、前後三度ほどです。"}, {"t": 577.7166666666667, "x": "いまの気温から、さらに十五度ほど低い世界でした。"}, {"t": 581.35, "x": "雪の量も、大きく減っていました。"}, {"t": 583.8833333333333, "x": "ジスプツー計画のコアで、一年ぶんの層の厚さを"}, {"t": 587.4333333333333, "x": "氷に直すと、ヤンガードリアスのあいだは、"}, {"t": 590.3666666666667, "x": "一年におよそ七センチメートル。"}, {"t": 592.75, "x": "いまのその場所では、一年に"}, {"t": 594.9333333333333, "x": "およそ二十四センチメートルです。"}, {"t": 597.0166666666667, "x": "寒い空気は、水分をあまり運べません。"}, {"t": 600.2333333333333, "x": "雪が少ないということは、空気そのものが、"}, {"t": 603.2333333333333, "x": "冷たく乾いていたということです。"}, {"t": 605.5166666666667, "x": "そして、氷には、ちりが多く含まれていました。"}, {"t": 609.3, "x": "寒く乾いた時代には、陸地の乾いた場所から、"}, {"t": 612.6, "x": "細かいちりがたくさん舞い上がり、遠くまで運ばれます。"}, {"t": 616.5833333333334, "x": "グリーンランドの氷に残るちりの多くは、はるか遠く、"}, {"t": 620.2333333333333, "x": "アジアの乾いた土地から来たものと考えられています。"}, {"t": 623.7166666666667, "x": "では、この寒さは、どれほどの速さでやってきたのか。"}, {"t": 627.7666666666667, "x": "実は、始まりについては、終わりほど"}, {"t": 630.8166666666667, "x": "すっきりした記録がありません。"}, {"t": 632.5833333333334, "x": "氷床コアでは、寒さへの移り変わりが、一段ではなく、"}, {"t": 637.0166666666667, "x": "何段かに分かれて進んだように見えます。"}, {"t": 639.9166666666666, "x": "一度で切り替わる、はっきりした"}, {"t": 642.1666666666666, "x": "段差が見当たらないのです。"}, {"t": 643.75, "x": "それでも、別の場所に、始まりの"}, {"t": 646.45, "x": "速さを示す記録があります。"}, {"t": 648.3166666666667, "x": "ドイツの西部、アイフェル地方にある、"}, {"t": 651.0833333333334, "x": "メアフェルダー・マール█"}, {"t": 651.1, "x": "メアフェルダー・マールという火山の湖です。"}, {"t": 654.3166666666667, "x": "この湖の底には、季節ごとに違う泥が"}, {"t": 657.45, "x": "積もり、縞になって重なっています。"}, {"t": 659.9666666666667, "x": "その縞を数えることで、変化の速さを、"}, {"t": 662.8833333333333, "x": "年の単位で測ることができます。"}, {"t": 665.2333333333333, "x": "ドイツの研究者たちがこの泥を調べたところ、"}, {"t": 667.9833333333333, "x": "数十年ほど落ち着かない時期が続いたあと、"}, {"t": 670.9, "x": "たった一年のうちに、冬の風の"}, {"t": 673.6666666666666, "x": "強さと向きが大きく変わっていました。"}, {"t": 675.85, "x": "研究者たちは、気候がまるで別の"}, {"t": 678.3166666666667, "x": "状態に倒れこんだ、と表現しています。"}, {"t": 681.2333333333333, "x": "そして、その原因として、海の流れが"}, {"t": 684.4666666666667, "x": "弱まったことだけでなく、海氷の広がりと"}, {"t": 687.3833333333333, "x": "結びついた大気の流れの変化が、大きな役割を"}, {"t": 690.9166666666666, "x": "果たしたのではないか、と述べています。"}, {"t": 693.3166666666667, "x": "こうして北大西洋のまわりは、"}, {"t": 695.2666666666667, "x": "千二百年ほどの寒い時期に入りました。"}, {"t": 698.1833333333333, "x": "氷床コアでは、多くの記録が、"}, {"t": 700.65, "x": "およそ千二百年から千三百年のあいだ、"}, {"t": 703.85, "x": "ヤンガードリアスの水準にとどまっています。ただし、"}, {"t": 707.7166666666667, "x": "その千二百年は、ずっと同じ寒さではありませんでした。"}, {"t": 711.75, "x": "始まりのころがもっとも寒く、雪は少なく、"}, {"t": 714.8333333333334, "x": "ちりは多く、終わりに近づくにつれて、少しずつ暖かく、"}, {"t": 719.4666666666667, "x": "湿っぽく、ちりの少ない方向へ動いていきます。"}, {"t": 723.1666666666666, "x": "そして、その先に、この回で"}, {"t": 725.75, "x": "いちばん速い変化が待っています。"}, {"t": 727.75, "x": "ヤンガードリアスの終わりは、氷床コアの中で、"}, {"t": 730.95, "x": "ひときわはっきりした段差になっています。"}, {"t": 733.6333333333333, "x": "それまでの氷床コアからは、酸素の重さの"}, {"t": 736.5833333333334, "x": "割合、つまり気温の目安が、およそ五十年で"}, {"t": 740.2666666666667, "x": "切り替わったと読み取られていました。"}, {"t": 742.15, "x": "氷に含まれるちりの量は、さらに速く、"}, {"t": 745.1166666666667, "x": "二十年もかからずに変わっていました。"}, {"t": 747.7, "x": "ただし、ちりの量は、風の通り道が"}, {"t": 750.9, "x": "少しずれただけでも変わります。"}, {"t": 752.6833333333333, "x": "それだけでは、気候そのものが"}, {"t": 754.8166666666667, "x": "大きく変わったとは言い切れません。"}, {"t": 756.7833333333333, "x": "そこで注目されたのが、雪の量です。"}, {"t": 759.7, "x": "雪の量は、その土地の気候を、もっと直接に表しています。"}, {"t": 764.4833333333333, "x": "1993年█"}, {"t": 764.4833333333333, "x": "1993年、ジスプツー計画のコアを"}, {"t": 768.1333333333333, "x": "調べた研究班が、その結果を発表しました。"}, {"t": 771.6166666666667, "x": "ヤンガードリアスから、次の暖かい時期へ"}, {"t": 774.45, "x": "移るところで、雪の量は、およそ倍になっていました。"}, {"t": 778.2333333333333, "x": "一年に七センチメートルほどだったものが、"}, {"t": 780.8666666666667, "x": "十四センチメートルほどへ。"}, {"t": 782.9333333333333, "x": "しかも、その変化にかかった時間は、一年から"}, {"t": 786.6166666666667, "x": "三年ほどだった可能性がある、というのです。"}, {"t": 789.7666666666667, "x": "層を一枚ずつ見ていくと、まず、寒い側と"}, {"t": 793.95, "x": "暖かい側のあいだを、行ったり来たりするような"}, {"t": 797.1333333333333, "x": "揺れが見えます。研究者たちは、"}, {"t": 799.6333333333333, "x": "これを「ちらつき」と呼びました。"}, {"t": 802.2833333333333, "x": "その揺れのあと、雪の量は三年ほどで倍を"}, {"t": 805.3833333333333, "x": "少し超えるところまで増え、しかも、その増えた分の"}, {"t": 809.1833333333333, "x": "大部分は、ただ一年のうちに起きたように読めます。"}, {"t": 812.5666666666667, "x": "もちろん、慎重な見方もあります。"}, {"t": 815.3, "x": "雪は風で吹きだまりになることがあり、"}, {"t": 817.55, "x": "一年ぶんの層を読み違える可能性もあります。"}, {"t": 821.0, "x": "論文の筆頭著者のリチャード・アレイは、"}, {"t": 823.3833333333333, "x": "のちの論文で、この読み方を"}, {"t": 825.75, "x": "言い張ることはできない、と自ら書いています。"}, {"t": 828.6666666666666, "x": "それでも、一年で終わった可能性があるというだけで、"}, {"t": 832.3166666666667, "x": "考えさせられる、とも書いています。"}, {"t": 835.1666666666666, "x": "ちりの記録も、別の角度から、同じ速さを示しました。"}, {"t": 839.4666666666667, "x": "グリップ計画のコアで、ちりの量を、季節の"}, {"t": 842.8666666666667, "x": "変化が見えるほど細かく測った研究があります。"}, {"t": 845.9166666666666, "x": "冬の層だけを追うと、ヤンガードリアスの"}, {"t": 848.7666666666667, "x": "終わりは、わずか一年から二年で起きていました。"}, {"t": 851.9666666666667, "x": "夏の層では、二十年から三十年かかっていました。"}, {"t": 855.7166666666667, "x": "同じ終わりでも、季節によって、"}, {"t": 858.0833333333334, "x": "切り替わりの速さが違っていたのです。"}, {"t": 860.7166666666667, "x": "変わったのは、雪とちりだけではありません。"}, {"t": 863.6333333333333, "x": "ヤンガードリアスが終わるとき、グリーンランドの"}, {"t": 866.5666666666667, "x": "中央部では、次のような変化が重なっていました。"}, {"t": 869.9666666666667, "x": "海から飛んでくる塩の量が、三分の一ほどに減りました。"}, {"t": 873.9833333333333, "x": "大陸から飛んでくる細かいちりは、"}, {"t": 876.15, "x": "四分の一から七分の一ほどに減りました。"}, {"t": 879.3333333333334, "x": "粒の大きなちりほど、減り方が大きくなっていました。"}, {"t": 882.9333333333333, "x": "これは、風が弱まり、遠くの乾いた土地の"}, {"t": 886.4, "x": "様子も変わったことを示しています。"}, {"t": 888.5166666666667, "x": "雪の量、ちり、塩。どれも、数年から数十年のうちに、"}, {"t": 893.95, "x": "別の世界の値へ移っていました。"}, {"t": 896.4166666666666, "x": "では、気温そのものは、どれだけの速さで上がったのか。"}, {"t": 900.5, "x": "それを確かめるために、研究者たちは、"}, {"t": 903.35, "x": "氷ではなく、氷の中の空気に目を向けます。"}, {"t": 906.9666666666667, "x": "氷の中の空気の泡を、温度計として使う。"}, {"t": 910.4, "x": "この考え方を使って、ヤンガードリアスの"}, {"t": 913.3833333333333, "x": "終わりを調べたのが、ジェフリー・"}, {"t": 915.4, "x": "セベリングハウスたちの研究班です。"}, {"t": 917.7, "x": "発表は、1998年でした。"}, {"t": 918.9, "x": "1998年█"}, {"t": 921.6, "x": "しくみは、こうです。氷床の表面近くには、まだ氷になり"}, {"t": 926.2833333333333  "x": "揺れ動くため、農業には向かなかったとされています。"}, {"t": 1971.7333333333333, "x": "そして、最後の気候の好転のあと、"}, {"t": 1974.45, "x": "いくつかの地域で、植物に強く頼る暮らしが"}, {"t": 1977.9166666666667, "x": "すぐに現れた、と指摘しています。"}, {"t": 1980.4333333333334, "x": "これは、あくまで一つの仮説です。"}, {"t": 1983.0333333333333, "x": "農業がなぜ、どこで、どのように始まったのかには、"}, {"t": 1987.05, "x": "ほかにも多くの考え方があります。"}, {"t": 1989.5, "x": "それでも、はっきりしていることがあります。"}, {"t": 1992.3, "x": "畑を耕すことも、町をつくることも、文字を"}, {"t": 1995.9666666666667, "x": "書くことも、人間が積み上げてきたものの"}, {"t": 1998.6, "x": "大部分は、あの線よりも上の、穏やかな氷が"}, {"t": 2002.2166666666667, "x": "積もっていた時間の中で起きました。"}, {"t": 2004.2833333333333, "x": "その下には、千年あまりの寒さと、数年で"}, {"t": 2007.8666666666666, "x": "入れ替わった空と、そしてさらに深く、"}, {"t": 2010.4166666666667, "x": "何度も寒さと暖かさを行き来した、"}, {"t": 2013.05, "x": "落ち着かない時代の雪が重なっています。"}, {"t": 2015.7, "x": "一年に七センチメートルほどだった雪が、"}, {"t": 2018.35, "x": "ある年を境に、倍の厚さで積もりはじめた。"}, {"t": 2021.9666666666667, "x": "千年あまり続いた寒さの終わりは、氷の中で、"}, {"t": 2025.5666666666666, "x": "わずか数枚の層の違いとして読み取れます。"}, {"t": 2028.65, "x": "気候が別の姿に変わるのに、必ずしも長い時間は要らない。"}, {"t": 2032.95, "x": "グリーンランドの氷は、そのことを、"}, {"t": 2035.4666666666667, "x": "一年ずつ数えられる形で差し出しています。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
