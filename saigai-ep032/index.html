<script>
const D={"name": "ep032", "file": "ep032", "dur": 1893.51665625, "segs": [], "subs": [{"t": 0.0, "x": "今からおよそ3億7200万年前のことです。"}, {"t": 3.533333333333333, "x": "舞台は、デボン紀の終わりです。"}, {"t": 5.983333333333333, "x": "地球の海で生き物が大きく減りました。"}, {"t": 8.583333333333334, "x": "海の生き物の属のおよそ半分が姿を消したとされます。"}, {"t": 12.3, "x": "科でいえば、およそ5分の1です。"}, {"t": 14.833333333333334, "x": "とくに打撃を受けたのは暖かい浅い海でした。"}, {"t": 17.833333333333332, "x": "寒い海では、被害は小さめでした。"}, {"t": 20.716666666666665, "x": "海の底の大きな礁が崩れていきました。"}, {"t": 23.333333333333332, "x": "地質学では、デボン紀後期の大量絶滅と呼ばれます。"}, {"t": 27.316666666666666, "x": "ところが、原因ははっきりしていません。"}, {"t": 30.15, "x": "隕石の衝突を決めるしるしは確かめられていません。"}, {"t": 33.56666666666667, "x": "決め手になる火山の跡も、まだ見つかっていません。"}, {"t": 36.96666666666667, "x": "そのころ、陸の上では別の大きな変化が起きていました。"}, {"t": 40.81666666666667, "x": "地球に初めて森ができたのです。背の高い木が並びました。"}, {"t": 44.75, "x": "木は地面の下へ深く根を張りました。"}, {"t": 47.1, "x": "陸の森と、遠い海の異変。一見、"}, {"t": 50.0, "x": "関係がなさそうな二つです。"}, {"t": 52.5, "x": "陸と海は、遠く離れています。"}, {"t": 55.03333333333333, "x": "しかも、木は海に入りません。"}, {"t": 57.43333333333333, "x": "けれども、この二つをつなぐ説があります。"}, {"t": 60.43333333333333, "x": "木の根が岩をくだいて土をつくった。"}, {"t": 62.733333333333334, "x": "土から栄養が溶け出し、川で海へ運ばれた。"}, {"t": 66.33333333333333, "x": "海ではその栄養で藻が増えすぎた。"}, {"t": 68.66666666666667, "x": "そして海の酸素が足りなくなった。"}, {"t": 70.86666666666666, "x": "そういう筋書きです。陸から海へ、順に伝わる話です。"}, {"t": 75.28333333333333, "x": "1995年にアメリカの研究者たちが"}, {"t": 78.48333333333333, "x": "この考えを学会誌に書きました。"}, {"t": 80.61666666666666, "x": "題には「根っこ」という言葉がかけてありました。"}, {"t": 84.38333333333334, "x": "この回の主語は大地です。むき出しの"}, {"t": 86.71666666666667, "x": "岩だった大地が土におおわれていく。"}, {"t": 89.05, "x": "その変化が海にどう届いたのかをたどります。"}, {"t": 91.88333333333334, "x": "手がかりは三つです。どれも、岩に残った記録です。"}, {"t": 95.86666666666666, "x": "一つはニューヨーク州の石切り場から出た木の化石です。"}, {"t": 99.31666666666666, "x": "二つめはドイツの山の中にある黒い2枚の地層です。"}, {"t": 102.73333333333333, "x": "三つめは古い湖の底の岩に残る栄養のしるしです。"}, {"t": 106.56666666666666, "x": "ただし、この説は決まった答えではありません。"}, {"t": 109.85, "x": "火山を疑う研究者がいます。"}, {"t": 112.1, "x": "空から降りそそいだ紫外線を疑う研究者もいます。"}, {"t": 115.7, "x": "どこまでが確かで、どこからが仮説なのか。"}, {"t": 118.63333333333334, "x": "その線を引きながら進みます。"}, {"t": 120.75, "x": "最後は今の森の足もとを見に行きます。"}, {"t": 123.41666666666667, "x": "時計をさらに古い時代まで戻します。"}, {"t": 125.88333333333334, "x": "デボン紀が始まるのはおよそ4億1900万年前です。"}, {"t": 129.81666666666666, "x": "その前の長い時代、陸の景色は今とまるで違いました。"}, {"t": 133.76666666666668, "x": "草も木もありません。土も、ほとんどありません。"}, {"t": 137.11666666666667, "x": "むき出しの岩の土地がどこまでも続いていました。"}, {"t": 140.03333333333333, "x": "1995年の論文はその景色をこう説明しています。"}, {"t": 144.43333333333334, "x": "植物が広がる前の陸には裸の岩肌が広く続いていた。"}, {"t": 148.51666666666668, "x": "その上には微生物がつくる薄い"}, {"t": 150.65, "x": "皮のような層があるだけだった。"}, {"t": 152.56666666666666, "x": "今の砂漠の地面に見られる膜のようなものです。"}, {"t": 155.53333333333333, "x": "雨が降れば岩くずはそのまま流されていきました。"}, {"t": 158.65, "x": "根で土を押さえるものがなかったからです。"}, {"t": 161.11666666666667, "x": "陸に植物が現れたのはオルドビス紀の終わりごろです。"}, {"t": 164.48333333333332, "x": "あるいはシルル紀の初めとされます。"}, {"t": 166.65, "x": "ただ、初めの植物はとても小さなものでした。"}, {"t": 170.05, "x": "背丈は低く、根も浅いものでした。"}, {"t": 172.78333333333333, "x": "しかも湿った低い土地にしか住めませんでした。"}, {"t": 175.66666666666666, "x": "水辺から離れられなかったのです。"}, {"t": 177.73333333333332, "x": "それでも、少しずつ広がりました。"}, {"t": 180.3, "x": "これでは大地の姿を変えるほどの力はありません。"}, {"t": 183.53333333333333, "x": "変化が大きくなるのはデボン紀の中ごろからです。"}, {"t": 186.6, "x": "植物の体の中に、自分を支えるかたい組織ができました。"}, {"t": 190.91666666666666, "x": "木の幹のような太く丈夫な体です。"}, {"t": 193.35, "x": "こうして植物は上へ上へと伸び始めます。"}, {"t": 196.05, "x": "すると、根の形も変わります。"}, {"t": 198.46666666666667, "x": "背が高くなれば、倒れないように根も深くなります。"}, {"t": 201.98333333333332, "x": "根が深くなれば地下の岩にまで届きます。"}, {"t": 204.56666666666666, "x": "1995年の論文はこの変化を二つにまとめています。"}, {"t": 208.93333333333334, "x": "一つは木と呼べる大きさになったことです。"}, {"t": 211.5, "x": "もう一つは種をつくるようになったことです。"}, {"t": 214.23333333333332, "x": "種があれば水辺から離れた乾いた土地にも広がれます。"}, {"t": 217.71666666666667, "x": "この二つで地下の根の量が一気に増えた。"}, {"t": 220.31666666666666, "x": "論文はそう考えました。では、根は何をしたのでしょう。"}, {"t": 224.55, "x": "根の量が大事なのは、根が岩に働きかけるからです。"}, {"t": 228.21666666666667, "x": "根は岩のすき間に入りこみます。"}, {"t": 230.36666666666667, "x": "そして根から出る酸で岩を少しずつ溶かします。"}, {"t": 233.33333333333334, "x": "岩はくだけて細かくなり、やがて土になります。"}, {"t": 236.6, "x": "むき出しの岩の大地が土の衣を着ていく。"}, {"t": 239.38333333333333, "x": "デボン紀は、陸がその衣を着始めた時代でした。"}, {"t": 242.9, "x": "では最初の森は本当にあったのでしょうか。"}, {"t": 245.75, "x": "それを確かめる化石がアメリカの東部で見つかっています。"}, {"t": 249.23333333333332, "x": "ニューヨーク州の東部にキャッツキル山地という"}, {"t": 251.93333333333334, "x": "山並みがあります。その北の端に"}, {"t": 254.0, "x": "ギルボアという小さな町があります。"}, {"t": 256.35, "x": "町のそばの川には、ニューヨーク市の"}, {"t": 258.93333333333334, "x": "水をためるダムがあります。"}, {"t": 260.51666666666665, "x": "1919年、市の水道の部署がこのダムの工事を始めました。"}, {"t": 265.51666666666665, "x": "ダムをつくるには大量の石が要ります。"}, {"t": 267.96666666666664, "x": "工事の人たちは近くの石切り場で岩を切り出していました。"}, {"t": 271.4166666666667, "x": "1920年、その石切り場で不思議なものが出てきました。"}, {"t": 275.8833333333333, "x": "木の切り株のような形をした石です。"}, {"t": 278.31666666666666, "x": "しかも一つではありません。"}, {"t": 280.06666666666666, "x": "いくつも、いくつも出てきました。"}, {"t": 282.2, "x": "いくつもの切り株が立ったままの姿で並んでいました。"}, {"t": 285.45, "x": "木が生えていた位置のまま石の型になっていたのです。"}, {"t": 288.43333333333334, "x": "実はこの町では前にも似た化石が見つかっていました。"}, {"t": 291.8333333333333, "x": "1850年代と1869年にも"}, {"t": 295.2, "x": "小さな発見があったと記録されています。"}, {"t": 297.75, "x": "けれども、これほどまとまって出たのは初めてでした。"}, {"t": 301.0833333333333, "x": "この切り株を詳しく調べた人がいます。"}, {"t": 303.7, "x": "ニューヨーク州立博物館のゴールドリングさんです。"}, {"t": 306.9166666666667, "x": "アメリカで初めての女性の州古生物学者でした。"}, {"t": 310.23333333333335, "x": "ゴールドリングさんは切り株の木に名前をつけました。"}, {"t": 313.3666666666667, "x": "これは、大きな仕事でした。"}, {"t": 315.6333333333333, "x": "エオスペルマトプテリスという名前です。"}, {"t": 317.98333333333335, "x": "そして1924年に論文を書きました。"}, {"t": 321.2, "x": "博物館では切り株を並べた展示もつくられました。"}, {"t": 324.51666666666665, "x": "こうして「ギルボアの森」は"}, {"t": 326.8833333333333, "x": "世界に知られるようになります。"}, {"t": 328.65, "x": "切り株の年代はおよそ3億8000万年前です。"}, {"t": 332.1666666666667, "x": "デボン紀の中ごろにあたります。"}, {"t": 334.1333333333333, "x": "当時としては地球でいちばん古い森の跡でした。"}, {"t": 337.23333333333335, "x": "ただ、切り株だけでは木の全体の姿はわかりません。"}, {"t": 340.93333333333334, "x": "幹の上の方がどうなっていたのか。"}, {"t": 343.1166666666667, "x": "葉はどんな形だったのか。根は、どこまで伸びていたのか。"}, {"t": 347.0833333333333, "x": "手がかりは少しずつ集められていきました。"}, {"t": 349.68333333333334, "x": "2019年の研究を伝えた記事は、"}, {"t": 352.3666666666667, "x": "この木をヤシに似た植物と説明しています。"}, {"t": 355.4166666666667, "x": "そして、その根は短いものでした。"}, {"t": 358.1166666666667, "x": "ダムの改修工事が始まると、"}, {"t": 360.0833333333333, "x": "同じ石切り場で新しい発見もありました。"}, {"t": 363.23333333333335, "x": "ギルボアの森は長いあいだ最古の森とされてきました。"}, {"t": 366.5, "x": "ところが2019年、その記録が"}, {"t": 369.26666666666665, "x": "近くの町で塗り替えられます。"}, {"t": 371.01666666666665, "x": "ギルボアから40キロほど離れた別の石切り場でした。"}, {"t": 374.48333333333335, "x": "その町の名前はカイロです。"}, {"t": 376.4166666666667, "x": "エジプトの首都と同じ名前ですが、"}, {"t": 378.55, "x": "ニューヨーク州の小さな町です。"}, {"t": 380.9166666666667, "x": "町の近くに使われなくなった砂岩の石切り場がありました。"}, {"t": 384.5, "x": "ここで古い森の跡が見つかりました。"}, {"t": 386.8333333333333, "x": "木の幹は、残っていません。"}, {"t": 389.01666666666665, "x": "残っていたのは、根の跡です。"}, {"t": 391.31666666666666, "x": "調べたのはビンガムトン大学のスタインさんたちです。"}, {"t": 394.6166666666667, "x": "イギリスのカーディフ大学のベリーさんも加わりました。"}, {"t": 397.81666666666666, "x": "2019年の12月、研究の結果が学術誌に発表されます。"}, {"t": 402.9166666666667, "x": "年代はおよそ3億8600万年前です。"}, {"t": 406.3833333333333, "x": "ギルボアの森よりも古いとされました。"}, {"t": 408.68333333333334, "x": "石切り場の平らな岩の面には"}, {"t": 410.5833333333333, "x": "木の根の跡が多く残っていました。"}, {"t": 412.68333333333334, "x": "研究チームはそこに3種類の根を見分けました。"}, {"t": 415.81666666666666, "x": "一つはギルボアと同じヤシのような木の根です。"}, {"t": 418.68333333333334, "x": "こちらの根は短いものでした。"}, {"t": 420.68333333333334, "x": "木は一、二年で入れかわるような"}, {"t": 423.1333333333333, "x": "暮らし方だったとされます。"}, {"t": 424.68333333333334, "x": "もう一つは正体のわからない根でした。"}, {"t": 427.15, "x": "そして三つめがアーケオプテリスという木の根です。"}, {"t": 430.15, "x": "アーケオプテリスは今の針葉樹に似た特徴を持つ木です。"}, {"t": 433.85, "x": "この木の根はとても長く伸びていました。"}, {"t": 436.18333333333334, "x": "場所によっては11メートルを"}, {"t": 438.1166666666667, "x": "超えていたと報じられています。"}, {"t": 439.9166666666667, "x": "スタインさんは、この根について"}, {"t": 442.1166666666667, "x": "慎重な言い方をしています。"}, {"t": 443.9166666666667, "x": "見つかったのは、いわば足あとだけだと。"}, {"t": 446.68333333333334, "x": "慎重な、研究者らしい言葉です。"}, {"t": 449.5833333333333, "x": "この時代のアーケオプテリスの体の化石は、"}, {"t": 452.3333333333333, "x": "まだ見つかっていないからです。"}, {"t": 454.31666666666666, "x": "根の形から、そう判断しているということです。"}, {"t": 457.6333333333333, "x": "それでも、この発見の意味は小さくありません。"}, {"t": 461.0, "x": "3億8600万年前に、すでに長い根を張る木がいた。"}, {"t": 465.48333333333335, "x": "その可能性が化石で示されたのです。"}, {"t": 468.05, "x": "アーケオプテリスはその後、陸に大きく広がっていきます。"}, {"t": 471.98333333333335, "x": "1995年の論文によれば、デボン紀後期の"}, {"t": 476.05, "x": "陸で一番多い木になりました。"}, {"t": 477.95, "x": "論文は、高さ30メートルほどまで育ったとしています。"}, {"t": 482.01666666666665, "x": "川沿いだけではありません。"}, {"t": 483.75, "x": "川があふれると水につかる平らな土地にも、"}, {"t": 486.3833333333333, "x": "おそらく森をつくりました。"}, {"t": 488.21666666666664, "x": "カイロの森には鳥はいませんでした。"}, {"t": 490.48333333333335, "x": "背骨のある動物も、まだ陸には上がっていません。"}, {"t": 494.01666666666665, "x": "ベリーさんは当時の森を一言でこう表しています。"}, {"t": 497.3833333333333, "x": "鳥の声はない。木々のあいだを風が渡るだけだ。"}, {"t": 500.5833333333333, "x": "静かな森でした。虫は、いたかもしれません。"}, {"t": 504.06666666666666, "x": "けれども、それだけです。けれども、"}, {"t": 506.65, "x": "その地下では根が働き続けていました。"}, {"t": 509.3833333333333, "x": "岩をくだく仕事を、休まず続けていたのです。"}, {"t": 512.75, "x": "ここからは根が大地にしたことを詳しく見ていきます。"}, {"t": 515.9666666666667, "x": "1995年の論文を書いたのは四人の研究者です。"}, {"t": 520.3, "x": "中心になったのはシンシナティ大学のアルジオさんです。"}, {"t": 523.7, "x": "イエール大学のバーナーさんも加わりました。"}, {"t": 526.4666666666667, "x": "二酸化炭素の長い歴史を調べていた研究者です。"}, {"t": 529.9, "x": "植物の化石にくわしいシェクラーさんもいました。"}, {"t": 532.9, "x": "四人は根が岩をどう変えるかに注目しました。"}, {"t": 535.8833333333333, "x": "根が岩に働きかける方法は大きく三つあります。"}, {"t": 539.3333333333334, "x": "一つめは酸です。酸は、弱いものです。"}, {"t": 542.85, "x": "けれども、休みません。根は酸を出します。"}, {"t": 546.2666666666667, "x": "酸は岩の中の鉱物を少しずつ溶かします。"}, {"t": 549.3666666666667, "x": "二つめは水です。水は、岩のすき間にしみこみます。"}, {"t": 553.4166666666666, "x": "土は水をたくわえます。岩が"}, {"t": 555.3333333333334, "x": "水にふれている時間が長くなります。"}, {"t": 557.85, "x": "そのぶん、岩は溶けやすくなります。"}, {"t": 560.5333333333333, "x": "三つめは空気の中の二酸化炭素です。"}, {"t": 563.1666666666666, "x": "根が広がると、大気の二酸化炭素が"}, {"t": 565.9666666666667, "x": "土の中へ送りこまれます。論文はこれを、"}, {"t": 568.7333333333333, "x": "ポンプでくみこむようだと表しています。"}, {"t": 571.5, "x": "二酸化炭素は水に溶けて弱い酸になります。"}, {"t": 574.4333333333333, "x": "これも岩を溶かします。こうして"}, {"t": 576.4333333333333, "x": "岩が溶けることを化学的な風化といいます。"}, {"t": 579.1, "x": "風化とは、岩が少しずつ形を失うことです。"}, {"t": 582.7, "x": "論文は、根の量が急に増えて"}, {"t": 585.0666666666667, "x": "土づくりが速まったと考えました。"}, {"t": 587.2833333333333, "x": "速まったのは一時のことです。"}, {"t": 589.2333333333333, "x": "けれども、深い土の層は厚く広く残るようになりました。"}, {"t": 593.15, "x": "土の中身が変わったしるしもあります。"}, {"t": 595.5333333333333, "x": "石炭紀の初めのころ、地層の粘土の種類が変わりました。"}, {"t": 599.5, "x": "よく風化が進んだ土にできる粘土が増えていったのです。"}, {"t": 603.0333333333333, "x": "ただし、できたばかりの土は"}, {"t": 604.8833333333333, "x": "安定していませんでした。根はまだまばらで、"}, {"t": 607.8833333333333, "x": "土をしっかり押さえるほどではありません。"}, {"t": 610.65, "x": "干ばつや山くずれ、野火が起きれば土は流されます。"}, {"t": 614.5, "x": "川が運ぶ土砂も一時的に増えたと論文は考えました。"}, {"t": 618.25, "x": "ここで大事なのは、岩が溶けると何が出てくるかです。"}, {"t": 621.8666666666667, "x": "岩の中には生き物の栄養になる成分もふくまれています。"}, {"t": 625.55, "x": "その代表がリンという成分です。"}, {"t": 627.8666666666667, "x": "リンは、生き物の体に欠かせません。"}, {"t": 630.6333333333333, "x": "リンは畑にまく肥料の大事な成分でもあります。"}, {"t": 633.85, "x": "岩が溶ければリンも水の中へ溶け出します。"}, {"t": 636.5833333333334, "x": "むき出しの岩の時代には、この動きはゆっくりでした。"}, {"t": 640.15, "x": "根が深く広がると、溶け出す量が増えていきます。"}, {"t": 643.6666666666666, "x": "溶け出した栄養は雨水に乗って川に集まります。"}, {"t": 646.9166666666666, "x": "川はその栄養を海へ運んでいきます。"}, {"t": 649.5833333333334, "x": "陸の森が遠い海に肥料を流しこむ。"}, {"t": 652.1666666666666, "x": "1995年の論文が描いたのは、"}, {"t": 655.2, "x": "そうした大地と海のつながりでした。"}, {"t": 657.6, "x": "では、その肥料を受け取った"}, {"t": 659.7, "x": "海では何が起きたのでしょうか。"}, {"t": 661.5833333333334, "x": "川が運ぶ栄養は本当に増えたのでしょうか。"}, {"t": 664.6833333333333, "x": "それを確かめるのは簡単ではありません。"}, {"t": 667.3, "x": "3億7000万年前の川の水はくめないからです。"}, {"t": 670.95, "x": "そこで、別の手を使います。"}, {"t": 673.2833333333333, "x": "研究者たちは古い湖の底に目をつけました。"}, {"t": 676.4833333333333, "x": "湖の底には、まわりの土地から"}, {"t": 678.95, "x": "流れこんだものが積もります。"}, {"t": 680.6833333333333, "x": "その層は、やがて岩になります。"}, {"t": 683.2, "x": "岩の成分を調べれば、陸から"}, {"t": 685.6333333333333, "x": "何が流れてきたかがわかります。"}, {"t": 687.5833333333334, "x": "2022年、アメリカのインディアナ大学の"}, {"t": 690.8, "x": "研究チームが結果を発表しました。"}, {"t": 693.2166666666667, "x": "中心はフィリッペリさんと、"}, {"t": 694.95, "x": "研究室の学生だったスマートさんです。"}, {"t": 697.9166666666666, "x": "調べたのはデボン紀の湖の底にたまった岩です。"}, {"t": 701.2666666666667, "x": "場所はグリーンランドと、スコットランドの北東の沖です。"}, {"t": 704.95, "x": "チームは岩にふくまれるリンの"}, {"t": 706.6833333333333, "x": "量を時代を追って測りました。"}, {"t": 708.5, "x": "根の働きで土ができたしるしも調べました。"}, {"t": 711.3, "x": "すると、リンの量には増えたり"}, {"t": 713.4833333333333, "x": "減ったりする周期がありました。"}, {"t": 715.3166666666667, "x": "波のような、くり返しです。"}, {"t": 717.5833333333334, "x": "その周期は、湿った時期と乾いた"}, {"t": 720.1666666666666, "x": "時期の入れかわりと重なっていました。"}, {"t": 722.1833333333333, "x": "しかも乾いた時期の方がリンが多くなっていたのです。"}, {"t": 725.4, "x": "チームはこれを次のように読み解きました。"}, {"t": 727.9166666666666, "x": "湿った時期には根がよく育つ。"}, {"t": 730.0, "x": "根は土の中に栄養をためこむ。"}, {"t": 732.2, "x": "乾いた時期になると根が枯れて腐る。"}, {"t": 734.4, "x": "そして、たまっていた栄養が水へ出ていく。"}, {"t": 737.5, "x": "根は栄養を吸い上げる役と、"}, {"t": 739.3833333333333, "x": "吐き出す役の両方をしていたのです。"}, {"t": 741.9333333333333, "x": "こうした変化は最初の木の根が"}, {"t": 743.8166666666667, "x": "現れた時期と重なっていました。"}, {"t": 745.75, "x": "チームは、陸から水へ移った"}, {"t": 748.0333333333333, "x": "リンの量と時期を計算しました。"}, {"t": 750.05, "x": "その規模と時期を数字で示した"}, {"t": 752.0166666666667, "x": "研究は、まだ少ないとされます。"}, {"t": 754.5166666666667, "x": "フィリッペリさんは大学の発表でこう述べています。"}, {"t": 757.65, "x": "木の根の進化が、昔の海を栄養で"}, {"t": 760.4666666666667, "x": "あふれさせた可能性が高い。"}, {"t": 762.3, "x": "ただし、この研究にも注意すべき点があります。"}, {"t": 765.9, "x": "一つの研究で、話は決まりません。"}, {"t": 768.85, "x": "リンが増えた時期や量は、場所ごとに"}, {"t": 771.3333333333334, "x": "そろっていませんでした。湖ごとに"}, {"t": 773.4333333333333, "x": "少しずつずれがあったのです。"}, {"t": 775.2833333333333, "x": "湖の記録が、そのまま海の変化を示すとも限りません。"}, {"t": 779.4833333333333, "x": "それでも、根と水の中の栄養を"}, {"t": 781.9333333333333, "x": "つなぐ手がかりが一つ増えました。"}, {"t": 783.8833333333333, "x": "1995年の仮説が、別の方法で確かめられ始めたのです。"}, {"t": 788.9666666666667, "x": "大学の発表は、今の木との違いも説明しています。"}, {"t": 792.8666666666667, "x": "今の木が同じことを起こさないのは、"}, {"t": 795.0, "x": "深い土が栄養をためておくからだ。"}, {"t": 797.5666666666667, "x": "デボン紀の土はまだ薄く、若い土でした。"}, {"t": 800.8, "x": "栄養を抱えておく力は、今より"}, {"t": 803.4833333333333, "x": "ずっと弱かったと考えられます。"}, {"t": 805.5, "x": "だから根が枯れれば、栄養はすぐに流れ出したのでしょう。"}, {"t": 809.3, "x": "見えない肥料は、こうして川から海へ向かいました。"}, {"t": 812.7, "x": "次は、その行き先の海を見ていきます。"}, {"t": 815.5833333333334, "x": "デボン紀の地球には今とは違う海がありました。"}, {"t": 818.7166666666667, "x": "大陸の上に海水が浅く入りこんでいたのです。"}, {"t": 821.8666666666667, "x": "陸地のまん中まで広がる浅い海です。"}, {"t": 824.5166666666667, "x": "1995年の論文は、これを"}, {"t": 827.5666666666667, "x": "半分閉じた大陸の上の海と呼んでいます。"}, {"t": 830.25, "x": "外の大きな海との水の行き来は盛んではありませんでした。"}, {"t": 833.9666666666667, "x": "そこへ川から栄養が流れこんだら、何が起きるでしょうか。"}, {"t": 838.0333333333333, "x": "栄養が増えると、まず海の藻が増えます。"}, {"t": 841.2333333333333, "x": "藻は、栄養が大好きです。小さな藻が"}, {"t": 844.0833333333334, "x": "海の表面で一気に増えるのです。"}, {"t": 846.6, "x": "これを藻が大発生するといいます。"}, {"t": 848.9, "x": "増えた藻はやがて死んで、海の底へ沈んでいきます。"}, {"t": 852.7166666666667, "x": "沈んだ藻は微生物に分解されます。"}, {"t": 855.3166666666667, "x": "このとき微生物は水の中の酸素を使います。"}, {"t": 858.5, "x": "藻が多いほど、分解に使われる酸素も多くなります。"}, {"t": 862.1833333333333, "x": "水の行き来が少ない海では、酸素がなかなか補われません。"}, {"t": 866.3166666666667, "x": "こうして海の底の方から酸素が足りなくなっていきます。"}, {"t": 869.7166666666667, "x": "いわば海の中で酸素の取り合いが起きるのです。"}, {"t": 872.6833333333333, "x": "負けるのは、海の底の生き物です。"}, {"t": 875.3333333333334, "x": "逃げ場が、ないからです。酸素がない海の"}, {"t": 878.3833333333333, "x": "底では、死んだ藻が分解されずに残ります。"}, {"t": 881.6, "x": "その藻をふくんだ泥は黒い色をしています。"}, {"t": 884.3166666666667, "x": "泥はやがて固まって黒い頁岩になります。"}, {"t": 887.0333333333333, "x": "頁岩とは、本のページのように薄くはがれる岩のことです。"}, {"t": 891.05, "x": "デボン紀の後半の地層には、この黒い頁岩が多くあります。"}, {"t": 895.3, "x": "北アメリカの東部にあります。"}, {"t": 897.2166666666667, "x": "北アメリカの中部から西部にもあります。"}, {"t": 899.8333333333334, "x": "ヨーロッパにもあります。つまり、"}, { const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
