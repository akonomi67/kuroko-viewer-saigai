<script>
const D={"name": "ep016", "file": "ep016", "dur": 1972.6833125, "segs": [], "subs": [{"t": 0.0, "x": "七万四千年前の噴火について、いまでは、それが"}, {"t": 4.2, "x": "起きた季節まで分かるようになっています。"}, {"t": 6.5, "x": "北半球の、冬でした。東アフリカの"}, {"t": 9.466666666666667, "x": "熱帯で得られた、一年よりも"}, {"t": 11.883333333333333, "x": "細かく読み分けられる記録があります。"}, {"t": 14.1, "x": "それをもとに、2026年の研究がそう報告しています。"}, {"t": 15.483333333333333, "x": "2026年█"}, {"t": 19.233333333333334, "x": "噴火したのは、インドネシアの"}, {"t": 21.65, "x": "スマトラ島にある、トバという火山です。"}, {"t": 23.116666666666667, "x": "トバ█"}, {"t": 24.816666666666666, "x": "いまからおよそ7万4000年前のことです。"}, {"t": 26.15, "x": "7万4000年前█"}, {"t": 28.8, "x": "この噴火は、ここ二百万年あまりの地球で、"}, {"t": 32.15, "x": "陸の上で起きた最大級の噴火とされています。"}, {"t": 35.483333333333334, "x": "灰は、インド洋を越えて、アフリカにまで降りました。"}, {"t": 39.61666666666667, "x": "そして、この噴火には、長いあいだ、"}, {"t": 42.56666666666667, "x": "ひとつの重い疑いがかけられてきました。"}, {"t": 45.233333333333334, "x": "人類を、絶滅の寸前まで追いこんだのではないか、という"}, {"t": 49.65, "x": "疑いです。噴火で空が暗くなり、"}, {"t": 52.3, "x": "地球が冷えこみ、食べ物が消える。"}, {"t": 55.13333333333333, "x": "私たちの祖先はそのとき、ごくわずかな"}, {"t": 58.1, "x": "数にまで減ってしまった。この考えは、"}, {"t": 61.11666666666667, "x": "一九九〇年代の終わりに論文として"}, {"t": 63.78333333333333, "x": "示され、広く語られるようになりました。"}, {"t": 66.43333333333334, "x": "けれども、この二十年ほどで、"}, {"t": 68.63333333333334, "x": "確かめるための道具が大きく変わりました。"}, {"t": 71.51666666666667, "x": "目に見えないほど小さな灰のかけらを、遠く"}, {"t": 74.53333333333333, "x": "離れた地層から拾い出せるようになったのです。"}, {"t": 77.23333333333333, "x": "そのかけらが、ものさしになりました。"}, {"t": 79.83333333333333, "x": "灰の層の下と上で、気候は変わったのか。"}, {"t": 83.01666666666667, "x": "灰の層の下と上で、人の暮らしは途切れたのか。"}, {"t": 86.55, "x": "アフリカとインドの地層が、"}, {"t": 88.2, "x": "ひとつずつ答えを出しはじめています。"}, {"t": 90.71666666666667, "x": "空の高いところに上がった硫黄は、北の"}, {"t": 93.53333333333333, "x": "グリーンランドと南極の氷にも、跡を残しました。"}, {"t": 96.91666666666667, "x": "ここからは、地球の空に起きたことと、その疑いが"}, {"t": 100.71666666666667, "x": "どう確かめられてきたかを、順に見ていきます。"}, {"t": 103.76666666666667, "x": "話の中心に置くのは、火山と、地球をめぐる空気です。"}, {"t": 108.26666666666667, "x": "スマトラ島の北部に、トバ湖という大きな湖があります。"}, {"t": 110.16666666666667, "x": "トバ湖█"}, {"t": 113.21666666666667, "x": "この湖は、ふつうの湖とは成り立ちが違います。"}, {"t": 116.96666666666667, "x": "巨大な噴火で地下のマグマが一気に出ていき、"}, {"t": 119.7, "x": "空になった地下へ、地面が落ちこんでできたくぼみです。"}, {"t": 123.65, "x": "こうしたくぼみを、カルデラと呼びます。"}, {"t": 126.2, "x": "トバのカルデラは、長さおよそ百キロメートル、"}, {"t": 129.33333333333334, "x": "幅およそ三十キロメートルあります。"}, {"t": 132.0, "x": "そのくぼみに水がたまったものが、いまのトバ湖です。"}, {"t": 135.8, "x": "湖の真ん中には、サモシール島という島があります。"}, {"t": 137.25, "x": "サモシール島█"}, {"t": 140.15, "x": "この島は、湖に浮かんでいるわけではありません。"}, {"t": 143.58333333333334, "x": "噴火のあと、くぼみの底が、下から"}, {"t": 146.51666666666668, "x": "押し上げられて持ち上がった部分です。"}, {"t": 148.68333333333334, "x": "火山の床が、水の上まで顔を"}, {"t": 151.15, "x": "出している、ということになります。"}, {"t": 153.38333333333333, "x": "トバは、一度だけ噴火した火山ではありません。"}, {"t": 156.71666666666667, "x": "1991年█"}, {"t": 156.71666666666667, "x": "1991年に発表された研究は、過去百二十万年のあいだに、"}, {"t": 162.65, "x": "四回の大きな噴火があったことを示しました。"}, {"t": 166.08333333333334, "x": "噴火と噴火のあいだは、三十四万年から"}, {"t": 169.25, "x": "四十三万年ほど空いていました。"}, {"t": 171.35, "x": "その四回の中で、最後に起きた、"}, {"t": 173.96666666666667, "x": "いちばん大きな噴火が、この回の主役です。"}, {"t": 177.53333333333333, "x": "噴き出したものは、最新期トバ凝灰岩と呼ばれています。"}, {"t": 179.1, "x": "最新期トバ凝灰岩█"}, {"t": 182.05, "x": "凝灰岩とは、火山灰が固まってできた岩のことです。"}, {"t": 185.98333333333332, "x": "この噴火がいつ起きたのかは、長いあいだ、"}, {"t": 188.86666666666667, "x": "幅のある数字でしか言えませんでした。"}, {"t": 191.48333333333332, "x": "それを大きく絞りこんだのが、2012年の研究です。"}, {"t": 194.15, "x": "2012年█"}, {"t": 196.23333333333332, "x": "調べられたのは、噴火口から三百五十キロメートル離れた、"}, {"t": 200.51666666666668, "x": "マレーシアのレンゴン谷に積もった灰でした。"}, {"t": 203.41666666666666, "x": "灰の中にふくまれる小さな結晶を使い、岩の"}, {"t": 206.96666666666667, "x": "中の原子の変化から年代を割り出しています。"}, {"t": 209.83333333333334, "x": "結果は、七万三千八百八十年前。"}, {"t": 213.33333333333334, "x": "前後の誤差は、三百二十年ほどです。"}, {"t": 216.33333333333334, "x": "それまでの見積もりより、十倍ほど"}, {"t": 218.75, "x": "細かい数字になりました。この数字が"}, {"t": 221.06666666666666, "x": "細かくなったことには、大きな意味があります。"}, {"t": 224.06666666666666, "x": "同じころの地球は、千年ほどの単位で、寒い"}, {"t": 227.78333333333333, "x": "時期と暖かい時期を行き来していました。"}, {"t": 230.03333333333333, "x": "噴火の年代の誤差が、その行き来より"}, {"t": 232.7, "x": "大きいままでは、区別がつきません。"}, {"t": 235.25, "x": "噴火が寒さを呼んだのか、寒さの"}, {"t": 237.81666666666666, "x": "さなかに噴火したのか、です。"}, {"t": 240.15, "x": "年代が絞りこまれて、はじめて、"}, {"t": 242.56666666666666, "x": "その問いを立てられるようになったのです。"}, {"t": 245.03333333333333, "x": "同じ研究は、もう一つのことにも触れています。"}, {"t": 248.48333333333332, "x": "灰が採られた場所から六キロメートルのところに、"}, {"t": 251.3, "x": "灰に埋もれた石器の見つかった遺跡があります。"}, {"t": 254.55, "x": "もしその石器を作ったのが、"}, {"t": 256.35, "x": "私たちと同じ種の人類だったなら。"}, {"t": 258.93333333333334, "x": "七万四千年前には、すでに東南"}, {"t": 261.9, "x": "アジアまで来ていたことになる、と。"}, {"t": 264.3333333333333, "x": "ただし、これは「もし」のついた話として書かれています。"}, {"t": 269.2, "x": "噴火の大きさは、噴き出したものの量で比べます。"}, {"t": 272.6, "x": "アメリカ地質調査所、USGSの定義があります。"}, {"t": 276.5833333333333, "x": "一千立方キロメートルを超える量を噴き出す"}, {"t": 279.3333333333333, "x": "噴火を、超巨大噴火と呼んでいます。"}, {"t": 282.0, "x": "火山の噴火の規模を表す指数でいえば、"}, {"t": 284.7, "x": "いちばん上の、八にあたります。"}, {"t": 287.3, "x": "トバの噴火は、この基準を大きく超えています。"}, {"t": 290.65, "x": "USGSは、過去二百万年に巨大な噴火を起こした"}, {"t": 294.71666666666664, "x": "カルデラ火山として、トバを挙げています。"}, {"t": 297.4166666666667, "x": "並んでいるのは、アメリカのロングバレーや"}, {"t": 300.06666666666666, "x": "バイアス、ニュージーランドのタウポです。"}, {"t": 302.5, "x": "1991年█"}, {"t": 302.5, "x": "1991年の研究は、その量を、二千五百から"}, {"t": 307.8333333333333, "x": "三千立方キロメートルと見積もりました。"}, {"t": 310.5833333333333, "x": "2014年█"}, {"t": 310.5833333333333, "x": "2014年には、見直しの研究が出ています。"}, {"t": 314.8666666666667, "x": "空から降った灰と、地面を走った火砕流の"}, {"t": 318.25, "x": "両方を、あらためて足し合わせたものです。"}, {"t": 321.0833333333333, "x": "すき間を詰めた岩の量に直すと、"}, {"t": 323.18333333333334, "x": "およそ五千三百立方キロメートル。"}, {"t": 325.9, "x": "すき間をふくめた見かけの量では、"}, {"t": 327.9, "x": "およそ一万三千二百立方キロメートルとされました。"}, {"t": 331.7, "x": "見積もりは研究によって違います。"}, {"t": 334.05, "x": "この回では、どちらか一つに"}, {"t": 336.1333333333333, "x": "決めずに、両方を並べておきます。"}, {"t": 338.71666666666664, "x": "比べるための物差しとして、"}, {"t": 340.4166666666667, "x": "記録に残る噴火を一つ置いてみます。"}, {"t": 343.1166666666667, "x": "一八一五年、同じインドネシアの、"}, {"t": 346.2, "x": "タンボラという火山の噴火です。"}, {"t": 348.43333333333334, "x": "人の記録が残る時代では、最大の噴火とされています。"}, {"t": 352.48333333333335, "x": "その量は、岩に直しておよそ五十立方キロメートルでした。"}, {"t": 356.68333333333334, "x": "トバの見直された見積もりと比べると、百倍を超えます。"}, {"t": 360.51666666666665, "x": "噴煙の柱は、およそ四十二キロメートルの"}, {"t": 363.68333333333334, "x": "高さまで上がったと計算されています。"}, {"t": 366.01666666666665, "x": "タンボラの噴煙も、最大で四十三キロメートルまで"}, {"t": 369.76666666666665, "x": "上がったとされます。高さだけなら、"}, {"t": 372.06666666666666, "x": "二つはほとんど変わりません。"}, {"t": 373.96666666666664, "x": "違っていたのは、噴き出した"}, {"t": 375.8666666666667, "x": "量と、それが広がった範囲です。"}, {"t": 378.3333333333333, "x": "その高さで、灰は横へ横へと広がっていきました。"}, {"t": 382.05, "x": "2014年█"}, {"t": 382.05, "x": "2014年の研究によると、五ミリメートル以上の"}, {"t": 386.0, "x": "灰が積もった範囲は、およそ四千万平方キロメートル。"}, {"t": 390.25, "x": "インドでは、一センチメートルから"}, {"t": 392.53333333333336, "x": "十センチメートルの灰が積もったとされます。"}, {"t": 395.1, "x": "タイの周辺では、一センチメートルから"}, {"t": 397.8666666666667, "x": "三センチメートルほどです。"}, {"t": 399.48333333333335, "x": "インド洋をはさんだ東アフリカでも、厚さは"}, {"t": 402.6333333333333, "x": "およそ三センチメートルと見積もられています。"}, {"t": 405.25, "x": "中国の南東部や、ボルネオ島でも、一センチメートル"}, {"t": 409.4, "x": "足らずの灰が積もったと見積もられています。"}, {"t": 411.81666666666666, "x": "灰は、それ自体が、大地を覆う災害でした。"}, {"t": 415.6666666666667, "x": "けれども、地球全体の気候を"}, {"t": 417.93333333333334, "x": "考えるうえで、灰は主役ではありません。"}, {"t": 420.9166666666667, "x": "灰の粒は重く、比較的早く、"}, {"t": 423.51666666666665, "x": "地面や海に落ちてしまうからです。"}, {"t": 425.9, "x": "空に長くとどまって、太陽の光を"}, {"t": 428.7, "x": "さえぎり続けるのは、灰とは別のものです。"}, {"t": 431.6666666666667, "x": "次の章では、その正体を見ます。"}, {"t": 434.43333333333334, "x": "火山は、灰や岩と一緒に、ガスを噴き出します。"}, {"t": 438.4166666666667, "x": "その中に、二酸化硫黄という、"}, {"t": 440.76666666666665, "x": "硫黄をふくむガスがあります。"}, {"t": 442.98333333333335, "x": "このガスが、成層圏と呼ばれる空の"}, {"t": 445.6666666666667, "x": "高い層まで届いたとします。"}, {"t": 447.48333333333335, "x": "USGSの解説によると、ガスはそこで、"}, {"t": 450.8833333333333, "x": "すばやく細かい粒に変わります。"}, {"t": 453.2666666666  "一つで、姿を大きく変えます。"}, {"t": 937.9, "x": "共通しているのは、次の二つです。"}, {"t": 940.6, "x": "冷え込みは永久には続かないこと。"}, {"t": 942.85, "x": "そして、場所によって、まだらに現れること。"}, {"t": 946.3833333333333, "x": "ここで、話を人類の側に移します。"}, {"t": 949.3833333333333, "x": "ボトルネックという言葉があります。"}, {"t": 951.5, "x": "もとは、瓶の首のことです。"}, {"t": 953.7, "x": "瓶の中身は、細い首を通るときに、"}, {"t": 956.4166666666666, "x": "一度にわずかしか出てきません。"}, {"t": 958.5833333333334, "x": "生き物の集団の数が、ある時期に大きく減り、"}, {"t": 961.9, "x": "その少ない数から、また増えていくこと。"}, {"t": 965.1, "x": "それを、この瓶の首にたとえて、ボトルネックと呼びます。"}, {"t": 969.2666666666667, "x": "一度大きく減った集団は、そのあと数が"}, {"t": 972.3166666666667, "x": "戻っても、遺伝の多様さが少ないまま残ります。"}, {"t": 975.6666666666666, "x": "遺伝の研究からは、ひとつの考えが出ていました。"}, {"t": 979.1833333333333, "x": "人類の祖先は、過去のどこかで大きく数を"}, {"t": 982.3, "x": "減らしたのではないか、というものです。"}, {"t": 984.7833333333333, "x": "一九九三年には、遺伝の研究者たちが、"}, {"t": 988.7166666666667, "x": "ひとつのモデルを示していました。"}, {"t": 990.8166666666667, "x": "現生人類は、十万年前ごろに限られた場所から"}, {"t": 994.5833333333334, "x": "各地へ広がり、そのあと、いくつもの集団が数を減らした。"}, {"t": 999.0333333333333, "x": "そして五万年前ごろ、各地で"}, {"t": 1001.35, "x": "急に増えはじめた、というものです。"}, {"t": 1003.85, "x": "1998年█"}, {"t": 1003.85, "x": "1998年、アメリカの大学の人類学者、スタンリー・"}, {"t": 1009.0166666666667, "x": "アンブローズが、ここに火山を結びつけました。"}, {"t": 1011.9833333333333, "x": "最後の氷期が本格的になる前、七万一千年前から"}, {"t": 1016.2333333333333, "x": "七万年前ごろに、およそ千年続く、特に寒い時期があった。"}, {"t": 1021.0666666666667, "x": "その寒さは、トバの噴火によってもたらされたらしい。"}, {"t": 1024.6666666666667, "x": "トバの火山の冬が、現生人類の"}, {"t": 1027.2666666666667, "x": "集団の大部分を減らしたのではないか。"}, {"t": 1029.6833333333334, "x": "アンブローズは、そう論じました。"}, {"t": 1032.0333333333333, "x": "生き残りやすかったのは、寒さの"}, {"t": 1034.3166666666666, "x": "中でも暖かさの残る、熱帯の避難所です。"}, {"t": 1037.6166666666666, "x": "中でも、いちばん大きな避難所は、赤道に近い"}, {"t": 1041.45, "x": "アフリカだったはずだ、とも書いています。"}, {"t": 1044.0, "x": "では、集団が瓶の首を抜けて、"}, {"t": 1046.5833333333333, "x": "ふたたび増えはじめたのはいつか。"}, {"t": 1048.7333333333333, "x": "アンブローズは、二つの時期を挙げました。"}, {"t": 1051.5666666666666, "x": "特に寒い時期が終わったとき。"}, {"t": 1053.45, "x": "あるいは、その一万年ほどあと、寒い"}, {"t": 1056.55, "x": "時代から少し暖かい時代へ移るころです。"}, {"t": 1059.2, "x": "現代のアフリカの人々は、遺伝の"}, {"t": 1061.8333333333333, "x": "多様さが大きいとされます。"}, {"t": 1063.5666666666666, "x": "それは、そこでの減りかたが比較的"}, {"t": 1066.0166666666667, "x": "ゆるやかだったからかもしれない、という見かたです。"}, {"t": 1069.2, "x": "地球の歴史上の大噴火と、人類の遺伝子に残る痕跡。"}, {"t": 1073.5166666666667, "x": "二つを一本の線で結ぶこの説は、"}, {"t": 1076.0, "x": "分かりやすく、強い印象を残しました。"}, {"t": 1079.25, "x": "一方で、反論も早くから出ていました。"}, {"t": 1082.25, "x": "2003年█"}, {"t": 1082.25, "x": "2003年、同じ学術誌に、問いかけの形の論文が載ります。"}, {"t": 1087.2166666666667, "x": "「トバの超巨大噴火は、人類の"}, {"t": 1089.6833333333334, "x": "ボトルネックを引き起こしたのか」。"}, {"t": 1091.4666666666667, "x": "同じ号には、それに対するアンブローズの返答も"}, {"t": 1094.75, "x": "載りました。説は、はじめから議論の中にありました。"}, {"t": 1098.4666666666667, "x": "ただ、どちらの側にも、決め手が欠けていました。"}, {"t": 1101.95, "x": "噴火の直前と直後の人の暮らしを、同じ地層の"}, {"t": 1105.4, "x": "中で比べられる場所が、まだ見つかっていなかったのです。"}, {"t": 1108.8833333333334, "x": "決め手の探しかたを変えたのは、目に見えない灰でした。"}, {"t": 1112.4833333333333, "x": "噴火口から遠く離れると、灰の層は、"}, {"t": 1115.5166666666667, "x": "肉眼では見分けられないほど薄くなります。"}, {"t": 1118.2833333333333, "x": "それでも、泥の中には、ガラスのかけらが残っています。"}, {"t": 1122.5, "x": "マグマが空中で急に冷えて固まった、"}, {"t": 1125.0, "x": "ごく小さな火山ガラスです。"}, {"t": 1127.1666666666667, "x": "泥を少しずつ取り分け、顕微鏡で数えていくと、"}, {"t": 1130.6333333333334, "x": "ある深さでだけ、そのかけらが急に増えます。"}, {"t": 1134.2, "x": "さらに、かけら一つひとつの成分を調べると、"}, {"t": 1137.5666666666666, "x": "どの噴火から来たものかを見分けることができます。"}, {"t": 1140.8333333333333, "x": "トバのガラスには、トバのガラスの成分があるのです。"}, {"t": 1144.4, "x": "こうして見つかる、目に見えない火山灰の層があります。"}, {"t": 1148.05, "x": "研究者たちは、これを「隠れた火山灰」を"}, {"t": 1151.9833333333333, "x": "意味する言葉で呼んでいます。"}, {"t": 1153.6333333333334, "x": "2013年█"}, {"t": 1153.6333333333334, "x": "2013年、アフリカ南東部のマラウイ湖で、"}, {"t": 1156.4, "x": "マラウイ湖█"}, {"t": 1158.0166666666667, "x": "この隠れた火山灰が見つかりました。"}, {"t": 1161.1333333333334, "x": "トバから、西へ七千キロメートル以上離れた湖です。"}, {"t": 1165.2, "x": "湖の底に積もった泥は、長い年月の気候を記録しています。"}, {"t": 1169.7166666666667, "x": "その泥の中に、トバの噴火の時刻を示す、"}, {"t": 1173.0166666666667, "x": "一本の線が引かれたことになります。"}, {"t": 1175.5833333333333, "x": "研究者たちは、その線の下と上で、泥の中身を比べました。"}, {"t": 1180.3166666666666, "x": "もし火山の冬が東アフリカを襲ったなら、湖の泥の成分や、"}, {"t": 1185.0666666666666, "x": "気温を示す手がかりが、大きく変わるはずです。"}, {"t": 1188.5333333333333, "x": "結果は、はっきりしていました。"}, {"t": 1190.8, "x": "灰の層に合わせて、泥の中身が"}, {"t": 1193.2833333333333, "x": "大きく変わった形跡はありません。"}, {"t": 1195.4, "x": "気温が大きく変わった証拠も、見つかりませんでした。"}, {"t": 1199.0333333333333, "x": "研究者たちの結論は、こうです。"}, {"t": 1201.7666666666667, "x": "この噴火は、東アフリカの気候に"}, {"t": 1204.4333333333334, "x": "大きな影響を与えていない。"}, {"t": 1206.2333333333333, "x": "そして、そのときの人類のボトルネックの"}, {"t": 1209.0166666666667, "x": "原因ではなかった。その五年あとには、"}, {"t": 1212.2166666666667, "x": "同じ湖の泥を、十年より細かい"}, {"t": 1214.4, "x": "刻みで調べた研究も出ています。"}, {"t": 1216.75, "x": "こちらも、人類の進化への影響は小さかったとしています。"}, {"t": 1220.8833333333334, "x": "2026年█"}, {"t": 1220.8833333333334, "x": "2026年には、さらに細かい記録が報告されました。"}, {"t": 1225.9333333333334, "x": "東部の熱帯アフリカで得られた、"}, {"t": 1227.8833333333334, "x": "一年よりも細かく読み分けられる記録です。"}, {"t": 1230.9333333333334, "x": "冒頭でふれた、噴火が北半球の冬に起きたという"}, {"t": 1234.4833333333333, "x": "結論は、この研究から出てきたものです。"}, {"t": 1237.4166666666667, "x": "この研究によると、噴火は東アフリカに、控えめな"}, {"t": 1241.4333333333334, "x": "冷え込みと、二年に満たない強い乾燥をもたらしました。"}, {"t": 1245.1333333333334, "x": "つまり、影響はありました。"}, {"t": 1247.4666666666667, "x": "けれども、それは短く、しかも、その地域にもともとあった"}, {"t": 1252.0166666666667, "x": "気候の変化の中に、重なる程度のものでした。"}, {"t": 1255.1333333333334, "x": "同じころ、東アフリカでは、数十年がかりで"}, {"t": 1258.7833333333333, "x": "涼しく乾いていく流れが進んでいました。"}, {"t": 1261.3666666666666, "x": "北の高い緯度が冷えていく、"}, {"t": 1263.0666666666666, "x": "最後の氷期への入り口の時代です。"}, {"t": 1265.7166666666667, "x": "トバの乾燥は、その長い流れの上に、"}, {"t": 1268.6666666666667, "x": "短い揺れとして乗っていた、とされます。"}, {"t": 1271.7166666666667, "x": "東アフリカでの噴火の影響は、ほかの"}, {"t": 1274.65, "x": "自然の気候の変動とくらべて控えめだった。"}, {"t": 1277.4333333333334, "x": "研究者たちは、そうまとめています。"}, {"t": 1280.1166666666666, "x": "東アフリカの記録は、地球の"}, {"t": 1282.5166666666667, "x": "空が乱れた年を、確かにとらえていました。"}, {"t": 1285.5666666666666, "x": "とらえていたのは、長い冬ではなく、短い乾きでした。"}, {"t": 1289.7333333333333, "x": "湖の泥が教えるのは、気候です。"}, {"t": 1292.5333333333333, "x": "人が暮らし続けたかどうかは、人が"}, {"t": 1295.0833333333333, "x": "暮らした場所を掘らなければ分かりません。"}, {"t": 1297.3833333333334, "x": "2018年█"}, {"t": 1297.3833333333334, "x": "2018年、アフリカ大陸の南の端、"}, {"t": 1300.8166666666666, "x": "南アフリカの南の海岸から、報告が出ました。"}, {"t": 1304.7833333333333, "x": "九キロメートル離れた二つの遺跡の地層から、"}, {"t": 1307.6833333333334, "x": "ガラスのかけらが見つかったのです。"}, {"t": 1310.0166666666667, "x": "トバの灰に特有の、顕微鏡でしか見えないかけらでした。"}, {"t": 1313.9166666666667, "x": "この地域は、早い時期から人々が複雑な道具や"}, {"t": 1317.45, "x": "暮らしかたを持っていたことで知られる場所です。"}, {"t": 1320.0, "x": "地層の年代は、灰とは別のやりかたでも測られ、"}, {"t": 1323.4333333333334, "x": "およそ七万四千年前と確かめられました。"}, {"t": 1326.75, "x": "研究班は、土を細かく区切って掘りました。"}, {"t": 1330.1, "x": "そして、ガラスのかけらが入ってくる深さと、"}, {"t": 1333.2, "x": "人の暮らしの跡を、同じ物差しで比べました。"}, {"t": 1336.5666666666666, "x": "その結果、この地域の人々は、トバの"}, {"t": 1339.8833333333334, "x": "噴火を通り抜けていたことが分かりました。"}, {"t": 1342.3, "x": "そのあとに続いた厳しい氷期の中でも、"}, {"t": 1344.9333333333334, "x": "暮らしを続けていたのです。"}, {"t": 1346.9666666666667, "x": "論文の題名には、「栄えた」という言葉が使われています。"}, {"t": 1351.4666666666667, "x": "研究者たちは、その理由を二つ挙げています。"}, {"t": 1354.85, "x": "この地域の食べ物の資源が、"}, {"t": 1356.7666666666667, "x": "ほかにないほど豊かだったこと。"}, {"t": 1358.8333333333333, "x": "そして、そこに暮らした人々が、すでに環境に"}, {"t": 1362.4333333333334, "x": "合わせて暮らしを変える力を十分に持っていたことです。"}, {"t": 1365.7333333333333, "x": "2024年█"}, {"t": 1365.7333333333333, "x": "2024年には、エチオピアの"}, {"t": 1368.65, "x": "北西部の低地から、別の報告が出ました。"}, {"t": 1372.2333333333333, "x": "シンファ・メテマ・ワンと名づけられた遺跡です。"}, {"t": 1374.8333333333333, "x": "ここでも、トバの隠れた火山灰が、"}, {"t": 1377.4833333333333, "x": "約七万四千年前の目印として見つかっています。"}, {"t": 1381.2833333333333, "x": "遺跡から出てきたのは、陸と水の、"}, {"t": 1383.6833333333334, "x": "さまざまな動物の骨でした。"}, {"t": 1385.8833333333334, "x": "中でも目立ったのは、魚の多さです。"}, {"t": 1388.6833333333334, "x": "動物の歯やダチョウの卵の殻には、"}, {"t": 1391.0, "x": "酸素の種類の割合が残ります。"}, {"t": 1393.4166666666667, "x": "そこから、当時 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');

const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];

a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}

  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}

paint(0);
