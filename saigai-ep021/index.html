<script>
const D={"name": "ep021", "file": "ep021", "dur": 1844.2833125, "segs": [], "subs": [{"t": 0.0, "x": "ドイツの南に、ネルトリンゲンという町があります。"}, {"t": 3.466666666666667, "x": "町の真ん中には、高い塔を持つ教会が建っています。"}, {"t": 7.266666666666667, "x": "塔の高さはおよそ90メートルです。"}, {"t": 9.8, "x": "町の人はこの塔を「ダニエル」と呼んでいます。"}, {"t": 13.916666666666666, "x": "三百五十段の階段を上ると、町がまるごと見わたせます。"}, {"t": 18.416666666666668, "x": "赤い屋根の家々が、丸い城壁の中に詰まっています。"}, {"t": 22.366666666666667, "x": "けれども、丸いのは町だけではありません。"}, {"t": 25.4, "x": "城壁の外には平らな畑が広がっています。"}, {"t": 28.4, "x": "畑のずっと先を、低い丘の列が取り囲んでいます。"}, {"t": 32.2, "x": "丘の輪の直径はおよそ24キロあります。"}, {"t": 35.166666666666664, "x": "町はこの大きな輪の底にあるのです。"}, {"t": 37.583333333333336, "x": "この丸い盆地はリースと呼ばれています。"}, {"t": 40.05, "x": "いまでは答えが出ています。"}, {"t": 41.81666666666667, "x": "宇宙から来た岩の塊が、ぶつかった跡です。"}, {"t": 45.11666666666667, "x": "およそ1480万年前の出来事です。"}, {"t": 48.38333333333333, "x": "ただし、そう決まったのは六十年あまり前のことです。"}, {"t": 52.18333333333333, "x": "それまでの百年以上は違いました。"}, {"t": 54.583333333333336, "x": "ここは火山の跡だと考えられていたのです。"}, {"t": 57.35, "x": "火山が噴き出したような石が、あちこちにあったからです。"}, {"t": 60.983333333333334, "x": "塔のある教会も、じつはその石で建てられています。"}, {"t": 64.56666666666666, "x": "地層の上下が逆さまの場所もありました。"}, {"t": 67.18333333333334, "x": "岩には、氷河の傷のような筋まで残っていました。"}, {"t": 70.71666666666667, "x": "火山か氷河か、地下の大爆発か。"}, {"t": 73.51666666666667, "x": "説は次々に出ては消えていきました。"}, {"t": 76.06666666666666, "x": "ぶつかった天体そのものは、どこにも残っていません。"}, {"t": 79.53333333333333, "x": "大きな鉄の塊も、焼けた岩の山も見つかりません。"}, {"t": 83.36666666666666, "x": "それなのに、なぜ衝突の跡だと言えるのでしょうか。"}, {"t": 86.93333333333334, "x": "この回の主語は大地です。大地にあいた"}, {"t": 89.63333333333334, "x": "丸い穴が、自分の生まれを明かすまで。"}, {"t": 92.31666666666666, "x": "その道のりを順にたどります。"}, {"t": 94.31666666666666, "x": "決め手は鉱物の小さな粒でした。"}, {"t": 96.68333333333334, "x": "顕微鏡でやっと見えるほどの粒です。"}, {"t": 99.11666666666666, "x": "粒はある石切り場の石に入っていました。"}, {"t": 101.68333333333334, "x": "石は郵便で、海の向こうのアメリカへ送られます。"}, {"t": 105.48333333333333, "x": "そこから、百年以上続いた説がひっくり返ります。"}, {"t": 109.35, "x": "塔のある町も、その話の舞台の一つになります。"}, {"t": 112.83333333333333, "x": "リースは、ドイツ南部の二つの台地のあいだにあります。"}, {"t": 116.43333333333334, "x": "西はシュヴァーベン・アルプ、"}, {"t": 117.91666666666667, "x": "東はフランケン・アルプです。"}, {"t": 120.1, "x": "どちらもジュラ紀の海でたまった石灰岩の台地です。"}, {"t": 123.33333333333333, "x": "石灰岩の帯は、南西から北東へ長く続いています。"}, {"t": 127.5, "x": "その帯が、リースのところだけ丸く切り取られています。"}, {"t": 131.1, "x": "1903年のことです。地質学者のエーベルハルト・"}, {"t": 134.7, "x": "フラースが、この姿を書き残しました。"}, {"t": 137.51666666666668, "x": "台地の列を巨大な円形劇場が断ち切っている。"}, {"t": 140.65, "x": "その直径は25キロだ、と。"}, {"t": 143.25, "x": "いまの資料では、直径はおよそ24キロとされています。"}, {"t": 147.36666666666667, "x": "資料によっては25キロや26キロとも書かれます。"}, {"t": 150.9, "x": "盆地の底は驚くほど平らです。"}, {"t": 153.16666666666666, "x": "南の縁は、底より180メートルほど高くそびえています。"}, {"t": 157.56666666666666, "x": "底が平らなのにはわけがあります。"}, {"t": 159.83333333333334, "x": "穴ができたあと、そこに湖ができたのです。"}, {"t": 162.98333333333332, "x": "湖の底には、長い年月をかけて泥がたまりました。"}, {"t": 166.88333333333333, "x": "州の地質の機関の解説を見てみます。"}, {"t": 169.63333333333333, "x": "泥の厚さは、もとは400メートルを超えていました。"}, {"t": 173.2, "x": "いまもおよそ300メートルが残っています。"}, {"t": 175.96666666666667, "x": "湖の跡からは、小さな貝の殻がたくさん出てきます。"}, {"t": 179.95, "x": "1758年にはもう記録が残っています。"}, {"t": 183.48333333333332, "x": "キビの粒ほどの貝が、何百万も固まっている。"}, {"t": 186.88333333333333, "x": "それが一つの層をなしている、と。"}, {"t": 189.61666666666667, "x": "ネルトリンゲンの町は、その湖の跡の上にあります。"}, {"t": 193.4, "x": "町を囲む城壁は中世に築かれたものです。"}, {"t": 196.55, "x": "城壁の上は通路になっています。"}, {"t": 198.81666666666666, "x": "いまも歩いてぐるりと一周できます。"}, {"t": 201.08333333333334, "x": "塔「ダニエル」は、聖ゲオルク教会の鐘の塔です。"}, {"t": 206.4, "x": "バイエルン州環境局の解説を見てみます。"}, {"t": 209.41666666666666, "x": "塔は1454年から1490年にかけて建てられました。"}, {"t": 214.13333333333333, "x": "とがった屋根はそのあとに仕上げられました。"}, {"t": 216.66666666666666, "x": "1537年から1539年のことです。"}, {"t": 220.68333333333334, "x": "晴れた日に塔から南を向くと、盆地の南の縁が見えます。"}, {"t": 224.96666666666667, "x": "丸い穴の中に、丸い町がある。"}, {"t": 227.61666666666667, "x": "それだけなら、珍しい景色で終わったかもしれません。"}, {"t": 231.26666666666668, "x": "けれども、この土地の岩は学者たちを長く悩ませました。"}, {"t": 235.13333333333333, "x": "1870年、カール・デフナーはリースをこう表しています。"}, {"t": 239.83333333333334, "x": "砂と泥に深く沈んだスフィンクスだ。"}, {"t": 242.3, "x": "すぐには解けない謎を研究者に出してくる、と。"}, {"t": 245.85, "x": "スフィンクスは旅人に謎をかける怪物です。"}, {"t": 248.73333333333332, "x": "リースの謎は、それから九十年ほど解けませんでした。"}, {"t": 252.41666666666666, "x": "謎の中心にあったのは灰色の石でした。"}, {"t": 255.28333333333333, "x": "砕けた岩のかけらが、固まり合ったような石です。"}, {"t": 258.68333333333334, "x": "ところどころに黒っぽいガラスの塊が混じっています。"}, {"t": 261.95, "x": "塊はねじれたり、折りたたまれたりしています。"}, {"t": 265.25, "x": "地元ではこの塊を「フレードレ」と呼びました。"}, {"t": 269.1, "x": "この石はやがてスエバイトと名づけられます。"}, {"t": 271.71666666666664, "x": "名前は、ラテン語の「スエビア」からとられました。"}, {"t": 275.85, "x": "シュヴァーベン地方を指す言葉です。"}, {"t": 278.0833333333333, "x": "最初にこの石を書き留めたのは、学者ではありません。"}, {"t": 281.6666666666667, "x": "軍の技術者でした。1792年のことです。"}, {"t": 285.51666666666665, "x": "工兵隊長のカスパースは、要塞を"}, {"t": 288.25, "x": "造る材料を探していました。"}, {"t": 290.1166666666667, "x": "場所はドナウ川沿いのインゴルシュタットです。"}, {"t": 292.73333333333335, "x": "欲しかったのは、水の中でも固まるセメントの材料でした。"}, {"t": 296.6666666666667, "x": "ライン地方にはトラスと呼ばれる石があります。"}, {"t": 299.48333333333335, "x": "火山灰が固まった石で、その役目を果たしていました。"}, {"t": 303.28333333333336, "x": "カスパースは、リースの近くで似た石を見つけます。"}, {"t": 306.65, "x": "トラスにそっくりの石でした。"}, {"t": 308.53333333333336, "x": "彼はそれを「バイエルンのトラス」と呼びました。"}, {"t": 312.25, "x": "そして、消えた火山の名残だと考えたのです。"}, {"t": 315.53333333333336, "x": "1805年には鉱山の役人も書いています。"}, {"t": 318.8333333333333, "x": "マティアス・フルルという人です。"}, {"t": 320.71666666666664, "x": "オッティングのあたりは本物の火山地帯だ、と。"}, {"t": 324.1333333333333, "x": "1834年には、ベルンハルト・フォン・コッタが来ました。"}, {"t": 328.3, "x": "彼は片麻岩らしい古い岩のかけらを見つけます。"}, {"t": 331.51666666666665, "x": "まわりは石灰岩ばかりです。"}, {"t": 333.51666666666665, "x": "そこに地下深くの岩が顔を出していたのです。"}, {"t": 336.4166666666667, "x": "コッタは、ガスと熱と圧力が強く働いたと考えました。"}, {"t": 340.45, "x": "ただし、首をかしげたことがありました。"}, {"t": 343.31666666666666, "x": "火山ならあるはずの玄武岩が見当たらなかったのです。"}, {"t": 346.55, "x": "それでも学者たちは火山を思い浮かべました。"}, {"t": 349.35, "x": "それには理由があります。近くの台地には、"}, {"t": 352.48333333333335, "x": "古い火山の跡が実際にありました。"}, {"t": 355.0, "x": "もう一つは当時の地質学の考えかたです。"}, {"t": 358.0, "x": "いま起きていることが過去を解く鍵になる。"}, {"t": 360.35, "x": "火山の噴火なら誰もが知っていました。"}, {"t": 362.75, "x": "空から岩が落ちて大地に穴をあける。"}, {"t": 365.25, "x": "そんな場面は誰も見たことがありませんでした。"}, {"t": 368.05, "x": "1870年、バイエルンの地質学の"}, {"t": 371.46666666666664, "x": "第一人者が論文を出します。"}, {"t": 373.51666666666665, "x": "カール・ヴィルヘルム・フォン・ギュンベルです。"}, {"t": 375.5833333333333, "x": "題は「リース火山について」でした。"}, {"t": 378.68333333333334, "x": "ギュンベルは、ガラスの塊を火山弾だと読みました。"}, {"t": 382.35, "x": "火山が吹き上げて、空中で固まった溶岩のことです。"}, {"t": 386.1, "x": "彼はこう書いています。リースには"}, {"t": 388.45, "x": "本当に活動する火山があった。"}, {"t": 390.5, "x": "その火山は、噴き出した物だけを残して消えてしまった。"}, {"t": 394.25, "x": "地下深くへ沈みこんだとしか考えられない、と。"}, {"t": 397.8333333333333, "x": "火山の本体が見つからない。"}, {"t": 399.76666666666665, "x": "そのわけを沈んだからだと説明したのです。"}, {"t": 402.56666666666666, "x": "この「見えない火山」が、このあと長く主役を務めます。"}, {"t": 407.71666666666664, "x": "火山だけでは説明しきれないこともありました。"}, {"t": 410.5833333333333, "x": "リースの周りには、地層の上下が逆さまの場所があります。"}, {"t": 414.56666666666666, "x": "若い地層の上に古い地層が乗っているのです。"}, {"t": 417.5, "x": "岩の種類がごちゃまぜの場所もあります。"}, {"t": 419.96666666666664, "x": "赤い泥岩と石灰岩と花崗岩の"}, {"t": 422.3, "x": "かけらが、隣どうしに並ぶのです。"}, {"t": 424.81666666666666, "x": "岩の表面には、こすったような筋もありました。"}, {"t": 428.21666666666664, "x": "その筋は、氷河が岩をけずった跡によく似ていました。"}, {"t": 432.01666666666665, "x": "1870年、デフナーは氷河が岩を運んだのではと考えます。"}, {"t": 437.21666666666664, "x": "これほど大きな岩の移動を、"}, {"t": 438.96666666666664, "x": "ほかに思いつけなかったのです。"}, {"t": 441.0833333333333, "x": "1901年にはエルンスト・コーケンも続きます。"}, {"t": 444.43333333333334, "x": "彼は「リース氷河」を唱えました。"}, {"t": 447.3, "x": "1877年、デフナーは仲間と地図を作りました。"}, {"t": 451.8, "x": "リースの西の地域を、細かく描いた地図です。"}, {"t": 455.06666666666666, "x": "相手はオスカー・フラースでした。"}, {"t": 457.01666666666665, "x": "円形劇場と書いたエーベルハルトの父親です。"}, {"t": 460.18333333333334, "x": "二人は、まだら色の砕けた岩の大きな塊に注目しました。"}, {"t": 464.43333333333334, "x": "それは地下からわき上がった物ではありませんでした。"}, {"t": 467.53333333333336, "x": "リースの中から外へ押し出されてきた物だったのです。"}, {"t": 470.68333333333334, "x": "二十世紀の初めには、別の筋書きも出ます。"}, {"t": 474.0, "x": "唱えたのは、ブランカとエーベルハルト・フラースでした。"}, {"t": 477.43333333333334, "x": "地下から上がったマグマが、地表に届く前に止まった。"}, {"t": 481.03333333333336, "x": "それが大地を下から押し上げた。"}, {"t": 483.18333333333334, "x": "その高まりがやがて大きな爆発を起こした。"}, {"t": 486.1333333333333, "x": "ブランカは岩の砕けかたを丹念に調べました。"}, {"t": 489.0833333333333, "x": "スエバイトがどこにどう散らばっているかも調べています。"}, {"t": 492.3666666666667, "x": "そして1903年、一つの考えにたどり着きます。"}, {"t": 496.45, "x": "中心で巨大な爆発が一度起きたというものです。"}, {"t": 499.68333333333334, "x": "この考えには、遠い国の噴火が追い風になります。"}, {"t": 503.4, "x": "1883年には、インドネシアの"}, {"t": 506.6166666666667, "x": "クラカタウが大爆発しました。"}, {"t": 508.48333333333335, "x": "1888年には日本の磐梯山が噴火しています。"}, {"t": 512.8166666666667, "x": "山の一部が吹き飛びました。"}, {"t": 514.65, "x": "リースもこうした爆発の跡ではないか。"}, {"t": 517.15, "x": "火山の見かたがもう一度強まったのです。"}, {"t": 519.7333333333333, "x": "1904年には、カール・ハウスマンが"}, {"t": 522.6166666666667, "x": "地下の磁気を測りました。彼は地下2キロから"}, {"t": 525.6666666666666, "x": "8キロに重い岩の塊があると考えます。"}, {"t": 528.2666666666667, "x": "この結果もマグマの説を支えるものとされました。"}, {"t": 531.3666666666667, "x": "ヴァルター・クランツは、別の道を選びます。"}, {"t": 534.35, "x": "彼は工兵の将校でした。火薬で"}, {"t": 536.6166666666667, "x": "模型を爆破する実験までしています。"}, {"t": 539.3833333333333, "x": "そうして、中心の大爆発を唱えたのです。"}, {"t": 542.65, "x": "説はいくつにも分かれ、議論は激しくなりました。"}, {"t": 546.1666666666666, "x": "1924年の春には、大きな集まりも開かれます。"}, {"t": 550.5166666666667, "x": "場所はネルトリンゲンでした。"}, {"t": 552.3, "x": "地下のマグマの高まり。中心の爆破。"}, {"t": 555.0333333333333, "x": "南からななめに上がるマグマ。"}, {"t": 557.0333333333333, "x": "さまざまな説がずらりと並べられました。"}, {"t": 559.55, "x": "けれども、どの説にも共通する前提がありました。"}, {"t": 563.2833333333333, "x": "力の出どころは地球の中にある。"}, {"t": 565.55, "x": "その前提だけは、ほとんど誰も疑いませんでした。"}, {"t": 569.1166666666667, "x": "答えは地球の外から来ることになります。"}, {"t": 571.7333333333333, "x": "その前提に、別の方向から疑問を投げた人がいます。"}, {"t": 575.7833333333333, "x": "1904年のエルンスト・ヴェルナーです。"}, {"t": 578.3833333333333, "x": "彼は地元の協会の会報に、一つの考えを書きました。"}, {"t": 582.5166666666667, "x": "リースは空から落ちた物の穴ではないか。"}, {"t": 585.1333333333333, "x": "近くのシュタインハイム盆地もそうではないか。"}, {"t": 587.8166666666667, "x": "アメリカのアリゾナ州にある大きな穴も同じではないか。"}, {"t": 591.1833333333333, "x": "リース・ジオパークの解説は、"}, {"t": 592.9333333333333, "x": "これを画期的と書いています。"}, {"t": 595.05, "x": "初めてそう言い表したのがヴェルナーだったからです。"}, {"t": 598.15, "x": "けれども、当時この考えは広まりませんでした。"}, {"t": 601.55, "x": "比べる相手のアリゾナの穴が、"}, {"t": 603.4666666666667, "x": "まだ論争のさなかだったのです。"}, {"t": 605.7166666666667, "x": "その穴は、いまはメテオ・クレーターと呼ばれています。"}, {"t": 609.2, "x": "幅はおよそ1.2キロ、深さはおよそ180メートルです。"}, {"t": 613.5666666666667, "x": "1891年、一人の地質学者がこの穴を調べました。"}, {"t": 618.3166666666667, "x": "グローブ・カール・ギルバートです。"}, {"t": 620.1833333333333, "x": "そして1895年、地下の水蒸気が"}, {"t": 623.6333333333333, "x": "爆発した穴だと発表します。"}, {"t": 625.6833333333333, "x": "これに反対したのが、ダニエル・バリンジャーです。"}, {"t": 629.0, "x": "鉱山技師でした。彼は隕石が"}, {"t": 630.9333333333333, "x": "ぶつかった穴だと信じていました。"}, {"t": 633.3, "x": "地下には巨大な鉄の塊が埋まっているはずだ。"}, {"t": 636.2833333333333, "x": "そう考えて、穴の底を掘り続けたのです。"}, {"t": 639.6333333333333, "x": "つぎ込んだお金は60万ドルを超えました。"}, {"t": 642.45, "x": "けれども塊は見つかりませんでした。"}, {"t": 644.8333333333334, "x": "バリンジャーは1929年に亡くなります。"}, {"t": 648.0666666666667, "x": "ドイツでは1936年に動きがありました。"}, {"t": 651.5166666666667, "x": "オットー・シュトゥッツァーが、"}, {"t": 652.9666666666667, "x": "ヴェルナーの考えを拾い上げたのです。"}, {"t": 655.5666666666667, "x": "リースとシュタインハイムをつくった二つの天体。"}, {"t": 658.3666666666667, "x": "シュトゥッツァーはそれを「父と息子」と呼びました。"}, {"t": 662.15, "x": "「似ていないきょうだい」とも言っています。"}, {"t": 664.7, "x": "それでも学界の多くは動きませんでした。"}, {"t": 667.4333333333333, "x": "のちに謎を解くアメリカの二人も、"}, {"t": 669.5, "x": "論文の冒頭に書いています。"}, {"t": 671.7166666666667, "x": "主な研究者たちの見かたは、ほぼそろっていた。"}, {"t": 674.9833333333333, "x": "何らかの火山の爆発だ、と。"}, {"t": 677.5333333333333, "x": "1932年には、地下を探る物理の測定も行われました。"}, {"t": 682.4666666666667, "x": "この結果は、大きな爆発の穴という見かたを強めました。"}, {"t": 686.5833333333334, "x": "足りなかったのは、議論ではありません。決め手でした。"}, {"t": 690.1833333333333, "x": "空から落ちたと言うためには、落ちた証拠が要ります。"}, {"t": 693.7333333333333, "x": "けれども、ぶつかった岩の塊はどこにも見当たりません。"}, {"t": 697.4833333333333, "x": "アリゾナで鉄の塊が見つからなかったのと同じです。"}, {"t": 700.8166666666667, "x": "落ちた物そのものではない、別の証拠が必要でした。"}, {"t": 704.5166666666667, "x": "その証拠は、思いもよらない場所で先に生まれていました。"}, {"t": 708.35, "x": "実験室です。1953年、実験室で"}, {"t": 711.65, "x": "新しい鉱物がつくられました。"}, {"t": 714.5333333333333, "x": "つくったのはローリング・コーズです。"}, {"t": 716.6166666666667, "x": "成分は石英と同じケイ素と酸素です。"}, {"t": 719.4666666666667, "x": "けれども、原子がより密に詰まった鉱物でした。"}, {"t": 722.8833333333333, "x": "のちに彼の名前からコーサイトと呼ばれます。"}, {"t": 725.6, "x": "石英はどこにでもあるありふれた鉱物です。"}, {"t": 728.4833333333333, "x": "砂浜の砂の多くも石英の粒です。"}, {"t": 731.25, "x": "けれども、石英をコーサイトに"}, {"t": 733.4666666666667, "x": "変えるのは簡単ではありません。"}, {"t": 735.3833333333333, "x": "とてつもない圧力が要るのです。"}, {"t": 737.3833333333333, "x": "アメリカ科学アカデミーの紀要に、"}, {"t": 739.4166666666666, "x": "ある研究が載っています。コーサイトが"}, {"t": 742.2166666666667, "x": "安定するには、大きな圧力が要ります。"}, {"t": 745.0333333333333, "x": "およそ2.5ギガパスカルより上です。"}, {"t": 747.5666666666667, "x": "地上の空気の圧力の、およそ二万五千倍にあたります。"}, {"t": 751.5666666666667, "x": "長いあいだ、コーサイトは実験室の中だけの鉱物でした。"}, {"t": 755.7666666666667, "x": "自然の中ではまだ誰も見つけていなかったのです。"}, {"t": 758.8333333333334, "x": "見つけたのはエドワード・チャオたちです。"}, {"t": 761.0166666666667, "x": "アメリカ地質調査所の研究者でした。"}, {"t": 763.55, "x": "材料を集めたのは、ユージン・シューメーカーです。"}, {"t": 766.9166666666666, "x": "同じ調査所にいました。シューメーカーは"}, {"t": 769.2666666666667, "x": "メテオ・クレーターを調べていました。"}, {"t": 771.4833333333333, "x": "穴には、強い衝撃で砕けた砂岩があります。"}, {"t": 774.7833333333333, "x": "シューメーカーはその砂岩をチャオに送りました。"}, {"t": 777.65, "x": "チャオが調べると、答えが出ました。"}, {"t": 780.2, "x": "中にコーサイトがたくさん含まれていたのです。"}, {"t": 782.9833333333333, "x": "結果は1960年7月22日の科学誌サイエンスに載ります。"}, {"t": 787.9166666666666, "x": "題は「コーサイトの自然界での初めての産出」でした。"}, {"t": 792.4166666666666, "x": "著者は三人です。チャオとシューメーカー、"}, {"t": 795.1333333333333, "x": "そしてベス・マドセンでした。"}, {"t": 797.0333333333333, "x": "論文はこの発見の使い道にも触れています。"}, {"t": 800.1333333333333, "x": "石英を含む土地の穴なら、見分けられるかもしれない。"}, {"t": 803.8, "x": "それが衝突の跡かどうかを、です。"}, {"t": 806.85, "x": "アリゾナの穴をめぐる長い論争は、"}, {"t": 809.1333333333333, "x": "この発見で決着に向かいました。"}, {"t": 811.6, "x": "ギルバートの調査から、七十年近くが"}, {"t": 814.2666666666667, "x": "たっていました。いまでは、この穴は"}, {"t": 816.9166666666666, "x": "およそ5万年前にできたとされています。"}, {"t": 819.4333333333333, "x": "ぶつかった速さは、秒速12キロから"}, {"t": 822.3166666666667, "x": "16キロと見積もられています。"}, {"t": 824.1833333333333, "x": "ここで大事なのは、落ちた物を"}, {"t": 826.3833333333333, "x": "探さなくてよくなったことです。"}, {"t": 828.2, "x": "ぶつかった天体は、残らないことが多いのです。"}, {"t": 831.45, "x": "熱で溶けたり、飛び散ったりするからです。"}, {"t": 834.4, "x": "けれども、ぶつけられた地面の石はその場に残ります。"}, {"t": 838.0166666666667, "x": "その石の中に、衝撃でしかできない"}, {"t": 840.7, "x": "鉱物が閉じこめられている。"}, {"t": 842.3333333333334, "x": "証拠は空から来た物ではなく、地面のほうにあったのです。"}, {"t": 846.3666666666667, "x": "そしてシューメーカーには、次に調べたい穴がありました。"}, {"t": 850.1, "x": "ドイツのリースです。1960年の夏、"}, {"t": 852.9666666666667, "x": "シューメーカーはリースを訪れました。"}, {"t": 855.8333333333334, "x": "過去の論文を読み直したうえで、"}, {"t": 857.9166666666666, "x": "自分の目で確かめるためです。"}, {"t": 860.0666666666667, "x": "とくに気になっていたのがスエバイトでした。"}, {"t": 862.45, "x": "チャオとシューメーカーは、ある疑いを持っていました。"}, {"t": 865.8333333333334, "x": "この石こそ、衝突でできたのではないか。"}, {"t": 868.7833333333333, "x": "シューメーカーは、石切り場や崖を回りました。"}, {"t": 872.0833333333334, "x": "そして、石を集めます。いちばん見事だったのは、"}, {"t": 875.5166666666667, "x": "オッティングの石切り場でした。"}, {"t": 877.7666666666667, "x": "盆地の縁の外にある石切り場です。"}, {"t": 880.1, "x": "スエバイトが広く顔を出していました。"}, {"t": 882.4666666666667, "x": "さしわたしは600メートルほどです。"}, {"t": 884.85, "x": "厚さはおよそ9メートルあります。"}, {"t": 887.0833333333334, "x": "その下には、赤や緑の泥岩のかけらを含む層がありました。"}, {"t": 891.4166666666666, "x": "最初に集めた石は、郵便でチャオのもとへ送られます。"}, {"t": 895.3833333333333, "x": "論文によれば、その一個目から"}, {"t": 897.7666666666667, "x": "コーサイトが見つかりました。"}, {"t": 899.35, "x": "チャオが詳しく調べたのは、白っぽいかけらです。"}, {"t": 902.7, "x": "半分溶けて、焼き固まったようなかけらでした。"}, {"t": 905.9666666666667, "x": "その八割以上はさまざまな種類のガラスです。"}, {"t": 909.05, "x": "そのガラスの一つは、泡がなく透明でした。"}, {"t": 912.3666666666667, "x": "その中にコーサイトの粒が埋まっていたのです。"}, {"t": 915.2, "x": "論文はこの透明なガラスについて書いています。"}, {"t": 918.2666666666667, "x": "溶けたのではないかもしれない。"}, {"t": 920.0, "x": "衝撃だけでガラスに変わったのかもしれない、と。"}, {"t": 923.5166666666667, "x": "チャオは数グラムのかけらを、"}, {"t": 925.1833333333333, "x": "薄いフッ化水素酸に溶かしました。"}, {"t": 927.85, "x": "ガラスを溶かして、コーサイトだ 。"}, {"t": 1045.7, "x": "岩は白く濁り、ぼろぼろと崩れやすくなります。"}, {"t": 1049.0333333333333, "x": "段階2では石英や長石に細い縞が入ります。"}, {"t": 1052.4833333333333, "x": "石は絹のような光を帯びます。"}, {"t": 1054.6666666666667, "x": "段階3では長石が泡のないガラスに変わります。"}, {"t": 1058.0, "x": "段階が上がるほど、岩は泡だらけになっていきます。"}, {"t": 1061.6, "x": "段階6では岩がスポンジのように穴だらけになります。"}, {"t": 1064.9333333333334, "x": "そして段階7で、すっかり溶けて流れた跡を残します。"}, {"t": 1068.95, "x": "同じ一つの穴の中に、これだけの"}, {"t": 1071.45, "x": "段階がそろっていたのです。"}, {"t": 1073.0833333333333, "x": "石の置かれかたも見直されました。"}, {"t": 1075.2, "x": "1960年代には、盆地の南西で調べが進みます。"}, {"t": 1079.7666666666667, "x": "担ったのはルドルフ・ヒュットナーです。"}, {"t": 1081.95, "x": "スエバイトは、煙突のような"}, {"t": 1084.1666666666667, "x": "噴き出し口には入っていませんでした。"}, {"t": 1086.3833333333334, "x": "いつも、まだら色の砕けた岩の上に乗っていたのです。"}, {"t": 1090.05, "x": "1970年代にはジャン・ポールが磁気を測りました。"}, {"t": 1093.8333333333333, "x": "石に残る磁気の向きは、とてもよくそろっていました。"}, {"t": 1097.3, "x": "スエバイトは短いあいだに積もったと考えられます。"}, {"t": 1100.5333333333333, "x": "1964年には、エーリッヒ・プロイスが東に目を向けます。"}, {"t": 1105.3333333333333, "x": "遠くの土地で見つかる、緑色のガラスの石です。"}, {"t": 1108.8666666666666, "x": "チェコのボヘミアやモラビアで見つかる石です。"}, {"t": 1111.5166666666667, "x": "モルダバイトと呼ばれています。"}, {"t": 1113.2833333333333, "x": "プロイスはこの石をリースの衝突と結びつけました。"}, {"t": 1116.55, "x": "飛ばされた物の量も、分かってきました。"}, {"t": 1119.3833333333334, "x": "州の地質の機関の見積もりがあります。"}, {"t": 1122.0, "x": "ほんの数秒で、125から200立方キロの"}, {"t": 1125.5333333333333, "x": "岩が飛び出したそうです。飛んだ"}, {"t": 1127.8, "x": "石灰岩の塊は、遠くでも見つかります。"}, {"t": 1130.5333333333333, "x": "100キロ以上離れた場所からも出ているのです。"}, {"t": 1133.3666666666666, "x": "高圧でできる鉱物は、ほかにも八種類見つかりました。"}, {"t": 1137.2, "x": "その中には、とても小さなダイヤモンドもあります。"}, {"t": 1140.65, "x": "1973年には、ネルトリンゲンで"}, {"t": 1143.9, "x": "研究のための掘削も行われました。"}, {"t": 1146.4166666666667, "x": "掘り出した岩の芯は、いまも保管されています。"}, {"t": 1149.7833333333333, "x": "市の研究センターには、深さ"}, {"t": 1152.0666666666666, "x": "1206メートルまでの芯があります。"}, {"t": 1154.5833333333333, "x": "こうした調べから、あの日の流れが"}, {"t": 1156.9333333333334, "x": "組み立てられていきました。"}, {"t": 1158.3333333333333, "x": "バイエルン州環境局の解説に沿って、たどってみます。"}, {"t": 1162.5, "x": "天体はおよそ秒速20キロでぶつかったとされます。"}, {"t": 1165.9, "x": "向きはおそらく南西から、角度はおよそ30度です。"}, {"t": 1169.6333333333334, "x": "ぶつかって0.1秒後、天体は地層を突き抜けました。"}, {"t": 1173.6333333333334, "x": "地層の厚さは最大600メートルです。"}, {"t": 1176.2333333333333, "x": "そして、地下の古い岩に届きます。"}, {"t": 1178.9, "x": "1秒後には空に大きな火の玉ができていました。"}, {"t": 1182.0333333333333, "x": "60秒後、飛び散った岩のかけらが周りに降りそそぎます。"}, {"t": 1186.2333333333333, "x": "谷は最大100メートルの厚さで埋まりました。"}, {"t": 1189.1166666666666, "x": "およそ2分後、不安定になった穴の底が盛り上がります。"}, {"t": 1193.05, "x": "こうして、内がわにもう一つの輪ができました。"}, {"t": 1196.2666666666667, "x": "およそ5分後、空に吹き上げられた物が降ってきます。"}, {"t": 1199.9166666666667, "x": "それが穴の中と周りに積もり、スエバイトになりました。"}, {"t": 1203.7, "x": "およそ20分後には、穴の形がほぼ決まりました。"}, {"t": 1207.35, "x": "飛び散った物の積もりかたも、ほぼ決まっていました。"}, {"t": 1210.6166666666666, "x": "百年以上も議論された盆地。"}, {"t": 1212.85, "x": "それは二十分ほどでできていたのです。"}, {"t": 1215.2666666666667, "x": "1970年8月、リースの石切り場に"}, {"t": 1218.8, "x": "変わった客たちが現れました。"}, {"t": 1220.6666666666667, "x": "アメリカの宇宙飛行士たちです。"}, {"t": 1222.6666666666667, "x": "NASAの記録では、8月10日から15日まででした。"}, {"t": 1226.4166666666667, "x": "アポロ14号の船長、アラン・シェパード。"}, {"t": 1229.5333333333333, "x": "月着陸船の操縦士、エドガー・ミッチェル。"}, {"t": 1232.8, "x": "そして予備の乗組員だったジーン・サーナンと"}, {"t": 1235.45, "x": "ジョー・エングルです。案内役はドイツの研究者たちです。"}, {"t": 1239.0166666666667, "x": "中心は、テュービンゲン大学のエンゲルハルト教授でした。"}, {"t": 1243.0333333333333, "x": "段階を整理したシュテフラーも、その一人です。"}, {"t": 1246.2666666666667, "x": "NASAからは、マイク・マキューエンが付き添いました。"}, {"t": 1249.4, "x": "この訓練を企画した人です。"}, {"t": 1251.4833333333333, "x": "リースのガラスを研究していた"}, {"t": 1253.3666666666666, "x": "フレッド・ヘルツも一緒です。"}, {"t": 1255.0, "x": "彼らはオッティングやハールブルクの"}, {"t": 1256.9666666666667, "x": "石切り場を歩きました。スエバイトを手に取りました。"}, {"t": 1260.1666666666667, "x": "衝突でできた石の見分けかたを、学んだのです。"}, {"t": 1263.6833333333334, "x": "月の表面は大小の衝突の穴でおおわれています。"}, {"t": 1267.2166666666667, "x": "月で石を拾うには見る目が要ります。"}, {"t": 1269.5833333333333, "x": "ぶつかって砕けた石を、見分ける目です。"}, {"t": 1272.4333333333334, "x": "リースは、大きな衝突の穴を"}, {"t": 1274.8, "x": "地上で歩いて学べる場所でした。"}, {"t": 1276.8166666666666, "x": "リース・ジオパークは、この訓練をこう紹介しています。"}, {"t": 1280.55, "x": "のちの月の石の採取の、大事な土台になった、と。"}, {"t": 1284.6833333333334, "x": "ただ、訓練は静かには進みませんでした。"}, {"t": 1287.8666666666666, "x": "ヘルツは、ドイツの記者たちに"}, {"t": 1289.8166666666666, "x": "悩まされたと振り返っています。"}, {"t": 1291.7833333333333, "x": "行く先々がお祭りのような騒ぎだったそうです。"}, {"t": 1294.7833333333333, "x": "ビールやワインを飲んだという記事も新聞に載りました。"}, {"t": 1297.9333333333334, "x": "訓練のあとには、自動車会社に"}, {"t": 1300.35, "x": "招かれて週末を過ごしています。"}, {"t": 1302.45, "x": "その様子も記事になりました。"}, {"t": 1304.35, "x": "飛行士たちの取りまとめ役は、"}, {"t": 1306.2, "x": "ディーク・スレイトンでした。"}, {"t": 1307.85, "x": "スレイトンはこう判断しました。"}, {"t": 1309.9666666666667, "x": "遊びが多すぎて、仕事が足りないように見える。"}, {"t": 1313.2666666666667, "x": "15号から17号の乗組員は、"}, {"t": 1315.8666666666666, "x": "リースへ行かないことになりました。"}, {"t": 1318.0166666666667, "x": "ヘルツはそれを残念がっています。"}, {"t": 1320.2166666666667, "x": "翌1971年2月、二人は月に降り立ちます。"}, {"t": 1324.5833333333333, "x": "シェパードとミッチェルです。"}, {"t": 1326.1833333333334, "x": "場所はフラ・マウロ高地でした。"}, {"t": 1328.1, "x": "サーナンはのちにアポロ17号の船長になります。"}, {"t": 1331.45, "x": "そして、いまのところ最後に月を歩いた人になりました。"}, {"t": 1335.2166666666667, "x": "町にはリース・クレーター博物館があります。"}, {"t": 1338.0333333333333, "x": "そこには、本物の月の石が一つ展示されています。"}, {"t": 1341.7833333333333, "x": "アポロ16号が持ち帰った石です。"}, {"t": 1344.25, "x": "訓練はそのあとも続いています。"}, {"t": 1346.4666666666667, "x": "ヨーロッパの宇宙飛行士たちも、リースを訪れました。"}, {"t": 1350.0166666666667, "x": "2017年と2018年、そして2021年です。"}, {"t": 1354.7, "x": "火山の跡と思われていた盆地。"}, {"t": 1356.8166666666666, "x": "そこはいまでは衝突を学ぶ教室です。"}, {"t": 1359.6166666666666, "x": "ではその衝突はいつ起きたのでしょうか。"}, {"t": 1362.2, "x": "ここで役に立ったのがモルダバイトです。"}, {"t": 1364.5, "x": "モルダバイトは、リースの中心から"}, {"t": 1366.8833333333334, "x": "東北東の土地で見つかります。"}, {"t": 1368.75, "x": "距離はおよそ200キロから450キロです。"}, {"t": 1371.8333333333333, "x": "散らばる範囲は扇を開いたような形をしています。"}, {"t": 1375.15, "x": "衝突で溶けた地表の物が、遠くへ飛ばされました。"}, {"t": 1378.75, "x": "それが固まった石だと考えられています。"}, {"t": 1381.4, "x": "2018年、この石の年代が測り直されました。"}, {"t": 1385.3333333333333, "x": "測ったのはマーティン・シュミーダーたちです。"}, {"t": 1387.7666666666667, "x": "アルゴンという元素の、二つの"}, {"t": 1389.9166666666667, "x": "種類の量の比を使う方法です。"}, {"t": 1392.1333333333334, "x": "得られた値は1480万8000年前でした。"}, {"t": 1395.85, "x": "誤差の幅は外から入る誤差も含めて前後3万8000年です。"}, {"t": 1400.1833333333334, "x": "それまでの測定とおおむね合いながら、"}, {"t": 1402.5333333333333, "x": "ずっと細かい値でした。同じ研究では"}, {"t": 1405.0666666666666, "x": "スエバイトのガラスも測られています。"}, {"t": 1407.75, "x": "こちらは意味のある年代が出ませんでした。"}, {"t": 1410.2666666666667, "x": "地下の熱い水がしみこんでいたようです。"}, {"t": 1412.8166666666666, "x": "そのせいで、測るための元素が"}, {"t": 1415.1166666666666, "x": "入りこんでいたと考えられています。"}, {"t": 1417.2833333333333, "x": "この値にはすぐ反論が出ました。"}, {"t": 1419.5333333333333, "x": "ロッホルたちが合わない点を指摘したのです。"}, {"t": 1422.2166666666667, "x": "地層に残る、磁場の向きの記録とです。"}, {"t": 1425.1166666666666, "x": "磁場の記録と合う年代は二つしかない。"}, {"t": 1427.6, "x": "どちらも、シュミーダーたちの値とはずれる。"}, {"t": 1430.4833333333333, "x": "ずれは6万年か20万年だというのです。"}, {"t": 1433.3666666666666, "x": "衝突の年代の細かい桁は、まだ決まっていません。"}, {"t": 1437.0, "x": "ただ、大きな枠はどの資料もほぼ同じです。"}, {"t": 1440.2666666666667, "x": "およそ1500万年前ごろ、という枠です。"}, {"t": 1443.65, "x": "リースから南西へおよそ40キロ。"}, {"t": 1446.05, "x": "そこにもう一つ丸い穴があります。"}, {"t": 1448.35, "x": "ヴェルナーが1904年に名前を挙げた、"}, {"t": 1451.0833333333333, "x": "シュタインハイム盆地です。"}, {"t": 1452.9, "x": "州の地質の機関によれば、直径はおよそ3.5キロです。"}, {"t": 1457.25, "x": "深さは100メートル近くあります。"}, {"t": 1459.4833333333333, "x": "真ん中には、高さ50メートルほどの丘が"}, {"t": 1462.5166666666667, "x": "盛り上がっています。押し下げられた"}, {"t": 1464.85, "x": "地面が、はね返った跡と考えられています。"}, {"t": 1467.5833333333333, "x": "同じ機関は、ぶつかった天体の大きさも見積もっています。"}, {"t": 1471.5833333333333, "x": "リースはおよそ800メートルから1000メートル。"}, {"t": 1474.4166666666667, "x": "シュタインハイムは、およそ80メートルから"}, {"t": 1477.3666666666666, "x": "100メートルです。二つの穴は近くにあって、年代も近い。"}, {"t": 1481.6166666666666, "x": "そこで、ある考えが長く支持されてきました。"}, {"t": 1484.9166666666667, "x": "二つの岩が、組で飛んできたという考えです。"}, {"t": 1488.2833333333333, "x": "シュトゥッツァーが「父と息子」と"}, {"t": 1491.0833333333333, "x": "呼んだ姿に、近い考えかたです。"}, {"t": 1493.7666666666667, "x": "2000年代の初めの研究は、"}, {"t": 1495.9, "x": "この組の天体で計算を試みました。"}, {"t": 1498.7833333333333, "x": "組の天体が、西南西からななめに突っこんだ。"}, {"t": 1502.3833333333334, "x": "それなら、二つの穴の位置を説明できる。"}, {"t": 1505.4833333333333, "x": "モルダバイトの散らばりも説明できる、としました。"}, {"t": 1508.85, "x": "これに異を唱えたのが、エルマー・ブフナーたちです。"}, {"t": 1512.1166666666666, "x": "2020年、彼らは報告しました。"}, {"t": 1515.2166666666667, "x": "地震で乱された地層が二枚見つかった、と。"}, {"t": 1518.5, "x": "古いほうの乱れは、リースの衝突の揺れでできたものです。"}, {"t": 1522.3666666666666, "x": "そのすぐ上を、リースから飛んできた物が覆っていました。"}, {"t": 1526.2, "x": "この組み合わせは、遠くでも見つかりました。"}, {"t": 1529.1666666666667, "x": "リースから、最大180キロ離れた場所です。"}, {"t": 1532.7333333333333, "x": "新しいほうの乱れは、この組み合わせを縦に"}, {"t": 1535.4833333333333, "x": "切り裂いていました。彼らは、これをシュタインハイムの"}, {"t": 1539.0666666666666, "x": "衝突の揺れと考えました。二つの衝突は"}, {"t": 1542.0333333333333, "x": "別々の時期に起きた、という結論です。"}, {"t": 1544.9833333333333, "x": "化石の記録からも、およそ50万年の差があるとしています。"}, {"t": 1549.0833333333333, "x": "2022年には、続報も出ました。"}, {"t": 1551.95, "x": "シュタインハイムの衝突は、"}, {"t": 1553.6333333333334, "x": "およそ1400万年前だとしています。"}, {"t": 1556.6166666666666, "x": "リースより80万年ほどあと、という見積もりです。"}, {"t": 1560.2166666666667, "x": "組で来たのか、別々に来たのか。"}, {"t": 1562.7166666666667, "x": "この問いには、まだ決着がついていません。"}, {"t": 1565.6833333333334, "x": "ここで、分かっていることを三つの段に分けます。"}, {"t": 1569.0166666666667, "x": "まず、いまでは争われていないこと。"}, {"t": 1571.8, "x": "リースは天体の衝突でできた穴です。"}, {"t": 1574.4166666666667, "x": "決め手は、スエバイトの中の"}, {"t": 1576.4833333333333, "x": "コーサイトとスティショバイトでした。"}, {"t": 1578.3166666666666, "x": "段階ごとに残る衝撃の跡も、同じことを示しています。"}, {"t": 1582.4333333333334, "x": "盆地の直径はおよそ24キロです。"}, {"t": 1585.1, "x": "ネルトリンゲンの町は、その底にあります。"}, {"t": 1588.0833333333333, "x": "1970年8月には、ここで訓練がありました。"}, {"t": 1592.2666666666667, "x": "アポロ14号の乗組員たちの訓練です。"}, {"t": 1595.2666666666667, "x": "次に、有力ではあるけれど数字に幅があること。"}, {"t": 1598.7166666666667, "x": "衝突の年代は、約1480万年前という値が"}, {"t": 1603.2333333333333, "x": "広く使われています。けれども、"}, {"t": 1605.6166666666666, "x": "数万年から20万年の桁では食い違います。"}, {"t": 1608.8, "x": "測りかたによって、値が変わるのです。"}, {"t": 1611.7166666666667, "x": "ぶつかった天体の大きさにも幅があります。"}, {"t": 1614.5166666666667, "x": "小さいほうは、およそ800メートル。"}, {"t": 1617.2833333333333, "x": "大きいほうは、1.5キロとする計算があります。"}, {"t": 1620.9333333333334, "x": "秒速20キロで南西から30度、という"}, {"t": 1624.2333333333333, "x": "数字も見積もりの一つです。"}, {"t": 1625.95, "x": "バイエルン州環境局自身が、"}, {"t": 1628.1666666666667, "x": "向きに「おそらく」と書き添えています。"}, {"t": 1631.45, "x": "そして、割れていること。リースと"}, {"t": 1633.65, "x": "シュタインハイムは、同じときにできたのか。"}, {"t": 1636.55, "x": "それとも、数十万年を隔てた別々の衝突なのか。"}, {"t": 1640.5666666666666, "x": "この番組では、組の天体の説を紹介しました。"}, {"t": 1644.2833333333333, "x": "長く有力だった考えとしてです。"}, {"t": 1646.6333333333334, "x": "別々の衝突とする説は、新しい反論として並べています。"}, {"t": 1651.2333333333333, "x": "どちらか一方に決めることはしません。"}, {"t": 1653.5833333333333, "x": "モルダバイトの年代と、地層の磁気の記録。"}, {"t": 1656.5833333333333, "x": "二つの食い違いが、どう埋まるのか。"}, {"t": 1659.3, "x": "それも、これからの調べを待つことになります。"}, {"t": 1662.45, "x": "振り返ってみます。火山の説を唱えた学者たちも、"}, {"t": 1665.9, "x": "手を抜いていたわけではありません。"}, {"t": 1668.0666666666666, "x": "目の前の岩を、当時の知識で精いっぱい読んだのです。"}, {"t": 1671.85, "x": "比べる相手のアリゾナの穴でさえ、"}, {"t": 1673.9833333333333, "x": "1960年まで決着していませんでした。"}, {"t": 1677.55, "x": "リースの謎を解いたのは、新しい"}, {"t": 1680.0, "x": "理屈ではありませんでした。"}, {"t": 1681.5666666666666, "x": "空から落ちたという考えは、"}, {"t": 1683.4666666666667, "x": "1904年にはもう出ていたのです。"}, {"t": 1686.2, "x": "足りなかったのは、ふつうの火山ではできない物でした。"}, {"t": 1689.65, "x": "それを岩の中から取り出して見せることです。"}, {"t": 1692.3833333333334, "x": "その物は、まず実験室で生まれました。"}, {"t": 1695.3833333333334, "x": "次にアリゾナの砂岩で見つかりました。"}, {"t": 1697.7666666666667, "x": "そして、オッティングの石切り場の石から出てきたのです。"}, {"t": 1701.45, "x": "ヴェルナーの考えから、およそ六十年がたっていました。"}, {"t": 1705.15, "x": "顕微鏡でやっと見える粒。それが、"}, {"t": 1707.7333333333333, "x": "百年以上続いた火山の説を入れ替えたのです。"}, {"t": 1711.1166666666666, "x": "証拠は大きな物ではなく、小さな物の中にありました。"}, {"t": 1715.0833333333333, "x": "ネルトリンゲンの教会に、話を戻します。"}, {"t": 1718.3, "x": "聖ゲオルク教会は、スエバイトで建てられています。"}, {"t": 1721.85, "x": "石は町の南西およそ8キロの石切り場から運ばれました。"}, {"t": 1725.75, "x": "運んだのは、牛の引く車でした。"}, {"t": 1728.4, "x": "スエバイトは雨や風に弱い石です。"}, {"t": 1730.9333333333334, "x": "前の世紀には、教会が何十年も"}, {"t": 1733.75, "x": "足場に覆われていたといいます。"}, {"t": 1735.6166666666666, "x": "1960年代には、教会を直し続けるための"}, {"t": 1739.6, "x": "工房が置かれました。いまは、"}, {"t": 1741.6, "x": "傷んだ石を取りかえています。"}, {"t": 1743.6166666666666, "x": "使うのは、ゼールブロンの石切り場のスエバイトです。"}, {"t": 1747.1333333333334, "x": "教会の石には、ダイヤモンドが含まれています。"}, {"t": 1750.5333333333333, "x": "合わせて500グラムほどと見積もられています。"}, {"t": 1753.2166666666667, "x": "ただし、どの粒も0.3ミリより小さいものです。"}, {"t": 1757.0833333333333, "x": "目には見えません。もとは、地下の岩にあった黒鉛です。"}, {"t": 1761.2, "x": "それが衝突の圧力で、ダイヤモンドに変わりました。"}, {"t": 1764.95, "x": "2022年には、リースの一帯が認められました。"}, {"t": 1768.6666666666667, "x": "ユネスコの世界ジオパークです。"}, {"t": 1770.6666666666667, "x": "広さはおよそ1750平方キロ、"}, {"t": 1773.45, "x": "53の市町村にまたがっています。"}, {"t": 1776.1666666666667, "x": "2024年、スエバイトはドイツの「今年の"}, {"t": 1779.9166666666667, "x": "岩」に選ばれました。塔の部屋には、"}, {"t": 1782.45, "x": "いまスエバイトの見本が並んでいます。"}, {"t": 1785.1333333333334, "x": "その塔には、かつて夜警が住んでいました。"}, {"t": 1788.15, "x": "いまも、塔の上から呼び声が響きます。"}, {"t": 1791.15, "x": "夜10時から真夜中まで、三十分ごとです。"}, {"t": 1794.5, "x": "「ソー、ゲゼル、ソー」。声は"}, {"t": 1797.1, "x": "丸い城壁の中の家々に届きます。"}, {"t": 1799.9, "x": "昔の夜警の呼び声が、いまも残っているのです。"}, {"t": 1803.45, "x": "城壁の上を散歩する人がいます。"}, {"t": 1805.8333333333333, "x": "塔の三百五十段を、息を切らして上る人がいます。"}, {"t": 1809.7, "x": "城壁の外の平らな畑では、土を耕す人がいます。"}, {"t": 1813.75, "x": "その足もとの深くには、湖の泥と"}, {"t": 1816.4666666666667, "x": "砕けた岩が重なっています。"}, {"t": 1818.2333333333333, "x": "けれども、町の人の毎日はよその町とそう変わりません。"}, {"t": 1822.25, "x": "朝が来れば店が開きます。夕方には"}, {"t": 1824.7, "x": "子どもたちが家に帰ります。"}, {"t": 1826.7, "x": "違うのは、窓から見える丘の輪だけです。"}, {"t": 1829.6833333333334, "x": "その輪は、ある日の出来事の縁です。"}, {"t": 1832.35, "x": "1480万年前の、二十分ほどの出来事でした。"}, {"t": 1836.8666666666666, "x": "今夜も塔から呼び声が響きます。"}, {"t": 1839.2166666666667, "x": "直径24キロの穴の底で、町は眠りにつきます。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
