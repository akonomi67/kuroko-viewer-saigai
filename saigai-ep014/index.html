<script>
const D={"name": "ep014", "file": "ep014", "dur": 1959.8333125, "segs": [], "subs": [{"t": 0.0, "x": "いま、地球の空気の中にある二酸化炭素は、"}, {"t": 3.283333333333333, "x": "百万個の粒のうち、およそ四百十九個です。"}, {"t": 7.15, "x": "2022年の一年の平均として、そう測られています。"}, {"t": 11.4, "x": "ほんのわずかな量に見えます。"}, {"t": 13.283333333333333, "x": "けれども、この気体の多い少ないが、地球の"}, {"t": 16.65, "x": "暑さと寒さを大きく左右してきました。"}, {"t": 19.1, "x": "いまからおよそ五千百万年前、その数は"}, {"t": 22.333333333333332, "x": "千六百ほどだったと見積もられています。"}, {"t": 24.766666666666666, "x": "いまの四倍近くです。そのころの地球は、平均の気温が"}, {"t": 29.066666666666666, "x": "いまより十二度ほど高く、南極にも"}, {"t": 31.683333333333334, "x": "グリーンランドにも、氷がありませんでした。"}, {"t": 34.5, "x": "そこから地球は、何千万年もかけて、"}, {"t": 37.516666666666666, "x": "長い下り坂を冷えていきます。"}, {"t": 39.733333333333334, "x": "その坂の降り口のあたりで、"}, {"t": 41.46666666666667, "x": "北極の海に、奇妙なことが起きていました。"}, {"t": 44.8, "x": "海の表面から、塩が抜けていったのです。"}, {"t": 47.85, "x": "塩の薄い水が、海のいちばんうえに、"}, {"t": 50.9, "x": "ふたのように広がりました。"}, {"t": 52.766666666666666, "x": "そのふたのうえを、真水でしか育たない"}, {"t": 55.516666666666666, "x": "小さな浮き草が、途切れ途切れに覆いました。"}, {"t": 58.63333333333333, "x": "時代は、およそ4900万年前。"}, {"t": 60.38333333333333, "x": "4900万年前█"}, {"t": 62.4, "x": "その状態は、くり返し現れては消えながら、"}, {"t": 65.78333333333333, "x": "八十万年ほど続いたとされます。"}, {"t": 68.33333333333333, "x": "この出来事は、その浮き草の名前をとって、"}, {"t": 71.46666666666667, "x": "アゾラ・イベント█"}, {"t": 71.73333333333333, "x": "アゾラ・イベントと呼ばれています。"}, {"t": 74.13333333333334, "x": "ただし、この回の主役は、浮き草ではありません。"}, {"t": 78.06666666666666, "x": "北極の海そのものと、空気の中の二酸化炭素です。"}, {"t": 81.86666666666666, "x": "ほかの海との行き来が細った北極の海が、空から"}, {"t": 85.43333333333334, "x": "炭素を抜き取り、海の底へしまいこんだのではないか。"}, {"t": 89.0, "x": "その量は、地球を冷やす向きに、どれほど効いたのか。"}, {"t": 93.2, "x": "手がかりは、2004年に、氷に覆われた海の"}, {"t": 96.78333333333333, "x": "真ん中から引き上げられた、一本の泥の柱です。"}, {"t": 100.23333333333333, "x": "先にお伝えしておきます。北極の"}, {"t": 102.6, "x": "浮き草が地球を冷やした、という"}, {"t": 104.96666666666667, "x": "話は、ときどき言い切りの形で語られます。"}, {"t": 108.08333333333333, "x": "けれども、研究者の見積もりには、八倍以上の"}, {"t": 111.33333333333333, "x": "幅があります。どこまでが泥から直接読めることで、"}, {"t": 115.05, "x": "どこからが計算と議論なのか。"}, {"t": 117.31666666666666, "x": "その境目を引きながら、順に見ていきます。"}, {"t": 120.5, "x": "北極点のまわりの海は、夏の終わりでも、"}, {"t": 123.66666666666667, "x": "その多くが厚い氷に覆われています。"}, {"t": 126.48333333333333, "x": "この海の底を掘ることは、長いあいだ、"}, {"t": 129.21666666666667, "x": "とても難しいと考えられてきました。"}, {"t": 131.83333333333334, "x": "海の底を掘る船は、同じ場所に、何日も、"}, {"t": 135.43333333333334, "x": "何週間も、とどまっていなければなりません。"}, {"t": 138.73333333333332, "x": "ところが、海に浮かぶ氷は、"}, {"t": 140.96666666666667, "x": "風と海流に押されて、絶えず動いています。"}, {"t": 144.35, "x": "船を止めても、流れてくる氷がぶつかり、"}, {"t": 147.35, "x": "船ごと押し流してしまいます。"}, {"t": 149.53333333333333, "x": "そのため、北極の海がたどってきた歴史には、"}, {"t": 152.71666666666667, "x": "直接の証拠がほとんどありませんでした。"}, {"t": 155.53333333333333, "x": "まわりの陸の地層を調べれば、陸の様子は分かります。"}, {"t": 159.33333333333334, "x": "けれども、海のまん中で何が起きていたのかは、"}, {"t": 162.58333333333334, "x": "海のまん中の泥を取ってこなければ分かりません。"}, {"t": 165.8, "x": "2004年の8月、この難題に、三隻の船が挑みました。"}, {"t": 170.5, "x": "ノルウェーの北の港、トロムソを出たのは、8月7日です。"}, {"t": 174.86666666666667, "x": "掘る役を受け持ったのは、ヴィダール・ヴァイキングという"}, {"t": 176.51666666666668, "x": "ヴィダール・ヴァイキング█"}, {"t": 178.46666666666667, "x": "船でした。スウェーデンの砕氷船オーデンは、掘る船の"}, {"t": 181.25, "x": "オーデン█"}, {"t": 183.11666666666667, "x": "そばで氷を砕き、全体の指揮をとる役でした。"}, {"t": 187.4, "x": "ロシアの砕氷船ソヴィエツキー・ソユーズは、"}, {"t": 188.71666666666667, "x": "ソヴィエツキー・ソユーズ█"}, {"t": 190.7, "x": "主な砕氷の役として、大きな氷に立ち向かいました。"}, {"t": 195.83333333333334, "x": "目指したのは、北緯八十七度から"}, {"t": 198.35, "x": "八十八度のあいだの海です。北極点まで、"}, {"t": 201.4, "x": "あと二百五十キロメートルほどしかありません。"}, {"t": 204.48333333333332, "x": "そこには、ロモノソフ海嶺と呼ばれる、"}, {"t": 205.38333333333333, "x": "ロモノソフ海嶺█"}, {"t": 207.43333333333334, "x": "海の底の長い山並みが走っています。"}, {"t": 210.83333333333334, "x": "山並みの頂は、海面からおよそ千メートル下にあります。"}, {"t": 215.15, "x": "その頂には、厚さ五百メートルほどの"}, {"t": 218.1, "x": "泥が積もっているとみられていました。"}, {"t": 220.08333333333334, "x": "何千万年ぶんもの泥が、順番どおりに"}, {"t": 223.15, "x": "重なっている場所です。掘っているあいだ、船のまわりの"}, {"t": 226.61666666666667, "x": "海は、九割以上が氷でした。"}, {"t": 229.2, "x": "しかも、その多くは、何年も"}, {"t": 231.8, "x": "溶けずに残ってきた、厚い氷です。"}, {"t": 234.46666666666667, "x": "それでも、掘る船は、決めた位置から"}, {"t": 237.28333333333333, "x": "前後五十メートルの範囲に、時間にして"}, {"t": 240.1, "x": "ほぼ九十八パーセントとどまり続けました。"}, {"t": 242.76666666666668, "x": "記録には、船の位置合わせが、"}, {"t": 245.05, "x": "人の手の操作で行われたとあります。"}, {"t": 247.73333333333332, "x": "一か所にとどまった期間は、合わせて二十一日ほどでした。"}, {"t": 251.8, "x": "いちばん深い穴は、海の底から"}, {"t": 254.33333333333334, "x": "四百二十八メートル近くまで届きました。"}, {"t": 257.1166666666667, "x": "掘り進んだ長さはおよそ四百九十五メートル。"}, {"t": 260.4166666666667, "x": "そのうち、泥の柱として持ち帰ることができたのは、"}, {"t": 264.18333333333334, "x": "三百三十九メートルほどです。"}, {"t": 266.65, "x": "船が北極の海を離れたのは、9月の半ばでした。"}, {"t": 270.46666666666664, "x": "泥の柱は、その年の11月、ドイツのブレーメンで、"}, {"t": 274.78333333333336, "x": "多くの研究者によって切り分けられ、調べられました。"}, {"t": 278.75, "x": "その中には、およそ五千五百万年ぶんの、"}, {"t": 281.93333333333334, "x": "北極の海の記録が収められていました。"}, {"t": 284.7, "x": "いちばん下には、暑かった北極。"}, {"t": 287.3833333333333, "x": "うえへ進むにつれて、少しずつ寒くなっていく北極。"}, {"t": 291.0833333333333, "x": "その途中に、塩の抜けた海の時代が挟まっていたのです。"}, {"t": 295.03333333333336, "x": "泥の柱のいちばん深いあたりには、"}, {"t": 297.31666666666666, "x": "五千五百万年ほど前の記録がありました。"}, {"t": 300.4, "x": "地質の時代でいえば、暁新世と始新世の境目です。"}, {"t": 302.85, "x": "暁新世█"}, {"t": 303.8333333333333, "x": "始新世█"}, {"t": 306.05, "x": "この境目で、地球は、短く激しい温暖化を経験しています。"}, {"t": 311.06666666666666, "x": "大量の温室効果ガスが空気の中に入ったことと"}, {"t": 314.18333333333334, "x": "結びついている、とされる出来事です。"}, {"t": 316.85, "x": "2006年、この泥の柱を調べた研究班が、"}, {"t": 320.6, "x": "当時の北極の海の表面の水温を見積もりました。"}, {"t": 324.3333333333333, "x": "その答えは、十八度ほどから、二十三度を"}, {"t": 327.81666666666666, "x": "超えるまで上がった、というものでした。"}, {"t": 330.3833333333333, "x": "北極点のすぐ近くの海が、です。"}, {"t": 333.4166666666667, "x": "論文の表題には、「亜熱帯のような北極の"}, {"t": 336.71666666666664, "x": "海の水温」という言葉が入っています。"}, {"t": 339.75, "x": "これほど温かい海であれば、氷は浮かんでいません。"}, {"t": 343.4166666666667, "x": "白い氷が無ければ、日ざしを宇宙へ"}, {"t": 346.15, "x": "はね返す働きも、ほとんどありません。"}, {"t": 348.81666666666666, "x": "論文も、このときの北極の暖かさを、氷がとけて"}, {"t": 352.93333333333334, "x": "暖まりやすくなったせいにはできない、としています。"}, {"t": 356.21666666666664, "x": "さらに論文は、この温暖化の前後の水温も、計算で"}, {"t": 360.6666666666667, "x": "予想されていた値より十度以上高かった、と書いています。"}, {"t": 364.7, "x": "温室効果ガスの多さだけでは、まだ説明し"}, {"t": 367.9, "x": "きれないほど、北極は暖かかったということです。"}, {"t": 371.1, "x": "温暖化の山そのものは、短く終わりました。"}, {"t": 374.3666666666667, "x": "けれども、地球全体の暑さは、そのあとも続きます。"}, {"t": 378.45, "x": "五千三百万年前から五千百万年前ごろ、"}, {"t": 381.76666666666665, "x": "地球は、この六千六百万年で"}, {"t": 384.6333333333333, "x": "いちばん二酸化炭素の多い時期を迎えました。"}, {"t": 387.3833333333333, "x": "2023年、世界の研究者が集まり、それまでに"}, {"t": 391.8333333333333, "x": "出されていた二酸化炭素の見積もりを一つずつ"}, {"t": 394.48333333333335, "x": "確かめ直して、六千六百万年ぶんの記録にまとめています。"}, {"t": 398.65, "x": "そのまとめでは、五千百万年前ごろ、"}, {"t": 401.6166666666667, "x": "二酸化炭素はおよそ千六百に達したとされます。"}, {"t": 405.06666666666666, "x": "百万個の粒のうち、千六百個という意味です。"}, {"t": 408.75, "x": "同じまとめは、五千万年前ごろの地球の表面の平均気温を、"}, {"t": 413.48333333333335, "x": "いまより十二度ほど高いと見積もっています。"}, {"t": 416.35, "x": "始新世のはじめから中ごろにかけての北極の"}, {"t": 419.21666666666664, "x": "海の水温は、十度ほどだったとする研究があります。"}, {"t": 422.96666666666664, "x": "同じころ、赤道の近くの海の水温は、"}, {"t": 426.05, "x": "いまより少し高い程度だったとされます。"}, {"t": 428.73333333333335, "x": "つまり、赤道と北極の温度の差が、"}, {"t": 431.6333333333333, "x": "いまよりずっと小さかったのです。"}, {"t": 433.9166666666667, "x": "この差の小ささは、水の巡り方を変えます。"}, {"t": 437.1666666666667, "x": "暑い地球では、海からよく水が蒸発し、"}, {"t": 440.46666666666664, "x": "その水が、雨や雪となって、よく降ります。"}, {"t": 444.6, "x": "2006年の論文は、当時の北極のような高い"}, {"t": 448.15, "x": "緯度では、降る水の量が、蒸発して出ていく水の"}, {"t": 451.81666666666666, "x": "量を上回っていたはずだ、という見方を紹介しています。"}, {"t": 455.6666666666667, "x": "いまの水の巡り方と、気候の計算からの予想です。"}, {"t": 459.45, "x": "ただし論文は、それを海の側から確かめる"}, {"t": 462.56666666666666, "x": "証拠は、ほとんど無かったとも書いています。"}, {"t": 465.35, "x": "北極の海は、本当に、降り注ぐ水を受け止めていたのか。"}, {"t": 469.85, "x": "その答えが、泥の柱の中ほどから出てきました。"}, {"t": 473.3833333333333, "x": "泥の柱のうち、始新世の中ごろのはじめにあたる部分。"}, {"t": 477.55, "x": "そこには、目に見えないほど細かな縞が、"}, {"t": 480.4166666666667, "x": "何枚も何枚も重なった泥がありました。"}, {"t": 483.25, "x": "その縞の中か const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
