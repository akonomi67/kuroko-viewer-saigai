<script>
const D={"name": "ep036", "file": "ep036", "dur": 1930.0833125, "segs": [], "subs": [{"t": 0.0, "x": "冬の朝の、天気の衛星の写真を思い浮かべてください。"}, {"t": 3.95, "x": "日本列島の左側の海に、白い"}, {"t": 6.733333333333333, "x": "雲のすじがびっしり並んでいます。"}, {"t": 8.816666666666666, "x": "大陸の海岸から、列島に向かって何本も伸びています。"}, {"t": 12.866666666666667, "x": "この雲が日本海側の町に雪を降らせます。"}, {"t": 15.9, "x": "気象庁は、この雪雲のでき方をこう説明しています。"}, {"t": 19.85, "x": "大陸から吹き出す冷たく乾いた"}, {"t": 21.816666666666666, "x": "風が、暖かい日本海を渡ります。"}, {"t": 24.583333333333332, "x": "そのあいだに、海の面から熱と水蒸気を受け取ります。"}, {"t": 28.566666666666666, "x": "そうして雪雲が生まれます。"}, {"t": 30.416666666666668, "x": "つまり、雪雲のもとは日本海という海そのものです。"}, {"t": 34.13333333333333, "x": "ではその日本海は、いつからあるのでしょうか。"}, {"t": 37.31666666666667, "x": "海は昔からそこにあった、と思われがちです。"}, {"t": 40.7, "x": "けれども日本海は、地球の歴史の"}, {"t": 43.28333333333333, "x": "中ではかなり新しい海です。"}, {"t": 45.3, "x": "およそ2000万年前のころを考えます。"}, {"t": 48.03333333333333, "x": "ここには、まだ広い海はありませんでした。"}, {"t": 50.983333333333334, "x": "今の日本列島にあたる大地を見てみます。"}, {"t": 53.81666666666667, "x": "その大地は、アジア大陸の東の縁にくっついていました。"}, {"t": 58.016666666666666, "x": "その縁が裂けて、大陸から離れていきました。"}, {"t": 61.35, "x": "裂け目は広がり、そこへ海の水が入りました。"}, {"t": 64.83333333333333, "x": "離れていった大地が今の日本列島です。"}, {"t": 67.71666666666667, "x": "入ってきた海が今の日本海です。"}, {"t": 70.05, "x": "大地が裂けるというのは、ゆっくりした"}, {"t": 72.63333333333334, "x": "出来事ではありません。裂け目からは溶岩がわき出し、"}, {"t": 75.93333333333334, "x": "海の底では火山が火を噴きました。"}, {"t": 78.68333333333334, "x": "大地そのものが、向きを変えながら動きました。"}, {"t": 81.83333333333333, "x": "山も谷も、川も海岸も。すべてが大地ごと動きました。"}, {"t": 86.23333333333333, "x": "西の半分は時計回りに、東の半分は反対回りに回った。"}, {"t": 91.01666666666667, "x": "両開きの扉が開くように海が開いた。"}, {"t": 93.81666666666666, "x": "そう考える説があります。観音開きの説と呼ばれています。"}, {"t": 97.96666666666667, "x": "ただしこの説には今も反論があります。"}, {"t": 100.53333333333333, "x": "回ったのはいつなのか。本当に扉のように開いたのか。"}, {"t": 104.26666666666667, "x": "それとも横にずれながら裂けたのか。"}, {"t": 106.5, "x": "この回の主語は裂けた大地と海の底です。"}, {"t": 109.26666666666667, "x": "手がかりは3つあります。海の底を掘って取り出した石。"}, {"t": 112.95, "x": "陸の石の中に残った古い磁石の向き。"}, {"t": 115.6, "x": "そして、海の底の火山がつくった黒い鉱石です。"}, {"t": 119.35, "x": "この3つを順にたどります。"}, {"t": 121.18333333333334, "x": "どこまでが確かでどこからが解釈なのか。"}, {"t": 123.8, "x": "その線を引きながら進みます。"}, {"t": 125.91666666666667, "x": "数字が資料によって違う所は、両方を並べます。"}, {"t": 129.75, "x": "最後は、冬の海辺に雪雲がやって来る景色に戻ります。"}, {"t": 133.85, "x": "まず今の日本海の形を見ておきます。"}, {"t": 136.45, "x": "日本海は、アジア大陸と日本列島に囲まれた海です。"}, {"t": 140.7, "x": "こうした大陸の縁にあって島々に"}, {"t": 142.81666666666666, "x": "囲まれた海を、縁海と呼びます。"}, {"t": 145.31666666666666, "x": "気象庁の資料によれば、日本海の"}, {"t": 147.85, "x": "平均の深さは1667メートルです。"}, {"t": 150.98333333333332, "x": "それなのに外の海とつながる"}, {"t": 152.7, "x": "出入り口は、浅くて狭い海峡だけです。"}, {"t": 155.65, "x": "南には、九州と朝鮮半島のあいだの対馬海峡があります。"}, {"t": 160.25, "x": "北東には、本州と北海道のあいだの津軽海峡があります。"}, {"t": 164.55, "x": "北には、北海道とサハリンのあいだの宗谷海峡があります。"}, {"t": 168.75, "x": "さらにその奥には、大陸とサハリンのあいだの"}, {"t": 171.88333333333333, "x": "細い海峡があります。深い大きなお盆に、"}, {"t": 174.85, "x": "小さな口がいくつか開いている形です。"}, {"t": 177.66666666666666, "x": "どの海峡も日本海の深さにくらべるとずっと浅い所です。"}, {"t": 181.53333333333333, "x": "外の海の水はこの浅い口をとおってしか出入りできません。"}, {"t": 185.18333333333334, "x": "そのため日本海は、外の海とは"}, {"t": 187.73333333333332, "x": "少し違う性質の海になっています。"}, {"t": 190.1, "x": "このことは終章の雪の話にもつながります。"}, {"t": 193.05, "x": "お盆の底も平らではありません。"}, {"t": 195.16666666666666, "x": "海上保安庁の説明があります。"}, {"t": 197.55, "x": "海の真ん中には大和堆と北大和堆という高まりがあります。"}, {"t": 201.41666666666666, "x": "この高まりが、海の底をいくつかに分けています。"}, {"t": 204.93333333333334, "x": "北の広く深い部分が日本海盆です。"}, {"t": 207.65, "x": "南西の部分が対馬海盆です。"}, {"t": 209.96666666666667, "x": "南東の部分が大和海盆です。"}, {"t": 212.33333333333334, "x": "この3つの海盆と真ん中の高まり。"}, {"t": 214.76666666666668, "x": "これが日本海の底の大きな形です。"}, {"t": 217.33333333333334, "x": "この形には意味があります。"}, {"t": 219.18333333333334, "x": "海の底の岩を調べると、場所によって岩の種類が違います。"}, {"t": 223.51666666666668, "x": "真ん中の大和堆の下には、大陸と"}, {"t": 226.25, "x": "同じような厚い岩があります。"}, {"t": 228.11666666666667, "x": "ところがまわりの深い海盆の下には、"}, {"t": 230.48333333333332, "x": "薄い海の底の岩があります。"}, {"t": 232.81666666666666, "x": "大陸の岩と海の岩が、まだらに並んでいるのです。"}, {"t": 236.38333333333333, "x": "もし日本海が太古の昔からずっと海だったなら、"}, {"t": 239.51666666666668, "x": "こうはなりません。大陸の一部だった"}, {"t": 242.01666666666668, "x": "大地が、引きのばされてちぎれた。"}, {"t": 244.36666666666667, "x": "ちぎれた間に新しい海の底ができた。"}, {"t": 247.15, "x": "大和堆は、そのとき取り残された大陸のかけら。"}, {"t": 250.63333333333333, "x": "そう読むと、まだらの並びがすっきり説明できます。"}, {"t": 254.28333333333333, "x": "大陸の岩は厚くて軽い岩です。"}, {"t": 256.6, "x": "海の底の岩は薄くて重い岩です。"}, {"t": 259.1166666666667, "x": "2つはでき方がまったく違います。"}, {"t": 261.4166666666667, "x": "厚い岩のかけらが薄い岩の海に浮かんでいる。"}, {"t": 264.46666666666664, "x": "それが日本海の底の姿です。"}, {"t": 266.76666666666665, "x": "日本海の底は裂けた跡そのものなのです。"}, {"t": 269.5, "x": "では裂ける前のこの場所は、"}, {"t": 271.3666666666667, "x": "どんな姿だったのでしょうか。時間をさかのぼります。"}, {"t": 274.93333333333334, "x": "およそ3000万年前より前のことです。"}, {"t": 277.6166666666667, "x": "今の日本海のあたりに、広い海はまだありません。"}, {"t": 281.1333333333333, "x": "今の日本列島にあたる大地は、"}, {"t": 283.35, "x": "アジア大陸の東の縁の一部でした。"}, {"t": 286.25, "x": "その東側には、太平洋の海の底がありました。"}, {"t": 290.03333333333336, "x": "太平洋の海の底の板は、大陸の下へ沈みこんでいました。"}, {"t": 294.46666666666664, "x": "板が沈みこむ場所の上では、マグマができやすくなります。"}, {"t": 298.3666666666667, "x": "そのため大陸の東の縁には、"}, {"t": 300.46666666666664, "x": "火山の帯が長く伸びていました。"}, {"t": 302.78333333333336, "x": "今の日本列島で火山が多いのと、同じしくみです。"}, {"t": 306.5, "x": "違うのはその火山の帯が、大陸とつながっていたことです。"}, {"t": 310.56666666666666, "x": "日本海の底を掘った国際的な調査は、こうまとめています。"}, {"t": 314.85, "x": "日本海の南東の部分は、大陸の"}, {"t": 317.6166666666667, "x": "縁の火山の帯が裂けてできた。"}, {"t": 319.55, "x": "裂けはじめたのは、中新世と呼ばれる時代のはじめ。"}, {"t": 323.23333333333335, "x": "1900万年前より前だった。"}, {"t": 325.7, "x": "ではなぜ大陸の縁が裂けたのでしょうか。"}, {"t": 328.26666666666665, "x": "沈みこむ板の上で大陸の縁が"}, {"t": 330.43333333333334, "x": "引きのばされたから、という説明があります。"}, {"t": 333.3833333333333, "x": "大陸の内側の大きな横ずれの断層に"}, {"t": 336.01666666666665, "x": "引っぱられたから、という説明もあります。"}, {"t": 338.81666666666666, "x": "この点は、のちの章でもう一度取り上げます。"}, {"t": 341.95, "x": "ここで押さえておきたいのは一つです。"}, {"t": 344.25, "x": "列島は最初から島だったわけではない。"}, {"t": 346.81666666666666, "x": "大陸の一部でした。陸続きの土地でした。"}, {"t": 349.81666666666666, "x": "大陸の縁の火山の並ぶ土地だった。"}, {"t": 352.23333333333335, "x": "愛知教育大学の星博幸さんは、"}, {"t": 354.75, "x": "2018年の総説でこう書いています。"}, {"t": 357.75, "x": "日本海が開きはじめたころのこと。"}, {"t": 360.01666666666665, "x": "西南日本はほとんど回らずに、大陸から離れていった。"}, {"t": 364.26666666666665, "x": "その後、1800万年前から"}, {"t": 366.7, "x": "1600万年前のころに大きく向きを変えた。"}, {"t": 369.75, "x": "時計回りに40度ほど回りながら、"}, {"t": 372.15, "x": "今の位置へすばやく動いた。"}, {"t": 374.3, "x": "つまり離れていく動きと、回る動きは別でした。"}, {"t": 377.9166666666667, "x": "同じ時期ではなかったという見方です。"}, {"t": 380.26666666666665, "x": "離れはじめたのは、始新世から漸新世にかけて。"}, {"t": 383.93333333333334, "x": "およそ3000万年前を前後する、"}, {"t": 386.3, "x": "もっと古い時代とされています。"}, {"t": 388.5833333333333, "x": "大地が大陸から離れるには、"}, {"t": 390.45, "x": "長い準備の時間があったことになります。"}, {"t": 393.1333333333333, "x": "最初はゆっくり引きのばされる。やがて裂け目が深くなる。"}, {"t": 396.75, "x": "そしてある時期に、大きく向きを変えて動く。"}, {"t": 399.8, "x": "その動きの一つ一つが大地にとっては大きな事件でした。"}, {"t": 403.51666666666665, "x": "地面が割れ溝ができそこに溶岩がわきました。"}, {"t": 406.51666666666665, "x": "川の流れも変わり海の形も変わりました。"}, {"t": 409.35, "x": "その積み重ねの先に今の列島と海があります。"}, {"t": 412.56666666666666, "x": "日本海の誕生は、一度に起きたことではありません。"}, {"t": 416.23333333333335, "x": "いくつもの段階を重ねた出来事でした。"}, {"t": 418.76666666666665, "x": "大地が引きのばされると、何が起きるでしょうか。"}, {"t": 422.1, "x": "厚い岩の板が薄くなっていきます。"}, {"t": 424.45, "x": "薄くなったところは沈みはじめます。"}, {"t": 426.7, "x": "地面に大きな溝のような低い土地ができます。"}, {"t": 429.65, "x": "その底には川が土砂を運びこみます。"}, {"t": 432.26666666666665, "x": "やがて溝の底に海の水が流れこみます。"}, {"t": 435.1, "x": "溝は少しずつ広がります。底はさらに深くなります。"}, {"t": 438.81666666666666, "x": "海の水は、奥まで入りこみます。"}, {"t": 441.5, "x": "日本海の底の調査では、こうした流れが読み取られました。"}, {"t": 445.5, "x": "裂けはじめのころ、玄武岩の溶岩がわき出しました。"}, {"t": 449.1333333333333, "x": "その横では、川の河口や浅い海に"}, {"t": 451.95, "x": "たまる砂や泥が積もっていました。"}, {"t": 453.9166666666667, "x": "最初は浅い、陸に近い場所だったということです。"}, {"t": 457.3666666666667, "x": "その後、大和海盆の底はすばやく沈みました。"}, {"t": 460.9, "x": "海は広がり深くなりました。"}, {"t": 462.78333333333336, "x": "大和海盆の下には、玄武岩の板が差しこんでいます。"}, {"t": 466.7, "x": "その板が、何枚も重なっています。"}, {"t": 469.48333333333335, "x": "その厚さは、少なくとも350メートルあります。"}, {"t": 473.28333333333336, "x": "マグマが、たまった泥の中へ"}, {"t": 475.35, "x": "横から何度も差しこんで固まった跡です。"}, {"t": 477.95, "x": "裂け目ができたあともマグマは入り続けました。"}, {"t": 480.8333333333333, "x": "その長さは少なくとも350万年とされています。"}, {"t": 484.53333333333336, "x": "では海の水が入ったのはいつでしょうか。"}, {"t": 487.1, "x": "手がかりは海の底の泥の中にある、ごく小さな化石です。"}, {"t": 491.15, "x": "化石は海の水があった証拠になります。"}, {"t": 493.73333333333335, "x": "海の水がなければその化石は泥の中に残りません。"}, {"t": 497.1, "x": "だから、化石の入った泥の年代を測ります。"}, {"t": 500.43333333333334, "x": "すると、海の水が入った時期が分かります。"}, {"t": 503.71666666666664, "x": "海にだけすむとても小さな殻の化石です。"}, {"t": 506.48333333333335, "x": "大和海盆で掘り出した泥の中から、"}, {"t": 508.8333333333333, "x": "この化石が見つかりました。"}, {"t": 510.73333333333335, "x": "それをもとにした研究は、こう述べています。"}, {"t": 513.95, "x": "日本海に海の水が入ったのは、遅くとも"}, {"t": 516.95, "x": "1700万年前から1800万年前。"}, {"t": 520.0333333333333, "x": "拡大が始まったのは、少なくとも"}, {"t": 522.45, "x": "1800万年前から2000万年前より前だった。"}, {"t": 525.9166666666666, "x": "これはある数字と食い違っていました。"}, {"t": 528.1833333333333, "x": "それより前は、陸の石の磁石から"}, {"t": 530.7, "x": "別の数字が言われていました。"}, {"t": 532.45, "x": "日本海が開いたのは1500万年前ごろだというのです。"}, {"t": 536.25, "x": "海の底の泥は、それより少なくとも"}, {"t": 538.85, "x": "200万年は早いと言っていました。"}, {"t": 541.0166666666667, "x": "陸の石と海の泥。どちらが正しいのか。"}, {"t": 543.9333333333333, "x": "それとも、両方が別のことを測っていたのか。"}, {"t": 547.2333333333333, "x": "この食い違いは、のちの研究で"}, {"t": 549.5666666666667, "x": "少しずつほどかれていきます。"}, {"t": 551.2833333333333, "x": "その話に入る前に、海の底を"}, {"t": 554.0, "x": "掘った調査そのものを見ておきます。"}, {"t": 556.1166666666667, "x": "海の底の岩を調べるには、掘るしかありません。"}, {"t": 559.4333333333333, "x": "深い海の底へ、細い管を下ろします。"}, {"t": 562.5666666666667, "x": "そこからさらに下の岩まで、掘り進めます。"}, {"t": 565.7166666666667, "x": "取り出した岩や泥の柱を、船の上で調べます。"}, {"t": 569.35, "x": "泥の柱には上から下へ時代の順に泥が"}, {"t": 571.9, "x": "重なっています。下へ行くほど古い泥です。"}, {"t": 574.9166666666666, "x": "いちばん下の岩まで届いたとします。"}, {"t": 577.3, "x": "すると、その場所の海の底ができた時期に近づけます。"}, {"t": 581.05, "x": "国際的な海洋掘削の計画で、"}, {"t": 583.5, "x": "日本海は2回の航海で調べられました。"}, {"t": 586.4166666666666, "x": "1回目の航海では、大和海盆と"}, {"t": 589.25, "x": "日本海盆で4か所を掘りました。"}, {"t": 591.4166666666666, "x": "2回目の航海では、2か所を掘りました。"}, {"t": 594.3833333333333, "x": "隠岐の沖の高まりと、大和堆の北の溝です。"}, {"t": 597.6833333333333, "x": "合わせて6か所です。どの穴も、"}, {"t": 600.0, "x": "深い海の底から掘られました。"}, {"t": 602.15, "x": "取り出した柱は、何百メートルにもなりました。"}, {"t": 605.5, "x": "掘った結果は、場所によってはっきり違いました。"}, {"t": 608.85, "x": "南東の大和海盆では、先ほどの"}, {"t": 611.55, "x": "玄武岩の重なりが出てきました。"}, {"t": 613.5166666666667, "x": "裂けはじめは1900万年前より前でした。"}, {"t": 616.7666666666667, "x": "ところが北の日本海盆では違いました。"}, {"t": 619.3833333333333, "x": "海の底の土台の岩はおよそ1400万年前だったのです。"}, {"t": 623.4, "x": "同じ日本海でも、南東と北で"}, {"t": 625.85, "x": "500万年ほど年代がずれていたのです。"}, {"t": 628.3666666666667, "x": "これは、海が一度に開いたのではないことを示しています。"}, {"t": 632.3333333333334, "x": "南東の部分が先に裂け、北の深い"}, {"t": 635.1833333333333, "x": "部分の底はあとからできた。"}, {"t": 636.9166666666666, "x": "あるいは北の底の岩が、あとから上を覆った。"}, {"t": 640.2166666666667, "x": "どちらにしても、単純な形ではなさそうです。"}, {"t": 643.5166666666667, "x": "一枚の扉がさっと開いたのとは違います。"}, {"t": 646.4833333333333, "x": "掘削では岩の種類も調べられました。"}, {"t": 649.05, "x": "大和堆の北の溝の下は大陸の地殻でした。"}, {"t": 652.1, "x": "となりの海盆の下は海の地殻か、"}, {"t": 654.3333333333334, "x": "大陸と海の中間の地殻でした。"}, {"t": 656.9666666666667, "x": "第1章で見た、まだらの並びです。"}, {"t": 659.6833333333333, "x": "大陸のかけらが残り、そのまわりが"}, {"t": 662.3166666666667, "x": "引きのばされて海の底になった。"}, {"t": 664.2333333333333, "x": "掘った岩はその読みを裏づけました。"}, {"t": 666.5, "x": "掘削のまとめには、もう一つ大事な一文があります。"}, {"t": 670.2, "x": "日本海の北東の縁はおよそ180万年前から、"}, {"t": 673.8333333333334, "x": "押されて縮みはじめた。広がっていた海がある時から、"}, {"t": 677.4666666666667, "x": "逆に押される側に回ったのです。"}, {"t": 679.9166666666666, "x": "この話は第10章で取り上げます。"}, {"t": 682.2833333333333, "x": "ここまでで日本海の底ができた時期が見えてきました。"}, {"t": 685.5166666666667, "x": "2000万年前前後から1400万年前ごろにかけてです。"}, {"t": 689.5833333333334, "x": "ではその間に、列島の側の大地はどう動いたのでしょうか。"}, {"t": 693.85, "x": "海の底の岩は、そこまでは教えてくれません。"}, {"t": 697.1, "x": "次の手がかりは陸の石の中にあります。"}, {"t": 699.6666666666666, "x": "地球は大きな磁石です。方位磁針の針が"}, {"t": 702.5833333333334, "x": "北を指すのは、そのためです。"}, {"t": 704.85, "x": "溶岩が冷えて固まるときのことです。"}, {"t": 707.1833333333333, "x": "岩の中には鉄を含む小さな粒があります。"}, {"t": 710.2166666666667, "x": "その粒がその時の地球の磁石の向きにそろいます。"}, {"t": 713.5166666666667, "x": "そろったまま固まるので岩の中に、"}, {"t": 715.65, "x": "その時の北の向きが記録されます。"}, {"t": 718.1833333333333, "x": "海や湖の底に泥がたまるときも、似たことが起きます。"}, {"t": 722.0333333333333, "x": "泥の中の小さな磁石の粒が、北を向いてたまります。"}, {"t": 725.8666666666667, "x": "つまり石の中には、小さな方位磁針が"}, {"t": 728.85, "x": "閉じこめられているのです。"}, {"t": 730.2666666666667, "x": "何千万年たっても、その向きは残ります。"}, {"t": 733.5, "x": "石は、その時の北を覚えているのです。"}, {"t": 736.5, "x": "石を、元の向きのまま注意して取り出します。"}, {"t": 739.8, "x": "実験室でその中の磁石の向きを測ります。"}, {"t": 742.8666666666667, "x": "するとその石ができた時に、"}, {"t": 744.6333333333333, "x": "北がどちらだったかが分かります。"}, {"t": 746.95, "x": "地球の北は、長い目で見ればほぼ同じ方向にあります。"}, {"t": 750.8, "x": "もし石の中の北が、今の北とずれていたらどうでしょうか。"}, {"t": 754.75, "x": "地球の北が動いたのではありません。"}, {"t": 757.0666666666667, "x": "石の乗っている大地のほうが回った、と考えられます。"}, {"t": 760.8166666666667, "x": "これが、古い磁石から大地の回転を読む方法です。"}, {"t": 764.7, "x": "ただし北の向きを測るだけでは足りません。"}, {"t": 767.2666666666667, "x": "石ができた年代もあわせて測る必要があります。"}, {"t": 770.5166666666667, "x": "いつの北なのかが、まず要ります。"}, {"t": 773.0333333333333, "x": "それが分からなければ、いつ回ったのかも分かりません。"}, {"t": 776.6166666666667, "x": "そこで石の年代と磁石の向きを組にして調べていきます。"}, {"t": 780.3, "x": "1980年代日本の研究者たちは、"}, {"t": 783.6, "x": "この方法で列島の石を調べました。"}, {"t": 786.3333333333334, "x": "西南日本の、2000万年前前後より古い石を測りました。"}, {"t": 791.0, "x": "すると石の中の北は、今の北よりも"}, {"t": 793.7, "x": "東へかたよっていました。偏りは40度前後にもなりました。"}, {"t": 797.7166666666667, "x": "石ができたあとで、大地が時計回りに回ったと読めます。"}, {"t": 801.7166666666667, "x": "一方東北日本の古い石では、"}, {"t": 804.0833333333334, "x": "北の向きが逆の西へかたよっていました。"}, {"t": 806.9166666666666, "x": "東北日本は、反時計回りに回ったと読めます。"}, {"t": 810.55, "x": "回った向きが西と東で反対だったのです。"}, {"t": 813.4333333333333, "x": "もちろん、一つの石だけでは決められません。"}, {"t": 816.5833333333334, "x": "岩ができたあとに、断層で小さく回ることもあります。"}, {"t": 820.35, "x": "熱や水で、磁石の向きが書きかわることもあります。"}, {"t": 823.9, "x": "そこで研究者たちはたくさんの場所で、"}, {"t": 826.35, "x": "たくさんの石を測りました。"}, {"t": 828.4833333333333, "x": "年代の違う石を並べて、いつから"}, {"t": 831.1333333333333, "x": "偏りが小さくなるのかも調べました。"}, {"t": 833.4833333333333, "x": "新しい石ほど、偏りは小さくなっていました。"}, {"t": 836.9166666666666, "x": "ある時期より新しい石では、"}, {"t": 838.7666666666667, "x": "偏りはほとんどありませんでした。"}, {"t": 841.1666666666666, "x": "回転はある時期に起きて、そして止まったのです。"}, {"t": 844.5, "x": "西南日本は時計回り。東北日本は反時計回り。"}, {"t": 848.75, "x": "この2つを地図の上で合わせてみます。"}, {"t": 851.1333333333333, "x": "今の日本列島は、弓のような形をしています。"}, {"t": 854.7333333333333, "x": "真ん中あたりで、大きく折れ曲がっています。"}, {"t": 857.7, "x": "西南日本を、反時計回りに40度ほど戻してみます。"}, {"t": 861.9, "x": "すると、九州から近畿にかけての大地の向きが変わります。"}, {"t": 865.9166666666666, "x": "大陸の縁にそって、南北に近い向きになります。"}, {"t": 869.55, "x": "東北日本を時計回りに戻してみます。"}, {"t": 872.3166666666667, "x": "すると、東北の大地も大陸の縁に近づきます。"}, {"t": 875.9166666666666, "x": "2つの大地を戻すと、日本海は"}, {"t": 878.05, "x": "ほとんど閉じてしまいます。海が消えます。"}, {"t": 881.0833333333334, "x": "列島と大陸のあいだの隙間が、なくなります。"}, {"t": 884.3833333333333, "x": "列島は大陸の東の縁に、ぴったり寄りそう位置に戻ります。"}, {"t": 888.7, "x": "逆に、そこから2つの大地を反対向きに回すとどうなるか。"}, {"t": 892.9166666666666, "x": "西は右へ東は左へ。扉の蝶番は、"}, {"t": 895.8333333333334, "x": "列島の両端のあたりにあると考えます。"}, {"t": 899.3166666666667, "x": "両開きの扉が開くように、真ん中に隙間ができます。"}, {"t": 903.2166666666667, "x": "その隙間が日本海です。1985年、日本の"}, {"t": 907.0666666666667, "x": "研究チームがこの考えを発表しました。"}, {"t": 910.5166666666667, "x": "科学雑誌のネイチャーです。"}, {"t": 912.3166666666667, "x": "日本海の開き方を、列島の古い"}, {"t": 915.0666666666667, "x": "磁石の向きから読み取った研究です。"}, {"t": 917.3833333333333, "x": "この開き方は、観音開きと呼ばれるようになりました。"}, {"t": 921.1333333333333, "x": "仏壇や戸棚の左右に開く扉の呼び名です。"}, {"t": 924.2333333333333, "x": "両開きの扉は片方を右へ片方を左へ開きます。"}, {"t": 928.1166666666667, "x": "2枚の扉は反対の向きに回ります。"}, {"t": 930.7166666666667, "x": "西南日本と東北日本の回り方はまさにその形でした。"}, {"t": 934.95, "x": "この説の強みはわかりやすさでした。"}, {"t": 937.3333333333334, "x": "古い磁石の向きという、測れるものから出発している。"}, {"t": 941.05, "x": "西と東で反対に回ったという、"}, {"t": 943.3, "x": "目立つ特徴をそのまま説明できる。"}, {"t": 945.9666666666667, "x": "そして日本海の底がなぜあの形を"}, {"t": 948.3333333333334, "x": "しているのかも、大まかに説明できる。"}, {"t": 950.9, "x": "ただしこの説には一つ、大きな前提があります。"}, {"t": 954.4333333333333, "x": "西南日本も東北日本も、一枚の"}, {"t": 957.6166666666667, "x": "固い板だったという前提です。"}, {"t": 959.5666666666667, "x": "その板が、丸ごと回ったと考えるのです。"}, {"t": 962.8666666666667, "x": "大きな板が丸ごと回ったとします。"}, {"t": 965.1833333333333, "x": "それなら、どこの石を測っても"}, {"t": 967.4333333333333, "x": "同じだけの偏りが出るはずです。"}, {"t": 969.4333333333333, "x": "実際には、場所によって偏りの量に差がありました。"}, {"t": 973.1, "x": "西南日本の中でも、差がありました。"}, {"t": 976.15, "x": "真ん中と東の端とで、回った量が"}, {"t": 978.95, "x": "違うという報告があります。この差をどう読むのか。"}, {"t": 982.1833333333333, "x": "大きな板の回転の中の、小さなゆがみなのか。"}, {"t": 985.6666666666666, "x": "それとも、そもそも大きな板は回っていないのか。"}, {"t": 989.1, "x": "ここから議論が分かれていきます。"}, {"t": 991.1666666666666, "x": "まず回った時期の議論です。"}, {"t": 993.0, "x": "長いあいだ広く使われてきた見方があります。"}, {"t": 995.8666666666667, "x": "1500万年前ごろに、短い時間で"}, {"t": 998.8833333333333, "x": "速く回ったという見方です。"}, {"t": 1000.7166666666667, "x": "1500万年前より古い石は大きく"}, {"t": 1003.3833333333333, "x": "かたより、新しい石はかたよっていない。"}, {"t": 1006.2166666666667, "x": "だから1500万年前のころに"}, {"t": 1008.3333333333334, "x": "一気に回った、という読みです。"}, {"t": 1010.7, "x": "ところが、石の年代を測る方法が細かくなりました。"}, {"t": 1014.6333333333333, "x": "これまで1500万年前ごろとされていた石があります。"}, {"t": 1018.1833333333333, "x": "その年代が、見直されていきました。"}, {"t": 1020.8833333333333, "x": "2015年、新しい測定が発表されました。"}, {"t": 1024.6333333333334, "x": "愛知教育大学の星博幸さんたちの研究です。"}, {"t": 1028.15, "x": "調べたのは、西南日本の東の部分にある地層です。"}, {"t": 1032.2666666666667, "x": "年代は地層の中の小さな化石から分かっています。"}, {"t": 1035.6666666666667, "x": "1580万年前から1570万年前の地層です。"}, {"t": 1040.2833333333333, "x": "年代がはっきりした地層の、磁石の向きを測りました。"}, {"t": 1044.1166666666666, "x": "その結果、回転は1750万年前より"}, {"t": 1048.0166666666667, "x": "後に始まったと読めました。"}, {"t": 1049.5833333333333, "x": "同じ研究チームの学会の発表では、"}, {"t": 1052.2, "x": "もう少し細かく述べています。"}, {"t": 1054.3, "x": "回転はおよそ45度。そのうち8割ほどが、1750万年前から"}, {"t": 1059.8833333333334, "x": "1580万年前のあいだに起きた。"}, {"t": 1062.6333333333334, "x": "残りの2割ほどは、1500万年前までに終わった。"}, {"t": 1066.4666666666667, "x": "2018年、星さんは総説を出しました。"}, {"t": 1070.0333333333333, "x": "それまでの25年間の測定を集めたものです。"}, {"t": 1073.2666666666667, "x": "結論はこうです。回転は、1800万年前から"}, {"t": 1077.3333333333333, "x": "1600万年前のあいだのどこかで起きた。"}, {"t": 1080.1, "x": "以前の見方より、200万年ほど早いことになります。"}, {"t": 1083.8833333333334, "x": "回った量も見直されました。"}, {"t": 1085.7833333333333, "x": "西南日本を一枚の板として回ったと考えます。"}, {"t": 1089.2833333333333, "x": "すると回転の量は多くて41.7度。"}, {"t": 1092.3333333333333, "x": "誤差は前後に5.4度です。"}, {"t": 1094.5333333333333, "x": "実際にはそれより数度小さかったかも"}, {"t": 1096.9666666666667, "x": "しれない、としています。速さはどうでしょうか。"}, {"t": 1100.2833333333333, "x": "平均すると100万年で約21度。"}, {"t": 1103.0166666666667, "x": "あるいはそれ以上だった可能性がある、とされています。"}, {"t": 1106.6833333333334, "x": "100万年で21度と聞くと、とてもゆっくりに思えます。"}, {"t": 1110.85, "x": "人の一生では、まったく感じられない速さです。"}, {"t": 1114.4333333333334, "x": "1年にすれば、0.00002度ほどです。"}, {"t": 1118.1333333333334, "x": "けれども大地の動きとしては、とても速い部類です。"}, {"t": 1121.7166666666667, "x": "時計の長い針でいえば、100万年で"}, {"t": 1124.45, "x": "3分半ほど進む速さです。200万年あまりで40度。"}, {"t": 1128.5833333333333, "x": "時計の長い針が7分ほど進む角度です。"}, {"t": 1131.5333333333333, "x": "その角度を、西南日本という大地が"}, {"t": 1134.4666666666667, "x": "丸ごと回ったことになります。"}, {"t": 1136.2, "x": "ここで、第3章の食い違いを思い出してください。"}, {"t": 1139.6833333333334, "x": "海の底の泥は海が入った時期を示していました。"}, {"t": 1142.85, "x": "遅くとも1700万年前から1800万年前です。"}, {"t": 1146.75, "x": "陸の石は、かつて1500万年前と言っていました。"}, {"t": 1150.5, "x": "見直された陸の石の年代は、"}, {"t": 1152.5, "x": "1800万年前から1600万年前です。"}, {"t": 1156.0333333333333, "x": "海の底と陸の石の数字が、前より近づいたのです。"}, {"t": 1159.8833333333334, "x": "ただし近づいたことと、一致したことは別の話です。"}, {"t": 1163.5666666666666, "x": "回転の時期の見直しは今も続いています。"}, {"t": 1166.4166666666667, "x": "次に開き方の議論です。観音開きの説とは"}, {"t": 1169.65, "x": "別に、もう一つの有力な説があります。"}, {"t": 1172.7166666666667, "x": "横にずれながら裂けたという説です。"}, {"t": 1175.05, "x": "1994年ある論文が出ました。"}, {"t": 1177.9833333333333, "x": "フランスの研究者ジョリベさんと、"}, {"t": 1180.1, "x": "日本の研究者たちの論文です。"}, {"t": 1182.7333333333333, "x": "日本海の開き方をまとめたものでした。"}, {"t": 1185.3, "x": "その中で、日本海の開き方をこう述べています。"}, {"t": 1188.8166666666666, "x": "2本の大きな横ずれの帯のあいだで開いた。"}, {"t": 1191.6833333333334, "x": "横ずれとは、断層をはさんだ動き方の一つです。"}, {"t": 1195.2833333333333, "x": "両側の大地が、横にすれちがうように動きます。"}, {"t": 1198.8833333333334, "x": "2本の横ずれの帯が、平行に走っていたとします。"}, {"t": 1202.6666666666667, "x": "片方の帯ともう片方の帯のあいだで、"}, {"t": 1205.2, "x": "大地が横に引きのばされます。"}, {"t": 1207.4166666666667, "x": "すると帯にはさまれた部分が"}, {"t": 1209.2, "x": "引き裂かれて、くぼみができます。"}, {"t": 1211.4, "x": "こうしてできる引き裂かれたくぼみを、"}, {"t": 1213.4166666666667, "x": "引き離しの盆地と呼びます。"}, {"t": 1215.4166666666667, "x": "日本海はその巨大なものだった、という考えです。"}, {"t": 1219.1, "x": "論文はこの横ずれを、遠いインドと"}, {"t": 1221.85, "x": "アジアの衝突と結びつけています。"}, {"t": 1224.0, "x": "インドの大地がアジアにぶつかって押しこみます。"}, {"t": 1226.8333333333333, "x": "するとアジアの内側の大地が横へ押し出されます。"}, {"t": 1230.05, "x": "その押し出しが大陸の東の縁で、大きな横ずれをつくった。"}, {"t": 1234.4, "x": "横ずれにはさまれた場所が裂けて、日本海になった。"}, {"t": 1237.9166666666667, "x": "つまりこういう見方です。日本海は"}, {"t": 1240.2, "x": "扉のように開いたのではない。"}, {"t": 1242.1833333333334, "x": "大陸の中の大きなずれに引っぱられて裂けた。"}, {"t": 1245.0166666666667, "x": "では、古い磁石の向きはどう説明するのでしょうか。"}, {"t": 1248.6833333333334, "x": "この説の強みは別の所にあります。"}, {"t": 1251.25, "x": "日本海のまわりの大きな断層の並びを、"}, {"t": 1253.9, "x": "そのまま説明できることです。"}, {"t": 1256.0833333333333, "x": "大陸の側にも、横にずれた跡の残る"}, {"t": 1258.9166666666667, "x": "大きな断層が知られています。"}, {"t": 1260.75, "x": "この説でも大地は回ります。"}, {"t": 1262.7333333333333, "x": "ただし、列島全体が一枚の扉として回るのではありません。"}, {"t": 1267.2166666666667, "x": "横ずれの帯の中で、小さな地塊がそれぞれ回る。"}, {"t": 1270.7833333333333, "x": "南の帯の中では時計回りに。"}, {"t": 1273.1, "x": "北の帯の中では反時計回りに。"}, {"t": 1275.5333333333333, "x": "そう考えると西と東で回る向きが"}, {"t": 1277.9, "x": "逆だったことも、ある程度説明できます。"}, {"t": 1280.7333333333333, "x": "大きな扉は要りません。小さな板が、"}, {"t": 1283.4, "x": "たくさん回ればよいのです。"}, {"t": 1285.45, "x": "ジョリベさんたちは、それより"}, {"t": 1287.3666666666666, "x": "前の1991年にも論文を出しています。"}, {"t": 1290.8333333333333, "x": "そこではこの地塊の回転を加えた形を示していました。"}, {"t": 1294.5666666666666, "x": "ただし、合わない所も残りました。"}, {"t": 1297.3166666666666, "x": "古い磁石のすべての測定には、"}, {"t": 1299.46 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
