614}, {"t": 1832.9166666666667, "i": 615}, {"t": 1834.7666666666667, "i": 616}, {"t": 1837.7833333333333, "i": 617}, {"t": 1841.1666666666667, "i": 618}, {"t": 1844.1333333333334, "i": 619}, {"t": 1846.0166666666667, "i": 620}, {"t": 1848.9, "i": 621}, {"t": 1852.1, "i": 622}, {"t": 1854.9833333333333, "i": 623}, {"t": 1858.6166666666666, "i": 624}, {"t": 1861.4166666666667, "i": 625}, {"t": 1864.2, "i": 626}, {"t": 1867.6166666666666, "i": 627}, {"t": 1870.2833333333333, "i": 628}, {"t": 1873.7333333333333, "i": 629}, {"t": 1876.4666666666667, "i": 630}, {"t": 1878.65, "i": 631}, {"t": 1881.6666666666667, "i": 632}, {"t": 1884.35, "i": 633}, {"t": 1887.0, "i": 634}, {"t": 1890.2166666666667, "i": 635}, {"t": 1894.1333333333334, "i": 636}, {"t": 1898.1, "i": 637}, {"t": 1900.8166666666666, "i": 638}, {"t": 1904.7833333333333, "i": 639}, {"t": 1908.2166666666667, "i": 640}, {"t": 1910.55, "i": 641}, {"t": 1912.5833333333333, "i": 642}, {"t": 1915.6666666666667, "i": 643}, {"t": 1918.2333333333333, "i": 644}, {"t": 1920.6166666666666, "i": 645}, {"t": 1924.3833333333334, "i": 646}, {"t": 1927.0333333333333, "i": 647}, {"t": 1931.2666666666667, "i": 648}, {"t": 1934.4166666666667, "i": 649}, {"t": 1938.0, "i": 650}, {"t": 1940.95, "i": 651}, {"t": 1943.7666666666667, "i": 652}, {"t": 1947.3333333333333, "i": 653}, {"t": 1950.3166666666666, "i": 654}, {"t": 1952.6833333333334, "i": 654}], "subs": [{"t": 0.0, "x": "シベリアの北の端に、階段のような山地があります。"}, {"t": 3.7666666666666666, "x": "平らな面と、切り立った崖が、"}, {"t": 6.166666666666667, "x": "何段にも積み重なっています。"}, {"t": 8.433333333333334, "x": "遠くから見ると、巨大な石段が"}, {"t": 10.75, "x": "どこまでも続いているように見えます。"}, {"t": 12.9, "x": "この段の一枚一枚は、冷えて固まった溶岩です。"}, {"t": 16.666666666666668, "x": "一枚が流れ出て固まり、その上に次の一枚が流れ出る。"}, {"t": 20.983333333333334, "x": "それが何度も繰り返されて、いまの地形ができました。"}, {"t": 24.616666666666667, "x": "溶岩が出てきたのは、山の頂上の火口からではありません。"}, {"t": 28.716666666666665, "x": "地面に開いた割れ目から、洪水のようにあふれ出しました。"}, {"t": 32.55, "x": "この種類の火山活動を、研究者は"}, {"t": 35.61666666666667, "x": "洪水玄武岩█"}, {"t": 35.916666666666664, "x": "洪水玄武岩と呼んでいます。"}, {"t": 38.28333333333333, "x": "時代は、いまからおよそ2億5200万年前。"}, {"t": 40.516666666666666, "x": "2億5200万年前█"}, {"t": 42.53333333333333, "x": "溶岩が覆った範囲は、研究によって違いますが、"}, {"t": 46.2, "x": "五百万平方キロメートルから七百万平方キロメートル。"}, {"t": 50.3, "x": "日本の国土の、およそ十三倍から十八倍に当たります。"}, {"t": 54.46666666666667, "x": "ただ、この出来事の本当の大きさは、"}, {"t": 57.233333333333334, "x": "地表に見えている溶岩ではありません。"}, {"t": 59.85, "x": "溶岩の一部は、地上に出る前に、"}, {"t": 62.516666666666666, "x": "地下の地層のあいだへ横に入りこみました。"}, {"t": 65.33333333333333, "x": "そこには、石炭と、塩と、石灰岩が眠っていました。"}, {"t": 69.98333333333333, "x": "地下を進んだ熱は、それらを焼きました。"}, {"t": 72.9, "x": "焼かれた地層からは、大量のガスが出ていきました。"}, {"t": 76.41666666666667, "x": "そのガスが、地球の空気の中身を"}, {"t": 79.0, "x": "変えたと考えられています。"}, {"t": 80.66666666666667, "x": "同じ時期、地球は、生き物の"}, {"t": 83.26666666666667, "x": "歴史でもっとも大きな危機を迎えています。"}, {"t": 85.81666666666666, "x": "ただ、この回の主役は生き物ではありません。"}, {"t": 88.98333333333333, "x": "大地と、そこから出たガスと、空気の話です。"}, {"t": 92.65, "x": "火山が、地球の空をどう書き換えたのか。"}, {"t": 95.68333333333334, "x": "その記録を、順番に見ていきます。"}, {"t": 98.31666666666666, "x": "この地形には、名前があります。"}, {"t": 100.76666666666667, "x": "英語で「トラップ」と呼ばれます。"}, {"t": 103.75, "x": "由来は、スウェーデン語で階段を"}, {"t": 106.05, "x": "意味する「トラッパ」という言葉です。"}, {"t": 109.08333333333333, "x": "十八世紀の終わりごろから、"}, {"t": 110.91666666666667, "x": "地質の言葉として使われてきました。"}, {"t": 113.48333333333333, "x": "溶岩が段々に重なった土地を、"}, {"t": 115.6, "x": "そのまま階段と呼んだわけです。"}, {"t": 117.85, "x": "シベリアのこの場所は、シベリア・"}, {"t": 119.5, "x": "シベリア・トラップ█"}, {"t": 120.53333333333333, "x": "トラップと呼ばれています。"}, {"t": 122.21666666666667, "x": "階段の地形が最もはっきり見えるのが、プトラナ高原です。"}, {"t": 125.63333333333334, "x": "プトラナ高原█"}, {"t": 127.35, "x": "北極圏の内側、ロシアのクラスノヤルスク地方にあります。"}, {"t": 131.48333333333332, "x": "長さはおよそ八百キロメートル、"}, {"t": 133.65, "x": "幅はおよそ五百キロメートル。"}, {"t": 135.95, "x": "いちばん高い山は、カーメン山で、"}, {"t": 138.53333333333333, "x": "標高はおよそ千六百七十八メートルです。"}, {"t": 141.95, "x": "高原には、二万五千を超える湖が散らばっています。"}, {"t": 145.86666666666667, "x": "深い湖では、水深が百八十メートルから"}, {"t": 149.4, "x": "四百二十メートルに達します。"}, {"t": 151.5, "x": "湖に溜まった水の量は、ロシアでは"}, {"t": 154.26666666666668, "x": "バイカル湖に次ぐ規模だとされています。"}, {"t": 156.4, "x": "2010年、この高原の自然保護区は、"}, {"t": 159.46666666666667, "x": "世界遺産に登録されました。"}, {"t": 161.71666666666667, "x": "高原の崖を見ると、地層は水平に、"}, {"t": 164.68333333333334, "x": "何段にも重なっています。一段ごとに、"}, {"t": 167.65, "x": "溶岩がひとつ流れ出た記録です。"}, {"t": 170.13333333333333, "x": "一つの溶岩の流れが冷えると、固い岩の面ができます。"}, {"t": 174.21666666666667, "x": "その上に次の溶岩が流れてきて、また固まります。"}, {"t": 178.0, "x": "流れと流れのあいだには、灰や、"}, {"t": 180.56666666666666, "x": "風化した面が挟まることがあります。"}, {"t": 183.2, "x": "つまり、段と段のあいだには、何も"}, {"t": 186.1, "x": "出てこなかった時間も記録されています。"}, {"t": 188.43333333333334, "x": "この溶岩を、研究者は二つの"}, {"t": 190.81666666666666, "x": "場所で特に詳しく調べてきました。"}, {"t": 192.95, "x": "一つは、北西部のノリリスク地域です。"}, {"t": 195.9, "x": "もう一つは、北東部のマイメチャ・コツイ地域です。"}, {"t": 199.23333333333332, "x": "二つの地域の地層をつなぎ合わせると、"}, {"t": 201.65, "x": "溶岩の積み重なりは、合わせて六・"}, {"t": 204.51666666666668, "x": "五キロメートルに達すると報告されています。"}, {"t": 207.33333333333334, "x": "富士山の高さのおよそ二倍に近い厚さを、"}, {"t": 210.15, "x": "溶岩だけで積み上げたことになります。"}, {"t": 212.76666666666668, "x": "ただし、最初から溶岩が静かに"}, {"t": 215.3, "x": "流れ出したわけではありません。"}, {"t": 217.03333333333333, "x": "2017年に発表された研究は、"}, {"t": 219.71666666666667, "x": "活動の始まりを次のように整理しています。"}, {"t": 222.86666666666667, "x": "最初に起きたのは、爆発的な噴火でした。"}, {"t": 226.1, "x": "火山灰や、砕けた岩のかけらが大量に噴き出しています。"}, {"t": 230.08333333333334, "x": "そのあとに、溶岩があふれ出す段階が続きました。"}, {"t": 233.75, "x": "2015年の研究は、この地域の"}, {"t": 236.58333333333334, "x": "マグマ全体の内訳を見積もっています。"}, {"t": 239.13333333333333, "x": "噴き出した破片が、およそ二割から四分の一。"}, {"t": 242.58333333333334, "x": "溶岩が、四割近く。残りの四割前後は、地上に出ずに、"}, {"t": 247.51666666666668, "x": "地下に入りこんだマグマです。"}, {"t": 249.61666666666667, "x": "地下に入りこんだマグマの話は、この回の中心になります。"}, {"t": 253.81666666666666, "x": "地表の階段は、この出来事の、"}, {"t": 256.3, "x": "上に出ている部分にすぎません。"}, {"t": 258.53333333333336, "x": "階段の下には、さらに大きな構造が隠れています。"}, {"t": 262.3333333333333, "x": "火山と聞くと、多くの人は富士山のような"}, {"t": 265.31666666666666, "x": "円すい形の山を思い浮かべます。"}, {"t": 267.4, "x": "山の中心に火口があり、そこから噴火する形です。"}, {"t": 271.3833333333333, "x": "洪水玄武岩は、その形をとりません。"}, {"t": 274.45, "x": "地面に長い割れ目が開き、その割れ目の"}, {"t": 277.35, "x": "全体から、溶岩が流れ出します。"}, {"t": 280.0, "x": "玄武岩の溶岩は、ねばりけが小さく、よく流れます。"}, {"t": 284.3833333333333, "x": "そのため、山を作るより先に、"}, {"t": 286.9, "x": "横へ広がって低い土地を埋めていきます。"}, {"t": 289.73333333333335, "x": "谷を埋め、平地を覆い、また次の溶岩がその上を覆います。"}, {"t": 294.55, "x": "結果として残るのは、とがった"}, {"t": 296.71666666666664, "x": "山ではなく、平らな台地です。"}, {"t": 299.15, "x": "人間が記録した中で、この形の噴火に近いものがあります。"}, {"t": 303.46666666666664, "x": "1783年、アイスランドの"}, {"t": 306.51666666666665, "x": "ラキという割れ目で起きた噴火です。"}, {"t": 308.5833333333333, "x": "長さおよそ二十五キロメートルの割れ目に"}, {"t": 311.03333333333336, "x": "沿って、百三十を超える噴出口が並びました。"}, {"t": 314.7, "x": "噴火はおよそ八か月続き、流れ出た玄武岩の"}, {"t": 318.3, "x": "溶岩は、およそ十四立方キロメートル。"}, {"t": 321.31666666666666, "x": "放出された二酸化硫黄は、およそ一億二千万トンと"}, {"t": 325.2, "x": "見積もられています。歴史の"}, {"t": 326.93333333333334, "x": "記録に残る割れ目噴火としては、"}, {"t": 328.9166666666667, "x": "大きな部類に入ります。ところが、シベリア・トラップの"}, {"t": 332.68333333333334, "x": "規模を見積もると、桁が変わります。"}, {"t": 335.15, "x": "2015年の研究は、この地域全体の"}, {"t": 338.3666666666667, "x": "マグマの量を、二百万立方キロメートルから"}, {"t": 341.4166666666667, "x": "五百万立方キロメートルと見積もっています。"}, {"t": 344.15, "x": "ラキの溶岩の、およそ十四万倍から"}, {"t": 346.93333333333334, "x": "三十五万倍に当たります。日本の"}, {"t": 349.4166666666667, "x": "国土の上に均等に広げると、厚さは"}, {"t": 352.05, "x": "五キロメートルから十三キロメートルほどになる計算です。"}, {"t": 355.5, "x": "地球の歴史には、こうした巨大な"}, {"t": 357.8666666666667, "x": "火山活動が、ほかにも何度か起きています。"}, {"t": 360.85, "x": "研究者は、これらを巨大火成岩岩石区と"}, {"t": 362.5833333333333, "x": "巨大火成岩岩石区█"}, {"t": 364.9, "x": "呼んでまとめています。1992年に、"}, {"t": 367.78333333333336, "x": "コフィンとエルドホルムという"}, {"t": 370.01666666666665, "x": "研究者が使いはじめた呼び方です。"}, {"t": 372.35, "x": "2008年には、基準が整理されました。"}, {"t": 375.43333333333334, "x": "広がりが十万平方キロメートル以上、"}, {"t": 378.01666666666665, "x": "マグマの量が十万立方キロメートル以上。"}, {"t": 381.25, "x": "そして、全体の大部分が、百万年から五百万年ほどの"}, {"t": 385.76666666666665, "x": "短い期間に出てくることが多い、とされています。"}, {"t": 389.1666666666667, "x": "インドのデカン高原や、北アメリカの"}, {"t": 391.78333333333336, "x": "コロンビア川の台地も、この仲間に入ります。"}, {"t": 394.93333333333334, "x": "その中でも、シベリア・トラップは、大陸の"}, {"t": 398.3, "x": "上にできたものとして最大級の一つに数えられます。"}, {"t": 401.51666666666665, "x": "大事なのは、量だけではありません。"}, {"t": 404.06666666666666, "x": "量が出てくる速さです。この地域で"}, {"t": 406.45, "x": "最初の大きな段階に出た溶岩と"}, {"t": 408.55, "x": "火山の破片は、合わせて百万立方キロメートルを"}, {"t": 412.03333333333336, "x": "超えると見積もられています。"}, {"t": 413.56666666666666, "x": "それが、およそ三十万年のあいだに出ています。"}, {"t": 416.98333333333335, "x": "単純に割ると、平均で一年あたり"}, {"t": 419.76666666666665, "x": "三立方キロメートルを超える量です。"}, {"t": 422.1, "x": "ラキの八か月分の噴火が、四、五年に一度、"}, {"t": 426.3833333333333, "x": "三十万年にわたって続いた、という"}, {"t": 429.18333333333334, "x": "計算になります。しかも、これは平均です。"}, {"t": 432.7, "x": "実際には、活発な時期と静かな時期が"}, {"t": 435.6333333333333, "x": "交互にあったと考えられています。"}, {"t": 437.68333333333334, "x": "静かな時期には、段と段のあいだに土や灰が溜まりました。"}, {"t": 441.7, "x": "流れ出た溶岩は、大量の熱を運びます。"}, {"t": 445.05, "x": "そして、溶岩に溶けていたガスも、"}, {"t": 447.6333333333333, "x": "いっしょに大気に出ていきます。"}, {"t": 449.68333333333334, "x": "二酸化炭素、二酸化硫黄、塩素、フッ素。"}, {"t": 453.73333333333335, "x": "ラキの何十万倍もの規模の活動が、何十万年も続いた。"}, {"t": 458.1666666666667, "x": "それが、シベリアで起きたことです。"}, {"t": 460.73333333333335, "x": "これほどのマグマは、どこから来たのか。"}, {"t": 463.21666666666664, "x": "地球の表面は、プレートと呼ばれる岩の"}, {"t": 466.15, "x": "板で覆われています。火山の多くは、"}, {"t": 468.6666666666667, "x": "プレートの境目で生まれます。"}, {"t": 470.75, "x": "沈みこむ境目や、離れていく境目です。"}, {"t": 474.05, "x": "ところが、シベリア・トラップが噴き出した"}, {"t": 476.48333333333335, "x": "場所は、境目ではありませんでした。"}, {"t": 479.0, "x": "シベリアの古い大陸の、内側です。"}, {"t": 481.95, "x": "境目以外の場所で、これほどの量の"}, {"t": 484.5833333333333, "x": "マグマが出てくる理由として、もっとも広く"}, {"t": 487.45, "x": "受け入れられている考え方があります。"}, {"t": 489.6333333333333, "x": "マントルプルーム█"}, {"t": 489.6333333333333, "x": "マントルプルームと呼ばれるものです。"}, {"t": 492.3, "x": "地球の内部の、深いところで"}, {"t": 494.3833333333333, "x": "温められた岩が、ゆっくりと上昇してくる。"}, {"t": 497.46666666666664, "x": "その上昇の流れの頭の部分が、大陸の底にぶつかる。"}, {"t": 501.6666666666667, "x": "熱い岩が浅いところまで上がると、圧力が"}, {"t": 504.81666666666666, "x": "下がり、一部が溶けてマグマになります。"}, {"t": 507.5, "x": "短い期間に大量のマグマが生まれるのは、この頭の"}, {"t": 511.05, "x": "部分が一度に大きく溶けるためだと説明されています。"}, {"t": 514.3, "x": "上昇する岩そのものは、溶けてはいません。"}, {"t": 517.3833333333333, "x": "固体のまま、非常にゆっくりと"}, {"t": 519.6, "x": "流れていると考えられています。"}, {"t": 521.55, "x": "ただし、プルームの考え方にも、いくつか異論があります。"}, {"t": 525.8, "x": "マントルの深いところから来たのではなく、"}, {"t": 528.1, "x": "プレートの動きなど、もっと浅いところの"}, {"t": 531.1333333333333, "x": "仕組みで説明しようとする考え方もあります。"}, {"t": 534.0, "x": "さらに少数ですが、まったく別の考え方も出されています。"}, {"t": 538.3666666666667, "x": "地球の反対側、南極大陸の氷の下に、巨大な"}, {"t": 542.4833333333333, "x": "天体衝突の跡があるのではないかという説です。"}, {"t": 545.55, "x": "衝突の衝撃が地球の中を伝わり、ちょうど反対側の"}, {"t": 549.6666666666666, "x": "シベリアで地殻を割った、という筋書きです。"}, {"t": 552.7666666666667, "x": "ただし、この衝突跡そのものが、"}, {"t": 555.4333333333333, "x": "まだ確かめられていません。"}, {"t": 557.2833333333333, "x": "現在のところ、この説を支持する研究者は多くありません。"}, {"t": 561.45, "x": "この番組では、マントルプルームを有力な説明として扱い、"}, {"t": 565.6, "x": "ほかの説は少数説として紹介するにとどめます。"}, {"t": 569.1166666666667, "x": "もうひとつ、場所について付け加えておきます。"}, {"t": 572.3833333333333, "x": "2億5200万年前、地球の大陸は、"}, {"t": 575.8333333333334, "x": "ほぼ一つにまとまっていました。"}, {"t": 577.8833333333333, "x": "パンゲアと呼ばれる超大陸です。"}, {"t": 580.0333333333333, "x": "シベリアは、その北の側に位置していました。"}, {"t": 583.0666666666667, "x": "噴火は、その一角で起きています。"}, {"t": 585.7833333333333, "x": "それでも、そこから出たガスは、大気の流れに"}, {"t": 589.1666666666666, "x": "乗って地球全体に広がったと考えられています。"}, {"t": 592.25, "x": "噴火の場所と、影響が出た場所が、遠く離れていた。"}, {"t": 596.35, "x": "このことは、あとで出てくる"}, {"t": 598.15, "x": "証拠の読み方に関わってきます。"}, {"t": 600.1833333333333, "x": "遠く離れた場所の地層に、シベリアの"}, {"t": 602.7833333333333, "x": "火山の痕跡が残っているかどうか。"}, {"t": 605.05, "x": "研究者は、それを探すことになります。"}, {"t": 607.9666666666667, "x": "その話の前に、まず、いつ噴いたのかを"}, {"t": 611.55, "x": "確かめる必要があります。時間が分からなければ、原因と"}, {"t": 615.55, "x": "結果を並べることはできません。"}, {"t": 617.4333333333333, "x": "2億5200万年前という数字は、どうやって決めたのか。"}, {"t": 621.7166666666667, "x": "使われているのは、ジルコンという小さな鉱物です。"}, {"t": 623.2833333333333, "x": "ジルコン█"}, {"t": 625.9, "x": "砂粒よりも小さな結晶で、マグマが冷えるときにできます。"}, {"t": 630.1, "x": "ジルコンは、できるときにウランを"}, {"t": 632.3, "x": "取りこみますが、鉛はほとんど取りこみません。"}, {"t": 635.4166666666666, "x": "ウランは、長い時間をかけて、"}, {"t": 637.6, "x": "決まった速さで鉛に変わっていきます。"}, {"t": 640.3166666666667, "x": "結晶の中のウランと鉛の割合を測れば、"}, {"t": 643.1833333333333, "x": "結晶ができてからの時間が分かります。"}, {"t": 645.9166666666666, "x": "これが、ウラン・鉛法と呼ばれる年代測定です。"}, {"t": 650.25, "x": "この方法の精度は、近年、大きく上がりました。"}, {"t": 654.2666666666667, "x": "2億年以上前の出来事を、数万年の"}, {"t": 657.3, "x": "幅で測れるようになっています。"}, {"t": 659.1833333333333, "x": "比べる相手になるのは、中国の地層です。"}, {"t": 662.2833333333333, "x": "浙江省のメイシャンという場所に、古生代と"}, {"t": 662.9833333333333, "x": "メイシャン█"}, {"t": 665.8333333333334, "x": "中生代の境目がはっきり残る地層があります。"}, {"t": 669.4333333333333, "x": "この場所は、ペルム紀と三畳紀の境目を"}, {"t": 672.3166666666667, "x": "決める、世界の基準地点に選ばれています。"}, {"t": 675.4333333333333, "x": "この地層には、火山灰の層が何枚も挟まっています。"}, {"t": 679.3, "x": "火山灰の中のジルコンを測れば、"}, {"t": 681.5333333333333, "x": "地層の各段の年代が分かります。"}, {"t": 684.0666666666667, "x": "2014年に発表された研究は、この方法で、"}, {"t": 687.9, "x": "海の地層に記録された大きな変化の時間を絞りこみました。"}, {"t": 692.05, "x": "変化が始まったのは、およそ2億5194万年前。"}, {"t": 696.6166666666667, "x": "終わったのは、およそ2億5188万年前。"}, {"t": 700.6, "x": "そのあいだは、およそ六万年。"}, {"t": 703.0833333333334, "x": "誤差の幅は、プラスマイナス四万八千年とされています。"}, {"t": 707.25, "x": "同じ研究は、炭素の同位体の比率が、"}, {"t": 710.2666666666667, "x": "この直前に急に乱れていたことも示しています。"}, {"t": 713.6, "x": "炭素の乱れは、その後およそ五十万年に"}, {"t": 716.6, "x": "わたって続きました。次に、シベリアの側です。"}, {"t": 720.0166666666667, "x": "2015年の研究は、シベリアの溶岩と、"}, {"t": 723.4333333333333, "x": "地下に入りこんだマグマの岩から、"}, {"t": 725.8166666666667, "x": "ジルコンを取り出して測りました。"}, {"t": 728.0, "x": "その結果、溶岩の噴出は、遅くとも"}, {"t": 731.4666666666667, "x": "2億5224万年前には始まっていたことが分かりました。"}, {"t": 735.7833333333333, "x": "そして、溶岩と火山の破片の、およそ三分の"}, {"t": 739.5166666666667, "x": "二が、およそ三十万年のあいだに出ていました。"}, {"t": 742.65, "x": "その三十万年は、中国の地層に記録された"}, {"t": 746.1166666666667, "x": "大きな変化の、直前から最中にかけてに当たります。"}, {"t": 749.7833333333333, "x": "さらに、残りの溶岩は、変化が終わったあとも、"}, {"t": 753.55, "x": "少なくとも五十万年は出続けていました。"}, {"t": 756.5, "x": "2017年の研究は、この流れを三つの段階に分けています。"}, {"t": 761.2833333333333, "x": "第一段階は、爆発的な噴火と、溶岩の大量の流出です。"}, {"t": 766.45, "x": "第二段階では、地上への溶岩の"}, {"t": 769.0666666666667, "x": "流出が、いったん止まります。"}, {"t": 771.2333333333333, "x": "その代わりに、マグマは地下で横に広がりはじめました。"}, {"t": 775.0333333333333, "x": "第三段階で、溶岩の流出が再開し、"}, {"t": 778.4, "x": "地下への入りこみも続きます。この第三段階は、"}, {"t": 781.9833333333333, "x": "およそ2億5020万年前まで続いたとされています。"}, {"t": 785.9833333333333, "x": "始まりから終わりまで、全体でおよそ二百万年です。"}, {"t": 789.85, "x": "2019年の別の研究は、主な活動が"}, {"t": 793.2833333333333, "x": "およそ2億5230万年前から2億5130万年前の、"}, {"t": 798.2333333333333, "x": "百万年足らずのあいだに集中していたと報告しています。"}, {"t": 802.1333333333333, "x": "つまり、全体は二百万年ほど続き、"}, {"t": 805.0333333333333, "x": "その中心は百万年足らず、そして最も重要な"}, {"t": 809.2666666666667, "x": "部分は数万年から数十万年の単位で起きた。"}, {"t": 812.4833333333333, "x": "この入れ子のような時間の構造が、いまの理解です。"}, {"t": 816.0333333333333, "x": "そして、ここで一つの点が浮かび上がりました。"}, {"t": 819.1833333333333, "x": "海の地層の大きな変化が始まった時期と、"}, {"t": 821.8, "x": "年代の誤差の範囲で重なっていたのは、"}, {"t": 824.5666666666667, "x": "第一段階の溶岩ではありませんでした。"}, {"t": 827.6, "x": "第二段階の始まり、つまり、マグマが"}, {"t": 830.85, "x": "地下に入りこみはじめた時期だったのです。"}, {"t": 833.1666666666666, "x": "地表に出なかったマグマは、どこへ行ったのか。"}, {"t": 836.1333333333333, "x": "シベリアの溶岩台地の下には、ツングースカ盆地と"}, {"t": 838.35, "x": "ツングースカ盆地█"}, {"t": 839.95, "x": "呼ばれる、地層がたまった大きなくぼ地があります。"}, {"t": 843.55, "x": "ここには、何億年もかけて積もった堆積岩が"}, {"t": 846.8666666666667, "x": "重なっています。その厚さは、"}, {"t": 848.8333333333334, "x": "場所によって三キロメートルから"}, {"t": 850.9333333333333, "x": "十二・五キロメートルです。"}, {"t": 852.7, "x": "中身が、この出来事の性格を決めました。"}, {"t": 855.7833333333333, "x": "下のほうには、カンブリア紀、"}, {"t": 857.9333333333333, "x": "つまりおよそ五億年前の海でできた塩の層があります。"}, {"t": 861.7166666666667, "x": "岩塩を主とする地層で、厚いところでは"}, {"t": 864.7666666666667, "x": "二・五キロメートルに達します。"}, {"t": 866.8333333333334, "x": "ある一つの塩の地層は、二百万平方キロメートルの範囲に、"}, {"t": 871.0333333333333, "x": "平均二百メートルほどの厚さで、ほぼ純粋な"}, {"t": 874.6, "x": "岩塩として広がっていると報告されています。"}, {"t": 877.3333333333334, "x": "その上には、石灰岩や、白っぽい炭酸塩の地層があります。"}, {"t": 882.2333333333333, "x": "石油やガスのもとになる有機物を含んだ地層もあります。"}, {"t": 885.8833333333333, "x": "そして上のほうには、石炭紀から"}, {"t": 888.3, "x": "ペルム紀にかけての、石炭を含む地層があります。"}, {"t": 891.5833333333334, "x": "つまりこの盆地は、塩と、石灰と、石油のもとと、"}, {"t": 895.9666666666667, "x": "石炭を、重ねてしまいこんだ倉庫のような場所でした。"}, {"t": 899.7166666666667, "x": "そこへ、マグマが入ってきました。"}, {"t": 902.55, "x": "マグマは、地層の割れ目を縦に上がってきます。"}, {"t": 905.65, "x": "しかし、ある深さまで来ると、地層と"}, {"t": 908.6666666666666, "x": "地層のあいだを押し広げて、横に進みはじめます。"}, {"t": 912.1, "x": "こうしてできる、板のような形の"}, {"t": 914.7333333333333, "x": "貫入岩を、シルと呼びます。"}, {"t": 915.75, "x": "シル█"}, {"t": 917.2166666666667, "x": "ツングースカ盆地では、このシルが、"}, {"t": 919.7166666666667, "x": "驚くほど広い範囲に入りこんでいます。"}, {"t": 922.65, "x": "2017年の研究は、シルが広がる範囲を、"}, {"t": 926.3166666666667, "x": "百五十万平方キロメートル以上と見積もっています。"}, {"t": 930.0166666666667, "x": "地球上の大陸で知られている中では、"}, {"t": 932.45, "x": "最も広いシルの群れの一つだとされています。"}, {"t": 935.5333333333333, "x": "一枚一枚のシルの厚さは、二十メートルから五百メートル。"}, {"t": 939.7833333333333, "x": "塩の地層の中に入りこんだシルは、平均で"}, {"t": 943.0166666666667, "x": "百十五メートルから百三十メートルの厚さがあり、"}, {"t": 946.25, "x": "最も厚いものは四百二十八メートルと報告されています。"}, {"t": 950.6, "x": "2018年の研究は、この盆地で掘られた"}, {"t": 953.9666666666667, "x": "二百八十四本の深い井戸の記録を調べました。"}, {"t": 957.2166666666667, "x": "そのうち、九十三・五パーセントの井戸で、"}, {"t": 960.45, "x": "途中にシルが見つかっています。"}, {"t": 962.6666666666666, "x": "ほとんど、どこを掘っても当たるということです。"}, {"t": 965.7166666666667, "x": "この横に広がるという形が、決定的な違いを生みました。"}, {"t": 969.9166666666666, "x": "溶岩が地上へ出るときの通り道は、細い割れ目です。"}, {"t": 973.7166666666667, "x": "細い通り道では、マグマが触れる地層の量は限られます。"}, {"t": 977.7833333333333, "x": "ところが、シルは地層のあいだを、広く横に進みます。"}, {"t": 981.9166666666666, "x": "2017年の研究は、シルが"}, {"t": 984.5333333333333, "x": "横に広がったことで、マグマが触れる地層の"}, {"t": 987.4833333333333, "x": "量が、何桁も増えたと指摘しています。"}, {"t": 990.2, "x": "マグマは、塩や石炭や有機物を含んだ地層の"}, {"t": 993.6, "x": "すぐ横に、薄く広く入りこみました。"}, {"t": 996.2833333333333, "x": "シル 66, "x": "水銀█"}, {"t": 1230.3166666666666, "x": "水銀です。火山の活動は、地下の水銀を大気に出します。"}, {"t": 1235.8833333333334, "x": "同じ時代の地層を世界各地で調べると、"}, {"t": 1238.5166666666667, "x": "水銀の量が増えている層が見つかっています。"}, {"t": 1241.6666666666667, "x": "2019年の研究は、この水銀の増加が、"}, {"t": 1245.3166666666666, "x": "世界の海の地層で広く、長い期間に"}, {"t": 1248.5166666666667, "x": "わたって記録されていることを示しました。"}, {"t": 1250.8333333333333, "x": "ニッケルも同じです。シベリアの溶岩と"}, {"t": 1253.4166666666667, "x": "マグマは、ニッケルを多く含んでいます。"}, {"t": 1256.1333333333334, "x": "2021年の研究は、カナダの北極圏の"}, {"t": 1259.7166666666667, "x": "地層から、これまで堆積岩で記録された中で"}, {"t": 1262.8166666666666, "x": "最も軽い種類のニッケルを見つけました。"}, {"t": 1265.3, "x": "ニッケルを多く含む細かい粒子が、大気を"}, {"t": 1268.35, "x": "通じて広く運ばれた証拠だとされています。"}, {"t": 1271.1, "x": "シベリアで焼かれた地下は、灰と、水銀と、"}, {"t": 1274.6333333333334, "x": "ニッケルという形で、遠く離れた海の"}, {"t": 1277.6833333333334, "x": "底にまで指紋を残していました。"}, {"t": 1279.6666666666667, "x": "では、空気は実際にどれだけ変わったのか。"}, {"t": 1282.85, "x": "2億年以上前の空気を、直接測ることはできません。"}, {"t": 1286.7666666666667, "x": "そこで研究者は、間接的な手がかりを使います。"}, {"t": 1290.4333333333334, "x": "一つは、植物の化石です。植物は、光合成をするときに、"}, {"t": 1295.4666666666667, "x": "空気中の二酸化炭素を取りこみます。"}, {"t": 1298.2, "x": "そのとき、重さのわずかに違う炭素のうち、"}, {"t": 1301.2333333333333, "x": "軽いほうを好んで使います。"}, {"t": 1303.5833333333333, "x": "この好み方の強さは、空気中の"}, {"t": 1306.1666666666667, "x": "二酸化炭素の濃さによって変わります。"}, {"t": 1308.4666666666667, "x": "つまり、化石になった葉の炭素を測れば、"}, {"t": 1311.45, "x": "当時の空気の中身を推定できるわけです。"}, {"t": 1314.4833333333333, "x": "2021年に発表された研究は、中国南西部の"}, {"t": 1318.6833333333334, "x": "植物の化石を使って、この推定を行いました。"}, {"t": 1322.3166666666666, "x": "結果は、次のとおりです。変化の前、"}, {"t": 1325.9166666666667, "x": "空気中の二酸化炭素は、およそ426ppm。"}, {"t": 1328.75, "x": "426ppm█"}, {"t": 1330.35, "x": "それが、変化のピークではおよそ2500ppmまで"}, {"t": 1333.15, "x": "2500ppm█"}, {"t": 1335.2166666666667, "x": "上がりました。およそ六倍です。"}, {"t": 1337.4666666666667, "x": "しかも、その上昇は、およそ七万五千年のうちに"}, {"t": 1341.5666666666666, "x": "起きたとされています。推定の幅は大きく、"}, {"t": 1344.95, "x": "上は七千ppm台まで含まれます。"}, {"t": 1347.65, "x": const a=document.getElementById('a'), v=document.getElementById('v');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
const src=i=>'f/'+String(i).padStart(4,'0')+'.jpg';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　カット'+D.n_cuts+'　字幕'+D.subs.length+'</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function seg(t){let lo=0,hi=D.segs.length-1,r=0;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.segs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-1;
function preload(i){for(let k=1;k<=4;k++){const s=D.segs[i+k]; if(s)new Image().src=src(s.i)}}
function paint(t){
  const i=seg(t);
  if(i!==cur){cur=i; v.src=src(D.segs[i].i);
    bdg.textContent='カット '+(i+1)+' / '+D.segs.length;
    mark('cuts',i); preload(i); }
  mark('subs',subIdx(t));
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b>'+fmt(s.t)+'</b><span></span>';
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
D.segs.forEach(s=>{const f=document.createElement('figure');
  f.innerHTML='<img loading="lazy" src="'+src(s.i)+'"><em>'+fmt(s.t)+'</em>';
  f.onclick=()=>go(s.t); document.getElementById('cuts').appendChild(f)});
const mk=document.getElementById('mk');
D.segs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,D.dur-0.05); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>go(D.segs[Math.max(0,seg(a.currentTime)-1)].t);
document.getElementById('nx').onclick=()=>go(D.segs[Math.min(D.segs.length-1,seg(a.currentTime)+1)].t);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('subs').hidden=b.dataset.p!=='subs';
  document.getElementById('cuts').hidden=b.dataset.p!=='cuts'});
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
