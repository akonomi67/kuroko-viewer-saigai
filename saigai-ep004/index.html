<script>
const D={"name": "ep004", "file": "ep004", "dur": 1916.1833125, "segs": [], "subs": [{"t": 0.0, "x": "北大西洋の、シェトランド諸島。"}, {"t": 1.0333333333333334, "x": "シェトランド諸島█"}, {"t": 2.566666666666667, "x": "スコットランドの本土と、ノルウェーとのあいだに"}, {"t": 5.683333333333334, "x": "浮かぶ島々です。この島の海岸の崖には、泥炭の"}, {"t": 9.45, "x": "層が見えているところがあります。"}, {"t": 11.316666666666666, "x": "泥炭は、湿った陸の上で、枯れた草や"}, {"t": 14.75, "x": "苔が何千年も積み重なってできたものです。"}, {"t": 17.55, "x": "陸でしかできません。ところが、その泥炭の中に、海の"}, {"t": 21.866666666666667, "x": "砂と小石の層が一枚、はさまっています。"}, {"t": 24.916666666666668, "x": "砂の中には、ちぎれた泥炭の塊が、"}, {"t": 28.0, "x": "巻き込まれるように混じっています。"}, {"t": 30.183333333333334, "x": "その層は、崖から内陸へ、斜面を登るように続き、"}, {"t": 34.56666666666667, "x": "上へ行くほど薄くなって消えます。"}, {"t": 36.96666666666667, "x": "たどれる上の端は、いまの海面から"}, {"t": 39.55, "x": "およそ8メートルから12メートルの高さです。"}, {"t": 42.43333333333333, "x": "しかも、当時の海面は、いまより"}, {"t": 45.333333333333336, "x": "ずっと低いところにありました。"}, {"t": 47.06666666666667, "x": "そこから測り直すと、海の水は、"}, {"t": 49.71666666666667, "x": "少なくとも二十メートルを超える高さまで、"}, {"t": 52.61666666666667, "x": "陸を駆け上がったことになります。波が来た方角は、東。"}, {"t": 57.06666666666667, "x": "その出どころは、ノルウェーの沖、海の底です。"}, {"t": 60.7, "x": "いまからおよそ8150年前、"}, {"t": 61.916666666666664, "x": "8150年前█"}, {"t": 63.233333333333334, "x": "ノルウェー中部の沖で、大陸の縁の斜面が、"}, {"t": 67.11666666666666, "x": "長さ三百キロメートルにわたって崩れ落ちました。"}, {"t": 70.66666666666667, "x": "崩れた土砂は、海の底を八百キロメートル以上も"}, {"t": 74.21666666666667, "x": "流れていきました。その動きが、"}, {"t": 76.53333333333333, "x": "海をまるごと持ち上げ、押し出しました。"}, {"t": 79.48333333333333, "x": "波は、ノルウェーの海岸を駆け上がり、北海を渡り、"}, {"t": 83.46666666666667, "x": "スコットランドの入り江にさかのぼりました。"}, {"t": 86.21666666666667, "x": "残ったのは、陸の地層にはさまれた、一枚の砂の層です。"}, {"t": 90.7, "x": "この出来事は、名前で呼ばれています。"}, {"t": 93.46666666666667, "x": "ストレッガ地すべり█"}, {"t": 93.46666666666667, "x": "ストレッガ地すべり。ストレッガは、"}, {"t": 95.75, "x": "ノルウェーの漁師たちが、その海の"}, {"t": 98.1, "x": "底の崖に付けた呼び名です。"}, {"t": 100.0, "x": "海が、山を越えてきた日の記録です。"}, {"t": 102.78333333333333, "x": "この波の跡は、最初から探して"}, {"t": 105.25, "x": "見つかったものではありません。"}, {"t": 106.9, "x": "手がかりは、まず海の底の地形として現れました。"}, {"t": 110.51666666666667, "x": "1980年代、ノルウェーの沖を音波で"}, {"t": 114.1, "x": "調べていた研究者たちが、大陸斜面の一部が、"}, {"t": 117.66666666666667, "x": "大きくえぐれていることを描き出します。"}, {"t": 120.2, "x": "地形から読み取れる崩れの規模は、"}, {"t": 122.23333333333333, "x": "きわめて大きなものでした。"}, {"t": 124.18333333333334, "x": "この崩れは、大きな津波を起こしたのではないか。"}, {"t": 127.55, "x": "そういう見方が、このころから出されるようになります。"}, {"t": 131.06666666666666, "x": "1988年、スコットランド東岸の地層に、"}, {"t": 135.26666666666668, "x": "この崩れと結びつく砂の層があると報告されます。"}, {"t": 138.8, "x": "その後、証拠探しの中心になったのが、"}, {"t": 141.78333333333333, "x": "ノルウェーの海岸の湖でした。"}, {"t": 144.11666666666667, "x": "ノルウェーの海岸には、海のすぐそばに、"}, {"t": 146.98333333333332, "x": "小さな湖がいくつも並んでいます。"}, {"t": 149.76666666666668, "x": "これらの湖は、もともと海の入り江でした。"}, {"t": 152.83333333333334, "x": "氷が消えたあと、重しの取れた陸地が"}, {"t": 155.48333333333332, "x": "ゆっくり持ち上がり、入り江が"}, {"t": 157.46666666666667, "x": "海から切り離されて、湖になったものです。"}, {"t": 160.6, "x": "そのため、湖の底には、何千年ぶんもの"}, {"t": 164.36666666666667, "x": "泥が静かに積もっています。"}, {"t": 166.03333333333333, "x": "そこへ海の水が一度でも入り込めば、泥の並びが乱れます。"}, {"t": 170.25, "x": "研究者たちは、海面より少し高いところにある"}, {"t": 173.61666666666667, "x": "湖を、高さの順に、階段のように選びました。"}, {"t": 177.65, "x": "そして、一つずつ湖の底に筒を差し込み、"}, {"t": 181.0, "x": "泥を抜き取っていきました。"}, {"t": 182.91666666666666, "x": "1997年に発表された研究では、ノルウェーの"}, {"t": 188.01666666666668, "x": "海岸の25の湖で、同じ乱れが見つかっています。"}, {"t": 188.35, "x": "25の湖█"}, {"t": 192.68333333333334, "x": "乱れの形は、どこでもよく似ていました。"}, {"t": 195.51666666666668, "x": "まず、下の泥が、削り取られたように途切れています。"}, {"t": 199.56666666666666, "x": "その上に、貝殻のかけらを含んだ砂が乗っています。"}, {"t": 203.4, "x": "砂は、下ほど粗く、上ほど細かくなっています。"}, {"t": 207.35, "x": "重いものから先に沈んだ、ということです。"}, {"t": 210.38333333333333, "x": "さらにその上に、ちぎれた植物のかけらや、"}, {"t": 213.51666666666668, "x": "かき混ぜられた泥が積もっています。"}, {"t": 215.86666666666667, "x": "静かな湖に、海の水が一気に流れ込み、"}, {"t": 219.31666666666666, "x": "底を削り、砂を置き、引いていった。"}, {"t": 222.78333333333333, "x": "その順番が、そのまま地層に残っていました。"}, {"t": 226.11666666666667, "x": "湖を低いものから高いものへとたどり、"}, {"t": 228.68333333333334, "x": "どこまで砂が届いているかを調べます。"}, {"t": 231.43333333333334, "x": "砂が入っている一番高い湖が、"}, {"t": 233.96666666666667, "x": "波がそこまで来たという目印になります。"}, {"t": 236.78333333333333, "x": "いちばん高いところまで来ていたのは、崩れた場所の"}, {"t": 240.58333333333334, "x": "正面にあたるスンメーレという地方でした。"}, {"t": 241.5, "x": "スンメーレ█"}, {"t": 243.7, "x": "当時の満潮面より、十メートルから"}, {"t": 246.4, "x": "十一メートル高いところまで砂が届いています。"}, {"t": 249.4, "x": "そこから北へ二百五十キロメートル離れた"}, {"t": 252.06666666666666, "x": "場所では、六メートルから七メートル。"}, {"t": 254.63333333333333, "x": "南へ二百キロメートル離れた場所では、"}, {"t": 257.26666666666665, "x": "三メートルから五メートル。"}, {"t": 259.15, "x": "崩れた場所から遠ざかるほど、波は低くなっていました。"}, {"t": 262.81666666666666, "x": "この並び方が、波の出どころが"}, {"t": 265.15, "x": "海の底の崩れであることを裏づけました。"}, {"t": 267.6166666666667, "x": "記録された高さは、数値モデルで"}, {"t": 269.9, "x": "計算した波の高さともよく合っていました。"}, {"t": 272.5, "x": "そこから研究者たちは、小さな崩れが"}, {"t": 275.3833333333333, "x": "何度も起きたのではなく、一つの"}, {"t": 277.6333333333333, "x": "大きな崩れが一度に起きたと考えています。"}, {"t": 280.26666666666665, "x": "もうひとつ分かったことがあります。"}, {"t": 282.26666666666665, "x": "同じ地域の中では、湖ごとの"}, {"t": 284.75, "x": "高さの記録がよくそろっていました。入り江の"}, {"t": 287.6166666666667, "x": "形や岬の向きに、あまり左右されていないということです。"}, {"t": 291.31666666666666, "x": "研究者たちは、これを、波の長さが"}, {"t": 294.46666666666664, "x": "とても長かったことを示すものと読んでいます。"}, {"t": 297.1333333333333, "x": "いま、この波の跡は、ノルウェーの南のブームロから、"}, {"t": 301.1, "x": "北のノールカップまで見つかっています。"}, {"t": 303.5833333333333, "x": "では、崩れたのはどんな場所だったのか。"}, {"t": 306.3666666666667, "x": "ノルウェー中部、スンメーレの"}, {"t": 308.3833333333333, "x": "沖合およそ七十キロメートル。"}, {"t": 310.3833333333333, "x": "ここで、海の底は、浅い大陸棚から"}, {"t": 313.7, "x": "深い海へと、急に落ち込んでいます。"}, {"t": 316.4166666666667, "x": "水深百メートルから二百メートルの平らな海底が、"}, {"t": 319.8833333333333, "x": "九百メートルほどまで下がっていく斜面です。"}, {"t": 323.0, "x": "この斜面の肩は、昔から漁の場所として知られていました。"}, {"t": 326.93333333333334, "x": "ノルウェーの漁師たちは、この海の"}, {"t": 329.18333333333334, "x": "底の段差を、ストレッガと呼んできました。"}, {"t": 332.05, "x": "大きな縁、という意味です。"}, {"t": 334.28333333333336, "x": "ここで漁が行われてきた記録は、"}, {"t": 336.4, "x": "三百年以上さかのぼります。"}, {"t": 338.75, "x": "その縁の沖に、巨大なえぐれ跡が残っています。"}, {"t": 342.26666666666665, "x": "ノルウェー百科事典にまとめられている"}, {"t": 344.43333333333334, "x": "数字を見ておきます。えぐれ跡のいちばん奥、崩れが"}, {"t": 347.98333333333335, "x": "止まった崖の長さは、310キロメートル。"}, {"t": 349.5833333333333, "x": "310キロメートル█"}, {"t": 351.18333333333334, "x": "崖の内側、ノルウェー側の水深は"}, {"t": 353.96666666666664, "x": "およそ二百五十メートルです。"}, {"t": 355.8666666666667, "x": "崖を越えた外側では、それが"}, {"t": 358.25, "x": "五百メートルから六百メートルに落ちます。"}, {"t": 360.78333333333336, "x": "崩れの中央部では、厚さ三百メートルから"}, {"t": 363.98333333333335, "x": "四百メートルの地層が、そっくり抜け落ちています。"}, {"t": 367.3833333333333, "x": "崩れ落ちた土砂は、海の底を流れ下り、"}, {"t": 370.25, "x": "崖から八百十キロメートル先まで達しました。"}, {"t": 373.73333333333335, "x": "流れ着いた先の水深は、三千八百メートルです。"}, {"t": 377.68333333333334, "x": "崖のいちばん上の縁は、水深百五十メートルから"}, {"t": 381.46666666666664, "x": "四百メートルのところにあります。"}, {"t": 383.46666666666664, "x": "つまり崩れた土砂は、大陸棚の縁のすぐ下から、"}, {"t": 386.95, "x": "三千メートルを超える高さの差を、海の"}, {"t": 390.1166666666667, "x": "底に沿って下っていったことになります。"}, {"t": 392.26666666666665, "x": "土砂が広がった範囲は、あわせて"}, {"t": 394.9166666666667, "x": "九万五千平方キロメートル█"}, {"t": 394.9166666666667, "x": "九万五千平方キロメートル。"}, {"t": 397.2, "x": "そのうち、土砂が抜け出した跡の"}, {"t": 399.65, "x": "部分だけで、二万七千平方キロメートル。"}, {"t": 402.78333333333336, "x": "ベルギーの国土とほぼ同じ広さの海底が、"}, {"t": 405.55, "x": "崩れて出ていったことになります。"}, {"t": 407.65, "x": "崩れた量は、二千四百立方キロメートルから"}, {"t": 410.8833333333333, "x": "三千二百立方キロメートルと見積もられています。"}, {"t": 414.0, "x": "この量を、アメリカ合衆国の国土全体に均等に"}, {"t": 417.6333333333333, "x": "ならすと、厚さ二十五センチメートルから"}, {"t": 420.31666666666666, "x": "三十センチメートルの層になる計算です。"}, {"t": 423.01666666666665, "x": "地球の陸の上で起きる地すべりとは、"}, {"t": 425.3666666666667, "x": "桁がいくつも違います。海の"}, {"t": 427.28333333333336, "x": "底にいまも姿をさらしている地すべりの"}, {"t": 429.95, "x": "跡としては、知られている中で最大とされています。"}, {"t": 433.4, "x": "ただし、この量には幅があります。"}, {"t": 436.1333333333333, "x": "三千五百立方キロメートルという数字が"}, {"t": 438.9, "x": "使われている論文もあります。"}, {"t": 440.75, "x": "2023年には、この量そのものを見直す研究も出ました。"}, {"t": 445.2, "x": "その話は、第7章でします。"}, {"t": 447.9, "x": "ここで押さえておきたいのは、崩れた場所の傾きです。"}, {"t": 451.48333333333335, "x": "崖の最も急なところは、三十五度あります。"}, {"t": 454.9, "x": "しかし、土砂が滑った斜面の大部分は、"}, {"t": 458.05, "x": "傾きが〇・三度から二度しかありません。"}, {"t": 460.98333333333335, "x": "平均すると、一度にも届きません。"}, {"t": 463.78333333333336, "x": "人が立てば、坂とは感じない傾きです。"}, {"t": 466.8833333333333, "x": "それほど平らな斜面の上を、ベルギーほどの"}, {"t": 469.93333333333334, "x": "広さの地層が滑り出しました。"}, {"t": 471.78333333333336, "x": "なぜ、そんなことが起きたのか。次の章は、その話です。"}, {"t": 476.56666666666666, "x": "答えの手がかりは、崩れた地層の中身にあります。"}, {"t": 480.01666666666665, "x": "ストレッガの斜面は、二種類の"}, {"t": 482.25, "x": "地層が交互に重なってできていました。"}, {"t": 484.51666666666665, "x": "一つは、氷河が運んできた土砂です。"}, {"t": 487.4166666666667, "x": "氷期になると、スカンジナビアを覆う氷は、"}, {"t": 490.46666666666664, "x": "この斜面の縁まで張り出しました。"}, {"t": 492.85, "x": "氷は、陸の岩を削り、粘土や砂や石を"}, {"t": 496.4166666666667, "x": "混ぜたまま、縁から斜面へ落としていきました。"}, {"t": 499.5, "x": "この層は、比較的よく締まっています。"}, {"t": 502.21666666666664, "x": "もう一つは、氷が引いたあとに、北へ流れる"}, {"t": 505.73333333333335, "x": "海流が運んだ、細かい粘土や泥の層です。"}, {"t": 509.05, "x": "こちらは、粒のすき間にたくさんの"}, {"t": 511.31666666666666, "x": "水を含んだ、柔らかい層です。"}, {"t": 513.8, "x": "ストレッガ地すべりの滑り面は、すべて、"}, {"t": 516.75, "x": "この柔らかい粘土の層の中にあるとされています。"}, {"t": 520.1, "x": "さらに、ここに氷期の重しが加わります。"}, {"t": 523.1833333333333, "x": "氷が斜面の縁まで来ると、締まった土砂が、"}, {"t": 526.3166666666667, "x": "柔らかい粘土の上に、短い期間に一気に積み上がります。"}, {"t": 530.6666666666666, "x": "2023年の研究によれば、氷期の最も寒い"}, {"t": 534.5666666666667, "x": "時期には、千年あたり十二メートルを"}, {"t": 537.1666666666666, "x": "超える速さで土砂が積もっていました。"}, {"t": 539.3, "x": "すると、粘土のすき間の水は、上から"}, {"t": 542.4333333333333, "x": "押さえつけられたまま、逃げ場を失います。"}, {"t": 545.3, "x": "水の圧力が上がると、粒と粒とが"}, {"t": 548.0, "x": "押しつけ合う力が弱まります。"}, {"t": 549.9666666666667, "x": "粒どうしが踏ん張れなくなった層は、"}, {"t": 552.1666666666666, "x": "わずかな傾きでも滑りやすくなります。"}, {"t": 554.8666666666667, "x": "では、崩れはどう広がったのか。"}, {"t": 557.3666666666667, "x": "ノルウェー百科事典の説明では、"}, {"t": 559.5166666666667, "x": "崩れは斜面の下の方から始まりました。"}, {"t": 562.3833333333333, "x": "まず、 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
