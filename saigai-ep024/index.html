<script>
const D={"name": "ep024", "file": "ep024", "dur": 1933.85, "segs": [], "subs": [{"t": 0.0, "x": "1858年の春のことです。"}, {"t": 2.65, "x": "北アルプスの山々は、まだ深い雪の中にありました。"}, {"t": 6.366666666666666, "x": "その夜明け前に、大地が大きく揺れました。"}, {"t": 9.5, "x": "場所は富山と飛騨の国ざかいです。"}, {"t": 11.733333333333333, "x": "揺れは一晩のうちにおさまりました。"}, {"t": 14.033333333333333, "x": "けれども朝になると、ふしぎなことが起きていました。"}, {"t": 17.416666666666668, "x": "富山平野を流れる常願寺川の水が、減っていたのです。"}, {"t": 21.516666666666666, "x": "雪どけの前でも、川がこれほどやせることはありません。"}, {"t": 25.333333333333332, "x": "川の上流で何かが流れをふさいでいる。"}, {"t": 28.016666666666666, "x": "人々はそう考えました。流れを"}, {"t": 30.15, "x": "ふさいでいたのは、崩れ落ちた山でした。"}, {"t": 33.05, "x": "立山の奥にある二つの峰です。"}, {"t": 35.28333333333333, "x": "名前を大鳶山と小鳶山といいます。"}, {"t": 38.15, "x": "崩れた土砂は谷を埋め、川をせき止めました。"}, {"t": 41.4, "x": "せき止められた水は、山の中にたまっていきました。"}, {"t": 44.85, "x": "そして二週間後と二か月後に、二度あふれ出しました。"}, {"t": 48.583333333333336, "x": "この出来事は、地元で「鳶崩れ」と呼ばれています。"}, {"t": 53.15, "x": "この地震で亡くなった人は、数百人にのぼります。"}, {"t": 56.75, "x": "飛騨と越中を合わせた数です。"}, {"t": 58.86666666666667, "x": "けれどもこの回の主語は揺れではありません。"}, {"t": 61.46666666666667, "x": "揺れのあとに残された、崩れた山の土砂です。"}, {"t": 64.68333333333334, "x": "土砂は二度の洪水を起こしました。"}, {"t": 66.86666666666666, "x": "話はそれだけでは終わりません。"}, {"t": 68.98333333333333, "x": "土砂は穏やかだった川を暴れ川に変えました。"}, {"t": 71.95, "x": "その川を静める工事は、明治の終わりに始まりました。"}, {"t": 75.81666666666666, "x": "工事はいまも続いています。"}, {"t": 77.66666666666667, "x": "一晩で終わった地震と、終わらなかった山。"}, {"t": 80.98333333333333, "x": "その160年あまりを、順にたどっていきます。"}, {"t": 84.58333333333333, "x": "まず揺れの正体から見ておきます。"}, {"t": 86.78333333333333, "x": "地震が起きたのは、安政5年2月26日の未明です。"}, {"t": 91.11666666666666, "x": "いまの暦では1858年4月9日にあたります。"}, {"t": 95.15, "x": "時刻は午前2時ごろとも3時ごろとも記録されています。"}, {"t": 98.65, "x": "多くの人が眠っていた時間です。"}, {"t": 100.85, "x": "この地震は飛越地震と呼ばれています。"}, {"t": 103.46666666666667, "x": "飛騨の「飛」と越中の「越」を合わせた名前です。"}, {"t": 108.53333333333333, "x": "揺れを起こしたのは、跡津川断層とされています。"}, {"t": 112.05, "x": "富山県の立山町から岐阜県の白川村まで続く断層です。"}, {"t": 116.35, "x": "途中で飛騨市を通ります。長さはおよそ69キロあります。"}, {"t": 120.53333333333333, "x": "地震調査研究推進本部が示している数字です。"}, {"t": 124.1, "x": "向きは東北東から西南西です。"}, {"t": 126.55, "x": "断層をはさんで、地面が水平にずれる動きをします。"}, {"t": 130.51666666666668, "x": "向こうの地面は、右へずれます。"}, {"t": 133.01666666666668, "x": "そのため右横ずれ断層と呼ばれます。"}, {"t": 135.6, "x": "このずれの跡は、地形にも残っています。"}, {"t": 138.58333333333334, "x": "岐阜県に高原川という川があります。"}, {"t": 141.31666666666666, "x": "この川は断層を横切るところで直角に二度曲がります。"}, {"t": 144.91666666666666, "x": "曲がりと曲がりのあいだは、2.5キロほどです。"}, {"t": 148.16666666666666, "x": "何度もくり返したずれが、川を"}, {"t": 150.55, "x": "横に引きずったと考えられています。"}, {"t": 152.75, "x": "この断層帯がいちばん最近動いたのは、1858年です。"}, {"t": 157.66666666666666, "x": "地震調査研究推進本部は、そう示しています。"}, {"t": 161.53333333333333, "x": "つまり飛越地震です。地震の大きさは、"}, {"t": 164.31666666666666, "x": "一つの数字に決まっていません。"}, {"t": 166.65, "x": "長く使われてきたのは、理科年表などの値です。"}, {"t": 170.16666666666666, "x": "マグニチュード7.0から7.1とされてきました。"}, {"t": 173.5, "x": "のちに古い記録を見直した研究者がいます。"}, {"t": 176.48333333333332, "x": "出てきた値は、7.3と7.6でした。"}, {"t": 179.8, "x": "内閣府の中央防災会議は、この地震の"}, {"t": 183.08333333333334, "x": "報告書をまとめています。報告書は"}, {"t": 185.58333333333334, "x": "7.3から7.6と推定しました。"}, {"t": 188.1, "x": "この地震は一回ではなかったかもしれません。"}, {"t": 190.93333333333334, "x": "富山や高岡にも、記録が残っています。"}, {"t": 194.01666666666668, "x": "最初の揺れの約2時間後に、"}, {"t": 195.95, "x": "また強い揺れがあったというのです。"}, {"t": 198.28333333333333, "x": "遠くの町の記録にもあります。"}, {"t": 200.28333333333333, "x": "名古屋や江戸、京都や大阪でも、"}, {"t": 202.88333333333333, "x": "何度かの揺れが書かれていました。"}, {"t": 205.1, "x": "報告書は二つの地震が続いた可能性を示しています。"}, {"t": 208.78333333333333, "x": "ここはまだ確かめている途中の部分です。"}, {"t": 211.43333333333334, "x": "このころの日本では、大きな地震が続いていました。"}, {"t": 215.15, "x": "1847年には、信濃で善光寺地震が起きています。"}, {"t": 219.85, "x": "1854年には、東海と南海で大きな地震がありました。"}, {"t": 224.6, "x": "1855年には、江戸が揺れました。"}, {"t": 227.85, "x": "そして、1858年の飛越地震です。"}, {"t": 231.53333333333333, "x": "報告書は、この時代を日本列島大揺れの"}, {"t": 234.68333333333334, "x": "時代と呼んでいます。なかでも"}, {"t": 236.78333333333333, "x": "善光寺地震と飛越地震は、よく似ています。"}, {"t": 239.76666666666668, "x": "どちらも内陸の断層が動き、"}, {"t": 241.71666666666667, "x": "山で大きな崩れを起こしました。"}, {"t": 244.1, "x": "被害は飛騨の北部と越中に集中しました。"}, {"t": 247.08333333333334, "x": "平野でも家や蔵が倒れ、地面が液状化しました。"}, {"t": 250.88333333333333, "x": "震源から離れた金沢でも、多くの家が壊れています。"}, {"t": 254.95, "x": "福井の丸岡でも、同じでした。"}, {"t": 257.4166666666667, "x": "やわらかい平野の地面が、揺れを"}, {"t": 259.8333333333333, "x": "大きくしたと考えられています。"}, {"t": 261.75, "x": "報告書は亡くなった人を三つに分けて数えています。"}, {"t": 265.05, "x": "平野で家の下じきになった人が、約20人です。"}, {"t": 268.8333333333333, "x": "山あいでは山崩れによる人を含めて約250人です。"}, {"t": 272.8666666666667, "x": "そして地震のあとの土砂の流れで"}, {"t": 274.9166666666667, "x": "おぼれた人が約140人です。"}, {"t": 277.2, "x": "壊れた家は全壊と半壊を合わせて約2700軒でした。"}, {"t": 281.4, "x": "最後の約140人は、揺れの日に"}, {"t": 284.3333333333333, "x": "亡くなったのではありません。"}, {"t": 285.8333333333333, "x": "何週間もたってから、命を落とした人たちです。"}, {"t": 289.3666666666667, "x": "その命を奪ったのは、崩れた山の土砂でした。"}, {"t": 292.73333333333335, "x": "次の章からは、その土砂を追っていきます。"}, {"t": 295.76666666666665, "x": "土砂の話は震源に近い飛騨の谷から始まります。"}, {"t": 299.1666666666667, "x": "跡津川断層は、山の中を走る断層です。"}, {"t": 302.81666666666666, "x": "そのため断層に沿った谷の斜面があちこちで崩れました。"}, {"t": 306.43333333333334, "x": "報告書には崩れた場所の一覧があります。"}, {"t": 309.23333333333335, "x": "その数は65か所です。そのうちの"}, {"t": 311.73333333333335, "x": "いくつもで、崩れた土が川をふさぎました。"}, {"t": 314.85, "x": "川がふさがれてできた水たまりを、天然ダムと呼びます。"}, {"t": 318.65, "x": "人がつくったダムではありません。"}, {"t": 320.7, "x": "土砂が自然にせき止めたダムです。"}, {"t": 322.81666666666666, "x": "震源の近くに、角川という集落がありました。"}, {"t": 326.48333333333335, "x": "ここでは98戸のうち77戸が全壊か半壊になりました。"}, {"t": 330.81666666666666, "x": "そのため地元では、この地震を「角川地震」とも"}, {"t": 335.1333333333333, "x": "呼んでいます。宮川沿いの丸山という場所では、"}, {"t": 338.18333333333334, "x": "向かいの斜面が崩れました。"}, {"t": 340.18333333333334, "x": "土砂は川を越えて、対岸の家を埋めました。"}, {"t": 343.43333333333334, "x": "住んでいた51人のうち、26人が亡くなっています。"}, {"t": 347.75, "x": "崩れた土砂は、宮川もせき止めました。"}, {"t": 350.5833333333333, "x": "水は4キロ上流までたまりました。"}, {"t": 353.0, "x": "この天然ダムは、2日あまりで水がいっぱいになりました。"}, {"t": 356.76666666666665, "x": "そして決壊しました。ただ、"}, {"t": 358.71666666666664, "x": "せき止めた土砂の量が多すぎました。"}, {"t": 361.25, "x": "水は少しずつしか流れ出さず、"}, {"t": 363.25, "x": "ダムはゆっくり崩れていきました。"}, {"t": 365.8333333333333, "x": "そのため下流に大きな被害は出なかったとされています。"}, {"t": 369.2, "x": "小鳥川の元田という場所でも、斜面が大きく崩れました。"}, {"t": 373.25, "x": "二つの集落で、9戸が埋まりました。"}, {"t": 376.1333333333333, "x": "亡くなった人は、53人です。"}, {"t": 378.76666666666665, "x": "ここでできた天然ダムは、地震の"}, {"t": 381.2, "x": "日の午後4時ごろに決壊しました。"}, {"t": 383.28333333333336, "x": "地震からわずか13時間ほどあとのことです。"}, {"t": 386.23333333333335, "x": "崩れた跡の近くには、いまも碑が建っています。"}, {"t": 389.76666666666665, "x": "亡くなった人をとむらうための碑です。"}, {"t": 392.26666666666665, "x": "川が止まると、下流では何が起きるのでしょうか。"}, {"t": 395.75, "x": "神通川では地震の直後に水が引きました。"}, {"t": 398.75, "x": "歩いて渡れるほどだったといいます。"}, {"t": 400.93333333333334, "x": "そして約20時間後、その日の深夜に急に水が増えました。"}, {"t": 405.28333333333336, "x": "段になった波のような洪水が、下流を襲いました。"}, {"t": 408.96666666666664, "x": "川には舟を並べてつないだ橋がありました。"}, {"t": 411.85, "x": "その橋もくさりが切れて流されました。"}, {"t": 414.28333333333336, "x": "飛騨と越中を結ぶ道も、土砂でふさがれました。"}, {"t": 417.71666666666664, "x": "神通川ではそのあと7月の下旬までに"}, {"t": 420.45, "x": "6回の出水がありました。天然ダムには、"}, {"t": 423.18333333333334, "x": "すぐに切れるものがありました。"}, {"t": 425.35, "x": "何か月ももつものも、ありました。"}, {"t": 427.8833333333333, "x": "保木林という場所の天然ダムは、"}, {"t": 430.0833333333333, "x": "上流の家と田畑を沈めました。"}, {"t": 432.55, "x": "村人たちは夏ごろまで水を抜く溝を掘り続けました。"}, {"t": 436.03333333333336, "x": "このダムが切れたのは、148日後の大雨のときでした。"}, {"t": 440.23333333333335, "x": "一方で、人の手で水を逃がした場所もあります。"}, {"t": 443.65, "x": "富山の小矢部川の奥でも、山が"}, {"t": 446.15, "x": "崩れて川がせき止められました。"}, {"t": 448.05, "x": "このとき、下流の23の村の人たちが総出で集まりました。"}, {"t": 452.45, "x": "夜通し土砂を切り崩し、たまった水を流したのです。"}, {"t": 456.35, "x": "おかげで、大きな災害にはならずにすみました。"}, {"t": 459.65, "x": "三年後の1861年のことです。"}, {"t": 462.73333333333335, "x": "猪谷という場所で、大きな地すべりが起きました。"}, {"t": 466.1, "x": "きっかけは大雨でした。地震でゆるんだ斜面が、雨で"}, {"t": 470.05, "x": "動き出したと考えられています。"}, {"t": 471.95, "x": "家6軒が押しつぶされ、7人が亡くなりました。"}, {"t": 475.5, "x": "揺れは一晩で終わっても、ゆるんだ"}, {"t": 477.95, "x": "山は雨のたびに動きました。"}, {"t": 479.78333333333336, "x": "そして同じ地震で、もっと大きな崩れが起きていました。"}, {"t": 483.5833333333333, "x": "場所は立山の奥です。立山の"}, {"t": 485.75, "x": "西には、大きなくぼ地があります。"}, {"t": 488.4, "x": "立山カルデラと呼ばれています。"}, {"t": 490.45, "x": "カルデラと聞くと、火山の穴を"}, {"t": 492.6333333333333, "x": "思いうかべるかもしれません。"}, {"t": 494.28333333333336, "x": "噴火でできた、大きな穴です。"}, {"t": 496.71666666666664, "x": "けれども立山カルデラは少し違います。"}, {"t": 499.3, "x": "長い年月のあいだに、雨や崩れが"}, {"t": 502.1, "x": "山を削ってできたくぼ地です。"}, {"t": 503.9, "x": "そのため侵食カルデラとも呼ばれます。"}, {"t": 506.3666666666667, "x": "このあたりの岩は、大昔の海の"}, {"t": 508.8666666666667, "x": "底の噴火でたまったものです。"}, {"t": 510.7, "x": "風化が進んで、一部は粘土のようになっています。"}, {"t": 514.3, "x": "もろくて崩れやすい地質です。"}, {"t": 516.3166666666667, "x": "くぼ地のふちには、とがった二つの峰がありました。"}, {"t": 519.6833333333333, "x": "大鳶山と小鳶山です。ふもとの温泉から見上げると、"}, {"t": 523.65, "x": "鳶のようにとがって見えたのでしょう。"}, {"t": 526.15, "x": "報告書は名前の由来をそう推しはかっています。"}, {"t": 529.1333333333333, "x": "峰のふもとには、立山温泉という湯治場がありました。"}, {"t": 533.2, "x": "地震の夜も温泉場には人が泊まっていました。"}, {"t": 536.2833333333333, "x": "山の仕事や温泉の仕事をしていた人たちです。"}, {"t": 539.4333333333333, "x": "その真上で二つの峰が崩れました。"}, {"t": 541.85, "x": "崩れた土砂は、細かく砕けた岩のかたまりになりました。"}, {"t": 545.5333333333333, "x": "そして谷を一気に流れ下りました。"}, {"t": 547.8666666666667, "x": "このような流れを、岩屑なだれと呼びます。"}, {"t": 550.95, "x": "温泉場は何十メートルもの土砂と岩の下に埋まりました。"}, {"t": 554.6333333333333, "x": "地震の3日後、ふもとの上滝村から"}, {"t": 557.4166666666666, "x": "報告書が出されています。書いたのは"}, {"t": 559.75, "x": "村をまとめる肝煎という役の人です。"}, {"t": 562.0666666666667, "x": "報告書には温泉場で働いていた人の名前が並んでいました。"}, {"t": 566.1166666666667, "x": "その人数は36人でした。いまも温泉の跡と、ふもとの"}, {"t": 570.6333333333333, "x": "念法寺に供養塔が建っています。"}, {"t": 572.7666666666667, "x": "では山はどのくらい崩れたのでしょうか。"}, {"t": 575.2333333333333, "x": "崩れたあとの峰を見た人が、報告を残しています。"}, {"t": 578.9, "x": "大鳶山は頭から二割か三割ほどが崩れ落ちた。"}, {"t": 582.5333333333333, "x": "小鳶山は半分以上が崩れた。"}, {"t": 584.9333333333333, "x": "報告書は崩れる前と後の地形を比べています。"}, {"t": 588.1833333333333, "x": "いちばん深いところでは、240メートルも"}, {"t": 591.3833333333333, "x": "削られていました。崩れた土砂は、くぼ地の底を"}, {"t": 594.5833333333334, "x": "埋めながら湯川の谷を下りました。"}, {"t": 596.6, "x": "途中には高さ150メートルの尾根がありました。"}, {"t": 599.8166666666667, "x": "土砂はその尾根に乗り上げて越えました。"}, {"t": 602.15, "x": "そしてとなりの真川の谷に流れ込みました。"}, {"t": 604.9, "x": "さらにその谷を上流へ1.5キロもさかのぼりました。"}, {"t": 608.3333333333334, "x": "水が下から上へ流れることはありません。"}, {"t": 610.95, "x": "けれども勢いのついた土砂は谷を逆向きに進んだのです。"}, {"t": 614.55, "x": "土砂の跡は12キロ下流まで追うことができます。"}, {"t": 617.6166666666667, "x": "水谷という場所も、土砂で埋まりました。"}, {"t": 620.5, "x": "たまった土砂の厚さは、100メートルほどありました。"}, {"t": 623.85, "x": "研究者は崩れた岩の種類から"}, {"t": 625.95, "x": "流れの順番まで読み取っています。"}, {"t": 628.1166666666667, "x": "大鳶山は黄色っぽく変質した岩でできています。"}, {"t": 631.5666666666667, "x": "小鳶山は新しい安山岩でできています。"}, {"t": 634.5833333333334, "x": "二つの岩は重なってたまっていました。"}, {"t": 636.9666666666667, "x": "その重なり方から、順番が見えてきます。"}, {"t": 640.1166666666667, "x": "先に崩れたのは、大鳶山だったと考えられています。"}, {"t": 644.1166666666667, "x": "小鳶山は、少し遅れて崩れました。"}, {"t": 647.05, "x": "地震のあとカルデラの中ではぶきみな山鳴りが続きました。"}, {"t": 650.5666666666667, "x": "黒い煙がもうもうと立ちのぼりました。"}, {"t": 652.9666666666667, "x": "その煙は富山の城下町からも見えたといいます。"}, {"t": 656.1833333333333, "x": "冷たい水の池が、急に熱湯に"}, {"t": 658.8, "x": "変わったという記録もあります。"}, {"t": 660.55, "x": "その池はのちに「新湯」と呼ばれるようになりました。"}, {"t": 664.55, "x": "崩れた土砂は、湯川と真川の上流を何か所もふさぎました。"}, {"t": 668.7166666666667, "x": "こうして山の中に、大きな水たまりが"}, {"t": 671.4333333333333, "x": "いくつもできたのです。山の奥でいったい何が起きたのか。"}, {"t": 674.8833333333333, "x": "ふもとの人たちには、すぐにはわかりませんでした。"}, {"t": 678.2166666666667, "x": "常願寺川は泥の海のようになっていました。"}, {"t": 681.0666666666667, "x": "川沿いの道も、山崩れで切れていました。"}, {"t": 684.1666666666666, "x": "しかも季節は雪の深い時期です。"}, {"t": 686.4333333333333, "x": "川沿いに奥へ入ることは、とてもできませんでした。"}, {"t": 689.95, "x": "そこでふもとの寺の村が動きました。"}, {"t": 692.3, "x": "岩峅寺では体の強い男を12人選びました。"}, {"t": 695.6333333333333, "x": "男たちは川の向こうから大回りしました。"}, {"t": 698.4833333333333, "x": "目指したのは、鍬崎山という山です。"}, {"t": 701.4833333333333, "x": "標高は2000メートルをこえます。"}, {"t": 703.75, "x": "道はきわめてけわしいものでした。"}, {"t": 705.9333333333333, "x": "12人のうち5人は、途中で進めなくなりました。"}, {"t": 709.5666666666667, "x": "山頂まで登れたのは、7人でした。"}, {"t": 712.4666666666667, "x": "報告書には別の記録も載っています。"}, {"t": 714.9333333333333, "x": "上滝村の肝煎も、同じ山に登ったというものです。"}, {"t": 718.6333333333333, "x": "連れていったのは、20人あまりでした。"}, {"t": 721.4, "x": "どちらの記録も、山頂に着いたのは"}, {"t": 723.9333333333333, "x": "7人だったと伝えています。"}, {"t": 725.6833333333333, "x": "男たちは山頂から、立山カルデラの中を見下ろしました。"}, {"t": 729.9333333333333, "x": "見た様子はすぐに寺へ報告されました。"}, {"t": 732.55, "x": "そして加賀藩へ急いで伝えられました。"}, {"t": 734.9666666666667, "x": "となりの芦峅寺でも、8人の男が山へ向かいました。"}, {"t": 738.7833333333333, "x": "男たちは裏山を回り込み、称名滝の上流へ出ました。"}, {"t": 743.0333333333333, "x": "谷川を越え松尾峠まで登りました。"}, {"t": 745.6333333333333, "x": "そして北から、カルデラの中を見下ろしたのです。"}, {"t": 748.9, "x": "その報告もすぐに藩へ届けられました。"}, {"t": 751.5166666666667, "x": "岩峅寺の男たちの報告には、こうあります。"}, {"t": 754.85, "x": "温泉の後ろの、小鳶と大鳶の二つの山が大きく崩れている。"}, {"t": 759.4833333333333, "x": "温泉場はあとかたもなくなっているように見える。"}, {"t": 762.35, "x": "カルデラの中には、泥の水をためた"}, {"t": 764.8166666666667, "x": "池がいくつもできていました。"}, {"t": 766.4166666666666, "x": "ある記録は、池の数を書いています。"}, {"t": 769.15, "x": "大きな池が一つと、ほかに七つの池です。"}, {"t": 772.2166666666667, "x": "いちばん大きかったのは、真川をふさいだ天然ダムでした。"}, {"t": 776.0833333333334, "x": "報告書はその大きさを推定しています。"}, {"t": 778.8166666666667, "x": "せき止めた土砂の高さは、150メートル。"}, {"t": 781.9166666666666, "x": "たまった水の量は、3750万立方メートルです。"}, {"t": 786.25, "x": "湯川のほうにも、別の天然ダムができていました。"}, {"t": 789.7, "x": "こちらは水の多くが土砂の下へしみこんでいました。"}, {"t": 792.7833333333333, "x": "表にたまった水は、わずかだったようです。"}, {"t": 795.7833333333333, "x": "この知らせは、富山藩にも届きました。"}, {"t": 798.6333333333333, "x": "人々はすぐにその意味をさとりました。"}, {"t": 801.05, "x": "山の中の泥の水が、どっと押し出してきたらどうなるか。"}, {"t": 804.8, "x": "富山平野は泥の海になる。人々は家の道具を"}, {"t": 807.9666666666667, "x": "まとめ、家族を連れて逃げました。"}, {"t": 810.5, "x": "逃げた先は呉羽丘陵のあたりの高台です。"}, {"t": 813.45, "x": "富山藩の十代藩主だった前田利保も、避難しました。"}, {"t": 817.5833333333334, "x": "城下は大きな混乱になりました。"}, {"t": 819.7833333333333, "x": "地震のすぐあとに、川の流れが止まっていました。"}, {"t": 823.2833333333333, "x": "人々は、それを見て決壊を予想しました。"}, {"t": 826.5, "x": "そして逃げたのだと、報告書は書いています。"}, {"t": 829.55, "x": "川がやせたことが、危険の知らせになっていたのです。"}, {"t": 833.0666666666667, "x": "ただし、い 3.7333333333333, "x": "二度の洪水のあと、人々の暮らしは"}, {"t": 1176.3833333333334, "x": "どうなったのでしょうか。加賀藩は"}, {"t": 1178.4333333333334, "x": "まず食べ物を配りました。家を"}, {"t": 1180.5333333333333, "x": "流された人たちに、米を支給したのです。"}, {"t": 1183.3833333333334, "x": "4歳以上の男女ひとりにつき、1日3合でした。"}, {"t": 1187.3, "x": "地震で家が倒れた人には、米を貸し出しました。"}, {"t": 1190.8166666666666, "x": "返すのは翌年からで、15年がかりです。"}, {"t": 1194.0333333333333, "x": "利息はつけないという約束でした。"}, {"t": 1196.3, "x": "けれども泥に埋まった田畑はすぐには元に戻りません。"}, {"t": 1199.6333333333334, "x": "特に常願寺川の左岸の村々はひどく荒れました。"}, {"t": 1202.9666666666667, "x": "地震の翌年にあたる1859年のことです。"}, {"t": 1206.5666666666666, "x": "加賀藩はある決断をしました。"}, {"t": 1208.65, "x": "左岸の14の村に、川の向こうの"}, {"t": 1211.5, "x": "原野へ移るよう勧めたのです。"}, {"t": 1213.4333333333334, "x": "移ったのは250戸あまりの農家でした。"}, {"t": 1216.25, "x": "その原野は水の便が悪い土地でした。"}, {"t": 1218.8166666666666, "x": "そのためそれまで手つかずのまま残っていました。"}, {"t": 1221.6166666666666, "x": "ところが二度の洪水で用水路から泥が入りました。"}, {"t": 1224.8833333333334, "x": "その泥で土が少し良くなっていたといいます。"}, {"t": 1227.7166666666667, "x": "移った人たちは、元の村の名前を新しい村にもつけました。"}, {"t": 1231.9666666666667, "x": "ただし頭に「引越」の二文字がつきました。"}, {"t": 1235.7, "x": "引越の何々村、というぐあいです。"}, {"t": 1238.5333333333333, "x": "藩が指示したのか、故郷を忘れないためだったのか。"}, {"t": 1242.0666666666666, "x": "そのわけはわかっていません。"}, {"t": 1243.9, "x": "土地が二か所や三か所に分けて"}, {"t": 1245.7166666666667, "x": "割り当てられた村もありました。"}, {"t": 1247.4666666666667, "x": "新しい土地を切り開くのは、"}, {"t": 1249.3333333333333, "x": "楽な仕事ではなかったはずです。"}, {"t": 1251.6166666666666, "x": "暮らしを苦しめたのは、洪水だけではありませんでした。"}, {"t": 1255.25, "x": "この年の夏には米の値段が大きく上がりました。"}, {"t": 1258.3833333333334, "x": "7月には金沢で打ちこわしが起きました。"}, {"t": 1261.2833333333333, "x": "打ちこわしは、越中の町々にも広がりました。"}, {"t": 1264.7166666666667, "x": "さらにこの年は、世界でコレラが"}, {"t": 1267.1833333333334, "x": "はやった年でもありました。"}, {"t": 1268.7333333333333, "x": "病は長崎に入ったアメリカの船から広がりました。"}, {"t": 1272.2166666666667, "x": "8月には加賀藩の領内にも入っています。"}, {"t": 1275.1166666666666, "x": "かかると、2日か3日で亡くなりました。"}, {"t": 1277.9333333333334, "x": "そのため、「三日コロリ」と呼ばれました。"}, {"t": 1281.2666666666667, "x": "いまの射水市に、古い家が残っています。"}, {"t": 1284.3166666666666, "x": "その家の棟札に、この一年の"}, {"t": 1286.7666666666667, "x": "出来事が書きつけられていました。"}, {"t": 1288.6166666666666, "x": "棟札は建物を建てたり直したりしたときの記録の札です。"}, {"t": 1292.3, "x": "そこには地震で山が崩れて水が止まったこと。"}, {"t": 1295.3166666666666, "x": "3月10日と4月26日に、大水が出たこと。"}, {"t": 1299.1833333333334, "x": "米の値段が上がったこと。そして"}, {"t": 1301.15, "x": "三日コロリがはやったことが"}, {"t": 1302.85, "x": "続けて書かれていました。大工がふつうは書かない世の中の"}, {"t": 1306.2, "x": "出来事まで書き残したのです。"}, {"t": 1308.0, "x": "地震と洪水、米の値上がり、そして病。"}, {"t": 1311.65, "x": "越中の人々にとって、つらい一年でした。"}, {"t": 1314.9166666666667, "x": "1858年は、災いがとぎれなく続いたのです。"}, {"t": 1319.1833333333334, "x": "常願寺川の近くには、洪水を伝える石も残っています。"}, {"t": 1323.4166666666667, "x": "流杉という場所にある、大きな岩です。"}, {"t": 1326.4833333333333, "x": "この岩は洪水で流されてきたものと伝えられています。"}, {"t": 1329.9333333333334, "x": "高さは1.3メートル、幅は3.5メートルあります。"}, {"t": 1334.0333333333333, "x": "いまの堤防から、500メートルあまり離れた場所です。"}, {"t": 1337.8, "x": "明治2年にこの岩に水の神の像が彫られました。"}, {"t": 1341.0666666666666, "x": "横には「水除水神　村方安全」と刻まれています。"}, {"t": 1346.0666666666666, "x": "水から村を守ってほしいという願いです。"}, {"t": 1348.7833333333333, "x": "同じ明治2年には、立山温泉も再び開かれました。"}, {"t": 1352.8833333333334, "x": "地震から11年後のことでした。"}, {"t": 1355.1666666666667, "x": "ここで数字が割れているところを整理しておきます。"}, {"t": 1358.15, "x": "いちばん大きく割れているのは、崩れた土砂の量です。"}, {"t": 1361.6666666666667, "x": "最初の大きな推定は、1962年に出されました。"}, {"t": 1366.1166666666666, "x": "研究者の町田さんが、たまった"}, {"t": 1368.4833333333333, "x": "土砂の量から計算したものです。"}, {"t": 1370.55, "x": "その値は4億1000万立方メートルでした。"}, {"t": 1373.85, "x": "この数字は長いあいだ鳶崩れの"}, {"t": 1376.05, "x": "量として広く使われてきました。"}, {"t": 1378.0166666666667, "x": "のちに町田さん自身がこの数字を見直しています。"}, {"t": 1381.1833333333334, "x": "下流の土砂には、二回の決壊のときに"}, {"t": 1383.9, "x": "動いたものが含まれる。そう考えて"}, {"t": 1386.1666666666667, "x": "2億7000万立方メートルに改めました。"}, {"t": 1388.9833333333333, "x": "1974年には、国の砂防の"}, {"t": 1392.0666666666666, "x": "事務所が別の試算を出しています。"}, {"t": 1394.1333333333334, "x": "こちらは3億3000万立方メートルでした。"}, {"t": 1397.1333333333334, "x": "ところがその後の現地調査で、"}, {"t": 1399.0, "x": "新しいことがわかってきました。"}, {"t": 1401.2666666666667, "x": "土砂の山と思われていた丘の"}, {"t": 1403.1333333333334, "x": "一部は、もとからの岩盤でした。"}, {"t": 1405.5166666666667, "x": "水谷の段丘でも、下のほうに古い岩が見つかりました。"}, {"t": 1409.5666666666666, "x": "その上には昔の火砕流の地層もありました。"}, {"t": 1412.6, "x": "崩れた土砂の層は、思われていたより薄かったのです。"}, {"t": 1416.2166666666667, "x": "その後の研究は、崩れる前と後の地形を比べました。"}, {"t": 1420.2833333333333, "x": "出てきた値は、1億1400万立方メートルです。"}, {"t": 1424.3166666666666, "x": "たまった土砂を場所ごとに数え直す方法も、使われました。"}, {"t": 1428.35, "x": "こちらの答えは、少なめで1億300万立方メートルです。"}, {"t": 1432.6833333333334, "x": "多めに見ても、1億2700万立方メートルでした。"}, {"t": 1436.7833333333333, "x": "広く言われてきた4億1000万の、およそ4分の1です。"}, {"t": 1441.0333333333333, "x": "同じ崩れでも、見積もりの方法で"}, {"t": 1443.5666666666666, "x": "4倍もの開きが出ているのです。"}, {"t": 1445.55, "x": "なぜこれほど違うのでしょうか。"}, {"t": 1447.5166666666667, "x": "崩れた土砂の多くは、二回の決壊で下流へ運ばれました。"}, {"t": 1451.5333333333333, "x": "谷に残っているのは、そのごく一部です。"}, {"t": 1454.5, "x": "しかも二つの土砂を見分けるのはとても難しいのです。"}, {"t": 1457.8833333333334, "x": "地震のときの土砂と、決壊のときの土砂です。"}, {"t": 1461.15, "x": "報告書自身も、どの方法にも課題があると書いています。"}, {"t": 1465.2, "x": "この番組では、報告書の推定である"}, {"t": 1467.9666666666667, "x": "一億立方メートルあまりを、有力な値として扱います。"}, {"t": 1472.1666666666667, "x": "それでも、1億立方メートルをこえる崩れです。"}, {"t": 1475.65, "x": "世界でも、きわめて大きなものです。"}, {"t": 1478.4333333333334, "x": "ほかにも割れている数字があります。"}, {"t": 1480.55, "x": "立山温泉で亡くなった人の数です。"}, {"t": 1483.1, "x": "報告書の本文では、30人あまりとされています。"}, {"t": 1486.9333333333334, "x": "肝煎の報告書と供養塔では、36人です。"}, {"t": 1490.6833333333334, "x": "地震の大きさも、7.0から7.6まで幅があります。"}, {"t": 1495.0, "x": "地震が一回だったのか、二回続いたのかも、"}, {"t": 1498.1833333333334, "x": "まだ決まっていません。もう一つ"}, {"t": 1500.1333333333334, "x": "気になる手がかりがあります。"}, {"t": 1501.9666666666667, "x": "土砂の中から見つかった、木片の年代です。"}, {"t": 1505.35, "x": "多くは数百年前という値でした。"}, {"t": 1507.95, "x": "1858年の崩れに巻き込まれた木と、判断されています。"}, {"t": 1512.65, "x": "けれども720年から940年前という値もありました。"}, {"t": 1517.1833333333334, "x": "報告書は、ここから一つの可能性を書いています。"}, {"t": 1520.6833333333334, "x": "1858年より前にも、大きな崩れが"}, {"t": 1524.2166666666667, "x": "あったかもしれないというのです。"}, {"t": 1525.9666666666667, "x": "ただし測ったのは20年以上前のことです。"}, {"t": 1528.85, "x": "新しい方法で測り直す必要がある、とも書いています。"}, {"t": 1532.95, "x": "では三つに分けて整理します。"}, {"t": 1535.05, "x": "まず定説と言えることです。"}, {"t": 1536.85, "x": "1858年4月9日の未明、"}, {"t": 1539.7833333333333, "x": "跡津川断層の活動で大きな地震が起きた。"}, {"t": 1543.2333333333333, "x": "大鳶山と小鳶山が崩れ、その土砂が川をせき止めた。"}, {"t": 1547.55, "x": "せき止めは二度決壊し、二度目の被害がより大きかった。"}, {"t": 1551.5333333333333, "x": "次に有力説です。土砂の量を1億立方メートル"}, {"t": 1555.1833333333334, "x": "あまりとする推定が、ここに入ります。"}, {"t": 1557.9666666666667, "x": "一回目の決壊についての見方も、そうです。"}, {"t": 1561.3, "x": "雪どけと、同じ日の地震が関わったという見方です。"}, {"t": 1565.0, "x": "地震が二つ続いたという見方も、有力説の一つです。"}, {"t": 1568.9833333333333, "x": "最後に少数説です。4億立方メートルという古い推定は、"}, {"t": 1573.5666666666666, "x": "いまでは少数説にあたります。"}, {"t": 1575.8333333333333, "x": "1858年より前の大崩れも、"}, {"t": 1578.75, "x": "まだ確かめられていない段階です。"}, {"t": 1581.1833333333334, "x": "二度の洪水が終わっても、山の崩れは終わりませんでした。"}, {"t": 1585.1666666666667, "x": "地震の前の常願寺川は、どんな川だったのでしょうか。"}, {"t": 1589.0833333333333, "x": "地元の古い記録には、こう書かれています。"}, {"t": 1592.1, "x": "川には海の魚がのぼってきた。"}, {"t": 1594.3, "x": "鮎や鮭や鱒が、毎日の食卓をにぎわせた。"}, {"t": 1597.85, "x": "地震の14年前に、この川を渡った儒学者がいます。"}, {"t": 1601.9, "x": "川は二つの瀬に分かれた大河で、"}, {"t": 1604.0333333333333, "x": "舟で渡ったと書いています。"}, {"t": 1606.0333333333333, "x": "舟賃は六文でした。河口から上滝のあたりまで、"}, {"t": 1609.55, "x": "舟が通っていたとされています。"}, {"t": 1611.8166666666666, "x": "上滝は扇状地のいちばん上にあたる場所です。"}, {"t": 1614.95, "x": "地震のあと、この川はすっかり姿を変えました。"}, {"t": 1618.5, "x": "カルデラに残った土砂が、雨のたびに"}, {"t": 1621.0833333333333, "x": "流れ出すようになったのです。"}, {"t": 1622.7666666666667, "x": "川底は上がり、大雨のたびに堤防が切れました。"}, {"t": 1626.4333333333334, "x": "報告書が引く年表には、はっきりした数字があります。"}, {"t": 1630.2333333333333, "x": "堤防が切れるなどの目立った災害の数です。"}, {"t": 1633.0333333333333, "x": "地震の前の100年間では、12件でした。"}, {"t": 1636.4, "x": "それが地震のあとの100年間では88件に増えています。"}, {"t": 1640.5, "x": "明治に入ってからの42年間には、"}, {"t": 1643.05, "x": "40回の洪水が起きました。"}, {"t": 1645.3833333333334, "x": "1891年の7月にも、大雨で堤防が切れました。"}, {"t": 1650.0, "x": "島村という村は、村全体が3週間も"}, {"t": 1653.3, "x": "水につかったままでした。村人はほかの土地へ"}, {"t": 1655.9333333333334, "x": "移らなければならなかったといいます。"}, {"t": 1658.2, "x": "この洪水のあと、国は一人の技師を富山へ送りました。"}, {"t": 1662.0833333333333, "x": "オランダから来た、ヨハネス・デ・レーケです。"}, {"t": 1664.8333333333333, "x": "デ・レーケは、常願寺川を見て"}, {"t": 1667.0666666666666, "x": "こう言ったと伝えられています。これは川ではない。"}, {"t": 1670.1, "x": "滝だ。この言葉はとても有名です。"}, {"t": 1673.2, "x": "ただし本人の記録で確かめられた発言ではありません。"}, {"t": 1676.6666666666667, "x": "伝えられてきた言葉として、聞いておくのがよいでしょう。"}, {"t": 1680.1166666666666, "x": "実際に常願寺川の傾きは、平均で30分の1です。"}, {"t": 1684.65, "x": "長さ56キロの川が、海までいっきに下ります。"}, {"t": 1688.3833333333334, "x": "中央防災会議の報告書は、世界でも"}, {"t": 1691.4833333333333, "x": "有数の急流と書いています。"}, {"t": 1693.3666666666666, "x": "デ・レーケは、まず下流を調べました。"}, {"t": 1696.0166666666667, "x": "そのあと立山に登り、崩れた場所を見て回りました。"}, {"t": 1699.7666666666667, "x": "そして上流の土砂を止めることが欠かせないと考えました。"}, {"t": 1703.3, "x": "けれども当時の技術とお金では、それはできませんでした。"}, {"t": 1707.1333333333334, "x": "上流で土砂を止める工事が始まったのは、1906年です。"}, {"t": 1711.6666666666667, "x": "明治39年に、富山県がカルデラの中で"}, {"t": 1715.1166666666666, "x": "砂防工事に手をつけました。"}, {"t": 1716.8333333333333, "x": "しかし県の力だけでは山の崩れに追いつきませんでした。"}, {"t": 1720.5166666666667, "x": "1926年に、常願寺川の砂防は国の工事に引き継がれます。"}, {"t": 1725.7666666666667, "x": "国が中心にすえたのは、カルデラの"}, {"t": 1728.3166666666666, "x": "出口に造る大きな堰堤でした。"}, {"t": 1730.4166666666667, "x": "堰堤とは土砂をせき止めて川底を安定させるための壁です。"}, {"t": 1734.3833333333334, "x": "白岩砂防堰堤の本体は、1931年に工事が始まりました。"}, {"t": 1739.9333333333334, "x": "完成したのは、1939年です。"}, {"t": 1743.3833333333334, "x": "本体の高さは、63メートルあります。"}, {"t": 1746.6166666666666, "x": "その下には、七つの小さな堰堤が続きます。"}, {"t": 1750.0666666666666, "x": "すべて合わせると、落差は108メートルです。"}, {"t": 1753.4833333333333, "x": "砂防の堰堤としては、日本一の高さです。"}, {"t": 1756.8833333333334, "x": "下流の本宮にも、大きな堰堤が造られました。"}, {"t": 1760.2833333333333, "x": "本宮砂防堰堤は、1935年に工事が始まりました。"}, {"t": 1765.1166666666666, "x": "完成したのは、1937年です。"}, {"t": 1768.55, "x": "ためられる土砂の量は、計画で"}, {"t": 1770.7833333333333, "x": "500万立方メートルあります。" const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
