<script>
const D={"name": "ep020", "file": "ep020", "dur": 1921.2, "segs": [], "subs": [{"t": 0.0, "x": "方位磁針の赤い針は、北を指します。"}, {"t": 3.033333333333333, "x": "地図を読むときも、山で道に迷ったときも、"}, {"t": 6.033333333333333, "x": "この針は同じ向きを示します。"}, {"t": 8.35, "x": "けれども、それは地球の歴史のなかで、"}, {"t": 11.083333333333334, "x": "いつでも成り立っていたことではありません。"}, {"t": 13.666666666666666, "x": "いまから、およそ4万2000年前。"}, {"t": 15.2, "x": "4万2000年前█"}, {"t": 16.916666666666668, "x": "地球の磁場が、いまの五パーセントほどにまで"}, {"t": 19.883333333333333, "x": "弱まった時期がありました。"}, {"t": 21.466666666666665, "x": "そのあと、しばらくのあいだ、"}, {"t": 23.55, "x": "磁場の向きがほぼ逆になりました。"}, {"t": 25.883333333333333, "x": "もしその時代に方位磁針を持っていけば、針は"}, {"t": 29.016666666666666, "x": "北ではなく、南のほうへ振れていたと考えられます。"}, {"t": 32.61666666666667, "x": "この出来事は、ラシャンプ・イベントと呼ばれています。"}, {"t": 33.65, "x": "ラシャンプ・イベント█"}, {"t": 36.46666666666667, "x": "名前は、フランス中部の小さな村の名前から来ています。"}, {"t": 40.516666666666666, "x": "その村の近くの溶岩が、この出来事を"}, {"t": 43.45, "x": "最初に教えてくれたからです。"}, {"t": 45.3, "x": "地球の磁場は、目に見えません。"}, {"t": 47.65, "x": "音もしませんし、においもありません。"}, {"t": 50.4, "x": "4万年前の磁場を、誰かが測っていたわけでもありません。"}, {"t": 54.833333333333336, "x": "それでも、いまの研究者は、その時の磁場の"}, {"t": 58.266666666666666, "x": "強さと向きを、百年単位の細かさで語ることができます。"}, {"t": 62.166666666666664, "x": "手がかりは四つあります。冷えて固まった溶岩。"}, {"t": 65.41666666666667, "x": "海の底にたまった泥。南極とグリーンランドの氷。"}, {"t": 68.96666666666667, "x": "そして、ニュージーランドの"}, {"t": 70.71666666666667, "x": "沼に埋もれていた、大きな木です。"}, {"t": 73.18333333333334, "x": "四つはどれも、磁場とはまったく違う"}, {"t": 75.91666666666667, "x": "理由でできたものです。それでも、同じ時期の"}, {"t": 78.8, "x": "同じ出来事を、それぞれのやりかたで書き残していました。"}, {"t": 82.51666666666667, "x": "この回の主語は、地球の磁場です。"}, {"t": 85.11666666666666, "x": "目に見えないものが乱れた記録を、"}, {"t": 87.11666666666666, "x": "人がどうやって読み出してきたのか。"}, {"t": 89.35, "x": "四つの記録を、一つずつ開いていきます。"}, {"t": 92.35, "x": "まず、ふだんの磁場を見ておきます。"}, {"t": 94.95, "x": "地球の中心には、核と呼ばれる部分があります。"}, {"t": 98.46666666666667, "x": "核の外側の部分は、溶けた鉄を主とする液体です。"}, {"t": 102.45, "x": "この液体は、ゆっくりと動き続けています。"}, {"t": 105.66666666666667, "x": "電気を通す液体が動くと、そこに電流が流れます。"}, {"t": 109.56666666666666, "x": "電流が流れると、磁場が生まれます。"}, {"t": 112.35, "x": "生まれた磁場の中を液体がさらに動くと、"}, {"t": 114.93333333333334, "x": "また電流が流れます。こうして、"}, {"t": 117.4, "x": "磁場が自分で自分を保ち続けています。"}, {"t": 120.36666666666666, "x": "イギリス地質調査所の解説は、"}, {"t": 122.46666666666667, "x": "これを「自己励起ダイナモ」と呼んでいます。"}, {"t": 125.98333333333333, "x": "発電機と同じしくみが、地球の奥で、"}, {"t": 128.83333333333334, "x": "止まらずに回っている、ということです。"}, {"t": 131.8, "x": "地面の近くで測ると、この磁場は、地球の"}, {"t": 135.18333333333334, "x": "中心に置いた一本の棒磁石によく似た形をしています。"}, {"t": 138.83333333333334, "x": "その棒磁石は、自転の軸から十度ほど傾いています。"}, {"t": 142.85, "x": "方位磁針の針が指す北が、地図の真北と"}, {"t": 145.9, "x": "すこしずれる理由の一つは、ここにあります。"}, {"t": 148.78333333333333, "x": "地表で測る磁場の強さは、場所によって違います。"}, {"t": 152.41666666666666, "x": "弱いところと強いところでは、"}, {"t": 154.26666666666668, "x": "およそ三倍の開きがあります。"}, {"t": 156.56666666666666, "x": "それでも、ふだんの暮らしで"}, {"t": 158.46666666666667, "x": "それを感じることはありません。"}, {"t": 160.31666666666666, "x": "身の回りの小さな磁石のほうが、ずっと強いからです。"}, {"t": 164.13333333333333, "x": "この磁場は、地球の外側にも大きく広がっています。"}, {"t": 167.9, "x": "太陽からは、電気を帯びた粒の"}, {"t": 170.23333333333332, "x": "流れが、絶えず吹きつけています。"}, {"t": 172.6, "x": "太陽風と呼ばれるものです。"}, {"t": 174.51666666666668, "x": "地球の磁場は、この風に押されて、ほうき星の"}, {"t": 178.01666666666668, "x": "尾のような形に引きのばされています。"}, {"t": 180.16666666666666, "x": "この磁場の広がりを、磁気圏と呼びます。"}, {"t": 183.08333333333334, "x": "いまは、欧州宇宙機関のスウォームという"}, {"t": 185.96666666666667, "x": "衛星の組が、地球の周りを回りながら、"}, {"t": 188.96666666666667, "x": "この磁場を測り続けています。"}, {"t": 191.1, "x": "衛星がとらえるのは、核でつくられる"}, {"t": 193.61666666666667, "x": "磁場だけではありません。地殻の岩、"}, {"t": 196.35, "x": "海の水、さらに空の高いところを"}, {"t": 198.75, "x": "流れる電流がつくる、小さな磁場も含まれています。"}, {"t": 202.33333333333334, "x": "それらを一つずつ切り分けることで、"}, {"t": 204.41666666666666, "x": "核の中の液体の動きを探っているのです。"}, {"t": 207.5, "x": "電気を帯びた粒の多くは、磁気圏の縁でそらされます。"}, {"t": 211.41666666666666, "x": "一部は、北極や南極の近くで、"}, {"t": 214.11666666666667, "x": "磁場の線に沿って大気へ降りてきます。"}, {"t": 216.78333333333333, "x": "そこで空気の中の酸素や窒素に"}, {"t": 218.98333333333332, "x": "ぶつかると、赤や緑の光を出します。これがオーロラです。"}, {"t": 222.53333333333333, "x": "オーロラ█"}, {"t": 224.25, "x": "太陽系の外からは、もっと強い粒も飛んできます。"}, {"t": 227.96666666666667, "x": "宇宙線と呼ばれる、非常に大きなエネルギーを"}, {"t": 231.1, "x": "持った粒です。地球の磁場は、この宇宙線の多くも、"}, {"t": 234.8, "x": "大気に入る手前で曲げています。"}, {"t": 237.13333333333333, "x": "ここで一つ、覚えておいてほしいことがあります。"}, {"t": 240.41666666666666, "x": "宇宙線が大気にぶつかると、空気の中の原子が"}, {"t": 243.8, "x": "壊れて、ふだんは少ない種類の原子ができます。"}, {"t": 247.1, "x": "磁場が弱まれば、大気に入る宇宙線は増えます。"}, {"t": 250.78333333333333, "x": "すると、そうした原子も増えます。"}, {"t": 253.28333333333333, "x": "この関係が、この回の後半で、"}, {"t": 255.86666666666667, "x": "記録を読むための大事な鍵になります。"}, {"t": 258.5, "x": "磁場の過去を調べる方法の始まりは、火山の石でした。"}, {"t": 262.46666666666664, "x": "溶岩には、鉄を含んだ小さな鉱物の粒が入っています。"}, {"t": 266.8333333333333, "x": "溶岩が熱いうちは、粒の磁石の性質はばらばらです。"}, {"t": 270.8833333333333, "x": "ところが、溶岩が冷えていく途中のある温度を下回ると、"}, {"t": 274.75, "x": "粒はその時の磁場の向きにそろって固まります。"}, {"t": 277.8833333333333, "x": "一度そろった向きは、そのあと、ほとんど変わりません。"}, {"t": 281.71666666666664, "x": "溶岩は、固まった瞬間の北の向きを、"}, {"t": 284.7, "x": "方位磁針のように閉じこめるのです。"}, {"t": 287.1666666666667, "x": "このことを使って、大きな発見をした人がいます。"}, {"t": 290.75, "x": "フランスの物理学者、ベルナール・ブリュンです。"}, {"t": 292.56666666666666, "x": "ベルナール・ブリュン█"}, {"t": 294.9166666666667, "x": "ブリュンは、1900年から1910年まで、フランス中部の"}, {"t": 299.85, "x": "ピュイ・ド・ドーム観測所の所長を務めていました。"}, {"t": 302.6166666666667, "x": "ピュイ・ド・ドームは、火山が"}, {"t": 304.4166666666667, "x": "並ぶオーヴェルニュ地方の山です。"}, {"t": 306.4166666666667, "x": "ブリュンは、近くのカンタル県にある、"}, {"t": 308.9166666666667, "x": "ポンファランという村の地層を調べました。"}, {"t": 311.65, "x": "そこには、玄武岩の溶岩が流れた跡があり、"}, {"t": 314.95, "x": "その下に粘土の層がありました。"}, {"t": 317.4, "x": "粘土は、流れてきた溶岩の熱で焼かれていました。"}, {"t": 320.8666666666667, "x": "焼かれた粘土も、冷えるときに、"}, {"t": 323.05, "x": "その時の磁場の向きを覚えます。"}, {"t": 325.4, "x": "ブリュンは、溶岩と、その下の"}, {"t": 328.0833333333333, "x": "焼けた粘土の両方を測りました。"}, {"t": 330.18333333333334, "x": "すると、どちらも、いまの磁場と"}, {"t": 332.8333333333333, "x": "ほぼ反対の向きを向いていました。"}, {"t": 334.8333333333333, "x": "二つの違う物が、同じ逆向きを示している。"}, {"t": 338.1666666666667, "x": "それは、石がおかしいのではなく、当時の磁場"}, {"t": 341.71666666666664, "x": "そのものが逆だった、という証拠になります。"}, {"t": 344.75, "x": "発表されたのは、1906年です。"}, {"t": 346.78333333333336, "x": "1906年█"}, {"t": 348.8, "x": "地球の磁場の北と南が、過去に入れかわっていたことを"}, {"t": 352.35, "x": "示した最初の報告とされています。"}, {"t": 354.6, "x": "2014年6月4日には、この発見を"}, {"t": 357.73333333333335, "x": "たたえる記念碑の除幕が行われました。"}, {"t": 360.15, "x": "のちの1963年には、いまと同じ向きの"}, {"t": 363.75, "x": "磁場が続いている時代が、彼の名前を"}, {"t": 366.4, "x": "とって、ブリュン期と名付けられています。"}, {"t": 368.85, "x": "その二十年あまりあと、日本でも"}, {"t": 371.4, "x": "同じ問題に取り組んだ研究者がいました。"}, {"t": 373.98333333333335, "x": "松山基範です。1929年、松山は、ブリュンの"}, {"t": 375.3833333333333, "x": "1929年█"}, {"t": 379.15, "x": "考えを裏づける研究を発表しました。"}, {"t": 381.8666666666667, "x": "逆向きの磁化を持つ岩は、フランスの"}, {"t": 384.53333333333336, "x": "一か所だけの珍しい石ではなかったのです。"}, {"t": 387.21666666666664, "x": "いま、最後に起きた完全な逆転は、二人の名前を"}, {"t": 391.5, "x": "とって、松山‐ブリュン境界と呼ばれています。"}, {"t": 392.06666666666666, "x": "松山‐ブリュン境界█"}, {"t": 395.43333333333334, "x": "その境界がとてもよく見える地層が、"}, {"t": 397.78333333333336, "x": "千葉県市原市の養老川の岸にあります。"}, {"t": 400.96666666666664, "x": "2020年、この地層が国際的な基準に"}, {"t": 404.23333333333335, "x": "選ばれ、およそ77万4千年前から始まる"}, {"t": 407.9166666666667, "x": "時代は、チバニアンと名付けられました。"}, {"t": 410.46666666666664, "x": "イギリス地質調査所によれば、過去一千万年のあいだ、"}, {"t": 414.3333333333333, "x": "地球の磁場は逆転を繰り返してきました。"}, {"t": 417.26666666666665, "x": "その割合は、百万年におよそ四回から五回です。"}, {"t": 421.1333333333333, "x": "最後の逆転からは、八十万年近くがたっています。"}, {"t": 425.1166666666667, "x": "完全な逆転には、およそ千年から数千年かかるとされます。"}, {"t": 429.65, "x": "ラシャンプ・イベントは、この完全な"}, {"t": 432.0, "x": "逆転とは少し違う種類の出来事です。"}, {"t": 434.6333333333333, "x": "その違いが見つかったのも、ブリュンと同じ、"}, {"t": 437.55, "x": "オーヴェルニュの火山の石からでした。"}, {"t": 440.03333333333336, "x": "フランス中部の町、クレルモン＝フェランの"}, {"t": 442.71666666666664, "x": "西には、小さな火山がいくつも並んでいます。"}, {"t": 445.96666666666664, "x": "シェーヌ・デ・ピュイ、火山の鎖と呼ばれる山並みです。"}, {"t": 449.48333333333335, "x": "その一つに、ラシャンプという名の山があります。"}, {"t": 452.8, "x": "近くには、同じ名前の村があります。"}, {"t": 455.6, "x": "1967年█"}, {"t": 455.6, "x": "1967年、二人の研究者が"}, {"t": 459.01666666666665, "x": "このあたりの溶岩の磁気を調べました。"}, {"t": 461.3333333333333, "x": "ノルベール・ボノメと、ジャン・バブキーヌです。"}, {"t": 464.06666666666666, "x": "彼らが測ったのは、ラシャンプの溶岩と、"}, {"t": 466.8833333333333, "x": "近くのオルビーという村の溶岩です。"}, {"t": 469.46666666666664, "x": "そしてもう一つ、ラシャンプの"}, {"t": 471.68333333333334, "x": "山をつくる、火山の砕けた岩でした。"}, {"t": 474.48333333333335, "x": "結果は、ほぼ逆向きでした。"}, {"t": 476.71666666666664, "x": "溶岩が覚えていた北の向きは、"}, {"t": 478.78333333333336, "x": "いまの北とはほぼ反対を指していました。"}, {"t": 481.53333333333336, "x": "ここまでは、ブリュンの発見と似ています。"}, {"t": 484.35, "x": "違ったのは、その溶岩の若さです。"}, {"t": 487.15, "x": "ブリュンが調べた溶岩は、最後の逆転より"}, {"t": 490.25, "x": "前の、ずっと古い時代のものでした。"}, {"t": 492.81666666666666, "x": "一方、シェーヌ・デ・ピュイの火山は、地質の"}, {"t": 496.1166666666667, "x": "時間でいえば、ごく最近まで火を噴いていた山です。"}, {"t": 499.68333333333334, "x": "のちの年代測定で、ラシャンプの溶岩は、"}, {"t": 503.3833333333333, "x": "およそ4万年前のものと分かりました。"}, {"t": 503.8333333333333, "x": "4万年前█"}, {"t": 506.65, "x": "最後の逆転は、77万年あまり前です。そのあとはずっと、"}, {"t": 511.65, "x": "いまと同じ向きが続いていたはずでした。"}, {"t": 514.4666666666667, "x": "それなのに、4万年前の溶岩が、逆を向いている。"}, {"t": 518.8, "x": "これが意味するのは、磁場の向きが、"}, {"t": 521.15, "x": "ごく短いあいだだけ、逆になりかけたということです。"}, {"t": 525.1833333333333, "x": "しかも、そのあと、磁場は元の向きに戻っています。"}, {"t": 529.0333333333333, "x": "戻ったからこそ、いま方位磁針は北を指しています。"}, {"t": 532.7, "x": "こうした出来事は、完全な逆転と区別して、"}, {"t": 535.7666666666667, "x": "エクスカーション█"}, {"t": 536.2666666666667, "x": "エクスカーションと呼ばれるようになりました。"}, {"t": 539.1333333333333, "x": "イギリス地質調査所の解説では、エクスカーションは、"}, {"t": 542.7666666666667, "x": "磁場の強さが大きく落ちるもの、とされています。"}, {"t": 546.3666666666667, "x": "ただし逆転はせず、のちに同じ向きで立ち直ります。"}, {"t": 550.05, "x": "ラシャンプの溶岩は、その最初の、はっきりした"}, {"t": 553.5666666666667, "x": "例として知られるようになりました。"}, {"t": 555.4333333333333, "x": "この出来事が、村の名前をとって、ラシャンプ・"}, {"t": 558.9333333333333, "x": "イベントと呼ばれるのは、そのためです。"}, {"t": 561.3666666666667, "x": "英語の論文では、最後に「ス」を付けて、"}, {"t": 565.25, "x": "ラシャンプス・エクスカーションと"}, {"t": 567.1, "x": "書かれることもあります。地元の"}, {"t": 569.3333333333334, "x": "火山案内によれば、同じ特徴を持つ溶岩は、"}, {"t": 572.3166666666667, "x": "近くのオルビーやルシャディエールにもあります。"}, {"t": 575.0333333333333, "x": "世界全体では、十数か所で同じ時期の記録が"}, {"t": 578.4166666666666, "x": "見つかっています。ただし、この発見は、すんなりとは"}, {"t": 582.6333333333333, "x": "受け入れられませんでした。"}, {"t": 584.0333333333333, "x": "溶岩が逆を向いているのは本当に"}, {"t": 586.3666666666667, "x": "磁場のせいなのか、という疑いが出たのです。"}, {"t": 589.3166666666667, "x": "溶岩の中の鉱物には、やっかいな"}, {"t": 592.1666666666666, "x": "性質を持つものがあります。"}, {"t": 593.9166666666666, "x": "周りの磁場とは関係なく、冷えていく途中で、"}, {"t": 597.1666666666666, "x": "自分で逆向きに磁石になってしまうものです。"}, {"t": 600.2666666666667, "x": "これを、自己反転と呼びます。"}, {"t": 601.0833333333334, "x": "自己反転█"}, {"t": 603.15, "x": "もしラシャンプの溶岩が自己反転を起こしていたのなら、"}, {"t": 606.3666666666667, "x": "逆向きの記録は、石の中だけの出来事です。"}, {"t": 610.0666666666667, "x": "地球の磁場は、何も変わっていなかったことになります。"}, {"t": 613.55, "x": "一つの場所の、一種類の石だけでは、"}, {"t": 616.3, "x": "この二つを見分けることができません。"}, {"t": 618.8, "x": "1971年、別の研究班が、ラシャンプと"}, {"t": 623.2666666666667, "x": "オルビーの溶岩を細かく調べました。"}, {"t": 625.5, "x": "鉱物を顕微鏡で見て、磁石の性質を"}, {"t": 628.55, "x": "担っている粒の種類を確かめたのです。"}, {"t": 630.9166666666666, "x": "結論は、磁化は安定していて、とても小さな磁鉄鉱の"}, {"t": 635.3, "x": "粒が担っている、というものでした。"}, {"t": 637.7833333333333, "x": "溶岩は、冷えたときの周りの"}, {"t": 640.0166666666667, "x": "磁場の向きを、忠実に記録している。そう書かれています。"}, {"t": 643.85, "x": "ところが、のちの研究で、これらの岩は鉱物の性質から、"}, {"t": 648.3333333333334, "x": "自己反転を起こしやすいことが示されました。"}, {"t": 651.3166666666667, "x": "論争は、ここで一度こじれます。"}, {"t": 653.8, "x": "2006年に発表された再調査では、この火山の"}, {"t": 657.4, "x": "鎖の溶岩を、改めて広く調べ直しています。"}, {"t": 660.8666666666667, "x": "対象は二十の溶岩、二百五十七個の試料です。"}, {"t": 664.85, "x": "そのうち九つの溶岩は、いまと同じ、"}, {"t": 667.7833333333333, "x": "正しい向きを向いていました。"}, {"t": 670.0833333333334, "x": "オルビーやルシャディエールなど六か所の溶岩は、"}, {"t": 672.7, "x": "北と南のあいだの、中途半端な向きを示しました。"}, {"t": 676.6, "x": "そして、その中途半端な溶岩では、少なくとも"}, {"t": 680.35, "x": "半数の試料で、信頼できる向きが得られませんでした。"}, {"t": 684.0166666666667, "x": "正しい向きの溶岩で使えなかった試料は、二割ほどです。"}, {"t": 687.9833333333333, "x": "ばらつきの大きさが、まるで違っていたのです。"}, {"t": 691.2, "x": "山の溶岩には、落雷の電流で磁化がかけ"}, {"t": 694.3666666666667, "x": "直された跡も、たびたび見つかりました。"}, {"t": 697.1333333333333, "x": "つまり、溶岩という記録係は、正直ではあっても、"}, {"t": 701.25, "x": "あまり几帳面ではありませんでした。"}, {"t": 703.7, "x": "一回の噴火が残すのは、冷えた"}, {"t": 706.2333333333333, "x": "瞬間の一回ぶんの向きだけです。"}, {"t": 708.3833333333333, "x": "次の噴火まで、何百年も、何千年も、記録が途切れます。"}, {"t": 713.6166666666667, "x": "そのうえ、鉱物の性質や雷によって、"}, {"t": 716.9333333333333, "x": "記録が乱されることもあります。"}, {"t": 719.0833333333334, "x": "それでも、溶岩の年代を測る研究は積み重ねられました。"}, {"t": 723.4333333333333, "x": "溶岩に含まれる放射性の原子が、決まった速さで"}, {"t": 727.1333333333333, "x": "別の原子に変わっていくことを使う方法です。"}, {"t": 730.0833333333334, "x": "測りかたを変えて何度も確かめた結果、これらの溶岩は、"}, {"t": 734.1833333333333, "x": "どれもおよそ4万年前のものと分かりました。"}, {"t": 737.25, "x": "この時期は、別の方法で調べられていた、地球の"}, {"t": 741.0833333333334, "x": "磁場がとても弱かった時期と重なっていました。"}, {"t": 743.7, "x": "溶岩だけでは、決め手になりません。"}, {"t": 746.3166666666667, "x": "必要だったのは、同じ時期を、"}, {"t": 748.5333333333333, "x": "途切れずに記録している別の物でした。"}, {"t": 751.1833333333333, "x": "途切れない記録を残すものの一つが、"}, {"t": 753.5, "x": "海や湖の底にたまる泥です。"}, {"t": 756.05, "x": "泥の中にも、鉄を含んだ細かい粒が混じっています。"}, {"t": 759.7833333333333, "x": "粒は、水の中をゆっくり沈むあいだに、"}, {"t": 762.6833333333333, "x": "方位磁針のように、その時の磁場の向きにそろいます。"}, {"t": 766.65, "x": "そのまま底に積もり、その次の泥が、"}, {"t": 769.5166666666667, "x": "さらに積み重なっていきます。"}, {"t": 771.55, "x": "溶岩が一回ごとの写真だとすれば、泥は、"}, {"t": 774.8, "x": "止まらずに回り続ける記録装置のようなものです。"}, {"t": 778.0833333333334, "x": "ただし、泥には泥の弱点があります。"}, {"t": 781.1666666666666, "x": "年代を決めるのが難しいのです。"}, {"t": 783.5, "x": "ドイツ地球科学研究センター、GFZの研究班は、"}, {"t": 787.85, "x": "黒海の南東部で海底の泥を柱の形に抜き取りました。"}, {"t": 791.9, "x": "その泥の柱の年代を決めるために、"}, {"t": 794.3333333333334, "x": "三つの方法を重ねています。"}, {"t": 796.6333333333333, "x": "一つ目は、泥に含まれる炭素14を"}, {"t": 799.4333333333333, "x": "使った年代測定で、十六か所を測りました。"}, {"t": 802.8833333333333, "x": "二つ目は、火山灰の層です。"}, {"t": 805.3333333333334, "x": "黒海の泥の中には、イタリア南部の大きな噴火で"}, {"t": 808.8333333333334, "x": "飛んできた火山灰の層が挟まっていました。"}, {"t": 811.45, : "ある原子が急に増えていたことにも触れています。"}, {"t": 929.0166666666667, "x": "ベリリウム10です。黒海の泥が"}, {"t": 930.9333333333333, "x": "磁場の向きを記録していたちょうどその時、"}, {"t": 933.5, "x": "北極に近い氷は、別のものを記録していました。"}, {"t": 937.3166666666667, "x": "初めのほうで見た、宇宙線と原子の関係に戻ります。"}, {"t": 941.3333333333334, "x": "宇宙線が大気の高いところに飛びこむと、"}, {"t": 943.9, "x": "空気の中の原子にぶつかって、それを壊します。"}, {"t": 947.6666666666666, "x": "その壊れかたによって、ふだんは"}, {"t": 949.9333333333333, "x": "ごくわずかしかない種類の原子ができます。"}, {"t": 952.45, "x": "ベリリウム10█"}, {"t": 952.45, "x": "ベリリウム10は、その一つです。"}, {"t": 955.75, "x": "できたベリリウム10は、空気の中の細かいちりに"}, {"t": 959.0166666666667, "x": "くっついて、やがて雪といっしょに地面へ降ります。"}, {"t": 962.2166666666667, "x": "南極やグリーンランドでは、雪は溶けずに"}, {"t": 965.0833333333334, "x": "積もり続け、押し固められて氷になります。"}, {"t": 968.15, "x": "その氷を、表面から深いほうへ、円い柱の"}, {"t": 972.4666666666667, "x": "形に掘り出したものを、氷床コアと呼びます。"}, {"t": 975.6, "x": "氷床コアの中のベリリウム10を測ると、"}, {"t": 978.25, "x": "その年に大気へ入った宇宙線の多さが分かります。"}, {"t": 981.9, "x": "宇宙線の量は、磁場の強さで変わります。"}, {"t": 985.05, "x": "磁場が弱ければ、宇宙線は多く入り、"}, {"t": 988.0666666666667, "x": "ベリリウム10は増えます。"}, {"t": 990.0333333333333, "x": "つまり氷は、磁場の強さを、"}, {"t": 992.3666666666667, "x": "裏側から記録していることになります。"}, {"t": 995.0, "x": "このベリリウム10の山が最初に"}, {"t": 996.9666666666667, "x": "見つかったのは、南極の氷でした。"}, {"t": 999.5166666666667, "x": "1987年█"}, {"t": 999.5166666666667, "x": "1987年、フランスの研究班が、南極の"}, {"t": 1004.2166666666667, "x": "ボストーク基地とドームCで掘られた氷を調べました。"}, {"t": 1007.3833333333333, "x": "その中に、ベリリウム10が大きく増えた層があったのです。"}, {"t": 1011.35, "x": "当時は、その層の年代も、原因も、"}, {"t": 1014.6333333333333, "x": "はっきりしませんでした。ただ、研究班は、"}, {"t": 1018.1333333333333, "x": "この山が、離れた場所の記録どうしを"}, {"t": 1021.1, "x": "合わせる目印になりうる、と書いています。"}, {"t": 1023.9333333333333, "x": "そのあと、ボストークの別の氷の柱では、この山が、"}, {"t": 1028.1666666666667, "x": "こぶを二つ持つ形をしていることが分かりました。"}, {"t": 1031.3833333333334, "x": "山は一つの塊ではなく、細かい形を持っていたのです。"}, {"t": 1035.5833333333333, "x": "2017年█"}, {"t": 1035.5833333333333, "x": "2017年、同じ研究者たちは、"}, {"t": 1038.55, "x": "さらに細かく測った結果を発表しました。"}, {"t": 1041.5833333333333, "x": "使ったのは、グリーンランドの"}, {"t": 1043.6, "x": "NGRIPと呼ばれる氷床コアです。"}, {"t": 1046.3666666666666, "x": "深さ二千百二メートルから二千百四十メートルまでの、"}, {"t": 1050.0333333333333, "x": "およそ三十八メートルの区間。"}, {"t": 1052.4166666666667, "x": "その氷を、長さ十一センチずつに切り分けました。"}, {"t": 1056.2333333333333, "x": "一つの試料は、重さおよそ百グラム。"}, {"t": 1059.1166666666666, "x": "氷の年数にすると、五年から十年ぶんです。"}, {"t": 1062.7, "x": "その百グラムの氷の中から、ベリリウム10の"}, {"t": 1065.95, "x": "原子を、一つずつ数えていきます。"}, {"t": 1068.4166666666667, "x": "一つの試料で数えられたのは、"}, {"t": 1070.3666666666666, "x": "平均して、およそ四百個でした。"}, {"t": 1073.35, "x": "氷の百グラムの中に、宇宙から来た痕跡が、数百個。"}, {"t": 1078.0166666666667, "x": "その数の変わりかたが、4万1000年前ごろの"}, {"t": 1081.35, "x": "磁場の弱まりを描き出しました。"}, {"t": 1083.2333333333333, "x": "そして、同じ形の山が、南極の氷にもありました。"}, {"t": 1087.5666666666666, "x": "北の氷と南の氷は、地球の反対側どうしにあり、"}, {"t": 1091.6666666666667, "x": "雪の降りかたも、氷のできかたも違います。"}, {"t": 1095.0166666666667, "x": "それでも、磁場が弱まって宇宙線が増えたことは、"}, {"t": 1098.4833333333333, "x": "地球全体で同時に起きた出来事です。"}, {"t": 1101.25, "x": "だから、山の形を合わせれば、北と南の氷の"}, {"t": 1105.1666666666667, "x": "年代を、ぴったりそろえることができます。"}, {"t": 1108.0166666666667, "x": "2017年の研究では、そのずれを、"}, {"t": 1111.0166666666667, "x": "プラスマイナス二十年まで小さくできたとしています。"}, {"t": 1114.5166666666667, "x": "それより前の研究では、二百年の幅がありました。"}, {"t": 1118.2666666666667, "x": "以前に使われたグリーンランドの氷の試料は、"}, {"t": 1121.15, "x": "一つで二十五年から五十年ぶんをまとめて測るものでした。"}, {"t": 1125.1, "x": "抜けている試料もあり、細かい"}, {"t": 1127.3166666666666, "x": "形までは追えなかったのです。"}, {"t": 1129.1166666666666, "x": "北と南の年代がそろうと、何ができるのか。"}, {"t": 1132.5333333333333, "x": "たとえば、グリーンランドで気温が上がった"}, {"t": 1135.25, "x": "時期に、南極では何が起きていたのか。"}, {"t": 1137.9833333333333, "x": "それを、同じ目盛りのうえで比べられるようになります。"}, {"t": 1141.4, "x": "ラシャンプ・イベントは、ここで役割を変えます。"}, {"t": 1144.55, "x": "調べられる対象から、ほかのものを"}, {"t": 1147.0, "x": "調べるための、物差しになったのです。"}, {"t": 1149.6333333333334, "x": "ただし、このベリリウム10の山には、"}, {"t": 1152.35, "x": "磁場だけでなく、太陽の活動の上がり下がりも"}, {"t": 1155.8833333333334, "x": "混ざっていると考えられています。"}, {"t": 1157.7833333333333, "x": "太陽の活動が弱い時期にも、宇宙線は増えるからです。"}, {"t": 1161.8666666666666, "x": "その二つを切り分けるには、"}, {"t": 1163.6166666666666, "x": "もう一つ、別の記録が必要でした。"}, {"t": 1166.7166666666667, "x": "宇宙線がつくる原子には、もう一つ、"}, {"t": 1169.5333333333333, "x": "よく知られたものがあります。"}, {"t": 1171.5666666666666, "x": "炭素14█"}, {"t": 1171.5666666666666, "x": "炭素14です。炭素14は、空の高いところで、宇宙線から"}, {"t": 1177.6833333333334, "x": "生まれた中性子が、窒素の原子に当たってできます。"}, {"t": 1181.2166666666667, "x": "できた炭素14は、ほかの炭素と同じように、"}, {"t": 1184.5166666666667, "x": "二酸化炭素として空気の中を漂います。"}, {"t": 1187.5, "x": "植物は、光合成で二酸化炭素を"}, {"t": 1190.2833333333333, "x": "取りこみ、自分の体をつくります。"}, {"t": 1192.9, "x": "木の場合、一年ごとにできる年輪の中に、その年の"}, {"t": 1197.05, "x": "空気の炭素が、そのまま閉じこめられます。"}, {"t": 1199.9, "x": "炭素14は、五千年あまりで"}, {"t": 1202.35, "x": "半分に減っていく性質があります。"}, {"t": 1204.5666666666666, "x": "この半分になるまでの年数を最初に定めたのは、"}, {"t": 1207.7, "x": "化学者のウィラード・リビーでした。"}, {"t": 1209.7666666666667, "x": "生き物が死ぬと、炭素の出入りが止まり、"}, {"t": 1212.3666666666666, "x": "炭素14は減る一方になります。"}, {"t": 1214.9333333333334, "x": "この減りかたを使って年代を"}, {"t": 1216.7333333333333, "x": "測るのが、放射性炭素年代測定です。"}, {"t": 1219.9, "x": "ところが、この方法には、一つの前提があります。"}, {"t": 1223.8, "x": "空気の中の炭素14の濃さが、"}, {"t": 1226.0166666666667, "x": "昔もいまと同じだった、という前提です。"}, {"t": 1229.45, "x": "実際には、そうではありません。"}, {"t": 1231.8666666666666, "x": "磁場が弱まって宇宙線が増えれば、"}, {"t": 1234.1666666666667, "x": "炭素14も多くつくられます。"}, {"t": 1236.4333333333334, "x": "ラシャンプ・イベントのころの空気には、"}, {"t": 1238.55, "x": "炭素14が多く含まれていたはずです。"}, {"t": 1241.4, "x": "その時期のものを、いまの前提のままで"}, {"t": 1244.15, "x": "測ると、年代を読み違えてしまいます。"}, {"t": 1247.1, "x": "4万年前ごろの年代測定が難しいと言われてきた"}, {"t": 1250.6333333333334, "x": "理由の一つが、ここにあります。"}, {"t": 1252.8833333333334, "x": "この穴を埋めたのが、ニュージーランドの木でした。"}, {"t": 1255.9666666666667, "x": "北島の北部、ノースランド地方には、"}, {"t": 1258.9833333333333, "x": "カウリ█"}, {"t": 1259.1333333333334, "x": "カウリと呼ばれる大きな針葉樹が育ちます。"}, {"t": 1262.5166666666667, "x": "この地方の沼の中からは、何万年も前のカウリの"}, {"t": 1266.0333333333333, "x": "幹が、腐らずに掘り出されることがあります。"}, {"t": 1269.0, "x": "沼の泥の中で、空気から遮られていたためです。"}, {"t": 1272.5666666666666, "x": " const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
