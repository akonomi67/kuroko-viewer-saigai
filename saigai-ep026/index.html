<script>
const D={"name": "ep026", "file": "ep026", "dur": 1863.05, "segs": [], "subs": [{"t": 0.0, "x": "南極の分厚い氷の中に、ある年の層があります。"}, {"t": 3.8666666666666667, "x": "そこだけ硫酸がとても多く混ざっています。"}, {"t": 6.566666666666666, "x": "北の果てにはグリーンランドがあります。"}, {"t": 8.883333333333333, "x": "その氷にも、同じ時期の層に同じ跡があります。"}, {"t": 12.45, "x": "年代は西暦1258年から1259年ごろです。"}, {"t": 17.15, "x": "日本でいえば鎌倉時代のなかごろです。"}, {"t": 19.766666666666666, "x": "鎌倉では北条氏が政治を動かしていたころです。"}, {"t": 23.033333333333335, "x": "硫酸のもとは、火山が吹き上げたガスです。"}, {"t": 26.116666666666667, "x": "ガスは空の高いところで細かな粒になります。"}, {"t": 29.066666666666666, "x": "それが雪にまじって、氷の上に降り積もります。"}, {"t": 32.583333333333336, "x": "つまりどこかで火山が噴いたのです。"}, {"t": 34.78333333333333, "x": "それも、とびきり大きな噴火でした。"}, {"t": 37.56666666666667, "x": "ところが肝心の火山が見つかりませんでした。"}, {"t": 40.38333333333333, "x": "どの国の歴史にも、それらしい山が出てきません。"}, {"t": 43.833333333333336, "x": "研究者たちは、これを「なぞの噴火」と呼びました。"}, {"t": 48.2, "x": "火元が分かったのは2013年のことです。"}, {"t": 51.15, "x": "噴火から750年あまりがたっていました。"}, {"t": 54.18333333333333, "x": "場所はインドネシアのロンボク島です。"}, {"t": 56.483333333333334, "x": "バリ島のすぐ東にある島です。"}, {"t": 58.71666666666667, "x": "そこに、もう山は残っていませんでした。"}, {"t": 61.7, "x": "山があった場所には、大きなくぼみがあります。"}, {"t": 64.95, "x": "くぼみの底には湖が広がっています。"}, {"t": 67.56666666666666, "x": "山は自分自身を吹き飛ばして消えていたのです。"}, {"t": 70.56666666666666, "x": "見つからなかったのは、山そのものが無かったからでした。"}, {"t": 74.16666666666667, "x": "この回の主語は大地です。氷の跡から、"}, {"t": 76.95, "x": "消えた山をどうつきとめたのか。"}, {"t": 79.26666666666667, "x": "候補の山はどう外れていったのか。"}, {"t": 81.5, "x": "最後に何が決め手になったのか。順にたどっていきます。"}, {"t": 85.11666666666666, "x": "山の跡にいま何があるのかも見に行きます。"}, {"t": 87.86666666666666, "x": "まずは氷の話からです。話は、"}, {"t": 90.43333333333334, "x": "氷を掘る研究から始まります。"}, {"t": 92.98333333333333, "x": "グリーンランドや南極には厚い氷があります。"}, {"t": 95.96666666666667, "x": "厚さは何千メートルにもなります。"}, {"t": 98.26666666666667, "x": "この氷は、毎年の雪が押し固められたものです。"}, {"t": 101.86666666666666, "x": "上から掘ると、新しい雪から古い雪へさかのぼれます。"}, {"t": 105.8, "x": "木の年輪のように、一年ずつの層があるのです。"}, {"t": 109.23333333333333, "x": "掘り出した氷の柱を、氷床コアと呼びます。"}, {"t": 112.65, "x": "氷床コアは細長い筒の形をしています。"}, {"t": 115.63333333333334, "x": "研究者はそれを少しずつ切り分けて調べます。"}, {"t": 118.63333333333334, "x": "一本の柱に何百年分もの雪が入っています。"}, {"t": 122.13333333333334, "x": "氷の中には、その年の空気が閉じこめられています。"}, {"t": 125.83333333333333, "x": "ちりや灰のかけらも入っています。"}, {"t": 128.03333333333333, "x": "火山が噴いた年には、硫酸が多くまざります。"}, {"t": 131.43333333333334, "x": "研究者は氷の成分をくわしくはかりました。"}, {"t": 134.56666666666666, "x": "硫酸の多い層を探せば、大噴火の年が分かります。"}, {"t": 138.56666666666666, "x": "1980年ごろから、この研究は大きく進みました。"}, {"t": 143.08333333333334, "x": "グリーンランドの氷で、過去の"}, {"t": 145.21666666666667, "x": "噴火が次々に数えられたのです。"}, {"t": 147.41666666666666, "x": "研究者は年ごとの硫酸の量を表にしていきました。"}, {"t": 150.93333333333334, "x": "空にどれほどのガスが出たかも"}, {"t": 152.71666666666667, "x": "見積もれるようになりました。"}, {"t": 154.23333333333332, "x": "そして思わぬことも分かってきました。"}, {"t": 156.45, "x": "記録にない大噴火が、いくつも見つかったのです。"}, {"t": 159.76666666666668, "x": "人の書いた歴史には出てきません。"}, {"t": 161.88333333333333, "x": "けれども氷には跡がはっきり残っています。"}, {"t": 164.71666666666667, "x": "その中で、とりわけ大きな跡がありました。"}, {"t": 167.85, "x": "1258年から1259年の層の硫酸です。"}, {"t": 172.31666666666666, "x": "跡の大きさは並の噴火とは比べものになりませんでした。"}, {"t": 175.91666666666666, "x": "南極の氷にも、同じ時期の跡がありました。"}, {"t": 179.18333333333334, "x": "氷で年を数えると、少しずれが出ます。"}, {"t": 182.28333333333333, "x": "ガスが空を回り、雪になって"}, {"t": 184.56666666666666, "x": "積もるまで時間がかかるからです。"}, {"t": 186.56666666666666, "x": "噴火そのものは1257年か1258年と考えられました。"}, {"t": 191.66666666666666, "x": "ではどれほど大きな噴火だったのでしょう。"}, {"t": 194.11666666666667, "x": "研究者は空に運ばれた硫酸の量を見積もりました。"}, {"t": 197.6, "x": "1883年のクラカタウの噴火のおよそ8倍です。"}, {"t": 201.7, "x": "1815年のタンボラの噴火と比べても2倍ほどです。"}, {"t": 205.56666666666666, "x": "タンボラは、記録に残る中でも大きな噴火です。"}, {"t": 209.08333333333334, "x": "その2倍の硫酸が空に運ばれたことになります。"}, {"t": 212.23333333333332, "x": "2013年の論文は、これを"}, {"t": 214.75, "x": "過去7000年で最大と書きました。"}, {"t": 217.01666666666668, "x": "空の高いところへ出た硫黄の"}, {"t": 218.81666666666666, "x": "量が、最も多いという意味です。"}, {"t": 221.26666666666668, "x": "7000年前といえば日本では縄文時代のころです。"}, {"t": 224.83333333333334, "x": "2016年の論文も、こう書いています。"}, {"t": 228.05, "x": "過去2300年の極地の氷で、最も大きな硫酸の跡だと。"}, {"t": 232.86666666666667, "x": "文字の時代に入ってからの、最大級の噴火です。"}, {"t": 236.4, "x": "それなのに、場所はだれも知りませんでした。"}, {"t": 239.31666666666666, "x": "ただ、南北の氷に跡があることは手がかりになりました。"}, {"t": 243.15, "x": "次はその手がかりから考えます。"}, {"t": 245.38333333333333, "x": "まず火山のガスの広がり方を見ておきます。"}, {"t": 248.15, "x": "大きな噴火では、噴煙が雲より高く上がります。"}, {"t": 251.75, "x": "十数キロより上の、成層圏と呼ばれる空です。"}, {"t": 255.31666666666666, "x": "そこに届いたガスは、雨に洗われません。"}, {"t": 258.3833333333333, "x": "長いあいだ、空にただよい続けます。"}, {"t": 261.2, "x": "そして高い空の風に乗って広がります。"}, {"t": 263.85, "x": "成層圏には雨雲がありません。"}, {"t": 266.1666666666667, "x": "だから粒はすぐには落ちてきません。"}, {"t": 268.3666666666667, "x": "北の国の火山なら、ガスは主に北半球へ行きます。"}, {"t": 272.1666666666667, "x": "南の国の火山なら、主に南半球です。"}, {"t": 275.5833333333333, "x": "ところが赤道の近くでは事情が違います。"}, {"t": 278.4166666666667, "x": "ガスは北へも南へも流れていきます。"}, {"t": 280.96666666666664, "x": "そして両方の極に届くのです。"}, {"t": 283.1666666666667, "x": "1258年の層の硫酸は、南北の両方にありました。"}, {"t": 287.95, "x": "細かな火山灰のかけらも、両方の氷から出ました。"}, {"t": 291.7, "x": "2003年、ある論文が出ました。"}, {"t": 294.48333333333335, "x": "書いたのはイギリスの火山学者です。"}, {"t": 296.78333333333336, "x": "名前をクライブ・オッペンハイマーといいます。"}, {"t": 299.43333333333334, "x": "氷床コアと木の年輪などの記録をまとめた論文です。"}, {"t": 303.01666666666665, "x": "要旨には、こう書かれています。"}, {"t": 305.3666666666667, "x": "灰と硫酸は、両方の半球に運ばれている。"}, {"t": 308.9, "x": "だから、赤道に近い所の噴火と考えられる。"}, {"t": 312.4, "x": "けれどもどの火山かは分かっていない。"}, {"t": 314.6, "x": "論文は噴火の年を1257年とする考えも示しました。"}, {"t": 319.18333333333334, "x": "氷に跡が出る少し前に噴いたはずだという見方です。"}, {"t": 322.6, "x": "のちに南極のロードームの氷でも、年代が出ました。"}, {"t": 326.3333333333333, "x": "1257年、前後1年という年代です。"}, {"t": 330.3333333333333, "x": "こうして、探す範囲がしぼられてきました。"}, {"t": 333.25, "x": "時期は1257年ごろです。"}, {"t": 335.78333333333336, "x": "場所は、赤道の近くのどこかです。"}, {"t": 338.5, "x": "それでも範囲はまだ広すぎました。"}, {"t": 340.73333333333335, "x": "赤道のまわりには、火山の多い地域がたくさんあります。"}, {"t": 344.7, "x": "南アメリカのアンデスの山々があります。"}, {"t": 347.46666666666664, "x": "メキシコや中央アメリカもそうです。"}, {"t": 349.8, "x": "インドネシアも、火山がとても多い国です。"}, {"t": 352.9, "x": "どこも大きな噴火を起こせる山を抱えています。"}, {"t": 355.95, "x": "手がかりは、ほかにもありました。"}, {"t": 358.15, "x": "中世ヨーロッパの年代記です。"}, {"t": 360.21666666666664, "x": "季節外れの寒い夏がありました。"}, {"t": 362.48333333333335, "x": "雨がやまず、ひどい洪水が起きました。"}, {"t": 365.3333333333333, "x": "そして作物がとれませんでした。"}, {"t": 367.45, "x": "そうした記録が、1258年に集まっています。"}, {"t": 371.46666666666664, "x": "木の年輪にも、この年の夏が冷えた跡がありました。"}, {"t": 375.1166666666667, "x": "冷えた夏は北の国々で記録されていました。"}, {"t": 377.96666666666664, "x": "ならば噴火は北の国ではないのかと思うかもしれません。"}, {"t": 381.3833333333333, "x": "けれども赤道の近くの噴火でもガスは北半球に届きます。"}, {"t": 385.28333333333336, "x": "ではどこの火山が噴いたのでしょう。"}, {"t": 387.43333333333334, "x": "研究者たちは、候補の山を調べはじめました。"}, {"t": 390.85, "x": "なぞの噴火の候補には、いくつかの山が挙がりました。"}, {"t": 394.46666666666664, "x": "まず考えられたのは、同じころに噴いた跡がある山です。"}, {"t": 398.3333333333333, "x": "地層の中の炭を調べると、年代が分かります。"}, {"t": 401.8833333333333, "x": "炭素14という物質を使う方法です。"}, {"t": 404.8333333333333, "x": "炭素14は時間とともに少しずつ減っていきます。"}, {"t": 408.1333333333333, "x": "残りの量から、木が死んだ年を逆算するのです。"}, {"t": 411.73333333333335, "x": "火砕流にのまれた木はその場で炭になります。"}, {"t": 414.56666666666666, "x": "その炭の年代は噴火の年に近いのです。"}, {"t": 417.46666666666664, "x": "候補の一つは、メキシコのエルチチョン火山でした。"}, {"t": 420.8333333333333, "x": "ニュージーランドのオカタイナという"}, {"t": 422.5833333333333, "x": "火山の地域もありました。けれども"}, {"t": 424.65, "x": "どちらも年代が合いませんでした。"}, {"t": 426.73333333333335, "x": "炭素14で出た年が、1257年からずれていたのです。"}, {"t": 431.3333333333333, "x": "もう一つ有力な候補がありました。"}, {"t": 433.68333333333334, "x": "南アメリカのエクアドルにあるキロトア火山です。"}, {"t": 436.7, "x": "キロトアの最後の大噴火の年代も、はかられました。"}, {"t": 440.23333333333335, "x": "1147年から1320年のあいだです。"}, {"t": 444.0, "x": "この幅の中に、1257年が入っています。"}, {"t": 447.85, "x": "これは見込みがありそうでした。"}, {"t": 449.73333333333335, "x": "時期だけを見れば条件に合っていたのです。"}, {"t": 452.4, "x": "けれどもほかの数字が合いませんでした。"}, {"t": 454.81666666666666, "x": "一つは噴火の大きさです。キロトアから"}, {"t": 457.6166666666667, "x": "出たものは、18.7立方キロほどでした。"}, {"t": 460.73333333333335, "x": "噴火の大きさを示す数字は6.6です。"}, {"t": 463.71666666666664, "x": "氷の硫酸の量からすると、小さすぎます。"}, {"t": 467.05, "x": "もう一つは、灰の成分でした。"}, {"t": 469.6, "x": "火山の灰は、小さなガラスのかけらでできています。"}, {"t": 473.2, "x": "その成分は、山ごとに少しずつ違います。"}, {"t": 476.53333333333336, "x": "指紋のように、どの山の灰かを見分けられるのです。"}, {"t": 480.1166666666667, "x": "氷のガラスのかけらと、キロトアの灰を比べました。"}, {"t": 483.6166666666667, "x": "するとよく似ているとは言えませんでした。"}, {"t": 486.0, "x": "こうして、候補の山は次々に外れました。"}, {"t": 489.1333333333333, "x": "年代が合っても、大きさが合いません。"}, {"t": 491.93333333333334, "x": "大きさが合っても、成分が合いません。"}, {"t": 494.8, "x": "すべてがそろう山が、どこかにあるはずでした。"}, {"t": 497.95, "x": "けれどもいくら探しても見つかりません。"}, {"t": 500.3333333333333, "x": "これほどの噴火なら、高い山があるはずです。"}, {"t": 503.51666666666665, "x": "ふつうは、そう考えます。ところが"}, {"t": 505.93333333333334, "x": "相手は山の形をしていなかったのです。"}, {"t": 508.6666666666667, "x": "なぞを解いたのは、フランスの研究班でした。"}, {"t": 511.93333333333334, "x": "中心にいたのは、地理学者フランク・ラヴィーニュです。"}, {"t": 515.4166666666666, "x": "インドネシアの研究者も加わっていました。"}, {"t": 518.1166666666667, "x": "オッペンハイマーも、その一人です。"}, {"t": 520.6833333333333, "x": "彼らが目をつけたのは、ロンボク島のくぼみでした。"}, {"t": 523.9333333333333, "x": "探していたのは山ではなく山の抜けた跡だったのです。"}, {"t": 527.3, "x": "ロンボク島は、インドネシアの南に並ぶ島の一つです。"}, {"t": 531.1833333333333, "x": "西にはバリ島があります。東にはスンバワ島があります。"}, {"t": 535.0833333333334, "x": "スンバワ島には、あのタンボラ火山があります。"}, {"t": 538.45, "x": "ロンボク島の北には、リンジャニ山がそびえています。"}, {"t": 541.85, "x": "高さは3726メートルです。"}, {"t": 544.7, "x": "インドネシアで二番目に高い火山です。"}, {"t": 547.2166666666667, "x": "富士山とほとんど同じ高さです。"}, {"t": 549.45, "x": "くぼみのふちに立つと底の湖が見下ろせます。"}, {"t": 552.4166666666666, "x": "このリンジャニ山の西どなりに、大きなくぼみがあります。"}, {"t": 556.0333333333333, "x": "名前はセガラ・アナックです。"}, {"t": 557.8333333333334, "x": "くぼみの幅は、6キロと8.5キロです。"}, {"t": 560.9, "x": "深さは800メートルあります。"}, {"t": 562.9833333333333, "x": "まわりを切り立ったがけが囲んでいます。"}, {"t": 565.4, "x": "くぼみの底の西寄りに、湖があります。"}, {"t": 568.5166666666667, "x": "湖の深さは230メートルです。"}, {"t": 571.2666666666667, "x": "広さは11平方キロあります。"}, {"t": 573.6166666666667, "x": "水の量は、およそ10億立方メートルです。"}, {"t": 576.8666666666667, "x": "湖の東のほとりには、黒っぽい山が立っています。"}, {"t": 580.7666666666667, "x": "円すい形の、小さな火山です。"}, {"t": 583.3666666666667, "x": "名前はバルジャリといいます。"}, {"t": 585.1833333333333, "x": "くぼみの中にできた新しい火山です。"}, {"t": 587.6833333333333, "x": "火山がへこんでできたくぼみを、カルデラと呼びます。"}, {"t": 591.0666666666667, "x": "カルデラは、大きな噴火のあとにできます。"}, {"t": 594.0166666666667, "x": "地下のマグマが、一気に外へ出たとします。"}, {"t": 597.1, "x": "すると山を下から支えるものが無くなります。"}, {"t": 599.9, "x": "山の上の部分は落ちこみ、吹き飛びます。"}, {"t": 602.9166666666666, "x": "あとには、大きな鍋のようなくぼみが残ります。"}, {"t": 606.2666666666667, "x": "ではこのくぼみはいつできたのでしょう。"}, {"t": 608.4333333333333, "x": "それが、はっきりしていませんでした。"}, {"t": 611.05, "x": "世界の火山の資料では、古いものとされていました。"}, {"t": 614.65, "x": "ロンボク島の地質図でも同じでした。"}, {"t": 616.95, "x": "1万年前より新しいか、それより古いか。"}, {"t": 620.4666666666667, "x": "その程度の大まかな扱いでした。"}, {"t": 622.7333333333333, "x": "つまり噴火の年はほとんど分かっていなかったのです。"}, {"t": 625.8833333333333, "x": "ただし別の見方を示した研究者もいました。"}, {"t": 628.8, "x": "インドネシアの研究者たちです。"}, {"t": 630.95, "x": "カルデラをつくる噴火は、1210年から1260年のあいだ。"}, {"t": 635.9166666666666, "x": "そういう見方でした。もしそうなら、"}, {"t": 638.4166666666666, "x": "なぞの噴火の時期と重なります。"}, {"t": 640.6333333333333, "x": "くぼみの大きさからすると、"}, {"t": 642.25, "x": "ここには高い山があったはずです。"}, {"t": 644.6833333333333, "x": "その山には、名前も残っていました。"}, {"t": 647.4166666666666, "x": "地元の人びとの記録に、その名前が出てくるのです。"}, {"t": 651.05, "x": "山の名前は、サマラスといいます。"}, {"t": 653.65, "x": "ロンボク島には、古い記録が伝わっています。"}, {"t": 656.8333333333334, "x": "名前をババッド・ロンボクといいます。"}, {"t": 659.05, "x": "椰子の葉に書かれた文書です。"}, {"t": 660.9833333333333, "x": "細長い葉に文字を刻み、束ねて残してきました。"}, {"t": 664.65, "x": "言葉は、古ジャワ語です。ジャワ島の古い"}, {"t": 667.35, "x": "言葉で書かれているのです。"}, {"t": 669.2, "x": "この文書に、大きな噴火の話が出てきます。"}, {"t": 672.5333333333333, "x": "山が崩れ落ちるような噴火です。"}, {"t": 674.8333333333334, "x": "噴いた山の名前は、サマラス山です。"}, {"t": 677.7333333333333, "x": "この名前はいまの地図には山として載っていません。"}, {"t": 680.8, "x": "リンジャニ山のとなりの山だと書かれています。"}, {"t": 683.4833333333333, "x": "文書によれば灰が降りました。"}, {"t": 685.4166666666666, "x": "火の流れが、村々をのみこみました。"}, {"t": 688.15, "x": "島の王国の都も、このとき失われました。"}, {"t": 691.55, "x": "都の名前は、パマタンです。"}, {"t": 693.9166666666666, "x": "何千人もの人が亡くなったと書かれています。"}, {"t": 696.75, "x": "ただし実際の人数は分かっていません。"}, {"t": 699.3666666666667, "x": "パマタンの場所も、まだ決まっていません。"}, {"t": 702.1, "x": "文書は、時期の手がかりも残しています。"}, {"t": 704.9833333333333, "x": "文書は島の人びとが長く書き写して伝えてきたものです。"}, {"t": 708.6166666666667, "x": "セラパランという時代より前の出来事だというのです。"}, {"t": 711.8, "x": "それは、13世紀の終わりより前にあたります。"}, {"t": 715.2, "x": "文書の上では、噴火は13世紀ということになります。"}, {"t": 719.1, "x": "けれどもこの話だけでは決められません。"}, {"t": 721.55, "x": "言い伝えには、年のずれがつきものだからです。"}, {"t": 724.6833333333333, "x": "研究班も、文書は手がかりの一つとして扱いました。"}, {"t": 728.5666666666667, "x": "決め手にしたのは、別のものです。"}, {"t": 730.9333333333333, "x": "地面の中に残った、噴火そのものの跡でした。"}, {"t": 734.3833333333333, "x": "もし1257年に噴いたなら、"}, {"t": 736.8666666666667, "x": "島には大量の軽石があるはずです。"}, {"t": 739.65, "x": "その中には、焼けた木の炭が残っているかもしれません。"}, {"t": 743.3666666666667, "x": "灰の成分は、極地の氷と一致するはずです。"}, {"t": 746.9333333333333, "x": "研究班は島のあちこちで地層を掘りました。"}, {"t": 749.9333333333333, "x": "くぼみのまわりから、ふもとの村々まで。"}, {"t": 752.7166666666667, "x": "そして海ぞいまで調べていきました。"}, {"t": 754.9833333333333, "x": "ロンボク島の地面を掘ると、白っぽい層が出てきました。"}, {"t": 758.7, "x": "軽石の層です。層は場所によって"}, {"t": 761.0666666666667, "x": "色や粒の大きさが違います。"}, {"t": 763.1166666666667, "x": "粒の大きい層は山の近くに降ったものです。"}, {"t": 766.1333333333333, "x": "軽石は、泡をたくさんふくんだ軽い石です。"}, {"t": 769.3666666666667, "x": "マグマのガスが、噴火のときにふくらんでできます。"}, {"t": 772.7, "x": "研究班はこの層を細かく分けて調べました。"}, {"t": 775.8333333333334, "x": "いちばん下には、空から降った軽石の層がありました。"}, {"t": 779.5833333333334, "x": "その上に、また別の降った層があります。"}, {"t": 782.5833333333334, "x": "さらに火砕流の積もった層もありました。"}, {"t": 785.2, "x": "火砕流は、熱い灰と石とガスのまざった流れです。"}, {"t": 789.15, "x": "地面をはうように、山を流れ下ります。"}, {"t": 792.1, "x": "その火砕流の跡は、とてつもない厚さでした。"}, {"t": 795.5, "x": "くぼみから25キロ離れた場所があります。"}, {"t": 798.2166666666667, "x": "そこでも、厚さ35メートルの層が見られるのです。"}, {"t": 801.9333333333333, "x": "25キロは歩けば6時間ほどの道のりです。"}, {"t": 804.9166666666666, "x": "35メートルは、十階建てのビルを超える高さです。"}, {"t": 808.8666666666667, "x": "それだけの灰と石が、25キロ先まで届きました。"}, {"t": 812.6166666666667, "x": "島の上の火砕流の量も、見積もられました。"}, {"t": 815.9166666666666, "x": "およそ14.5立方キロです。"}, {"t": 818.2166666666667, "x": "1815年のタンボラでは、2.8立方キロほどでした。"}, {"t": 822.7333333333333, "x": "その5倍ほどにあたります。"}, {"t": 824.5166666666667, "x": "軽石は、となりの島にも降っていました。"}, {"t": 827.4333333333333, "x": "西のバリ島にもありました。"}, {"t": 829.2333333333333, "x": "東のスンバワ島にもありました。"}, {"t": 831.4666666666667, "x": "ジャワ島の東にも届いたと考えられています。"}, {"t": 834.4666666666667, "x": "のちの研究では、660キロ先の灰まで見分けられました。"}, {"t": 838.85, "x": "660キロは東京から広島ほどの距離です。"}, {"t": 842.2666666666667, "x": "では噴火はいつだったのでしょう。"}, {"t": 844.2333333333333, "x": "研究班は火砕流にのまれた木の炭を集めました。"}, {"t": 847.5666666666667, "x": "炭素14で年代をはかったのは、22点です。"}, {"t": 851.1833333333333, "x": "そのうち21点は、精度の高い新しい方法ではかりました。"}, {"t": 855.9166666666666, "x": "結果はどれも13世紀なかごろの噴火と合いました。"}, {"t": 859.25, "x": "95パーセントの確からしさで見てみます。"}, {"t": 862.0833333333334, "x": "すると1257年より新しいものは一つもありませんでした。"}, {"t": 866.55, "x": "年代は合いました。これで条件の一つ目がそろいました。"}, {"t": 870.3166666666667, "x": "次は灰のガラスの成分です。"}, {"t": 872.5166666666667, "x": "氷のガラスのかけらを調べると、ケイ素の"}, {"t": 875.4, "x": "成分は69から70パーセントでした。"}, {"t": 878.35, "x": "サマラスの軽石のガラスは、"}, {"t": 880.1833333333333, "x": "下の層で68.78パーセントでした。"}, {"t": 883.5166666666667, "x": "上の層では、69.95パーセントです。"}, {"t": 887.2, "x": "ほかの成分の割合も、ほぼ同じ範囲でした。"}, {"t": 890.5333333333333, "x": "キロトアで合わなかった指紋が、ここでは重なったのです。"}, {"t": 894.2, "x": "南北の氷に眠っていた灰のかけらは"}, {"t": 896.6666666666666, "x": "この島から来ていたのです。"}, {"t": 898.25, "x": "年代が合い、大きさが合い、成分も合いました。"}, {"t": 902.1166666666667, "x": "氷が告げていた火山が、ようやく見つかったのです。"}, {"t": 905.6833333333333, "x": "2013年、研究班は論文を出しました。"}, {"t": 909.3833333333333, "x": "噴火から756年後のことでした。"}, {"t": 912.2166666666667, "x": "アメリカの科学アカデミーの雑誌です。"}, {"t": 914.6166666666667, "x": "題は「1257年のなぞの大噴火の"}, {"t": 918.0333333333333, "x": "火元を明らかにする」です。"}, {"t": 920.4666666666667, "x": "研究班はさらに先へ進みました。"}, {"t": 922.9833333333333, "x": "噴火が何月ごろだったのか、しぼりこもうとしたのです。"}, {"t": 926.6833333333333, "x": "火山灰の行き先は、その日の風で決まります。"}, {"t": 929.9333333333333, "x": "高く上がった噴煙は、風に押されて流れます。"}, {"t": 933.35, "x": "そして風下に灰を降らせます。"}, {"t": 935.4833333333333, "x": "研究班は軽石の厚さを島のあちこちではかりました。"}, {"t": 939.0833333333334, "x": "厚い所と薄い所を、地図に描いていきます。"}, {"t": 942.6166666666667, "x": "すると灰の流れた向きが見えてきます。"}, {"t": 945.05, "x": "厚さが同じ地点を線で結ぶと細長い形になります。"}, {"t": 948.7666666666667, "x": "その細長い形がのびる先が風下です。"}, {"t": 951.6833333333333, "x": "結果ははっきりしていました。"}, {"t": 953.5333333333333, "x": "サマラスの灰は、主に西へ流れていたのです。"}, {"t": 956.95, "x": "西のバリ島の方向に、厚く積もっていました。"}, {"t": 960.25, "x": "このあたりでは、季節で風の向きが入れかわります。"}, {"t": 963.6166666666667, "x": "雨の多い季節と、乾いた季節があるのです。"}, {"t": 966.9333333333333, "x": "乾いた季節には、東寄りの貿易風が吹きます。"}, {"t": 970.6666666666666, "x": "灰が西へ流れたなら、東寄りの風だったはずです。"}, {"t": 974.4666666666667, "x": "つまり乾いた季節の噴火です。"}, {"t": 976.6, "x": "乾いた季節は、おおむね5月から10月です。"}, {"t": 980.0, "x": "研究班は噴火の時期をこう考えました。"}, {"t": 982.8833333333333, "x": "1257年の5月から10月のあいだです。"}, {"t": 986.3833333333333, "x": "この見方は、ほかの記録とも合います。"}, {"t": 989.0, "x": "硫酸が極地に届くまでには時間がかかります。"}, {"t": 992.0333333333333, "x": "空を広がり、雪になって降り、積もるまでです。"}, {"t": 995.75, "x": "1257年の夏から秋に噴いたとします。"}, {"t": 999.0833333333334, "x": "それなら、1258年から1259年の層に"}, {"t": 1003.6333333333333, "x": "跡が出てもおかしくありません。"}, {"t": 1005.3833333333333, "x": "ヨーロッパの冷たい夏の記録も、翌年の1258年です。"}, {"t": 1010.1333333333333, "x": "ただし月までしぼれたのは、灰と風から考えた結果です。"}, {"t": 1014.1833333333333, "x": "だれかがその日の空を見て書いた記録ではありません。"}, {"t": 1017.2833333333333, "x": "ですからここは有力な考えとして受け取りましょう。"}, {"t": 1020.4333333333333, "x": "噴火の年が1257年であることは、確かめられています。"}, {"t": 1025.0833333333333, "x": "炭と、氷と、灰の成分がそろって示しているからです。"}, {"t": 1029.55, "x": "5月から10月という幅は、その上に重ねた見立てです。"}, {"t": 1033.55, "x": "ここまでで、いつ、どこで、には答えが出ました。"}, {"t": 1037.9666666666667, "x": "残るのは、もう一つの問いです。"}, {"t": 1040.4, "x": "どれほどの山が、どれほど吹き飛んだのか。"}, {"t": 1043.3166666666666, "x": "山はもう無いので、直接ははかれません。"}, {"t": 1046.2666666666667, "x": "研究班は残った地形から計算で山を組み立てました。"}, {"t": 1049.9833333333333, "x": "消えた山の高さは、どうやって分かるのでしょう。"}, {"t": 1053.2, "x": "手がかりは、くぼみのまわりの斜面です。"}, {"t": 1056.0, "x": "くぼみの外側には、もとの山のすそ野が残っています。"}, {"t": 1059.7333333333333, "x": "その斜面の傾きを、上へのばしていきます。"}, {"t": 1063.1, "x": "するとどこかで頂上がまじわります。"}, {"t": 1065.4, "x": "研究班はこうして山の形を描き直しました。"}, {"t": 1068.5833333333333, "x": "サマラス山の高さは、4200メートルほどと出ました。"}, {"t": 1072.5666666666666, "x": "前後100メートルほどの幅があります。"}, {"t": 1075.0, "x": "いまのリンジャニ山は3726メートルです。"}, {"t": 1078.45, "x": "それより400メートル以上高い山があったことになります。"}, {"t": 1082.1, "x": "富士山の3776メートルよりも高い山です。"}, {"t": 1086.0166666666667, "x": "島の上に高い峰が二つ並んでいたことになります。"}, {"t": 1089.3166666666666, "x": "タンボラ火山も、噴火の前は同じくらいの高さでした。"}, {"t": 1093.1166666666666, "x": "そう見積もられています。では"}, {"t": 1094.95, "x": "どれだけの量が失われたのでしょう。"}, {"t": 1097.1666666666667, "x": "いまのくぼみと、消えた山の上の部分を合わせます。"}, {"t": 1100.6833333333334, "x": "すると33.8立方キロになりました。"}, {"t": 1103.7, "x": "くぼみのふちより上の山だけでも、15立方キロ前後です。"}, {"t": 1107.8333333333333, "x": "これに、降った軽石や火砕流の量を合わせて考えます。"}, {"t": 1111.8666666666666, "x": "外へ出たマグマは、少なくとも40立方キロでした。"}, {"t": 1115.65, "x": "すき間の無い岩に直した量です。"}, {"t": 1117.8833333333334, "x": "軽石には泡のすき間がたくさんあります。"}, {"t": 1120.5, "x": "そのままはかると量が大きく出てしまいます。"}, {"t": 1123.25, "x": "そこで泡を抜いた岩の量に直して比べるのです。"}, {"t": 1126.35, "x": "こうすると別の噴火とも同じ物差しで比べられます。"}, {"t": 1129.6333333333334, "x": "細かく言うと、40.2立方キロ、前後3立方キロです。"}, {"t": 1134.4833333333333, "x": "40立方キロとは、どれくらいでしょう。"}, {"t": 1137.35, "x": "東京ドームの体積は、124万立方メートルです。"}, {"t": 1141.4833333333333, "x": "東京ドームで数えると、3万2000杯ほどになります。"}, {"t": 1145.2666666666667, "x": "タンボラは、同じ数え方で33立方キロでした。"}, {"t": 1149.1666666666667, "x": "サマラスは、それを上回ります。"}, {"t": 1151.7333333333333, "x": "1815年の噴火は記録に残る中でも大きな噴火です。"}, {"t": 1156.0333333333333, "x": "それよりさらに大きな噴火が13世紀にあったのです。"}, {"t": 1159.6, "x": "噴火の大きさは、マグニチュードでもあらわします。"}, {"t": 1162.9666666666667, "x": "サマラスの噴火は、マグニチュード7でした。"}, {"t": 1166.1166666666666, "x": "しかもこれは少なく見積もった値です。"}, {"t": 1168.65, "x": "過去1万年の噴火で、最も大きいものの一つです。"}, {"t": 1172.65, "x": "ここで一つ、注意をしておきます。"}, {"t": 1175.2666666666667, "x": "4200メートルは、残った斜面から計算した姿です。"}, {"t": 1179.6, "x": "だれかが山をはかった数字ではありません。"}, {"t": 1182.2, "x": "40立方キロも、地層の厚さから組み立てた見積もりです。"}, {"t": 1186.2166666666667, "x": "数字には幅があります。研究に"}, {"t": 1188.2333333333333, "x": "よって少しずつ値が変わることもあります。"}, {"t": 1191.1333333333334, "x": "それでもどの見積もりでも桁はずれの噴火です。"}, {"t": 1194.0, "x": "4000メートルを超える山が、空へ吹き上がったのです。"}, {"t": 1197.7833333333333, "x": "そのあとに残ったのが、あの大きなくぼみでした。"}, {"t": 1201.05, "x": "くぼみの中は噴火のあとも変わり続けました。"}, {"t": 1203.8833333333334, "x": "リンジャニ山の斜面の一部が"}, {"t": 1205.65, "x": "崩れてくぼみに流れこみました。"}, {"t": 1207.55, "x": "その量は2.5立方キロほどです。"}, {"t": 1209.9666666666667, "x": "くぼみの中では新しい噴火も起きました。"}, {"t": 1212.6166666666666, "x": "その溶岩や灰は3.7立方キロほどと見積もられています。"}, {"t": 1216.6166666666666, "x": "いまの湖と小さな火山はそうした変化のあとの景色です。"}, {"t": 1220.5166666666667, "x": "噴火は、どう進んだのでしょう。"}, {"t": 1222.8666666666666, "x": "地層の重なりから、噴火の順番が読み取れます。"}, {"t": 1226.3333333333333, "x": "2016年、さらにくわしい論文が出ました。"}, {"t": 1230.0, "x": "書いたのはフランスの火山学者たちです。"}, {"t": 1232.5333333333333, "x": "中心は、セリーヌ・ヴィダルという研究者でした。"}, {"t": 1235.9166666666667, "x": "噴火は、四つの段階が切れ目なく続いたものでした。"}, {"t": 1239.7, "x": "全体の長さは、数十時間です。"}, {"t": 1242.5, "x": "数十時間といえば一日か二日ほどです。"}, {"t": 1245.3, "x": "そのあいだに山ひとつ分の岩が外へ出たのです。"}, {"t": 1248.3833333333334, "x": "外へ出たマグマの重さも計算されています。"}, {"t": 1251.2833333333333, "x": "およそ1000億トンです。"}, {"t": 1252.9, "x": "最初の段階で、軽石が空高く吹き上がりました。"}, {"t": 1256.7666666666667, "x": "2013年の論文では、およそ4時間続いたと"}, {"t": 1260.4333333333334, "x": "計算されています。噴煙の高さは、"}, {"t": 1263.0, "x": "最高で43キロと見積もられました。"}, {"t": 1265.7333333333333, "x": "34キロから52キロという幅があります。"}, {"t": 1268.9333333333334, "x": "旅客機が飛ぶのは、高さ10キロほどです。"}, {"t": 1271.9333333333334, "x": "その4倍を超える高さまで噴煙が上がりました。"}, {"t": 1275.1166666666666, "x": "灰の広がりを示す数字は4万9000平方キロを超えます。"}, {"t": 1279.3, "x": "九州の面積よりも広い範囲です。"}, {"t": 1281.8333333333333, "x": "1秒に噴き出たマグマは、4億キロほどでした。"}, {"t": 1285.2333333333333, "x": "重さで言うと、毎秒40万トンです。"}, {"t": 1288.45, "x": "それが4時間ほど続いたことになります。"}, {"t": 1290.9666666666667, "x": "そのあとの段階で、また軽石が吹き上がりました。"}, {"t": 1294.5, "x": "このときの噴煙は、23キロから24キロでした。"}, {"t": 1298.4, "x": "この段階は、19時間ほど続いたとされています。"}, {"t": 1302.0833333333333, "x": "そして熱い火砕流が四方へ流れ下りました。"}, {"t": 1305.0666666666666,   const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
