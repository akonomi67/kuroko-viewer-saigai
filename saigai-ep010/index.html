"t": 1957.4166666666667, "i": 673}, {"t": 1960.1666666666667, "i": 674}, {"t": 1963.3833333333334, "i": 675}, {"t": 1966.05, "i": 676}, {"t": 1968.7, "i": 677}, {"t": 1971.7833333333333, "i": 677}], "subs": [{"t": 0.0, "x": "地球の空には、盾があります。"}, {"t": 2.566666666666667, "x": "地上からおよそ十キロメートルより"}, {"t": 4.7, "x": "上に広がる、オゾンの層です。"}, {"t": 7.05, "x": "地上と同じ気圧まで押し縮めると、厚さは"}, {"t": 10.2, "x": "およそ三ミリメートルしかありません。"}, {"t": 12.366666666666667, "x": "それでも、この薄い層が、太陽から来る"}, {"t": 15.65, "x": "有害な紫外線の大部分を止めています。"}, {"t": 18.266666666666666, "x": "この盾が、ある日、宇宙から届いた光に"}, {"t": 21.733333333333334, "x": "よって、一気に削られたのではないか。"}, {"t": 24.383333333333333, "x": "そう考える研究者たちがいます。"}, {"t": 26.716666666666665, "x": "時代は、いまからおよそ4億4500万年前。"}, {"t": 29.083333333333332, "x": "4億4500万年前█"}, {"t": 31.25, "x": "地質の時代でいえば、オルドビス紀の終わりです。"}, {"t": 32.85, "x": "オルドビス紀█"}, {"t": 34.93333333333333, "x": "光のもとは、天の川銀河のどこかで"}, {"t": 37.733333333333334, "x": "起きた爆発だったとされます。"}, {"t": 39.516666666666666, "x": "こうした閃光が続くのは、長いものでも数分ほどです。"}, {"t": 43.31666666666667, "x": "ところが、その光が地球の大気に残した傷は、"}, {"t": 46.8, "x": "十年ほど消えなかったと計算されています。"}, {"t": 49.81666666666667, "x": "この考え方は、ガンマ線バースト仮説と呼ばれています。"}, {"t": 51.03333333333333, "x": "ガンマ線バースト仮説█"}, {"t": 54.333333333333336, "x": "最初に言っておきます。この説は、証明されていません。"}, {"t": 58.5, "x": "その時代の岩の中に、この光が来たことを直接示す"}, {"t": 62.38333333333333, "x": "証拠は、いまのところ見つかっていません。"}, {"t": 65.15, "x": "同じ時代については、火山や氷河など、"}, {"t": 68.08333333333333, "x": "地球の中に原因を求める説があります。"}, {"t": 71.11666666666666, "x": "そちらのほうが、ずっと多くの支持を集めています。"}, {"t": 74.55, "x": "それでも、この説は2004年からの二十年あまりの"}, {"t": 78.23333333333333, "x": "間に、何本もの論文で検討されてきました。"}, {"t": 81.63333333333334, "x": "理由は、計算の中身が具体的だからです。"}, {"t": 84.93333333333334, "x": "どれだけの光が、空のどの高さで、"}, {"t": 87.58333333333333, "x": "何を壊し、何年で元に戻るのか。"}, {"t": 90.81666666666666, "x": "数字で追うことができます。"}, {"t": 92.56666666666666, "x": "この回は、その数字をたどります。"}, {"t": 95.11666666666666, "x": "主語は、地球の空です。宇宙で一瞬起きたことが、地球の"}, {"t": 99.83333333333333, "x": "大気を、どう変えうるのか。"}, {"t": 101.76666666666667, "x": "そして、それを確かめることが、なぜこれほど難しいのか。"}, {"t": 106.08333333333333, "x": "この光が見つかったいきさつは、天文学とは"}, {"t": 109.25, "x": "関係のないところから始まります。"}, {"t": 111.35, "x": "1963年█"}, {"t": 111.35, "x": "1963年、アメリカは宇宙に"}, {"t": 114.6, "x": "監視用の衛星を上げはじめました。"}, {"t": 116.81666666666666, "x": "ヴェラと呼ばれる衛星です。"}, {"t": 118.58333333333333, "x": "目的は、大気圏や宇宙空間で核実験が"}, {"t": 122.03333333333333, "x": "行われていないかを見張ることでした。"}, {"t": 124.23333333333333, "x": "核爆発は、ガンマ線と呼ばれる非常に強い光を出します。"}, {"t": 128.53333333333333, "x": "ヴェラは、その光を拾うための検出器を積んでいました。"}, {"t": 132.43333333333334, "x": "1967年█"}, {"t": 132.43333333333334, "x": "1967年7月2日。ヴェラの3号と"}, {"t": 135.88333333333333, "x": "4号が、ガンマ線の閃光をとらえました。"}, {"t": 139.75, "x": "ところが、その形は、核爆発で知られている"}, {"t": 143.3, "x": "光の出方とは一致しませんでした。"}, {"t": 145.51666666666668, "x": "担当していたのは、アメリカの"}, {"t": 147.66666666666666, "x": "ロスアラモス研究所の研究班です。"}, {"t": 150.23333333333332, "x": "彼らはその後も記録を積み重ねました。"}, {"t": 152.8, "x": "複数の衛星が、離れた位置で同じ閃光をとらえると、"}, {"t": 156.71666666666667, "x": "届いた時刻のわずかな差から方向が分かります。"}, {"t": 160.01666666666668, "x": "そうして方向を割り出していくと、光は地球からも"}, {"t": 163.55, "x": "太陽からも来ていないことが分かりました。"}, {"t": 165.91666666666666, "x": "結果が論文として発表されたのは、1973年のことです。"}, {"t": 169.25, "x": "1973年█"}, {"t": 171.53333333333333, "x": "表題は「宇宙起源のガンマ線バーストの観測」。"}, {"t": 175.2, "x": "1969年7月から1972年7月までの"}, {"t": 179.81666666666666, "x": "三年間に、十六回の閃光が記録されていました。"}, {"t": 183.48333333333332, "x": "続いた時間は、一秒の十分の一に"}, {"t": 186.38333333333333, "x": "満たないものから、三十秒ほどのものまで。"}, {"t": 189.2, "x": "これが、ガンマ線バーストという現象が"}, {"t": 191.93333333333334, "x": "世に知られた最初の報告です。"}, {"t": 193.86666666666667, "x": "その後、観測は大きく進みました。"}, {"t": 196.66666666666666, "x": "いまでは、こうした閃光が、平均すると"}, {"t": 199.93333333333334, "x": "一日に一回以上とらえられています。"}, {"t": 202.31666666666666, "x": "続く時間によって、大きく二つに分けられます。"}, {"t": 205.76666666666668, "x": "二秒より長く続くものと、二秒より短いものです。"}, {"t": 209.55, "x": "長いほうは、重い星がその一生の終わりに"}, {"t": 212.66666666666666, "x": "崩れるときに起こると考えられています。"}, {"t": 215.05, "x": "短いほうは、中性子星のような重い天体どうしが"}, {"t": 218.71666666666667, "x": "合体するときに起こると考えられています。"}, {"t": 221.28333333333333, "x": "その光が向かう先にたまたま地球があれば、"}, {"t": 224.11666666666667, "x": "地球はその光を浴びることになります。"}, {"t": 226.81666666666666, "x": "長いほうの平均は三十秒ほど、"}, {"t": 229.2, "x": "短いほうの平均は〇・三秒ほどとされます。"}, {"t": 232.66666666666666, "x": "その明るさについて、アメリカ航空宇宙局、"}, {"t": 236.01666666666668, "x": "NASAの解説は、こう書いています。"}, {"t": 238.81666666666666, "x": "ふつうの超新星の、数百倍の明るさ。"}, {"t": 242.06666666666666, "x": "太陽と比べれば、百京倍ほどに当たる、と。"}, {"t": 246.01666666666668, "x": "ただし、これまでに観測されたものは、"}, {"t": 248.81666666666666, "x": "どれも遠い銀河で起きています。"}, {"t": 251.05, "x": "遠いからこそ、地球の空は、"}, {"t": 253.33333333333334, "x": "毎日それを浴びても何も起きていません。"}, {"t": 256.1166666666667, "x": "では、もし同じことが、私たちの天の川銀河の"}, {"t": 260.01666666666665, "x": "中で、比較的近い場所で起きていたら。"}, {"t": 262.75, "x": "その問いを、地球の大気の側から具体的に"}, {"t": 265.8, "x": "計算したのが、この回で追う一連の研究です。"}, {"t": 269.26666666666665, "x": "きっかけが核実験の見張りだったという点は、"}, {"t": 272.06666666666666, "x": "この回の終わりにもう一度出てきます。"}, {"t": 274.6, "x": "発生源そのものの話は、ここまでにします。"}, {"t": 277.93333333333334, "x": "この回で見ていくのは、光が届いた先、"}, {"t": 280.73333333333335, "x": "地球の空で何が起きるかです。"}, {"t": 283.1166666666667, "x": "まず、守られる側の盾を見ておきます。"}, {"t": 286.23333333333335, "x": "オゾンは、酸素の原子が三つつながった分子です。"}, {"t": 289.8, "x": "私たちが吸っている酸素は、"}, {"t": 291.65, "x": "原子が二つつながった分子です。"}, {"t": 294.0833333333333, "x": "空の高いところで、この二つの酸素に強い"}, {"t": 297.15, "x": "紫外線が当たると、分子がばらばらになります。"}, {"t": 300.28333333333336, "x": "ばらばらになった酸素の原子が、別の酸素の"}, {"t": 303.4166666666667, "x": "分子とくっつくと、オゾンになります。"}, {"t": 305.9, "x": "このしくみを説明したのは、イギリスの物理学者"}, {"t": 309.48333333333335, "x": "シドニー・チャップマンで、1930年のことです。"}, {"t": 311.6333333333333, "x": "1930年█"}, {"t": 313.43333333333334, "x": "オゾンの層そのものが見つかったのは、"}, {"t": 316.15, "x": "それより少し前の1913年です。"}, {"t": 318.7, "x": "1913年█"}, {"t": 320.31666666666666, "x": "フランスの物理学者、シャルル・ファブリと"}, {"t": 323.1166666666667, "x": "アンリ・ビュイッソンが、太陽の光を詳しく調べました。"}, {"t": 326.76666666666665, "x": "すると、地上に届く太陽の光には、ある波長より"}, {"t": 330.7, "x": "短い紫外線がほとんど含まれていませんでした。"}, {"t": 333.65, "x": "どこかで、何かが吸いこんでいる。"}, {"t": 336.1, "x": "その吸いこみ方の形が、オゾンの性質と一致しました。"}, {"t": 340.1666666666667, "x": "その後、イギリスの気象学者ゴードン・ドブソンが、"}, {"t": 343.45, "x": "地上からオゾンの量を測る装置を作ります。"}, {"t": 346.65, "x": "1928年から1958年にかけて、ドブソンは"}, {"t": 351.73333333333335, "x": "世界各地に観測地点の網を広げました。"}, {"t": 354.55, "x": "オゾンの量を表す単位には、"}, {"t": 356.48333333333335, "x": "いまも彼の名前が付いています。"}, {"t": 358.76666666666665, "x": "ドブソン単位█"}, {"t": 358.76666666666665, "x": "ドブソン単位です。零度・一気圧のもとで、純粋な"}, {"t": 363.98333333333335, "x": "オゾンだけを集めて層にしたとします。"}, {"t": 366.3, "x": "その厚さが〇・〇一ミリメートルになる"}, {"t": 368.96666666666664, "x": "量が、一ドブソン単位です。"}, {"t": 371.21666666666664, "x": "地球の上空のオゾンは、平均しておよそ三百ドブソン単位。"}, {"t": 375.7, "x": "押し縮めれば、厚さおよそ三ミリメートルの層になります。"}, {"t": 379.7, "x": "同じようにして、地面から宇宙までの空気を全部"}, {"t": 383.03333333333336, "x": "押し縮めると、厚さはおよそ八キロメートルになります。"}, {"t": 386.65, "x": "八キロメートルの空気の中の、三ミリメートル。"}, {"t": 389.93333333333334, "x": "それが、空の盾の厚さです。"}, {"t": 392.43333333333334, "x": "オゾンがとくに多く集まっているのは、"}, {"t": 394.6166666666667, "x": "高さおよそ三十キロメートルから"}, {"t": 397.0, "x": "四十キロメートルのあたりです。"}, {"t": 398.85, "x": "この層は、波長がおよそ二百から"}, {"t": 401.28333333333336, "x": "三百十五ナノメートルの紫外線を吸いこみます。"}, {"t": 404.46666666666664, "x": "その割合は、九十七パーセントから"}, {"t": 407.35, "x": "九十九パーセントとされています。"}, {"t": 409.55, "x": "なかでも、二百九十から三百十五ナノメートルほどの"}, {"t": 413.3833333333333, "x": "紫外線は、UVB、紫外線Bと呼ばれます。"}, {"t": 414.68333333333334, "x": "UVB█"}, {"t": 417.3333333333333, "x": "この光は、生き物の遺伝子の"}, {"t": 419.55, "x": "本体であるDNAに、よく吸いこまれます。"}, {"t": 422.71666666666664, "x": "吸いこまれると、DNAが傷つきます。"}, {"t": 425.8, "x": "つまり空の盾は、地上や海の表面にいる"}, {"t": 428.95, "x": "生き物にとって、欠かすことのできない覆いです。"}, {"t": 432.1333333333333, "x": "では、4億4500万年前の空にも、"}, {"t": 435.68333333333334, "x": "この盾はあったのでしょうか。"}, {"t": 437.6333333333333, "x": "この仮説を最初にまとめた2004年の"}, {"t": 440.0833333333333, "x": "論文は、その点をこう扱っています。"}, {"t": 442.95, "x": "オルドビス紀の大気の酸素の量は、"}, {"t": 445.1333333333333, "x": "いまと大きくは違わなかった。"}, {"t": 447.35, "x": "したがって、オゾンの盾もすでにあった。"}, {"t": 450.23333333333335, "x": "盾があったからこそ、それが削られれば、"}, {"t": 453.0833333333333, "x": "影響が出るという考え方です。"}, {"t": 455.6166666666667, "x": "なお、盾は変化しないものではありません。"}, {"t": 458.9166666666667, "x": "オゾンは、つくられる一方で、壊されてもいます。"}, {"t": 462.7, "x": "壊す役を担うものの一つが、窒素と"}, {"t": 465.98333333333335, "x": "酸素がくっついた物質、窒素酸化物です。"}, {"t": 468.23333333333335, "x": "窒素酸化物█"}, {"t": 469.8833333333333, "x": "ふだんの空では、つくられる量と壊される量が"}, {"t": 472.95, "x": "釣り合っていて、層の厚さが保たれています。"}, {"t": 475.96666666666664, "x": "この釣り合いに、外から大量の"}, {"t": 478.21666666666664, "x": "窒素酸化物が持ちこまれたら、どうなるか。"}, {"t": 481.26666666666665, "x": "次の章からは、それを順番に見ていきます。"}, {"t": 484.51666666666665, "x": "仮説の出発点は、2004年に発表された論文です。"}, {"t": 486.0833333333333, "x": "2004年█"}, {"t": 489.21666666666664, "x": "アメリカのカンザス大学とNASAの研究者に"}, {"t": 491.8, "x": "よる共著で、筆頭はエイドリアン・メロットです。"}, {"t": 494.9166666666667, "x": "表題は、「ガンマ線バーストが、オルドビス紀末の"}, {"t": 498.55, "x": "大量絶滅の引き金になったのか」。"}, {"t": 500.75, "x": "問いの形で書かれています。"}, {"t": 502.55, "x": "論文はまず、どのくらいの距離で"}, {"t": 505.03333333333336, "x": "起きれば危ないのかを見積もりました。"}, {"t": 507.1333333333333, "x": "答えは、地球に向いた典型的な"}, {"t": 509.68333333333334, "x": "バーストなら、およそ三キロパーセク以内。"}, {"t": 512.5, "x": "光の速さで一万年ほどかかる距離です。"}, {"t": 515.3333333333334, "x": "さらに、過去十億年の間でいちばん近かったと見込まれる"}, {"t": 519.8166666666667, "x": "バーストの距離を、およそ2キロパーセクとしました。"}, {"t": 521.3333333333334, "x": "2キロパーセク█"}, {"t": 523.3833333333333, "x": "光年に直すと、六千五百光年ほどです。"}, {"t": 526.7833333333333, "x": "天の川銀河の広さからすれば、すぐ近所と言える距離です。"}, {"t": 530.9833333333333, "x": "その距離で起きた場合、地球に届く光の強さは、"}, {"t": 534.7333333333333, "x": "一平方メートルあたりおよそ十キロワット。"}, {"t": 537.7166666666667, "x": "地球が太陽から受ける光の、およそ三倍に"}, {"t": 540.8333333333334, "x": "当たります。続くのは、十秒ほどです。"}, {"t": 543.8, "x": "数字だけ見ると、太陽の三倍の光が十秒間"}, {"t": 547.5, "x": "当たるだけで、大したことはないようにも見えます。"}, {"t": 550.6, "x": "違いは、光の種類にあります。"}, {"t": 553.0666666666667, "x": "太陽の光の主役は、目に見える光です。"}, {"t": 556.3333333333334, "x": "一方、ガンマ線は、ひとつひとつが"}, {"t": 559.3, "x": "桁違いに大きなエネルギーを持っています。"}, {"t": 561.8, "x": "そして、空気の中を遠くま "x": "その冷え込みを始めた、外からの一押し。"}, {"t": 1283.9, "x": "そこに、二酸化窒素による日射の減少が"}, {"t": 1287.0166666666667, "x": "当てはまるのではないか、という考え方です。"}, {"t": 1290.0666666666666, "x": "もし正しければ、一回の出来事で、紫外線と"}, {"t": 1293.6833333333334, "x": "寒さという二つの打撃が続けて来たことになります。"}, {"t": 1296.75, "x": "メロットらは、これを一撃目と"}, {"t": 1298.9666666666667, "x": "二撃目の組み合わせとして描きました。"}, {"t": 1301.3833333333334, "x": "二つ目の理由は、被害の出方の形です。"}, {"t": 1304.5333333333333, "x": "2004年の論文は、紫外線が原因なら、"}, {"t": 1307.8666666666666, "x": "被害の出方に偏りが出るはずだと予想しました。"}, {"t": 1311.15, "x": "海の浅いところや、水面近くを漂って暮らすものほど、"}, {"t": 1315.1166666666666, "x": "被害が大きく出る、という偏りです。"}, {"t": 1318.1333333333334, "x": "紫外線は、水の深いところまでは届かないからです。"}, {"t": 1321.9166666666667, "x": "そして、そうした形が、この時代の"}, {"t": 1324.7666666666667, "x": "記録の一部に見られると述べています。"}, {"t": 1326.95, "x": "ただし論文自身も、この点の"}, {"t": 1329.3166666666666, "x": "判定はまだ決まっていないと書いています。"}, {"t": 1331.7, "x": "差がはっきりしないとする研究もあるからです。"}, {"t": 1334.6833333333334, "x": "三つ目の理由は、緯度です。"}, {"t": 1336.9166666666667, "x": "2009年█"}, {"t": 1336.9166666666667, "x": "2009年、メロットと、共同研究者の"}, {"t": 1340.5666666666666, "x": "ブライアン・トーマスは、別の論文を出しています。"}, {"t": 1343.75, "x": "当時の地球で、どの緯度で絶滅が多かったかという"}, {"t": 1347.2333333333333, "x": "記録を、大気の計算と突き合わせたものです。"}, {"t": 1350.4, "x": "結果は、南極の上空に光が当たった場合の"}, {"t": 1353.7666666666667, "x": "計算の形と、矛盾しないというものでした。"}, {"t": 1356.9, "x": "その計算では、光の影響は南半球に強く出て、"}, {"t": 1360.9166666666667, "x": "赤道より北の陸地の周りは、逃げ場になりえます。"}, {"t": 1364.65, "x": "先に見たとおり、空気は赤道を"}, {"t": 1367.1333333333334, "x": "なかなかまたがないからです。"}, {"t": 1368.75, "x": "こうして、三つの手がかりが並べられました。"}, {"t": 1371.7333333333333, "x": "ここで、確率の話も見ておきます。"}, {"t": 1374.5833333333333, "x": "2004年の論文は、地球を危険にさらす"}, {"t": 1377.8, "x": "ほど近いバーストの回数を見積もっています。"}, {"t": 1380.5, "x": "平均して、十億年に二回以上です。"}, {"t": 1383.5333333333333, "x": "2014年には、イスラエルとスペインの"}, {"t": 1386.3333333333333, "x": "研究者が、より新しい観測をもとに計算し直しています。"}, {"t": 1390.7666666666667, "x": "過去五億年の間に、生き物に大きな打撃を与えるほどの"}, {"t": 1394.7, "x": "バーストが、地球の近くで起きていた確率。"}, {"t": 1397.7, "x": "それは、およそ五割とされました。"}, {"t": 1400.2166666666667, "x": "つまり、起きていても不思議ではありません。"}, {"t": 1403.05, "x": "ただし、起きていても不思議ではない、ということと、"}, {"t": 1406.6833333333334, "x": "実際に起きた、ということ。"}, {"t": 1409.0833333333333, "x": "その間には、大きな距離があります。"}, {"t": 1411.8833333333334, "x": "その距離を埋めるのが、証拠です。"}, {"t": 1414.3666666666666, "x": "次の章では、その証拠がなぜ見つからないのかを見ます。"}, {"t": 1418.25, "x": "ガンマ線バーストの仮説には、大きな弱点があります。"}, {"t": 1422.0833333333333, "x": "痕跡が残りにくいことです。"}, {"t": 1424.05, "x": "隕石がぶつかれば、地層にクレーターや"}, {"t": 1426.8333333333333, "x": "特殊な元素が残ります。火山が噴けば、溶岩や火山灰、"}, {"t": 1431.0666666666666, "x": "水銀のような元素の偏りが残ります。"}, {"t": 1434.0666666666666, "x": "ところがガンマ線は、空の中で吸いこまれて終わります。"}, {"t": 1437.9, "x": "2004年の論文は、こう書いています。"}, {"t": 1440.8666666666666, "x": "ガンマ線のほとんどは、原子の芯、つまり原子核を"}, {"t": 1444.75, "x": "変えるほどのエネルギーは持っていない。"}, {"t": 1446.8166666666666, "x": "つまり、地層の中に、特別な種類の"}, {"t": 1449.9833333333333, "x": "原子を置いていかないということです。"}, {"t": 1452.0333333333333, "x": "比べると分かりやすい例があります。"}, {"t": 1454.3166666666666, "x": "近くで起きた超新星、つまり星の爆発です。"}, {"t": 1458.0, "x": "超新星は、鉄の仲間である鉄60という、"}, {"t": 1460.4666666666667, "x": "鉄60█"}, {"t": 1462.15, "x": "放射線を出す原子をまき散らします。"}, {"t": 1465.4, "x": "鉄60は、二百六十万年ほどで半分に減ります。"}, {"t": 1469.4166666666667, "x": "2016年、世界の海の底の岩や堆積物から、"}, {"t": 1473.5333333333333, "x": "この鉄60が見つかったと報告されました。"}, {"t": 1476.6166666666666, "x": "宇宙から降り積もった跡は、"}, {"t": 1478.35, "x": "二つの時期に分かれていました。"}, {"t": 1480.45, "x": "およそ150万年前から320万年前と、"}, {"t": 1484.0333333333333, "x": "650万年前から870万年前です。"}, {"t": 1487.9666666666667, "x": "百パーセク以内で、星の爆発が"}, {"t": 1490.5666666666666, "x": "何度も起きていたことを示す証拠です。"}, {"t": 1492.9166666666667, "x": "つまり、空から来たものが海の底に"}, {"t": 1495.5666666666666, "x": "記録される場合もある、ということです。"}, {"t": 1498.2166666666667, "x": "ガンマ線には、それがありません。"}, {"t": 1500.6833333333334, "x": "では、もっと新しい時代なら、"}, {"t": 1503.05, "x": "空の出来事は記録されるのか。"}, {"t": 1505.3333333333333, "x": "その答えの一つが、日本から出ています。"}, {"t": 1508.3666666666666, "x": "2012年█"}, {"t": 1508.3666666666666, "x": "2012年、名古屋大学の三宅芙沙さんらが、"}, {"t": 1 const a=document.getElementById('a'), v=document.getElementById('v');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
const src=i=>'f/'+String(i).padStart(4,'0')+'.jpg';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　カット'+D.n_cuts+'　字幕'+D.subs.length+'</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function seg(t){let lo=0,hi=D.segs.length-1,r=0;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.segs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-1;
function preload(i){for(let k=1;k<=4;k++){const s=D.segs[i+k]; if(s)new Image().src=src(s.i)}}
function paint(t){
  const i=seg(t);
  if(i!==cur){cur=i; v.src=src(D.segs[i].i);
    bdg.textContent='カット '+(i+1)+' / '+D.segs.length;
    mark('cuts',i); preload(i); }
  mark('subs',subIdx(t));
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b>'+fmt(s.t)+'</b><span></span>';
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
D.segs.forEach(s=>{const f=document.createElement('figure');
  f.innerHTML='<img loading="lazy" src="'+src(s.i)+'"><em>'+fmt(s.t)+'</em>';
  f.onclick=()=>go(s.t); document.getElementById('cuts').appendChild(f)});
const mk=document.getElementById('mk');
D.segs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,D.dur-0.05); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>go(D.segs[Math.max(0,seg(a.currentTime)-1)].t);
document.getElementById('nx').onclick=()=>go(D.segs[Math.min(D.segs.length-1,seg(a.currentTime)+1)].t);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('subs').hidden=b.dataset.p!=='subs';
  document.getElementById('cuts').hidden=b.dataset.p!=='cuts'});
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
