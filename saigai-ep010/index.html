<script>
const D={"name": "ep010", "file": "ep010", "dur": 1973.36665625, "segs": [], "subs": [{"t": 0.0, "x": "地球の空には、盾があります。"}, {"t": 2.566666666666667, "x": "地上からおよそ十キロメートルより"}, {"t": 4.7, "x": "上に広がる、オゾンの層です。"}, {"t": 7.05, "x": "地上と同じ気圧まで押し縮めると、厚さは"}, {"t": 10.2, "x": "およそ三ミリメートルしかありません。"}, {"t": 12.366666666666667, "x": "それでも、この薄い層が、太陽から来る"}, {"t": 15.65, "x": "有害な紫外線の大部分を止めています。"}, {"t": 18.266666666666666, "x": "この盾が、ある日、宇宙から届いた光に"}, {"t": 21.733333333333334, "x": "よって、一気に削られたのではないか。"}, {"t": 24.383333333333333, "x": "そう考える研究者たちがいます。"}, {"t": 26.716666666666665, "x": "時代は、いまからおよそ4億4500万年前。"}, {"t": 29.083333333333332, "x": "4億4500万年前█"}, {"t": 31.25, "x": "地質の時代でいえば、オルドビス紀の終わりです。"}, {"t": 32.85, "x": "オルドビス紀█"}, {"t": 34.93333333333333, "x": "光のもとは、天の川銀河のどこかで"}, {"t": 37.733333333333334, "x": "起きた爆発だったとされます。"}, {"t": 39.516666666666666, "x": "こうした閃光が続くのは、長いものでも数分ほどです。"}, {"t": 43.31666666666667, "x": "ところが、その光が地球の大気に残した傷は、"}, {"t": 46.8, "x": "十年ほど消えなかったと計算されています。"}, {"t": 49.81666666666667, "x": "この考え方は、ガンマ線バースト仮説と呼ばれています。"}, {"t": 51.03333333333333, "x": "ガンマ線バースト仮説█"}, {"t": 54.333333333333336, "x": "最初に言っておきます。この説は、証明されていません。"}, {"t": 58.5, "x": "その時代の岩の中に、この光が来たことを直接示す"}, {"t": 62.4, "x": "証拠は、いまのところ見つかっていません。"}, {"t": 65.16666666666667, "x": "同じ時代については、火山や氷河など、"}, {"t": 68.1, "x": "地球の中に原因を求める説があります。"}, {"t": 71.13333333333334, "x": "そちらのほうが、ずっと多くの支持を集めています。"}, {"t": 74.56666666666666, "x": "それでも、この説は2004年からの二十年あまりの"}, {"t": 78.25, "x": "間に、何本もの論文で検討されてきました。"}, {"t": 81.65, "x": "理由は、計算の中身が具体的だからです。"}, {"t": 84.95, "x": "どれだけの光が、空のどの高さで、"}, {"t": 87.6, "x": "何を壊し、何年で元に戻るのか。"}, {"t": 90.83333333333333, "x": "数字で追うことができます。"}, {"t": 92.58333333333333, "x": "この回は、その数字をたどります。"}, {"t": 95.13333333333334, "x": "主語は、地球の空です。宇宙で一瞬起きたことが、地球の"}, {"t": 99.86666666666666, "x": "大気を、どう変えうるのか。"}, {"t": 101.81666666666666, "x": "そして、それを確かめることが、なぜこれほど難しいのか。"}, {"t": 106.13333333333334, "x": "この光が見つかったいきさつは、天文学とは"}, {"t": 109.3, "x": "関係のないところから始まります。"}, {"t": 111.4, "x": "1963年█"}, {"t": 111.4, "x": "1963年、アメリカは宇宙に"}, {"t": 114.65, "x": "監視用の衛星を上げはじめました。"}, {"t": 116.86666666666666, "x": "ヴェラと呼ばれる衛星です。"}, {"t": 118.63333333333334, "x": "目的は、大気圏や宇宙空間で核実験が"}, {"t": 122.08333333333333, "x": "行われていないかを見張ることでした。"}, {"t": 124.28333333333333, "x": "核爆発は、ガンマ線と呼ばれる非常に強い光を出します。"}, {"t": 128.58333333333334, "x": "ヴェラは、その光を拾うための検出器を積んでいました。"}, {"t": 132.48333333333332, "x": "1967年█"}, {"t": 132.48333333333332, "x": "1967年7月2日。ヴェラの3号と"}, {"t": 135.95, "x": "4号が、ガンマ線の閃光をとらえました。"}, {"t": 139.83333333333334, "x": "ところが、その形は、核爆発で知られている"}, {"t": 143.38333333333333, "x": "光の出方とは一致しませんでした。"}, {"t": 145.6, "x": "担当していたのは、アメリカの"}, {"t": 147.75, "x": "ロスアラモス研究所の研究班です。"}, {"t": 150.31666666666666, "x": "彼らはその後も記録を積み重ねました。"}, {"t": 152.88333333333333, "x": "複数の衛星が、離れた位置で同じ閃光をとらえると、"}, {"t": 156.8, "x": "届いた時刻のわずかな差から方向が分かります。"}, {"t": 160.11666666666667, "x": "そうして方向を割り出していくと、光は地球からも"}, {"t": 163.66666666666666, "x": "太陽からも来ていないことが分かりました。"}, {"t": 166.03333333333333, "x": "結果が論文として発表されたのは、1973年のことです。"}, {"t": 169.36666666666667, "x": "1973年█"}, {"t": 171.65, "x": "表題は「宇宙起源のガンマ線バーストの観測」。"}, {"t": 175.31666666666666, "x": "1969年7月から1972年7月までの"}, {"t": 179.93333333333334, "x": "三年間に、十六回の閃光が記録されていました。"}, {"t": 183.6, "x": "続いた時間は、一秒の十分の一に"}, {"t": 186.5, "x": "満たないものから、三十秒ほどのものまで。"}, {"t": 189.31666666666666, "x": "これが、ガンマ線バーストという現象が"}, {"t": 192.05, "x": "世に知られた最初の報告です。"}, {"t": 193.98333333333332, "x": "その後、観測は大きく進みました。"}, {"t": 196.78333333333333, "x": "いまでは、こうした閃光が、平均すると"}, {"t": 200.05, "x": "一日に一回以上とらえられています。"}, {"t": 202.43333333333334, "x": "続く時間によって、大きく二つに分けられます。"}, {"t": 205.88333333333333, "x": "二秒より長く続くものと、二秒より短いものです。"}, {"t": 209.66666666666666, "x": "長いほうは、重い星がその一生の終わりに"}, {"t": 212.78333333333333, "x": "崩れるときに起こると考えられています。"}, {"t": 215.16666666666666, "x": "短いほうは、中性子星のような重い天体どうしが"}, {"t": 218.83333333333334, "x": "合体するときに起こると考えられています。"}, {"t": 221.4, "x": "その光が向かう先にたまたま地球があれば、"}, {"t": 224.23333333333332, "x": "地球はその光を浴びることになります。"}, {"t": 226.93333333333334, "x": "長いほうの平均は三十秒ほど、"}, {"t": 229.31666666666666, "x": "短いほうの平均は〇・三秒ほどとされます。"}, {"t": 232.78333333333333, "x": "その明るさについて、アメリカ航空宇宙局、"}, {"t": 236.13333333333333, "x": "NASAの解説は、こう書いています。"}, {"t": 238.93333333333334, "x": "ふつうの超新星の、数百倍の明るさ。"}, {"t": 242.18333333333334, "x": "太陽と比べれば、百京倍ほどに当たる、と。"}, {"t": 246.13333333333333, "x": "ただし、これまでに観測されたものは、"}, {"t": 248.93333333333334, "x": "どれも遠い銀河で起きています。"}, {"t": 251.16666666666666, "x": "遠いからこそ、地球の空は、"}, {"t": 253.45, "x": "毎日それを浴びても何も起きていません。"}, {"t": 256.23333333333335, "x": "では、もし同じことが、私たちの天の川銀河の"}, {"t": 260.1333333333333, "x": "中で、比較的近い場所で起きていたら。"}, {"t": 262.8666666666667, "x": "その問いを、地球の大気の側から具体的に"}, {"t": 265.9166666666667, "x": "計算したのが、この回で追う一連の研究です。"}, {"t": 269.3833333333333, "x": "きっかけが核実験の見張りだったという点は、"}, {"t": 272.18333333333334, "x": "この回の終わりにもう一度出てきます。"}, {"t": 274.71666666666664, "x": "発生源そのものの話は、ここまでにします。"}, {"t": 278.05, "x": "この回で見ていくのは、光が届いた先、"}, {"t": 280.85, "x": "地球の空で何が起きるかです。"}, {"t": 283.23333333333335, "x": "まず、守られる側の盾を見ておきます。"}, {"t": 286.35, "x": "オゾンは、酸素の原子が三つつながった分子です。"}, {"t": 289.9166666666667, "x": "私たちが吸っている酸素は、"}, {"t": 291.76666666666665, "x": "原子が二つつながった分子です。"}, {"t": 294.2, "x": "空の高いところで、この二つの酸素に強い"}, {"t": 297.26666666666665, "x": "紫外線が当たると、分子がばらばらになります。"}, {"t": 300.4, "x": "ばらばらになった酸素の原子が、別の酸素の"}, {"t": 303.53333333333336, "x": "分子とくっつくと、オゾンになります。"}, {"t": 306.01666666666665, "x": "このしくみを説明したのは、イギリスの物理学者"}, {"t": 309.6, "x": "シドニー・チャップマンで、1930年のことです。"}, {"t": 311.75, "x": "1930年█"}, {"t": 313.55, "x": "オゾンの層そのものが見つかったのは、"}, {"t": 316.26666666666665, "x": "それより少し前の1913年です。"}, {"t": 318.81666666666666, "x": "1913年█"}, {"t": 320.43333333333334, "x": "フランスの物理学者、シャルル・ファブリと"}, {"t": 323.23333333333335, "x": "アンリ・ビュイッソンが、太陽の光を詳しく調べました。"}, {"t": 326.8833333333333, "x": "すると、地上に届く太陽の光には、ある波長より"}, {"t": 330.81666666666666, "x": "短い紫外線がほとんど含まれていませんでした。"}, {"t": 333.76666666666665, "x": "どこかで、何かが吸いこんでいる。"}, {"t": 336.21666666666664, "x": "その吸いこみ方の形が、オゾンの性質と一致しました。"}, {"t": 340.28333333333336, "x": "その後、イギリスの気象学者ゴードン・ドブソンが、"}, {"t": 343.5833333333333, "x": "地上からオゾンの量を測る装置を作ります。"}, {"t": 346.78333333333336, "x": "1928年から1958年にかけて、ドブソンは"}, {"t": 351.8666666666667, "x": "世界各地に観測地点の網を広げました。"}, {"t": 354.68333333333334, "x": "オゾンの量を表す単位には、"}, {"t": 356.6333333333333, "x": "いまも彼の名前が付いています。"}, {"t": 358.93333333333334, "x": "ドブソン単位█"}, {"t": 358.93333333333334, "x": "ドブソン単位です。零度・一気圧のもとで、純粋な"}, {"t": 364.15, "x": "オゾンだけを集めて層にしたとします。"}, {"t": 366.46666666666664, "x": "その厚さが〇・〇一ミリメートルになる"}, {"t": 369.1333333333333, "x": "量が、一ドブソン単位です。"}, {"t": 371.3833333333333, "x": "地球の上空のオゾンは、平均しておよそ三百ドブソン単位。"}, {"t": 375.8666666666667, "x": "押し縮めれば、厚さおよそ三ミリメートルの層になります。"}, {"t": 379.8666666666667, "x": "同じようにして、地面から宇宙までの空気を全部"}, {"t": 383.2, "x": "押し縮めると、厚さはおよそ八キロメートルになります。"}, {"t": 386.81666666666666, "x": "八キロメートルの空気の中の、三ミリメートル。"}, {"t": 390.1, "x": "それが、空の盾の厚さです。"}, {"t": 392.6, "x": "オゾンがとくに多く集まっているのは、"}, {"t": 394.78333333333336, "x": "高さおよそ三十キロメートルから"}, {"t": 397.1666666666667, "x": "四十キロメートルのあたりです。"}, {"t": 399.01666666666665, "x": "この層は、波長がおよそ二百から"}, {"t": 401.45, "x": "三百十五ナノメートルの紫外線を吸いこみます。"}, {"t": 404.6333333333333, "x": "その割合は、九十七パーセントから"}, {"t": 407.51666666666665, "x": "九十九パーセントとされています。"}, {"t": 409.71666666666664, "x": "なかでも、二百九十から三百十五ナノメートルほどの"}, {"t": 413.55, "x": "紫外線は、UVB、紫外線Bと呼ばれます。"}, {"t": 414.85, "x": "UVB█"}, {"t": 417.5, "x": "この光は、生き物の遺伝子の"}, {"t": 419.71666666666664, "x": "本体であるDNAに、よく吸いこまれます。"}, {"t": 422.8833333333333, "x": "吸いこまれると、DNAが傷つきます。"}, {"t": 425.96666666666664, "x": "つまり空の盾は、地上や海の表面にいる"}, {"t": 429.1166666666667, "x": "生き物にとって、欠かすことのできない覆いです。"}, {"t": 432.3, "x": "では、4億4500万年前の空にも、"}, {"t": 435.85, "x": "この盾はあったのでしょうか。"}, {"t": 437.8, "x": "この仮説を最初にまとめた2004年の"}, {"t": 440.25, "x": "論文は、その点をこう扱っています。"}, {"t": 443.15, "x": "オルドビス紀の大気の酸素の量は、"}, {"t": 445.3333333333333, "x": "いまと大きくは違わなかった。"}, {"t": 447.55, "x": "したがって、オゾンの盾もすでにあった。"}, {"t": 450.43333333333334, "x": "盾があったからこそ、それが削られれば、"}, {"t": 453.28333333333336, "x": "影響が出るという考え方です。"}, {"t": 455.81666666666666, "x": "なお、盾は変化しないものではありません。"}, {"t": 459.1166666666667, "x": "オゾンは、つくられる一方で、壊されてもいます。"}, {"t": 462.9, "x": "壊す役を担うものの一つが、窒素と"}, {"t": 466.18333333333334, "x": "酸素がくっついた物質、窒素酸化物です。"}, {"t": 468.43333333333334, "x": "窒素酸化物█"}, {"t": 470.0833333333333, "x": "ふだんの空では、つくられる量と壊される量が"}, {"t": 473.15, "x": "釣り合っていて、層の厚さが保たれています。"}, {"t": 476.1666666666667, "x": "この釣り合いに、外から大量の"}, {"t": 478.4166666666667, "x": "窒素酸化物が持ちこまれたら、どうなるか。"}, {"t": 481.46666666666664, "x": "次の章からは、それを順番に見ていきます。"}, {"t": 484.71666666666664, "x": "仮説の出発点は、2004年に発表された論文です。"}, {"t": 486.28333333333336, "x": "2004年█"}, {"t": 489.4166666666667, "x": "アメリカのカンザス大学とNASAの研究者に"}, {"t": 492.0, "x": "よる共著で、筆頭はエイドリアン・メロットです。"}, {"t": 495.1166666666667, "x": "表題は、「ガンマ線バーストが、オルドビス紀末の"}, {"t": 498.75, "x": "大量絶滅の引き金になったのか」。"}, {"t": 500.95, "x": "問いの形で書かれています。"}, {"t": 502.75, "x": "論文はまず、どのくらいの距離で"}, {"t": 505.23333333333335, "x": "起きれば危ないのかを見積もりました。"}, {"t": 507.3333333333333, "x": "答えは、地球に向いた典型的な"}, {"t": 509.8833333333333, "x": "バーストなら、およそ三キロパーセク以内。"}, {"t": 512.7, "x": "光の速さで一万年ほどかかる距離です。"}, {"t": 515.5333333333333, "x": "さらに、過去十億年の間でいちばん近かったと見込まれる"}, {"t": 520.0166666666667, "x": "バーストの距離を、およそ2キロパーセクとしました。"}, {"t": 521.5333333333333, "x": "2キロパーセク█"}, {"t": 523.5833333333334, "x": "光年に直すと、六千五百光年ほどです。"}, {"t": 526.9833333333333, "x": "天の川銀河の広さからすれば、すぐ近所と言える距離です。"}, {"t": 531.1833333333333, "x": "その距離で起きた場合、地球に届く光の強さは、"}, {"t": 534.9333333333333, "x": "一平方メートルあたりおよそ十キロワット。"}, {"t": 537.9166666666666, "x": "地球が太陽から受ける光の、およそ三倍に"}, {"t": 541.0333333333333, "x": "当たります。続くのは、十秒ほどです。"}, {"t": 544.0, "x": "数字だけ見ると、太陽の三倍の光が十秒間"}, {"t": 547.7, "x": "当たるだけで、大したことはないようにも見えます。"}, {"t": 550.8, "x": "違いは、光の種類にあります。"}, {"t": 553.2666666666667, "x": "太陽の光の主役は、目に見える光です。"}, {"t": 556.5333333333333, "x": "一方、ガンマ線は、ひとつひとつが"}, {"t": 559.5333333333333, "x": "桁違いに大きなエネルギーを持っています。"}, {"t": 562.0666666666667, "x": "そして、空気の中を遠くまで進めません。"}, {"t": 565.2, "x": "地面に届く前に、空気の分子にぶつかって吸いこまれます。"}, {"t": 569.2666666666667, "x": "論文によれば、典型的なガンマ線は、高さ"}, {"t": 573.0, "x": "およそ三十キロメートルまで入りこみます。"}, {"t": 575.6, "x": "気圧が、地上の百分の一ほどになる高さです。"}, {"t": 579.1333333333333, "x": "そこは、ちょうどオゾンがもっとも多い高さです。"}, {"t": 582.35, "x": "つまりガンマ線は、盾そのものの位置で止まります。"}, {"t": 585.95, "x": "止まったガンマ線のエネルギーは、"}, {"t": 587.9, "x": "消えるわけではありません。"}, {"t": 589.75, "x": "空気の分子を、次々に壊していきます。"}, {"t": 592.8833333333333, "x": "分子から電子をはぎ取り、分子そのものを原子に割ります。"}, {"t": 596.8333333333334, "x": "ひとつの光が、数千もの分子から"}, {"t": 599.4666666666667, "x": "電子をはぎ取りうる計算です。"}, {"t": 601.4666666666667, "x": "では、地面にはまったく何も届かないのか。"}, {"t": 604.5666666666667, "x": "2004年に別の研究班が、ガンマ線が"}, {"t": 607.75, "x": "大気の中をどう伝わるかを計算しています。"}, {"t": 610.5333333333333, "x": "それによると、吸いこまれたエネルギーの一部は、"}, {"t": 613.65, "x": "紫外線や目に見える光として出し直されます。"}, {"t": 616.8833333333333, "x": "オーロラに似た光です。地球の"}, {"t": 618.9666666666667, "x": "場合、届いたエネルギーのうち、"}, {"t": 621.2, "x": "〇・二パーセントから四パーセントほど。"}, {"t": 624.15, "x": "それが、生き物に害のある紫外線の帯で、"}, {"t": 627.3333333333334, "x": "地面まで届くと計算されました。"}, {"t": 629.7666666666667, "x": "メロットらの見積もりでは、二キロパーセクの"}, {"t": 632.3666666666667, "x": "バーストの場合、この一瞬の紫外線は、晴れた日に"}, {"t": 636.15, "x": "地面に届く紫外線Bのおよそ五倍になります。"}, {"t": 639.05, "x": "ただし、それが続くのは十秒ほど。"}, {"t": 641.95, "x": "しかも、光が当たるのは、そのとき爆発の側を"}, {"t": 645.65, "x": "向いていた地球の半分だけです。"}, {"t": 647.6833333333333, "x": "論文は、この一瞬の紫外線は、"}, {"t": 650.3666666666667, "x": "大きな原因ではないだろうと書いています。"}, {"t": 653.1833333333333, "x": "問題は、そのあとです。壊された空気の"}, {"t": 656.2333333333333, "x": "分子が、何に組み替わるのか。"}, {"t": 658.6, "x": "仮説の本体は、そこにあります。"}, {"t": 661.1833333333333, "x": "地球の空気のおよそ八割は、窒素です。"}, {"t": 664.4166666666666, "x": "窒素の分子は、二つの窒素原子が非常に強く"}, {"t": 668.0, "x": "結びついていて、ふだんはほとんど反応しません。"}, {"t": 671.3166666666667, "x": "ガンマ線は、その強い結びつきを断ち切ります。"}, {"t": 674.7333333333333, "x": "ばらばらになった窒素の原子は、"}, {"t": 676.8, "x": "まわりの酸素とすぐに結びつきます。"}, {"t": 679.4, "x": "こうしてできるのが、一酸化窒素や"}, {"t": 681.8833333333333, "x": "二酸化窒素、まとめて窒素酸化物です。"}, {"t": 685.0666666666667, "x": "先に見たとおり、窒素酸化物はオゾンを壊す役を担います。"}, {"t": 689.4666666666667 今回の計算はそれに当たりうる、と。"}, {"t": 1166.5, "x": "ただし、そこには但し書きがついています。"}, {"t": 1169.55, "x": "それを確かめるには、気候の詳しい計算が必要だ、と。"}, {"t": 1174.0333333333333, "x": "空から降りてくるものも、もう一つあります。"}, {"t": 1177.0666666666666, "x": "二酸化窒素は、大気の中の水と反応して"}, {"t": 1180.2666666666667, "x": "硝酸になり、雨や雪に溶けて地上に落ちます。"}, {"t": 1183.7333333333333, "x": "いわば、硝酸の雨です。酸の雨は、"}, {"t": 1184.85, "x": "硝酸の雨█"}, {"t": 1186.95, "x": "生き物にとって負担になります。"}, {"t": 1189.9666666666667, "x": "一方で、硝酸は窒素の栄養でもあります。"}, {"t": 1193.4833333333333, "x": "空気のほとんどは窒素でできていますが、"}, {"t": 1195.9, "x": "多くの生き物はそれをそのままでは使えません。"}, {"t": 1199.0166666666667, "x": "雨で落ちてくる硝酸は、肥料と同じ働きをします。"}, {"t": 1202.8833333333334, "x": "計算では、降ってくる硝酸の量は、いまの地球で"}, {"t": 1206.8, "x": "雷がつくる量と同じくらいか、やや多い程度でした。"}, {"t": 1210.5166666666667, "x": "それが数年にわたって続き、"}, {"t": 1212.4333333333334, "x": "もっとも多く降るのは三年目です。"}, {"t": 1215.0333333333333, "x": "紫外線が強まり、光が弱まり、酸の雨と肥料が同時に降る。"}, {"t": 1220.1166666666666, "x": "一回の閃光が、空にこれだけの変化を"}, {"t": 1223.1833333333334, "x": "連鎖させうる、というのが計算の結論です。"}, {"t": 1226.5333333333333, "x": "ここまでは、どれも模型の中で起きたことです。"}, {"t": 1229.7, "x": "次は、それがなぜ、4億4500万年前の"}, {"t": 1233.9, "x": "出来事と結びつけられたのかを見ます。"}, {"t": 1236.1333333333334, "x": "オルドビス紀の終わりには、地球の"}, {"t": 1238.4166666666667, "x": "歴史で指折りの大量絶滅がありました。"}, {"t": 1241.0333333333333, "x": "起きたのは、およそ4億4500万年前です。"}, {"t": 1244.8, "x": "国際層序委員会の年代表では、ヒルナンティアン期は、"}, {"t": 1248.65, "x": "およそ4億4520万年前に始まります。"}, {"t": 1252.5, "x": "終わりは、およそ4億4310万年前。"}, {"t": 1256.35, "x": "二百万年あまりの期間です。"}, {"t": 1258.5, "x": "絶滅は、この期間の始まりと後半に、百万年ほど"}, {"t": 1262.75, "x": "離れた二回の波として起きたと報告されています。"}, {"t": 1265.7666666666667, "x": "生き物の側で何が起きたかは、"}, {"t": 1267.7666666666667, "x": "この回の主題ではありません。"}, {"t": 1269.8833333333334, "x": "ここでは、空と気候の側から、"}, {"t": 1272.2833333333333, "x": "なぜこの時代が疑われたのかを見ます。"}, {"t": 1275.0333333333333, "x": "一つ目の理由は、先ほどの氷河時代です。"}, {"t": 1278.2666666666667, "x": "長く暖かかった地球が、急に冷えた。"}, {"t": 1281.3666666666666, "x": "その冷え込みを始めた、外からの一押し。"}, {"t": 1284.4166666666667, "x": "そこに、二酸化窒素による日射の減少が"}, {"t": 1287.5333333333333, "x": "当てはまるのではないか、という考え方です。"}, {"t": 1290.5833333333333, "x": "もし正しければ、一回の出来事で、紫外線と"}, {"t": 1294.2, "x": "寒さという二つの打撃が続けて来たことになります。"}, {"t": 1297.2666666666667, "x": "メロットらは、これを一撃目と"}, {"t": 1299.4833333333333, "x": "二撃目の組み合わせとして描きました。"}, {"t": 1301.9, "x": "二つ目の理由は、被害の出方の形です。"}, {"t": 1305.05, "x": "2004年の論文は、紫外線が原因なら、"}, {"t": 1308.3833333333334, "x": "被害の出方に偏りが出るはずだと予想しました。"}, {"t": 1311.6666666666667, "x": "海の浅いところや、水面近くを漂って暮らすものほど、"}, {"t": 1315.6333333333334, "x": "被害が大きく出る、という偏りです。"}, {"t": 1318.65, "x": "紫外線は、水の深いところまでは届かないからです。"}, {"t": 1322.4333333333334, "x": "そして、そうした形が、この時代の"}, {"t": 1325.2833333333333, "x": "記録の一部に見られると述べています。"}, {"t": 1327.4666666666667, "x": "ただし論文自身も、この点の"}, {"t": 1329.8333333333333, "x": "判定はまだ決まっていないと書いています。"}, {"t": 1332.2166666666667, "x": "差がはっきりしないとする研究もあるからです。"}, {"t": 1335.2, "x": "三つ目の理由は、緯度です。"}, {"t": 1337.4333333333334, "x": "2009年█"}, {"t": 1337.4333333333334, "x": "2009年、メロットと、共同研究者の"}, {"t": 1341.0833333333333, "x": "ブライアン・トーマスは、別の論文を出しています。"}, {"t": 1344.2666666666667, "x": "当時の地球で、どの緯度で絶滅が多かったかという"}, {"t": 1347.75, "x": "記録を、大気の計算と突き合わせたものです。"}, {"t": 1350.9166666666667, "x": "結果は、南極の上空に光が当たった場合の"}, {"t": 1354.2833333333333, "x": "計算の形と、矛盾しないというものでした。"}, {"t": 1357.4166666666667, "x": "その計算では、光の影響は南半球に強く出て、"}, {"t": 1361.4333333333334, "x": "赤道より北の陸地の周りは、逃げ場になりえます。"}, {"t": 1365.1666666666667, "x": "先に見たとおり、空気は赤道を"}, {"t": 1367.6666666666667, "x": "なかなかまたがないからです。"}, {"t": 1369.2833333333333, "x": "こうして、三つの手がかりが並べられました。"}, {"t": 1372.2666666666667, "x": "ここで、確率の話も見ておきます。"}, {"t": 1375.1166666666666, "x": "2004年の論文は、地球を危険にさらす"}, {"t": 1378.3333333333333, "x": "ほど近いバーストの回数を見積もっています。"}, {"t": 1381.0333333333333, "x": "平均して、十億年に二回以上です。"}, {"t": 1384.0666666666666, "x": "2014年には、イスラエルとスペインの"}, {"t": 1386.8666666666666, "x": "研究者が、より新しい観測をもとに計算し直しています。"}, {"t": 1391.3, "x": "過去五億年の間に、生き物に大きな打撃を与えるほどの"}, {"t": 1395.2333333333333, "x": "バーストが、地球の近くで起きていた確率。"}, {"t": 1398.2333333333333, "x": "それは、およそ五割とされまし とに調べました。"}, {"t": 1515.8, "x": "年輪には、その年の空気の中の"}, {"t": 1518.3833333333334, "x": "炭素が閉じこめられています。"}, {"t": 1520.1166666666666, "x": "その中の、炭素14と呼ばれる"}, {"t": 1521.0166666666667, "x": "炭素14█"}, {"t": 1522.8333333333333, "x": "放射性の炭素の量を測りました。"}, {"t": 1525.3833333333334, "x": "炭素14は、宇宙から来る粒子が"}, {"t": 1528.1, "x": "空気にぶつかることでつくられます。"}, {"t": 1530.0833333333333, "x": "結果、西暦774年から775年にかけて、"}, {"t": 1534.85, "x": "炭素14がおよそ千分の十二、急に増えていました。"}, {"t": 1538.9833333333333, "x": "ふだんの太陽の変動による増え方の、およそ二十倍です。"}, {"t": 1543.0333333333333, "x": "空の上で、何か大きなことが起きたことを示していました。"}, {"t": 1547.1, "x": "原因の候補として、2013年には、天の川銀河の"}, {"t": 1551.5166666666667, "x": "中で起きた短いガンマ線バーストだとする論文が出ます。"}, {"t": 1555.0333333333333, "x": "距離は一キロパーセクから四キロパーセクほど。"}, {"t": 1557.9166666666667, "x": "地球の生き物に大打撃を与えるほど"}, {"t": 1560.2333333333333, "x": "近くはなかった、という見積もりでした。"}, {"t": 1562.9833333333333, "x": "しかし2015年、北極と南極の氷床から"}, {"t": 1566.5333333333333, "x": "取り出した氷を調べた研究が出ます。"}, {"t": 1568.9833333333333, "x": "炭素14とは別の、ベリリウム10や"}, {"t": 1571.7166666666667, "x": "塩素36という原子を、年ごとに測りました。"}, {"t": 1575.2, "x": "原子ごとに、できやすい粒子のエネルギーが違います。"}, {"t": 1578.8833333333334, "x": "その比べ方から、原因は太陽から吹き出した"}, {"t": 1582.1333333333334, "x": "極端に強い粒子の嵐である可能性が高いと結論しました。"}, {"t": 1586.05, "x": "その強さは、機械で観測されてきたどの太陽の"}, {"t": 1589.4833333333333, "x": "嵐よりも、少なくとも五倍強かったとされています。"}, {"t": 1593.0333333333333, "x": "この例は、二つのことを示しています。"}, {"t": 1595.85, "x": "空の出来事は、条件がそろえば、"}, {"t": 1598.5666666666666, "x": "木や氷にきちんと記録される。"}, {"t": 1600.75, "x": "そして、記録があっても、それが"}, {"t": 1603.3166666666666, "x": "何だったのかを決めるには、別々の"}, {"t": 1605.7, "x": "物差しを何本も突き合わせる必要がある。"}, {"t": 1608.3666666666666, "x": "4億4500万年前には、年輪も、"}, {"t": 1611.75, "x": "年ごとの氷の層もありません。"}, {"t": 1614.1, "x": "炭素14は、数万年もたてば、ほとんど残らない原子です。"}, {"t": 1618.85, "x": "オルドビス紀の空に何が起きたのかを、"}, {"t": 1621.1, "x": "同じ方法で確かめることはできないのです。"}, {"t": 1623.9833333333333, "x": "ここで、この回の説を三つの段階に分けて整理します。"}, {"t": 1628.0333333333333, "x": "まず、定説、つまり争われていない部分です。"}, {"t": 1628.6, "x": "定説█"}, {"t": 1631.95, "x": "オルドビス紀の終わり、およそ4億4500万年前に、"}, {"t": 1636.1, "x": "地球の歴史で指折りの大量絶滅があったこと。"}, {"t": 1639.5333333333333, "x": "それが、百万年ほど離れた二回の波として起きたこと。"}, {"t": 1643.4833333333333, "x": "同じ頃、南の大陸ゴンドワナに大きな氷床が広がったこと。"}, {"t": 1647.9666666666667, "x": "ここまでは、地層の記録で直接確かめられています。"}, {"t": 1651.6, "x": "次に、有力説です。絶滅の原因として"}, {"t": 1652.5666666666666, "x": "有力説█"}, {"t": 1654.95, "x": "多くの研究が挙げているのは、"}, {"t": 1657.7166666666667, "x": "地球の中で起きた変化です。"}, {"t": 1659.9166666666667, "x": "一回目の波は、寒冷化と氷床の拡大に結びつける。"}, {"t": 1664.05, "x": "二回目の波は、温暖化と、海の"}, {"t": 1667.05, "x": "中の酸素が減ったことに結びつける。"}, {"t": 1669.3166666666666, "x": "そうした見方が、広く取られてきました。"}, {"t": 1672.1, "x": "これに対して、2020年には、"}, {"t": 1674.6166666666666, "x": "火山を軸にする説明が出ています。"}, {"t": 1677.3, "x": "調べたのは、スコットランドの"}, {"t": 1679.4166666666667, "x": "ドブズ・リンという場所の地層です。"}, {"t": 1681.35, "x": "オルドビス紀とシルル紀の境目の、"}, {"t": 1683.3333333333333, "x": "世界の基準になっている地層です。"}, {"t": 1685.7666666666667, "x": "そこで、水銀と、モリブデン、ウランの濃さの"}, {"t": 1689.65, "x": "偏りが、二回の絶滅の波と重なっていました。"}, {"t": 1692.9833333333333, "x": "研究者たちは、大規模な火山活動が温暖化を"}, {"t": 1696.4666666666667, "x": "招き、海の酸素を減らしたと考えました。"}, {"t": 1699.5833333333333, "x": "同じ2020年、中国南部の地層では、硫黄の"}, {"t": 1703.7333333333333, "x": "同位体に特殊な偏りが見つかっています。"}, {"t": 1706.3333333333333, "x": "成層圏まで噴き上がった火山の噴煙の跡と似た偏りで、"}, {"t": 1710.1666666666667, "x": "一回目の絶滅の波と時期が重なっていました。"}, {"t": 1713.4833333333333, "x": "一回目の波は、冷え込みの始まりではなく、"}, {"t": 1716.55, "x": "氷が溶けはじめた時期に結びつくという研究もあります。"}, {"t": 1720.4, "x": "寒さが原因か、火山と温暖化が原因か。"}, {"t": 1723.9333333333334, "x": "有力な説どうしの間でも、決着は"}, {"t": 1727.1, "x": "ついていません。そして、少数説です。"}, {"t": 1729.0666666666666, "x": "少数説█"}, {"t": 1730.8833333333334, "x": "この回で見てきた、ガンマ線バーストが"}, {"t": 1733.45, "x": "引き金になったという説は、ここに入ります。"}, {"t": 1736.4333333333334, "x": "計算の上では、盾を削り、空を濁らせ、"}, {"t": 1740.2166666666667, "x": "寒さの引き金にもなりうる。"}, {"t": 1742.5, "x": "被害の出方の一部とも矛盾しない。"}, {"t": 1744.8, "x": "しかし、そのバーストが実際に"}, {"t": 1747.25, "x": "起きたことを示す直接の証拠はありません。"}, {"t": 1749.9333333333334, "x": "そして、同じ形は、地球の中で"}, {"t": 1752.9, "x": "起きた変化でも説明できるとされています。"}, {"t": 1755.4833333333333, "x": "なお、ガンマ線が今の地球の空に何かを"}, {"t": 1758.75, "x": "起こしているのかについても、議論があります。"}, {"t": 1761.6666666666667, "x": "2022年10月9日、観測史上でも"}, {"t": 1765.05, "x": "きわめて明るいガンマ線バーストが届きました。"}, {"t": 1767.8333333333333, "x": "2023年、このとき高さおよそ五百キロメートルの"}, {"t": 1771.8333333333333, "x": "電離層に乱れが出た、とする論文が発表されました。"}, {"t": 1775.6333333333334, "x": "ところが2026年、別の研究班が再検討を出しています。"}, {"t": 1780.4833333333333, "x": "その乱れは、衛星の軌道ごとに繰り返す現象や、"}, {"t": 1784.2333333333333, "x": "太陽の風の変化で説明できる、という内容です。"}, {"t": 1788.35, "x": "こちらは、まだ専門家の審査を経る前の段階の論文です。"}, {"t": 1792.6666666666667, "x": "遠い閃光が空に残す跡を、いま観測することさえ、これほど"}, {"t": 1797.1666666666667, "x": "難しいのです。この番組では、ガンマ線バースト説を、"}, {"t": 1801.3333333333333, "x": "少数説として扱います。否定もしません。"}, {"t": 1804.6, "x": "採用もしません。空の盾がどう削られうるかを"}, {"t": 1807.8666666666666, "x": "示した計算として、紹介しました。"}, {"t": 1810.6666666666667, "x": "最後に、この話が、いまの私たちと"}, {"t": 1813.9, "x": "どうつながっているのかを見ます。"}, {"t": 1815.6666666666667, "x": "2014年の研究は、ガンマ線バーストの危険を、"}, {"t": 1819.45, "x": "天の川銀河全体の地図に広げて計算しています。"}, {"t": 1823.1166666666666, "x": "銀河の中心に近いほど、星が密集していて、"}, {"t": 1826.5833333333333, "x": "バーストに巻きこまれる確率は高くなります。"}, {"t": 1829.5333333333333, "x": "中心から四キロパーセク以内では、"}, {"t": 1831.8333333333333, "x": "その確率は九十五パーセントとされました。"}, {"t": 1834.9666666666667, "x": "中心から十キロパーセクより外に出て、"}, {"t": 1837.5833333333333, "x": "ようやく五十パーセントを下回ります。"}, {"t": 1840.3166666666666, "x": "研究者たちは、宇宙全体についても書いています。"}, {"t": 1843.9833333333333, "x": "地球のような生き物が暮らせる銀河は、"}, {"t": 1846.4, "x": "一割ほどしかないかもしれない、と。"}, {"t": 1849.45, "x": "地球は、天の川銀河の中心からは離れた側を回っています。"}, {"t": 1854.1, "x": "それでも、過去五億年のどこかで一度は近くの"}, {"t": 1857.2333333333333, "x": "バーストを浴びた確率が、五割あるとされる場所です。"}, {"t": 1860.75, "x": "地球の空は、その中で、およそ十億年に"}, {"t": 1864.3166666666666, "x": "わたって盾を保ってきたとされます。"}, {"t": 1866.4, "x": "盾は、何度か削られたのかもしれません。"}, {"t": 1869.3166666666666, "x": "削られたとしても、十年ほどで戻ったと計算されています。"}, {"t": 1873.3333333333333, "x": "空気が入れ替わり、酸素に紫外線が"}, {"t": 1875.9666666666667, "x": "当たり、オゾンがつくられ直す。"}, {"t": 1878.0833333333333, "x": "盾は、壊れても自分でつくり直される"}, {"t": 1880.9333333333334, "x": "仕組みを持っています。この盾が"}, {"t": 1883.45, "x": "見つかったのは、1913年のことでした。"}, {"t": 1884.4833333333333, "x": "1913年█"}, {"t": 1886.8, "x": "太陽の光の中に、あるはずの紫外線が無い。"}, {"t": 1890.25, "x": "その欠けた部分から、人は空の"}, {"t": 1892.6333333333334, "x": "上に見えない層があることを知りました。"}, {"t": 1894.8833333333334, "x": "1920年代の終わりからは、世界中に観測地点が置かれ、"}, {"t": 1899.65, "x": "その厚さが測られるようになりました。"}, {"t": 1902.25, "x": "厚さ三ミリメートルの層を、"}, {"t": 1904.15, "x": "地上から測り続けるための網です。"}, {"t": 1906.7666666666667, "x": "一方で、その盾を削りうる光の存在を人が"}, {"t": 1910.3166666666666, "x": "知ったのは、盾が見つかってから半世紀あとです。"}, {"t": 1913.7166666666667, "x": "しかもそれは、宇宙を調べるためではなく、"}, {"t": 1916.6833333333334, "x": "地上の核実験を見張るために打ち上げた衛星からでした。"}, {"t": 1920.6333333333334, "x": "空を守るものも、空を削りうるものも、人は"}, {"t": 1924.1333333333334, "x": "思いがけない方向から見つけてきました。"}, {"t": 1926.5166666666667, "x": "4億4500万年前の空に、本当に閃光が"}, {"t": 1930.5833333333333, "x": "届いたのかどうかは、分かっていません。"}, {"t": 1933.2333333333333, "x": "岩には、空の記録がほとんど残らないからです。"}, {"t": 1936.6666666666667, "x": "年輪も氷もない時代の空は、いまのところ、"}, {"t": 1939.95, "x": "計算の中でしか見ることができません。"}, {"t": 1942.6, "x": "それでも、一つだけ確かなことがあります。"}, {"t": 1945.5, "x": "いま、地上に生き物が暮らし、"}, {"t": 1947.7666666666667, "x": "人間が昼間の光の下を歩けること。"}, {"t": 1950.6833333333334, "x": "それは、三ミリメートルの盾が、"}, {"t": 1953.1, "x": "頭の上に張られているからです。"}, {"t": 1955.4333333333334, "x": "その盾は、地球の歴史の中で、"}, {"t": 1957.9666666666667, "x": "ずっと同じ厚さだったわけではありません。"}, {"t": 1960.7166666666667, "x": "つくられ、壊され、またつくられながら、"}, {"t": 1963.9333333333334, "x": "いまの空になっています。オルドビス紀の"}, {"t": 1966.6, "x": "終わりの空が、どんな色をしていたのか。"}, {"t": 1969.2666666666667, "x": "確かめる方法は、まだ誰も持っていません。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
