<script>
const D={"name": "ep028", "file": "ep028", "dur": 1806.46665625, "segs": [], "subs": [{"t": 0.0, "x": "1811年12月16日、午前2時すぎのことです。"}, {"t": 4.85, "x": "北アメリカ大陸のまんなかで、大地が大きく揺れました。"}, {"t": 8.633333333333333, "x": "場所はミシシッピ川のほとりです。"}, {"t": 10.866666666666667, "x": "ニューマドリッドという小さな町のあたりでした。"}, {"t": 13.65, "x": "揺れは一度では終わりません。"}, {"t": 15.466666666666667, "x": "夜明けにまた大きく揺れました。"}, {"t": 17.383333333333333, "x": "年が明けた1月23日にも揺れました。"}, {"t": 20.333333333333332, "x": "2月7日にも大きな揺れが来ました。"}, {"t": 22.716666666666665, "x": "ひと冬で大きな地震が3回です。"}, {"t": 25.183333333333334, "x": "地震といえば、プレートの境目が思い浮かびます。"}, {"t": 28.716666666666665, "x": "日本の大きな地震も多くは境目で起きます。"}, {"t": 31.85, "x": "けれどもこの町は、プレートのまんなかにあります。"}, {"t": 35.083333333333336, "x": "近くに海も火山もありません。"}, {"t": 37.166666666666664, "x": "平らな川の低地が続く土地です。"}, {"t": 39.5, "x": "その平らな地面が割れました。"}, {"t": 41.43333333333333, "x": "割れ目から水と砂が噴き出しました。"}, {"t": 43.65, "x": "あとには白っぽい砂の山が残りました。"}, {"t": 46.25, "x": "沈んで水がたまった土地もありました。"}, {"t": 48.63333333333333, "x": "持ち上がった土地もありました。"}, {"t": 50.38333333333333, "x": "主役は揺れた地面そのものです。"}, {"t": 52.583333333333336, "x": "手がかりは三人の手紙と、畑の土に残った砂です。"}, {"t": 56.55, "x": "境目でもない大地がなぜ割れたのか。"}, {"t": 58.96666666666667, "x": "その問いにも、分かっている所まで近づきます。"}, {"t": 62.3, "x": "まず、舞台の土地を見ておきます。"}, {"t": 64.86666666666666, "x": "ミシシッピ川は、大陸を北から南へ流れる大河です。"}, {"t": 68.95, "x": "オハイオ川と合わさるあたりから、"}, {"t": 70.98333333333333, "x": "両岸に広い低地が開けます。"}, {"t": 73.23333333333333, "x": "いまのミズーリ州の南東のはしです。"}, {"t": 75.65, "x": "そしてアーカンソー州の北東部です。"}, {"t": 78.06666666666666, "x": "川の東には、テネシー州とケンタッキー州があります。"}, {"t": 82.11666666666666, "x": "ニューマドリッドの町は、川の西の岸にありました。"}, {"t": 85.68333333333334, "x": "当時はまだ州ではありません。"}, {"t": 87.61666666666666, "x": "ミズーリ準州と呼ばれていました。"}, {"t": 89.75, "x": "町の南には、リトルプレーリーという村もありました。"}, {"t": 93.2, "x": "川を下る舟が立ち寄る場所です。"}, {"t": 95.41666666666667, "x": "舟は小麦粉や酒の樽を積んでいました。"}, {"t": 98.11666666666666, "x": "行き先は南のニューオーリンズです。"}, {"t": 100.43333333333334, "x": "川の西には、セントフランシス盆地が広がります。"}, {"t": 104.06666666666666, "x": "もとは広葉樹の深い森でした。"}, {"t": 106.23333333333333, "x": "イトスギの沼地もありました。"}, {"t": 108.01666666666667, "x": "この低地の地面には、決まった重なりかたがあります。"}, {"t": 111.63333333333334, "x": "いちばん上は粘土をふくむ薄い層です。"}, {"t": 114.28333333333333, "x": "厚さはふつう2メートルから8メートルです。"}, {"t": 117.05, "x": "その下に固まっていない砂の層があります。"}, {"t": 119.81666666666666, "x": "厚さは30メートルから60メートルにもなります。"}, {"t": 123.18333333333334, "x": "川が長い年月をかけて運んだ砂です。"}, {"t": 126.01666666666667, "x": "砂のすき間は地下水で満たされています。"}, {"t": 128.56666666666666, "x": "水をふくんだ砂の上に、粘土のふたがのっているのです。"}, {"t": 132.3, "x": "ふだんは何も起きません。地面はただ平らです。"}, {"t": 135.5, "x": "けれども強く揺さぶられると、話が変わります。"}, {"t": 138.81666666666666, "x": "そのことはあとの章で見ます。"}, {"t": 140.73333333333332, "x": "もう一つ、覚えておきたいことがあります。"}, {"t": 143.63333333333333, "x": "当時、ここに住む人はまだ多くありませんでした。"}, {"t": 147.08333333333334, "x": "揺れのいちばん強い土地は、人のまばらな低地でした。"}, {"t": 150.66666666666666, "x": "これは、被害を数えるときにも関わってきます。"}, {"t": 153.9, "x": "1811年12月16日。人びとが眠る、"}, {"t": 157.65, "x": "午前2時15分ごろでした。"}, {"t": 160.21666666666667, "x": "最初の大きな揺れが来ました。"}, {"t": 162.18333333333334, "x": "震源は、いまのアーカンソー州の"}, {"t": 164.76666666666668, "x": "北東部と考えられています。"}, {"t": 166.61666666666667, "x": "ニューマドリッドに住む女性が、様子を書き残しています。"}, {"t": 170.45, "x": "名前をエライザ・ブライアンといいます。"}, {"t": 172.7, "x": "1816年、彼女は知りあいの牧師に手紙を書きました。"}, {"t": 177.3, "x": "牧師の名はロレンゾ・ダウです。"}, {"t": 179.11666666666667, "x": "ダウはその手紙を、自分の旅の記録の本に載せました。"}, {"t": 183.0, "x": "ブライアンによれば、揺れとともに音がしました。"}, {"t": 186.16666666666666, "x": "遠くの雷のような音です。ただ、"}, {"t": 188.58333333333334, "x": "雷よりしわがれてふるえる音でした。"}, {"t": 191.31666666666666, "x": "数分のうちに空気が気体で満たされました。"}, {"t": 194.08333333333334, "x": "硫黄のようなにおいの気体です。"}, {"t": 196.05, "x": "あたりは真っ暗になりました。"}, {"t": 197.85, "x": "人びとは叫びながら走りまわりました。"}, {"t": 200.36666666666667, "x": "どこへ行けばいいのか、誰にも分かりません。"}, {"t": 203.41666666666666, "x": "鳥もけものも鳴きさけびました。"}, {"t": 205.3, "x": "木が倒れ、裂ける音がしました。"}, {"t": 207.88333333333333, "x": "ミシシッピ川がうなりをあげていました。"}, {"t": 210.3, "x": "彼女はこれを、まさに恐ろしい光景と書いています。"}, {"t": 214.01666666666668, "x": "夜明けまで小さな揺れが続きました。"}, {"t": 216.36666666666667, "x": "そして夜明けごろ、さらに激しい揺れが来ました。"}, {"t": 219.63333333333333, "x": "アメリカ地質調査所は、これを"}, {"t": 221.83333333333334, "x": "午前7時15分ごろとしています。"}, {"t": 224.18333333333334, "x": "最初の地震のあとの、いちばん大きな余震です。"}, {"t": 227.75, "x": "規模はマグニチュード7前後と見積もられています。"}, {"t": 230.73333333333332, "x": "人びとは川から離れようと、四方へ逃げました。"}, {"t": 234.15, "x": "ある女性は、恐ろしさのあまり気を失いました。"}, {"t": 237.6, "x": "意識は戻らなかったと、ブライアンは書いています。"}, {"t": 240.96666666666667, "x": "同じ朝の揺れを別の男性も書き残しました。"}, {"t": 243.91666666666666, "x": "ゴドフリー・ル・シュールという人です。"}, {"t": 245.98333333333332, "x": "朝7時ごろ、彼は西から地鳴りを聞きました。"}, {"t": 249.3, "x": "雷のような音でした。その瞬間、"}, {"t": 251.68333333333334, "x": "立っていられないほど揺れました。"}, {"t": 254.23333333333332, "x": "歩くこともできません。それが1分ほど続きました。"}, {"t": 257.6, "x": "地面は、高さ数フィートの波のようにうねりました。"}, {"t": 261.1666666666667, "x": "波と波のあいだにくぼみが見えたそうです。"}, {"t": 263.81666666666666, "x": "ただし、この手紙は1871年に書かれました。"}, {"t": 268.03333333333336, "x": "地震から60年近くたってからの記憶です。"}, {"t": 271.01666666666665, "x": "最初の揺れの日付も、12月17日になっています。"}, {"t": 275.01666666666665, "x": "記憶の日付にはずれがまじります。"}, {"t": 277.18333333333334, "x": "この回の日付と時刻は、地質調査所のまとめに合わせます。"}, {"t": 281.3666666666667, "x": "揺れは遠い町でも感じられました。"}, {"t": 283.6333333333333, "x": "地質調査所のまとめでは、アメリカ東部の"}, {"t": 286.53333333333336, "x": "広い範囲に届いています。大西洋岸の"}, {"t": 288.95, "x": "ニューヨークで、人びとが目をさましました。"}, {"t": 291.93333333333334, "x": "首都ワシントンでもそうでした。"}, {"t": 293.9166666666667, "x": "南のチャールストンでもです。"}, {"t": 295.75, "x": "揺れの長さは場所により1分から3分です。"}, {"t": 298.78333333333336, "x": "北東のシンシナティでは煙突が倒れました。"}, {"t": 301.56666666666666, "x": "北のセントルイスでは、多くの家がひどく傷みました。"}, {"t": 305.18333333333334, "x": "揺れの強さは段階で表すことができます。"}, {"t": 308.1, "x": "人の感じかたや、物の壊れかたで決める段階です。"}, {"t": 311.85, "x": "これを震度階級と呼びます。"}, {"t": 313.8, "x": "アメリカでよく使う震度階級で、"}, {"t": 316.0, "x": "7以上は被害が出る強さです。"}, {"t": 318.43333333333334, "x": "12月の地震では、その範囲が約60万平方キロでした。"}, {"t": 322.98333333333335, "x": "日本の国土の、およそ1.6倍です。"}, {"t": 325.96666666666664, "x": "人がおどろく揺れなら、約250万平方キロに届きました。"}, {"t": 330.43333333333334, "x": "日本の6倍をこえる広さです。"}, {"t": 332.68333333333334, "x": "地質調査所はほかの地震とも比べています。"}, {"t": 335.56666666666666, "x": "アラスカの大地震の、2倍から3倍の広さです。"}, {"t": 339.1166666666667, "x": "サンフランシスコの大地震と比べると、10倍です。"}, {"t": 342.8, "x": "しかもこれは一回分の話です。"}, {"t": 345.15, "x": "同じほどの揺れが、この冬に何度も来たのです。"}, {"t": 348.4, "x": "いちばん被害の大きい土地は、川ぞいの細長い地域でした。"}, {"t": 352.6166666666667, "x": "北のケイロから、南のメンフィスのあたりまでです。"}, {"t": 355.96666666666664, "x": "広さは7万8000から12万9000平方キロほどです。"}, {"t": 359.9166666666667, "x": "川の上でも大きな波が立ちました。"}, {"t": 362.26666666666665, "x": "多くの舟が波にのまれました。"}, {"t": 364.23333333333335, "x": "岸の高い所まで、打ち上げられた舟もありました。"}, {"t": 367.8833333333333, "x": "川岸の崖では地すべりも起きています。"}, {"t": 370.45, "x": "けれども、この地震には目立つ特ちょうがありました。"}, {"t": 373.78333333333336, "x": "平らな低地から水と砂が噴き出したのです。"}, {"t": 376.6, "x": "地面から何が噴き出したのか。"}, {"t": 378.55, "x": "それを間近で見た男性がいます。"}, {"t": 380.73333333333335, "x": "ルイ・ブランジエという人です。"}, {"t": 382.5833333333333, "x": "彼は馬に乗って、町の近くを通りかかっていました。"}, {"t": 386.3, "x": "のちに、そのときのことを手紙に書いています。"}, {"t": 389.4, "x": "手紙の日付は1818年3月です。"}, {"t": 392.6333333333333, "x": "1821年、アメリカの科学雑誌に載りました。"}, {"t": 396.76666666666665, "x": "手紙では、この日を1812年1月6日としています。"}, {"t": 401.2, "x": "これも何年もあとの記憶の日付です。"}, {"t": 403.6666666666667, "x": "彼によれば、揺れとともに爆発のような音がしました。"}, {"t": 407.4166666666667, "x": "地下の水が押し出され、土を吹き飛ばしたのです。"}, {"t": 410.7, "x": "水は四方八方へ噴き出しました。"}, {"t": 412.98333333333335, "x": "いっしょに、炭になった木のかけらが飛び出しました。"}, {"t": 416.3, "x": "ほとんど粉のようにくだけていました。"}, {"t": 418.45, "x": "高さは3メートルから4メートル半ほどです。"}, {"t": 421.3666666666667, "x": "それが砂とまじり、黒い雨のように降ってきました。"}, {"t": 424.8833333333333, "x": "うなるような、笛のような音も聞こえました。"}, {"t": 427.8666666666667, "x": "まわりでは木が何千本も倒れていきました。"}, {"t": 430.65, "x": "そのあいだも地面は沈んでいきます。"}, {"t": 433.03333333333336, "x": "黒い水がわき上がりました。"}, {"t": 434.9, "x": "水は馬の腹の高さまで来ました。"}, {"t": 437.1166666666667, "x": "馬はおびえて身動き一つしません。"}, {"t": 439.4, "x": "これが2分近く続きました。"}, {"t": 441.35, "x": "揺れがおさまると、あたり一面に穴が残っていました。"}, {"t": 445.03333333333336, "x": "彼はそれを火山の火口にたとえています。"}, {"t": 447.6666666666667, "x": "穴のまわりには、炭と砂が輪のように積もりました。"}, {"t": 451.2, "x": "高さは2メートルほどです。"}, {"t": 452.98333333333335, "x": "数か月後、彼は穴の深さをはかりました。"}, {"t": 456.25, "x": "深さは6メートルをこえませんでした。"}, {"t": 458.65, "x": "ただ、穴には流砂が流れこんでいたそうです。"}, {"t": 461.93333333333334, "x": "ル・シュールも、噴き出したものを書いています。"}, {"t": 464.73333333333335, "x": "地面のうねりがはじけ、水と砂が噴き上がった。"}, {"t": 468.15, "x": "炭のようなものもまじっていた。"}, {"t": 470.15, "x": "それは硫黄のようなにおいがした。"}, {"t": 472.21666666666664, "x": "いまにして思えば石油のにおいかも"}, {"t": 474.26666666666665, "x": "しれない、とも書いています。"}, {"t": 476.21666666666664, "x": "噴き上がった水はぬるかったそうです。"}, {"t": 478.51666666666665, "x": "泳いでも冷たく感じないほどでした。"}, {"t": 480.81666666666666, "x": "高さは目分量で、2メートルから3メートルほどです。"}, {"t": 484.56666666666666, "x": "地割れは南北に何本も平行に走りました。"}, {"t": 487.6666666666667, "x": "長いものは6キロから8キロ続きました。"}, {"t": 490.4, "x": "深さは平均1メートル余り、幅は3メートルまでです。"}, {"t": 494.6333333333333, "x": "丸い穴もあきました。差しわたし"}, {"t": 496.76666666666665, "x": "90メートルほどの穴もありました。"}, {"t": 499.1666666666667, "x": "いちばん乾いた季節にも、水が残る深さだったそうです。"}, {"t": 503.1166666666667, "x": "ブライアンも手紙にこう書いています。"}, {"t": 505.3833333333333, "x": "何百エーカーもの地面が砂におおわれた。"}, {"t": 508.1666666666667, "x": "割れ目から噴き出した砂だった、と。"}, {"t": 510.76666666666665, "x": "地面から水と砂が噴き出す。"}, {"t": 512.7333333333333, "x": "これをいまの言葉で噴砂と呼びます。"}, {"t": 515.0333333333333, "x": "噴砂を起こすのは液状化という現象です。"}, {"t": 517.8833333333333, "x": "はじめに見た、低地の地面を思い出してください。"}, {"t": 521.1166666666667, "x": "水をふくんだ砂の層に、粘土のふたがのっていました。"}, {"t": 524.75, "x": "ふだんの砂は、粒どうしが押しあって形を保っています。"}, {"t": 528.7333333333333, "x": "粒のすき間には地下水があります。"}, {"t": 530.9666666666667, "x": "そこへ、強い揺れが何十秒も続きます。"}, {"t": 534.2666666666667, "x": "砂の粒がずれてすき間がつまろうとします。"}, {"t": 537.0, "x": "けれども水はすぐには逃げられません。"}, {"t": 539.3, "x": "水の押す力が高まります。粒どうしの支えが弱まります。"}, {"t": 543.3833333333333, "x": "砂の層は泥水のようにふるまいはじめます。"}, {"t": 546.2666666666667, "x": "これが液状化です。押された水は出口を探します。"}, {"t": 549.9166666666666, "x": "上には粘土のふたがあります。"}, {"t": 551.8166666666667, "x": "ふたの割れた所から、水が地上へ噴き出します。"}, {"t": 555.2166666666667, "x": "砂もいっしょに運ばれます。"}, {"t": 557.0333333333333, "x": "噴き上がった水はまわりに砂を落とします。"}, {"t": 559.7166666666667, "x": "こうして砂の低い山ができます。"}, {"t": 561.8666666666667, "x": "アメリカ地質調査所のスティーブン・"}, {"t": 563.8166666666667, "x": "オバマイヤーは、この砂の山を調べました。"}, {"t": 566.7666666666667, "x": "1989年の報告です。この地震でできた砂の山は、"}, {"t": 571.35, "x": "ふつう直径15メートルから60メートルです。"}, {"t": 574.6333333333333, "x": "高さは1メートルほどです。"}, {"t": 576.5, "x": "平らな地面に浅く盛り上がった丸い砂です。"}, {"t": 579.3833333333333, "x": "割れ目にそって、帯のように噴き出した所もあります。"}, {"t": 582.9833333333333, "x": "噴砂の跡は、セントフランシス盆地に集まっていました。"}, {"t": 586.85, "x": "北はミズーリ州チャールストンの近くからです。"}, {"t": 589.6833333333333, "x": "南はアーカンソー州マークトツリーの少し先までです。"}, {"t": 593.1833333333333, "x": "幅40キロから60キロの帯でした。"}, {"t": 595.9166666666666, "x": "粘土のふたが薄い所ほど、噴砂は多く出ました。"}, {"t": 599.3666666666667, "x": "目安は、厚さ6メートルから7メートルより薄い所です。"}, {"t": 603.6, "x": "10メートルをこえると、噴砂はほとんど出ません。"}, {"t": 606.9, "x": "重いふたが出口をふさいでいたのです。"}, {"t": 609.25, "x": "では炭のようなものは何だったのか。"}, {"t": 611.55, "x": "炭になりかけた古い木が、地下に"}, {"t": 613.9666666666667, "x": "眠っていたと考えられます。"}, {"t": 615.6833333333333, "x": "水といっしょに地上へ運び出されたのです。"}, {"t": 618.2833333333333, "x": "ブライアンの書いた暗い空気は、"}, {"t": 620.1833333333333, "x": "においとほこりだったのかもしれません。"}, {"t": 622.5666666666667, "x": "ただ、当時の空気を調べた記録はありません。"}, {"t": 625.8333333333334, "x": "ここは手紙からの読み取りにとどめます。"}, {"t": 628.1666666666666, "x": "最初の夜のあとも、揺れは止まりませんでした。"}, {"t": 631.4833333333333, "x": "ブライアンによれば、一日に何度も揺れが来ました。"}, {"t": 635.0333333333333, "x": "最初ほど強くはありません。"}, {"t": 636.95, "x": "けれども休む間がありませんでした。"}, {"t": 639.1333333333333, "x": "のちに地震学者のオットー・ナトリが、"}, {"t": 641.3333333333334, "x": "当時の記録から余震をまとめました。"}, {"t": 643.9166666666666, "x": "12月16日から3月15日までに、"}, {"t": 646.9666666666667, "x": "中くらい以上の余震が200回をこえました。"}, {"t": 650.2166666666667, "x": "マグニチュード6をこえるものが、10回ほどです。"}, {"t": 653.5166666666667, "x": "5台のものがおよそ100回です。"}, {"t": 655.6833333333333, "x": "もっと小さな揺れも、1800回ほどありました。"}, {"t": 659.2, "x": "三か月で2000回をこえる揺れです。"}, {"t": 661.6666666666666, "x": "そして1812年1月23日の朝。"}, {"t": 665.1166666666667, "x": "2回目の大きな地震が来ました。"}, {"t": 667.3166666666667, "x": "時刻は午前8時から9時ごろです。"}, {"t": 669.7, "x": "震源は、ニューマドリッドの近くと考えられています。"}, {"t": 673.5333333333333, "x": "地質調査所は、規模を7.3ほどとしています。"}, {"t": 677.05, "x": "3回のうちではいちばん小さい揺れです。"}, {"t": 679.7333333333333, "x": "それでもブライアンは、どの揺れにも"}, {"t": 682.0666666666667, "x": "負けない激しさと書きました。"}, {"t": 683.7666666666667, "x": "音とにおいと暗さもまた来ました。"}, {"t": 685.85, "x": "そこから2月4日まで、大地は動きつづけました。"}, {"t": 689.45, "x": "静かな海のように目に見えて"}, {"t": 691.2333333333333, "x": "波打っていた。彼女はそう書いています。"}, {"t": 693.85, "x": "2月4日にまた強い揺れが来ました。"}, {"t": 696.2666666666667, "x": "翌日の5日には同じほどの揺れが4回です。"}, {"t": 699.35, "x": "ル・シュールの手紙では、2回目は1月7日です。"}, {"t": 702.7166666666667, "x": "その日、人びとから叫びがあがりました。"}, {"t": 705.6, "x": "フランス語で、逃げられる者は逃げろ、という言葉です。"}, {"t": 709.6, "x": "彼によれば、ほとんどの人が土地を離れました。"}, {"t": 712.85, "x": "残ったのは、二つの家族だけだったといいます。"}, {"t": 715.9833333333333, "x": "牛や豚や馬は置いていかれました。"}, {"t": 718.2, "x": "家財の一部も残されたままです。"}, {"t": 720.4166666666666, "x": "それらはすべて失われました。"}, {"t": 722.3833333333333, "x": "日付は公式の記録と合いません。"}, {"t": 724.6666666666666, "x": "けれども、人びとが逃げたという中身は合っています。"}, {"t": 728.0833333333334, "x": "ブライアンの手紙とも重なるのです。"}, {"t": 730.3666666666667, "x": "そして、いちばん激しい揺れは、まだこのあとでした。"}, {"t": 734.2, "x": "1812年2月7日。午前3時45分ごろ、"}, {"t": 737.9666666666667, "x": "3回目の大きな地震が来ました。"}, {"t": 740.7833333333333, "x": "ブライアンは、どの揺れよりも"}, {"t": 742.7833333333333, "x": "はるかに激しかったと書いています。"}, {"t": 744.8166666666667, "x": "のちに、ハード・ショックと呼ばれた揺れです。"}, {"t": 747.5166666666667, "x": "ひどい揺れ、という意味です。"}, {"t": 749.75, "x": "空気はまた硫黄のにおいで満たされました。"}, {"t": 752.25, "x": "嵐のような地鳴りが鳴りひびきました。"}, {"t": 754.5166666666667, "x": "言葉で書きあらわすのは無理だ、とまで"}, {"t": 757.1, "x": "彼女は書いています。このとき、"}, {"t": 759.35, "x": "ミシシッピ川が大きく動きました。"}, {"t": 761.7333333333333, "x": "まず、水が岸から引いていきました。"}, {"t": 764.5833333333334, "x": "川を下る途中の舟が、砂の上に取り残されました。"}, {"t": 768.4333333333333, "x": "乗り手たちはそのすきに逃げ出しました。"}, {"t": 770.7333333333333, "x": "次の瞬間、水は山のように盛り上がりました。"}, {"t": 774.2833333333333, "x": "高さは4メートル半から6メートルほどです。"}, {"t": 777.25, "x": "水は岸をこえて流れこみました。"}, {"t": 779.4833333333333, "x": "砂の上の舟は、つなぎ綱ごと引きちぎられました。"}, {"t": 783.05, "x": "近くの小川の奥へ、400メートル近く押し流されたのです。"}, {"t": 787.4666666666667, "x": "ブライアンは、流れがさかのぼったようだったと"}, {"t": 790.4, "x": "書いています。地質調査所は、これを川底の"}, {"t": 793.5833333333334, "x": "ゆがみでできた波と説明しています。"}, {"t": 795.8166666666667, "x": "上流へ向かう波が、川が逆に流れたように見せたのです。"}, {"t": 799.9833333333333, "x": "水はすぐに引いていきました。"}, {"t": 801.85, "x": "そのとき、岸の若い木々を林ごとなぎ倒しました。"}, {"t": 805.65, "x": "木は、人が切りそろえたように"}, {"t": 807.8, "x": "同じ高さで折れていたそうです。"}, {"t": 809.7166666666667, "x": "岸には取り残された魚がたくさんいました。"}, {"t": 812.55, "x": "川の上は、壊れた舟のかけらでおおわれました。"}, {"t": 816.0, "x": "ある舟では、女性一人と子ども6人が"}, {"t": 818.7833333333333, "x": "亡くなったと伝えられています。"}, {"t": 820.4833333333333, "x": "町にも大きな変化が起きました。"}, {"t": 822.6, "x": "ブライアンによれば、町の土地は"}, {"t": 824.8666666666667, "x": "少なくとも4メートル半沈みました。"}, {"t": 827.2, "x": "地質調査所のまとめでも、町は"}, {"t": 829.65, "x": "この日の揺れで壊れています。"}, {"t": 831.3833333333333, "x": "一方でまわりでは逆のことも起きました。"}, {"t": 833.9666666666667, "x": "川から少し離れた池や沼が、ほとんど干上がったのです。"}, {"t": 837.85, "x": "池の底が、もとの岸より高くなった所もありました。"}, {"t": 841.5333333333333, "x": "その差は、3メートルから6メートルほどです。"}, {"t": 844.6833333333333, "x": "同じ一晩で、沈んだ土地と上がった土地ができたのです。"}, {"t": 848.4666666666667, "x": "この地震は、リールフット断層で"}, {"t": 850.9833333333333, "x": "起きたと考えられています。"}, {"t": 852.6, "x": "地下に隠れた断層で、地上からは見えにくいものです。"}, {"t": 856.4333333333333, "x": "規模は、マグニチュード7.5ほどとされます。"}, {"t": 859.55, "x": "3回のうちで最大と見る研究者が多い揺れです。"}, {"t": 862.9666666666667, "x": "ブライアンの手紙には、もう一つ大事なことがあります。"}, {"t": 866.5333333333333, "x": "川の向こう岸に湖ができたというのです。"}, {"t": 869.4166666666666, "x": "町から見て東の岸、いまのテネシー州の側です。"}, {"t": 873.2666666666667, "x": "当時は先住民の土地とされていた側でした。"}, {"t": 876.2, "x": "彼女が聞いた話では、湖の長さは160キロ以上です。"}, {"t": 880.7833333333333, "x": "幅は2キロから10キロほどです。"}, {"t": 882.9333333333333, "x": "深さは3メートルから15メートルです。"}, {"t": 885.55, "x": "ただし、彼女が自分ではかった数字ではありません。"}, {"t": 889.2666666666667, "x": "人から伝え聞いた大きさです。"}, {"t": 891.35, "x": "いまの地図で同 {"t": 1011.2666666666667, "x": "中心は、町の南のリトルプレーリーの村です。"}, {"t": 1014.75, "x": "そこから見て、まわりの長さが240キロを"}, {"t": 1018.1333333333333, "x": "こえない範囲だったといいます。"}, {"t": 1019.8666666666667, "x": "ブランジエの手紙では、揺れを"}, {"t": 1021.9833333333333, "x": "感じた土地はもっと広く書かれています。"}, {"t": 1024.4333333333334, "x": "町のまわり320キロにわたって揺れた、というのです。"}, {"t": 1028.4333333333334, "x": "地面が裂けた範囲と、揺れを感じた範囲は違います。"}, {"t": 1032.25, "x": "裂けたのは、川ぞいの低地にかぎられていました。"}, {"t": 1035.5666666666666, "x": "ル・シュールは、こうも書いています。"}, {"t": 1037.9166666666667, "x": "高い土地が沈んで湖になった。"}, {"t": 1040.1833333333334, "x": "深い湖が干上がって乾いた土地になった。"}, {"t": 1042.95, "x": "そして、その多くはいま畑になっている、と。"}, {"t": 1046.7, "x": "1871年の時点で、変わり果てた土地は"}, {"t": 1050.4833333333333, "x": "すでに耕されていたのです。"}, {"t": 1052.1833333333334, "x": "これほどの揺れで、何人が亡くなったのでしょうか。"}, {"t": 1055.4833333333333, "x": "地質調査所のまとめでは、町で亡くなったのは一人です。"}, {"t": 1059.2333333333333, "x": "建物の下敷きになった人です。"}, {"t": 1061.3666666666666, "x": "ル・シュールの手紙では、町の死者は二人です。"}, {"t": 1064.4666666666667, "x": "どちらも女性でした。一人は恐怖のあまり亡くなりました。"}, {"t": 1068.25, "x": "もう一人は、落ちてきた丸太でけがをしました。"}, {"t": 1071.4333333333334, "x": "そのけがで亡くなったといいます。"}, {"t": 1073.4, "x": "死者がこれほど少ないのは驚くべきことだ、と"}, {"t": 1076.4833333333333, "x": "彼は書いています。人がまばらな土地だったことも、"}, {"t": 1079.4666666666667, "x": "関わっていたと考えられます。"}, {"t": 1081.6166666666666, "x": "けれども川の上は違いました。"}, {"t": 1083.6666666666667, "x": "平底舟の乗り手の多くが亡くなったにちがいない。"}, {"t": 1086.7, "x": "ル・シュールはそう書いています。"}, {"t": 1088.4833333333333, "x": "小麦粉や酒の樽が、大量に流れていたからです。"}, {"t": 1092.1666666666667, "x": "テネシーからアーカンソーへ引っ越す一家もいました。"}, {"t": 1095.2, "x": "妻と7人の子どもと雇い人が、舟から投げ出されました。"}, {"t": 1099.25, "x": "助かったのは父親一人だけでした。"}, {"t": 1101.5833333333333, "x": "グラスコックという男の一家も、全員が亡くなりました。"}, {"t": 1105.4166666666667, "x": "6人か8人の家族です。16番島と"}, {"t": 1107.95, "x": "呼ばれる中州のあたりでした。"}, {"t": 1110.1666666666667, "x": "舟がひっくり返ったと考えられています。"}, {"t": 1112.8833333333334, "x": "川を下る舟に名簿はありません。"}, {"t": 1115.1333333333334, "x": "誰が何人乗っていたのか、記録がないのです。"}, {"t": 1118.3333333333333, "x": "だから死者の数は、いまも一つに決まっていま                                           :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
